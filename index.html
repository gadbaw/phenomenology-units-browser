ectively Dominant Object Relations Using the Three Channels of Communication Clinical Illustration 1 : Affectively Dominant Object (continued) Relations in the Transference With Role Reversal—Ms. P Ms. P—the 23-year-old student organized at a middle borderline level, with a diagnosis of borderline personality disorder with sadomasochistic traits and a history of DUI—had settled into her treatment with Dr."}, {"id": 886, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 142, "loc": "clinician", "int": 0.7, "aff": "unsympathetic", "au": "Caligor et al. (TFP-E)", "pt": "Mr. G", "pg": 22, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "Y noted a marked absence of sympathetic feeling toward Mr. G in the moment; she found it difficult to empathize with his frustration or with his underlying sense of humiliation. In fact, as she listened to Mr. G’s complaints, Dr."}, {"id": 887, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 154, "loc": "patient", "int": 0.55, "aff": "conditional, precarious", "au": "Caligor et al. (TFP-E)", "pt": "Ms. L", "pg": 23, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "Exploration of her conscious motivations for her behavior resulted in discussion for the first time of Ms. L’s general sense, in virtually all relationships, that her status was conditional; she accommodated others because she believed herself to be in constant risk of being cast out. She went on to explain that even in her family, she felt this way, much as she knew she was loved. She linked this chronic self state to her early years, when she was separated from her parents and lived with her grandparents."}, {"id": 888, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 161, "loc": "patient", "int": 0.5, "aff": "anxious, self-conscious", "au": "Caligor et al. (TFP-E)", "pt": "Ms. S", "pg": 24, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "In session, she described her familiar anxiety before giving a talk, anticipating that she would sound ridiculous and make a fool of herself. She added that her anxiety had recently begun to relate to her appearance as well. After a pause, Ms. S commented that she had bought some expensive clothes for herself."}, {"id": 889, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 162, "loc": "patient", "int": 0.6, "aff": "ridiculous, frumpy", "au": "Caligor et al. (TFP-E)", "pt": "Ms. S", "pg": 24, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "She had done it on an impulse; never previously had she done anything like this. In the store, she thought the clothes looked great, but when she put them on at home and looked in the mirror, she felt she looked ridiculous; such beautiful garments should be worn by a more attractive, younger woman, not a frumpy old lady like her. She then noted that she hadn’t had a chance to tell Dr. C about her recent talk in another city."}, {"id": 890, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 166, "loc": "clinician", "int": 0.6, "aff": "happy, proud", "au": "Caligor et al. (TFP-E)", "pt": "Ms. S", "pg": 24, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "C felt happy for the patient and proud, with a sense that Ms. S was coming into her own. In reflecting on the clinical material, Dr. C noted to herself that Ms."}, {"id": 891, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 173, "loc": "none", "int": 0.1, "aff": "theoretical", "au": "Caligor et al. (TFP-E)", "pt": "Ms. S", "pg": 25, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "Expressed in Ms. S’s narrative and associations is a central conflict, associated with a series of defenses, anxieties, and conflictual wishes slowly emerging in the clinical material. Dr. C also hears a clear and stable layering of the relevant object relations, pointing both to the familiar, defensive object relation, and to the patient’s newer, higher conflictual sense of herself emerging in the treatment and linked to anxiety."}, {"id": 892, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 202, "loc": "patient", "int": 0.5, "aff": "paralyzed, sad", "au": "Caligor et al. (TFP-E)", "pt": "unnamed", "pg": 31, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "For example, the therapist might say: “It sounds like you feel sad, almost like a child who has been cast out of his family because he didn’t try hard enough, wasn’t good enough, while it seems as if in your eyes, at this moment, Julia is merely doing what she has to do. Does this sound accurate?” Clinical Illustration 2: Clarification With a High-BPO Patient Ms. J: I’ve been getting into work late. In the mornings, I’m paralyzed."}, {"id": 893, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 210, "loc": "patient", "int": 0.55, "aff": "paralyzed, compelled", "au": "Caligor et al. (TFP-E)", "pt": "Ms. J", "pg": 31, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "C went on to say, “What strikes me is that Hal’s telling you what to do seems to leave you feeling paralyzed or in slow motion, as if something is forcing you to get to work late and make him mad. Is that how it feels on the inside?” Ms. J responded, “Yes, exactly. I know it sounds kind of crazy. . . ."}, {"id": 894, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 213, "loc": "clinician", "int": 0.4, "aff": "inhibited, pressured", "au": "Caligor et al. (TFP-E)", "pt": "none", "pg": 32, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "The risk is that the therapist will feel inhibited in relation to asking for clarification—a countertransference pressure that the therapist should resist, because it is important that the TFP-E therapist feel free to ask for clarification whenever she is unclear about the patient’s communications. In the event that the patient responds negatively to requests for clarification, the clinical focus shifts to the patient’s experience of the therapist in the moment—that is, to clarification and exploration of the object relations currently activated in the transference. Clinical Illustration 3: A High-BPO Patient Responds to Requests for Clarification A high-BPO patient with narcissistic personality disorder responded with irritation to his therapist’s repeated request for clarification in relation to his vague and somewhat evasive description of his extramarital escapades. The patient responded with a hostile outburst: “We just went over this!"}, {"id": 895, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 224, "loc": "none", "int": 0.05, "aff": "didactic", "au": "Caligor et al. (TFP-E)", "pt": "none", "pg": 34, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "Confrontations draw the patient’s attention to attitudes, ideas, and behaviors that are fully conscious (or in the case of behavior, fully observable), assumed by the patient to be perfectly natural in and of themselves (i.e., they are ego-syntonic, rationalized, or denied), but that are discrepant with other attitudes, ideas, or behaviors of the patient. In confrontation, the therapist calls the patient’s attention to something that is evident but that defensively the patient is not attending to or is denying the significance of. As we illustrate in the vignettes that follow, confrontation promotes self-awareness by focusing on habitual, defensive ways of thinking, feeling, and behaving that are ego-syntonic and making them ego-dystonic—observable, and in some sense remarkable, to the patient—calling for further understanding. The following are examples of confrontation: Therapist: You’ve told me many times that you wish you were able to get more attention from men."}, {"id": 896, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 258, "loc": "clinician", "int": 0.5, "aff": "guilty, worried", "au": "Caligor et al. (TFP-E)", "pt": "Mr. Y", "pg": 38, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "B felt vaguely guilty and worried that he had perhaps pushed Mr. Y too soon. Comments: In this vignette, the therapist, after clarifying Mr. Y’s current experience of himself in relation to the marriage, contrasts that view with a very different view of the marriage that Mr."}, {"id": 897, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 263, "loc": "patient", "int": 0.4, "aff": "paralyzed, resentful", "au": "Caligor et al. (TFP-E)", "pt": "Ms. J", "pg": 39, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "The eventual focus on interpretation proper will involve an exploration of personal meanings and unconscious motives. Clinical Illustration 2 : Confrontation With a High-(continued) BPO Patient We return to Ms. J, the patient who had been describing her current difficulty getting to work in the setting of struggles with her boss. As a result of a process of ongoing clarification, what had emerged was that the patient was feeling “paralyzed” by her resentment in relation to her supervisor, Hal, whom she viewed as bossing her around and treating her dismissively."}, {"id": 898, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 284, "loc": "none", "int": 0.05, "aff": "theoretical", "au": "Caligor et al. (TFP-E)", "pt": "none", "pg": 42, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "Whereas clarification and confrontation focus on conscious and preconscious material, interpretation involves bringing to the patient’s awareness aspects of his inner life that are unconscious , actively defended against and inaccessible to consciousness because they are in some way anxiety provoking or unacceptable to the patient ( ). Because interpretationAuchincloss and Samberg 2012 explores the personal motivating the patient’s behavior and organizing his internalmeanings experience, the patient’s capacity to make use of this final level of intervention in the interpretive process is predicated on his capacity to observe and reflect on his internal experience, and to be curious about the nature of that experience ( ). An interpretation helps the patient makeLaFarge 2000 sense of his experience and behavior, deepening his understanding of his inner life, with the longerterm objective of helping him to gain greater perspective on, and to more effectively contain and contextualize, conflictual aspects of experience. (See Chapters 12 and 13 on working through.) The following are examples of confrontation: Therapist: You’ve told me many times that you wish you were able to get more attention from men and that you think of yourself as undesirable [ ]. Yet when John, a man youa defensive self representation have just met and found attractive, texted you this morning, rather than being pleased and inferring that he might want to ask you out, you assumed he couldn’t possibly be interested in you and instead merely wanted your girlfriend’s number [ ]."}, {"id": 899, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 287, "loc": "patient", "int": 0.5, "aff": "hopeless, despairing", "au": "Caligor et al. (TFP-E)", "pt": "Ms. J", "pg": 42, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "Does whatinterpretation I am saying ring at all true? Therapist: You seem very comfortable here today and optimistic about our work together. Yet I wonder if you can recall how you felt last time you were here: hopeless and despairing, that this is the wrong treatment approach for you, and that things will never improve in your life. In fact, at one point you said things felt so bad that you were considering suicide."}, {"id": 900, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 288, "loc": "patient", "int": 0.4, "aff": "dismissive deflection", "au": "Caligor et al. (TFP-E)", "pt": "Ms. J", "pg": 42, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "Patient: I hadn’t been thinking about it, but yes, I was quite down. But I’m feeling much better now. It isn’ t really important how I felt last time. It’s over—no need to dwell on it now."}, {"id": 901, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 295, "loc": "clinician", "int": 0.6, "aff": "vague guilt", "au": "Caligor et al. (TFP-E)", "pt": "Mr. Y", "pg": 43, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "In his associations, Mr. Y found himself wondering about the strength of his longtime friendships and questioning whether people would stand by him. In the countertransference, Dr. B felt vaguely guilty, worrying that he had perhaps pushed Mr."}, {"id": 902, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 305, "loc": "patient", "int": 0.3, "aff": "self-deficient", "au": "Caligor et al. (TFP-E)", "pt": "Mr. Y", "pg": 44, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "B, he thought what he was saying made sense; he did feel that he had been “holding on” at some level. In the sessions that followed, Mr. Y continued to work through the ending of the marriage and the breakup of his family. His persistent tendency to focus on his own deficiencies and to place Julia in a maternal, relatively powerful position was an ongoing focus of attention."}, {"id": 903, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 309, "loc": "patient", "int": 0.5, "aff": "frustrated shame", "au": "Caligor et al. (TFP-E)", "pt": "Mr. Y", "pg": 44, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "As we’ve discussed, at those moments, your view of yourself shifts; you suddenly become little, childlike, and deficient, overwhelmed by the feeling that everything is your fault.” This restatement of material that had been clarified served to highlight and confront the defensive object relation. Mr. Y responded by sharing his frustration: “Yes, it’s weird, I know, and also frustrating. It makes it difficult to act like an adult."}, {"id": 904, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 331, "loc": "patient", "int": 0.5, "aff": "resentful paralysis", "au": "Caligor et al. (TFP-E)", "pt": "Ms. J", "pg": 46, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "J, who had entered a downward spiral at work, feeling paralyzed by her resentment of her boss. Dr. C confronted her radically contradictory, dissociated views in relation to her workplace—namely, the fact that her current images of her boss, herself as a worker, and her workplace in general were all negative, whereas until recently, all had been exceptionally and entirely positive. Dr."}, {"id": 905, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 350, "loc": "none", "int": 0.2, "aff": "interpretive", "au": "Caligor et al. (TFP-E)", "pt": "Ms. J", "pg": 47, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "J indicated that she was. “Well, you’ve made clear that when things fall apart, it feels really, really bad, so you would think you’d give this whole thing up and find a middle ground where you wouldn’t have to go so low. But you haven’t, so there must be something that leads you to perpetuate this pattern. One thought I’ve had is that it may be about trying to hold on to that very special feeling that comes with a positive relationship—for example, how you felt in the beginning with Hal or with Brian, when everything seemed so wonderful and you were perfectly happy in yourself."}, {"id": 906, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 466, "loc": "dyadic", "int": 0.5, "aff": "detached mismatch", "au": "Caligor et al. (TFP-E)", "pt": "Ms. H", "pg": 62, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "B decided to address the object relation enacted in the transference-countertransference by focusing on Ms. H’s behavior and attitude in the session, and on the contrast between the ongoing crisis in her life and her talking about furnishings in her therapy. “I’m struck by your attitude here today,” he began. “You seem relaxed, unconcerned, even detached—speaking about apartment hunting and conveying no sense of urgency with regard to the problems that bring you here.” Ms."}, {"id": 907, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 484, "loc": "patient", "int": 0.4, "aff": "anxious pleasure", "au": "Caligor et al. (TFP-E)", "pt": "Ms. H", "pg": 63, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "Dr. C continued, “But I also hear you introducing a new sense of yourself, one that perhaps is colored with some anxiety. In this view, you are someone enjoying the limelight . . . pleased about being admired by desirable people. This view is associated with feelings of power and pleasure.” Ms."}, {"id": 908, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 541, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Caligor et al. (TFP-E)", "pt": "none", "pg": 72, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "Ego-Dystonicity and the Interpretive Process At those times when patient and therapist working from a shared view of reality and the patient isare making a distinction between internal and external reality, the therapist turns his attention to interpretation and to the matter of . In the treatment of personality pathology, theego-dystonicity therapist focuses on behaviors, thoughts, and feelings that are familiar to and accepted by the patient— that is, those that are ego-syntonic. It is only when these habitual thoughts, feelings, and behaviors become ego- , somewhat foreign to or noticeable by the patient, and are associated withdystonic anxiety or met with confusion (e.g., see , Clinical Illustration 1 [ ], “InterpretationChapter 10 continued With an NPO Patient,” in the subsection “Interpretation and Severity of Pathology”) that interpretation is likely to be effective in promoting integrative processes. Toward this end, the therapist will repeatedly call attention to ego-syntonic ways of thinking, feeling, and behaving that are maladaptive or in some way problematic."}, {"id": 909, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 542, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Caligor et al. (TFP-E)", "pt": "none", "pg": 72, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "The process of repeated clarification and, in particular, confrontation helps patients experience familiar, habitual, and ego-syntonic patterns of behavior, thinking, and feeling as ego-dystonic personality traits. (This process overlaps with the process of addressing concrete thinking, illustrated earlier in Part 2 of this chapter.) As habitual patterns of behaving, thinking, and feeling become egodystonic, the object relations embedded in and organizing personality traits become less effective in their defensive functions. At this point, underlying conflicts become accessible not only to interpretation proper, but also to exploration of underlying motivations and personal meanings. Thus, before introducing an interpretation, the therapist looks for evidence that defenses have become egodystonic and that underlying anxieties and conflicts are beginning to be accessible to the patient (e.g., see , Clinical Illustration 1 [ ], “Interpretation With an NPO Patient”).Chapter 10 continued Clinical Illustration 9: Ego-Dystonicity in an NPO Patient Ms. N was the young woman with hysterical personality traits and sexual inhibitions who functioned at a neurotic level of personality organization, described previously in Clinical Illustration 1, ;Chapter 2 and Clinical Illustration 2, ."}, {"id": 910, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 543, "loc": "patient", "int": 0.3, "aff": "unmoved interest", "au": "Caligor et al. (TFP-E)", "pt": "unnamed", "pg": 72, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "She experienced herself as unattractive to men, even though sheChapter 7 was objectively both personally appealing and extremely attractive. Initially, her therapist attempted to make what proved to be premature, albeit accurate, interpretations of underlying dynamics, having to do with guilt in relation to competition and conflictual wishes to be the center of attention, experienced unconsciously by the patient as aggressive transgressions. These interpretations were of interest to the patient, and she felt they rang true, but they appeared to have little if any impact on her sense of herself or on her behavior. Recognizing that his response to this well-integrated patient had been to assume incorrectly that she could quickly benefit from interpretations of meanings and motivations, the therapist shifted his approach to emphasize more basic interventions."}, {"id": 911, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 556, "loc": "patient", "int": 0.7, "aff": "paranoid contempt", "au": "Caligor et al. (TFP-E)", "pt": "Mr. E", "pg": 74, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "The patient explained that he found it difficult to understand how and why the therapist remained patient with him since he, Mr. E, consistently failed to modify his behavior in response to the therapist’s comments. But, Mr. E went on to explain, he felt better now because he had come to understand; he now realized that the therapist was simply exploiting him, that the therapist didn’t care about the treatment or about the patient, but was happy to just play along, pretend that he cared, and get paid."}, {"id": 912, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 624, "loc": "clinician", "int": 0.5, "aff": "emptiness, noticing", "au": "Caligor et al. (TFP-E)", "pt": "Mr. X", "pg": 84, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "Y noticed that things had started to feel empty in Mr. X’s sessions, and at the same time, Dr. Y realized that she had not heard from Mr. X’s medical team for several months."}, {"id": 913, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 625, "loc": "clinician", "int": 0.7, "aff": "alarmed, anxious", "au": "Caligor et al. (TFP-E)", "pt": "Mr. X", "pg": 84, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "X responded that he had been busy and unable to get to the doctor, but that “everything is fine.” Dr. Y was alarmed, concerned about the possibility that Mr. X’s blood pressure was or would become dangerously out of control. She recognized that her anxiety was distracting her from thinking clearly and neutrally about the object relations organizing Mr."}, {"id": 914, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 675, "loc": "none", "int": 0.2, "aff": "explanatory", "au": "Caligor et al. (TFP-E)", "pt": "Ms. W", "pg": 88, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "P felt he could reinstate neutrality. He pointed out to Ms. W that in asking her to change her plans, he had stepped out of his usual role of helping her to make her own choices while abstaining from advising or telling her what to do. He commented that he had done so because he felt she had left him no alternative; she had been knowingly exposing her child to danger and did not seem concerned."}, {"id": 915, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 714, "loc": "clinician", "int": 0.7, "aff": "swept-up excitement", "au": "Caligor et al. (TFP-E)", "pt": "Ms. O", "pg": 93, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "Initially, Dr. T (several years younger than her patient) was swept up in Ms. O’s mood, feeling excited herself and wanting to laugh along with her patient. (This is an example of concordant in the countertransference; see .) However, as Dr. T continued to sit with Ms."}, {"id": 916, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 716, "loc": "clinician", "int": 0.6, "aff": "diminished, envious", "au": "Caligor et al. (TFP-E)", "pt": "Ms. O", "pg": 94, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "she herself would never have. (This is an example of in thecomplementary identification countertransference; see .)Chapter 5 Reflecting on her own responses to her patient’s verbal and nonverbal communications, Dr. T identified an object relation of an excited person who “has it all” and an excluded and inferior person who feels envious. Thinking about it further, Dr. T was struck by how exaggeratedly diminished she had been feeling."}, {"id": 917, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 732, "loc": "none", "int": 0.2, "aff": "hypothetical", "au": "Caligor et al. (TFP-E)", "pt": "Ms. O", "pg": 95, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "O’s grandiose defenses might have led Dr. T either to feel diminished and demoralized or to be drawn into joining Ms. O in her grandiose excitement. Either of these reactions on the part of Dr."}, {"id": 918, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 737, "loc": "clinician", "int": 0.7, "aff": "mounting anxiety", "au": "Caligor et al. (TFP-E)", "pt": "Ms. W", "pg": 95, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "P recognized that he was becoming increasingly anxious about the safety of Ms. W’s child. Even though Dr. P tried reminding himself that in the end, Ms."}, {"id": 919, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 740, "loc": "clinician", "int": 0.8, "aff": "worn, preoccupied", "au": "Caligor et al. (TFP-E)", "pt": "Ms. W", "pg": 96, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "Over a weekend when Dr. P was feeling especially worn out and burdened by personal difficulties, he found himself particularly uncomfortable and preoccupied about Ms. W. Impulsively, on Sunday morning, he called Ms."}, {"id": 920, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 759, "loc": "none", "int": 0.2, "aff": "technique", "au": "Caligor et al. (TFP-E)", "pt": "Ms. W", "pg": 98, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "P would neither share his discomfort as a venue for deepening Ms. W’s understanding of herself and her world, nor assume the position of an expert telling Ms. W what to do (unless he was forced to deviate from neutrality); rather, he would use his discomfort to ask himself, “Why am I uncomfortable? Would a normal or average person find this to be a dangerous and anxiety-provoking situation?” He would then use his internal dialogue to confront the patient’s denial of an evident reality—the danger to her child—that part of her must have fully appreciated but that she chose to ignore."}, {"id": 921, "tr": "structural_kernberg", "doc": "FT 3a. Brightman - Narcissistic Transformation", "pos": 1, "loc": "none", "int": 0.0, "aff": "abstract", "au": "Brightman", "pt": "none", "pg": 1, "pdf": "", "ppg": 1, "pcf": 1.0, "txt": "Lecturer on Psychology, Department of Psychiatry, Harvard Medical School This paper is an attempt to discuss some aspects of the development of the professional self-image and related efforts to maintain self-esteem of the student psychotherapist which appear to be generic to the first formal year of clinical training. The phenomenology of training, in particular the changing representations of the professional self and the relationships with supervisors, patients and peers, is explored within the context of the clinical study of narcissism. A central affective issue in training which this paper ' attempts to investigate is the emer e . . in and recove from a si!mificant de ressive ex enence ocused around the sense of hel lessness and ho eless 'achievin core profeSSIOn asprranons. The impact of a process of mourning on the supervisory and treatment enterprises is discussed."}, {"id": 922, "tr": "structural_kernberg", "doc": "FT 3a. Brightman - Narcissistic Transformation", "pos": 13, "loc": "none", "int": 0.3, "aff": "despairing nihilism", "au": "Brightman", "pt": "none", "pg": 4, "pdf": "", "ppg": 4, "pcf": 1.0, "txt": "When the attainment of the idealized professional self-image is threatened in the course cif the clinical year, the trainee may attempt to revert to the value system of previous academic experience, particularly if it valued the scientist over the practitioner. In such a case, one's personal sense of doubt, paral sis of will and des air rna be masked by a more acceptable form of thera eutic nihilism which is attributed to the well-known ac 0 re evant research in e area. Here, one's feelings of impotence and confusion are then due to the absence of adequate conditions or the unavailability of \"suitable subjects\" and one's inability to make clinical decisions or take therapeutic action becomes evidence of one's commitment to scientiflc conservation and accountability (\"We just don't know enough in this case.\") The price of the trainee's narcissistic balance in this case is the loss for his patients of a committed, active and emotionally available therapist. • • J"}, {"id": 923, "tr": "structural_kernberg", "doc": "FT 3a. Brightman - Narcissistic Transformation", "pos": 25, "loc": "none", "int": 0.2, "aff": "theoretical mourning", "au": "Brightman", "pt": "none", "pg": 8, "pdf": "", "ppg": 8, "pcf": 1.0, "txt": "Page 8 restitutive mechanisms dealing with despair around the loss of the idealized professional self-image are similar in that they do not involve any significant degree of mourning or modification of that idealized image (the impact of this failure to adequately grieve on the learning and practice of psychotherapy will be discussed later.) In order to altogether relinquish the goal of being a good therapist, however that is defined subjectively, one must in fact leave the field, and the fourth restitutive mechanism refers in this case to a temporary or permanent giving up of the practice of psychotherapy. Individuals who leave training around their professional despair experience a temporary relief of depression. but thereby abort the developmental process of as a therapist. It is the fifth J;1athway. where \"the narcissistically important goals ... become sufficiently modified or reduced to become realizable\" that most closely corresponds to the classical notion of mourning, and which would appear to represent the most stable restitutive p'rocess. Specifically, this would entail a modification of the idealized professional selfimage of the omniscient, benevolent and omnipotent therapist to a more moderate and attainable professional ego-ideal: a therapist who has some expertise which is limited by the state of the art, one's own stage of professional development, and the patient's capacity to communicate and form an alliance around the work; one who feels concern and caring, as well as the full range of human emotion, and attempts to use them in the service of being therapeutic; and one who has sufficient strength of character to provide a degree of security and support but who cannot make decisions for or changes in the patient."}, {"id": 924, "tr": "structural_kernberg", "doc": "FT 3a. Brightman - Narcissistic Transformation", "pos": 29, "loc": "none", "int": 0.2, "aff": "theoretical", "au": "Brightman", "pt": "none", "pg": 9, "pdf": "", "ppg": 9, "pcf": 1.0, "txt": ", . ./. ,.. \\ Page 9 to the strucrural deficits of the personality. Relatedness here consists mainly of a struggle to maneuver the object into a parasitically complementary position and to control and hold it there, Rather than of a true interchange between two clearly differentiated personalities. It will be argued here that to the deWle that the psychotherapist has failed to undergo the above process of mournin and modification of the idealized rofessional self-ima e, he or she arnCI ate 111 su i n and thera more as arenas 111 w IC . to ward off n¥cissistic trauma, and less as settings in which to teach the se an treat e other. For the very processes which must occur for supervision and treatment to progress are antithetical in spirit to those which serve to preserve the self-image of the all-knowing, allloving, and all-powerful therapist In su ervision, one must gra Ie with one's i norance one's frustration and one's sense of impotence 111 or er to come to a better understanding of treatment and concern for the p'atient."}, {"id": 925, "tr": "structural_kernberg", "doc": "FT 3a. Brightman - Narcissistic Transformation", "pos": 34, "loc": "clinician", "int": 0.5, "aff": "narcissistic strain", "au": "Brightman", "pt": "none", "pg": 10, "pdf": "", "ppg": 10, "pcf": 1.0, "txt": "Page 10 failure of empathy as the accurate perception of the object. Under these , conditions, the patient's behavior and experience are perceived mainly in te=s of their impact upon one's own narcissistic equilibrium. one's idealized image as the loved and all-providing therapist requires bolstering by admiration and confirmation, one will act to block the expression of feelings of the neediness and disappointed rage which the patient may need to contact in order to move beyond a false-self adaptationXJI one's idealized professional self-image is that of the bottomless cup of oral supplies, one may be unable to introduce the optimal levels of frustration and tolerate the inevitable sto= of protest and recrimination required to help a patient increase his belief in the capacity to tolerate separation and lossXJi one's self-esteem as a thera ist de ends u on one's interventions producin evidence of ever eater hel\"hts 0 se aration, inde endence and autonom in one's atients, one rna fail to hear th call f . necess 0 din , structure and ermisslOn or the brie ssi which ma be critical at various oints in a treatme!J.l. To the degree that one's aspirations for omniscience prohibit the exp-erience of ambiguity, doubt and uncertainlY. one will be unable to tolerate the waitings and periods of [ COnfUSiOn involved as the patient struggles toward a new element or perspective, and may * I in.stead lea!, at the opportuni to demonstrate a a f the material and thereb de rive l(. I the patient 0 e rune and space to do his own work."}, {"id": 926, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 103, "loc": "none", "int": 0.1, "aff": "theoretical", "au": "Kernberg", "pt": "none", "pg": 40, "pdf": "", "ppg": 23, "pcf": 1.0, "txt": "Sexual Excitement and Erotic Desire 23 the relations between body protrusions and openings—penis, nipple, tongue, finger, feces on the penetrating or invasive site, and vagina, mouth, anus on the receptive or encompassing site. The erotic gratification promised by the rhythmic stimulation of these body parts decreases or vanishes when the sexual act does not serve the broader unconscious function of fusion with an object. \"Container\" and \"contained\" are not to be confused with masculine and feminine, active and passive; erotic desire includes fantasies of actively incorporating and passively being penetrated, together with actively penetrating and passively being incorporated. I have suggested that psychological bisexuality in the sense of identification with both self and object in the specific sexual interaction is universal for men and women."}, {"id": 927, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 104, "loc": "none", "int": 0.2, "aff": "fusion", "au": "Kernberg", "pt": "none", "pg": 40, "pdf": "", "ppg": 23, "pcf": 1.0, "txt": "One might say that bisexuality is first of all a function of identification with both participants in a sexual relationship, or with all three (the \"excluded third party\") in the triangulation of sexual experience (Liberman 1956). A second characteristic of erotic desire is identification with the partner's sexual excitement and orgasm, in order to enjoy two complementary experiences of fusion. The primary element here is the pleasure derived from the desire of the other, the love expressed in the other's response to the sexual desire of the self, and the associated experience of fusion in ecstasy. There is also the sense of becoming both genders at the same time, of temporarily overcoming the ordinarily unbreachable barrier separating the genders, and the sense of completion and enjoyment of the penetrating and encompassing, penetrated and enclosed aspect of sexual invasion."}, {"id": 928, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 105, "loc": "none", "int": 0.2, "aff": "erotic fusion", "au": "Kernberg", "pt": "none", "pg": 40, "pdf": "", "ppg": 23, "pcf": 1.0, "txt": "In this connection, a symbolic displacement of all \"penetrating\" parts of the anatomy and of all \"encompassing\" or \"penetrable\" openings signals the condensation of eroticism from all zones, an expected regression in sexual excitement to \"zonal confusion\" (Meltzer 1973), and the consequent confluence, in sexual activity or contact, of fantasies and experiences reflecting the entire body surface of both participants. In this identification with the other, there is gratification of the wish for fusion, of homosexual longings, and of oedipal rivalry—by implication, all other relationships disappear in the unique and fused sexual pair. By the same token, unconsciously identifying with both genders eliminates the need to envy the other gender, and, in remaining oneself while becoming the other as well, one has a sense having achieved intersubjective transcendence. A third characteristic of erotic desire is a sense of transgression, of overcoming the prohibition implied in all sexual encounters, a prohibition derived from the oedipal structuring of sexual life."}, {"id": 929, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 109, "loc": "none", "int": 0.3, "aff": "primitive fusion", "au": "Kernberg", "pt": "none", "pg": 41, "pdf": "", "ppg": 24, "pcf": 1.0, "txt": "The intimacy that develops between torturer and tortured and the lasting effects on the psychic experience of both participants may well originate in the most primitive, ordinarily dissociated or repressed awareness of fused, \"all-bad\" relations between self and object, which constitute the counterpart of the split-off \"all-good\" object in the symbiotic stage of development. Erotic desire transforms genital excitement and orgasm into an experience of fusion with the other that provides an ultimate sense of fulfillment, of transcending the limits of the self. This fusion also facilitates, in the experience of orgasm, a sense of oneness with the biological aspects of personal experience. By the same token, however, to be the object of"}, {"id": 930, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 123, "loc": "none", "int": 0.2, "aff": "voyeuristic", "au": "Kernberg", "pt": "none", "pg": 45, "pdf": "", "ppg": 28, "pcf": 1.0, "txt": "Overcoming shamefulness is not the same as humiliation; the desire to humiliate usually includes a third party, a witness to the humiliation, and implies a greater degree of aggression, which threatens the capacity for an exclusive sexual object relation. The voyeuristic impulse to observe a couple in sexual intercourse— the symbolic expression of a wish to violently interrupt the primal scene—is a condensation of the wish to penetrate the privacy and secrecy of the oedipal couple and to take revenge against the teasing mother. Voyeurism is an important component of sexual excitement in the sense that every sexual intimacy implies an element of privacy and secrecy and, as such, an identification with and a potential triumph over the oedipal couple. The many couples who cannot enjoy sex in their own home, in proximity to their children, but only in a secluded area elsewhere illustrate the inhibition of this aspect of sexual intimacy."}, {"id": 931, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 159, "loc": "none", "int": 0.2, "aff": "theoretical", "au": "Kernberg", "pt": "none", "pg": 57, "pdf": "", "ppg": 40, "pcf": 1.0, "txt": "40 Mature Sexual Love of the same person and at the same time represent the integration of the superego at a higher level, including sophisticated capacity for integrating tender and sexual feelings, which reflects the overcoming of the oedipal conflict. In this establishment of identification with the values of the love object, a transcendence is achieved from the interrelationship of the couple to a relationship with their cultural and social background. The experiences of the past, the present, and the imagined future are linked through the experience of the present relationship with the love object. Commitment and Passion Passion in the realm of sexual love is, I propose, an emotional state that expresses the crossing of boundaries, in the sense of bridging intrapsychic structures that are separated by dynamically or conflictually determined boundaries."}, {"id": 932, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 162, "loc": "none", "int": 0.3, "aff": "passionate", "au": "Kernberg", "pt": "none", "pg": 58, "pdf": "", "ppg": 41, "pcf": 1.0, "txt": "Mature Sexual Love 41 fuse excitement connected with merger experiences and fantasies in the pregenital phase of symbiotic attachment. Clinical experience demonstrates that the affective quality of orgasm varies widely and, particularly in patients with severe narcissistic pathology and significant deterioration of internalized object relations, is often dramatically reduced so that orgasm provides a sense of frustration as well as relief. In passionate love, the orgastic experience is maximal, and it is here that we may examine the significance of the experience for the individual and for the couple. In passionate love, orgasm integrates the simultaneous crossing of the boundary of the self into awareness of biological functioning beyond the control of the self, and the crossing of boundaries in a sophisticated identification with the loved object while maintaining the sense of separate identity."}, {"id": 933, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 177, "loc": "patient", "int": 0.6, "aff": "longing oneness", "au": "Kernberg", "pt": "unnamed", "pg": 61, "pdf": "", "ppg": 44, "pcf": 1.0, "txt": "The sense of erotic desire had become fused with the sense of oneness, of longing for and yet closeness to the woman he loved, and through that oneness and love he had been permitted entrance into the transcendent world of beauty. At the same time, he had a"}, {"id": 934, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 191, "loc": "none", "int": 0.1, "aff": "theoretical", "au": "Kernberg", "pt": "none", "pg": 66, "pdf": "", "ppg": 49, "pcf": 1.0, "txt": "This fixation will interfere with full genital identity, with the internalization of the father into the ego ideal, and will foster the repression of excessive castration anxiety. For these men, unresolved competition with father and the defensive denial of castration anxiety are expressed in narcissistic enjoyment of infantile dependent relations with women, representing mother images. This constellation, for Braunschweig and Fain as well as for ChasseguetSmirgel (1973, 1974), is an important origin of narcissistic fixation (I would say, fixation at a level of normal infantile narcissism) and lack of normal resolution of the oedipal complex in boys, and is fostered by those aspects of mother's behavior by which she rebels against the \"predominance\" of the paternal penis and the \"paternal law\" in general. The implication is that an unconscious collusion exists between eternally little boys—Don Juans—and seductive maternal women, who utilize the rebelliousness of the Don Juan against father's \"law and order\" to express their own competitiveness with and rebelliousness against the father."}, {"id": 935, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 204, "loc": "none", "int": 0.2, "aff": "guilt", "au": "Kernberg", "pt": "none", "pg": 70, "pdf": "", "ppg": 53, "pcf": 1.0, "txt": "Clinical experience reveals how guilt-ridden men feel when they decide to terminate a relationship with a woman, whereas women usually feel free in letting a man know when they do not love him. This difference probably reflects men's deep-seated guilt over aggression toward mother, which is so frequently reenacted in their relationships with women (Edith Jacobson, personal communication). But in women, unconscious guilt because of the pregenital and genital mother's fantasied prohibitions against vaginal genitality requires a fully erotic, genital affirmation in the sexual relation with a man. The condensation of sadistic superego forerunners related to the introjection of primitive, preoedipal maternal images with the later, prohibitive aspects of the oedipal mother may be one factor contributing to the great frequency of genital inhibitions in women."}, {"id": 936, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 216, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Kernberg", "pt": "Maude", "pg": 74, "pdf": "", "ppg": 57, "pcf": 1.0, "txt": "He appears to be a man of commitment and consistency, but underneath he is afraid to commit himself to a full although uncertain relationship with a woman who is his equal. And Maude, with all her charm and talent and capacity for personal fulfillment, is unable to recognize that Jean-Louis will not give her anything because he is afraid and unable to do so; after rejecting Jean-Louis' friend Vidal, who does love her, she enters into yet another unsatisfactory marriage to still another man. The tragedy is one of lost opportunities—counterparts to the potential happiness and fulfillment of a stable love relation or marriage within which both partners are able to transcend the unconsciously determined dangers to their relationship. Falling in Love and Becoming a Couple The capacity to fall in love is a basic pillar of the relationship of the couple."}, {"id": 937, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 273, "loc": "patient", "int": 0.6, "aff": "oral dissatisfaction", "au": "Kernberg", "pt": "unnamed", "pg": 89, "pdf": "", "ppg": 72, "pcf": 1.0, "txt": "But the fact that a woman should then try to continue to be dependent on him evoked fear that she would want to rob him of what he had to give. Yet, in the midst of his desperate search for gratification of erotic longings to replace his need for love, the patient sensed his growing dissatisfaction and at one point became aware that he was actually searching for a relation with a person \"underneath\" the skin of a woman. It was only by systematic examination of his oral demandingness, of his long-lasting dissatisfaction in the transference, that the patient recognized his tendency to unconsciously spoil and destroy what he most"}, {"id": 938, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 276, "loc": "patient", "int": 0.8, "aff": "grateful awe", "au": "Kernberg", "pt": "unnamed", "pg": 90, "pdf": "", "ppg": 73, "pcf": 1.0, "txt": "He described it as almost a religious feeling, a sense of overwhelming gratitude, humility, and enjoyment in finding her body and her person at the same time. He was now able to express this gratitude in the form of physical intimacy while experiencing her body (now representing her total person rather than a part object) with new excitement. In short, the patient was now able to experience romantic love linked with sexual passion for the woman he had been married to for more than two years. His sexual life left him fully satisfied—a contrast to his old pattern of rapid disappointment and an immediate search for a new woman."}, {"id": 939, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 279, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Kernberg", "pt": "none", "pg": 91, "pdf": "", "ppg": 74, "pcf": 1.0, "txt": "74 Psychopathology ual excitement and sexual promiscuity linked with an incapacity for establishing a more permanent relationship; still milder cases show a limited capacity for transitory infatuation. Transitory infatuations may represent the beginning of a capacity for falling in love, but with idealization limited to the cherished physical sexual attributes of the women to be conquered. What these patients are not able to achieve, however, is the idealization characteristic of falling in love, when female genitality as well as the individual woman is idealized and gratitude for her love and concern for her as a person develop into the capacity for a more stable relation. The sense of fulfillment that goes with falling in love is lost for the narcissistic personality; at most, he may have a fleeting sense of fulfillment at having achieved a conquest."}, {"id": 940, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 292, "loc": "patient", "int": 0.5, "aff": "emerging desire", "au": "Kernberg", "pt": "unnamed", "pg": 94, "pdf": "", "ppg": 77, "pcf": 1.0, "txt": "These character traits now appeared to represent a reaction formation against sexual feelings of any kind; they also represented a quiet, stubborn protest against the \"excited\" and disorderly, overpowering mother. Finally, they represented his aspiration to be a neat little boy who would be loved by father at the price of renouncing his competitiveness with father and with men in general. In the fourth year of his psychoanalysis, the patient began, for the first time, to feel erotic desire for his fiancee. Previously, when he had found her attractive, she represented the idealized, pure, unavailable woman—a counterpart of the sexually exciting but repulsive mother image."}, {"id": 941, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 297, "loc": "patient", "int": 0.7, "aff": "moved recognition", "au": "Kernberg", "pt": "unnamed", "pg": 95, "pdf": "", "ppg": 78, "pcf": 1.0, "txt": "It was dramatic to observe how his attitude to religion changed and how he now began to perceive Jesus as not so much concerned with whether human beings \"behaved well\" sexually but rather as representing the search for love and human understanding. The patient also became aware that those aspects in his fiancee which at times seemed disgusting to him represented, in his mind, aspects of his mother when, during his childhood, she had appeared sexually excited with his father. These aspects of his fiancee now became unimportant, and he recognized other ways in which she had real features in common with his mother, such as her cultural and national background. When his fiancee sang songs of her native region, he was deeply moved; the songs gave him the feeling of communicating with a part of his past—not with his mother as a person but with the background from which she stemmed."}, {"id": 942, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 300, "loc": "patient", "int": 0.6, "aff": "clinging longing", "au": "Kernberg", "pt": "unnamed", "pg": 96, "pdf": "", "ppg": 79, "pcf": 1.0, "txt": "The idealization of her real mother, who had died at the height of the patient's oedipal period, now appeared to be a defense not only against oedipal guilt but against earlier orally determined rage against her. The analyst was now seen as a mother image, cold and rejecting, and the patient developed a strong wish to be protected, cuddled, and loved by him as a good mother who would reassure her against the fears about her bad mother. She had sexual fantasies about performing fellatio, related to the feeling that the orgasm of men represented symbolically the giving of love and milk, protection and nourishment. The desperate clingingness in her relations with men and her frigidity now came into focus as an expression of these oral longings toward men, of her rageful wish to control and incorporate them, and her fear of letting herself experience full sexual gratification, because that would mean total dependency on and, therefore, total frustration by cruel \"motherly\" men."}, {"id": 943, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 304, "loc": "patient", "int": 0.8, "aff": "exhilarated", "au": "Kernberg", "pt": "unnamed", "pg": 97, "pdf": "", "ppg": 80, "pcf": 1.0, "txt": "She also felt exhilarated at being able to expose her body to this man and did not secretly fear that her genitals were ugly, mutilated, and distasteful. She was able to say to him, \"I cannot imagine what, if heaven exists, heaven could offer beyond this,\" referring to their sexual experience. She could enjoy his body, become sexually excited playing with his penis, which was no longer the hated instrument of male superiority and dominion. She now could walk about feeling she was equal to other women."}, {"id": 944, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 305, "loc": "patient", "int": 0.7, "aff": "tearful gratitude", "au": "Kernberg", "pt": "unnamed", "pg": 97, "pdf": "", "ppg": 80, "pcf": 1.0, "txt": "She no longer needed to envy the intimacy of others, because she had her own intimate relation with a man she loved. But above all, the capacity to enjoy sex jointly and to be fully aware that she was receiving love from him while giving it—feeling grateful for it and no longer afraid of fully expressing her needs to depend upon him—were expressed in her crying after orgasm. The central feature in this case was overcoming penis envy: both its oral roots (envy of the giving mother and the giving penis, and fear of a hateful dependency upon it) and its genital roots (the childhood conviction of the superiority of male sexuality and men) were worked through in the context of a total object relation in which guilt over the aggression toward the object, gratitude for love received, and the need to repair guilt by giving love were all expressed together."}, {"id": 945, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 307, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Kernberg", "pt": "none", "pg": 98, "pdf": "", "ppg": 81, "pcf": 1.0, "txt": "His unconscious oedipal guilt and his sense of inferiority to the idealized oedipal mother may result in sexual inhibition with or intolerance of a woman who becomes sexually free and toward whom he may no longer feel reassuringly protective. Such a development may perpetuate the dichotomy between erotized and desexualized idealized relations to women, a dichotomy typical of boys in early adolescence. Under pathological circumstances, particularly in men with narcissistic pathology, the unconscious envy of mother and the need to take revenge against her may bring about a catastrophic unconscious devaluation of the woman as the longedfor sexual object, with consequent estrangement and abandonment. In a woman who did not have an early satisfactory relationship with a mother who tolerated her daughter's sexuality, the unconscious experience of a hostile and rejecting mother who interfered with the little girl's early development of bodily sensuality, and, later on, with her love for her father, may result in exaggerated unconscious guilt about sexual intimacy in conjunction with commitment in depth to a man."}, {"id": 946, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 386, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Kernberg", "pt": "none", "pg": 120, "pdf": "", "ppg": 103, "pcf": 1.0, "txt": "Superego Functions 103 may have an idealized yet emotionally naive sense of a perfectly harmonious relationship with a partner that combines sex and tenderness and, simultaneously, another long-term relationship that combines sex and tenderness,- the underlying aggression is expressed only in the unconscious enjoyment of the aggressive implications of the betrayal of both partners. These dynamics, particularly the splitting mechanisms involved, may be a defense against sadistic superego features in the relationship of the couple that can be observed when one of the parallel relationships is dissolved. A sometimes justified but often inordinate fear that the person to whom an individual is really committed will never be able to forgive or forget the past infidelity—thus becoming a cruel, unforgiving superego— may be matched, in effect, by the loved partner's enacting such a nonforgiving, eternally resentful role. Although the narcissistic lesion of feeling abandoned and betrayed is an obviously important aspect of such unforgiving behavior, I am thinking of the corresponding projection onto the partner and/or the identification with an implacable superego on the part of the ''betrayed\" partner."}]</script>
<script>
const DATA=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s);
let sortKey='int',sortDir=-1;
const NUM={int:1,pos:1,pg:1,ppg:1};
function fill(sel,key,label){
 const vals=[...new Set(DATA.map(d=>d[key]).filter(v=>v!==''&&v!=null))].sort((a,b)=>(''+a).localeCompare(''+b));
 $(sel).innerHTML='<option value="">all '+label+'</option>'+vals.map(v=>'<option>'+v.replace(/</g,'&lt;')+'</option>').join('');
}
fill('#f_loc','loc','loci');fill('#f_au','au','authors');fill('#f_pt','pt','patients');
fill('#f_tr','tr','traditions');fill('#f_doc','doc','documents');
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function hl(s,q){s=esc(s);if(!q)return s;try{return s.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>')}catch(e){return s}}
function render(){
 const q=$('#q').value.toLowerCase(), exp=$('#exp').checked;
 const fint=parseFloat($('#f_int').value)||0, faff=$('#f_aff').value.toLowerCase(),
       floc=$('#f_loc').value, fau=$('#f_au').value, fpt=$('#f_pt').value, ftr=$('#f_tr').value,
       fpg=parseInt($('#f_pg').value)||0, fppg=parseInt($('#f_ppg').value)||0,
       fdoc=$('#f_doc').value, ftxt=$('#f_txt').value.toLowerCase();
 let r=DATA.filter(d=> d.int>=fint && (!floc||d.loc===floc) && (!faff||(d.aff||'').toLowerCase().includes(faff))
   && (!fau||d.au===fau) && (!fpt||d.pt===fpt) && (!ftr||d.tr===ftr)
   && ((d.pg||0)>=fpg) && (!fppg||(d.ppg||0)>=fppg) && (!fdoc||d.doc===fdoc)
   && (!ftxt||d.txt.toLowerCase().includes(ftxt)) && (!exp||d.loc!=='none')
   && (!q||[d.txt,d.aff,d.au,d.pt,d.doc].some(x=>(''+(x||'')).toLowerCase().includes(q))));
 const k=sortKey,dir=sortDir;
 r.sort((a,b)=>{let x=a[k],y=b[k];if(NUM[k]){x=x==null?-1:x;y=y==null?-1:y;return (x-y)*dir;}return (''+x).localeCompare(''+y)*dir});
 $('#cnt').textContent=r.length+' of '+DATA.length+' units';
 const hq=ftxt||q;
 $('#tb').innerHTML=r.slice(0,1500).map(d=>{
  const pg=(d.pg&&d.pdf)?'<a class="pg" href="'+d.pdf+'#page='+d.pg+'" target="_blank" rel="noopener">'+d.pg+' &#8599;</a>':(d.pg?''+d.pg:'');
  const cite=d.ppg?('<span'+(d.pcf<0.7?' style="color:#aaa" title="low confidence estimate"':'')+'>p.'+d.ppg+'</span>'):'<span style="color:#ccc">&mdash;</span>';
  return '<tr><td class="num int">'+d.int.toFixed(2)+'</td><td><span class="chip '+d.loc+'">'+d.loc+
   '</span></td><td>'+esc(d.aff)+'</td><td class="au">'+esc(d.au)+'</td><td>'+esc(d.pt)+'</td><td>'+d.tr+
   '</td><td class="num">'+pg+'</td><td class="num">'+cite+'</td><td class="doc">'+esc(d.doc)+
   '</td><td class="txt">'+hl(d.txt,hq)+'</td></tr>';}).join('')+
  (r.length>1500?'<tr><td colspan=10 style="color:#888;padding:12px">…showing first 1500; narrow filters to see the rest</td></tr>':'');
}
document.querySelectorAll('#hdr th').forEach(th=>th.addEventListener('click',()=>{const k=th.dataset.k;sortDir=(sortKey===k)?-sortDir:(NUM[k]?-1:1);sortKey=k;render()}));
['q','exp','f_int','f_aff','f_loc','f_au','f_pt','f_tr','f_pg','f_ppg','f_doc','f_txt'].forEach(id=>{
 const el=document.getElementById(id);el.addEventListener(el.tagName==='SELECT'||el.type==='checkbox'?'change':'input',render);});
$('#clear').addEventListener('click',()=>{['q','f_aff','f_int','f_pg','f_ppg','f_txt'].forEach(i=>$('#'+i).value='');
 ['f_loc','f_au','f_pt','f_tr','f_doc'].forEach(i=>$('#'+i).value='');$('#exp').checked=false;render();});
render();
</script></body></html>
