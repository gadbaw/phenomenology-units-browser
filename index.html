arable feelings about Sandra’s Blackness. Eager to “get it,” consciously I felt solidarity and communion with both of us being people of color while envying her ability to be in a prominent and wealthy African American family."}, {"id": 721, "tr": "classical_freudian", "doc": "Shah_When Racialized Ghosts Refuse to Become A", "pos": 64, "loc": "dyadic", "int": 0.7, "aff": "entangled mourning", "au": "Shah", "pt": "Sandra", "pg": 11, "pdf": "", "ppg": 593, "pcf": 1.0, "txt": "I superficially conflated being a person of color with being Black, which obscured Sandra’s ability to feel and explore her Black identity separate from my own, and also denied the structural basis of racism based in the trauma of slavery and abjection of the black body, relegating Black subjects to a “zone of non-being” (Fanon, 1952 ). In this sense, my unconscious denial of Sandra’s Blackness as separate from my own experience of being a person of color covered over by idealization and envy was in some ways like Sandra’s grandmother’s comment: “not Korean hair,” dismissing Sandra’s experience and knowledge of her Blackness distinct from her Korean heritage. Later in the treatment, Sandra also spoke at length about her own envy of her cousins she perceived as “Blacker” than her, and her fantasy of wishing she was “purely Black” to feel accepted and close to them and her African American heritage. Sandra and I struggled to both embrace and know her Blackness and African American ancestry, as well as mourn the fantasy of this essence of Black “racial purity” as an attempt to heal the wounds of her biracial experience, the wish for wholeness that is inherent in all racial fantasies (George, 2016 )."}, {"id": 722, "tr": "classical_freudian", "doc": "Shah_When Racialized Ghosts Refuse to Become A", "pos": 67, "loc": "patient", "int": 0.7, "aff": "alive, less haunted", "au": "Shah", "pt": "Sandra", "pg": 12, "pdf": "", "ppg": 594, "pcf": 1.0, "txt": "Gradually, however, she began to feel a shift in her way of speaking about herself and her identity. Allowing her racial ghosts to have a voice seemed to help her to feel more alive and in touch with herself and her losses. She felt less haunted and more connected by links with her racial ancestors. For Sandra, mourning was not a process of letting go of any aspect of her racial identity or history to become more “whole.” I believe that such formulations reflect a collective wishful myth about the possibility of living in a colorblind society where racial traumas can be discarded."}, {"id": 723, "tr": "classical_freudian", "doc": "Freud_SE_Dora_complete.pdf", "pos": 227, "loc": "dyadic", "int": 0.6, "aff": "interpretive pressure", "au": "Freud", "pt": "Dora", "pg": 70, "pdf": "", "ppg": null, "pcf": 0.4, "txt": "The dream confirms once more what I had alreadytold you before you dreamt it—that you are summoning up your old love for yourfather in order to protect yourself against your love for Herr K. But what do allthese efforts show? Not only that you are afraid of Herr K., but that you are stillmore afraid of yourself, and of the temptation you feel to yield to him. In short,these efforts prove once more how deeply you loved him.’Naturally Dora would not follow me in this part of the interpretation."}, {"id": 724, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 135, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Freud", "pt": "none", "pg": 48, "pdf": "", "ppg": 18, "pcf": 0.72, "txt": "Several writers who are anxious not to cast doubts on the intimate connection between the content of dreams and waking life have been struck by the fact that impressions with which waking thoughts are intensely occupied only appear in dreams after they have been pushed somewhat aside by the workings of daytime thought. Thus, after the death of someone dear to them, people do not as a rule dream of him to begin with, while they are overwhelmed by grief (Delage, 1891, [40]). On the other hand one of the most recent observers, Miss Hallam (Hallam and Weed, 1896, 410--11), has collected instances to the contrary, thus asserting the right of each of us to psycho­ logical individualism in this respect. The third, most striking and least comprehensible character­ istic of memory in dreams is shown in the choice of material re­ produced."}, {"id": 725, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 152, "loc": "none", "int": 0.1, "aff": "expository", "au": "Freud", "pt": "none", "pg": 53, "pdf": "", "ppg": 23, "pcf": 0.72, "txt": "Now when we our­ selves wish to go to sleep we are in the habit of trying to produce a situation similar to that of Strilmpell's experiment. We close our most important sensory channels, our eyes, and try to pro­ tect the other senses from all stimuli or from any modification of the stimuli acting on them. We then fall asleep, even though our plan is never completely realized .. We cannot keep stimuli completely away from our sense organs nor can we completely suspend the excitability of our sense organs."}, {"id": 726, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 172, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Freud", "pt": "none", "pg": 59, "pdf": "", "ppg": 29, "pcf": 0.72, "txt": "• C. THE STIMULI AND SOURCES OF DREAMS 29 the mind receives stimuli that reach it during sleep under conditions favourable to the formation of illusions. A sense­ impression is recognized by us and correctly interpreted-that, is, it is placed in the group of memories to which, in accordance with all our previous experiences, it belongs-provided the im­ pression is sufficiently strong, clear and lasting and provided. we have sufficient time at our disposal for considering the matter. If these conditions are not fulfilled, we mistake the object which is the source of the impression: we form an illusion about it. 'If someone goes for a walk in the open country and has an indeterminate perception of a distant object, he may at first believe it to be a horse.' On a closer view he may be led to interpret it as a cow lying down, and the image may finally resolve itself definitely into a group of people sitting on the ground."}, {"id": 727, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 284, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Freud", "pt": "none", "pg": 96, "pdf": "", "ppg": 66, "pcf": 0.72, "txt": "Jessen (1855, 553) writes: 'Nor do we become better or more virtuous in sleep. On the contrary, conscience seems to be silent in dreams, for we feel no pity in them and may commit the worst crimes-theft, violence and murder-with complete indifference and with no subsequent feelings of remorse.' Radcstock (1879, 164): 'It should be borne in mind that associations occur and ideas are linked together in dreams with­ out any regard for reflection, common sense, aesthetic taste or moral judgement. Judgement is extremely weak and ethical indifference reigns supreme.' Volkelt (1875, 23): 'In dreams, as we are all aware, proceed­ ings are especially unbridled in sexual matters. The dreamer himself is utterly shameless and devoid of any moral feeling or judgement; moreover, he sees everyone else, including those for whom he has the deepest respect, engaged in acts with which he would be horrified to associate them while he was awake, even in his thoughts.' In diametrical opposition to these, we find statements such as Schopenhauer's [1862, 1, 245] that everyone who figures in a dream acts and speaks in complete accordance with his char­ acter."}, {"id": 728, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 439, "loc": "clinician", "int": 0.75, "aff": "guilty reckoning", "au": "Freud", "pt": "Irma", "pg": 142, "pdf": "", "ppg": 112, "pcf": 0.72, "txt": "112 II. TIIE METHOD OF INTERPRETING DREAMc; It had never occurred to me before, but it struck me now almost like an act of retribution on the part of destiny. It was as though the replacement of one person by another was to be continued in another sense: this Mathilde for that Mathilde, an eye for an eye and a tooth for a tooth. It seemed as ifl had been collecting all the occasions which I could bring up against myself as evi­ dence of lack of medical conscientiousness."}, {"id": 729, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 542, "loc": "none", "int": 0.2, "aff": "theoretical dread", "au": "Freud", "pt": "none", "pg": 165, "pdf": "", "ppg": 135, "pcf": 0.72, "txt": "IV. DISTORTION IN DREAMS 155 And apart from these dreams, which carry over into sleep the various distressing emotions of life, there are anxiety-dreams, in which that most dreadful of all unpleasurable feelings holds us in its grasp till we awaken. And the commonest victims of these anxiety-dreams are precisely children, 1 whose dreams you have described as undisguised wish-fulfilments.' It does in fact look as though anxiety-dreams make it impos­ sible to assert as a general proposition (based on the examples quoted in my last chapter) that dreams are wish-fulfilments; indeed they seem to stamp any such proposition as an absurdity. Nevertheless, there is no great difficulty in meeting these apparently conclusive objections."}, {"id": 730, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 567, "loc": "clinician", "int": 0.65, "aff": "uneasy guilt", "au": "Freud", "pt": "none", "pg": 170, "pdf": "", "ppg": 140, "pcf": 0.72, "txt": "140 IV. DISTORTION IN DREAMS procedure adopted by my dream: it made one of them, R., into a simpleton and the other, N., into a criminal, whereas I was neither the one nor the other; thus we no longer had anything in common; I could rejoice at my appointment to a professor­ ship, and I could avoid drawing the distressing conclusion that R.'s report of what the high official had said to him must apply equally to me. But I felt obliged to proceed still further with my interpreta­ tion of the dream; I felt I had not yet finished dealing with it satisfactorily. I was still uneasy over the light-heartedness with which I had degraded two of my respected colleagues in order to keep open my own path to a professorship."}, {"id": 731, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 938, "loc": "patient", "int": 0.7, "aff": "ashamed paralysis", "au": "Freud", "pt": "none", "pg": 268, "pdf": "", "ppg": 238, "pcf": 0.72, "txt": "I was going up three steps at a time and was delighttd at my agiliry. Suddenly I saw a maid-servant coming down the stairs-coming towards me, that is. I felt ashamed and tried to hurry, and at this point the feeling of being inhibittd set in: I was glued to the sttps and unable to budge from the spot. ANAL YSIS.-The situation in the dream is taken from everyday reality."}, {"id": 732, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 960, "loc": "none", "int": 0.1, "aff": "theoretical", "au": "Freud", "pt": "none", "pg": 274, "pdf": "", "ppg": 244, "pcf": 0.72, "txt": "For the context in which dreams of this sort appear during my analyses of neurotics leaves no doubt that they are based upon memories from earliest childhood. It is only in our childhood that we are seen in inadequate clothing both by members of our family and by strangers-nurses, maid-servants, and visitors; and it is only then that we feel no shame at our nakedness. 1 We can observe how undressing has an almost intoxicating effect on many children even in their later years, instead of making them feel ashamed. They laugh and jump about and slap them­ selves, while their mother, or whoever else may be there, re­ proves them and says: 'Ugh! Shocking!"}, {"id": 733, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 1360, "loc": "patient", "int": 0.4, "aff": "defensive withdrawal", "au": "Freud", "pt": "unnamed", "pg": 391, "pdf": "", "ppg": 361, "pcf": 0.72, "txt": "I went on to say that as she had a hus­ band with such fine genitals there was no need for her to be afraid of the officers-no need, that is, for her to wish for any­ thing from them, since as a rule she was prevented from going for a walk unprotected and unaccompanied owing to her phan­ tasies of being seduced. I had already been able to give her this last explanation of her anxiety on several occasions upon the basis of other material. The way in which the dreamer reacted to this material was most remarkable. She withdrew her description of the hat and maintained that she, had never said that the two side-pieces hung down."}, {"id": 734, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 1433, "loc": "patient", "int": 0.6, "aff": "frightened excitement", "au": "Freud", "pt": "unnamed", "pg": 412, "pdf": "", "ppg": 382, "pcf": 0.72, "txt": "Meanwhile (how, he could not tell) he pulled his legs out of the vessel and said to himself once more: 'This can't be right. re s it is, though.' At this point he partly woke up and went through the dream to himself, so as to be able to report it to, me. He was positively frightened of the solutionl of the dream. He felt very much excited during this period of semi-sleep and kept repeating: 'Phenyl, phenyl.' (II) He was at --ing with his whole fa mily and was due to ie at the Schottentor2 at half-past eleven to meet a particular lady. But he only woke at half -past eleven, and said to himself : 'It's too late. ro u can't get there bef ore half-past twelve.' The next moment he saw the whole fa mily sitting round the tablej he saw his mother particularly clearly and the maid-servant carrying the soup-tureen."}, {"id": 735, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 1458, "loc": "none", "int": 0.2, "aff": "astonishment", "au": "Freud", "pt": "none", "pg": 418, "pdf": "", "ppg": 388, "pcf": 0.72, "txt": "According to popular belief dreams of teeth being pulled out are to be interpreted as meaning the death of a relative, but psycho-analysis can at most confirm this interpretation only in the joking sense I have alluded to above. In this connection, however, I will quote a dream with a dental stimulus that has been put at my disposal by Qtto Rank.� 'A colleague of mine, who has for some time been taking a lively interest in the problems of dream-interpretation, has sent me the following contribution to the subject of dreams with a dental stimulus. , \"A short time ago I had a dream that I was at the dentist's and he was drilling a back tooth in my lower jaw. He worked on it so long that the tooth became useless. He then seized it with a fo rceps and pulled it out with an effo rtless ease that excited my astonishment."}, {"id": 736, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 1461, "loc": "none", "int": 0.3, "aff": "pained irritation", "au": "Freud", "pt": "unnamed", "pg": 419, "pdf": "", "ppg": 389, "pcf": 0.72, "txt": "We entered a big tunnel and two trains, going in the opposite direction to us, passed through our train as if it were the tunnel. I was looking into a carriage window as though I were outside. , \"The following experiences and thoughts from the previous day provide material for an interpretation of the dream: '' '( 1.) 1 had in fact been having dental treatment recently, and at the time of the dream 1 was having continual pain in the tooth in the lower jaw which was being drilled in the dream and at which the dentist had, again in reality, worked longer than 1 liked. On the morning of the dream-day 1 had once more been to the dentist on account of the pain; and he had suggested to me that 1 should have another tooth pulled out in the same jaw as the one he had been treating, saying that the pain probably came from this other one. This was a 'wisdom tooth' which 1 was cutting just then. 1 had raised a question touching his medical conscience in that connection. '' '( II.) On the afternoon of the same day, 1 had been obliged to apologize to a lady for the bad temper 1 was in owing to my toothache; whereupon she had told me she was afraid of having a root pulled out, the crown of which had crumbled away almost entirely."}, {"id": 737, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 1699, "loc": "none", "int": 0.3, "aff": "sweaty unease", "au": "Freud", "pt": "unnamed", "pg": 486, "pdf": "", "ppg": 456, "pcf": 0.72, "txt": "It seemed as though the books were sometimes mine and sometimes theirs. I felt inclined at that point to intervene in the conversation in a confirmatory or substantiating sense .•.. I woke up perspiring all over, because all the windows were shut. The train was drawn up at Marburg [in StyriaJ."}, {"id": 738, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 1717, "loc": "none", "int": 0.1, "aff": "theoretical", "au": "Freud", "pt": "none", "pg": 491, "pdf": "", "ppg": 461, "pcf": 0.72, "txt": "If a hysteric is surprised at having to be so frightened of something trivial or if a man suffering from obsessions is surprised at such distressing self-reproaches arising out of a mere nothing, they have both gone astray, because they regard the ideational content-the triviality or the mere nothing-as what is essential; and they put up an unsuccessful fight because they take this ideational content as the starting-point of their thought-activity. Psycho­ analysis can put them upon the right path by recognizing the affect as being, on the contrary, justified and by seeking out the idea which belongs to it but has been repressed and replaced by a substitute. A necessary premise to all this is that the release of affect and the ideational content do not constitute the indis­ soluble organic unity as which we are in the habit of treating 1 [Footnote added 191 9:] If I am not greatly mistaken, the first dream that I was able to pick up from my grandson, at the age of one year and eight months, revealed a state of affairs in which the dream-work had succeeded in transforming the material of the dream-thoughts into a wish-fulfilment, whereas the affect belonging to them persisted un­ changed during the state of sleep. On the night before the day on which his father was due to leave for the front, the child cried out, sobbing violently: 'Daddy!"}, {"id": 739, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 1785, "loc": "clinician", "int": 0.4, "aff": "missing dread", "au": "Freud", "pt": "none", "pg": 507, "pdf": "", "ppg": 477, "pcf": 0.72, "txt": "But the little tailor is warned, and sees to it that his dream is corrected. The complicated process of elimination, diminution and reversal, by means of which the affects in the dream-thoughts are eventually turned into those in the dream, can be satisfac­ torily followed in suitable syntheses of dreams that have been completely analysed. I will quote a few more examples of affects in dreams where some of the possibilities I have enumerated will be found realized. v If we tum back to the dream about the strange task set me by old Brucke of making a dissection of my own pelvis [po 452], it will be recalled that in the dream itself! missed the gruesome feeling ['Grauen'] appro priate to it. Now this was a wish-fulfil­ ment in more than one sense."}, {"id": 740, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 1801, "loc": "clinician", "int": 0.7, "aff": "shame, self-reproach", "au": "Freud", "pt": "none", "pg": 511, "pdf": "", "ppg": 481, "pcf": 0.72, "txt": "It will soon appear what it was that caused the situation [in regard to Fl.] to be switched on to these lines. The scene [with Brticke] itself could not be reproduced by the dream in the form in which I experienced it. The other figure in the dream was allowed to keep the blue eyes, but the annihilating role was allotted to me-a reversal which was obviously the work of wish-fulfilment. My anxiety about my friend's recovery, my self-reproaches for not going to see him, the shame I felt about this-he had come to Vienna (to see me) 'unobtrusive!J'-the need I felt to consider that I was excused by my illness-all of this combined to produce the emotional storm which was clearly perceived in my sleep and which raged in this region of the dream-thoughts."}, {"id": 741, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 2111, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Freud", "pt": "none", "pg": 598, "pdf": "", "ppg": 568, "pcf": 0.72, "txt": "566 VII. PSYCHOLOGY OF THE DREAM-PROCESSES impulse will at once emerge which will seek to re-cathect the mnemic image of the perception and to re-evoke the perception itself, that is to say, to re-establish the situation of the original satisfaction. An impulse of this kind is what we call a wish; the reappearance of the perception is the fulfilment of the wish; and the shortest path to the fulfilment of the wish is a path leading direct from the excitation produced by the need to a complete cathexis of the perception. Nothing prevents us from assuming that there was a primitive state of the psychical apparatus in which this path was actually traversed, that is, in which wishing ended in hallucinating."}, {"id": 742, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 2171, "loc": "clinician", "int": 0.3, "aff": "remembered anxiety", "au": "Freud", "pt": "none", "pg": 615, "pdf": "", "ppg": 585, "pcf": 0.72, "txt": "D. THE FUNCTION OF DREAMS 583 anxiety-dreams to analysis in order to show the sexual material present in their dream-thoughts.1 I have good reasons for leaving on one side in the present discussion the copious examples afforded by my neurotic patients, and for preferring to quote some anxiety-dreams dreamt by young people. It is dozens of years since I myself had a true anxiety-dream. But I remember one from my seventh or eighth year, which I submitted to interpretation some thirty years later."}, {"id": 743, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 2179, "loc": "none", "int": 0.2, "aff": "uncanny anxiety", "au": "Freud", "pt": "unnamed", "pg": 617, "pdf": "", "ppg": 587, "pcf": 0.72, "txt": "D. THE FUNCTION OF DREAMS 585 evidence in favour of this view in the fact that he had often noticed blood in his mother's bed. It is, I may say, a matter of daily experience that sexual intercourse between adults strikes any children who may ob­ serve it as something uncanny and that it arouses anxiety in them. I have explained this anxiety by arguing that what we are dealing with is a sexual excitation wi.th which their under­ standing is unable to cope and which they also, no doubt, repudiate because their parents are involved in it, and which is theref ore transformed into anxiety."}, {"id": 744, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 2283, "loc": "patient", "int": 0.7, "aff": "intrusive bodily disturbance", "au": "Freud", "pt": "unnamed", "pg": 650, "pdf": "", "ppg": 620, "pcf": 0.72, "txt": "I was called in to a consultation last year to examine an intelligent and unembarrassed-looking girl. She was most sur­ prisingly dressed. For though as a rule a woman's clothes are caref ully considered down to the last detail, she was wearing one of her stockings hanging down and two of the buttons on her blouse were undone. She complained of having pains in her leg and, without being asked, exposed her cal£ But what she principally complained of was, to use her own words, that she had a feeling in her body as though there was something 'stuck into it' which was 'moving backwards and forwards' and was 'shaking' her through and through : sometimes it made her whole body feel 'stiff'."}, {"id": 745, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 2455, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Freud", "pt": "none", "pg": 706, "pdf": "", "ppg": 676, "pcf": 0.72, "txt": "These last dreams are invariably accompanied by anxiety, which interrupts them. In their case anxiety takes the place of dream­ distortion; and in dreams of the second class anxiety is only avoided owing to the dream-work. There is no great difficulty 674"}, {"id": 746, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 2456, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Freud", "pt": "none", "pg": 707, "pdf": "", "ppg": 677, "pcf": 0.72, "txt": "ON DREAMS 675 in proving that the ideational content which produces anxiety in us in dreams was once a wish but has since undergone repression. There are also clear dreams with a distressing content, which, however, is not felt as distressing in the dream itself. For this reason they cannot be counted as anxiety-dreams; but they have always been taken as evidence of the fact that dreams are without meaning and have no psychical value. An analysis of a dream of this kind will show that we are dealing with well­ disguised fulfilments of repressed wishes, that is to say with a dream of the second class; it will also show how admirably the process of displacement is adapted for disguising wishes."}, {"id": 747, "tr": "classical_freudian", "doc": "On the Therapeutic Action of Psycho-Analysis b", "pos": 14, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Loewald", "pt": "unnamed", "pg": 4, "pdf": "", "ppg": null, "pcf": 0.5, "txt": "The patient tends to make this potentially new object-relationship into and old one. On the other hand, to the extent to which the patient develops a 'positive transference' (not in the sense of transference as resistance, but in the sense in which 'transference' carries the whole process of an analysis) he keeps this potentiality of a new object-relationship alive through all the various stages of resistance. The patient can dare to take the plunge into the regressive crisis of the transference 17 neurosis which brings him face to face again with his childhood anxieties and conflicts, if he can hold on to the potentiality of a new object-relationship, represented by the analyst. We know from analytic as well as from life experience that new spurts of selfdevelopment may be intimately connected with such 'regressive' rediscoveries of oneself as may occur through the establishment of new object-relationships, and this means: new discovery of 'objects'."}, {"id": 748, "tr": "classical_freudian", "doc": "On the Therapeutic Action of Psycho-Analysis b", "pos": 32, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Loewald", "pt": "unnamed", "pg": 8, "pdf": "", "ppg": null, "pcf": 0.5, "txt": "And this not primarily in the sense of an object not previously met, but the newness consists in the patient's rediscovery of the early paths of the development of object-relations leading to a new way of relating to objects and of being oneself. Through all the transference distortions the patient reveals rudiments at least of that core (of himself and 'objects') which has been distorted. It is this core, rudimentary and vague as it may be, to which the analyst has reference when he interprets transferences and defences, and not some abstract concept of reality or normality, if he is to reach the patient. If the analyst keeps his central focus on this emerging core he avoids moulding the patient in the analyst's own image or imposing on the patient his own concept of what the patient should become."}, {"id": 749, "tr": "classical_freudian", "doc": "On the Therapeutic Action of Psycho-Analysis b", "pos": 51, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Loewald", "pt": "none", "pg": 13, "pdf": "", "ppg": null, "pcf": 0.5, "txt": "nervous apparatus to deal with environment. The intimate and fundamental relationship of instincts, especially in so far as libido (sexual instincts, Eros) is concerned, with objects, is more clearly brought out in 'The Problem of Anxiety', until finally, in An Outline of Psycho-analysis, 'the aim of the first of these basic instincts [Eros] is to establish ever greater unities and to preserve them thus—in short, to bind together'. It is noteworthy that here not only the relatedness to objects is implicit; the aim of the instinct Eros is no longer formulated in terms of a contentless 'satisfaction', or satisfaction in the sense of abolishing stimuli, but the aim is clearly seen in terms of integration. It is: 'to bind together'."}, {"id": 750, "tr": "classical_freudian", "doc": "On the Therapeutic Action of Psycho-Analysis b", "pos": 89, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Loewald", "pt": "none", "pg": 22, "pdf": "", "ppg": null, "pcf": 0.5, "txt": "Waelder , in his Geneva Congress paper , 'Introduction to the Discussion on Problems of Transference' (19) says: 'Transference may be said to be an attempt of the patient to revive and reenact, in the analytic situation and in relation to the analyst, situations and phantasies of his childhood.' Hoffer , in his paper , presented at the same Congress, on 'Transference and Transference Neurosis' (12) states: 'The term \"transference\" refers to the generally agreed fact that people when entering into any form of object-relationship … transfer upon their objects those images which they encountered in the course of previous infantile experiences. … The term \"transference\", stressing an aspect of the influence our childhood has on our life as a whole, thus refers to those observations in which people in their contacts with objects, which may be real or imaginary, positive, negative, or ambivalent, \"transfer\" their memories of significant previous experiences and thus \" change the reality \" of their objects, invest them with qualities from the past. …' The transference neuroses, thus, are characterized by the transfer of libido to external objects as against the attachment of the libido to the 'ego' in the narcissistic affections; and, secondly, by the transfer of libidinal cathexes 27 (and defences against them), originally related to infantile objects, on to contemporary objects. Transference neurosis as distinguished from narcissistic neurosis is a nosological term. At the same time, the term 'transference neurosis' is used in a technical sense to designate the revival of the infantile neurosis in the analytic situation. In this sense of the term, the accent is on the second meaning of transference, since the revival of the infantile neurosis is due to the transfer of relations with infantile objects on to the contemporary object, the analyst."}, {"id": 751, "tr": "classical_freudian", "doc": "On the Therapeutic Action of Psycho-Analysis b", "pos": 93, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Loewald", "pt": "none", "pg": 23, "pdf": "", "ppg": null, "pcf": 0.5, "txt": "Thus, in regard to child-analysis, at any rate before the latency period, it has been questioned whether one can speak of transference in the sense in which adult neurotic patients manifest it. The conception of such a primitive form of transference is fundamentally different from the assumption of an unrelatedness of ego and objects as is implied in the idea of a withdrawal of libido from objects into the ego. The modification of our view on the narcissistic affections in this respect, based on clinical experience with schizophrenics and on deepened understanding of early ego-development, leads to a broadened conception of transference in the first-mentioned meaning of that term. To be more precise: transference in the sense of transfer of libido to objects is clarified genetically; it develops out of a primary lack of differentiation of ego and objects and thus may regress, as in schizophrenia, to such a pre-stage."}, {"id": 752, "tr": "classical_freudian", "doc": "Shah_When Racialized Ghosts Refuse to Become A", "pos": 2, "loc": "patient", "int": 0.85, "aff": "haunted nonexistence", "au": "Shah", "pt": "Sandra", "pg": 2, "pdf": "", "ppg": 584, "pcf": 1.0, "txt": "“I feel like a fucking ghost. Or maybe the whole world is filled with ghosts I don’t know. It’s all messed up . . . It’s like a haunting feeling like I don’t exist in this world."}, {"id": 753, "tr": "classical_freudian", "doc": "Shah_When Racialized Ghosts Refuse to Become A", "pos": 6, "loc": "dyadic", "int": 0.9, "aff": "shared haunted despair", "au": "Shah", "pt": "Sandra", "pg": 2, "pdf": "", "ppg": 584, "pcf": 1.0, "txt": "I am gripped with a hopeless despair as she speaks. I can feel it inside my body as a dead weight. I’m not sure what to say. Now we are both in a space of feeling haunted."}, {"id": 754, "tr": "classical_freudian", "doc": "Shah_When Racialized Ghosts Refuse to Become A", "pos": 17, "loc": "none", "int": 0.1, "aff": "sociocultural", "au": "Shah", "pt": "none", "pg": 4, "pdf": "", "ppg": 586, "pcf": 1.0, "txt": "Practices and policies such as antimiscegenation laws, cultural stereotypes, and internalized racist beliefs uphold the illusion that race is distinct, with firm boundaries and markers. This assumption pervades United States history in the form of laws such as interracial marriage prohibitions and the “one drop rule” that categorized as Black a racially mixed person with “one drop of Black blood,” thereby protecting the fiction of white purity (Bonovitz, 2009 ). Breathing in daily the air of these defensive collective fantasies of racial purity and assumptions of white privilege and coping chronically with the culture’s disengagement with racial multiplicity, individuals of mixed race can easily feel a threat to their sense of racial existence. In response, they can find themselves in a melancholic, ghost-like state."}, {"id": 755, "tr": "classical_freudian", "doc": "Shah_When Racialized Ghosts Refuse to Become A", "pos": 23, "loc": "clinician", "int": 0.5, "aff": "struck, attentive", "au": "Shah", "pt": "Sandra", "pg": 5, "pdf": "", "ppg": 587, "pcf": 1.0, "txt": "I mean, I miss him but as time passes it feels like I lost something else, but I don’t know what. [pauses]. I am struck by her words: “ It feels bigger than him . . . ” Some background material about Sandra is useful here: Josh left Sandra two months ago, and her world collapsed. They met when she was a first-year undergraduate in their writing seminar. “It was like he was my twin – we got each other completely.” They loved the same Russian novels, and both shared a caustic and dark sense of humor."}, {"id": 756, "tr": "classical_freudian", "doc": "Shah_When Racialized Ghosts Refuse to Become A", "pos": 28, "loc": "patient", "int": 0.7, "aff": "shame, dread", "au": "Shah", "pt": "Sandra", "pg": 6, "pdf": "", "ppg": 588, "pcf": 1.0, "txt": "She decided to seek treatment after a night of binge drinking and cutting her wrists and thighs superficially with a knife while thinking about his betrayal. Sandra woke up after this episode in a state of panic and dread. “I’m ashamed this is all because of a boy. I used to laugh at people like me."}, {"id": 757, "tr": "classical_freudian", "doc": "Shah_When Racialized Ghosts Refuse to Become A", "pos": 31, "loc": "clinician", "int": 0.4, "aff": "reflective wondering", "au": "Shah", "pt": "Sandra", "pg": 6, "pdf": "", "ppg": 588, "pcf": 1.0, "txt": "Sandra knows she lost Josh as her partner, her lover, her friend, but she does not know what she has lost that was so critical to her feeling alive and why this breakup has “broken” her sense of existence. Sandra feels trapped in this haunted and ghostly state of being. I wondered if Sandra’s melancholia was a way of managing her unbearable pain by withdrawing into herself and unconsciously keeping Josh with her in a sadomasochistic identification at the cost of her own inner vitality (Ogden, 2002 ). In this merging with what has been lost, hate is laced with passion in a tyrannizing way that she directs toward herself in isolated and brutal self-attacks."}, {"id": 758, "tr": "classical_freudian", "doc": "Shah_When Racialized Ghosts Refuse to Become A", "pos": 45, "loc": "patient", "int": 0.5, "aff": "numb longing", "au": "Shah", "pt": "Sandra", "pg": 8, "pdf": "", "ppg": 590, "pcf": 1.0, "txt": "I was thinking about my grandmother . . . the last time I saw her. I’ll never see her again; I wonder if we will go back to Korea. I feel like I should be feeling something about her but I don’t. Me: Are any memories or images coming up?"}, {"id": 759, "tr": "classical_freudian", "doc": "Shah_When Racialized Ghosts Refuse to Become A", "pos": 48, "loc": "patient", "int": 0.4, "aff": "unseen, dismissive", "au": "Shah", "pt": "Sandra", "pg": 8, "pdf": "", "ppg": 590, "pcf": 1.0, "txt": "She said, “Of course you are Korean. You are me and your father; don’t ever feel like you are not.” But that’s not how it felt. Other times she would say “You are a beautiful and unique creation of me and your father, you don’t have to be one or the other. You are the best of both of us.” She’s being nice, I know, but she doesn’t get it."}, {"id": 760, "tr": "classical_freudian", "doc": "Shah_When Racialized Ghosts Refuse to Become A", "pos": 57, "loc": "none", "int": 0.2, "aff": "formulative", "au": "Shah", "pt": "Sandra", "pg": 10, "pdf": "", "ppg": 592, "pcf": 1.0, "txt": "from her husband’s family. Sandra’s perception that her mother needed her to feel they were the same created anxiety and guilt in her, with defensive anger over their separateness. There were echoes of an intergenerational transmission of trauma and guilt in Sandra’s mother’s choice to escape her ghosts from the past. Sandra’s mother’s desire to flee her own mother’s melancholic prison and her Korean family of origin in choosing Josh’s father (an “other” of African American descent) was in some ways analogous to Sandra’s desire for Josh, the longing for an external escape to heal her familial and racial wounds and undo her guilt over her separateness with her own mother (Dionne Powell, personal communication)."}, {"id": 761, "tr": "classical_freudian", "doc": "Shah_When Racialized Ghosts Refuse to Become A", "pos": 60, "loc": "clinician", "int": 0.5, "aff": "uncomfortable envy", "au": "Shah", "pt": "Sandra", "pg": 10, "pdf": "", "ppg": 592, "pcf": 1.0, "txt": "This stereotype works to deny the multiplicity of various Asian American groups who do not fit the ideals of the majority and often sets them against and apart from African Americans (Eng & Han, 2018 ). Feeling the cultural burden of being a “model minority” signified my minority status as different from Sandra’s position as an African American woman. This dynamic was also present in Sandra’s relationship with her Korean mother, and within Sandra’s own racial selfrepresentations. Within these complex intersections of power and privilege, later in the treatment I also experienced an uncomfortable envy toward Sandra’s African American heritage."}, {"id": 762, "tr": "classical_freudian", "doc": "Shah_When Racialized Ghosts Refuse to Become A", "pos": 63, "loc": "clinician", "int": 0.8, "aff": "visceral repudiation", "au": "Shah", "pt": "Sandra", "pg": 11, "pdf": "", "ppg": 593, "pcf": 1.0, "txt": "What was more disturbing, covered over by my claims of recognition, was my uncomfortable visceral experience and unconscious repudiation of her Blackness, which was a different kind of ghost that demanded recognition; a ghost that I had not fully reckoned with within myself or Sandra, based on my own internalized racism of Blackness and my denial of the intergenerational trauma of slavery and negation of African Americans as human subjects in American history (Wilderson, 2020 ). My envy of her family and culture was based in a fetishized and defensively idealized fantasy of Blackness due to my own racial insecurities. Growing up in an interracial community that was predominantly divided between African Americans and indivi - duals who identified as white, I struggled to understand my place and how I fit in being brown skinned and set apart from the dichotomized racial struggles in my town. Although I idealized and admired African American culture, feeling close to people of color, underneath this enthusiasm in part was a devaluation and an implicit deni - gration of Blackness that I feared."}, {"id": 763, "tr": "classical_freudian", "doc": "Freud_SE_Dora_complete.pdf", "pos": 82, "loc": "none", "int": 0.3, "aff": "historical disgust", "au": "Freud", "pt": "Dora", "pg": 28, "pdf": "", "ppg": null, "pcf": 0.4, "txt": "He thencame back, and, instead of going out by the open door, suddenly clasped the girlto him and pressed a kiss upon her lips. This was surely just the situation to callup a distinct feeling of sexual excitement in a girl of fourteen who had neverbefore been approached. But Dora had at that moment a violent feeling ofdisgust, tore herself free from the man, and hurried past him to the staircase andfrom there to the street door. She nevertheless continued to meet Herr K."}, {"id": 764, "tr": "classical_freudian", "doc": "Freud_SE_Dora_complete.pdf", "pos": 104, "loc": "none", "int": 0.2, "aff": "narrative", "au": "Freud", "pt": "Dora", "pg": 34, "pdf": "", "ppg": null, "pcf": 0.4, "txt": "They were in Vienna, so she told me, atthat very moment, and she frequently met her father with Frau K. in the street.She also met Herr K. very often, and he always used to turn round and look afterher; and once when he had met her out by herself he had followed her for a longway, so as to make sure where she was going and whether she might not have arendezvous.On one occasion during the course of the treatment her father again feltworse, and went off to B___for several weeks; and the sharp-sighted Dora hadsoon unearthed the fact that Frau K. had started off to the same place on a visit toher relatives there. It was at this time that Dora's criticisms of her father werethe most frequent: he was insincere, he had a strain of falseness in his character,he only thought of his own enjoyment, and he had a gift for seeing things in thelight which suited him best.I could not in general dispute Dora's characterization of her father; and therewas one particular respect in which it was easy to see that her reproaches werejustified. When she was feeling embittered she used to be overcome by the ideathat she had been handed over to Herr K. as the price of his tolerating therelations between her father and his wife; and her rage at her father's makingsuch a use of her was visible behind her affection for him. At other times shewas quite well aware that she had been guilty of exaggeration in talking like this.The two men had of course never made a formal agreement in which she wastreated as an object for barter; her father in particular would have been horrifiedat any such suggestion."}, {"id": 765, "tr": "classical_freudian", "doc": "Freud_SE_Dora_complete.pdf", "pos": 106, "loc": "clinician", "int": 0.3, "aff": "momentary embarrassment", "au": "Freud", "pt": "Dora", "pg": 35, "pdf": "", "ppg": null, "pcf": 0.4, "txt": "companionship of a man who had no satisfaction from his own wife, he wouldhave been certain to answer that he could rely upon his daughter, that a man likeK. could never be dangerous to her, and that his friend was himself incapable ofsuch intentions, or that Dora was still a child and was treated as a child by K.But as a matter of fact things were in a position in which each of the two menavoided drawing any conclusions from the other's behaviour which would havebeen awkward for his own plans. It was possible for Herr K. to send Doraflowers every day for a whole year while he was in the neighbourhood, to takeevery opportunity of giving her valuable presents, and to spend all his sparetime in her company, without her parents noticing anything in his behaviour thatwas characteristic of love-making.When a patient brings forward a sound and incontestable train of argumentduring psycho-analytic treatment, the physician is liable to feel a moment'sembarrassment, and the patient may take advantage of it by asking: ‘This is allperfectly correct and true, isn't it? What do you want to change in now that I'vetold it you?’ But it soon becomes evident that the patient is using thoughts of thiskind, which the analysis cannot attack, for the purpose of cloaking others whichare anxious to escape from criticism and from consciousness. A string ofreproaches against other people leads one to suspect the existence of a string ofself-reproaches with the same content."}, {"id": 766, "tr": "classical_freudian", "doc": "Freud_SE_Dora_complete.pdf", "pos": 114, "loc": "none", "int": 0.1, "aff": "interpretive", "au": "Freud", "pt": "Dora", "pg": 37, "pdf": "", "ppg": null, "pcf": 0.4, "txt": "She had been a mother to them, she had taught them,she had gone for walks with them, she had offered them a complete substitute forthe slight interest which their own mother showed in them. Herr K. and his wifehad often talked of getting a divorce; but it never took place, because Herr K.,who was an affectionate father, would not give up either of the two children. Acommon interest in the children had from the first been a bond between Herr K.and Dora. Her preoccupation with his children was evidently a cloak forsomething else that Dora was anxious to hide from herself and from otherpeople.The same inference was to be drawn both from her behaviour towards thechildren, regarded in the light of the governess's behaviour towards herself, andfrom her silent acquiescence in her father's relations with Frau K.—namely, thatshe had all these years been in love with Herr K."}, {"id": 767, "tr": "classical_freudian", "doc": "Freud_SE_Dora_complete.pdf", "pos": 119, "loc": "none", "int": 0.1, "aff": "analytic query", "au": "Freud", "pt": "Dora", "pg": 38, "pdf": "", "ppg": null, "pcf": 0.4, "txt": "Dora realized that the presence ofthe husband had the effect of making his wife ill, and that she was glad to————————————— This page can be read in German in GESAMMELTE WERKE Vol 5,Page 196 Compare the second dream. The question then arises: If Dora loved Herr K., what was the reason for herrefusing him in the scene by the lake? Or at any rate, why did her refusal takesuch a brutal form, as though she were embittered against him? And how coulda girl who was in love feel insulted by a proposal which was made in amanner neither tactless nor offensive? [A fashionable health resort in the mountains, about fifty miles south ofVienna.] An event of everyday occurrence between sisters."}, {"id": 768, "tr": "classical_freudian", "doc": "Freud_SE_Dora_complete.pdf", "pos": 142, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Freud", "pt": "Dora", "pg": 44, "pdf": "", "ppg": null, "pcf": 0.4, "txt": "Nodoubt at the time of the accident he felt he was extremely unlucky, when herealized that he would never be able to do any more work and would have tostarve or live upon charity. But since then the very thing which in the firstinstance threw him out of employment has become his source of income: he livesby his disablement. If that is taken from him he may become totally helpless. Hehas in the meantime forgotten his trade and lost his habits of industry; he hasgrown accustomed to idleness, and perhaps to drink as well.The motives for being ill often begin to be active even in childhood."}, {"id": 769, "tr": "classical_freudian", "doc": "Freud_SE_Dora_complete.pdf", "pos": 145, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Freud", "pt": "Dora", "pg": 45, "pdf": "", "ppg": null, "pcf": 0.4, "txt": "her will bear witness to the fact; and for that reason she will not need to feel anyconscious self-reproaches at making such successful use of a means which shehad found effective in her years of childhood.And yet illnesses of this kind are the result of intention. They are as a rulelevelled at a particular person, and consequently vanish with that person'sdeparture. The crudest and most commonplace views on the character ofhysterical disorders —such as are to be heard from uneducated relatives ornurses— are in a certain sense right. It is true that the paralysed and bedriddenwoman would spring to her feet if a fire were to break out in her room, and thatthe spoiled wife would forget all her sufferings if her child were to falldangerously ill or if some catastrophe were to threaten the family circumstances.People who speak of the patients in this way are right except upon a singlepoint: they overlook the psychological distinction between what is consciousand what is unconscious."}, {"id": 770, "tr": "classical_freudian", "doc": "Freud_SE_Dora_complete.pdf", "pos": 190, "loc": "patient", "int": 0.55, "aff": "sullen contrariness", "au": "Freud", "pt": "Dora", "pg": 59, "pdf": "", "ppg": null, "pcf": 0.4, "txt": "You've gone aswhite as a sheet!’ She herself had felt nothing of this change of colour; but Iexplained to her that the expression of emotion and the play of features obey theunconscious rather than the conscious, and are a means of betraying the former.Another time Dora came to me in the worst of tempers after having beenuniformly cheerful for several days. She could give no explanation of this. Shefelt so contrary to-day, she said; it was her uncle's birthday, and she could notbring herself to congratulate him, she did not know why. My powers ofinterpretation were at a low ebb that day; I let her go on talking, and shesuddenly recollected that it was Herr K.'s birthday too —a fact which I did notfail to use against her."}, {"id": 771, "tr": "classical_freudian", "doc": "Freud_SE_Dora_complete.pdf", "pos": 192, "loc": "none", "int": 0.1, "aff": "analytic exposition", "au": "Freud", "pt": "Dora", "pg": 60, "pdf": "", "ppg": null, "pcf": 0.4, "txt": "which we have been able to ascribe to Dora. This element would rightly fall asacrifice to the censorship of a writer, for he, after all, simplifies and abstractswhen he appears in the character of a psychologist. But in the world of reality,which I am trying to depict here, a complication of motives, an accumulation andconjunction of mental activities—in a word, overdetermination—is the rule. Forbehind Dora's supervalent train of thought which was concerned with herfather's relations with Frau K. there lay concealed a feeling of jealousy whichhad that lady as its object— a feeling, that is, which could only be based upon anaffection on Dora's part for one of her own sex."}, {"id": 772, "tr": "classical_freudian", "doc": "Freud_SE_Dora_complete.pdf", "pos": 215, "loc": "patient", "int": 0.6, "aff": "anxious haste", "au": "Freud", "pt": "Dora", "pg": 67, "pdf": "", "ppg": null, "pcf": 0.4, "txt": "also happened to occur in the exciting cause of the recent recurrence of thedream. I wonder whether the phrase “I dressed quickly” may not also belong tothis context?’‘It was then that I made up my mind not to stop on with the K.'s withoutFather. On the subsequent mornings I could not help feeling afraid that Herr K.would surprise me while I was dressing: so I always dressed very quickly. Yousee, Father lived at the hotel, and Frau K. used always to go out early so as to goon expeditions with him."}, {"id": 773, "tr": "classical_freudian", "doc": "Freud_SE_Dora_complete.pdf", "pos": 288, "loc": "none", "int": 0.15, "aff": "interpretive", "au": "Freud", "pt": "Dora", "pg": 87, "pdf": "", "ppg": null, "pcf": 0.4, "txt": "A daytime thought may verywell play the part of entrepreneur for a dream; but the entrepreneur, who, aspeople say, has the idea and the initiative to carry it out, can do nothing withoutcapital; he needs a capitalist who can afford the outlay, and the capitalist whoprovides the psychical outlay for the dream is invariably and indisputably,whatever may be the thoughts of the previous day, a wish from the unconscious.’Any one who has learnt to appreciate the delicacy of the fabric of structuressuch as dreams will not be surprised to find that Dora's wish that her fathermight take the place of the man who was her tempter called up in her memorynot merely a casual collection of material from her childhood, but precisely suchmaterial as was most intimately bound up with the suppression of her temptation.For if Dora felt unable to yield to her love for the man, if in the end sherepressed that love instead of surrendering to it, there was no factor upon whichher decision depended more directly than upon her premature sexual enjoymentand its consequence—her bed-wetting, her catarrh, and her disgust. An earlyhistory of this kind can afford a basis for two kinds of behaviour in response tothe demands of love in maturity—which of the two will depend upon thesummation of constitutional determinants in the subject. He will either exhibit anabandonment to sexuality which is entirely————————————— This page can be read in German in GESAMMELTE WERKE Vol 5,Page 249 This is a reference to the analysis of a dream quoted in the book as anexample [the dream of ‘Otto looking ill’, in Chapter V, Section D (StandardEdition, 4, 269 ff.).] - 87 - 1 [PEP] 1 Copyrighted Material. For use only by UPENN."}, {"id": 774, "tr": "classical_freudian", "doc": "Freud_SE_Dora_complete.pdf", "pos": 310, "loc": "patient", "int": 0.7, "aff": "dream anxiety", "au": "Freud", "pt": "Dora", "pg": 94, "pdf": "", "ppg": null, "pcf": 0.4, "txt": "I saw the station in front of me and could not reach it. At the same timeI had the usual feeling of anxiety that one has in dreams when one cannotmove forward. Then I was at home. I must have been travelling in themeantime, but I know nothing about that."}, {"id": 775, "tr": "classical_freudian", "doc": "Freud_SE_Dora_complete.pdf", "pos": 334, "loc": "patient", "int": 0.5, "aff": "furtive dread", "au": "Freud", "pt": "Dora", "pg": 100, "pdf": "", "ppg": null, "pcf": 0.4, "txt": "Theydo it in fear and trembling, with an uneasy look over their shoulder to see ifsome one may not be coming. Parents are very much in the way while reading ofthis kind is going on. But this uncomfortable situation had been radicallyimproved, thanks to the dream's power of fulfilling wishes. Dora's father wasdead, and the others had already gone to the cemetery."}, {"id": 776, "tr": "classical_freudian", "doc": "Freud_SE_Dora_complete.pdf", "pos": 342, "loc": "none", "int": 0.2, "aff": "reconstructive", "au": "Freud", "pt": "Dora", "pg": 102, "pdf": "", "ppg": null, "pcf": 0.4, "txt": "Dora had there fore given herself anillness which she had read up about in the encyclopaedia, and she had punishedherself for dipping into its pages. But she was forced to recognize that thepunishment could not possibly apply to her reading the innocent article inquestion. It must have been inflicted as the result of a process of displacement,after another occasion of more guilty reading had become associated with thisone; and the guilty occasion must lie concealed in her memory behind thecontemporaneous innocent one. It might still be possible, perhaps, to discoverthe nature of the subjects she had read about on that other occasion.What, then, was the meaning of this condition, of this attempted simulation ofa perityphlitis?"}, {"id": 777, "tr": "classical_freudian", "doc": "Freud_SE_Dora_complete.pdf", "pos": 394, "loc": "none", "int": 0.05, "aff": "theoretical", "au": "Freud", "pt": "Dora", "pg": 118, "pdf": "", "ppg": null, "pcf": 0.4, "txt": "has been resolved that a patient arrives at a sense of conviction of the validity ofthe connections which have been constructed during the analysis.Some people may feel inclined to look upon it as a serious objection to amethod which is in any case troublesome enough that it itself should multiply thelabours of the physician by creating a new species of pathological mentalproducts. They may even be tempted to infer from the existence of transferencesthat the patient will be injured by analytic treatment. Both these suppositionswould be mistaken. The physician's labours are not multiplied by transference; itneed make no difference to him whether he has to overcome any particularimpulse of the patient's in connection with himself or with some one else."}, {"id": 778, "tr": "classical_freudian", "doc": "Freud_SE_Dora_complete.pdf", "pos": 406, "loc": "clinician", "int": 0.4, "aff": "perplexed stuck", "au": "Freud", "pt": "Dora", "pg": 121, "pdf": "", "ppg": null, "pcf": 0.4, "txt": "Before I had learnt the importance of thehomosexual current of feeling in psychoneurotics, I was often brought to astandstill in the treatment of my cases or found myself in complete perplexity. - 120 - 1 [PEP] 1 Copyrighted Material. For use only by UPENN. Reproduction prohibited. Usage subject to PEP terms & conditions (see terms.pep-web.org)."}, {"id": 779, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 55, "loc": "none", "int": 0.0, "aff": "prefatory", "au": "Freud", "pt": "none", "pg": 23, "pdf": "", "ppg": null, "pcf": 0.72, "txt": "Pref ace to the Second Edition IF within ten ycan of the publication of this book (which is very far from being an easy one to read) a second edition is called for, this is not due to the interest taken in it by the professional circles to whom my original preface was addressed. My psy­ chiatric colleagues seem to have taken no trouble to overcome the initial bewilderment created by my new approach to dreams. The professional philosophers have become accustomed to polishing off the problems of dream-life (which they treat as a mere appendix to conscious states) in a few sentences-and usually in the same ones; and they have evidently failed to notice that we have something here from which a number of inferences can be drawn that are bound to transform our psychological theories. The attitude adopted by reviewers in the scientific periodicals could only lead one to suppose that my work was doomed to be sunk into complete silence; while the small group of gallant supporters, who practise medical psycho-analysis under my guidance and who follow my example in interpreting dreams and make use of their interpretations in treating neurotics, would never have exhausted the fint edition of the book. l'hus it is that I feel indebted to a wider circle of educated and curious-minded readers, whose interest has led me to take up once more after nine ycan this difficult, but in many respects fundamental, work."}, {"id": 780, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 195, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Freud", "pt": "none", "pg": 65, "pdf": "", "ppg": 35, "pcf": 0.72, "txt": "If it is established that the interior of the body when it is in a diseased state becomes a source of stimuli for dreams, and if we admit that during sleep the mind, being diverted from the external world, is able to pay more attention to the interior of the body, then it seems plausible to suppose that the internal organs do not need to be diseased before they can cause excitations to reach the sleeping mind-excitations which arc somehow turned into dream-images. While we arc awake we arc aware of a diffuse general sensibility or coenaesthesia, but only as a vague quality of our mood; to this feeling, accord­ ing to medical opinion, all the organic systems contribute a share. At night, however, it would seem that this same feeling, grown into a powerful influence and acting through its various components, becomes the strongest and at the same time the commonest source for instigating dream-images. If this is so, it would only remai~ to investigate the laws according to which the organic stimuli tum into dream-images."}, {"id": 781, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 231, "loc": "none", "int": 0.1, "aff": "alien wonder", "au": "Freud", "pt": "none", "pg": 78, "pdf": "", "ppg": 48, "pcf": 0.72, "txt": "(E) THE DISTINGUISHING PSYCHOLOGICAL CHARACTERISTICS OF DREAMS Our scientific consideration of dreams starts off from the assumption that they are products of our own mental activity. Nevertheless the finished dream strikes us as something alien to us. We are so little obliged to acknowledge our responsibility for it that [in German] we are just as ready to say 'mir hat getriiumt' ['I had a dream', literally 'a dream came to me'] as 'ich habe getroumt' ['I dreamt']. What is the origin of this feeling that dreams are extraneous to our minds?"}, {"id": 782, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 239, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Freud", "pt": "none", "pg": 80, "pdf": "", "ppg": 50, "pcf": 0.72, "txt": "It is this characteristic that distinguishes true dreams from day.dfeaming, which is never confused with reality. Burdach ( 1838, 502 f.) summarizes the features of dream·life which we have so far discussed in the following words: 'These are among the essential features of dreams: (a) In dreams the subjective activity of our minds appears in an objective form, for our perceptive faculties regard the products of our imagina· tion as though they were sense impressions .... (b) Sleep signifies an end of the authority of the self. Hence falling asleep brings a certain degree of passivity along with it. . . . The images that accompany sleep can occur only on condition that the authority of the self is reduced.' Digitized by Google"}, {"id": 783, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 294, "loc": "none", "int": 0.1, "aff": "moral guilt", "au": "Freud", "pt": "none", "pg": 100, "pdf": "", "ppg": 70, "pcf": 0.72, "txt": "70 I. THE SCIENTIFIC UTERATURE ON DREAMS We feel responsible for the dreamer's errors-not for the whole amount of them, but for a certain percentage. 'In short, if we understand in this scarcely disputable sense Christ's saying that \"out of the heart proceed evil thoughts\" [Matt. xv, 19], we can hardly escape the conviction that a sin committed in a dream bears with it at least an obscure minimum of guilt.' (Hildebrandt, 1875, 51 ff.) Thus Hildebrandt finds the source of immorality in dreams in the germs and hints of evil impulses which, in the form of temptatio!lS, pass through our minds during the day; and he does not hesitate to include these immoral elements in his estimate of a person's moral ·value. These same thoughts, as we know, and this same estimate of them, arc what have led the pious and saintly in every age to confess themselves miserable • 1 sinner:. There can of course be no doubt as to the general existence c,f 'uch incompatible ideas; they occur in most people and in spheres other than that of ethics."}, {"id": 784, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 297, "loc": "none", "int": 0.1, "aff": "self-revelation", "au": "Freud", "pt": "none", "pg": 101, "pdf": "", "ppg": 71, "pcf": 0.72, "txt": "F. THE MORAL SENSE IN DREAMS 71 in which he declares that dreams seem to exist in order to show us our hidden natures and to reveal to us, not what we arc, but what we might have been if we had been brought up differently. Radestock (1879, 84), too, says that dreams often do no more than reveal to us what we would not admit to ourselves and that it is therefore unfair of us to stigmatize them as liars and deceivers. Erdmann [1852, 115] writes: 'Dreams have never shown me what I ought to think of a man; but I have occasion· ally learnt from a dream, greatly to my own astonishment, what I do think of a man and how I feel towards him.' Similarly I."}, {"id": 785, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 305, "loc": "none", "int": 0.3, "aff": "yielding shame", "au": "Freud", "pt": "none", "pg": 103, "pdf": "", "ppg": 73, "pcf": 0.72, "txt": "I have my faults and my vicious impulses; while I am awake I try to resist them, and quite often I succeed in not yielding to them. But in my dreams I always yield to them, or rather I act under their pressure with­ out fear or remorse . • •• The visions which unroll before my mind and which constitute a dream are clearly suggested by the urges which I feel and which my absent will does not attempt to repress.'] 1 ['Thus in dreams a man stands self-revealed in all his native naked­ ness and poverty. As soon as he suspends the exercise of his will, he be­ comes the plaything of all the passions against which he is defended while he is awake by his conscience, his sense of honour and his fears.'] 1 ['What is revealed in dreams is primarily the man of instinct. . •• Man may be said to return in his dreams to a state of nature. But the less his mind has been penetrated by acquired ideas, the more it remains influenced in dreams by impulses of a contrary nature.'] Digitized by Google"}, {"id": 786, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 339, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Freud", "pt": "none", "pg": 114, "pdf": "", "ppg": 84, "pcf": 0.72, "txt": "Imagination in dreams is without the power of concep­ tual speech. It is obliged to paint what it has to say pictorially, and, since there are no concepts to exercise an attenuating influence, it makes full and powerful use of the pictorial form. Thus, however clear its speech may be, it is diffuse, clumsy and awkward. The clarity of its speech suffers particularly from the fact that it has a dislike of representing an object by its proper image, and prefers some extraneous image which will express only that particular one of the object's attributes which it is seeking to represent."}, {"id": 787, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 384, "loc": "none", "int": 0.0, "aff": "anecdotal", "au": "Freud", "pt": "none", "pg": 129, "pdf": "", "ppg": 99, "pcf": 0.72, "txt": "It is told by Artcmidorus [Book IV, Chap. 24; Kraus,,'s translation, 1881, 255]: 'I think too that Aristander gave a most happy interpretation to Alexander of Macedon when he had sur­ rounded Tyre [7\\1po,] and was besieging it but was feeling uneasy and disturbed because of the length of time the siege was taking. Alexander dreamt he saw a satyr [adnipoc'] dancing on his shield. Aristander hap­ pened to be in the neighbourhood of Tyre, in attendance on the king during his Syrian campaign. By dividing the word for satyr into ad and TIJpo' he encouraged the king to press home the siege so that he became master of the city.' (ad Tt1po' - Tyre is thine.)-Indccd, dreams are so closely related to linguistic expression that Fcrenczi [1910] has truly remarked that every tongue has its own dream-language."}, {"id": 788, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 397, "loc": "none", "int": 0.1, "aff": "creative loosening", "au": "Freud", "pt": "none", "pg": 133, "pdf": "", "ppg": 103, "pcf": 0.72, "txt": "Looked at in isolation, a thought may seem very trivial or very fantastic; but it may be made important by another thought that comes after it, and, in conjunction with other thoughts that may seem equally absurd, it may tum out to form a most effective link. Reason cannot form any opinion upon all this unless it retains the thought long enough to look at it in connection with the others. On the other hand, where there is a creative mind, Reason-so it seems to me-relaxes its watch upon the gates, and the ideas rush in pell-mell, and only then does it look them through and examine them in a mass.­ you critics, or whatever else you may call yourselves, are ashamed or frightened of the momentary and transient ex­ travagances which are to be found in all truly creative minds and whose longer or shorter duration distinguishes the thinking artist from the dreamer. You complain of your unfruitfulness because you reject too soon and discriminate too severely.' - Nevertheless, what Schiller describes as a relaxation of the watch upon the gates of Reason, the adoption of an attitude of uncritical self-observation, is by no means difficult."}, {"id": 789, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 419, "loc": "clinician", "int": 0.5, "aff": "defensive reproach", "au": "Freud", "pt": "Irma", "pg": 138, "pdf": "", "ppg": 108, "pcf": 0.72, "txt": "My dream was thus anticipating this occasion: it was my wife's birthday and a number of guests, including Irma, were being received by us in the large hall at Bcllevue. I reproached Irma for not kaui.ng accepted my solution; I said: 'lfyou still get pains, ifs your own fault.' I might have said this to her in waking life, and I may actually have done so. It was my view at that time (though I have since recognized it as a wrong one) that my task was fulfilled when I had informed a patient of the hidden meaning of his symptoms: I considered that I was not responsible for whether he accepted the solution or not-though this was what success depended on. I owe it to this mistake, which I have now fortunately rorrected, that my life was made easier at a time when, in spite of all my inevitable ignorance, I was expected to produce therapeutic succcsses.-I noticed, how­ ever, that the words which I spoke to Irma in the dream showed that I was specially anxious not to be responsible for the pains 1 [A hill which is a favourite resort in the immediate neighbourhood of Vienna.] Digitized by Google"}, {"id": 790, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 452, "loc": "clinician", "int": 0.6, "aff": "guilty awkwardness", "au": "Freud", "pt": "Irma", "pg": 144, "pdf": "", "ppg": 114, "pcf": 0.72, "txt": "The content of the preceding part of the dream had been that my patient's pains were due to a severe organic affection. I had a feeling that I was only trying in ~at way to shift the blame from myself. Psychological treat· ment could not be held responsible for the persistence of diph­ theritic pains. Nevertheless I had a sense of awkwardness at having invented such a severe illness for Irma simply in order to clear myself."}, {"id": 791, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 455, "loc": "clinician", "int": 0.2, "aff": "reluctant recall", "au": "Freud", "pt": "Irma", "pg": 144, "pdf": "", "ppg": 114, "pcf": 0.72, "txt": "M.'s fertility in producing far-fetched explanations and making unexpected pathological connections? Something else now occurred to me in relation to dysentery. A few months earlier I had taken on the case of a young man with remarkable difficulties associated with defaecating, who had been treated by other physicians as a case of 'anaemia accompanied by malnutrition'. I had recognized it as a hysteria, but had been unwilling to try him with my psychotherapeutic treatment and had sent him on a sea voyage."}, {"id": 792, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 458, "loc": "none", "int": 0.2, "aff": "derisive certainty", "au": "Freud", "pt": "Irma", "pg": 145, "pdf": "", "ppg": 115, "pcf": 0.72, "txt": "M. had been called in by him for consultation over a patient who was seriously ill, and had felt obliged to point out1 in view of the very optimistic view taken by his colleague, that he had found albumen in the patient's urine. The other, however, was not in the least put out: 'No matter', he had said, 'the albumen will soon be eliminated!'-! could no longer feel any doubt, therefore, that this part of the dream was expressing derision at physicians who are ignorant of hysteria. And, as though to con­ firm this, a further idea crossed my mind: 'Does Dr. M. realize that the symptoms in his patient (Irma's friend) which give grounds for fearing tuberculosis also have a hysterical basis?"}, {"id": 793, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 461, "loc": "none", "int": 0.2, "aff": "reminiscent unease", "au": "Freud", "pt": "Irma", "pg": 145, "pdf": "", "ppg": 115, "pcf": 0.72, "txt": "When she was feeling unwell, my friend Otto had giDm her an injet· tion. Otto had in fact told me that during his short stay with lnna's family he had been called in to a neighbouring hotel to give an injection to someone who had suddenly felt unwell. These iajections reminded me once more of my unfortunate friend who had poisoned himself with cocaine [seep. lll n.]. I had advised him to use the drug internally [i.e. orally] only, while morphia was being withdrawn; but he had at once given himself cocaine injections."}, {"id": 794, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 469, "loc": "clinician", "int": 0.3, "aff": "anxious worry", "au": "Freud", "pt": "Irma", "pg": 147, "pdf": "", "ppg": 117, "pcf": 0.72, "txt": "Yes. For he had a special knowledge of the consequences of affections of the nose and its accessory cavities; and he had drawn scientific attention to some very remarkable connections between the turbinal bones and the female organs of sex. (Cf. the three curly structures in Irma's throat.) I had had Irma examined by him to see whether her gastric pains might be of nasal origin. But he suffered himself from suppura­ tive rhinitis, which caused me anxiety; and no doubt there was an allusion to this in the pyaemia which vaguely came into my mind in connection with the metastases in the dream. 1 Injections of that sort ought not to be made so thoughtlessly. Here an accusation of thoughtlessness was being made directly against my friend Otto."}, {"id": 795, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 569, "loc": "none", "int": 0.1, "aff": "analytic doubt", "au": "Freud", "pt": "none", "pg": 170, "pdf": "", "ppg": 140, "pcf": 0.72, "txt": "The assertion in which my wish was realized sounded less absurd in the later dream than in the earlier one; it made cleverer use of the actual facts in its construction, like a well­ designed slander of the kind that makes people feel that 'there's something in it'. For one of the professors in his own faculty had voted against my friend R., and my friend N. had himself innocently provided me with the material for my aspersions. Nevertheless, I must repeat, the dream seemed to me to stand in need of further elucidation. I then recalled that there was still a piece of the dream which the interpretation had not touched."}, {"id": 796, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 575, "loc": "none", "int": 0.2, "aff": "conflicted affection", "au": "Freud", "pt": "none", "pg": 171, "pdf": "", "ppg": 141, "pcf": 0.72, "txt": "The affection that I felt for R. could not be derived from the latent dream-thoughts; but no doubt it originated from this struggle of mine. If my dream was distorted in this respect from its latent content-and dis­ torted into its opposite,-then the affection that was manifest in the dream served the purpose of this distortion. In other words, distortion was shown in this case to be deliberate and to be a means of dissi.mulation. My dream thoughts had con­ tained a slander against R.; and, in order that I might not notice this, what appeared in the dream was the opposite, a feeling of affection for him."}, {"id": 797, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 637, "loc": "none", "int": 0.1, "aff": "explanatory", "au": "Freud", "pt": "none", "pg": 186, "pdf": "", "ppg": 156, "pcf": 0.72, "txt": "You came up to your house with the lady on your arm. Thus you were bringing her home, 1 instead of spending the night in her house as you did in reality. There may be more than one reason why the wish-fulfilment which con­ stitutes the core of the dream was disguised in such a disagree­ able form. Perhaps you have learned from my paper on the aetiology of anxiety neurosis [Freud, l 895b] that I regard coitus interruptus as one of the aetiological factors in the development of neurotic anxiety?"}, {"id": 798, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 639, "loc": "none", "int": 0.2, "aff": "nervous worry", "au": "Freud", "pt": "none", "pg": 187, "pdf": "", "ppg": 157, "pcf": 0.72, "txt": "IV. DISTORTION IN DREAMS 157 means of an abortion. I had nothing to do with her carrying out her intention, but for a long time I naturally felt very nervous in case the business came out.'-1 quite understand that. This recollection provides a second reason why you must have been worried by your suspicion that your device might have gone wrong.1 A young physician who heard me describe this dream during a course of lectures must have been greatly struck by it, for he promptly re-dreamt it, applying the same pattern of thought to another theme."}, {"id": 799, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 652, "loc": "none", "int": 0.1, "aff": "theoretical", "au": "Freud", "pt": "none", "pg": 190, "pdf": "", "ppg": 160, "pcf": 0.72, "txt": "On the other hand, we arc justified in linking the unpleasurable character of all these dreams with the fact of dream-distortion. And we are justified in concluding that these dreams are distorted and the wish-fulfilment con­ tained in them disguised to the point of being unrecognizable precisely owing to the repugnance felt for the topic of the dream or for the wish derived from it and to an intention to repress them. The distortion in the dream is thus shown in fact to be an act of the censorship. We shall be taking into account every­ thing that has been brought to light by our analysis of un­ pleasurable dreams if we make the following modification in the formula in which we have sought to express the nature of dreams: a dream is a (disguised) fulfilment of a (suppressed or repressed) wish. i There remain to be discussed anxiety-dreams as a special sub-species of dreams with a ciic1tressing content."}, {"id": 800, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 655, "loc": "none", "int": 0.1, "aff": "neutral", "au": "Freud", "pt": "none", "pg": 191, "pdf": "", "ppg": 161, "pcf": 0.72, "txt": "IV. DISTORTION IN DREAMS 161 regarding these as wishful dreams will meet with very little sympathy from the unenlightened. Nevertheless I can deal with anxiety-dreams very briefly at this point. They do not present us with a new aspect of the dream-problem; what they face us with is the whole question of neurotic anxiety."}, {"id": 801, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 685, "loc": "none", "int": 0.3, "aff": "regretful disappointment", "au": "Freud", "pt": "none", "pg": 200, "pdf": "", "ppg": 170, "pcf": 0.72, "txt": "He clasped his hand to his head and exclaimed: 'I'm so sorry, but I'd quite forgotten. I'll go out at once and fetch your flowers.' But she was not to be consoled; for she recognized that her husband's forgetfulness was a proof that she no longer had the same place in his thoughts as she had formerly.-This lady, Frau L., had met my wife two days before I had the dream, had told her that she was feeling quite well and enquired after me. Some yean ago she had come to me for treatment. I now made a fresh start."}, {"id": 802, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 733, "loc": "none", "int": 0.1, "aff": "assertive", "au": "Freud", "pt": "none", "pg": 212, "pdf": "
