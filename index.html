", "ppg": 182, "pcf": 0.72, "txt": "These particular elements which were originally indifferent are in­ different no longer, since taking over (by means of displace ... mcnt) the value of psychically significant material. Nothing that has real[y remained indifferent can be reproduced in a dream. The reader will rightly conclude from the foregoing argu­ ments that I am asserting that there are no indifferent drcam­ instigators-and consequently no 'innocent' dreams. Those are, in the strictest and most absolute sense, my opinions-if I leave on one side the dreams of children and perhaps brief reactions in dreams to sensations felt during the night."}, {"id": 803, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 744, "loc": "none", "int": 0.1, "aff": "analytic", "au": "Freud", "pt": "none", "pg": 215, "pdf": "", "ppg": 185, "pcf": 0.72, "txt": "A. RECENT AND INDIFFERENT MATERIAL 185 and accordingly it too seems to hint at the same sexual topic which we suspected at the very beginning, when we felt inclined to introduce the phrase about the meat-shop being closed into the original account of the dream. We need not enquire now into the full meaning of the dream. So much is quite clear: it had a meaning and that meaning was far from innocent.1 II Here is another innocent dream, dreamt by the same patient, and in a sense a counterpart to the last one."}, {"id": 804, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 779, "loc": "none", "int": 0.2, "aff": "wistful longing", "au": "Freud", "pt": "none", "pg": 224, "pdf": "", "ppg": 194, "pcf": 0.72, "txt": "194 V . .MATERIAL AND SOURCF.S OF DREAMS longing in my dreams: for at the season of the year when it is possible for me to travel, residence in Rome must be avoided for reasons of health. 1 For instance, I dreamt once that I was looking out of a railway-carriage window at the Tiber and the Ponte Sant' Angelo. The train began to move off, and it occurred to me that I had not so much as set foot in the city. The view that I had seen in my dream was taken from a well­ known engraving which I had caught sight of for a moment the day before in the sitting-room of one of my patients. Another time someone led me to the top of a hill and showed me Rome half-shrouded in mist; it was so far away that I was surprised at my view of it being so clear."}, {"id": 805, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 785, "loc": "none", "int": 0.15, "aff": "surprised curiosity", "au": "Freud", "pt": "none", "pg": 225, "pdf": "", "ppg": 195, "pcf": 0.72, "txt": "A fourth dream, which occurred soon after the last one, took me to Rome once more. I saw a street-comer before me and was surprised to find so many posters in German stuck up there. 3 I had written to my friend with prophetic foresight the day before to say that I thought Prague might not be an agreeable place for a German to walk about in. Thus the dream expressed at the same time a wish to meet him in Rome instead of in a Bohemian 1 [In a letter to FliC88 of June 12, 1897 (Freud, 1950a, Letter 65), Freud mentions that he is making a collection of these anecdotes, of which he was to make great we in his book on jokes (Freud, 1905c). The fint of the present anecdotes is alluded to more than once in his letters, and Rome and Karlsbad come to be identified as symbols of unattainable aims (e.g. in Letter1 112 and 130).] 1 (The German word for 'diabetes' is ',(,w:lurlcranlcheit' ('sugardiseasc').] •[This dream ii discuSlccl in a letter to Flicsa of December 3, 1897 (Freud, 1950a, Letter 77)."}, {"id": 806, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 819, "loc": "none", "int": 0.3, "aff": "impatient injury", "au": "Freud", "pt": "none", "pg": 234, "pdf": "", "ppg": 204, "pcf": 0.72, "txt": "Three women were standing in it; one of them was the hostess of the inn and was twisting something about in her hand, as though she was making Kniidel [dumplings]. She answered that I must wait till she was ready. (These were not definite spoken words.) I felt impatient and went ojf with a sense of injury. I put on an overcoat. But the first I tried on was too long for me."}, {"id": 807, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 869, "loc": "none", "int": 0.1, "aff": "reflective", "au": "Freud", "pt": "none", "pg": 248, "pdf": "", "ppg": 218, "pcf": 0.72, "txt": "It is quite unusual for me to be dis­ turbed in my sleep by physical needs of any kind, especially at the hour at which I awoke on this occasion-a quarter to three in the morning. And I may meet a further objection by remarking that upon other journeys under more comfortable conditions I have scarcely ever felt a need to micturate when I have woken up early. But in any case it will do no harm to leave the point unresolved.1 My experiences in analysing dreams have drawn my atten­ tion to the fact that trains of thought reaching back to earliest childhood lead off even from dreams which seem at first sight to have been completely interpreted, since their sources and instigating wish have been discovered without difficulty. I have therefore been compelled to ask myself whether this character­ istic may not be a further essential preconditien of dreaming."}, {"id": 808, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 878, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Freud", "pt": "none", "pg": 251, "pdf": "", "ppg": 221, "pcf": 0.72, "txt": "However secure the supporters of this theory might feel in its factual basis-especially as far as accidental and external nervous stimuli are concerned, since these can be traced in the content of dreams without any trouble at all-not one of them could fail to perceive that it is impossible to attribute the wealth of ideational material in dreams to external nervous stimuli alone. Miss Mary Whiton Calkins (1893, ·312) examined her own and another person's dreams for six weeks with this question in mind. She found that in only 13·2 per cent and 6·7 per cent of them respectively was it possible to trace the element of external sense-perception; while only two cases in the collection were derivable from organic sensations. Here we have statistical confirmation of what I had been led to suspect from a hasty survey of my own experiences."}, {"id": 809, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 935, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Freud", "pt": "none", "pg": 267, "pdf": "", "ppg": 237, "pcf": 0.72, "txt": "It can do so, not in the sense that it can provide the dream's content, but in the sense that it can force upon the dream-thoughts a choice of the material to be represented in the content by putting forward one part of the material as being appropriate to its own char­ acter and by holding back another part. Apart from this, the coenaesthetic feelings left over from the preceding day link themselves up, no doubt, with the psychical residues which have such an important influence on dreams. This general mood may persist unchanged in the dream or it may be mastered, and thus, if it is unpleasurable, may be changed into its opposite.1 Thus, in my opinion, somatic sources of stimulation during sleep (that is to say, sensations during sleep), unless they arc of unusual intensity, play a similar part in the formation of dreams to that played by recent but indifferent impressions left over from the previous day. I believe, that is, that they are brought in to help in the formation of a dream if they fit in appropriately with the ideational content derived from· the dream's psychical sources, but otherwise not."}, {"id": 810, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 942, "loc": "none", "int": 0.2, "aff": "shamed puzzlement", "au": "Freud", "pt": "none", "pg": 269, "pdf": "", "ppg": 239, "pcf": 0.72, "txt": "Now how did this staircase and this female figure come to be in my dream? The feeling of shame at not being completely dressed is no doubt of a sexual nature; but the maid-servant whom I dreamt about was older than I am, surly and far from attractive. The only answer to the problem that occurred to me was this. When I paid my morning visits to this house I used as a rule to be seized with a desire to clear my throat as I went up the stairs and the product of my expectoration would fall on the staircase."}, {"id": 811, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 982, "loc": "none", "int": 0.0, "aff": "descriptive", "au": "Freud", "pt": "none", "pg": 280, "pdf": "", "ppg": 250, "pcf": 0.72, "txt": "The elder child ill-treats the younger, maligns him and robs him cf his toys; while the younger is consumed with impotent rage against the elder, envies and fears him, or meets his oppressor with the first stirrings of a love of liberty and a sense of justice. Their parents complain that the children do not get on with one another, but cannot discover why. It is easy to see that the character of even a good child is not what we should wish to find it in an adult. Children are completely egoistic; they feel their needs intensely and strive ruthlessly to satisfy them-especially as against the rivals, other children, and first and foremost as against their brothers and sisters."}, {"id": 812, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 986, "loc": "none", "int": 0.1, "aff": "observational", "au": "Freud", "pt": "none", "pg": 281, "pdf": "", "ppg": 251, "pcf": 0.72, "txt": "Many people, therefore, who love their brothers and sisters and would feel bereaved if they were to die, harbour evil wishes against them in their unconscious, dating from earlier times; and these are capable of being realized in dreams. It is of quite particular interest, however, to observe the behaviour of small children up to the age of two or three or a little older towards their younger brothers and sisters. Here, for instance, was a child who had so far been the only one; and now he was told that the stork had brought a new baby. He looked the new arrival up and down and then declared decisively: 'The stork can take him away again!' 1 I am quite seriously of the opinion that a child can form a just estimate of the set-back he has to expect at the hands of the little stranger."}, {"id": 813, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 989, "loc": "none", "int": 0.0, "aff": "observational", "au": "Freud", "pt": "none", "pg": 282, "pdf": "", "ppg": 252, "pcf": 0.72, "txt": "252 V. MATERIAL AND SOURCES OF DREAMS seems only logical that the little favourite should nourish a wish that his new competitor may meet with the same fate as the earlier one, so that he himself may be as happy as he was originally and during the interval. 1 Normally, of course, this attitude of a child towards a younger brother or sister is a simple function of the difference between their ages. Where the gap in time is sufficiently long, an elder girl will already begin to feel the stirring of her maternal instincts towards the helpless new­ born baby. Hostile feelings towards brothers and sisters must be far more frequent in childhood than the unseeing eye of the adult observer can pcrceive.1 In the case of my own children, who followed each other in rapid succession, I neglected the opportunity of carrying out observations of this kind; but I am now making_ up for this neglect by observing a small nephew, whose autocratic rule was upset, after lasting for fifteen months, by the appearance of a female rival."}, {"id": 814, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 1016, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Freud", "pt": "none", "pg": 290, "pdf": "", "ppg": 260, "pcf": 0.72, "txt": "260 V. MATERIAL AND SOURCM OF DREAMS languages, the various ways in which the psychical apparatus reacted to one and the same exciting idea. In the confusional state, in which, as I believe, the second psychical agency was overwhelmed by the normally suppressed first one, her uncon­ llCious hostility to her mother found a powerful motor expression. When the calmer condition set in, when the rebellion was sup­ pressed and the domination of the censorship re-established, the only region left open in which her hostility could realize the wish for her mother's death was that of dreaming."}, {"id": 815, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 1018, "loc": "none", "int": 0.1, "aff": "clinical report", "au": "Freud", "pt": "unnamed", "pg": 290, "pdf": "", "ppg": 260, "pcf": 0.72, "txt": "He spent his days in preparing his alibi in case he might be charged with one of the murders committed in the town. It is unnecessary to add that he was a man of equally high morals and education. The analysis (which, incidentally, led to his recovery) showed that the basis of this distreaing obsession was an impulse to murder his somewhat over-severe father. This impulse, to his astonish­ ment, had been consciously expressed when he was seven years old, but it had, of course, originated much earlier in his child­ hood."}, {"id": 816, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 1055, "loc": "none", "int": 0.2, "aff": "dream recall", "au": "Freud", "pt": "none", "pg": 300, "pdf": "", "ppg": 270, "pcf": 0.72, "txt": "We were obliged, however, to spend the night in a neighbouring inn, at which the news of our accident brought us a lot of sympathy. A gentleman, with unmistakable signs of Basedow's disease-incidentally, just as in the dream, only the brown discoloration of the skin of the face and the protruding eyes, but no goitre-placed him­ self entirely at our disposal and asked what he could do for us. Professor R. replied in his decisive manner: 'Nothing except to lend me a night-shirt.' To which the fine gentleman rejoined: 'I'm sorry, but I can't do that', and left the room. As I continued my analysis, it occurred to me that Basedow was the name not only of a physician but also of a famous educationalist. (In my waking state I no longer felt quite so certain about this.1) But my friend Otto was the person whom I had asked to watch over my children's physical education, especially at the age of puberty (hence the night-shirt), in case anything happened to me."}, {"id": 817, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 516, "loc": "patient", "int": 0.4, "aff": "frustrated withholding", "au": "Caligor et al. (TFP-E)", "pt": "unnamed", "pg": 68, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "You’re describing a variety of ways in which your wife is withholding and leaves you feeling frustrated [ ], and we’ve discussedclarification of defensive object relations organizing patient’s surface experience how your view of her at this moment is discrepant with views you’ve held at other times [ confrontation of ]. It seems that no matter how well things areinstability and dissociation of contradictory representations going, this negative view of the two of you always seems to creep in; I seem to recall your having described the same thing happening with your first wife, who was a very different person from Marcia [ ]. It’s almost as if you are in some way moreconfrontation of repetitive nature of relationship patterns comfortable when you see yourself in a relationship with a woman who is withholding and frustrating, as if at some level it makes you anxious to see yourself as having a wife who wants to take good care of you [ ], so you retreat to the negative view.interpretation of unconscious anxiety motivating defense A more advanced interpretation might address the conflictual motivations associated with the anxiety described, the aspects of experience least accessible, as follows: It’s almost as if you are in some way more comfortable when you see yourself in a relationship with a woman who is withholding and frustrating, as if at some level it makes you anxious to see yourself as having a wife who wants to take good care of you [ ], perhapsinterpretation of anxiety motivating defense for fear it would leave you feeling too dependent on her. ( This more complete interpretation includes a ) So you retreat to the negative view.reference to highly conflictual dependency needs. In sum, as the therapist sequentially makes use of clarification, confrontation, and finally interpretation proper, she moves from surface to depth and from defense to impulse."}, {"id": 818, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 498, "loc": "none", "int": 0.1, "aff": "didactic", "au": "Caligor et al. (TFP-E)", "pt": "none", "pg": 65, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "A classical interpretation in the setting of a neurotic conflict has the following structure: defense, anxiety, impulse. Applying this structure to the current situation results in something such as the following: “You seem to retreat to seeing yourself/the two of us in a certain way [ defensive object ] to avoid anxiety. It is as if to see it otherwise would endanger/threaten our relationship [relation ]—as if any possibility of competitive feeling [anxiety, fear, or ‘danger’ motivating the defense ] would be totally unacceptable.” The objective of interpretationsunderlying conflictual motivation structured in this fashion is to help the patient feel less threatened by and better able to tolerate awareness of her conflictual wishes—in this example, wishes to be admired. Helping the patient tolerate awareness of conflictual motivations is consistent with the overall goal of the interpretive process in a neurotic structure: to promote containment of previously repressed, conflictual motivations within the patient’s overall conscious sense of self (see ) so thatChapter 10 they are contextualized."}, {"id": 819, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 83, "loc": "patient", "int": 0.7, "aff": "anxious awkward", "au": "Caligor et al. (TFP-E)", "pt": "L", "pg": 15, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "L came to a Monday session seeming anxious and initially saying nothing. When she did begin to speak, it was in a halting fashion, interspersed with silences in which she clearly felt uncomfortable. She described having felt “awkward” with her boyfriend over the weekend; usually, she felt no inhibitions with him, but on Sunday, had felt herself to be “acting weird” and “sounding stupid.” She sheepishly acknowledged that when they spoke on the phone on Sunday night, she purposefully disconnected the call and then pretended it was an accident; there had been some silences between them, and she was fearful that in the silence she would say something “weird” or meaningless. Ms."}, {"id": 820, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 308, "loc": "patient", "int": 0.75, "aff": "paralyzed deficient", "au": "Caligor et al. (TFP-E)", "pt": "Mr. Y", "pg": 44, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "Y started to push back, he found himself slipping once again into feeling like a deficient child in relation to a powerful woman who was morally unassailable; he felt paralyzed and isolated. Dr. B suggested to Mr. Y a way of understanding his experience: “I’m struck by the way that as soon as you feel at all angry—or even that you have a right to be angry or that you want to assert yourself with Julia—you become anxious and you back down."}, {"id": 821, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 301, "loc": "patient", "int": 0.7, "aff": "grateful exhilarated", "au": "Kernberg", "pt": "unnamed", "pg": 96, "pdf": "", "ppg": 79, "pcf": 1.0, "txt": "It was at this stage of her analysis that the patient was able for the first time to establish a relation with a man who seemed a more appropriate love object than most of those she had previously chosen. (She married him some time after the completion of her analysis.) Because her capacity to achieve full sexual gratification with this man marked a dramatic change in her relation with him, with the analyst, with her family, and in her general outlook on life, I shall examine this episode more closely. During analysis, the patient became capable of achieving orgasm on a regular basis in intercourse with this man. To her surprise, she found herself crying the first few times after achieving a full orgasm, crying with a sense of embarrassment and, at the same time, relief. She felt deeply grateful to him for giving her his love and his penis; she felt grateful that she could enjoy his penis fully, and at one point during intercourse she had the fantasy that she was embracing a huge penis, spinning around it with a sense of exhilaration while feeling that she was rotating around"}, {"id": 822, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 467, "loc": "dyadic", "int": 0.7, "aff": "guilty seductive", "au": "Kernberg", "pt": "Miss A.", "pg": 142, "pdf": "", "ppg": 125, "pcf": 1.0, "txt": "Love in the Analytic Setting 125 relentlessly provoke situations that frustrated her dependency needs and angry recriminations, escalating to violent interactions and public displays of depression and rage. She would present herself as my victim, which would unfailingly destroy our relationship. As I utilized this countertransference material in my interpretation of the developments in the transference, Miss A/s profound feelings of guilt over the sexualized aspects of the relationship with me became apparent. In contrast to earlier complaints about feeling rejected and humiliated because of my lack of a loving response to her, she now felt anxious, guilty, and upset over her wish to seduce me and evoked an idealized image of my wife (about whom she had no information or awareness)."}, {"id": 823, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 469, "loc": "patient", "int": 0.6, "aff": "guilty conflicted", "au": "Kernberg", "pt": "Miss A.", "pg": 142, "pdf": "", "ppg": 125, "pcf": 1.0, "txt": "In the context of our exploration of the profound guilt feelings that now connected her idealized image of my wife with the idealized image of her own mother, Miss A. realized that she had defended herself against these guilt feelings by splitting the image of mother into the idealized dead one and the feared and depreciated stepmother represented by her rivals, the other women in the life of the men she could never have for herself alone. This awareness also helped to clarify her unconscious selection of \"impossible\" men and the unconscious prohibition against full sexual gratification under conditions other than physical or mental suffering. Miss A. finally established a relationship with a man who in many ways was more satisfactory than her previous lovers. He was not involved with another woman at that time, and he belonged to her own social environment (from which, because of her turbulent life-style, she had felt ostracized)."}, {"id": 824, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 91, "loc": "patient", "int": 0.7, "aff": "panicky paralyzed", "au": "Caligor et al. (TFP-E)", "pt": "Ms. L", "pg": 16, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "L’s efforts to find work and her attitude toward doing so. Ms. L responded that she had gone so far as to update her résumé, print it out, and post it online; however, she felt paralyzed about taking the next step of walking into businesses, such as retail stores, to inquire whether they needed help. When she anticipated doing so, she became confused and panicky, getting stuck on details such as whether she should have her résumé in hand or put it into an envelope."}, {"id": 825, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 225, "loc": "clinician", "int": 0.4, "aff": "struck curious", "au": "Caligor et al. (TFP-E)", "pt": "unnamed", "pg": 34, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "So I’ m a bit surprised to hear that when the guy you were interested in texted you last night, you didn’t respond. What are your thoughts? Therapist: I am struck by your description of feeling childlike in your interactions with your peers at work; when you describe the details [clarification] of what happened in the meeting, it sounds like everyone agreed you handled things in a masterful and assertive fashion. Therapist: You describe yourself as afraid of confrontations, yet in your review, your boss commented on your need to go easier on the junior partners."}, {"id": 826, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 234, "loc": "dyadic", "int": 0.65, "aff": "defensive blaming", "au": "Caligor et al. (TFP-E)", "pt": "unnamed", "pg": 35, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "The therapist said, “I hear that you felt John’s behavior was selfish and withholding, and that you felt controlled by him. At the same time, I’m trying to imagine how he felt when you told him you couldn’t listen to him unless he gave you a hug, even though he might not have felt like hugging you.” The patient responded, “So you’re telling me it’s my fault?” The therapist responded, maintaining a neutral stance and standing outside the situation, hoping to promote the patient’s capacity to observe herself and reflect: “I’m not thinking about fault or blame here. Rather, I’m wondering if when this happens, you and John aren’t kind of in the same boat. Could it be that at the same time that you experience him as withholding and controlling, he experiences you in the same way, when you refuse to discuss things with him until he hugs you?” Comments: In this vignette, the patient is initially locked into her own view of the exchange with John."}, {"id": 827, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 313, "loc": "patient", "int": 0.7, "aff": "frightened small", "au": "Caligor et al. (TFP-E)", "pt": "Mr. Y", "pg": 44, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "B observed, “I’m struck by how in the setting of conflict with Julia, your mind goes directly to the fear of ending up alone [the anxiety motivating the defense—an object relation of a small child and an absent parent, associated with feelings of painful isolation], and the result is that you feel like a small, frightened child.” Dr. B paused, and Mr. Y looked at him expectantly. Dr."}, {"id": 828, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 337, "loc": "patient", "int": 0.7, "aff": "split good/bad", "au": "Caligor et al. (TFP-E)", "pt": "Ms. J", "pg": 46, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "Dr. C went on to say, “It’s as if you have two ways of experiencing things with Hal, all good or all bad. When it’s all good, you’re valued, you feel competent, and you’re able to function, while Hal, even if he’s difficult, seems supportive and appreciative, and as though he sees you as special. Conversely, when it’s all bad, he takes you for granted or, even worse, he sees you as useless; you feel overwhelmed and unable to follow even simple instructions, and then you feel like an absolutely hopeless mess."}, {"id": 829, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 440, "loc": "patient", "int": 0.5, "aff": "polarized states", "au": "Caligor et al. (TFP-E)", "pt": "Ms. J", "pg": 59, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "They noted that she routinely shifted between two polarized, contradictory states in which she either was mistreated and felt incompetent or was highly valued, was taken care of, and felt special. The former was associated with anger and anxiety, and the latter with gratification and relief from anxiety. Meanwhile, throughout this process, Ms. J maintained a relatively stable, positive (idealized) relationship with Dr."}, {"id": 830, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 491, "loc": "dyadic", "int": 0.6, "aff": "inferiority, envy", "au": "Caligor et al. (TFP-E)", "pt": "Ms. S", "pg": 64, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "S acknowledged that this seemed to be true, that she felt more comfortable being in the inferior position; it felt “right,” perhaps because it was familiar. Dr. C agreed that familiarity was likely part of it, but suggested that there seemed to be more: “It’s almost as if you use feelings of inferiority to protect and to ingratiate yourself; as soon as you feel more successful or powerful, you imagine my resenting you, as if I might say to myself, ‘Who is she to feel desirable or successful? I am the one with the successful career and the stylish wardrobe."}, {"id": 831, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 712, "loc": "clinician", "int": 0.6, "aff": "anxious helplessness", "au": "Caligor et al. (TFP-E)", "pt": "Ms. W", "pg": 93, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "P used his reflective capacities to feel less anxious and afraid than he had initially. In essence, his internal processing of his countertransference enabled him to modify, within himself, an initial experience of anxiety and helplessness close in quality to that of his patient’s dissociated experience, transforming it into an experience that was better integrated and less affectively charged, as well as less threatening. Clinical Illustration 7: Working With Countertransference Ms. O was a 45-year-old divorced, professional, childless woman with narcissistic and histrionic features organized at a very high borderline level."}, {"id": 832, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 176, "loc": "none", "int": 0.7, "aff": "erotic awe", "au": "Kernberg", "pt": "unnamed", "pg": 61, "pdf": "", "ppg": 44, "pcf": 1.0, "txt": "At one point, he had the uncanny experience that one of these sculptures, the body of a woman whose nipples and navel were marked by tiny precious stones, resembled the body of the woman he loved. He had been thinking about her, longing for her, as he walked through the almost deserted halls, and while he was looking at the sculpture, a wave of erotic stimulation seized him, together with an intense feeling of closeness to her. He also was very much moved by what he considered the extreme simplicity and beauty of the sculpture, and he felt that he could empathize with the unknown artist, who had died more than four thousand years ago. He had a sense of humility and yet of reassuring communication with the past and felt as if he had been allowed to share the understanding of the eternal mystery of love expressed in that work of art."}, {"id": 833, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 303, "loc": "none", "int": 0.6, "aff": "grateful guilt", "au": "Kernberg", "pt": "unnamed", "pg": 97, "pdf": "", "ppg": 80, "pcf": 1.0, "txt": "Her new experience was something that belonged to her now and could not be taken away. She felt grateful and guilty at the same time for the love this man had given her while she had been, as she now realized, so envious and suspicious of him, so bent upon not giving herself fully to him to avoid his supposed \"triumph\" over her as a woman. And she felt she had been able to open herself up to enjoying her body and her genitals in spite of the internal prohibitions stemming from the fantasied orders of her mother and stepmother. She had become free of the terror of becoming sexually excited with an adult man who treated her like an adult woman (thus breaking the oedipal taboo)."}, {"id": 834, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 489, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Kernberg", "pt": "none", "pg": 149, "pdf": "", "ppg": 132, "pcf": 1.0, "txt": "McDougall (personal communication) has called attention to the more primitive and diffuse nature of castration anxiety in women, their unconscious fear of general bodily destruction, as a major dynamic that would explain their different defensive structures against castration anxiety. Chasseguet-Smirgel (198^) has described perversions, in patients with borderline pathology, as the condensation of preoedipal aggression with oedipally determined castration anxiety. Preoedipal aggression intensifies by projection the oedipally determined castration anxiety. ChasseguetSmirgel emphasized the regression to anal sexuality as underlying the unconscious denial of the differences between generations and genders, the defensive idealization of the perversion, the devaluation of genital intercourse, and the general deterioration of object relations."}, {"id": 835, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 509, "loc": "none", "int": 0.2, "aff": "case summary", "au": "Kernberg", "pt": "unnamed", "pg": 155, "pdf": "", "ppg": 138, "pcf": 1.0, "txt": "138 Masochistic Pathology was reenacting the oedipal submission to a sadistic, guilt-raising mother, unconsciously hoping to be rescued by a powerful, good father; but the husband's conciliatory behavior reinforced her submission to mother. A man with long-standing self-defeating patterns in his work and a paranoid attitude toward authority—the source, he thought, of his shortcomings, was married to a strong, protective wife who had sacrificed her career to dedicate herself to a husband whose achievements she very much admired. At home, he found a safe haven from his real and imagined slights at work, and her needs to be protective and giving were gratified. Over the years, however, she could not fail to see his contributions to his difficulties, and, afraid of her own exasperation with his behavior at work and feeling guilty for not living up to her ideal of a perfect spouse, she became even more solicitous while withdrawing socially."}, {"id": 836, "tr": "structural_kernberg", "doc": "Anen_Narcissistic States of White Privilege an", "pos": 75, "loc": "clinician", "int": 0.5, "aff": "patient treading", "au": "Anen", "pt": "Lisa", "pg": 14, "pdf": "", "ppg": 633, "pcf": 1.0, "txt": "Lisa’s remarks were subsequently met with anger and multiple criticisms, including how Lisa’s nonresident status meant she was not a full and active member of campus life, an observation that she had not forged friendships with her peers, challenges about the presumed similarity between her student status with being a Person of Color in the U.S., and, lastly, that she was an example of White privilege rather than a challenge to it. Lisa was mortified and livid, painting her classmates as cruel and her teacher as indifferent, aghast that she had not intervened when the discourse had become focused on Lisa. Lisa ended the recollection of her classroom experience by declaring loudly to me, “I just want to go back in my bubble!” Our therapy initially focused on her sense of having been attacked as well as her pain of feeling unjustly misunderstood. I felt a need to tread patiently, allowing Lisa space to begin processing her distress through grievance."}, {"id": 837, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 193, "loc": "patient", "int": 0.3, "aff": "down", "au": "Caligor et al. (TFP-E)", "pt": "unnamed", "pg": 30, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "Therapist: You said you’ve not been feeling very well. Can you tell me more about how you’ve been feeling? Patient: I’ve been feeling really down on myself. Therapist: In what way?"}, {"id": 838, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 194, "loc": "patient", "int": 0.5, "aff": "unattractive, dispensable", "au": "Caligor et al. (TFP-E)", "pt": "unnamed", "pg": 30, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "Patient: Well, I am really unhappy with my appearance, and now I’m going into the weekend feeling like my boyfriend doesn’t really care whether I’m there or not. He could easily replace me with someone else. Therapist: So it sounds like you’re feeling unattractive and not like someone your boyfriend would really care about or find special? Is that an accurate description of how you’re feeling?"}, {"id": 839, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 196, "loc": "clinician", "int": 0.3, "aff": "confused", "au": "Caligor et al. (TFP-E)", "pt": "none", "pg": 30, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "In the setting of splitting-based defenses, it is common for a patient’s communications to be vague, superficial, incomplete, and difficult to follow; it is also common for the TFP-E therapist to feel confused as to what a patient functioning at a borderline level of personality organization (BPO) is trying to say or what he is describing, and often the patient will find himself confused as well. Facts and events may be incompletely or vaguely described, representations may be shadowy or poorly differentiated, and affects may be superficial and poorly integrated. In this setting, the process of clarification entails helping the patient more clearly and specifically attend to and articulate his external and internal experience; ultimately, this process will help the patient think more specifically about—and use less denial in relation to—his external reality and behavior, and help him observe and put words to his internal experience. Clinical Illustration 1: Clarification With an NPO Patient Mr."}, {"id": 840, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 203, "loc": "clinician", "int": 0.5, "aff": "confused", "au": "Caligor et al. (TFP-E)", "pt": "Ms. J", "pg": 31, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "And I feel very depressed. Dr. C: I’m confused. What did you mean when you said you were late because you were paralyzed and couldn’t get out of bed?"}, {"id": 841, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 264, "loc": "patient", "int": 0.6, "aff": "overwhelmed, tearful", "au": "Caligor et al. (TFP-E)", "pt": "Ms. J", "pg": 39, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "Ms. J was having difficulty both making it into work and functioning once she got there. She felt unable to follow instructions, became easily overwhelmed and confused, and was often tearful. It was clear to Dr."}, {"id": 842, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 266, "loc": "clinician", "int": 0.3, "aff": "observant", "au": "Caligor et al. (TFP-E)", "pt": "Ms. J", "pg": 39, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "C, meanwhile, was well aware that Ms. J’s current attitude, although one she had held toward many other bosses and positions in the past, was entirely discrepant with how she had been feeling in her current position until recently. Dr. C decided to confront the patient’s dissociation of her current view from how she had felt until recently: “I understand that there are problems with Hal—that he doesn’t seem to value you and leaves you feeling bossed around—and that you are having great difficulty getting to work and doing your job once you get there."}, {"id": 843, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 267, "loc": "patient", "int": 0.6, "aff": "paralyzed, inept", "au": "Caligor et al. (TFP-E)", "pt": "Ms. J", "pg": 39, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "You describe very familiar experiences, both of being paralyzed in the mornings, and—if you are able to drag yourself in to work—of feeling overwhelmed and inept, unable to think straight or follow instructions. [These were experiences that Ms. J had repeatedly had at previous jobs and that had been explored at length in earlier sessions through the process of clarification, with Dr. C helping Ms. J to elaborate the specifics of her experience while in these states.] At the same time, there is something that really gets my attention; I’m wondering if you would be interested in hearing my thoughts.” Ms."}, {"id": 844, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 285, "loc": "patient", "int": 0.5, "aff": "undeserving, anxious", "au": "Caligor et al. (TFP-E)", "pt": "Ms. J", "pg": 42, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "Now I’m not saying you are necessarilyconfrontation right or wrong; that’s not my point. What I am struck by is your assumption. It is as if you find it difficult to even imagine that a man you are attracted to might be interested in you, as if entertaining such a possibility would make you anxious. It’s as if, deep down, a part of you believes that you don’ t deserve to be the one getting his attention, especially when you imagine that your girlfriend would also like to hear from him—as if you believe that to pursue his interest, and in the process to compete with your girlfriend, would make you selfish or somehow not a good person [ ].interpretation Therapist: I understand that you feel I am critical of you; at the same time, you have spent most of this session criticizing me and the way I’ve handled your treatment."}, {"id": 845, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 289, "loc": "dyadic", "int": 0.5, "aff": "choppy oscillation", "au": "Caligor et al. (TFP-E)", "pt": "Ms. J", "pg": 42, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "Therapist: I’m struck by how discontinuous these two experiences of yourself and of your treatment are. It’ s as if you feel, as you did last time, that all is lost and I [the therapist] have nothing to offer—or as you do today, you feel hopeful and that all is well, that I will be able to lead you to safe harbor. When you’re in the negative, hopeless state, that’s all there is and you can think of nothing else, and on the other, positive and hopeful side, the negativity is lost to you [ ].confrontation Patient: That’s true; it’s how it feels. Choppy."}, {"id": 846, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 307, "loc": "patient", "int": 0.5, "aff": "compelled, anxious", "au": "Caligor et al. (TFP-E)", "pt": "Mr. Y", "pg": 44, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "Y would often start to see Julia as treating him unfairly, and he would feel that he had a right to be angry. In that frame of mind, he would attempt to set limits on her demands, but as soon as he opened his mouth, he would quickly become anxious and back down; it was as if he felt compelled to give in, even though this was not what he wanted to do. “It’s like I can’t help myself,” he said. As soon as Mr."}, {"id": 847, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 412, "loc": "clinician", "int": 0.8, "aff": "flustered, shocked", "au": "Caligor et al. (TFP-E)", "pt": "Mr. G", "pg": 57, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "You’re just another stuck-up, condescending twat who thinks she is above me and thinks she knows what’s best for me.” Mr. G glowered contemptuously at Dr. Y, who felt flustered, struck by the intensity of Mr. G’s hostility and derision, and somewhat shocked by his referring to her as a “twat.” She was mindful of what seemed to be escalating agitation on Mr."}, {"id": 848, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 418, "loc": "dyadic", "int": 0.6, "aff": "accusatory standoff", "au": "Caligor et al. (TFP-E)", "pt": "Mr. G", "pg": 58, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "that with your charging me a full fee, too—you could charge me less, you don’t need the money, but this makes you feel powerful and superior.” Dr. Y restated, “So if I understand correctly, I charge you a full fee because I want to feel powerful and superior, and I want you to take an entry-level job because I would enjoy your sense of humiliation. Is that accurate?” Mr. G corroborated that this was indeed what was happening: “You got it!"}, {"id": 849, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 485, "loc": "patient", "int": 0.7, "aff": "shrinking, anxious", "au": "Caligor et al. (TFP-E)", "pt": "Ms. S", "pg": 63, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "S immediately looked very uncomfortable and commented, “When you say that, it makes me very anxious.” Dr. C inquired about the source of Ms. S’s anxiety. The patient responded, “I don’t know—first off, it’s like I want to shrink down to nothing in my chair, almost literally, like I could disappear."}, {"id": 850, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 502, "loc": "patient", "int": 0.5, "aff": "wistful continuity", "au": "Caligor et al. (TFP-E)", "pt": "Ms. S", "pg": 65, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "We had lunch on them every day as kids, and then I fed kids from them when they were children. Mother never really engaged with us, butmy she did so well with the traditions, the ceremonial parts of life. I have such a sense of time with J’s daughter getting engaged: my father’s dementia is progressing, I’m finally building my house to make it a home where someday grandchildren can visit…. there’s a sense of time and generations, looking forward rather than coming from where I was. It used to feel so choppy.” Dr."}, {"id": 851, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 517, "loc": "none", "int": 0.0, "aff": "didactic", "au": "Caligor et al. (TFP-E)", "pt": "none", "pg": 68, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "Beginning with Dissociative Defenses Before Addressing Repression Moving from surface to depth, from material most accessible to the patient to material less available to conscious experience, implies that the therapist typically addresses dissociative defenses before addressing repression. This means focusing first on aspects of the patient’s experience that are currently dissociated—not part of his dominant experience in the moment, but that have been fully conscious at other times. Thus, in the example above, the therapist began by addressing dissociative defenses: You’ve described a variety of ways in which your wife is withholding and leaves you feeling frustrated; this seems discrepant with our discussion last week when you were telling me about how generous she is when you really need her to come through. You’re describing a variety of ways in which your wife is withholding and leaves you feeling frustrated; I’ m struck by how these are the exact same words you told me that she used to describe last week, whenyou you had that argument."}, {"id": 852, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 519, "loc": "patient", "int": 0.45, "aff": "defensive retreat", "au": "Caligor et al. (TFP-E)", "pt": "unnamed", "pg": 69, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "It’s almost as if you are in some way more comfortable when you see yourself in a relationship with a woman who is withholding and frustrating, as if at some level it makes you anxious to see yourself as having a wife who wants to take good care of you, perhaps for fear it would leave you feeling too dependent on her. So you retreat to the negative view. In sum, from the perspective of , we move from surface to depth and from defense tocontent impulse as we make use of clarification, confrontation, and finally interpretation proper. At the same time, from the perspective of within the patient, we begin with interventions that demandcapacities less of the patient, focusing on his dominant, conscious, and ego-syntonic experience, and move gradually toward interventions that call on more advanced capacities for affect containment, selfobservation, introspection, and greater flexibility of thinking."}, {"id": 853, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 667, "loc": "clinician", "int": 0.7, "aff": "protective fear", "au": "Caligor et al. (TFP-E)", "pt": "Ms. W", "pg": 88, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "She appeared free of all anxiety, while Dr. P noted that he was feeling afraid for the child and in some way responsible for protecting her. Making use of this countertransference, Dr. P ventured an interpretation, pointing out that it seemed Ms."}, {"id": 854, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 720, "loc": "clinician", "int": 0.4, "aff": "contained discomfort", "au": "Caligor et al. (TFP-E)", "pt": "none", "pg": 94, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "At times, the therapist will act in response to these feelings, sometimes despite active efforts not to do so, engaging in various forms of countertransference acting out by turning in some way to action to relieve uncomfortable emotional states activated within the therapist by the patient or by the clinical situation. Thus, even though countertransferences in the treatment of patients with more severe personality disorders tend to be relatively easy to identify, they are often difficult to contain, leaving the therapist at risk for engaging in some form of countertransference acting out ( ; ).Joseph 1987/1988 Pick 1985 Common forms of such acting out in this setting include emotional withdrawal from the patient or, conversely, being drawn into a dialogue, inadvertently communicating hostility, behaving seductively, unnecessarily setting limits, or inappropriately tolerating contract violations. In contrast to the relatively extreme, acute countertransference reactions often encountered when treating patients who function at a borderline level of personality organization, chronic forms of these reactions are frequently expressed in the therapist’s maintaining a particular attitude toward or feeling about a patient over time. Chronic countertransferences that are especially likely to be overlooked may be activated by patients whom a therapist views as in some way special—for example, as particularly needy, vulnerable, or desirable—or, in the setting of more severe pathology, perhaps particularly fragile, brittle, or unstable."}, {"id": 855, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 742, "loc": "clinician", "int": 0.55, "aff": "burdened urgency", "au": "Caligor et al. (TFP-E)", "pt": "Ms. W", "pg": 96, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "P came to feel that his behavior had been driven largely by his countertransferential need to unburden himself; he recognized that if he felt it clinically indicated to introduce a safety net for the child, there were ways that he could strategically go about doing so. When Ms. W came to her next session, she was silent. Dr."}, {"id": 856, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 745, "loc": "clinician", "int": 0.8, "aff": "compelled anxiety", "au": "Caligor et al. (TFP-E)", "pt": "Ms. W", "pg": 96, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "P found himself unable to contain his countertransferential anxiety. In the moment, he felt compelled to act, somewhat impulsively, in an effort to alleviate the extremely uncomfortable feelings that Ms. W had engendered in him. In retrospect, Dr."}, {"id": 857, "tr": "structural_kernberg", "doc": "FT 3a. Brightman - Narcissistic Transformation", "pos": 19, "loc": "none", "int": 0.2, "aff": "threatened ideal", "au": "Brightman", "pt": "none", "pg": 6, "pdf": "", "ppg": 6, "pcf": 1.0, "txt": "All of these elements threaten the trainee's sense of goodness and power to cure. In this phase of treatment, one is in pan setting up certain catabolic processes in the patient in terms of the disruption of tried-and-true coping mechanisms, and the patient's distress at this will not support the therapist's wish to be a soothing, nurturant parent. Third, t1je trainee's increased sense of security in the training program. and trust in supervisors and fellow trainees results in a greater willingness to risk self-disclosure and the sharing of reviousl conc al 'Ierne ts of the rofessional self-ima e, in partlCU ar those which conflict with the idealized professional self. Gradually, a critical point is reached where each new experience in therapy, supervision, peer relations and selfobservation threaten to produce a major insult to the idealized professional self-image as its supportive defenses lose their integrity in the face of undeniable contradictory ' evidence from the above sources."}, {"id": 858, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 178, "loc": "none", "int": 0.1, "aff": "", "au": "Kernberg", "pt": "unnamed", "pg": 62, "pdf": "", "ppg": 45, "pcf": 1.0, "txt": "Mature Sexual Love 45 strong sense of his own individuality, together with gratitude for the opportunity to share the experience of this work of art and with humility. Sexual passion reactivates and contains the entire sequence of emotional states that assure the individual of his own, his parents', the entire world of objects' \"goodness\" and the hope of the fulfillment of love despite frustration, hostility, and ambivalence. Sexual passion assumes the capacity for continued empathy with—but not merger into—a primitive state of symbiotic fusion (Freud's [1930] \"oceanic feeling\"), the excited reunion of closeness with mother at a stage of self-object differentiation, and the gratification of oedipal longings in the context of overcoming feelings of inferiority, fear, and guilt regarding sexual functioning. Sexual passion is the facilitating core of a sense of oneness with a loved person as part of adolescent romanticism and, later, mature commitments to the beloved partner in the face of the realistic limitations of human life, the unavoidability of illness, decay, deterioration, and death."}, {"id": 859, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 244, "loc": "none", "int": 0.1, "aff": "", "au": "Kernberg", "pt": "unnamed", "pg": 82, "pdf": "", "ppg": 65, "pcf": 1.0, "txt": "On the contrary, extremely suspicious of being exploited by men and, at the same time, tending herself to exploit men financially and emotionally, she obtained sensual gratification only from being held physically while sleeping with them at night or from feeling that they were providing her with drugs without asking questions or making any demands on her other than for her sexual favors. She presented, however, the capacity of loyalty to a man she lived with as long as her demands were met and she felt in control of the relationship; she reacted with sudden devaluation and abandonment of him only when she feared that she was being exploited or treated unfairly. Her history included physical abuse by her mother and sexual abuse by a stepfather. Early success in elementary school related to her high intelligence was followed by a gradual deterioration of her functioning because of lack of investment in her work during the later years of high school."}, {"id": 860, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 275, "loc": "patient", "int": 0.7, "aff": "envious awakening", "au": "Kernberg", "pt": "unnamed", "pg": 90, "pdf": "", "ppg": 73, "pcf": 1.0, "txt": "He noticed that he was becoming more interested in her thoughts and feelings, that he could enjoy her moments of happiness with her, that he was becoming deeply curious about the interior life of another human being. He finally realized how terribly envious he had been of his wife's independent interests, her friends, her belongings, the thousand little secrets he felt she shared with other women and not with him. He realized that by consistently depreciating and devaluating her, he had made her empty and boring for him and had made himself fearful lest he have to drop her as he had dropped other women. At the same time, he experienced a dramatic change in his internal attitude during sexual intercourse."}, {"id": 861, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 295, "loc": "patient", "int": 0.7, "aff": "exhilarated realization", "au": "Kernberg", "pt": "unnamed", "pg": 94, "pdf": "", "ppg": 77, "pcf": 1.0, "txt": "He realized how terribly prohibitive and frowning he had envisioned all women (mother) to be about sex. He also realized, with a feeling of exhilaration, that the warmth, humidity, odor, and taste of his fiancee's body and genitals excited rather"}, {"id": 862, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 296, "loc": "patient", "int": 0.75, "aff": "surprised excitement", "au": "Kernberg", "pt": "unnamed", "pg": 95, "pdf": "", "ppg": 78, "pcf": 1.0, "txt": "78 Psychopathology than repelled him, and his feeling of shame and disgust turned into sexual excitement and satisfaction. To his surprise, he did not have a premature ejaculation while having intercourse with her, and he understood that this was related to his having lost, at least temporarily, the feeling of anger and resentment against her as a woman. He recognized during the ensuing weeks that his staying at his office and being involved sexually with his fiancee represented a rebellion against his father and his mother and against those aspects of his religious convictions that represented a rationalization of superego pressures. This patient, in his adolescence, had had the fantasy that Jesus was watching him, particularly when he was spying on his sisters' girlfriends, trying to glimpse their bodies while they were undressing."}, {"id": 863, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 311, "loc": "none", "int": 0.1, "aff": "", "au": "Kernberg", "pt": "none", "pg": 99, "pdf": "", "ppg": 82, "pcf": 1.0, "txt": "The unconscious wish to repair the dominant pathogenic relationships from the past and the temptation to repeat them in terms of unfulfilled aggressive and revengeful needs result in their reenactment with the loved partner. By means of projective identification, each partner tends to induce in the other the characteristics of the past oedipal and/or preoedipal object with whom he or she experienced conflicts. Projective identification is a primitive yet prevalent defense mechanism that consists in the tendency to project an impulse onto another person, fear of the other person under the influence of the projected impulse, the unconscious tendency to induce such an impulse in the other person, and the need to control the other person under the influence of this mechanism. If early conflicts around aggression were severe, the possibility arises of reenacting primitive, fantastically combined mother-father images that carry little resemblance to the actual characteristics of the parental objects."}, {"id": 864, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 378, "loc": "patient", "int": 0.5, "aff": "surprised satisfaction", "au": "Kernberg", "pt": "unnamed", "pg": 117, "pdf": "", "ppg": 100, "pcf": 1.0, "txt": "She felt that she loved him and was unaware that her tendency to blame him and see herself as a helpless victim was poisoning their relationship, that her childishly clinging and guilt-raising behavior repeated aspects of her mother's relationship with her father, and her own relationship with her father during her early adolescence. When she met a man who had been her boyfriend in early adolescence and whom she had idealized since then, she embarked on an affair with him which proved satisfying sexually. She was surprised to experience"}, {"id": 865, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 379, "loc": "patient", "int": 0.55, "aff": "conflicted gratification", "au": "Kernberg", "pt": "unnamed", "pg": 118, "pdf": "", "ppg": 101, "pcf": 1.0, "txt": "Superego Functions 101 herself fully satisfied as a woman and to perceive an increase in her sense of security and self-esteem. At the same time, she found her love for her husband renewed, which made her feel both guilty about the extramarital affair and appreciative of the positive aspects of their life together. In fact, over a period of time she discovered that the emotional aspects of the relationship with her husband were much more satisfying than those with her lover, although, simultaneously, she experienced full sexual gratification with her lover, which she thought her husband would not be able to provide her. This conflict led her into psychoanalytic treatment, and to the gradual awareness of her unconscious inability to experience a fully satisfactory emotional and sexual relationship with the same man."}, {"id": 866, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 401, "loc": "patient", "int": 0.5, "aff": "guilty depression", "au": "Kernberg", "pt": "unnamed", "pg": 123, "pdf": "", "ppg": 106, "pcf": 1.0, "txt": "His wife's somewhat timid and shy demeanor, the similarity of their backgrounds, her reluctance to enter into a sexual relationship with him before their marriage, all had attracted him. Once they were married, her lack of sexual responsiveness, which he at first had dismissed as owing to inexperience, became a growing source of dissatisfaction. At the same time, he blamed himself for his inability to gratify her sexually, felt increasingly insecure in approaching her, and finally reduced his sexual advances, so that, at the time of consultation, they were having sexual intercourse only once or twice a month. He also felt increasingly depressed, consciously guilty for not being more available to his wife and children, yet relieved when he was away from home and submerged in his work."}, {"id": 867, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 412, "loc": "none", "int": 0.3, "aff": "unconscious guilt", "au": "Kernberg", "pt": "unnamed", "pg": 126, "pdf": "", "ppg": 109, "pcf": 1.0, "txt": "His sexual inhibition reflected the reactivation of his profound guilt over his sexual interest in his sisters, and the perception of his wife as an ideal, disappointed, and disgusted mother. At a still later stage of his analysis, unconscious guilt over aggression related to earlier frustrations at mother, unconscious rage at feeling that she had neglected him, and guilt over a serious, life-threatening illness his mother had experienced in his early childhood, and for which he had unconsciously felt responsible, emerged as major themes. Furthermore, in connection with the inhibition of his competitive strivings in his work, unconscious guilt over his success in business emerged as a new element. He felt that a bad marriage was a fair price to pay for that success, which unconsciously represented triumph over his father."}, {"id": 868, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 420, "loc": "none", "int": 0.2, "aff": "theoretical", "au": "Kernberg", "pt": "none", "pg": 128, "pdf": "", "ppg": 111, "pcf": 1.0, "txt": "The most frequent expression of superego projection, however, is one partner's experience of the other as a relentless persecutor, a moral authority who takes sadistic pleasure in making the other feel guilty and crushed; and the second partner experiences the first as unreliable, deceitful, irresponsible, and treacherous, attempting to \"get away with it.\" These roles are often interchangeable. As a consequence of mutual projective identifications, the partners may be highly effective in reinforcing or even inducing the very characteristics they dread in the other. Persistent sadomasochistic relationships without the interventions of excluded third parties are probably the most frequent manifestations of severe superego pathology. The relationships may initially permit satisfactory sexual relations, but in the long run the sadomasochistic interactions affect the couple's sexual functioning as well."}, {"id": 869, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 478, "loc": "patient", "int": 0.7, "aff": "fused excitement", "au": "Kernberg", "pt": "unnamed", "pg": 146, "pdf": "", "ppg": 129, "pcf": 1.0, "txt": "In analyzing this experience, she expressed the fantasy that her husband was like a hungry, frustrated infant biting mother's breasts, and she, as a powerful, understanding, and giving mother, could gratify his needs while tolerating his aggression. At the same time, she felt, she was a sexual woman relating to her husband-infant, who thus was not a threatening father, and also taking revenge against father who had abandoned her, as well as against her husband, who had caused her pain, by causing him in turn to bleed. And she felt that to scratch him while embracing him tightly intensified their fusion and her sense that she could participate in his orgasm while he could participate in hers. This woman, who was approaching completion of her analysis, was able to articulate important facets of normal sexual excitement and erotic desire."}, {"id": 870, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 547, "loc": "patient", "int": 0.65, "aff": "humiliated despair", "au": "Kernberg", "pt": "Mr. L.", "pg": 165, "pdf": "", "ppg": 148, "pcf": 1.0, "txt": "148 Narcissism marital relationship. He triumphantly told me about all his sexual exploits, only to fall back into a sense of despair because of his incapacity to maintain a sexual relationship with a woman who would matter to him emotionally. At such times he felt strongly inclined to end the treatment because it was not helping him to overcome this problem. He gradually became aware that, although he hoped that I did not suffer from the same problem he did, the idea that I might have a good marital relationship filled him with a sense of inferiority and humiliation."}, {"id": 871, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 554, "loc": "dyadic", "int": 0.55, "aff": "sadistic excitement", "au": "Kernberg", "pt": "Mr. L.", "pg": 166, "pdf": "", "ppg": 149, "pcf": 1.0, "txt": "My efforts to interpret in the transference how Mr. L. might be defending himself against similar concerns about Miss F. brought about his gradual awareness not only of how much he enjoyed the sadistic nature of his treatment of Miss F. and her tolerance of it. He also recognized that even if she was trying to manipulate him, his feeling so much in control of their relationship gave him a sense of excitement. A new theme then emerged in the treatment: namely, Mr."}, {"id": 872, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 600, "loc": "none", "int": 0.2, "aff": "theoretical", "au": "Kernberg", "pt": "none", "pg": 177, "pdf": "", "ppg": 160, "pcf": 1.0, "txt": "Splitting the image of mother into a maternal and desexualized wife and a sexually exciting but emotionally devalued mistress differs from more purely oedipally determined splitting. The preoedipal determinants emerge in the childlike, dependent, subtle exploitative relationship of the narcissistic man to both women, his sense of entitlement and indignation when their needs do not correspond totally with his, and the incapacity to sustain either of these relationships for an extended period of time without a compensatory relationship with other women. This same pattern may be observed in women who need to be courted simultaneously and constantly by two or more men. Sometimes these conditions induce a genuine sense of despair and a wish to resolve the situation in the one who must hold onto two members of the other gender."}, {"id": 873, "tr": "structural_kernberg", "doc": "Otto Kernberg - Love Relations_ Normality And ", "pos": 695, "loc": "none", "int": 0.15, "aff": "clinical reflection", "au": "Kernberg", "pt": "none", "pg": 202, "pdf": "", "ppg": 185, "pcf": 1.0, "txt": "In evaluating a couple, I am interested in the extent to which the relationship permits a sense of internal freedom and emotional stimulation, the extent to which their sexual experiences are rich, renewing, and exciting, the extent to which they can experiment sexually without feeling imprisoned either by each other or by the social environment, and, above all, the extent to which the couple is autonomous in the sense that it can remain self-generating throughout time, regardless of changes in their children, the surrounding environment, or the social structure. If the choice of living on the surface of one's self provides a satisfactory degree of stability and gratification, there is no reason for a therapist to challenge this on an ideological or perfectionistic basis. If the couple's presenting complaint is sexual indifference, it is helpful to remember that boredom is the most immediate manifestation of lack of contact with deeper emotional and sexual needs. But not everyone has the capacity or the willingness to open that Pandora's box."}, {"id": 874, "tr": "structural_kernberg", "doc": "Anen_Narcissistic States of White Privilege an", "pos": 19, "loc": "clinician", "int": 0.6, "aff": "anxious shame", "au": "Anen", "pt": "none", "pg": 5, "pdf": "", "ppg": 624, "pcf": 1.0, "txt": "I thought it prudent to detail the overlap between White privilege and class privilege and I also reviewed how focusing on one type of privilege potentially marginalizes certain identities as well as activating resistance in others (YoungBruehl, 2007 ; Fors, 2018 ). Undeniably, privilege occurs varyingly across an array of identity classes, but why did I initially feel it necessary to examine all of these contextualizing ideas first? This preemptory qualifying did seem to hazard a demonstration of self-gratifying, selfcongratulatory reflection wherein I play the good White liberal willing to carefully inves - tigate Whiteness. However, those early draft pages also revealed defenses against a multitude of feelings, anxiety and shame especially, activated by increased engagement with my Whiteness and the benefits and protections that it bestows unearned."}, {"id": 875, "tr": "structural_kernberg", "doc": "Anen_Narcissistic States of White Privilege an", "pos": 37, "loc": "none", "int": 0.1, "aff": "theoretical", "au": "Anen", "pt": "none", "pg": 8, "pdf": "", "ppg": 627, "pcf": 1.0, "txt": "Consequently, the structural racism that produces White privilege promotes inequitable opportunities to provide a good-enough, benign environment. Here again we might consider the idea of privileges that everyone should have developmentally and across the life span. Whole and lack, visible and invisible, self-defined and undifferentiated, centered and alone, privileged subjectivity is a paradoxical condition wherein narcissistic wholeness requires dissociation. White privilege is inherently a paradox because many of its elemental features are both real and fantasy. 2 Being invisible, alone, without lack, as well as always feeling recognized as self-as-subject are all ultimately fantasies, albeit ones nurtured by society."}, {"id": 876, "tr": "structural_kernberg", "doc": "Anen_Narcissistic States of White Privilege an", "pos": 48, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Anen", "pt": "none", "pg": 10, "pdf": "", "ppg": 629, "pcf": 1.0, "txt": "Of course, when misattunement or aggression occur, shame is objectively undeserved. However, recognizing shame as undeserved is not fluent; I imagine most can quickly summon an image of someone who is suggestible to being shamed, a shame proneness. Such an individual has difficulty in processing why they are feeling shame, intentionally or accidentally. How shame is mentalized thus represents a powerful means through which the affect’s impact is differentiated."}, {"id": 877, "tr": "structural_kernberg", "doc": "Anen_Narcissistic States of White Privilege an", "pos": 71, "loc": "patient", "int": 0.5, "aff": "shamed, constrained", "au": "Anen", "pt": "Lisa", "pg": 14, "pdf": "", "ppg": 633, "pcf": 1.0, "txt": "existed in conflict, such as Lisa’s desire to be left without restrictions on her personal freedom while also seeking and appreciating the many benefits received from her family, with whom she still lived and provided ongoing monetary allowances. Lisa routinely felt shamed by her mother, both through frequent misunderstandings but also through harsh, sometimes mocking, disapprovals. She recounted multiple scenarios of being told how she should think and behave, leaving Lisa little room to feel able to use her family for guidance and emotional support. It appeared difficult for Lisa to avoid painful, aggressive interactions while living at home."}, {"id": 878, "tr": "structural_kernberg", "doc": "Anen_Narcissistic States of White Privilege an", "pos": 72, "loc": "dyadic", "int": 0.55, "aff": "urgent hunger", "au": "Anen", "pt": "Lisa", "pg": 14, "pdf": "", "ppg": 633, "pcf": 1.0, "txt": "Sessions were often spent exploring feelings of anger and helplessness along with wishes for her parents to change, which inevitably fostered further anger and helplessness. In an early session, Lisa described a recent struggle to get her way with her parents as “wanting to have her cake and eat it too.” I responded that Lisa’s desires for understanding and support felt impossible, just like having one’s cake and eating it too was not possible. Lisa asked for clarification, to which I noted her use of the idiom to portray attempts to get her way. Lisa explained that she had used the phrase to express a sense of urgency, like she was “starving” and wanted her way immediately."}, {"id": 879, "tr": "structural_kernberg", "doc": "Anen_Narcissistic States of White Privilege an", "pos": 76, "loc": "clinician", "int": 0.75, "aff": "embarrassed, tempted", "au": "Anen", "pt": "Lisa", "pg": 14, "pdf": "", "ppg": 633, "pcf": 1.0, "txt": "She believed that she had been treated shame - fully, framing her classmates and teacher as cruel aggressors. In stark contrast, I privately felt embarrassment for Lisa, not just how she had activated her peers but that she appeared unable to consider her contributions to the class confrontation. Shaming her further for a failure in awareness was tempting, my own shameful impulse, albeit looking back, PSYCHOANALYTIC DIALOGUES 633"}, {"id": 880, "tr": "structural_kernberg", "doc": "Anen_Narcissistic States of White Privilege an", "pos": 77, "loc": "clinician", "int": 0.8, "aff": "conflicted restraint", "au": "Anen", "pt": "Lisa", "pg": 15, "pdf": "", "ppg": 634, "pcf": 1.0, "txt": "I suspect also a pull in the countertransference to become another critical and dismissive authority. Doing so would have risked pushing Lisa toward compliance with my perspective in a moment where she was desperate to her have distress affirmed. I can remember feeling conflicted between a desire to recognize her duress without having to restore Lisa’s narcissistic wholeness through validation of her having been mistreated. Sensing my aggressive impulse to shame Lisa enabled me to step into a reconsideration of her reaction, eventually viewing Lisa as wounded by the dissonance between her self-representation and those of her classmates."}, {"id": 881, "tr": "structural_kernberg", "doc": "Anen_Narcissistic States of White Privilege an", "pos": 89, "loc": "clinician", "int": 0.6, "aff": "aggressive temptation", "au": "Anen", "pt": "Lisa", "pg": 17, "pdf": "", "ppg": 636, "pcf": 1.0, "txt": "I think there can be a strong temptation to push someone out of privilege’s nest; I feel it toward others, I did toward Lisa, as well as sometimes believe myself deserving of a nudge or even a kick. There can be a value to the push, particularly when anxiety about narcissistic disruption has provoked avoidance. But factoring in narcissistic states of consciousness as a feature of privilege means having to consider the individual’s ability to facilitate integration between subjective and objective awareness of identity necessary for deserved shame. Checking privilege risks a catastrophic undoing of going-on-being, but also holds the potential for repair (Swartz, 2020 )."}, {"id": 882, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 73, "loc": "clinician", "int": 0.5, "aff": "deadened", "au": "Caligor et al. (TFP-E)", "pt": "Mr. G", "pg": 14, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "Over the next few weeks, Mr. G continued to speak in an apparently meaningful way about himself and the difficulties in his marriage. Nevertheless, Dr. Y felt that the treatment had taken on a somewhat deadened quality, very different from the storminess of previous months."}, {"id": 883, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 84, "loc": "patient", "int": 0.6, "aff": "awkward, dread", "au": "Caligor et al. (TFP-E)", "pt": "L", "pg": 15, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "L went on to say that she had recently found herself feeling awkward talking to others, which she thought was because she was spending so much time alone. Her family had gone out of town 5 days earlier, and since then she had essentially stayed home, speaking to no one. The more time she spent alone, the more “weird” and “awkward” she felt. She went on to say that she was supposed to go out to dinner with her boyfriend and his father but she wanted to cancel; she was sure the father would find her disappointing, not smart enough, and not living up to his expectations, even though he had been very taken with her in the past."}, {"id": 884, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 103, "loc": "patient", "int": 0.65, "aff": "anxious, perverse", "au": "Caligor et al. (TFP-E)", "pt": "Ms. S", "pg": 16, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "S disclosed feeling increasingly anxious, worrying that she was somehow excessively aggressive and intrusive, even perverse, in her interest in Dr. C. Comments: This example illustrates that with NPO patients, even minor or subtle deviations from the frame are often of psychological significance and may be the first sign of developments in the transference. At the same time, if things are going well in the treatment, the therapist may take more time to address minor deviations from the frame than would be typical in the treatment of BPO patients."}, {"id": 885, "tr": "structural_kernberg", "doc": "Psychodynamic_Therapy_for_Personality_Patholog", "pos": 128, "loc": "none", "int": 0.2, "aff": "didactic", "au": "Caligor et al. (TFP-E)", "pt": "unnamed", "pg": 21, "pdf": "", "ppg": null, "pcf": 0.03, "txt": "For example, a therapist who finds himself chronically concerned about being criticized by a particular patient and somehow feeling guilty that he is at fault can use that countertransference to make inferences about the patient’s internal situation and chronic unhappiness. Clinical Illustrations Identifying Aff
