oy my analyst or that I can work out my life autonomously, without the help of others. In the infant ’s experience of herself as merged with the Self, she feels all-powerful. As she grows, ordinary daily experiences begin to undermine this sense of omnipotence, and the baby ’s “I” begins to separate from the Self."}, {"id": 639, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 177, "loc": "none", "int": 0.0, "aff": "none", "au": "Sullivan", "pt": "none", "pg": 36, "pdf": "", "ppg": 64, "pcf": 0.95, "txt": "When the axis is injured – when the “I”’s capacity for relatedness is compromised – the connection between consciousness and the in ﬁnite unconscious, O, is impaired. The “I” is cut o ﬀ from its instinctual roots, its creativity, its basic aliveness. Throughout the life cycle, the Self is experienced mainly in projection. This is especially true in childhood, when the parents carry the Self for the baby and growing child, so that experiences of not being accepted or understood are equivalent to feeling rejected by God or the universe rather than understood for what they are: the failings of limited human beings."}, {"id": 640, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 178, "loc": "none", "int": 0.0, "aff": "none", "au": "Sullivan", "pt": "none", "pg": 36, "pdf": "", "ppg": 64, "pcf": 0.95, "txt": "As I mentioned above, in psychotherapy or analysis, the Self is typically projected onto the practitioner, who is felt to be much larger than life. Jung described this process using a series of medieval woodcuts to trace the typical development and resolution of the transference relationship. These pictures show a king and queen meeting, undressing and descending together into a 64 The creative unconscious and the Self"}, {"id": 641, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 183, "loc": "patient", "int": 0.6, "aff": "blessed, magical", "au": "Sullivan", "pt": "unnamed", "pg": 37, "pdf": "", "ppg": 65, "pcf": 0.95, "txt": "In our inﬂated, individualistic culture, it is always a last resort to ask for help. As he feels welcomed and cherished by his therapist, the transference becomes established and light breaks over him. He feels something that religious texts would call blessed. His therapist seems to be the very best ever and his connection with her comes to feel magically potent, as though it could heal all his pain and su ﬀering."}, {"id": 642, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 184, "loc": "none", "int": 0.0, "aff": "none", "au": "Sullivan", "pt": "none", "pg": 37, "pdf": "", "ppg": 65, "pcf": 0.95, "txt": "In the transference relationship, where the practitioner is carrying the Self, the injured ego-Self axis is being repaired. Both O and the Self function in the analyst, in the patient and, most especially, between the two, in the couple. Both of these concepts evoke a sense of a nonmaterial psychic force that surrounds the person rather than being “inside” her. Both Bion and Jung become vague in their descriptions of The creative unconscious and the Self 65"}, {"id": 643, "tr": "self_psychology", "doc": "kohut - The disorders of the self and their tr", "pos": 35, "loc": "patient", "int": 0.7, "aff": "fragmenting anxiety", "au": "Kohut", "pt": "unnamed", "pg": 7, "pdf": "", "ppg": 419, "pcf": 1.0, "txt": "psychoanalytic treatment of the most severely disturbed patients with narcissistic personality disorders. Here a patient - 418 - might respond to even minor rebuffs, whether from the side of the analyst or in his daily life, with a deep loss of the sense of the continuity of his self in time and of its cohesiveness in space—a psychic condition that produces profound anxiety. The feeling, in particular, that various body parts are beginning not to be held together anymore by a strong, healthy awaren ess of the totality of the body-self, leads to apprehensive brooding concerning the fragments of the body, often expressed by the patient in the form of hypochondriacal worry concerning his health. Unlike th e chronic hypochondriacal preoccupati ons encountered in some psychoses, however, even the most severe and quasi-delusional analogous worries in the narcissistic personality disorders are the direct consequence of some specific, identifiable narcissistic injury, and they disappear, often with dramatic speed, as soon as a bridge of empathy with an understanding selfobject has been built."}, {"id": 644, "tr": "self_psychology", "doc": "The Psychoanalytic Study of the Child - Though", "pos": 90, "loc": "patient", "int": 0.4, "aff": "softened anger", "au": "Kohut", "pt": "unnamed", "pg": 29, "pdf": "", "ppg": 390, "pcf": 0.6, "txt": "In still later stages of his analysis when the patient had already mastered a large part of his psychological difficulties, and especially when certain homosexual fantasies of which he was very ashamed had disappeared, some anger at idealized figures for withholding their approval continued to be in evidence—but now there was not only benign humor instead of sarcasm, and companionship instead of isolation, but also the ability to see some positive features in those he criticized, side by side with their defects. Now another clinical example: patient P ., whose attitude toward his 8-year-old son was very revealing.12 He was in general on excellent terms with the boy and spent a good deal of time with him in enjoyably shared activities. He could, however , become suddently outraged about minor transgressions, and would then punish the child severely. Slowly, as the analysis proceeded, he became aware of his narcissistic vulnerability and realized that he tended to respond with violent anger when he felt frustrated by narcissistically cathected objects."}, {"id": 645, "tr": "self_psychology", "doc": "Rules of Clinical Understanding in Classical P", "pos": 25, "loc": "none", "int": 0.0, "aff": "none", "au": "(classical/self comparison)", "pt": "none", "pg": 6, "pdf": "", "ppg": null, "pcf": 0.25, "txt": "The product is held to account for its own genesis. Self psychology, in other words, uses causes to account for behavior or for a perceived subjective state. (\"You feel this way because your mother did not give you enough of a sense of being loved.\") Classical psychoanalysis, as we shall see, does not. To reiterate, self-psychological interpretations, not only the one considered here, but those generally found in the literature, seem to assume that selftheory informs and is present in the manifest content in two ways. The first concerns the constancy of the relation of the individual elements."}, {"id": 646, "tr": "self_psychology", "doc": "Rules of Clinical Understanding in Classical P", "pos": 56, "loc": "none", "int": 0.0, "aff": "none", "au": "(classical/self comparison)", "pt": "none", "pg": 13, "pdf": "", "ppg": null, "pcf": 0.25, "txt": "In contrast, the experience of affect or impulse is inner and subjective. Classical theory allows us to ask how this translation from subjective impulse to objective discourse is effected. It answers with a series of rules, possible ways in which a transformation and translation may take place. Classical theory and analysis tolerate, indeed exist in, the paradox of subjective impression and the necessity of expressing that impression in words that have objective meaning."}, {"id": 647, "tr": "self_psychology", "doc": "Rules of Clinical Understanding in Classical P", "pos": 63, "loc": "patient", "int": 0.65, "aff": "anxious trespass", "au": "(classical/self comparison)", "pt": "R", "pg": 14, "pdf": "", "ppg": null, "pcf": 0.25, "txt": "Once they went farther than they ever had before. It was exciting, but she felt she was trespassing and, as they continued, became increasingly anxious. Then she remembers waking from a nightmare as a child and running to her parents' bedroom. Her father returned her to her own bed."}, {"id": 648, "tr": "self_psychology", "doc": "Rules of Clinical Understanding in Classical P", "pos": 64, "loc": "patient", "int": 0.8, "aff": "yearning, terror, humiliation", "au": "(classical/self comparison)", "pt": "R", "pg": 14, "pdf": "", "ppg": null, "pcf": 0.25, "txt": "Thus, the phrase also expresses that which is apparently defended against. It says: \"I want to be close to you, but I try not to let us know about that because I know if I do feel these 436 yearnings for closeness, I will also feel sexual excitement. Then I will remember my terror , and worse, I will remember the humiliation of how I was cast aside as a child and of how I had to stay alone in my own bed at night. I don't want to remember that."}, {"id": 649, "tr": "self_psychology", "doc": "kohut - The disorders of the self and their tr", "pos": 7, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Kohut", "pt": "none", "pg": 2, "pdf": "", "ppg": 414, "pcf": 1.0, "txt": "The de cisive steps forward in the understanding of these disorders, however, were made thro ugh the introduction of the concept of the selfobject and via the increasing understanding of the self in depth-psychological terms. Selfobjects are objects which we experience as part of our self; the expected control over th em is, therefore, closer to the concept of the control which a grown-up expects to have over his own body and mind than to the concept of the control which he expects to have over others. There are two kinds of se lfobjects: those who respond to and confirm the child's innate sense of vigour, greatness and perfection; and those to whom the child can look up and with whom he can merge as an image of calmness, infallibility and omnipot ence. The first type is referred to as the mirroring selfobject, the second as the idealized parent imago."}, {"id": 650, "tr": "self_psychology", "doc": "kohut - The disorders of the self and their tr", "pos": 11, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Kohut", "pt": "none", "pg": 3, "pdf": "", "ppg": 415, "pcf": 1.0, "txt": "- 414 - various emotions—triumph, joy; despair, rage—accompany these changes in the state of the self. If our self is firmly established, we shall neither be afraid of the dejection that may follow a failure nor of the expansive fantasies that may follow a success—reactions that would endanger those with a more precariously established self. Among the secondary disturbances belong also the reactions of the self to physical illness or to the incapacities of a structural neurosis, e.g. the dejection or the anger experienced when incurable muscular paralysis or chronic neurotic anxiety inhibit a person from pursuing his central self-enhancing goals. And even certain reactions of relatively undamaged layers of the self to the conseque nces of its own primary dist urbances—such as dejection over the fact that a damaged self's vulnerability has led to social isolation—should be counted among the secondary disturbances of the self."}, {"id": 651, "tr": "self_psychology", "doc": "The Psychoanalytic Study of the Child - Though", "pos": 2, "loc": "none", "int": 0.2, "aff": "intellectual fascination", "au": "Kohut", "pt": "none", "pg": 1, "pdf": "", "ppg": 362, "pcf": 0.6, "txt": "The present essay deals in a preliminary form with the first two of these three topics; the scope of the third topic is briefly outlined at the end. 360 suicide. Kleist and his work are almost unknown outside the circle of the German language, but my fascination with his short essay—and with another one of his stories—has, as I can see in retrospect, a specific significance in my own intellectual development: it marks the first time that I felt drawn to the topic that has now absorbed my scientific interest for several years. Ever since I read Kleist's story during my school days I had puzzled about the mysterious impact which the plain account has on the reader . A male ballet dancer , we are told, asserts in a fictitious conversation with the author that, by comparison with human dancing, the dance of puppets is near-perfect."}, {"id": 652, "tr": "self_psychology", "doc": "The Psychoanalytic Study of the Child - Though", "pos": 19, "loc": "clinician", "int": 0.4, "aff": "worried agreement", "au": "Kohut", "pt": "none", "pg": 6, "pdf": "", "ppg": 367, "pcf": 0.6, "txt": "We must ask ourselves in particular whether our emphasis on the genetic and dynamic importance of the vicissitudes of the formation and cohesion of the self may not lead to a deemphasis of the crucial genetic and dynamic role played in normal and abnormal development by the specific object-instinctual investments of the oedipus complex. A short while ago a younger colleague whom I might consider to be a pupil and who, at any rate, has followed my work on narcissism with interest, reviewed the relationship between the generations in our field and, speaking for the rising generation of analysts, suggested that the anxiety of the older group was not so much \"that we become grownup, but that we become different\" (Terman, 1972). I thought that the clear implication of this incisive statement was that the older generation was concerned less about being endangered by the oedipal killing wish than about being deprived in the narcissistic realm— and I felt strongly inclined to agree with this opinion. But then I began to worry."}, {"id": 653, "tr": "self_psychology", "doc": "The Psychoanalytic Study of the Child - Though", "pos": 28, "loc": "none", "int": 0.2, "aff": "didactic", "au": "Kohut", "pt": "none", "pg": 9, "pdf": "", "ppg": 370, "pcf": 0.6, "txt": "How, for example, a sense of low self-esteem relates to phallic comparisons and a feeling of castration, how cycles of triumphant self-confidence and depression relate to fantasies of oedipal success and the discovery of being in fact excluded from the primal scene, and the like. Surely, I need not elaborate here. Now to the second form of paradigmatic psychopathology. I have chosen to focus on a specific, somewhat complex type of narcissistic disorder despite its comparative infrequency because its examination is very instructive. (Cases, it may be added, in which the narcissistic blows suffered by the child in the oedipal phase lead to the first straight-forward breakdown of the self are much more common.) I believe that, among the in principle analyzable disorders, it confronts the analyst with one of his most trying and difficult therapeutic tasks."}, {"id": 654, "tr": "self_psychology", "doc": "Rules of Clinical Understanding in Classical P", "pos": 3, "loc": "none", "int": 0.0, "aff": "expository", "au": "(classical/self comparison)", "pt": "none", "pg": 2, "pdf": "", "ppg": null, "pcf": 0.25, "txt": "Presented at the Fall Meeting of the American Psychoanalytic Association, December 20, 1985, and at scientific sessions of the New York Psychoanalytic Institute, April 22, 1986, and the Canadian Psychoanalytic Society, November 6, 1986. Accepted for publication September 26, 1985. 421 self psychology and classical psychoanalysis with reference to one very narrow, but influential, area, that of exegesis, or the rules that govern interpretation in each. I intend interpretation in its broadest sense to cover all understanding of the patient by the analyst, not just what the latter says to the patient. I shall contend that self psychology adheres to a system of interpretation that is contrary, not complementary, to that of classical psychoanalysis, and that the two systems are incompatible."}, {"id": 655, "tr": "self_psychology", "doc": "Rules of Clinical Understanding in Classical P", "pos": 22, "loc": "none", "int": 0.2, "aff": "interpretive", "au": "(classical/self comparison)", "pt": "R", "pg": 6, "pdf": "", "ppg": null, "pcf": 0.25, "txt": "R. has lost something and temporarily imagines it to be hers again. In this second description, the signifier \"gems\" is given another 426 hidden meaning, the experiences with the father . This attribution of meaning is not explicit; it is accomplished implicitly, through a metaphor . The inference to be drawn from the metaphor is that the repressed, nuclear self equals the sum of the good but unsustained contacts with the father ."}, {"id": 656, "tr": "self_psychology", "doc": "Rules of Clinical Understanding in Classical P", "pos": 62, "loc": "patient", "int": 0.5, "aff": "wounded complaint", "au": "(classical/self comparison)", "pt": "R", "pg": 14, "pdf": "", "ppg": null, "pcf": 0.25, "txt": "In that sense, the patient's words are a complaint, with a referent in the treatment relationship, and express the pain of a narcissistic wound. In the present stage of the treatment, however , this phrase has other , more immediate meanings. For one, the phrase functions as a resistance to further exploration. It says: \"I am so hurt, I am not able to go farther and it's your fault.\" More important, as she associates further , she remembers the many times she explored an abandoned estate with her father ."}, {"id": 657, "tr": "self_psychology", "doc": "Rules of Clinical Understanding in Classical P", "pos": 71, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "(classical/self comparison)", "pt": "none", "pg": 15, "pdf": "", "ppg": null, "pcf": 0.25, "txt": "The reasons for this humble position vis-à-vis the patient and his material are prescribed by conflict theory. Because drives are seen as energy, they are seen to cause internal movement, wish, signal anxiety, and defense. The interaction of these components creates the phenomenon of substitution, of one desired object for another , more acceptable, which represents the first, and so on in a chain that ends in various compromise formations including sublimations, symptoms, and character traits. Not only do manifest elements have another Copyrighted Material."}, {"id": 658, "tr": "self_psychology", "doc": "Rules of Clinical Understanding in Classical P", "pos": 72, "loc": "none", "int": 0.2, "aff": "anxious fragmenting", "au": "(classical/self comparison)", "pt": "none", "pg": 16, "pdf": "", "ppg": null, "pcf": 0.25, "txt": "content, mental energy directly and indirectly rearranges the relations between elements as well. Relations between elements have manifest and latent forms. It follows that a manifest formal resemblance between a patient's dream and analytic theory of the kind we found self psychology making use of in interpretation does not imply the relevance of the theory. Where self psychology would likely understand a patient's statement that he was \"fragmenting\" as evidence for the incohesiveness of the self, a classical interpreter 438 would understand only that the patient was experiencing intense anxiety (Gediman, 1983)."}, {"id": 659, "tr": "self_psychology", "doc": "Rules of Clinical Understanding in Classical P", "pos": 73, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "(classical/self comparison)", "pt": "unnamed", "pg": 16, "pdf": "", "ppg": null, "pcf": 0.25, "txt": "That interpreter could not know what the anxiety is about, what wish instigates it, what danger the patient foresees, and what defensive measures, however ineffective, he calls upon. Fragmenting, in this example, is a word used to communicate an internal state. Classical analysis explores the reasons why the patient uses the word, and this exploration may include the fact that the word belongs to the analyst's theory. Through the word, analyst and analysand explore the reasons for which the state occurs."}, {"id": 660, "tr": "self_psychology", "doc": "Rules of Clinical Understanding in Classical P", "pos": 78, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "(classical/self comparison)", "pt": "none", "pg": 17, "pdf": "", "ppg": null, "pcf": 0.25, "txt": "Classical theory allows us to understand how and why this may occur . It does not tell us what specifically to find. Classical theory gives us the principles by which meaning becomes disguised and distorted. It tells us that there will be an interaction of wishes, anxiety, and defense."}, {"id": 661, "tr": "self_psychology", "doc": "Rules of Clinical Understanding in Classical P", "pos": 79, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "(classical/self comparison)", "pt": "none", "pg": 17, "pdf": "", "ppg": null, "pcf": 0.25, "txt": "It may even suggest a likely area of wish (e.g., oral or phallic), the kind of danger situation generally imagined, the kind of defensive patterns possibly employed. It does not, however , tell us which wishes toward which people or things, which danger situations, which defenses, or which current situations stimulate them. It gives us rules for discerning patients' reasons. It does not give us the reasons themselves."}, {"id": 662, "tr": "self_psychology", "doc": "Rules of Clinical Understanding in Classical P", "pos": 88, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "(classical/self comparison)", "pt": "none", "pg": 19, "pdf": "", "ppg": null, "pcf": 0.25, "txt": "Self psychology reiterates theory in its interpretations; classical psychoanalytic interpretations move away from theoretical generalizations toward specific fantasy-memory constellations. Finally, theory in self psychology organizes directly the content of interpretations; theory in classical psychoanalysis organizes a technique of exploration and furnishes general sequences (e.g., wish, anxiety, defense) according to which the data can be understood. This view of classical analysis differs from Kohut's characterization. If it is accepted, it follows that there can be no question of one theory for one type of patient and another for another ."}, {"id": 663, "tr": "self_psychology", "doc": "kohut - The disorders of the self and their tr", "pos": 24, "loc": "none", "int": 0.1, "aff": "developmental reflection", "au": "Kohut", "pt": "none", "pg": 5, "pdf": "", "ppg": 417, "pcf": 1.0, "txt": "However great our disappointment as we discover the weaknesses and limitations of the idealized selfobjects of our early life, their self-confidence as they carried us when we we re babies, their security when they allowed us to merge our anxious selves with their tranquillity—via their calm voices or via our closeness with their relaxed bodies as they held us—will be retained by us as the nucleus of the strength of our leading ideals and of the calmness we experience as we live our lives under the guidance of our inner goals. It is only in the light of our appreciation of the crucial influence exerted on the development of the self by the personality of the selfobjects of chil dhood, that we are able to trace the genetic roots of the disorders of the self. Psychoanalytic case histories tended to emphasize certain dramatic incidents, certain grossly traumatic events—from the child's witnessing the 'primal scene' to the loss of a parent in childhood. But we have come to incline to the opinion that such traumatic events may be no more than clues that point to the truly pathogenic factors, the unwholesome atmosphere to which the ch ild was exposed during the years when his self was established."}, {"id": 664, "tr": "self_psychology", "doc": "kohut - The disorders of the self and their tr", "pos": 25, "loc": "none", "int": 0.1, "aff": "developmental", "au": "Kohut", "pt": "none", "pg": 5, "pdf": "", "ppg": 417, "pcf": 1.0, "txt": "Taken by themselves, in other words, these events leave fewer serious disturbances in their wake than the chronic ambience created by the deep-rooted attit udes of the selfobjects, since even the still vulnerable self, in the process of formation, can cope with seriou s traumata if it is embedded in a healthily supportive milieu. The essence of the healthy matrix for the growing self of the child is a mature, cohesive parental self that is in tune with the changing needs of the child. It ca n, with a glow of shared joy, mirror the child's grandiose display one minute, yet, perhaps a minute later, should the child become anxious and over-stimulated by its exhibitionism, it will curb the display by adopting a realistic attitude vis-à-vis the child's limitations. Such optimal frustrations of the child's need to be mirrored an d to merge into an idealized selfobject, hand in hand with optimal gratifications, generate the appropriate growth-facilitating matrix for the self."}, {"id": 665, "tr": "self_psychology", "doc": "kohut - The disorders of the self and their tr", "pos": 30, "loc": "patient", "int": 0.4, "aff": "deadened apathetic", "au": "Kohut", "pt": "none", "pg": 6, "pdf": "", "ppg": 418, "pcf": 1.0, "txt": "This is a chronic or recurrent condition of the self, the propensity to which arises in consequence of prolonged lack of stimulating responsiveness from the side of the selfobjects in childhood. Such personalities are lacking in vitality. They experien ce themselves as boring and apathetic, and they are experienced by others in the same way. Individuals whose nascent selves have been insufficiently responded to will use any available stimuli to create a pseudo-excitement in order to ward off the painful feeling of deadness that tends to overtake them."}, {"id": 666, "tr": "self_psychology", "doc": "kohut - The disorders of the self and their tr", "pos": 33, "loc": "patient", "int": 0.5, "aff": "depleted clumsy", "au": "Kohut", "pt": "none", "pg": 6, "pdf": "", "ppg": 418, "pcf": 1.0, "txt": "They occur in all of us when our self-esteem has been taxed for prolonged periods and when no replenishing sustenance has presented itself. We all may walk home after a day in which we suffered a series of self-esteem-shaking failures, feeling at sixes and sevens within ourselves. Our gait and posture will be less than graceful at such times, our movements will tend to be cl umsy, and even our mental f unctions will show signs of discoordination. Our patients with narcissistic personality disorders will not only be more inclined to react with such fragmentation symptoms to even minor disappointments, but their symptoms will tend to be more severe."}, {"id": 667, "tr": "self_psychology", "doc": "kohut - The disorders of the self and their tr", "pos": 36, "loc": "dyadic", "int": 0.55, "aff": "rupture and repair", "au": "Kohut", "pt": "unnamed", "pg": 7, "pdf": "", "ppg": 419, "pcf": 1.0, "txt": "A frequently occurring sequence of events during the analysis of pa tients who have established a mirror transference will demonstrate this point. When the mirr or transference is in balance, the pa tient, sensing the analyst's empathic attention, feels whole and self-acceptin g. Subsequent to an erroneous in terpretation, however—e.g. following a session in which the analyst had addressed himself to some detail of the patient's psychic life when, in fact (after some progress in treatment, for example, or after some external success), the patient had offered his total self for approval—the patient's feeling of wholeness which had been maintained via the transference disappears. It is reestablished when the analyst restores the empathic tie to the selfobject by correctly interpreting the sequence of events that had led to its disruption."}, {"id": 668, "tr": "self_psychology", "doc": "kohut - The disorders of the self and their tr", "pos": 37, "loc": "patient", "int": 0.45, "aff": "overstimulated anxious", "au": "Kohut", "pt": "none", "pg": 7, "pdf": "", "ppg": 419, "pcf": 1.0, "txt": "The overstimulated self. The propensity towards recurrent states during which the self is overstimulated arises in consequence of unempathically excessive or phase-inappr opriate responses from the side of the selfobjects of childhood, either vis-à-vis the activities of the grandiose-exhibitionis tic pole of the child's nascent self or vis-àvis the activities of the pole that harbours the guiding ideals, or both. If it was the grandiose-exhibitionistic pole of a person's self that had been exposed to unempathic overstimulation in childhood, then no healthy glow of enjoyment can be obtained by him from external success. On the contrary, since these people are subj ect to being flooded by unr ealistic, archaic greatness fantasies which produce painful tension and anxiety, they will try to avoid situations in which they could become the centre of attention."}, {"id": 669, "tr": "self_psychology", "doc": "kohut - The disorders of the self and their tr", "pos": 40, "loc": "patient", "int": 0.5, "aff": "unsoothed overwhelmed", "au": "Kohut", "pt": "none", "pg": 8, "pdf": "", "ppg": 420, "pcf": 1.0, "txt": "self in toto, the overburdened self is a self that had not been provided with the opportunity to merge with the calmness of an omnipotent selfobject. The overburdened self, in other words, is a self - 419 - that had suffered the trauma of unshared emotionality. The result of this specific empathic failure from the side of the selfobject is the absence of the self-soothing capacity that protects the normal individual from being traumatized by the spreading of his emotions, especially by the spreading of anxiety. A world that lacks such soothing selfobjects is an inimical, a dangerous world."}, {"id": 670, "tr": "self_psychology", "doc": "kohut - The disorders of the self and their tr", "pos": 44, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Kohut", "pt": "none", "pg": 8, "pdf": "", "ppg": 420, "pcf": 1.0, "txt": "But does that mean that it would have been better for analysis if Abraham had never given us his typology? Decidedly not. It was of the greatest help to generations of analysts and, so long as we are aware of the limitations of its applicability, continues to be of limited service even today. But although we therefore feel that the setting up of typologies is justified, it behooves us to be explicit about the shortcomings inherent in any such attempt."}, {"id": 671, "tr": "self_psychology", "doc": "kohut - The disorders of the self and their tr", "pos": 49, "loc": "patient", "int": 0.55, "aff": "shameful craving", "au": "Kohut", "pt": "none", "pg": 9, "pdf": "", "ppg": 421, "pcf": 1.0, "txt": "They are impelled to display themselves and to evoke the attention of others, trying to counteract, however fleetingly, their inner sense of worthlessness an d lack of self-esteem. Some of them are able to establish relationships with reliably mirroring others that will sustain them for long periods. But most of them will not be nourished for long, even by genuinely accepting responses. Thus, despite their discomfort about their need to display themselves and despite their sometimes severe stage fright and shame they must go on trying to find new selfobjects whose attention and recognition they seek to induce."}, {"id": 672, "tr": "self_psychology", "doc": "kohut - The disorders of the self and their tr", "pos": 52, "loc": "none", "int": 0.1, "aff": "theoretical", "au": "Kohut", "pt": "none", "pg": 10, "pdf": "", "ppg": 422, "pcf": 1.0, "txt": "Alter-ego-personalities need a relationship with a selfobject that by conforming to the self's appearance, opinions, and values confirms the - 421 - existence, the reality of the self. At times the alter-ego-hungry personalities, too, may be able to form lasting friendships—relationships in which each of the partners ex periences the feelings of the other as if they had been experienced by himself. 'If thou sorrow, he will weep; if thou wake, he cannot sleep; thus of every grief in heart he with thee doth bear a part' (Shakespeare, The Passionate Pilgrim ). But again, in most instances, the inner void cannot be filled permanently by the twinship. The alter-ego-hungry discovers that the other is not himself and, as a consequence of this discovery, begins to feel estranged from him."}, {"id": 673, "tr": "self_psychology", "doc": "kohut - The disorders of the self and their tr", "pos": 55, "loc": "none", "int": 0.15, "aff": "theoretical", "au": "Kohut", "pt": "none", "pg": 10, "pdf": "", "ppg": 422, "pcf": 1.0, "txt": "Here, in contrast to the types sketched out before, it is the need for merger that dominates the picture, the specific type of merger, however—whether with a mirroring or an idealized selfobject or with an alter ego—is less important in determining the individual's behaviour. Because the self of these individuals is seriously defective or enfeebled, they need selfobjects in lieu of self-structure. Their manifest personality features and their behaviour are thus dominated by the fact that the fluidity of the boundaries between them and others interferes with their ability to discriminate their own thoughts, wishes and intentions from those of the selfobject. Because they experience the other as their own self, they feel intolerant of his independence: they are very sensitive to separations from him and they demand—indeed they expect without question—the selfobject's continuous presence."}, {"id": 674, "tr": "self_psychology", "doc": "kohut - The disorders of the self and their tr", "pos": 62, "loc": "none", "int": 0.2, "aff": "technical", "au": "Kohut", "pt": "none", "pg": 11, "pdf": "", "ppg": 423, "pcf": 1.0, "txt": "The foregoing conclusions hold also with regard to those individuals with self-pathology, those with narcissistic personality disturbances, who are overtly shy, unasser tive and socially isolated, but whose conscious and preconscious fantasies—'The Secret Life of Walter Mitt y'—are grandiose. If the therapist believes that the patient's timidity, shyness and social isolation are due to the persistence of archaic illusions, specifically that they are due to the persistence of his untamed childhood gran diosity as manifested in the form of his grandiose fantasies, then he will feel justified in the attempt, through the application of educational and moral pressure, to persuade the patient to relinquish these fantasies. But neither the patient's fantasies nor his social isolation are"}, {"id": 675, "tr": "self_psychology", "doc": "kohut - The disorders of the self and their tr", "pos": 63, "loc": "patient", "int": 0.4, "aff": "shame, dread", "au": "Kohut", "pt": "unnamed", "pg": 12, "pdf": "", "ppg": 424, "pcf": 1.0, "txt": "the cause of his illness. On the contrary, together they constitute a psychological unit which, as a protective device, attempts to maintain the patient's precariously established self by preventing its dangerous exposure to rebuff and ridicule. If the therapist is educational rather than analytic, if he restricts - 423 - his approach to the attempt to persuade the patient to give up his fantasied grandiosity, then the distance between the patient's defective self, on the one hand, and the therapist as the hoped-for empathic responder to the patient's narcissistic needs, on the other hand, will increase and the spontaneously arising movement towards the first significant breach in the wall of sensitivity and suspicion, the establishment of a narcissistic transference, will be halted. If, however, the therapist can explain without censure the protective function of the grandiose fantasies and the social isolation and thus demonstrate that he is in tune with the patient's disintegration anxiety and shame concerning his precariously established self, then he will not interfere with the spontaneously arising transference mobilization of the old narcissistic needs."}, {"id": 676, "tr": "self_psychology", "doc": "The Psychoanalytic Study of the Child - Though", "pos": 30, "loc": "patient", "int": 0.35, "aff": "precarious cohesion", "au": "Kohut", "pt": "none", "pg": 10, "pdf": "", "ppg": 371, "pcf": 0.6, "txt": "That the oedipal symptomatology in such cases (e.g., of \"pseudohysteria\") is not genuine is generally accepted. In contrast to what I believe to be the prevailing view, however , that we are dealing with hidden psychosis or with personalities whose psychic equilibrium is threatened by severe ego weakness, I have become convinced that many of these patients suffer from a narcissistic personality disturbance, will establish one of the forms of narcissistic transference, and are thus treatable by psychoanalysis.2 The nuclear psychopathology of these individuals concerns the self. Being threatened in the maintenance of a cohesive self because in early life they were lacking in adequate confirming responses (\"mirroring\") from the environment, they turned to self-stimulation in order to retain the precarious cohesion of their experiencing and acting self. The oedipal phase, including its conflicts and anxieties, became paradoxically a remedial stimulant, its very intensity being used by the psyche to counteract the tendency toward the breakup of the self —just as a small child may attempt to use self-inflicted pain (head banging, for example) in order to retain a sense of aliveness and cohesion."}, {"id": 677, "tr": "self_psychology", "doc": "The Psychoanalytic Study of the Child - Though", "pos": 41, "loc": "none", "int": 0.1, "aff": "polemical", "au": "Kohut", "pt": "none", "pg": 13, "pdf": "", "ppg": 374, "pcf": 0.6, "txt": "Freud, closed his remarks about this biography with the following trenchant sentence: \"We are not an age notable for fineness and precision of thought, but it is seldom indeed that we get a book as intellectually discreditable, as disingenuous and as vulgar as this.\" 373 I have no doubt that the ubiquitous sensitivity about bodily defects and shortcomings can be effortlessly explained within the metapsychological framework of the vicissitudes of the libidinal cathexes of the grandiose self and, in particular , of the grandiose-exhibitionistic body-self. The specific topic of the sense of inferiority of children about the small size of their genitals (in the boy in comparison with the penis of the adult man; in the girl in comparison with the boy's organ) may, however , warrant a few special remarks. The sensitivity of children about their genitals is at its peak during the pivotal phallic phase of psychosexual development—later sensitivities concerning the genitals must be understood as residuals (e.g., during latency) Copyrighted Material. For use only by 48923."}, {"id": 678, "tr": "self_psychology", "doc": "The Psychoanalytic Study of the Child - Though", "pos": 46, "loc": "none", "int": 0.15, "aff": "theoretical", "au": "Kohut", "pt": "none", "pg": 15, "pdf": "", "ppg": 376, "pcf": 0.6, "txt": "A person may sense in himself the analogue of the Biblical command, \"If thine eye offend thee, pluck it out\" (Matthew 18:9), but he would still be unable to obey this order . The ability to perform an act of gross self-mutilation depends, in some instances at least, on the fact that the organ which the psychotic removes has lost its narcissistic libidinal cathexis; i.e., it is not anymore part of the self and can therefore be discarded as if it were a foreign body. This explanation applies Copyrighted Material. For use only by 48923."}, {"id": 679, "tr": "self_psychology", "doc": "The Psychoanalytic Study of the Child - Though", "pos": 51, "loc": "none", "int": 0.2, "aff": "sober", "au": "Kohut", "pt": "none", "pg": 17, "pdf": "", "ppg": 378, "pcf": 0.6, "txt": "But the truth is—it must be admitted with sadness—that such events are not bestial, in the primary sense of the word, but that they are decidedly human. They are an intrinsic part of the human condition, a strand in the web of the complex pattern which makes up the human situation. So long as we turn away from these phenomena in terror and disgust and indignantly declare them to be a reversal to barbarism, a regression to the primitive and animallike, so long do we deprive ourselves of the chance of increasing our understanding of human aggressivity and of our mastery over it. The psychoanalyst must, therefore, not shrink from the task of applying his knowledge about the individual to the field of history, in particular to the crucial role of human aggression as it has shaped the history of man."}, {"id": 680, "tr": "self_psychology", "doc": "The Psychoanalytic Study of the Child - Though", "pos": 70, "loc": "none", "int": 0.25, "aff": "shame-laden", "au": "Kohut", "pt": "none", "pg": 23, "pdf": "", "ppg": 384, "pcf": 0.6, "txt": "Our immediate tendency is thus to deny our loss of control rather than to obliterate the unconscious content. Or , expressed differently: our defensive activity is primarily motivated by our shame concerning a defect in the realm of the omnipotent and omniscient grandiose self, not by guilt over the unconscious forbidden sexual or aggressive impulse which was revealed. The excessive preoccupation with a situation in which one has suffered a shameful narcissistic injury (e.g., a social faux pas) must similarly be understood as an enraged attempt to eradicate the reality of the incident by magical means, even to the point of wishing to do away with oneself in order to wipe out the tormenting memory in this fashion. The Child's Reaction to Painful Injuries The other phenomenon that illuminates the significance of narcissistic rage is the emotional reaction of children to slight injuries."}, {"id": 681, "tr": "self_psychology", "doc": "The Psychoanalytic Study of the Child - Though", "pos": 76, "loc": "none", "int": 0.3, "aff": "theoretical rage", "au": "Kohut", "pt": "none", "pg": 25, "pdf": "", "ppg": 386, "pcf": 0.6, "txt": "It has now become clear that narcissistic rage arises when self or object fail to live up to the absolutarian expectations which are directed at their function— whether by the child who, more or less phase-appropriately, insists on the grandiosity and omnipotence of the self and the self-object or by the narcissistically fixated adult whose archaic narcissistic structures have remained unmodified because they became isolated from the rest of the growing psyche after the phase-appropriate narcissistic demands of childhood had been traumatically frustrated. Or , describing the psychodynamic pattern in different words, we can say: although everybody tends to react to narcissistic injuries with embarrassment and anger , the most intense experiences of shame and the most violent forms of narcissistic rage arise in those individuals for whom a sense of absolute control over an archaic environment is indispensable because the maintenance of self-esteem—and indeed of the self—depends on the unconditional availability of the approving-mirroring functions of an admiring self-object, or on the ever-present opportunity for a merger with an idealized one. Narcissistic rage occurs in a variety of forms which occupy a wide spectrum of diverse experiences and divergent behavioral manifestations: from the deepest and most inflexible grudge of the paranoiac to the apparently fleeting rage reaction of the narcissistically vulnerable after a minor slight. All instances of narcissistic rage have, nevertheless, certain features in common because they all arise from the matrix of a narcissistic or prenarcissistic view of the world."}, {"id": 682, "tr": "self_psychology", "doc": "The Psychoanalytic Study of the Child - Though", "pos": 80, "loc": "patient", "int": 0.45, "aff": "emerging fury", "au": "Kohut", "pt": "none", "pg": 26, "pdf": "", "ppg": 387, "pcf": 0.6, "txt": "When during the analysis of a narcissistic personality disturbance a defensive wall of apparent tranquillity which had been maintained with the aid of social isolation, detachment, and fantasied superiority begins to give way, then one has the right to consider the emergence of narcissistic rage, of sudden attacks of fury at narcissistic injuries, as a sign of the loosening of a rigid personality structure and thus of analytic progress. These developments must therefore be neither censured by the analyst, nor hurriedly identified as a part of an archaic psychological world, but must for some time be accepted with implicit approval. Yet, whether present from the beginning of the analysis in the narcissistic analysand, or arising after a therapeutic loosening of his personality, such rage must not be confused with mature aggression. Narcissistic rage enslaves the ego and allows it to function only as its tool and rationalizer ."}, {"id": 683, "tr": "self_psychology", "doc": "The Psychoanalytic Study of the Child - Though", "pos": 83, "loc": "none", "int": 0.15, "aff": "theoretical", "au": "Kohut", "pt": "none", "pg": 27, "pdf": "", "ppg": 388, "pcf": 0.6, "txt": "and the analysand's maturely modulated aggressions will be employed in the service of a securely established self and in the service of cherished values. The relinquishment of narcissistic claims—the precondition for the subsidence of narcissistic rage—is, however , not absolute. (See in this context Tausk, 1913.). In accepting the existence of an unconscious psychic life, for example, we are not unconditionally renouncing a narcissistic position which had sustained the cohesion of the self, but we are shifting the focus of our narcissism on different ideational contents and are modulating the neutralization of the narcissistic cathexes. Instead of sustaining our sense of self-assurance through the belief in the all-encompassing scope of our consciousness, we now derive a new selfrespect from such derivatives of qualities of the grandiose, omniscient self as the satisfaction of knowing about the existence of an unconscious; or from such derivatives of the relationship with the omniscient and omnipotent self-object as the joy about the superego's approval concerning our stamina in tolerating unpleasant aspects of reality or the joy about having lived up to the example of an admired teacher-figure, Freud."}, {"id": 684, "tr": "self_psychology", "doc": "The Psychoanalytic Study of the Child - Though", "pos": 88, "loc": "none", "int": 0.2, "aff": "unmet craving", "au": "Kohut", "pt": "unnamed", "pg": 28, "pdf": "", "ppg": 389, "pcf": 0.6, "txt": "He became, therefore, inordinately dependent on idealized figures in his environment whose praise he craved. Every time they remained unresponsive, because they failed to sense his need, he became Copyrighted Material. For use only by 48923. Reproduction prohibited."}, {"id": 685, "tr": "self_psychology", "doc": "The Psychoanalytic Study of the Child - Though", "pos": 91, "loc": "patient", "int": 0.5, "aff": "defensive harshness", "au": "Kohut", "pt": "unnamed", "pg": 29, "pdf": "", "ppg": 390, "pcf": 0.6, "txt": "Yet, he was at first unable to recognize the often seemingly unmistakable fact that he reacted to the trauma of a narcissistic injury by becoming unduly harsh toward his son. He remained convinced that his severity was objectively justified, was adamant in the defense of his behavior , and claimed that consistency and unbending justice were better for his son than ill-placed kindness and unprincipled tolerance. His rationalizations seemed foolproof for a long time and no headway was made in the analysis. His moralistic punitiveness finally began to subside, and was replaced by his growing empathy for his son, after the memory of certain childhood scenes was recovered in the analysis and after their dynamic significance was understood."}, {"id": 686, "tr": "self_psychology", "doc": "The Psychoanalytic Study of the Child - Though", "pos": 108, "loc": "none", "int": 0.3, "aff": "narcissistic rage", "au": "Kohut", "pt": "none", "pg": 34, "pdf": "", "ppg": 395, "pcf": 0.6, "txt": "When the environment fails to comply, however—be it the unempathic mother who does not respond to the child's wishes or the table leg which noncompliantly is in the way of the child's toe; or an analogous unempathic archaic object in the world of a narcissistically fixated adult—then the formerly smoothly deployed forces become deranged. Paralleling the processes described with regard to shame, we see discharge and inhibition side by side or in rapid succession, except that here, as stated before, the underlying force is not the grandiose self's boundless exhibitionism, i.e., its insistence on being admired, but its omnipotence, i.e., its insistence on the exercise of total control. It is the disorganized mixture of massive discharge (tension decrease) and blockage (tension increase) in the area of unneutralized aggression, arising after the noncompliance of the archaic self-object, which is the metapsychological substratum of the manifestations and of the experience of narcissistic rage. Chronic Narcissistic Rage If the rage does not subside, it may be added here, then the secondary processes tend to be pulled increasingly into the domain of the archaic aggressions which seek to re-establish control over a narcissistically experienced world."}, {"id": 687, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 656, "loc": "none", "int": 0.2, "aff": "theoretical anxiety", "au": "Freud", "pt": "none", "pg": 191, "pdf": "", "ppg": 161, "pcf": 0.72, "txt": "The anxiety that we feel in a dream is only apparently explained by the dream's content. If we submit the content of the dream to analysis, we find that the anxiety in the dream is no better justified by the dream's content than, let us say, the anxiety in a phobia is justified by the idea to which the phobia relates. No doubt it is true, for instance, that it is possible to fall out of a window and that there is therefore reason for exercising a certain degree of caution in the neighbourhood of a window; but we cannot see why the anxiety felt in a phobia on this subject is so great and pursues the patient far beyond its occasion.1 We find then that the same thing may be validly asserted both of phobias and of anxiety-dreams: in both cases the anxiety is only superficially attached to the idea that accompanies it; it originates from another source. Since this intimate connection exists between anxiety in dreams and in neuroses, in discussing the former I must refer to the latter."}, {"id": 688, "tr": "classical_freudian", "doc": "Shah_When Racialized Ghosts Refuse to Become A", "pos": 27, "loc": "patient", "int": 0.8, "aff": "despairing devastation", "au": "Shah", "pt": "Sandra", "pg": 6, "pdf": "", "ppg": 588, "pcf": 1.0, "txt": "with feelings of hopelessness, anger, and despair. She felt urges to cut herself with a knife or scratch herself until she bled. Sandra was not able to identify what triggered these “dark times,” outside of generic comments about “stress at school” and “relationship stuff . . . maybe it’s also because I had no siblings to feel less alone.” Sandra identified as female and bisexual and had dated prior to her relationship with Josh but had never felt fully engaged sexually or emotionally until she met him. When she was with him, she felt her whole world opened up, and she felt an intimacy she had never known existed: “All of those corny love songs made sense to me.” When he ended their relationship to be with another woman, she felt her world had ended."}, {"id": 689, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 2176, "loc": "none", "int": 0.4, "aff": "dream anxiety", "au": "Freud", "pt": "none", "pg": 616, "pdf": "", "ppg": 586, "pcf": 0.72, "txt": "I was not anxious because I had dreamt that my mother was dying; but I interpreted the dream in that sense in my preconscious revision of it because I was already under the influence of the anxiety. The anxiety can be traced back, when repression is taken into account, to an ob­ scure and evidently sexual craving that had fo und appropriate expression in the visual content of the dream. A twenty-seven-year-old man, who had been seriously ill fo r a year, reported that when he was between eleven and thirteen he had repeatedly dreamt (to the accompaniment of severe anxiety) that a man with a hatchet was pursuing him; he tried to run awl!)', but seemed to be paralysed and could not move from the spot. This is a good example of a very common sort of anxiety-dream, which would never be suspected of being sexual."}, {"id": 690, "tr": "classical_freudian", "doc": "On the Therapeutic Action of Psycho-Analysis b", "pos": 36, "loc": "none", "int": 0.2, "aff": "developmental", "au": "Loewald", "pt": "none", "pg": 9, "pdf": "", "ppg": null, "pcf": 0.5, "txt": "image of the child as seen, felt, smelled, heard, touched by the mother . It would perhaps be more correct to add that what happens is not wholly a process of introjection, if introjection is used as a term for an intrapsychic activity. The bodily handling of and concern with the child, the manner in which the child is fed, touched, cleaned, the way it is looked at, talked to, called by name, recognized and re-recognized—all these and many other ways of communicating with the child, and communicating to him his identity, sameness, unity, and individuality, shape and mould him so that he can begin to identify himself, to feel and recognize himself as one and as separate from others yet with others. The child begins to experience himself as a centred unit by being centred upon."}, {"id": 691, "tr": "classical_freudian", "doc": "Shah_When Racialized Ghosts Refuse to Become A", "pos": 26, "loc": "patient", "int": 0.6, "aff": "dread, isolation", "au": "Shah", "pt": "Sandra", "pg": 5, "pdf": "", "ppg": 587, "pcf": 1.0, "txt": "Her mother struggled with the transition to America – all of her friends and sources of support came from her father’s large family network. Although they occasionally visited South Korea and Sandra had Korean cousins she was in contact with, she felt more connected with her father’s extended Black family and community. However, Sandra did feel that she and her mother were treated differently than her other relatives. Throughout her childhood, Sandra struggled with what she described as “dark days.” She would wake up in the morning with a sense of terrible anxiety and dread that alternated PSYCHOANALYTIC DIALOGUES 587"}, {"id": 692, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 570, "loc": "none", "int": 0.3, "aff": "dream affection", "au": "Freud", "pt": "none", "pg": 170, "pdf": "", "ppg": 140, "pcf": 0.72, "txt": "After the idea had occurred to me that R. was my uncle, I had · had a warm feeling of affection for him in the dream. Where did that feeling belong? I had naturally never had any feeling of affection for my Uncle Josef. I had been fond of my friend R. and had esteemed him for many years; but if I had gone up to_ him and expressed my sentimenls in terms approaching the degree of affection I had felt in the dream, there could be no doubt that he would have been astonished."}, {"id": 693, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 1713, "loc": "none", "int": 0.2, "aff": "theoretical", "au": "Freud", "pt": "none", "pg": 490, "pdf": "", "ppg": 460, "pcf": 0.72, "txt": "t, ! r (H) AFFECTS IN DREAMS A shrewd observation made by Stricker [187 9, 5 1] has drawn our attention to the fact that the expression of affect in dreams cannot be dealt with in the same contemptuous fashion in which, after waking, we are accustomed to dismiss their content. 'If I am afraid of robbers in a dream, the rQbbers, it is true, are imaginary--'-but the fear is rea!.' [Of. p. '74.] And this is equally true if I feel glad in a dream. Our feeling tells us that an affect experienced in a dream is in no way inferior to one of equal intensity experienced in waking life; and dreams insist with greater energy upon their right to be included among our real mental experiences in respect to their affective than in respect to their ideational content. In our waking state, however, we cannot in fact include them in this way, because we cannot make any psychical assessment of an affect unless it is linked to a piece of ideational material. If the affect and the idea are incompatible in their character and intensity, our waking judge­ ment is at a loss."}, {"id": 694, "tr": "classical_freudian", "doc": "On the Therapeutic Action of Psycho-Analysis b", "pos": 20, "loc": "none", "int": 0.2, "aff": "technical", "au": "Loewald", "pt": "unnamed", "pg": 5, "pdf": "", "ppg": null, "pcf": 0.5, "txt": "The patient, by revealing himself to the analyst, provides rudiments of such an image through all the distortions—an image which the analyst has to focus in his mind, thus holding it in safe keeping for the patient to whom it is mainly lost. It is this tenuous reciprocal tie which represents the germ of a new object-relationship. The objectivity of the analyst in regard to the patient's transference distortions, his neutrality in this sense, should not be confused with the 'neutral' attitude of the pure scientist towards his subject of study. Nevertheless, the relationship between a scientific observer and his subject of study has been taken as the model for the analytic relationship, with the following deviations: the subject, under the specific conditions of the analytic experiment, directs his activities towards the observer , and the observer communicates his findings directly to the subject with the goal of modifying the findings."}, {"id": 695, "tr": "classical_freudian", "doc": "Shah_When Racialized Ghosts Refuse to Become A", "pos": 8, "loc": "none", "int": 0.4, "aff": "haunted uncanny", "au": "Shah", "pt": "none", "pg": 3, "pdf": "", "ppg": 585, "pcf": 1.0, "txt": "quality that makes what was once familiar feel unfamiliar and unsafe (Freud, 1919 ). Ghosts seem to reside both outside ourselves and somehow inside a part of us as well. We feel tormented and frightened by ghosts, but our sense that they are trying to communicate with us in a way we cannot grasp makes them strangely compelling. Despite this alluring quality, when we approach them, these absent presences may vanish."}, {"id": 696, "tr": "classical_freudian", "doc": "Shah_When Racialized Ghosts Refuse to Become A", "pos": 20, "loc": "clinician", "int": 0.7, "aff": "hopeless, searching", "au": "Shah", "pt": "Sandra", "pg": 5, "pdf": "", "ppg": 587, "pcf": 1.0, "txt": "I remember feeling that way with Josh, and now it’s over. So, what’s the point?” I struggle to overcome my own momentary experience of hopelessness that I recognize as possibly a reflection of Sandra’s own way of being. Is she trying to articulate some unformulated aspect of her experience that is important to her, that she needs to put into words, about this ghostly feeling? I have a sense that if I were to ask Sandra about ghosts directly, she would get intellectual – as a writer in an academic family, she can talk openly about emotional states in ways that at times feel slightly removed."}, {"id": 697, "tr": "classical_freudian", "doc": "Shah_When Racialized Ghosts Refuse to Become A", "pos": 34, "loc": "dyadic", "int": 0.6, "aff": "groping, ashamed", "au": "Shah", "pt": "Sandra", "pg": 7, "pdf": "", "ppg": 589, "pcf": 1.0, "txt": "It’s stupid. Me: You sound ashamed and upset about the feelings that are coming up right now about you talking about this. Sandra: It’s this longing I feel, to use your word, although honestly, I don’t feel that word fully captures it. [Pauses.] I don’t know. Me: You don’t know if I’m going to get this feeling you are experiencing?"}, {"id": 698, "tr": "classical_freudian", "doc": "Shah_When Racialized Ghosts Refuse to Become A", "pos": 39, "loc": "patient", "int": 0.7, "aff": "melancholic exclusion", "au": "Shah", "pt": "Sandra", "pg": 7, "pdf": "", "ppg": 589, "pcf": 1.0, "txt": "No matter where she was, the sense of being with “her people” and at home with her own skin always involved a sense of distance. Belonging was something to approach but never fully realize. Sandra’s mixed racial identity exacerbated this haunted feeling of not fully existing as a racial subject anywhere, including with me. Josh’s white skin and my being “totally Indian” spoke to her sense of melancholic exclusion from both of us, her envy over what she perceived as my “ethnic purity,” and her longing to find a way out of her painful fragmented experience through a fantasy of merger and union."}, {"id": 699, "tr": "classical_freudian", "doc": "Shah_When Racialized Ghosts Refuse to Become A", "pos": 43, "loc": "patient", "int": 0.75, "aff": "shame, displacement", "au": "Shah", "pt": "Sandra", "pg": 8, "pdf": "", "ppg": 590, "pcf": 1.0, "txt": "My mother would feel sad hearing that [tears up]. I feel like shit saying this, but I don’t know if I feel Asian, Korean, whatever that means. I remember going to this Korean day camp at this Church as a kid; my mother wanted me to be friends with other Korean kids, learn about being Korean. I felt totally out of place."}, {"id": 700, "tr": "classical_freudian", "doc": "Shah_When Racialized Ghosts Refuse to Become A", "pos": 53, "loc": "clinician", "int": 0.75, "aff": "defensive, annoyed", "au": "Shah", "pt": "Sandra", "pg": 9, "pdf": "", "ppg": 591, "pcf": 1.0, "txt": "It’s like a fractured existence, that’s what I feel. Sandra is desperate to have someone “get” her experience but is wary of being misunder - stood. Can a “totally” Indian guy understand this experience? I suddenly felt defensive and annoyed over Sandra’s telling me I did not “get it.” I felt a strong urge to tell her that I did get this, that as a person of color in America, I could make emotional sense of her experience."}, {"id": 701, "tr": "classical_freudian", "doc": "Shah_When Racialized Ghosts Refuse to Become A", "pos": 55, "loc": "clinician", "int": 0.8, "aff": "eager overidentification", "au": "Shah", "pt": "Sandra", "pg": 9, "pdf": "", "ppg": 591, "pcf": 1.0, "txt": "Feeling that chill with Sandra, I suddenly had an urge to say: “Hold on, I do get it!” My eagerness to “get her” and to join Sandra in understanding her experience was genuine, but it was also based on a narcissistic overidentification – an implicit denial of her own unique racial experience and separateness. Her racial melancholia was stirring my own ghosts of unbelonging and moments of feeling irreparably distant from others. This urge to tell Sandra I understood her also felt like an enactment of what she had experienced with her “totally” Korean mother; she often described her mother as anxious and eager to gloss over the differences between them, possibly avoiding painful truths about areas of discrepant experiences. Despite their genuine closeness and love for one another, Sandra often experienced her mother as overly eager to join her in understanding her perspective without seeing the differences between them."}, {"id": 702, "tr": "classical_freudian", "doc": "Shah_When Racialized Ghosts Refuse to Become A", "pos": 65, "loc": "dyadic", "int": 0.6, "aff": "tender attunement", "au": "Shah", "pt": "Sandra", "pg": 11, "pdf": "", "ppg": 593, "pcf": 1.0, "txt": "Returning to the clinical moment I was describing above, I wondered if Sandra was implicitly communicating her need for me to tolerate being with her experience without me trying to impose my own understanding on her defensively (Poland, 2018 ). I chose to stay with her experience, to stay with what felt painful to put into words: Me: I was remembering what you said about touching Josh and being with him – that whole feeling. Maybe being with Josh took that fractured feeling away. You felt whole with him."}, {"id": 703, "tr": "classical_freudian", "doc": "Freud_SE_Dora_complete.pdf", "pos": 85, "loc": "none", "int": 0.1, "aff": "theoretical", "au": "Freud", "pt": "Dora", "pg": 29, "pdf": "", "ppg": null, "pcf": 0.4, "txt": "I may add that within the limits of the present paper I shall be able to bringforward only a part of such knowledge on the subject as I do possess.In order to particularize Dora's case it is not enough merely to draw attentionto the reversal of affect; there has also been a displacement of sensation. Insteadof the genital sensation which would certainly have been felt by a healthy girl insuch circumstances, Dora was overcome by the unpleasurable feeling which isproper to the tract of mucous membrane at the entrance to the alimentary canal—that is by disgust. The stimulation of her lips by the kiss was no doubt ofimportance in localizing the feeling at that particular place; but I think I can alsorecognize another factor in operation.The disgust which Dora felt on that occasion did not become a permanentsymptom, and even at the time of the treatment it was only, as it were, potentiallypresent. She was a poor eater and confessed to some disinclination for food."}, {"id": 704, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 1067, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Freud", "pt": "none", "pg": 304, "pdf": "", "ppg": 274, "pcf": 0.72, "txt": "After we have ceased to be school-children, our punishments are no longer inflicted on us by our parents or by those who brought us up or later by our schoolmasters. The relentless causal chains of real life take charge of our further education, and now we dream of Matriculation or Finals (and who has not trembled on those occasions, even if he was well-prepared for the examination?) whenever, having done something wrong or failed to do some­ thing properly, we expect to be punished by the event-when­ ever, in short, we feel the burden of responsibility. For a further explanation of examination dreams 1 I have to thank an experienced colleague [Stekel], who once declared at a scientific meeting that so far as he knew dreams of Matricula­ tion only occur in people who have successfully passed it and never in people who have failed in it. It would seem, then, that anxious examination dreams (which, as has been confirmed over and over again, appear when the dreamer has some responsible activity ahead of him next day and is afraid there may be a fiasco) search for some occasion in the past in which great anxiety has turned out to be unjustified and has been contradicted by the event."}, {"id": 705, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 2092, "loc": "none", "int": 0.2, "aff": "self-analytic", "au": "Freud", "pt": "none", "pg": 592, "pdf": "", "ppg": 562, "pcf": 0.72, "txt": "I I had climbed up on to a stool in the store-closet to get something nice that was lying on a cupboard or table. The stool had tipped over and its corner had struck me behind my lower jaw; I might easily, I reflected, have knocked out all my teeth. The recollection was accom., panied by an admonitory thought: 'that serves you right'; and this seemed as though it was a hostile impulse aimed at the gallant soldier. Deeper analysis at last enabled me to discover what the concealed impulse was which might have found satis­ faction in the dreaded accident to my son : it was the envy which is felt for the young by those who have grown old, but which they believe they have completely stifled."}, {"id": 706, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 2162, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Freud", "pt": "unnamed", "pg": 613, "pdf": "", "ppg": 583, "pcf": 0.72, "txt": "It is instructive to consider, fo r instance, the significance of a hysterical phobia or an agorap hobia. Let us suppose that a neurotic patient is unable to cross the street alone-a condition which we rightly regard as a 'sym ptom' . If we remove this symptom by compelling him to carry out the act of which he believes himself incapable, the consequence will be an attack of anxiety; and indeed the occurrence of an anxiety-attack in the street is of ten the precipitating cause of the onset of an agorap hobia. We see, therefore, that the symptom has been constructed in order to avoid an outbreak of anxiety; the phobia is erected like a frontier fo rtification against the anxiety."}, {"id": 707, "tr": "classical_freudian", "doc": "[The Standard Edition of Complete Psychologica", "pos": 2276, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Freud", "pt": "none", "pg": 648, "pdf": "", "ppg": 618, "pcf": 0.72, "txt": "616 VII. PSYCHOLOGY OF THE DREAM-PROCESSES the external world with its sense-organ of the Pept. systems, is itself the external world in relation to the sense-organ of the Cs., whose teleological justification resides in this circumstance. Here we once more meet the principle of the hierarchy of agencies, which seems to govern the structure of the apparatus. Excitatory material flows in to the Cs. sense-organ from two directions: from the Pept. system, whose excitation, determined by qualities, is probably submitted to a fresh revision before it becomes a conscious sensation, and from the interior of the apparatus itself, whose quantitative processes are felt qualita­ tively in the pleasure-unpleasure series when, subject to certain modifications, they make their way to consciousness."}, {"id": 708, "tr": "classical_freudian", "doc": "On the Therapeutic Action of Psycho-Analysis b", "pos": 34, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Loewald", "pt": "none", "pg": 8, "pdf": "", "ppg": null, "pcf": 0.5, "txt": "This vision, informed by the parent's own experience and knowledge of growth and future, is, ideally, a more articulate and more integrated version of the core of being which the child presents to the parent. This 'more' that the parent sees and knows, he mediates to the child so that the child in identification with it can grow. The child, by internalizing aspects of the parent, also internalizes the parent's image of the child—an image which is mediated to the child in the thousand different ways of being handled, bodily and emotionally. Early identification as part of egodevelopment, built up through introjection of maternal aspects, includes introjection of the mother's image of the child."}, {"id": 709, "tr": "classical_freudian", "doc": "On the Therapeutic Action of Psycho-Analysis b", "pos": 118, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Loewald", "pt": "unnamed", "pg": 30, "pdf": "", "ppg": null, "pcf": 0.5, "txt": "However , it is implied in such statements that the realistic relationship between patient and analyst has nothing to do with transference. I hope to have made the point in the present discussion that there is neither such a thing as reality nor a real relationship, without transference. Any 'real relationship' involves transfer of unconscious imagines to present-day objects. In fact, present-day objects are objects, and thus 'real', in the full sense of the word (which comprises the unity of unconscious memory traces and preconscious idea) only to the extent to which this transference, in the sense of transformational interplay between unconscious and preconscious, is realized."}, {"id": 710, "tr": "classical_freudian", "doc": "On the Therapeutic Action of Psycho-Analysis b", "pos": 120, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Loewald", "pt": "unnamed", "pg": 31, "pdf": "", "ppg": null, "pcf": 0.5, "txt": "in the patient's 'real' life, is not devoid of transference in the sense clarified in this paper . I said earlier: '… to the extent to which the patient develops a \"positive transference\" (not in the sense of transference as resistance, but in the sense of that \"transference\" which carries the whole process of an analysis) he keeps this potentiality of a new object-relationship alive through all the various stages of resistance.' This meaning of positive transference tends to be discredited in modern analytic writing and teaching, although not in treatment itself. Freud, like any man who does not sacrifice the complexity of life to the deceptive simplicity of rigid concepts, has said a good many contradictory things. He can be quoted in support of many different ideas."}, {"id": 711, "tr": "classical_freudian", "doc": "Freud-Negation.pdf", "pos": 6, "loc": "none", "int": 0.0, "aff": "didactic", "au": "Freud", "pt": "none", "pg": 2, "pdf": "", "ppg": 667, "pcf": 1.0, "txt": "What do you think was furthest from your mind at that time?' If the patient falls into the trap and says what he thinks is most incredible, he almost always makes the right admission. A neat counterpart to this experiment is often met with in an obsessional neurotic who has already been initiated into the meaning of his symptoms. 'I've got a new obsessive idea,' he says, 'and it occurred to me at once that it might mean so and so. But no; that can't be true, or it couldn't have occurred to me.' What he is repudiating, on grounds picked up from his treatment, is, of course, the correct meaning of the obsessive idea. Thus the content of a repressed image or idea can make its way into consciousness, on condition that it is negated."}, {"id": 712, "tr": "classical_freudian", "doc": "Shah_When Racialized Ghosts Refuse to Become A", "pos": 33, "loc": "patient", "int": 0.7, "aff": "peaceful longing", "au": "Shah", "pt": "Sandra", "pg": 7, "pdf": "", "ppg": 589, "pcf": 1.0, "txt": "Sandra: Like I had something I’ve always wanted. It wasn’t just that, of course . . . [she goes on to talk about his other attributes, their time together] . . . but I felt at peace. That feeling of my body touching his body. Me: It felt like you got something you were longing for?"}, {"id": 713, "tr": "classical_freudian", "doc": "Shah_When Racialized Ghosts Refuse to Become A", "pos": 38, "loc": "patient", "int": 0.7, "aff": "melancholic yearning", "au": "Shah", "pt": "Sandra", "pg": 7, "pdf": "", "ppg": 589, "pcf": 1.0, "txt": "Being with Josh and his skin, taking in and touching the contours of his white body, momentarily soothed Sandra’s racial ghosts: “it’s like I had something I’ve always wanted.” It felt as if Sandra, in the context of her loss of Josh, was describing a racial melancholia – the experience that marginalized people of color feel collectively and intern - ally as racial subjects (Eng & Han, 2000 ). The struggle for people of color in the United States to assimilate to heteronormative white ideals which can never be reached leads to a feeling of unbelonging with an internalized and collective exclusion. Assimilation is never fully possible without a loss (Akhtar, 1995 ), especially in the complexity of being of varied ethnic descent. For Sandra there is always a potential loss of herself as a Black subject, a Korean subject, and a minority within the larger culture."}, {"id": 714, "tr": "classical_freudian", "doc": "Shah_When Racialized Ghosts Refuse to Become A", "pos": 40, "loc": "clinician", "int": 0.4, "aff": "struck, reflective", "au": "Shah", "pt": "Sandra", "pg": 7, "pdf": "", "ppg": 589, "pcf": 1.0, "txt": "Reflecting on this, I was struck by Sandra’s feeling that others perceived her as “Iranian” or “Latina” but not Asian. I realized that she rarely talked about her mother being Korean or PSYCHOANALYTIC DIALOGUES 589"}, {"id": 715, "tr": "classical_freudian", "doc": "Shah_When Racialized Ghosts Refuse to Become A", "pos": 49, "loc": "patient", "int": 0.8, "aff": "grief, haunted", "au": "Shah", "pt": "Sandra", "pg": 8, "pdf": "", "ppg": 590, "pcf": 1.0, "txt": "Sandra’s racialized ghosts were “tasting blood,” asking to be heard. Her sudden experi - ence of grief and painful memories of her racial melancholia and exclusion from her Korean maternal racial history and identity arrived unbidden and with intense emotion. Sandra’s hair and her grandmother’s dismissal of it as not being “Korean” felt like a signifier of her dissociative split between her lived in experience of being Korean, infused with having her early maternal care suddenly ripped away from her as “not Korean,” not a part of her mother’s blood and ancestral lineage. This split between how others interpreted Sandra (your hair is not Korean) and how Sandra experienced her own body and sense of self created a gap between her internal self-representation and her sense of how she was seen by 590 D."}, {"id": 716, "tr": "classical_freudian", "doc": "Shah_When Racialized Ghosts Refuse to Become A", "pos": 50, "loc": "patient", "int": 0.7, "aff": "fractured, haunted", "au": "Shah", "pt": "Sandra", "pg": 9, "pdf": "", "ppg": 591, "pcf": 1.0, "txt": "others, leaving her with a haunted sense of herself (Brouilette & Stephens, 2015 ; Stephens, 2014 ). Compounding the pain of this dissociative split was her grandmother’s implicit racism toward black skin, her repudiation of Sandra’s Black identity – her hair signifying her deep connection with her father’s sense of himself as a Black man. The cumulative effects of these moments throughout her life created a ghost-like, fractured internal experience for Sandra of her own skin, body, and racial identification. They existed somehow askew from how she was feeling internally and being represented by others."}, {"id": 717, "tr": "classical_freudian", "doc": "Shah_When Racialized Ghosts Refuse to Become A", "pos": 51, "loc": "none", "int": 0.3, "aff": "theoretical", "au": "Shah", "pt": "Sandra", "pg": 9, "pdf": "", "ppg": 591, "pcf": 1.0, "txt": "Sandra feels she cannot completely “own” being Black, Korean, or fully American. This experience is compounded by the collective experience of being a person of color in the United States and feeling a sense of not being what others feel you are or should be. The psychiatrist, activist and psychoanalytic theorist Franz Fanon describes a moment like this on a subway when he was suddenly identified as “a Negro.” Fanon feels like he is being “sealed” into a “crushing objecthood,” as if encased by his own skin. He apprehends others’ gaze as a sensation running over the surface of his body, “first burning and shivering with cold, that cold that goes through your bones” (Fanon, 1952 )."}, {"id": 718, "tr": "classical_freudian", "doc": "Shah_When Racialized Ghosts Refuse to Become A", "pos": 52, "loc": "patient", "int": 0.8, "aff": "displaced, tearful", "au": "Shah", "pt": "Sandra", "pg": 9, "pdf": "", "ppg": 591, "pcf": 1.0, "txt": "A lifetime of moments of racial dissociation create dissociative splits in our experience, fragmenting the fabric of our intersubjective spaces of meaning and connection with others. Sandra continues: Sandra: I don’t think you can fully get this. I don’t feel Korean, or anything sometimes . . . to constantly walk around feeling like you don’t have a place. To feel like if you’re in one place, then not in the other [cries]."}, {"id": 719, "tr": "classical_freudian", "doc": "Shah_When Racialized Ghosts Refuse to Become A", "pos": 54, "loc": "clinician", "int": 0.85, "aff": "shame, chill", "au": "Shah", "pt": "Sandra", "pg": 9, "pdf": "", "ppg": 591, "pcf": 1.0, "txt": "Moments of my own experiences of dislocation and exclusion arrived unbidden in the form of images and visceral sensations. One memory was of feeling shame when a Punjabi Indian man my age eagerly approached me speaking Hindi at a party where the majority of the other people appeared white. After fumbling a few words together in Hindi, I saw the disappointment and dismissal on his face that seemed to say, “This guy is not Indian like me.” I suddenly felt I was not Indian, but I was also not like the other white people at the party. My presence was in some ghostly place, in-between and nowhere, and I felt it as a chill in my bones."}, {"id": 720, "tr": "classical_freudian", "doc": "Shah_When Racialized Ghosts Refuse to Become A", "pos": 62, "loc": "clinician", "int": 0.85, "aff": "envious shame", "au": "Shah", "pt": "Sandra", "pg": 11, "pdf": "", "ppg": 593, "pcf": 1.0, "txt": "experience is of being a first-generation immigrant who in some ways does not feel deep roots to United States history, despite a longing to belong. This could have contributed to the enactment of me identifying with Sandra’s mother and her immi - grant status and identifying with Sandra’s mother’s envy of Sandra’s father’s African American family. What took me some time to see in my work with Sandra was how my “uncomfortable envy” of her African American heritage masked more difficult and unbe
