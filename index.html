the outcome, whatever it is, will be good—not necessarily pleasant but productive.The “dream sense” is the term I coined for this feeling, and in this chapter I use this idea to try to continue charting in words the emergent quality of life in general, and of clinical process in particular. This chapter is a continuation of the comparison of interpersonal/rela - tional theory and Bionian field theory that I began in two articles that appeared in Psychoanalytic Dialogues in 2013 ( Stern, 2013 a, 2013b) and that were reprinted in a slightly longer form in my book, Relational Freedom: Emergent Properties of the Interpersonal Field ( Stern, 2015 )."}, {"id": 413, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 1249, "loc": "clinician", "int": 0.6, "aff": "defensive openness", "au": "Stern, D.B.", "pt": "none", "pg": 301, "pdf": "", "ppg": 282, "pcf": 0.94, "txt": "I felt defensive, but I tried to be as open as I could, feeling that the only opportunity to create a bond between all of us—and I didn’t see any sense in doing this if I didn’t aim for that—lay in making an authentic emotional connection through the work we shared. As the day went on, all of us relaxed, and by the end of the day the feeling among us was respectful and collegial, even excited. We felt we had shared something important. I feel confident in saying that it was a terrific day for all of us."}, {"id": 414, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - Partners in Thought (2009)", "pos": 508, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Stern, D.B.", "pt": "none", "pg": 131, "pdf": "", "ppg": 110, "pcf": 1.0, "txt": "This treatment begins to organize the infant’s relatively inchoate world in the terms of narrative, and self-states begin to cohere in and around these earliest stories. In one sense, then, we are called into being by acts of recognition by the other. We learn we are hungry because the other feeds us at a moment when we are having a certain uncomfortable feeling; and so we then have a story that goes with that feeling: “I am hungry.” We learn we are sad because the other comforts us at a moment when we are having a diἀerent distressing feeling; and so we then begin to have a story that goes with that feeling: “I am sad.” This is one way we begin to tell and live stories; there are other ways. All the various tributaries to narrative sum to the creation of experience:"}, {"id": 415, "tr": "relational_interpersonal", "doc": "Ogden- Elements of Analytic Style.pdf", "pos": 59, "loc": "none", "int": 0.3, "aff": "regretful urgency", "au": "Ogden", "pt": "unnamed", "pg": 17, "pdf": "", "ppg": 133, "pcf": 1.0, "txt": "Analytic style in Bion’s clinical seminars 133 patient being dreamt up in the seminar, but also for the presenter who, I think, Bion feels is regretful that it has taken him so long to become an analyst for his patient. (Perhaps the presenter recognized in the course of the seminar that he had relied for a long time on the thinking of others – the “training analyst” in himself – who had been afraid to respond freshly, without preconception, to what he was perceiving and feeling in the analytic sessions. In other words, to this point he had been unable to invent/rediscover psychoanalysis with this patient. Still another element of Bion’s analytic style can be felt in this portion of the seminar. As we have seen, Bion is continually aware of the way in which each patient in each analytic hour unconsciously feels that his life is at stake (and, it seems to me, that Bion believes, in an important sense, that the patient is correct in believing so)."}, {"id": 416, "tr": "relational_interpersonal", "doc": "Ogden (1992). Comments on T&C on initial analy", "pos": 8, "loc": "clinician", "int": 0.5, "aff": "anticipatory suspense", "au": "Ogden", "pt": "none", "pg": 3, "pdf": "", "ppg": 228, "pcf": 0.67, "txt": "In other words, prior to meeting the patient, the analyst has drawn upon such particulars as the sound of the patient's voice on the telephone, the source of the referral, the analyst's relationships with his current patients, as sources of conscious and unconscious feelings about the patient that he will bring to the first analytic meeting. In addition, there is regularly a feeling of suspense connected with the anticipation of the initial interview. Both patient and analyst are about to enter into an interpersonal drama for which many scripts are already written (the analyst's and the patient's internal dramas), and yet if the work is to be productive, a drama never before imagined by either will have to be created. Along with the sense of excitement, there is also an edge of anxiety."}, {"id": 417, "tr": "relational_interpersonal", "doc": "Ogden (1992). Comments on T&C on initial analy", "pos": 62, "loc": "clinician", "int": 0.4, "aff": "anxious surprise", "au": "Ogden", "pt": "Mr. N", "pg": 14, "pdf": "", "ppg": 239, "pcf": 0.67, "txt": "239 that since the patient felt such intense anxiety in response to each meeting, it might be useful to meet more frequently in order to discuss what it was that was frightening him. To her surprise, Mr . N seemed receptive to this idea. In a sense, the beginning of the analytic dialogue had been postponed for six or seven meetings largely as a result of unanalyzed anxiety in the countertransference which had led to an inability to think about or interpret the patient's transference anxiety."}, {"id": 418, "tr": "relational_interpersonal", "doc": "Davies, J. (2004). Whose bad objects are we an", "pos": 61, "loc": "patient", "int": 0.6, "aff": "shamed humiliation", "au": "Davies", "pt": "none", "pg": 7, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "It is illegal to copy, distribute or circulate it in any form whatsoever. - 723 - we anal ysts are subj ect to thi s parti cul ar vul nerabi l i ty (Anthony Bass, 2001, personal communication). However, even i f the therapi st can f ree hersel f f rom her own toxi c sel f-states and f rom her need to evacuate them into the patient long enough to reflect on what is happening in the therapeutic relationship and to interpret that process; the therapeutic/interpretive dilemma remains problematic. For if I manage to offer my patient an interpretation that feels empathic and resonates with her own internal sense of our shared experience, the transf erence-countertransference complementarity shifts, and rather than feeling warmed and nourished by an empathic and meaningf ul comment that she can take in and use, the patient feels shamed and humiliated by my empathy (because it challenges and contradicts her projections). Here her own inner sense of goodness and sanity, a sense held in check by the evacuation of all that is bad into me, ricochets back against her and resurrects her own episodic and dissociated sense of internal badness."}, {"id": 419, "tr": "relational_interpersonal", "doc": "Ogden.pdf", "pos": 51, "loc": "clinician", "int": 0.7, "aff": "dreamlike unease", "au": "Ogden", "pt": "unnamed", "pg": 10, "pdf": "", "ppg": null, "pcf": 1.0, "txt": "I was being wordlessly invited to experience and speak from an unconscious level of myself and to enter into, and simultaneously observe, a dreamscape without knowing where the dreaming was heading—we never do know where a dream is going. I told Dr Searles that listening with him to the session had led me to feel an odd combination of feelings that I only now recognized as a feeling that I often experi - enced in my work with a blind schizophrenic man. I explained that I was at the time a full-time therapist on the staff of a long-term analytically oriented in-patient ward. I said that, in my work with the blind patient, I had a sense that there was nothing to be afraid of because everything horriﬁc that could happen had already happened."}, {"id": 420, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 47, "loc": "clinician", "int": 0.55, "aff": "suspicious, deciphering", "au": "Ogden", "pt": "Mr A", "pg": 27, "pdf": "", "ppg": 12, "pcf": 1.0, "txt": "marriage and three children whom I dearly love – I feel almost all the time that something is terribly wrong.” (Mr A’s use of the phrases “afraid of analysis,” “dearly love,” and “terribly wrong” felt to me like anxious unconscious efforts to feign candor while, in fact, telling me almost nothing). I said to Mr A that his having asked his secretary to speak for him made me think that he may feel that his own voice and his own words somehow fail him. Mr A looked at me as if I were crazy and said,“No, my cell phone wasn’t working and rather than pay the outrageous amounts that hotels charge for phone calls, I e-mailed my secretary telling her to call you.” During that initial meeting, the patient told me that he suffered from severe insomnia that had begun when he was in college.While trying to fall asleep, he ruminates about all of the things that he has to attend to at work and makes lists in his head of things that need ﬁxing around the house. He added that doctors had prescribed sleeping pills over the years, but “they don’t work and I don’t want to get hooked on them.” (Implicit in his tone was the sentiment:“Doctors do indeed do harm and will get you hooked if you allow them to.”) In the course of the ﬁrst year-and-a-half of analysis, Mr A told me about his childhood in a rather nostalgic way."}, {"id": 421, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 60, "loc": "clinician", "int": 0.65, "aff": "drawn, associative", "au": "Ogden", "pt": "Ms C", "pg": 30, "pdf": "", "ppg": 15, "pcf": 1.0, "txt": "was not the character she played to whom I felt drawn, it was to her, the actress, the woman I imagined her to be. In the film she sang two songs and I was amazed not only by the beauty of the sound of her voice, but also by the enormous range of her talent. The patient told me later in the session that from the time his daughter was a baby, it had been impossible for him to hold her in his arms in a way that felt natural,much less change her diaper without feeling that he was “being a voyeur and a pervert.” As Mr A was speaking, my mind turned from the images and feelings associated with the patient’s having played doctor with his sister to an event from my own experience of becoming a doctor. In the early weeks of medical school – I was twenty-one at the time, I defensively noted to myself – my group of four medical students was working on the dissection of “our” cadaver."}, {"id": 422, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 65, "loc": "clinician", "int": 0.5, "aff": "revising recognition", "au": "Ogden", "pt": "Ms C", "pg": 31, "pdf": "", "ppg": 16, "pcf": 1.0, "txt": "mother had used the patient’s older sister as a vehicle through whom to live the life of a girl,and then of a young woman,who she wished she had been.(I began to recognize that earlier in the analysis,I had too readily adopted as my own the patient’s view of his parents as defeated people utterly lacking in dreams. It now seemed that it was Mr A’s father who had been the defeated one and that the patient’s depiction of his mother as a person without dreams had served to protect him from the even more disturbing feeling that his [external and internal object] mother had been alive – albeit primarily narcissistically – to his older sister, but not to him.) Later in the session,Mr A spoke about his inadequacies as a husband including his feeling that he is “lousy at sex”:“It’s like dancing. I have no sense of rhythm and I try to move my body in the way other people do, but it’s not dancing. I don’t feel the music.” I said to the patient,“I think you felt that you’d never be able to dance with your mother in the way your older sister did."}, {"id": 423, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 94, "loc": "none", "int": 0.1, "aff": "didactic", "au": "Ogden", "pt": "none", "pg": 40, "pdf": "", "ppg": 25, "pcf": 1.0, "txt": "When an analyst is incapable of sustaining a state of “not knowing,” the past eclipses the present,and the present is projected into the future.An analyst unable to tolerate not knowing may “know” even before the analysand arrives for his Monday session that the patient – as he has so often in the past – has felt lonely and intensely jealous of the analyst’s (imagined) wife.What’s more, the patient once again will feel that the analyst cruelly ﬂaunts the patient’s exclusion from his family by having his consulting room in his home.The patient may in fact have felt all of this, but in order for that set of feelings to be talked about in a way that is personal to the patient, the patient’s experience must be sensed by the analyst and spoken about as if for the first time. For the event is in fact occurring for the ﬁrst time in the context of the unique present moment of the analysis. The analyst must be able not to know himself too well. For example, the analyst’s eight-year-old son may have been in a bicycle accident the previous day in which the boy had broken his arm.The analyst’s awareness of the fact that What I would not part with 25"}, {"id": 424, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 169, "loc": "clinician", "int": 0.7, "aff": "numb, vacant", "au": "Ogden", "pt": "Ms C", "pg": 69, "pdf": "", "ppg": 54, "pcf": 1.0, "txt": "She went on to develop these “thoughts” at length in a way that felt numbing. In an effort to say something that felt to me less disconnected from feelings involved in the event as I had experienced it, I said to Ms C that I thought she might have been afraid that I would not see her in the waiting room had she not positioned herself as she had. (We had talked previously of her feeling insubstantial and behaving in such a way as to lead people to look through her as if she were not there.) In making the interpretation, I also had in mind the patient’s derisive depiction of her parents as “schizoid people” with good intentions, but “no idea” who the patient was and is. But even as I was saying these words, my interpretation felt as vacant as those of Ms C. The patient agreed with what I said and without pause went on in a manner that was familiar to both of us, to tell me about the myriad events of her day."}, {"id": 425, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 177, "loc": "clinician", "int": 0.55, "aff": "relieved recognition", "au": "Ogden", "pt": "Mr V", "pg": 71, "pdf": "", "ppg": 56, "pcf": 1.0, "txt": "It was the sound of the worst form of mockery, not only of music (which the patient deeply loved), but also of the Christmases before his parents’ divorce which had been some of the happiest and most loving family events that Mr N could remember. My recollections of Mr N’s Christmas music hallucination and my emotional responses and associations to it led me to become aware that having a reverie – any reverie – that I could make use of analytically was an extremely rare event in my work with Ms C. It was not that my thoughts had not wandered during earlier sessions with Ms C; what struck me at this point in the session was how little psychological work I had been able to do with my reverie experiences. There was a feeling of relief in this recognition."}, {"id": 426, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 226, "loc": "patient", "int": 0.6, "aff": "alone, alien", "au": "Ogden", "pt": "Mr V", "pg": 86, "pdf": "", "ppg": 71, "pcf": 1.0, "txt": "I told Mr V that I thought that he had not had a way, other than through his actions in the passageway, to convey to me what it felt like to him to be coming to meet with me. I said that without words he had told me how alone he felt in the no-man’s land of the passageway. He felt barred both from coming in to see me to begin analysis and from going out and living as he imagined the people outside are able to do.The patient responded in a strikingly monotone voice,“Y es, I feel like a visitor everywhere, even with my family. I don’t know how to do and say what seems to come naturally to other people."}, {"id": 427, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 228, "loc": "patient", "int": 0.6, "aff": "caught, detached", "au": "Ogden", "pt": "Mr V", "pg": 87, "pdf": "", "ppg": 72, "pcf": 1.0, "txt": "About halfway through the hour, Mr V seemed to become interested in, and less fearful about, discussing what had occurred at the very beginning of the session. He said he had felt startled, ﬁrst by the woman and then by me, as she and I came out of my ofﬁce into the passageway.“I felt caught doing something I shouldn’t have. No...t h a t ’ s not right. I felt caught at being weird and clueless about what everyone else knows.” After a brief pause, Mr V went on to say with little feeling in his voice,“I’ve learned to use my detachment from other people to my advantage in business because I can see things from an outside point of view."}, {"id": 428, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 231, "loc": "clinician", "int": 0.85, "aff": "panicked urgency", "au": "Ogden", "pt": "Mr V", "pg": 87, "pdf": "", "ppg": 72, "pcf": 1.0, "txt": "I felt a good deal more of what it had been for me to be an eight-year-old boy on that frozen pond in winter. It was a state of mind that was a combination of living in a day dream made up of sensations that have such great immediacy that there is no room (or desire) to think.Things just happen, one after another.The events on the pond now had the emotional impact of a balloon exploding – not only had R fallen through the ice, we both were hit in the face with a blast of reality that annihilated the dreamy aspect of exploring on the frozen pond/Arctic Circle. It felt to me in the reverie that I had no choice but to become in an instant someone who could do the things that had to be done. R was in the water.I had to become someone I feared I could not be,someone more grownup than I was."}, {"id": 429, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 243, "loc": "none", "int": 0.1, "aff": "reflective", "au": "Ogden", "pt": "Mr V", "pg": 90, "pdf": "", "ppg": 75, "pcf": 1.0, "txt": "How different it would have been if he had said,“In the passageway,I felt lost”or “Out there,I felt very lost,”instead of “Out there, I felt so lost.”There is something unmistakable about the truth when one hears it. In closing this clinical discussion, I would like to address brieﬂy the question of who it was who came up with the ideas that felt true in the analytic session I have described.As I have previously discussed (Ogden, 1994a, 1997b, 2001a), I view the analyst’s reverie experience as a creation of an unconscious intersubjectivity that I call “the analytic third,” a third subject of analysis, which What’s true and whose idea was it? 75"}, {"id": 430, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 324, "loc": "clinician", "int": 0.8, "aff": "unreal, tyrannized", "au": "Ogden", "pt": "Mr B", "pg": 119, "pdf": "", "ppg": 104, "pcf": 1.0, "txt": "imitation served to strip away feelings of realness and “I-ness” from virtually every aspect of my mind and body.The patient was subjecting me to a tyrannizing form of containing that caused me to feel that I was losing my mind and body. Later in the analysis, when a healthier form of containing had been achieved,this pathological containing was understood as a replication (imitation) of the patient’s unconscious sense of his mother’s having taken over his mind and body, leaving him nothing of his own that felt real and alive. Still another type of pathological containing takes the form of a type of “dreaming,” which like a cancer, seems to ﬁll the dream space and the analytic space with images and narratives that are unutilizable for psychological work. Potential dream-thoughts promiscuously proliferate until they reach the point of drowning the dreamer (and the analyst) in a sea of meaningless images and narratives.“Dreams” generated in this way include “dreams” that feel like a disconnected stream of images;lengthy “dreams”that ﬁll the entire session in a way that powerfully undermines the potential for reverie and reﬂective thinking;and a flow of “dreams” dreamt in the course of months or years that elicit no meaningful associations on the part of patient or analyst."}, {"id": 431, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 354, "loc": "clinician", "int": 0.5, "aff": "interpretive attunement", "au": "Ogden", "pt": "Mr A", "pg": 129, "pdf": "", "ppg": 114, "pcf": 1.0, "txt": "Mr A did not say what frightened him about beginning analysis, but his fear was palpably present in his response to what I said:“My cell phone wasn’t working and rather than pay the outrageous amounts that hotels charge for phone calls, I e-mailed my secretary telling her to call you.” In this portion of the session, Mr A was expressing a great many feelings at once. My task as a writer is to use words in a way that somehow captures that simultaneity.The words “Mr A looked at me as if I were crazy” serve to express (with mild irony) the patient’s angry, fearful rebellion against the way I framed the events surrounding his secretary’s calling me.In his protest,he invokes common sense in defense not only of his perspective, but also of his sanity. 2 (My use of the word “crazy” in describing how Mr A looked at me is intended to suggest his fear of the psychotic aspect of himself.) In writing each element of the patient’s response, the language I use is meant to convey a sense of the pressure of the unconscious almost bursting through the spoken words:“My cell phone wasn’t working” – i.e., he felt blocked by my interpretation from speaking and thinking in the way in which he was accustomed.“Rather than pay the outrageous amounts hotels charge for phone calls” – i.e., he felt powerless in the analytic setting where I make self-serving rules which he feared would not take into account who he is and what he needs. “I e-mailed my secretary telling her to call you [to cancel the meeting]” – i.e., he refused to submit to me and my ways of thinking and speaking which he feared I was attempting to impose on him; he could more safely communicate without speaking (through the use of e-mail and his secretary’s speaking for him); he could try to protect himself against my power (and the power of his own warded-off thoughts and feelings) by the use of self-deception and evasiveOn psychoanalytic writing 114"}, {"id": 432, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 359, "loc": "patient", "int": 0.7, "aff": "deadened dread", "au": "Ogden", "pt": "none", "pg": 131, "pdf": "", "ppg": 116, "pcf": 1.0, "txt": "It is a moment that “is quickly lost or perhaps never experienced, always potential and carrying fear of violence.” What “dead means” is developed still further: Dead means the child’s loss of (or never experiencing) the aliveness to be had in feeling his anger as his own; it also means the loss of the durability of his sense of self in the experience of sustaining his anger over time. His fear that his anger will turn into actual violence which will damage or destroy his mother poses a constant threat to his ability to remain alive to himself in his anger.The phrase “carrying fear of violence” is without a human subject – the subject is “moment” – thus conveying a sense of the way in which this fear of violence is not experienced by the child as his own creation, his own feeling. Rather, it is an impersonal force by which the child feels inhabited and over which he feels he has no control. Destroying himself, his capacity to feel anything may be preferable to the risk of killing his mother as a consequence of the violence with which he is occupied."}, {"id": 433, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 176, "loc": "patient", "int": 0.6, "aff": "self-accusing shame", "au": "Stern, D.B.", "pt": "none", "pg": 57, "pdf": "", "ppg": 38, "pcf": 0.94, "txt": "I take the position that being effectively witnessed (which is to say, feeling witnessed) leads to the experience of being understood, and that that— feeling known, recognized, or understood—offers us the path that leads to our capacity to grasp our own participation in the creation of our own thinking and feeling. Here is a clinical moment that illustrates what I mean. Near the end of a session, Emma, a talented, very bright, and highly self-critical white businesswoman in her late thirties, with whom I meet four times a week, accused herself of being skillful at “duping” or “manipulating” people: “I’m false and superficial,” she said, “because I put on a front so that people will think I am ‘normal’ and that I suffer less than I really do. I give the impression of being put together when I feel a mess underneath.” Emma and I had explored over and over again her worry that she had somehow managed to pull the wool over my eyes so that I could not see what a “mess” she is and how skillfully she manipulates me."}, {"id": 434, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 180, "loc": "patient", "int": 0.55, "aff": "fearful self-attack", "au": "Stern, D.B.", "pt": "Emma", "pg": 58, "pdf": "", "ppg": 39, "pcf": 0.94, "txt": "Because she is afraid that, if she accepts that she is more or less “good,” someone else will see how “bad” or “toxic” she is, and she will feel caught out, humiliated, and hurt much more deeply than if she accuses herself first. And so the reason she accuses herself with such ferocity of abusing other people is, paradoxically, that it makes her feel safer than she would be if she let down her guard and allowed herself to believe that she generally treats people with basic warmth and respect. Her defensively skewed interpretation of her self-presentation therefore simply reinforces her sense that she is indeed duping and manipulating people. We might say that Emma is quite literally afraid to believe in herself and to trust my belief in her."}, {"id": 435, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 332, "loc": "patient", "int": 0.4, "aff": "shamed invalidation", "au": "Stern, D.B.", "pt": "Emma", "pg": 91, "pdf": "", "ppg": 72, "pcf": 0.94, "txt": "72 Distance and relation now observed, but because having a self-hating daughter contradicted her image of the perfect mother she needed to be. She just couldn’t bear it. On the other hand, said Emma, if she (Emma) felt good or accomplished, and let her parents know about it, they would immediately question her facts or her perception of the situation, making her feel ashamed. Emma had realized over the weekend that these sequences of events were entirely dependable."}, {"id": 436, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 435, "loc": "dyadic", "int": 0.7, "aff": "recognized anger", "au": "Stern, D.B.", "pt": "Alan", "pg": 113, "pdf": "", "ppg": 94, "pcf": 0.94, "txt": "Could make you feel a little annoyed with me. The sympathetic affective tone with which I said this grew from the shift in the field that had already taken place when I noted and absorbed the meaning of Alan’s bitterness without defensiveness, and so I believe that my interpretation contributed to the impression Alan already had started to form that I knew he was angry with me and was not retaliating. Because Alan saw me seeing him, I think he also felt (not just knew, but felt), for one of the first times, the presence of his own expectation that he would feel ashamed of being angry. He could turn his explicit attention to all of this."}, {"id": 437, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 521, "loc": "clinician", "int": 0.6, "aff": "sensing shame", "au": "Stern, D.B.", "pt": "Alan", "pg": 130, "pdf": "", "ppg": 111, "pcf": 0.94, "txt": "She could not be vulnerable to me, in other words, and I felt sure that I was not the only one with whom she felt this way. As a matter of fact, I imagined that this might be exactly the problem she was encountering in maintaining a romantic relationship. I could not just offer the patient that observation, though, not unless I had something to say that would help her make use of it in a way that did not potentiate the shame I could sense in the wings. I don’t think I thought of the word “shame” for what I sensed in my patient until later."}, {"id": 438, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 731, "loc": "clinician", "int": 0.45, "aff": "reflective musing", "au": "Stern, D.B.", "pt": "Alan", "pg": 174, "pdf": "", "ppg": 155, "pcf": 0.94, "txt": "The emergence of meaning 155 him he had grown up trying to feel that he was, the side of him on display for the world to admire, especially his parents’ worlds. Privately, I began to think about the consequences of Alan’s dissociated identifications, or selfstates:1 it made Alan humiliated and disgusted with himself to be the reviled left side, although that side, being the imagined site of his most vulnerable feelings, also needed his protection; and to be the right side made him feel expansive, powerful, and desirable, while carrying the risk of being grandiose, full of himself, and feeling better than other people, ways of being he decried. Alan now returned to his history, telling me once again a story I knew, but that he told, and I heard, with a new sense of its meaning. He was in seventh grade and had already put on the weight that has tortured him ever since."}, {"id": 439, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 781, "loc": "none", "int": 0.1, "aff": "theoretical", "au": "Stern, D.B.", "pt": "unnamed", "pg": 188, "pdf": "", "ppg": 169, "pcf": 0.94, "txt": "Let me offer a brief, simple example of what I mean by realized nonverbal meaning. Let us say that a particular (fictional) patient is highly anxious about sexual arousal, so anxious that he can allow himself only a very pale version of the sensory pleasure of sex. The unformulated experience of a sexual encounter contains myriad affective and sensory possibilities, only some of which are realized in anyone’s experience. In the case of our fictional patient, the possibilities that are realized—the nonverbal sensory and affective meanings that he derives from the sexual experience—are notably muted."}, {"id": 440, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - Partners in Thought (2009)", "pos": 260, "loc": "none", "int": 0.1, "aff": "theoretical", "au": "Stern, D.B.", "pt": "none", "pg": 71, "pdf": "", "ppg": 50, "pcf": 1.0, "txt": "Under these circumstances, the boundaries between self-states present little or no obstacle to the mind, tra ffic across the lines proceeding with no more notice or eἀort than it takes to cross the demarcation of one municipality from another. But often enough traffic across the boundaries is choked and obstructed, and our theories reflect this. Dynamics and defense are also part of everyday life, and in the conception of the multiple self, defense is the other meaning of dissociation. In this second sense, dissociation is the unconsciously enforced separation or disconnection of the kinds of experience associated with diἀerent selves, a separation motivated by an unconscious discomfort, or even a sense of doom or dread, about certain kinds of experience being simultaneously known, sensed, or felt."}, {"id": 441, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - Partners in Thought (2009)", "pos": 531, "loc": "none", "int": 0.3, "aff": "nostalgic intimacy", "au": "Stern, D.B.", "pt": "none", "pg": 136, "pdf": "", "ppg": 115, "pcf": 1.0, "txt": "Partners in Thought 115 Crusoe were addressing someone, and you soon fall under the spell: It is as if it is you to whom Crusoe is telling what happened to him. I remember feeling an intimacy with Crusoe when I read the book the first time; I felt I was there on that island, just as I felt I was there in that basement with the shrinking man. It was one of the most thrilling reading adventures of my childhood. I remember marveling that Crusoe could live so fully by himself, and now, with the reminder supplied by my recent experience with the shrinking man, I also remember feeling, even as a boy, that the diary must have made Crusoe feel less alone."}, {"id": 442, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - Partners in Thought (2009)", "pos": 570, "loc": "clinician", "int": 0.8, "aff": "defensive shame", "au": "Stern, D.B.", "pt": "unnamed", "pg": 144, "pdf": "", "ppg": 123, "pcf": 1.0, "txt": "I felt defensive and ashamed in reaction to the patient’s accusations. My defensiveness was apparent to me and, I told myself, probably to my patient; but I did not respond with a reciprocal dissociation of my own. I pulled myself together and said something on this order: “I was taken by surprise by what you said [the patient’s accusations against me]—I didn’t know where that was coming from. But now I’m asking myself if the way you felt might have to do with something you sensed during the last session, or when you came in today."}, {"id": 443, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - Partners in Thought (2009)", "pos": 608, "loc": "none", "int": 0.0, "aff": "etymological", "au": "Stern, D.B.", "pt": "none", "pg": 154, "pdf": "", "ppg": 133, "pcf": 1.0, "txt": "The feeling of aἀection evokes the feeling of warmth, and the sense of impor - tance evokes the perception of size, but the reverse does not occur: Large size does not automatically evoke the sense of importance, and higher temperatures do not evoke the feeling of aἀection. 1 Transfer and Transference Here is what we read about the etymology of the word “metaphor,” from the same definition in ἀ e American Heritage Dictionary : Middle English methaphor, from Old French metaphore, from Latin metaphora, from Greek, transference, metaphor, from metapherein, to transfer : meta-, meta- + pherein, to carry. 1 The work of Lakoἀ and Johnson is important for psychoanalysts for a number of reasons, only one of which has to do with a reevaluation of the signi ficance of metaphor. Another contribution made by these authors is to oἀer a way of theorizing all experience to be based in the body (the title of their 1999 book is Philosophy in the Flesh: ἀ e Embodied Mind and Its Challenge to Western ἀ ought ) without resorting to a drive concept. However, as much as I appreciate their thinking and its potential contribution to psychoanalysis, I do not share their epistemological stance. It is true, in one respect, that Lakoἀ and Johnson do away with objectivism."}, {"id": 444, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - Partners in Thought (2009)", "pos": 621, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Stern, D.B.", "pt": "none", "pg": 157, "pdf": "", "ppg": 136, "pcf": 1.0, "txt": "136 Partners in Thought with some portion of the past. But the foreclosing of metaphor also drains meaning from the past—or rather, from the reconstructions of the past we undertake on the basis of what we learn and experience in the present, a process analogous to what Freud (1895, 1918) called deferred action, or Nachträglichkeit. The “frozen” (Modell’s word) metaphoric process, that is, dooms the past to be frozen, as well, because a frozen aspect of the past cannot be reformulated in a way that allows it to serve present purposes. A frozen memory in that sense is a “thing-in-itself,” a concretization that cannot contribute to future meaning, rather like what Bion means by a beta element."}, {"id": 445, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - Partners in Thought (2009)", "pos": 708, "loc": "none", "int": 0.3, "aff": "hypothetical guilt", "au": "Stern, D.B.", "pt": "none", "pg": 176, "pdf": "", "ppg": 155, "pcf": 1.0, "txt": "Of course, even if this portrayal makes sense, it still leaves each member of any couple in the position of sometimes having to put up with certain rather predictable discomforts. It may make us feel and act angry, for instance, when, in the face of our insistence that we are innocent and it is wrong to accuse us, our partner refuses to acknowledge being in the wrong. We may suspect that our partner has a point, which may be uncomfortable, making us feel guilty. We may, in fact, blame our partner for that guilt, too, right along with blaming him for his unwillingness to acknowledge responsibility for being wrong."}, {"id": 446, "tr": "relational_interpersonal", "doc": "Ogden- Elements of Analytic Style.pdf", "pos": 42, "loc": "none", "int": 0.2, "aff": "didactic", "au": "Ogden", "pt": "none", "pg": 13, "pdf": "", "ppg": 129, "pcf": 1.0, "txt": "Analytic style in Bion’s clinical seminars 129 this time that style is the opposite of fashion; it is also the opposite of narcissism. Giving oneself over to fashion arises from the wish to be like others (in the absence of a sense of who one is); narcissism involves a wish to be admired by others (in an effort to combat one’s sense of worthlessness). Following this “digression” in which Bion discusses the difﬁ culties inherent in becoming an analyst, he asks the presenter to tell him more about the session: Presenter: The patient had the impr ession that if he remained on duty [as a doctor at the hospital the previous night] he was going to feel ill. He was not feeling ill – he had the impression that this was going to happen."}, {"id": 447, "tr": "relational_interpersonal", "doc": "Ogden (1992). Comments on T&C on initial analy", "pos": 37, "loc": "patient", "int": 0.6, "aff": "guilty longing", "au": "Ogden", "pt": "H", "pg": 9, "pdf": "", "ppg": 234, "pcf": 0.67, "txt": "In addition, he felt relief in being punished since this is what he unconsciously felt he deserved for the crime he imagined he had committed in relation to his father (i.e., provoking him to the point that he had made him sick and ultimately had killed him). Further , he felt that his father demonstrated love for him in the father's intense, controlling involvement. The patient unconsciously hoped to elicit from me this form of love in the anticipated scolding. Over the course of the analysis, the “telephone caper” served again and again as a symbol of the analytic process."}, {"id": 448, "tr": "relational_interpersonal", "doc": "Ogden (1992). Comments on T&C on initial analy", "pos": 45, "loc": "patient", "int": 0.5, "aff": "conflicted guilt", "au": "Ogden", "pt": "H", "pg": 11, "pdf": "", "ppg": 236, "pcf": 0.67, "txt": "The patient said he felt convinced that he needed treatment and he knew his wife and children would benefit if he were to get help. Nonetheless, he felt extremely guilty about spending money on analysis which could be spent in buying things his whole family could enjoy. I said, after some time had elapsed in the first hour , that the patient seemed to feel that to begin analysis would be equivalent to having an affair . He told me how devoted he was to his wife and that he had never considered the idea of really having an affair ."}, {"id": 449, "tr": "relational_interpersonal", "doc": "Davies, J. (2004). Whose bad objects are we an", "pos": 45, "loc": "clinician", "int": 0.9, "aff": "dread, craziness", "au": "Davies", "pt": "Karen", "pg": 5, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "I will feel as if I have betrayed my therapeutic function by submitting to a psychotic process in Karen and allowing it to dominate our intersubjective space, untouched and unchallenged. And I also know that I will begin to feel crazy myself, as if I have surrendered my mind and my sanity for a few moments of bartered connection and rel i ef . What does a child do when a parent's reality is so vastly different from her own, when a parent's sense of that child's innermost core is so vastly different from the child's own felt experience? How far will a child go for love?"}, {"id": 450, "tr": "relational_interpersonal", "doc": "RECOMMEND Mitchell (1996). Gender and sexual o", "pos": 53, "loc": "dyadic", "int": 0.6, "aff": "emergent potency", "au": "Mitchell", "pt": "James", "pg": 14, "pdf": "", "ppg": null, "pcf": 0.5, "txt": "The dream struck both of us as reflecting the emergence of a sense of potency and vitality that had been previously dissociated or , perhaps, was absent. The potency seems organized within a male identification, as if the emergent sense of power could not quite be contained, not quite imaginable, within a female version of the dreamer . For this dreamer , her sense of being degraded, damaged, and embedded in the constraints of her family was very much centered upon her being female. Having a penis, being male, seemed to carry the hope of a more powerful, vital, expressive self-experience."}, {"id": 451, "tr": "relational_interpersonal", "doc": "RECOMMEND Mitchell (1996). Gender and sexual o", "pos": 68, "loc": "patient", "int": 0.6, "aff": "excited confusion", "au": "Mitchell", "pt": "James", "pg": 17, "pdf": "", "ppg": null, "pcf": 0.5, "txt": "In sexual intercourse, he reported sometimes feeling, at moments of arousal, a confusion about who had the penis, the woman or him. There was something intriguing and exciting about the idea that the woman possessed the penis and was penetrating him, and he enjoyed thinking about what penetration by a penis might feel like. (Perhaps there was an implicit vagina envy there, I don't know.) Not surprisingly, the transference in both analyses was organized largely around an intensely ambivalent longing for and dread of getting something from the analyst, in both cases, men. He saw the analyst as 61 possessing precious analytic knowledge, but denying it to him. His first analyst was classical and quite laconic, and the patient felt that the analyst was deliberately and sadistically withholding his priceless knowledge from him."}, {"id": 452, "tr": "relational_interpersonal", "doc": "RECOMMEND Mitchell (1996). Gender and sexual o", "pos": 102, "loc": "patient", "int": 0.5, "aff": "happy wholeness", "au": "Mitchell", "pt": "James", "pg": 25, "pdf": "", "ppg": null, "pcf": 0.5, "txt": "He still felt a stronger response to men, and needed to discover what a romantic relationship with a man would feel like. So, he sought that out, and fell deeply in love for the first time. He began to make various kinds of contacts with other gay men, along with his straight friends, and felt at one with himself in a way he had never had previously. Some years later , looking back, James noted several times that he felt particularly happy about the relationships he had with women before he moved in a homosexual direction."}, {"id": 453, "tr": "relational_interpersonal", "doc": "RECOMMEND Mitchell (1996). Gender and sexual o", "pos": 104, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Mitchell", "pt": "James", "pg": 25, "pdf": "", "ppg": null, "pcf": 0.5, "txt": "In this sense, I do not agree with Isay that assuming homosexuality to be constitutional provides the most open clinical position. The work with James did not leave me with the conclusion that his particular solution is right for everyone. All patients do not feel compelled, nor should they feel compelled, to try everything. And not every inclination needs to be acted upon to feel one has explored and knows one's sexuality."}, {"id": 454, "tr": "relational_interpersonal", "doc": "Aron 2006. Analytic impasse and the third Clin", "pos": 77, "loc": "clinician", "int": 0.8, "aff": "appalled excitement", "au": "Aron, L.", "pt": "none", "pg": 16, "pdf": "", "ppg": 363, "pcf": 1.0, "txt": "I was so appalled by the violence and so saddened by the loss of life that I didn’t want to let myself see that I also felt some excitement by the very power involved in the horror.’ Would it really be so surprising if following an intervention like this the patient could begin to notice that he also had more than one set of feelings about the disaster? Might not the patient react with something like: ‘Oh, you mean you can actually ﬁ nd the aggression exciting too? Can you at times really feel pleasure at innocent people’s death the way I can?’ The answer to this question, whether articulated to the patient or not, would be: ‘Yes, I can feel such excitement, and it is so appalling to me, so frightening to let myself feel such sadism that I’d rather be repulsed by it in you than recognize and acknowledge it in myself.’ The analyst here is taking a step to the side; she is beside herself, dialoguing with herself, thinking out loud. Where until now there has been a simple line with patient and therapist at opposite ends, there is now triangular space with some increased room to move."}, {"id": 455, "tr": "relational_interpersonal", "doc": "Davies (2003).pdf", "pos": 54, "loc": "patient", "int": 0.6, "aff": "flooded overwhelm", "au": "Davies", "pt": "none", "pg": 19, "pdf": "", "ppg": 18, "pcf": 0.93, "txt": "18 Jody Messler Davies  explore the absence of any external objects of romantic interest that might signal the developmental shift into a more postoedipal/ adolescent form of relationship. They ’ll want to examine why such a shift has failed to occur, the implicit gratifications of such a masochistic entrenchment, and the developmental/historical antecedents in the patient ’s life story. Likewise, the analyst may come to see the patient who does not develop any romantic curiosity or interest in the analyst, not simply as someone who has “resisted ” developing an oedipal transference, but as a person perhaps engaged in a different phase of the process, for example, more concerned with extricating herself from an overly gripping masochistic involvement and seeking instead an analyst who is capable of tolerating the rejection and contempt implicit in the role of the “disappointing and disappointed ” postoedipal parent. Clinical Example Roberta, a 40-year-old woman, entered treatment because she felt sexually flooded and overwhelmed “too much of the time. ” She often felt intruded on by sexual fantasy and explained that she imagined sexual meanings even where she cognitively knew no sexual meanings existed."}, {"id": 456, "tr": "relational_interpersonal", "doc": "Ogden.pdf", "pos": 52, "loc": "dyadic", "int": 0.8, "aff": "defeated exposure", "au": "Ogden", "pt": "unnamed", "pg": 10, "pdf": "", "ppg": null, "pcf": 1.0, "txt": "It was as if the world had already been destroyed and had no future and so it did not even occur to either of us to hide from one another. There was nothing courageous about feeling that way—it did not arise out of a feeling of having conquered fear, but from a sense of utter defeat. Dr Searles said he lived with that feeling most of the time, and added, ‘People sometimes mistake it for arrogance, but it’s not, it’s the opposite of arrogance.’ We listened some more as one Dr Searles after the other arrived and left the room in the recorded session. I told Dr Searles that the patient I had mentioned often ended his sentences with the ‘reassuring’ words, ‘Nothing personal’."}, {"id": 457, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 175, "loc": "clinician", "int": 0.7, "aff": "disoriented arbitrariness", "au": "Ogden", "pt": "Ms C", "pg": 71, "pdf": "", "ppg": 56, "pcf": 1.0, "txt": "water and emptying her bladder with her long-standing pattern of seeming to take in my interpretations only to evacuate them shortly thereafter. I refrained from making these and many other possible interpretations because I felt that to have done so would have been to join the patient in the use of words to obscure my feeling of the arbitrariness of our happening to be in the same room – a room that did not feel like an analytic consulting room at that moment. I made a conscious effort to orient myself to what I was doing there by recalling Ms C’s reasons for having come to see me in the ﬁrst place: she had felt intense feelings of pointlessness in virtually every sector of her life, particularly in her efforts to develop a love relationship with a man. I recalled her having told me in the initial meeting that she had unsuccessfully tried a variety of antidepressant medications."}, {"id": 458, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 183, "loc": "clinician", "int": 0.75, "aff": "tender affection", "au": "Ogden", "pt": "Mr V", "pg": 73, "pdf": "", "ppg": 58, "pcf": 1.0, "txt": "The fact that he had been comatose for almost a day at that point had led me to expect that his body would feel cold. My thoughts moved from these images and sensations concerning E to the surprise and discomfort I had felt during the encounter with Ms C in the waiting room the previous day.The reverie involving the unexpected warmth in E’s hand contributed to my becoming consciously aware of the growing affection I had been feeling for Ms C over the course of the past several weeks. After a time I said to Ms C that I thought I had been off the mark in the previous session when I said that I thought that she had been worried that I would not notice her in the waiting room if she were not standing very close to me when I opened the door. I told her that I now thought that perhaps she simply had wanted to be close to me and I was sorry that I had not allowed myself to know that at the time."}, {"id": 459, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 232, "loc": "clinician", "int": 0.7, "aff": "overwhelmed disconnection", "au": "Ogden", "pt": "Mr V", "pg": 87, "pdf": "", "ppg": 72, "pcf": 1.0, "txt": "I did not feel the least bit heroic in the experience constituting this (second) reverie; I felt a bit disconnected from myself, but mostly I felt keenly aware that I was in over my head. What’s true and whose idea was it? 72"}, {"id": 460, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 236, "loc": "clinician", "int": 0.7, "aff": "fear shame", "au": "Ogden", "pt": "Mr V", "pg": 89, "pdf": "", "ppg": 74, "pcf": 1.0, "txt": "the passageway did not represent an infraction of “analytic rules”; rather, it represented intense, urgent communications of some things he unconsciously believed to be true about himself which he felt were important for me to know from the very outset. Mr V’s reﬂexive response to what I said was to give me the sheepish,bemused smile I had noticed in the passageway.He seemed to be showing me in his facial expression a mixture of what felt like abject surrender and arrogant deﬁance, a particular mix that I would learn over time was characteristic of the patient as a response to certain types of narcissistic anxiety. A brief silence followed in which I recalled in a series of still images, my boyhood experience with R when he fell through the ice. Particularly vivid in this reverie were feelings of fear, shame, isolation and guilt."}, {"id": 461, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 238, "loc": "clinician", "int": 0.55, "aff": "uneasy foreboding", "au": "Ogden", "pt": "Mr V", "pg": 89, "pdf": "", "ppg": 74, "pcf": 1.0, "txt": "My intention was to underscore the ways in which the patient knew, but did not know that he knew, about another level of the experience he had just described. My use of the phrase “no-man’s land,” in re-telling the story Mr V had told me, suggested that he not only felt alone, but also unmanly and like no one. Moreover, in my making explicit that entering the waiting room was, for him, emotionally equivalent to beginning analysis, I was also suggesting that entering the waiting room posed the danger of entering into the potentially crazed world of the unconscious.(The patient’s fear of the out-of-control world of the unconscious was already alive in me in the form of the frightening reverie image of R falling through the ice.) An important shift occurred mid-way through the session, when Mr V , on his own, returned to the experience in the passageway. He made a delicate, yet critical emotional distinction in saying, “I felt caught doing something I shouldn’t have”and then corrected himself:“No that’s not right . . ."}, {"id": 462, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 281, "loc": "clinician", "int": 0.7, "aff": "sad inadequacy", "au": "Ogden", "pt": "Mr V", "pg": 104, "pdf": "", "ppg": 89, "pcf": 1.0, "txt": "I had not felt the need to posture in this way with the parents of any other of my friends. I remembered, too, how surprised I was that G called his mother by her ﬁrst name. I emerged from this reverie with a deep sense of sadness for G, who had lived under such enormous pressure (both internal and external) to be someone he was not for his mother.Who he was – and who I was – was simply not good enough. As my attention returned to Mr B,he was telling me about riding his bicycle to school when he was about ten years old."}, {"id": 463, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 282, "loc": "patient", "int": 0.55, "aff": "secure wonder", "au": "Ogden", "pt": "Mr V", "pg": 104, "pdf": "", "ppg": 89, "pcf": 1.0, "txt": "He would stop periodically along the way and put a leaf or a stone or a bottle cap in a particular place – for example,between the boards of an old fence or in a cave that was “no more than a dug out hole under a big rock.” On the way home from school, he would retrieve these objects. Mr B recalled with pleasure the feel of the wind on his face as he rode home on his bicycle and the feeling of amazement he felt that during the whole time that he was in school these things were there “spending the day doing something else” and were waiting for him on his way home. It seemed that the important thing about this childhood experience was the sense of security that Mr B derived from knowing that these things were alive (alive with meaning) just as he was alive in his own being at school.The carefully placed objects had an existence that went on in his absence: the stone and the leaf and the bottle cap went on being what they were.As Mr B was telling me the story, the sound and cadences of his words reminded me of lines from a Reading Bion 89"}, {"id": 464, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 284, "loc": "patient", "int": 0.75, "aff": "cold loneliness", "au": "Ogden", "pt": "Mr B", "pg": 105, "pdf": "", "ppg": 90, "pcf": 1.0, "txt": "Some months later, as Mr B was beginning to be able to speak more directly about feelings,he told me that as a child,there were long stretches of time during which he felt frightened that he would come home and ﬁnd that his mother had been taken over by aliens – she would no longer be his mother even though she looked exactly like his mother.He would try to devise questions,the answers to which only his real mother would know. He said,“I remember vividly that fear that I felt as a kid and only now recognize the loneliness that went with it. But at this moment, all I feel is cold – not distant or remote – but physically cold, as if the temperature in the room has suddenly dropped by 25 degrees.” VI Discussion The work with Mr B began with an unconscious request that I not be a generic analyst, and instead be a person capable of not knowing who I am and who he is. Only in that way would I be able to be open to what I do not know, i.e., to the O of who he is (and of who I am with him)."}, {"id": 465, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 328, "loc": "clinician", "int": 0.7, "aff": "maddening anger", "au": "Ogden", "pt": "unnamed", "pg": 120, "pdf": "", "ppg": 105, "pcf": 1.0, "txt": "She would then pause, waiting for me to tell her that she had made very good use of the insights she had gained from our analytic work.As the patient waited for me to say my lines, I would feel a form of anger that increased over the course of the years we worked together. Even my anger felt not to be of my own making since the patient was well aware of the maddening effect that her controlling scripting had on me. (“Scripting” and “feeding me my lines” were metaphors that Ms N and I had developed to refer to her efforts to expunge her awareness of the separateness of our minds and of our lives.The metaphors also referred to the patient’s feeling that her mother had treated her as an extension of herself. Perhaps in an effort to separate from her mother psychically, the patient developed anorexia nervosa in adolescence;the disorder continued to play an important role in her life from that point onward.) Ms N used shopping as a way of dissipating feelings of emptiness and loneliness.She would engage saleswomen in expensive clothing stores in a form of theater.The patient directed a scene in which she would try on clothes and the saleswoman would tell her, in a maternal way, how pretty she looked. In the eighth year of the analysis,Ms N began a session by telling me a dream: “I was in a department store that felt cavernous.A tinny voice from the speaker system was giving orders not only to the staff, but also to the customers.There were so many things I wanted to buy."}, {"id": 466, "tr": "relational_interpersonal", "doc": "The+Concept+of+Internal+Object+Relations_ogden", "pos": 54, "loc": "clinician", "int": 0.85, "aff": "panicky drowning", "au": "Ogden", "pt": "unnamed", "pg": 9, "pdf": "", "ppg": 235, "pcf": 1.0, "txt": "When not gratified, the patient would call the therapist a string of mocking names that were repeated so often and so loudly that a fifty-minute session felt to the therapist like being subjected to the din of a jack hammer for hours. The therapist not only felt angry, but also experienced feelings of dis­ organization and utter helplessness that at times reached the point that he felt a panicky feeling that he was drowning. The patient described these sessions as 'negative mind control games', a term which referred to the idea that efforts at control­ ling his mind were 'jammed' and the jamming in turn had the effect of sending the mind control back to its source. In this example, the self-component of an internal object relationship (in which the patient experienced himself as violently intruded upon by his mother) was projected into the therapist."}, {"id": 467, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 39, "loc": "none", "int": 0.1, "aff": "theoretical", "au": "Stern, D.B.", "pt": "none", "pg": 20, "pdf": "", "ppg": 1, "pcf": 0.94, "txt": "I have thought of my work as field theory since I began writing in the early 1980s, and so in one sense every chapter in this book, despite the fact that each has its own particular subject, is also part of my latest attempt to contribute to the development of North American, or interpersonal and relational, field theory. The field’s capacity to generate meaning, and thus fully realized human living, grows from its freedom to respond spontaneously to the feelings, wants, and needs of its participants. To whatever extent this spontaneity is diminished, we can be sure that some part of the field is frozen, constricted, or otherwise rigidified. That position about field events serves as the foundation of the psychoanalysis I practice: my goal is to identify and feel my way into the rigidities in the fields created between my patients and me, and to do what I can to grasp and dissolve them, with the understanding that every one of those compromises of freedom will have to be visited repeatedly and dissolved over and over again."}, {"id": 468, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 45, "loc": "none", "int": 0.2, "aff": "theoretical reflection", "au": "Stern, D.B.", "pt": "none", "pg": 21, "pdf": "", "ppg": 2, "pcf": 0.94, "txt": "Leaving aside the near-certainty that (as psychoanalysis has always taught) we could hardly define any one thing we “really” desire, would we even really want to be able to control our thoughts and feelings? Would it not take the joy out of living to know what we were going to think next? We feel free, real, and alive not when we force our minds to do our bidding (that way lies stagnation, entropy, Thanatos), but when we are able to welcome whatever arrives in our minds unbidden. It has always struck me as ironic that that unbidden quality—that sense that a thought or a feeling comes from elsewhere, but is nevertheless thoroughly our own—is the source of our spontaneity and vitality (Stern, 1990, 2015)."}, {"id": 469, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 163, "loc": "dyadic", "int": 0.85, "aff": "guilty, flustered enactment", "au": "Stern, D.B.", "pt": "unnamed", "pg": 53, "pdf": "", "ppg": 34, "pcf": 0.94, "txt": "It took me a minute or so to finish, and I felt slightly guilty about that when I met him in the waiting room, where (as a result of this guilt, I think) I greeted him in a subdued way that lacked my usual warmth—although I did not make this observation until later, looking back at it. The patient sensed my coolness and took it as evidence (again, noted only later) that I regarded his neediness with the same contempt he was sure his father had felt about it. (It turned out that he had always secretly worried that his neediness was betrayed by the pleasure he routinely took in my appearance and warm greeting in the waiting room.) The episode provoked rage on the patient’s part. He bitterly accused me of being an inadequate analyst and, in fact, a cruel human being who should have known better than to have entered a helping profession. We went through a painful session; but as it went on, I eventually was able to explain what had happened in a way that led him to see that, in that same moment in which he had been convinced that I was (internally) rolling my eyes at what I thought was his pathetic weakness and neediness, I had actually been flustered and defensive about his attack and had not actually been thinking what he had thought I was thinking at all."}, {"id": 470, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 182, "loc": "clinician", "int": 0.4, "aff": "affirming, gentle", "au": "Stern, D.B.", "pt": "Emma", "pg": 59, "pdf": "", "ppg": 40, "pcf": 0.94, "txt": "40 On coming into possession of oneself As usual, you put your observation of yourself in a more negative way than I would. I don’t see a good reason to call it “duping” or false when you present yourself as better put-together than you feel inside. I would say, as a matter of fact, that your capacity to present your - self as better-put-together than you feel is a notable strength. It grows from real self-esteem: you want to present yourself in a way that makes you feel better about yourself than you would if you just gave in to how things feel sometimes."}, {"id": 471, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 185, "loc": "patient", "int": 0.6, "aff": "self-quashing, courageous", "au": "Stern, D.B.", "pt": "Emma", "pg": 59, "pdf": "", "ppg": 40, "pcf": 0.94, "txt": "It is true that Emma is more or less continuously (that is, usually but not always) prepared to quash whatever thought or feeling might result in her feeling good about herself— especially if this thought or feeling originates with her. If it comes from someone else, it might just stand. But if she initiates it, feeling good is dangerous. However, it is also true that Emma is often courageous in questioning these inclinations and self-doubts, thereby leaving herself dangerously unprotected from the humiliation that threatens her whenever she is foolish enough to hope not to be unhappy."}, {"id": 472, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 202, "loc": "patient", "int": 0.7, "aff": "freeing surprise", "au": "Stern, D.B.", "pt": "Emma", "pg": 63, "pdf": "", "ppg": 44, "pcf": 0.94, "txt": "Among Emma’s first reactions to my request was that she would like to read what I wrote about her because it might be like reading over the notes she takes after our sessions, which she said she likes to do. (This was the first time I had understood this, although Emma had told me she takes notes.) Emma said that she reads over her notes because they remind her of what we talked about, which pleases her. But she also likes reading them, she said, because during our sessions she can be so deeply involved in what she is talking about (and sometimes so self-conscious) that she is unable to pay close attention to what she thinks is my experience of her—at least those parts of my experience of her that she can believe are not critical. (She does generally believe that I feel warmly toward her, but of course that conclusion sometimes comes under attack by the selfhateful parts of her.) Reading her notes after the sessions allows Emma the freedom from urgency that she needs in order to imagine more fully and freely the positive parts of what I might have been thinking and feeling. She likes to imagine these things, she said, because, as she reads, Emma knows and can feel that I feel differently about her than she feels about herself. In her words, the surprise she experiences with every read - ing “feels freeing” (her words)."}, {"id": 473, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 304, "loc": "dyadic", "int": 0.8, "aff": "vague guilt, snagged", "au": "Stern, D.B.", "pt": "Emma", "pg": 85, "pdf": "", "ppg": 66, "pcf": 0.94, "txt": "I did not understand what was happening, but was enough aware that something was the matter to feel vaguely guilty about not being more generous. I could not articulate any of this to myself at the time. (This vague discomfort is what I [Stern 2004] have elsewhere described as “affective snags and chafing,” which are mildly uncomfortable emotional alerts that one’s unconscious involvement with the patient needs attention.) Unsurprisingly, Emma reacted to the unmentalized part of my reaction, my annoyance. She became even more unhappy, but she was no more able than I to say why. She, too, was locked into the enactment and could not think."}, {"id": 474, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 307, "loc": "patient", "int": 0.85, "aff": "ashamed, depleted", "au": "Stern, D.B.", "pt": "Emma", "pg": 85, "pdf": "", "ppg": 66, "pcf": 0.94, "txt": "Because I feel too ashamed that I can’t question better or do it the way you say, so I could feel better. And I don’t have enough internal energy to bear quite so much pain, from when I talk about stuff and feel worse and it’s my own fault. I am so sorry. This message broke through something in me, and I immediately grasped, and could name to myself, the subtle annoyed quality and the impatience"}, {"id": 475, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 314, "loc": "dyadic", "int": 0.75, "aff": "disembedding, confused", "au": "Stern, D.B.", "pt": "Emma", "pg": 87, "pdf": "", "ppg": 68, "pcf": 0.94, "txt": "68 Distance and relation thereby had been willing to risk hurting Emma, and that I regretted that outcome and could tolerate knowing this about myself, I began to disembed myself from this episode of autocentric fusion with her and to find my way to a more allocentric attitude. It seems that, just as I had apparently done within my own mind when I reawakened my capacity to observe myself, I now set Emma at a distance that made it possible for me to think about her, and about her and me. Emma answered me as follows: That makes complete sense about talking openly, I will try my absolute best. Sometimes I start getting confused, and I don’t think I even really understand what’s happening (I mean, in the room) or what I’m feeling, except confused and then more and more distanced from you."}, {"id": 476, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 323, "loc": "clinician", "int": 0.7, "aff": "sulking, self-questioning", "au": "Stern, D.B.", "pt": "Emma", "pg": 89, "pdf": "", "ppg": 70, "pcf": 0.94, "txt": "I thought about why I was stuck at this particular juncture. What was going on with me? I thought it was likely that I had been unconsciously sulking, wanting to be able to see our work as good and productive, and to feel that I was a good and helpful analyst. Like Emma’s mother and father, regardless of how Emma felt, I apparently wanted her to cooperate in making me feel like a good analyst."}, {"id": 477, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 380, "loc": "none", "int": 0.2, "aff": "didactic", "au": "Stern, D.B.", "pt": "none", "pg": 99, "pdf": "", "ppg": 80, "pcf": 0.94, "txt": "80 Interpretation you like about yourself or are proud of. The most significant interpretations are those that reveal something about which the patient is uncomfortable or anxious or ashamed, or even something that provokes the patient’s rage at others, or self-hatred. But in an episode of recognition and witnessing, such things are revealed without provoking shame. The patient feels that the analyst sees something about the patient that the patient may feel awful about but, unlike what began in the patient’s experience with parents, and what keeps happening in the patient’s contemporary life, the analyst manages to draw attention to these affective events without provoking shame or some other break in the emotional connection."}, {"id": 478, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 417, "loc": "clinician", "int": 0.7, "aff": "surprised, hesitant", "au": "Stern, D.B.", "pt": "Alan", "pg": 109, "pdf": "", "ppg": 90, "pcf": 0.94, "txt": "I don’t know exactly how I knew, but it was clear to me that it was this incident that Alan was referring to when he mentioned the session on Friday. I now thought I was a little clearer that Alan’s curt laugh a moment earlier, when he said, “But I guess I don’t have to worry,” had sounded sardonic to me, as if it expressed a certain lowkey bitterness. That was what had surprised me, and was the thing that I did not yet feel ready to address. I could not at that moment formulate the thought, but later on I could see that it was as if I imagined Alan feeling something like, “Why do I go around worrying about him!"}, {"id": 479, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 421, "loc": "dyadic", "int": 0.8, "aff": "contemplative opening", "au": "Stern, D.B.", "pt": "Alan", "pg": 110, "pdf": "", "ppg": 91, "pcf": 0.94, "txt": "I’m talking about what you might have felt, whether or not you thought it was reasonable.” There was a minute or two of what felt to me like a contemplative silence. Then, signaling that the field had altered yet again, Alan sighed deeply and said, with feeling, “Yeah, I hadn’t really let myself think about it, but I didn’t like it.” This moment opened into Alan’s slightly new experience of his own feelings, and thus into new perceptions of me (that I can be involved in my own agenda to an extent that his interests suffer) and also of himself (he doesn’t like it when I do that). Over the next two weeks Alan began for the first time to experience angry feelings toward his highly narcissistic mother, whom he had tried very hard not to burden (by doing whatever he could to be a good boy). Alan had known that he must be angry with her, because even he could see that any child of hers would have to be, but he had not been able to feel it, and he offered endless excuses for her."}, {"id": 480, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 519, "loc": "clinician", "int": 0.8, "aff": "heavy inadequacy", "au": "Stern, D.B.", "pt": "Alan", "pg": 130, "pdf": "", "ppg": 111, "pcf": 0.94, "txt": "This sense of inadequacy was not a thought; it was a feeling, and not a specifiable feeling, not something I could point to, not something I even had words for at that time. When I think back on it, I think it was more a sense of heaviness and threat that weighed on me like a heavy blanket. Actually, it is not true to say that I could observe nothing beyond this woman’s perfection. I have mentioned being impressed with her impenetrability."}, {"id": 481, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 662, "loc": "patient", "int": 0.6, "aff": "anxious avoidance", "au": "Stern, D.B.", "pt": "Alan", "pg": 159, "pdf": "", "ppg": 140, "pcf": 0.94, "txt": "To be fully transparent I haven’t listened to your voice messages because as you might suspect it kinda makes me feel worse. I was feeling on Friday like I was just getting pulled in every direction socially and therefore bound to let everyone down. So anxiety kinda kicked in and said, “Escape to the Hamptons.” I wanted to speak to you on the phone this morning during my session time. What comes next is a long and detailed explanation of what stopped him from calling on that particular morning."}, {"id": 482, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 703, "loc": "dyadic", "int": 0.6, "aff": "mutual disavowal", "au": "Stern, D.B.", "pt": "Alan", "pg": 168, "pdf": "", "ppg": 149, "pcf": 0.94, "txt": "I would say that whatever was not meaningful, it was not a particular experience; the problem could not be assuaged by the revelation of a particular content. No, what Alan and I would not allow to become meaningful was an aspect of our identities—both of us. Alan felt stifled by the expectation that he attend sessions, but he could not tolerate being the bad boy, and so he managed to miss his sessions while feeling utterly helpless to do otherwise. And from my end: I didn’t want to believe I was trying to persuade or coerce him to attend his sessions, and so preserved my image of myself as a good analyst by expressing myself in interpretations that were manifestly about his unconscious motives, but which probably also conveyed to him the message that he should cut it out."}, {"id": 483, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 705, "loc": "patient", "int": 0.4, "aff": "coming alive", "au": "Stern, D.B.", "pt": "Alan", "pg": 168, "pdf": "", "ppg": 149, "pcf": 0.94, "txt": "His sessions came to feel as if they belonged to someone else, as so much of his life has always felt. What I said to Alan about talking about whatever was in his head had the effect of helping him to formulate his experience with me, awakening his capacity to feel that his sessions were his own, so that the experience came to “feel like me.” The experience became meaningful and alive once"}, {"id": 484, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 715, "loc": "clinician", "int": 0.7, "aff": "identified concern", "au": "Stern, D.B.", "pt": "Alan", "pg": 171, "pdf": "", "ppg": 152, "pcf": 0.94, "txt": "152 The emergence of meaning might very well be a hostile intention buried somewhere in all of this, but I trusted that the absence on my part of an affective response to such an intention (I did not even feel the kind of uncomfortable “snag” or “chafing” (Stern, 2004) that I associate with the presence of an enactment as yet invisible) was a good reason not to make that the focus of my intervention. Instead, I now found myself identified with the part of Alan who really was disappointed in himself and felt like he was a failure, what he had just described as “completely pathetic.” Without giving the matter a great deal of thought, other than to turn my attention inward and reassure myself that I believed I was speaking in support of the treatment and Alan himself, I said, “You know, Alan, actually I think that you always do as much as you can to get to your sessions.” I meant this, despite my recognition of the possibility that we might eventually complicate our picture of such events with the recognition of provocation on Alan’s part. I believed that, within the limits imposed by his unconscious involvement, which were (by definition) outside his ken, Alan was indeed doing his best to come, and was as baffled as I was by his difficulty. There was a long silence, perhaps two or three minutes."}, {"id": 485, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 723, "loc": "patient", "int": 0.4, "aff": "ashamed pleasure", "au": "Stern, D.B.", "pt": "Alan", "pg": 172, "pdf": "", "ppg": 153, "pcf": 0.94, "txt": "Another relevant thing I knew: when Alan missed sessions, he felt appreciative of the calls I made to try to reach him. They made him feel well cared for, and he was ashamed of the pleasure he took in that. He had even imagined (reasonably enough, to me) that provoking me to behave this way could be one of the many reasons he missed sessions. One more thing I knew: when he was growing up, Alan looked forward on weekend mornings to being able to go to his parents’ room and “cuddle” with them in bed."}, {"id": 486, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 727, "loc": "patient", "int": 0.5, "aff": "unsafe vulnerability", "au": "Stern, D.B.", "pt": "Alan", "pg": 173, "pdf": "", "ppg": 154, "pcf": 0.94, "txt": "He said he wasn’t sure that could ever happen. Why? Because it would require that the situation feel completely safe, and Alan didn’t know exactly how it could feel that way. A few minutes earlier, Alan had begun talking about the part of him that he felt most comfort - able with as “the dominant part of me.” And so now, I said yes, of course it didn’t feel safe, because the reason Alan was there, at least according to his dominant part, and probably according to most of the rest of the world, as well (at least in Alan’s mind), including me, was to get rid of the little boy."}, {"id": 487, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 783, "loc": "none", "int": 0.2, "aff": "theoretical", "au": "Stern, D.B.", "pt": "unnamed", "pg": 188, "pdf": "", "ppg": 169, "pcf": 0.94, "txt": "Flirtation, we shall say, has been infected by the patient’s anxiety about sexuality. My patient is therefore hobbled in such a context. He is unlikely to have access to the experience that he would need in order to make ongoing, intuitive sense of the other person’s flirting, or to participate in a natural way in the flirting himself. He is overcome with anxiety, both because of what he does grasp (again, nonverbally) about this kind of relatedness, and because of what his anxiety prevents him from comprehending."}, {"id": 488, "tr": "
