relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 1084, "loc": "none", "int": 0.1, "aff": "expository", "au": "Stern, D.B.", "pt": "none", "pg": 253, "pdf": "", "ppg": 234, "pcf": 0.94, "txt": "He laid out, with his customarily compelling style, a way of understanding that mind is composed of interpersonal relations that have become structuralized. (Being compelling was not something he did only in print—he was the most compelling of human beings.) Philip took his interest in dissociation from Sullivan’s understanding of anxiety. For Sullivan, dissociation is understood as the defensive response to intense anxiety, which in its most extreme forms Sullivan described as “uncanny affect.” Anxiety was defined by Sullivan in a way that is still not widely understood. Sullivan’s anxiety theory was foundational for Philip: and although he didn’t often address it explicitly after those first papers in the 1980s, it is baked into all of his work. And so I will say a few words about it."}, {"id": 489, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 1101, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Stern, D.B.", "pt": "none", "pg": 261, "pdf": "", "ppg": 242, "pcf": 0.94, "txt": "242 Field theory and the dream sense Field theory and the dream sense only the comparison of our two kinds of field theory but also the dialogue between us.1 The chapter has two sections. In the first part I discuss differences between Bionian field theory, on one hand, and interpersonal and relational psychoanalysis, on the other. I take up two points: (1) the significance of the analyst’s subjectivity in the co-creation of the analytic field; and (2) the significance of trauma. In the second part, I turn to what the two schools of field theory share, focusing largely on the phenomenon of emergence and what I call “the dream sense.” Part 1: The analyst’s subjectivity Although the concept of the field is recognized much more frequently in psychoanalysis than it once was, most psychoanalysts still ground their views of clinical process in the individual mind: the analyst studies the patient’s experience, looking for its unconscious roots, and offers such understanding to the patient when it becomes possible to do so."}, {"id": 490, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - Partners in Thought (2009)", "pos": 271, "loc": "dyadic", "int": 0.5, "aff": "attuned startle", "au": "Stern, D.B.", "pt": "unnamed", "pg": 74, "pdf": "", "ppg": 53, "pcf": 1.0, "txt": "In neither instance (that is, when he felt good or when he felt deflated) was he necessarily aware, between the sessions, that these feelings had to do with our relationship; but he was very open to understanding them in this way when he returned for his next session, and he felt that we were on to something significant. We both felt that way. On the day in question, Daniel heard me rustling around behind him (he was on the couch). He turned around to face me and snapped, “What are you doing?” He has very good peripheral vision (this had already been established), and so, because my chair is not positioned directly behind the couch but slightly to the side, he had been able to see that I was leaning forward to look at my appointment book."}, {"id": 491, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - Partners in Thought (2009)", "pos": 294, "loc": "clinician", "int": 0.8, "aff": "guilty annoyance", "au": "Stern, D.B.", "pt": "unnamed", "pg": 79, "pdf": "", "ppg": 58, "pcf": 1.0, "txt": "I tried over and over again to get it just right. Yet she still said that I was hurting her more with each one of my mistakes. She was angry at me about what she felt was my refusal to see things from her point of view; but what I responded to more directly was her hurt. Despite my very clear awareness that she and I had to be participating in some kind of enactment, I began to feel guilty that I could not grasp what she was talking about, guilty that I was hurting her and annoyed at what seemed to me to be her influence on my taking these emotional paths."}, {"id": 492, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - Partners in Thought (2009)", "pos": 298, "loc": "clinician", "int": 0.85, "aff": "guilty, pained", "au": "Stern, D.B.", "pt": "unnamed", "pg": 80, "pdf": "", "ppg": 59, "pcf": 1.0, "txt": "This was not a good situation. I found it increasingly painful. I felt more and more guilty about my feelings and my seeming inability to stifle their expression (which I hardly thought was a good solution, but I had no other for the time being). And, of course, I also felt guilty about what seemed to me to be my failure to be of use."}, {"id": 493, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - Partners in Thought (2009)", "pos": 449, "loc": "clinician", "int": 0.7, "aff": "conflicted curiosity", "au": "Stern, D.B.", "pt": "unnamed", "pg": 116, "pdf": "", "ppg": 95, "pcf": 1.0, "txt": "Think of the separation between the part of me that wanted to enjoy my patient’s “progress” and the part that felt guilty about sacri ficing my capacity to observe and thereby letting my patient down. From the constructivist perspective, the latter self-state (the guilty self-state) did not exist in symbolic form anywhere in my mind until that strange aἀective deadness crept into the sessions and, in making me realize that “something” was there, aroused my dormant curiosity about what was happening. Under the circumstances provoked by aἀective cha fing, the guilty self-state came into being (was formulated), and conscious internal conflict was finally possible. My previous “single-mindedness” was not due to the denial of an existing conflict inside me; it was due to an (unconsciously) insistent absence of curiosity on my part, created and fostered by my participation in the enactment."}, {"id": 494, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - Partners in Thought (2009)", "pos": 469, "loc": "clinician", "int": 0.8, "aff": "guilty pleasure", "au": "Stern, D.B.", "pt": "unnamed", "pg": 121, "pdf": "", "ppg": 100, "pcf": 1.0, "txt": "As time passed and I regained my tolerance of myself, finding it possible to experience guilt and pleasure simultaneously, even if it was not com - fortable, my pleasure was recontextualized yet again, this time by my growing sense that both my states—my pleasure and my guilt—were understandable responses to the patient’s part of the enactment. And so, though my experience of pleasure was explicit all along, it did not remain the same pleasure: Its meaning and the way it felt to me changed as my previously dissociated state become possible to formulate. What began as naive pleasure first morphed into a symptom of my narcissism and eventually took its place, in my mind, as part of the enactment between the patient and me. The same kind of process went on regard - ing my explicit experience of the patient: I began by accepting his mar - velous progress at face value, feeling encouraged by it, then moved to a position in which his progress appeared false and made me feel like a vain failure and annoyed with him that he had taken me for a ride."}, {"id": 495, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - Partners in Thought (2009)", "pos": 476, "loc": "none", "int": 0.1, "aff": "theoretical", "au": "Stern, D.B.", "pt": "none", "pg": 123, "pdf": "", "ppg": 102, "pcf": 1.0, "txt": "Neither the patient nor the analyst is any more capable of experiencing himself creatively than he is of recognizing the other. Both participants fail to appreciate the fullness of both of their minds. The most important outcome of a successful analysis is the firm and unthinking conviction that one’s life is one’s own, that oneself and no one else is living it. Frequently this feeling that one’s life is the creation of one’s own mind—which in dryer terminology we can describe as the sense of agency—arises from our access to the experience of conflict, because when we are able to face the necessity for choosing the perspective we will take on the problems that face us, we are able to feel our own hand on the tiller. 1 In enactment, by contrast, experience either feels as if one is helpless to shape or in fluence it (and one may desperately wish to do just that) or as if it is being imposed by the other."}, {"id": 496, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - Partners in Thought (2009)", "pos": 477, "loc": "none", "int": 0.2, "aff": "powerless (general)", "au": "Stern, D.B.", "pt": "none", "pg": 123, "pdf": "", "ppg": 102, "pcf": 1.0, "txt": "Sometimes it just goes by unnoticed. All these kinds of experience, but especially the sense of being forced, are among the factors most responsible for feelings we all often have in enactments, feelings of powerlessness and lack of ownership of our own minds. We feel enslaved; we feel made to live this way, and we feel as if we cannot 1 It bears repeating, though, that the perspectives from which we choose are not constructed on a merely conscious basis. The availability of perspectives is a matter of intentionality far deeper than conscious decision making."}, {"id": 497, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - Partners in Thought (2009)", "pos": 510, "loc": "none", "int": 0.1, "aff": "theoretical", "au": "Stern, D.B.", "pt": "none", "pg": 132, "pdf": "", "ppg": 111, "pcf": 1.0, "txt": "We may no longer need the other actually to show us the meaning of our experience, as we did when we were infants; but if we are to know our own experience in reflective terms, if we are to be able not only to construct narratives, but to be aware of the narratives we construct, we do need to believe that we are known by the other. We need to feel that we exist in the other’s mind, and that our existence has a kind of continuity in that mind; and we need to feel that the other in whose mind we exist is emotionally responsive to us, that he or she cares about what we experience and how we feel about it (Bach, 2006; Benjamin, 1988, 1990, 1995). This is what it is, I believe, to have a witness. Without a witness, even an imaginary witness, events either fail to fall into the meaningful pattern of episode that is narrative, or we merely enact our stories blindly, unable to think about them or know what they feel like."}, {"id": 498, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - Partners in Thought (2009)", "pos": 564, "loc": "clinician", "int": 0.5, "aff": "uncomfortable guilt", "au": "Stern, D.B.", "pt": "none", "pg": 143, "pdf": "", "ppg": 122, "pcf": 1.0, "txt": "122 Partners in Thought sense that I am not doing anything problematic—it’s just that the patient is impossibly sadistic. I will almost undoubtedly feel uncomfortable in this position, probably guilty about being a bad analyst, but I will see no way out of it for the time being. Mutual enactments, which are not as uncommon as the traditional psychoanalytic literature might be read to suggest, may go on over significant periods and often pose a genuine threat to the treatment (D. B."}, {"id": 499, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - Partners in Thought (2009)", "pos": 575, "loc": "dyadic", "int": 0.6, "aff": "hurt, warm", "au": "Stern, D.B.", "pt": "unnamed", "pg": 145, "pdf": "", "ppg": 124, "pcf": 1.0, "txt": "124 Partners in Thought disconfirmed. This was not primarily a cognitive signification for him. The patient could feel or sense what it was like for me to be with him through the course of his accusations. That was important; but more important yet was that the patient felt for one of the first times the con fidence that I had felt hurt or angry with him without losing track of my warm feelings about him (or losing track of them only very temporarily)."}, {"id": 500, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - Partners in Thought (2009)", "pos": 623, "loc": "none", "int": 0.1, "aff": "theoretical", "au": "Stern, D.B.", "pt": "none", "pg": 157, "pdf": "", "ppg": 136, "pcf": 1.0, "txt": "In order to know or reflect, one must be able to feel something that would be put into words as some version of, “Oh, yes, that was one of the times that I felt (or did or thought, etc.) …” or “Oh, yes, that was like the feeling I had when …”. To relate to an experience as an experience of a certain kind, a member of a certain emotionally defined category, in other words, is what allows us to reflect on that experience. As in the case of transference, the very belongingness of the experience to the category allows us to appreciate its uniqueness. If an experience cannot belong to a category, as trauma cannot, if it must exist in isolation, as a concretization, a “singularity,” it must remain a thing-in-itself and cannot be cognized, known, or felt."}, {"id": 501, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - Partners in Thought (2009)", "pos": 640, "loc": "none", "int": 0.25, "aff": "tolerating ambivalence", "au": "Stern, D.B.", "pt": "none", "pg": 161, "pdf": "", "ppg": 140, "pcf": 1.0, "txt": "140 Partners in Thought Some states coexist comfortably—that is, from within some states, I can bear to feel that certain other states are also “me.” From within a comfortable, self-assured state of being, for instance, although I may not like having to accept the part of me that tends to feel envious of others under certain circumstances, I can at least tolerate knowing and feeling that both are me. If I could not tolerate that knowing and feeling, the states would be dissociated, which would mean that they could not be experienced simultaneously and would remain sequestered from each other. From within the parts of my experience that I accept as me, the rejected part of my experience is alien to me. I cannot and will not tolerate its presence within what feels like it is mine."}, {"id": 502, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - Partners in Thought (2009)", "pos": 653, "loc": "clinician", "int": 0.55, "aff": "wary, attuned", "au": "Stern, D.B.", "pt": "unnamed", "pg": 163, "pdf": "", "ppg": 142, "pcf": 1.0, "txt": "She could not be vulnerable to me, in other words, and I felt sure that I was not the only one with whom she felt this way. As a matter of fact, I imagined that this might be exactly the problem she was encountering in maintaining a romantic relationship. I could not just oἀer the patient that observation, though, not unless I had something to say that would help her make use of it in a way that did not potentiate the shame I could sense in the wings. Time was running out."}, {"id": 503, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - Partners in Thought (2009)", "pos": 719, "loc": "patient", "int": 0.4, "aff": "distressed, helpless", "au": "Stern, D.B.", "pt": "none", "pg": 178, "pdf": "", "ppg": 157, "pcf": 1.0, "txt": "Typically, the first relationship then ends, sometimes with great guilt on the part of the restless partner, who is tortured by the unmistakable pattern, but helpless to feel otherwise. With the background of dissociation theory, I would now say that these are not actually people who cannot get into relationships. People like Brett get into them all the time! The problem, rather, is that the Bretts of this world can allow relationships to take only one course: They are stuck in a rigid pattern with their partners, and the particular nature of this pattern, in which, for one reason or another (diἀering with the person concerned), intimacy threatens the eruption of not-me, makes relationships too dangerous to maintain once a certain level of intimacy is reached. (I turn to an example of such a pattern in a moment.) Brett was so distressed and helpless about this kind of problem that it was his primary motive to enter treatment."}, {"id": 504, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - Partners in Thought (2009)", "pos": 725, "loc": "none", "int": 0.3, "aff": "anticipatory dread", "au": "Stern, D.B.", "pt": "unnamed", "pg": 180, "pdf": "", "ppg": 159, "pcf": 1.0, "txt": "Opening What Has Been Closed, Relaxing What Has Been Clenched 159 As soon as this patient begins to feel, probably without awareness, slight stirrings of aἀection for the women he meets, or the whiἀ of a desire for their love of him, he loses interest, begins to characterize his women friends as dull, and feels like moving on. His growing feeling that they are dull and boring dampens whatever aἀection they might have been in the process of developing, thereby closing the circle and giving him that much more reason to be afraid of arousing love the next time around. If this man is to find his way into a relationship that lasts, one with mutual love, it seems likely that it will only be through the repeated appearance and transcendence of just this kind of enactment between him and his analyst. Such an accomplishment would probably require the patient to experience dread and at least the danger of humiliation (and perhaps the real thing); and in the course of the enactments that would have to take place, the analyst would no doubt be the object of feelings ranging from deadness to rejection to contempt."}, {"id": 505, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - Partners in Thought (2009)", "pos": 837, "loc": "none", "int": 0.1, "aff": "conceptual", "au": "Stern, D.B.", "pt": "none", "pg": 205, "pdf": "", "ppg": 184, "pcf": 1.0, "txt": "Let us call this “something in mind” an image, in the broadest sense of the term. The image can be an idea, a movement, a gesture, an aἀect, a vitality aἀect, a background feeling. None of these are presently in verbal form. A nonverbal “something in mind” is reminiscent of what I mean by “unformulated experience” (D."}, {"id": 506, "tr": "relational_interpersonal", "doc": "Ogden- Elements of Analytic Style.pdf", "pos": 20, "loc": "patient", "int": 0.5, "aff": "frightened unthinking", "au": "Ogden", "pt": "unnamed", "pg": 6, "pdf": "", "ppg": 122, "pcf": 1.0, "txt": "Speaking to “the non-psychotic part of the patient’s personality” (Bion, 1957), the part capable of thinking and doing psychological work, Bion begins by naming in the simplest, most literal terms the objects that are in the consulting room (which are swirling with uncontrolled meaning for the patient because she is frightened and unable to think): “We have here these chairs, this couch, because you might want to use any of them.” Bion, in this way, not only tells the patient what the objects are – as external objects – he also tells her implicitly that they are there for her to use as analytic objects, objects that may be used in dreaming up an analysis, if she wishes to try to do so (with his help). He continues: “you might want to sit in that chair, or you might want to lie on that couch in case you feel that you couldn’t bear sitting there – as you say today.” Here, Bion tells the patient that he thinks that she may be frightened of using the chair today. I believe that Bion is implicitly speculating imaginatively that the chair, for the patient, is a psychological place that once held magical power to protect her against what she fears would happen if she “really” were in analysis. The chair, for some reason, has lost its power today."}, {"id": 507, "tr": "relational_interpersonal", "doc": "Ogden- Elements of Analytic Style.pdf", "pos": 44, "loc": "none", "int": 0.2, "aff": "puzzled inquiry", "au": "Ogden", "pt": "unnamed", "pg": 13, "pdf": "", "ppg": 129, "pcf": 1.0, "txt": "Here again, the interpretation has a surprisingly pragmatic feel to it: the patient has chosen a career for which he is not emotionally equipped – he seems not to be able to face other people’s fears without becoming frightened and depressed himself. But, of course, there is more to the interpretation than that. Bion is focusing on a striking contradiction that seems to provide a sense of the nature of the emotional problem for which the patient is seeking help in this session. Why is the patient presenting the analyst with a contradiction in this particular way, at this moment?"}, {"id": 508, "tr": "relational_interpersonal", "doc": "Ogden (1992). Comments on T&C on initial analy", "pos": 13, "loc": "clinician", "int": 0.4, "aff": "deliberate appraisal", "au": "Ogden", "pt": "none", "pg": 4, "pdf": "", "ppg": 229, "pcf": 0.67, "txt": "When a patient phones inquiring about working with me in therapy or analysis, I suggest to the patient that we find a time to meet for a consultation. I intentionally use the word consultation in order to make it clear that this meeting will not necessarily be the beginning of ongoing work together (despite the fact that I intend it to be an analytic experience regardless of what the outcome of the meeting might be). I do this because I cannot know ahead of time whether , after talking with the patient, I will feel that I can be of help to him and will want to work with him. Among the multiplicity of factors that go into making this determination is the question of whether I feel that I generally like the patient and feel some concern for and interest in him."}, {"id": 509, "tr": "relational_interpersonal", "doc": "Ogden (1992). Comments on T&C on initial analy", "pos": 23, "loc": "none", "int": 0.2, "aff": "prescriptive", "au": "Ogden", "pt": "none", "pg": 6, "pdf": "", "ppg": 231, "pcf": 0.67, "txt": "One must not deprive him of his opportunity to write the opening lines of his own analytic drama by burdening him with the analyst's unconscious contents before he even sets foot in the consulting room. (There will be plenty of time for that later , as the analyst inevitably becomes an unwitting actor in the patient's unconscious fantasies.) Finally, a comment of the type being discussed misleads the patient about the nature of the analytic experience. As analysts, we do not intend to relieve anxiety (our own or the patient's) through tension-reducing activity, reassurances, gift-giving, or the like. Since maintaining psychological strain is not only something we demand of ourselves but is also part of what we ask of the patient, it makes no sense to begin the analytic relationship with an effort at dissipating psychological strain. Whether the incident is ever spoken of again, the analysand unconsciously registers the fact that the analyst has granted himself license to handle his own anxiety by means of countertransference acting in."}, {"id": 510, "tr": "relational_interpersonal", "doc": "Ogden (1992). Comments on T&C on initial analy", "pos": 47, "loc": "clinician", "int": 0.3, "aff": "wary suspicion", "au": "Ogden", "pt": "unnamed", "pg": 11, "pdf": "", "ppg": 236, "pcf": 0.67, "txt": "The internal drama the patient seemed to be bringing to the analytic relationship was one in which there was an anticipation of passionate attachment and intense secretiveness. It was within this area of experience (the “affair”) that I suspected Mr . J was afraid that analysis would become extremely painful and perhaps become impossible to continue. In the course of the succeeding several years of analysis the patient was able to make sense of these feelings in terms of a relationship that he had had with a nanny whom he had loved deeply, a love he unconsciously felt he had to keep secret from his mother ."}, {"id": 511, "tr": "relational_interpersonal", "doc": "Ogden (1992). Comments on T&C on initial analy", "pos": 52, "loc": "clinician", "int": 0.4, "aff": "surprised", "au": "Ogden", "pt": "Mr. N", "pg": 12, "pdf": "", "ppg": 237, "pcf": 0.67, "txt": "N said that he is a large man, that he speaks in a booming voice, and that people are often frightened by him even when he is not angry. He said that, despite all this, he hoped the therapist would not be afraid of him since he was not a dangerous person and had never attacked anybody. When Mr . N appeared for his initial meeting, the therapist was surprised to find him a man of average build who spoke in a pressured but not a loud or bullying manner ."}, {"id": 512, "tr": "relational_interpersonal", "doc": "Davies, J. (2004). Whose bad objects are we an", "pos": 41, "loc": "dyadic", "int": 0.95, "aff": "frenzied dread", "au": "Davies", "pt": "Karen", "pg": 5, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "I often feel pressed into a position in which the only way to af f i rm a pati ent's sani ty and experi ence of real i ty i s to accept a vi si on of mysel f that i s so toxi c and mal i gnant that i t f eel s threatening to my own sense of stability and identity, and I begin to feel crazy myself. The presence of a psychotic parent—of one who forced the acceptance of an insane reality as the precondition for a loving relationship onto and into a vulnerable child—hovers around the consulting room, exuding a malignant and sulfurous stench, fueling the game of projectiveintroje ctive hot potato from which the patient and I struggle to emerge intact. There is a desperate frenzy to our struggle, as though we are playing the children's card game “ Old Maid,” in which the dark and foreboding queen of spades skulks around the table—inside one hand and then another, inside me and then you, popping up here and then there: “ Not me; I don't want her. Get rid of her; pass her on to someone else."}, {"id": 513, "tr": "relational_interpersonal", "doc": "Davies, J. (2004). Whose bad objects are we an", "pos": 60, "loc": "none", "int": 0.3, "aff": "reflective", "au": "Davies", "pt": "none", "pg": 7, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "Let me suggest the possibility that the analyst as child among his or her own bad objects struggled to feel sane amidst insanity; to preserve his or her sense of mental integrity by seeing more clearly the pathology of others. “ To feel sane I must forego love.” In later work with patients, the analyst is caught between the counterbalancing needs of continuing to locate pathology clearly in the other and not the self and also of curing the other, who is seen as sick, so that the analyst may be loved and nourished once again. Perhaps more than others, WARNING! This text is printed for the personal use of the subscriber to PEP Web and is copyright to the Journal in which it originally appeared."}, {"id": 514, "tr": "relational_interpersonal", "doc": "Davies, J. (2004). Whose bad objects are we an", "pos": 70, "loc": "clinician", "int": 0.6, "aff": "questioning urgency", "au": "Davies", "pt": "Karen", "pg": 8, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "Was Karen afraid that I was going to die like her father? How did this relate to the unconscious fantasies she harbored about the reasons for her father's sudden death and about the role of her own aggressive and murderous thoughts? Should I interpret her outrage and horror at his abandonment, her sense of guilty responsibility for his death, her compulsive need to destroy and then feverishly resuscitate all that is good in her present relationships? Or was this interaction about a more loving, less ambivalently attached, more genuinely nurturing self who had somehow died along with her father?"}, {"id": 515, "tr": "relational_interpersonal", "doc": "Davies, J. (2004). Whose bad objects are we an", "pos": 78, "loc": "clinician", "int": 0.7, "aff": "tender soothing", "au": "Davies", "pt": "Karen", "pg": 8, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "How WARNING! This text is printed for the personal use of the subscriber to PEP Web and is copyright to the Journal in which it originally appeared. It is illegal to copy, distribute or circulate it in any form whatsoever. - 726 - different “ I feel lousy” would seem if it were accompanied by emotional flatness and withdrawal or by a sense of overwhelmed desperation akin to her mother's depressions. I take Karen's mug in my own hands, breathing in its healing, aromatic warmth."}, {"id": 516, "tr": "relational_interpersonal", "doc": "RECOMMEND Hirsch 1994. Countertransference Lov", "pos": 19, "loc": "none", "int": 0.2, "aff": "critical detachment", "au": "Hirsch", "pt": "unnamed", "pg": 5, "pdf": "", "ppg": 174, "pcf": 1.0, "txt": "From my perspective, she gave Dewald just the sort of analytic material he needed to publish a book validating his preferred analytic model. This countertransference enactment never came close to being analyzed since the analyst, based on his theoretical schema, could not have possibly seen this sadomasochistic, sexually charged interaction from a two-person psychology point of view. His patient's explicit and often highly erotic sexual material was interpreted as infantile sexuality, and there was no indication that he felt any sexual (infantile or mature) feelings in reciprocation or that his idealized position in her life pulled for such feeling in her . He 175 viewed himself as an entirely neutral nonparticipant in her transference."}, {"id": 517, "tr": "relational_interpersonal", "doc": "Davies 2005. Transformations of desire and des", "pos": 39, "loc": "dyadic", "int": 0.6, "aff": "shared shame", "au": "Davies", "pt": "Karen", "pg": 12, "pdf": "", "ppg": 789, "pcf": 1.0, "txt": "It was only in seeing me own and attempt to metabolize my own destructiveness and shame that Karen could overcome enough of the blinding shame she felt regarding her own malignant envy and rage, to halt the process of projective evacuation and to begin 790 bridging the split into complementarity that made feeling loved and feeling sane, at the same time, irreconcilable experiences for much of Karen's life. I invite you now to once again join Karen and me. We are, at this point, eight years further along into Karen's analysis. The selves now set before you would probably, on the surface, be unrecognizable to those of you who suffered with me through some of the more difficult phases of my work with Karen in the earlier paper ."}, {"id": 518, "tr": "relational_interpersonal", "doc": "Davies 2005. Transformations of desire and des", "pos": 82, "loc": "clinician", "int": 0.7, "aff": "guilty responsibility", "au": "Davies", "pt": "Karen", "pg": 21, "pdf": "", "ppg": 798, "pcf": 1.0, "txt": "We trust in the strength of what has already been created. I will spare you the expletives that followed any attempt on my part to empathize with the pain I was creating for Karen with my decision. And yet I felt that I must take some responsibility for the pain she was feeling. I felt that I must also reassure Karen that her wanting me at her wedding was neither childish nor stupid."}, {"id": 519, "tr": "relational_interpersonal", "doc": "RECOMMEND Mitchell (1996). Gender and sexual o", "pos": 7, "loc": "none", "int": 0.3, "aff": "reflective", "au": "Mitchell", "pt": "none", "pg": 2, "pdf": "", "ppg": null, "pcf": 0.5, "txt": "As I reflected further , it suddenly occurred to me that my father was actually the last person in the world from whom I could have learned that larger lesson. My father was generally a very anxious person, and during my childhood he was under a great deal of stress, which he talked about frequently, often with great panic. To return to the baseball metaphor, he presented himself as if the next grounder would surely knock him over and out of the game for good. As I thought about it, I realized that the person from whom I had learned whatever I know about facing problems squarely and believing in my own resources and 46 instincts, was my mother , a much steadier , quietly steadfast, extremely resourceful person."}, {"id": 520, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 42, "loc": "clinician", "int": 0.85, "aff": "guilty ambivalence", "au": "Searles", "pt": "Charlotte", "pg": 16, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "When she said, \"Are they green?\", not leaning toward me to make it easier to see across the five or six feet separating us, I felt guilty that I did not feel freely comfortable to look closely into her eyes and tell her what color they were. Moreover , I felt guilty for not already knowing what color they were. They appeared hazel-colored to me; but I was not sure. I felt, in essence, guilty at not finding myself unambivalently accepting of, and rejoicing in, the very fleeting moment of intimacy suddenly offered me by this woman who had functioned most of the time in a manner very distant and detached from me."}, {"id": 521, "tr": "interpersonal_searles", "doc": "Searles-Oedipal Love in the Counter-Transferen", "pos": 22, "loc": "clinician", "int": 0.7, "aff": "awkward anxiety", "au": "Searles", "pt": "unnamed", "pg": 4, "pdf": "", "ppg": 4, "pcf": 1.0, "txt": "At the end of one of the sessions near the close of our work, she made some statement which feelingly expressed her sense of sadness and loss at the prospect of our approaching separation . I replied with a comment which felt to me, in the making of it, inappropriate; which she reacted to as being inappropriate; and which in retrospect I well know to have been inappropriate: I laughed rather anxiously and indicated to her that I felt, about thi s coming separation , much as did the Mrs. Gilbreth, of Cheaper by the Dozen fame, whom I had recently seen quoted as having said to her husband, when the youngest of their twelve children was now passing out of the phase of early infancy , 'It surely will be strange not to be waking up, for the ﬁrst time in sixteen years, for the two-o'clock feeding!' Although I believe my tone conveyed the sense of genuine loss which had been conveyed in Mrs. Gilbreth's own statement to her husband, I noticed t hat the patient looked uncomfortably startled, and murmured something about thinking she had become older than that."}, {"id": 522, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 51, "loc": "clinician", "int": 0.75, "aff": "relieved guilt", "au": "Searles", "pt": "Charlotte", "pg": 18, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "Weber (an aide) told me that Charlotte was upstairs. I felt a sense of relief, of contentment, that she was up there in bed, feeling that this made it easier for me than when she is up and about. Yet I felt a twinge of guilt, feeling that I shouldn't be glad that she isn't up and about; I've known for many weeks that Copyrighted Material. For use only by 48923."}, {"id": 523, "tr": "interpersonal_searles", "doc": "Searles-Oedipal Love in the Counter-Transferen", "pos": 29, "loc": "clinician", "int": 0.85, "aff": "startled eros", "au": "Searles", "pt": "none", "pg": 5, "pdf": "", "ppg": 5, "pcf": 1.0, "txt": "And a third reason is that the intensive psychotherapy of schizophrenia tends so greatly to drive a therapist away in discouragement that any basis for his feeling drawn to his work with the patient, whether an erotic basis or whatever, is precious and to be welcomed as providing a foundation-stone for the further elaborati on of a constructive therapeutic relationship. One of my ﬁrst experiences, of the sort under discussion here, with a schizophrenic p atient, occurred about the end of the second year of my work with a hebephrenic woman in her middle thirties. In the course of one of the therapeutic sessions with this woman , who was mute and dishevelled and whose behaviour was conspicuously bizarre, I was extremely startled to ﬁnd myself having fantasies of being married to her, fantasies which were accompanied by powerful affects of romantic love . For many months thereafter, on innumerable occasions both during and between the se ssions, I found myself feeling similarly about her, oftentimes with strong erotic impulses; and during this period I had at least a dozen romantic-and-erotic dreams about her."}, {"id": 524, "tr": "interpersonal_searles", "doc": "Searles-Oedipal Love in the Counter-Transferen", "pos": 33, "loc": "clinician", "int": 0.9, "aff": "alarmed tenderness", "au": "Searles", "pt": "unnamed", "pg": 6, "pdf": "", "ppg": 6, "pcf": 1.0, "txt": "of our work. But after about eighteen months, I began growing uneasy at the intensity of the fond and romantic feelings which I had come to experience toward him, and particularly alarmed during one of our sessions, while we were sitting in silence and a radio not far away was playing a tenderly romantic song, when I suddenly felt that this man was dearer to me than any one else in the world, including my wife. Within a few months I succeeded in ﬁnding ' reality ' reasons why I would not be able to continue indeﬁnitely with his therapy, and he moved to a distant part of the country. To be sure, he had been voicing a persistent desire to make this move, all through our work together; but I am certain that it was my anxiety about these recently-recognized responses in myself that caused me to ﬁnd, now, that it somehow made excellent sense for him to leave here."}, {"id": 525, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 158, "loc": "patient", "int": 0.5, "aff": "emerging selfhood", "au": "Sullivan", "pt": "unnamed", "pg": 33, "pdf": "", "ppg": 61, "pcf": 0.95, "txt": "She felt shapeless and lacked a sense of herself as a unique individual moving through various moods and experiences but with some underlying continuity. At a point in the therapy where an elementary sense of having a self was beginning to appear, she dreamed that she was given the gift of an oblong ceramic dish of great beauty with a perfectly round ebony stone in its center. In the dream, she recognized the gift as being precious, although after she woke she had no sense of why it should be so. The perfectly round ebony stone is a symbol of the Self that could midwife the birth of a personal self for Penny."}, {"id": 526, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 169, "loc": "patient", "int": 0.6, "aff": "awestruck", "au": "Sullivan", "pt": "unnamed", "pg": 35, "pdf": "", "ppg": 63, "pcf": 0.95, "txt": "distressed and angry, but as he talked he abruptly felt his point of view shift and instead of feeling insigni ﬁcant he had a sudden rush of amazement and felt awestruck by this inﬁnite universe of which he was a part. As we age and leave behind the tasks of young and middle adulthood – when we have lived enough of the arc of our career to begin to glimpse its end and have watched the children that we parented disperse into the world to form new families – we need to loosen our identiﬁcation with our own existence and orient more toward the wholeness of our tribe, of the human family, of the Earth; in Peter’s case, of the universe. As various contradictory experiences of the little self are gathered into an increasingly substantial sense of a personal self, Gordon suggests that the individual comes closer to a feeling of rapport with the big Self. As a person knows a greater expanse of himself, he begins to connect with the essential human experience via his personal version of it."}, {"id": 527, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 11, "loc": "clinician", "int": 0.95, "aff": "somatic dread", "au": "Searles", "pt": "unnamed", "pg": 5, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "hurtful, with a semi-somatic fantasy of trying to hold together my eviscerated belly. On one occasion, as she was bellowing even more forcefully than usual at me, I had a somatic sensation that she was pulling the air from my pulmonary alveoli—a sensation strikingly like those 3 which evidently gave rise to her delusion that various of her bodily organs were controlled from outside herself. Later on, at a time when she had shown much improvement in her daily life on the ward, but when she was reacting to me as being a murderous bitch of a mother who had killed my husband, as I reported at a staff-conference: I remember one time when John (the administrative psychiatrist in charge of the ward) came sort of half-running up to me to tell me with great enthusiasm about how really warm an exchange he and the nurses had been having with Hilda in the nurses' station. … I felt defensive as all hell because I felt that it was a pointing up of—there must be something wrong with me. Everybody else, currently, apparently was finding her very likable and in my mind all I could do was to stave off double pneumonia. … In many other sessions with this woman, who often expressed her delusional experience of herself as being a robot, or a machine, I often felt, while she was forcefully verbalizing, with a sweepingly operatic freedom of accompanying physical gestures, endless delusional material into which no verbal, interpretative intervention was feasible, as though there were wires running through my limbs, being pulled in such a fashion as to draw the muscles taut and render the limbs cramped."}, {"id": 528, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 36, "loc": "clinician", "int": 0.6, "aff": "restrained attunement", "au": "Searles", "pt": "unnamed", "pg": 14, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "This same man recurrently experienced a symptom of \"empty-mindedness\" during the sessions, and remained for years autistically unaware 12 that this phenomenon might have something to do with what he might experience the state of my mind as being. In one session, for example, after eight minutes during which I as usual had said nothing, and he had spoken only briefly from time to time, he said, after another pause of a minute or so, \"Seem to be empty again today.\" I felt an impulse to ask, \"'Seem to be empty again today': I seem to be empty again today?— You seem to be empty again today—?\" I had no doubt that he had meant, consciously, that he seemed to be empty again today. But various clues gave me to feel that it was not yet time thus to make my presence felt. In retrospect, had I spoken so, I think it would have been most valuable, potentially, to add to my questions, \"— We seem to be empty today?\"; for this would not so sharply call upon him to exchange one world-view for another ."}, {"id": 529, "tr": "interpersonal_searles", "doc": "Searles-Oedipal Love in the Counter-Transferen", "pos": 1, "loc": "clinician", "int": 0.8, "aff": "erotic guilt", "au": "Searles", "pt": "unnamed", "pg": 1, "pdf": "", "ppg": 1, "pcf": 1.0, "txt": "Since I began doing psycho-analysis and intensive psychotherapy nine years ago, I have found, time after time, that in the course of the work with every one of my patients who has progressed to, or very f ar toward, a thoroughgoing analytic cure, I have experienced romantic and erotic desires to marry, and fantasies of being married to, the patient. Such fantasies and emotions have appeared in me usually relatively late in the course of treatment, have been present not brieﬂy but usually for a number of months, and have subsided only after my having experienced a variety of feelings— frustration , separation - anxiety , grief , and so forth—entirely akin to those which attended what I experienced as the resolu tion of my Oedipus complex late in my personal analysis —speciﬁcally, about ﬁve years ago. As I shall detail later on, with the ﬁrst few patients toward whom I found myself hav ing such feelings, I reacted with much anxiety , embarrassment, and guilt . My training had been predominantly such as to make me hold rather suspect any strong feelings on the part of the analyst toward his patient, and these particular e motions seemed to be of an especially illegitimate nature."}, {"id": 530, "tr": "interpersonal_searles", "doc": "Searles-Oedipal Love in the Counter-Transferen", "pos": 17, "loc": "none", "int": 0.2, "aff": "theoretical", "au": "Searles", "pt": "none", "pg": 3, "pdf": "", "ppg": 3, "pcf": 1.0, "txt": "Although they do not link the analyst's feeling-responses, as I do, to her own Oedipus complex, they describe these responses with a candour which I consider courageous and badly-needed; they leave the clear impression that the patient's experiencing of, and eventual relinquishment of, his oedipal striv ings are met, in the analyst, by deeply felt reciprocal responses. The spirit of the paper, as well as its conclusions, are a dequately conveyed by the authors' ﬁnal paragraph: A study of the terminal phase of analysis of a patient by an analyst of the opposite sex provides some insight into the nature of the [ mother -son incest ] barrier. Even after analysis of castration anxiety in the classic sense is meticulously pursued, there still is a deterrent to incestuous genital fulfillment. S ensitive, subtle, and frank examination of this last barrier indicates that it is mutually set up by both partici pants."}, {"id": 531, "tr": "interpersonal_searles", "doc": "Searles-Oedipal Love in the Counter-Transferen", "pos": 21, "loc": "clinician", "int": 0.75, "aff": "guarded longing", "au": "Searles", "pt": "unnamed", "pg": 4, "pdf": "", "ppg": 4, "pcf": 1.0, "txt": "It is illegal to copy, distribute or circulate it in any form. - 182 - into a woman whom I found very likable, warm, and sexually attractive. I found myself having, par ticularly during about the last year of our work, abundant desires to be married to her, and fantasies of being her husband. As in each of these clinical instances which I shall recount, there was an abundance of 'carry over' of s uch responses on my part, into both waking life after the analytic sessions, and into dreams as well. I reacted to such feelings with considerable anxiety , guilt , and embarrassment; and when the end of the analysis drew near, there occurred an incident, somewhat amusing to me in retrospect, which highlighted how guarded I felt about such responses in my overt beh aviour in the sessions."}, {"id": 532, "tr": "interpersonal_searles", "doc": "Searles-Oedipal Love in the Counter-Transferen", "pos": 37, "loc": "clinician", "int": 0.7, "aff": "satisfied resolve", "au": "Searles", "pt": "unnamed", "pg": 6, "pdf": "", "ppg": 6, "pcf": 1.0, "txt": "But I felt that, despite the tragic aspect of this, what we were goin g through was an essential, constructive part of what his recovery required; these needs of his would have to be experienced, I felt, in however unrealizable a form at ﬁrst, so that they could become reformulated, in the course of our work, into chan nels which would lead to greater possibilities for gratiﬁcation. And I felt a solid sense of personal satisfaction that I was able, now, to go through feelingexperiences with a male patient which years before, even in much lesser degree than t his, would have scared me away. Not only my work with patients but also my experiences as a husband and parent have c onvinced me of the validity of the concepts which I am offering here. Toward my daughter, now eight years of age, I have experienced innumerable fantasies and feelings of a romanticlove sort, thoroughly complementary to the romantically adoring, seductive behaviour which she has shown toward her father oftentimes ever since she was about two or perhaps three years of age."}, {"id": 533, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 5, "loc": "clinician", "int": 0.6, "aff": "helpless fondness", "au": "Searles", "pt": "unnamed", "pg": 3, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "In subsequent papers I shall deal further with matters of analytic technique during the transition phase, and shall discuss the phase of therapeutic symbiosis and the phase of individuation. 1 fact, that any analyst, however well analyzed he has been, experiences considerable anxiety at least on occasion in this phase of the work. As time goes on he tends to become related less and less to the patient, and more and more to his own increasingly regressed, archaic, self-punitive superego. The patient so tenaciously requires omnipotence of him, and his own superego increasingly finds him not qualified for benevolent omnipotence, but as qualifying for the only other alternative, malevolent omnipotence. I have been amused in retrospect—but only in retrospect—at something I would do from time to time when I would be feeling helpless in my work with one or another chronically paranoid patient who was sure I possessed the magic cure for his or her suffering, if I would only \"think nice thoughts about me, \" or \"want me well.\" I would have come, long since, to experience much fondness for the patient; but all my conventional analytic armamentarium had failed to help her resolve her psychotic symptoms."}, {"id": 534, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 6, "loc": "clinician", "int": 0.85, "aff": "desperate love-hate", "au": "Searles", "pt": "unnamed", "pg": 3, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "Now I would find myself smiling helplessly and pleadingly at the patient, with a feeling of wanting desperately to cure her , somehow, with my love. This, of course, like everything else I had found myself doing, did not work, and the intendedly magical love would be replaced by an equally omnipotence-based hatred, such that I would glare at the patient with, for example, a fantasy of burning out the inside of her skull. A phobia concerning heights survived my analysis which ended some seventeen years ago, and I have had much occasion for self-analysis in this regard during, for example, the 150 more or less anxious trips I have made over the Triboro Bridge during the past five and one-half years. I have had many different experiences of this bridge, a fair number of them mundane and comfortable enough."}, {"id": 535, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 9, "loc": "none", "int": 0.2, "aff": "polemical", "au": "Searles", "pt": "none", "pg": 4, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "If we analysts can become able to work relatively freely and comfortably with these primitive areas of ego-functioning, there will be some hope that the majority of hospitalized psychotic patients will be treated essentially by their fellow human beings and less by the displaced-transference magic of truly nonhuman tranquilizing drugs, which are presently accorded a degree of awesome power , for the patient, such as even the analyzed therapist dare not experience himself as possessing. I know of no more important problem in psychotherapy today, than the increasing resort to an increasing avalanche of drugs, in an unconscious effort on the part of therapists to shield themselves from crucially therapeutic feeling-experiences in their work with their patients. To the degree to which a patient functions autistically, he or she has not achieved a clear differentiation between, and integration among, such realms of experience as thinking, feeling emotions, and feeling bodily sensations. The analyst himself experiences strange responses in working with such a patient."}, {"id": 536, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 18, "loc": "dyadic", "int": 0.85, "aff": "murderous-erotic dread", "au": "Searles", "pt": "unnamed", "pg": 8, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "individual separate from, but related to, him. For example, I worked for some eleven years with a hebephrenic man who had led, prior to his hospitalization many years before, a life of promiscuous homosexuality, in which each relationship had evidently involved not only sex but physical violence. For about two years, early in our work, he was almost totally silent, clearly felt intensely threatened sexually by me, and punctuated his long silences with sudden outbursts of vitriolic cursing at me, meanwhile seeming barely able to contain himself from making an intendedly-murderous attack upon me. For my part, it was only after many months of this that, in one of the sessions, it dawned upon me, to my great relief, that it had now become conceivable to me to have a relationship with this man without, as I felt it, either murdering him or fucking him—the only two avenues for relatedness 6 which I heretofore had felt he was presenting to me."}, {"id": 537, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 41, "loc": "patient", "int": 0.6, "aff": "warm silliness", "au": "Searles", "pt": "Charlotte", "pg": 16, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "to you.\" She replied, with a very warm laugh, full of warm, fond feeling, \"My eyes feel green! Are they green? It's so green! I feel so silly, \" she added, still laughing warmly."}, {"id": 538, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 43, "loc": "clinician", "int": 0.65, "aff": "moved surmise", "au": "Searles", "pt": "Charlotte", "pg": 16, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "At any rate, I felt deeply moved by this incident, which I regarded as a highly significant one. I felt that what she had experienced, in this, was 2The novelist Ray Bradbury has depicted this process beautifully in The Martian Chronicles. 1 14 the essence of what the doctors \"did to\" her so many years before. That is, in her acute psychosis she probably had blended, I surmised, with each one (or a part of each one) in succession, and had lost the remainder of her already fragmented self in the course of that fragmenting experience, during which she had been unable to work through the rapidly successive losses imposed upon her by this series of doctors, each of whom made his impact upon her and then shortly left—taking with him a part of her self—to be followed quickly by another doctor .2 It was apparent, also, that at a much higher level of egofunctioning, that earlier experience had given rise to now-repressed fantasies of herself as a prostitute, being visited in her bed by a series of men. The incident in the session which I have described was charged with libidinal interest of a degree quite unacceptable to her generally-held image of herself in the treatment-relationship."}, {"id": 539, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 54, "loc": "patient", "int": 0.7, "aff": "tearful rejection", "au": "Searles", "pt": "Charlotte", "pg": 19, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "I care about the inside! \" Then during the next few moments she looked rejected, and was making brief comments conveying her feeling rejected. I said, kindly and firmly, \"Now you get feeling rejected—you very quickly get feeling rejected, don't you?\" She replied, feelingly, \"It's hell, isn't it?\" Shortly afterward, while she was sitting and looking at the white shirt I was wearing, she said, with much of tearful grief in her voice, \"That's a nice shirt. … I like to sit and look at the shirt.\" Copyrighted Material. For use only by 48923."}, {"id": 540, "tr": "interpersonal_searles", "doc": "Searles-Oedipal Love in the Counter-Transferen", "pos": 6, "loc": "none", "int": 0.2, "aff": "theoretical loss", "au": "Searles", "pt": "none", "pg": 2, "pdf": "", "ppg": 2, "pcf": 1.0, "txt": "have just quoted. These additional passages from her article show her view of countertransference , in the special sense in which she deﬁnes it, as being an innate, inevitable ingredient in the psychoanalytic relationship, and they show, in particular, the feelings of loss which the analyst experiences with the termination of the analysis . But I wish to point out that the particular variety of countertransference with which she is concerned here, is evidently that of the analyst's reacting as a loving and protective parent to the analysand, reacted to as being an infant: There are plausible reasons why in the last phase it is especially difficult to achieve and maintain analytic frankness. The termination of analysis is an experience of loss which mobilizes all the resistances in the transference (and in the countertransference too), for a final struggle. … 'Recently Adelaide Johnson [(8)] described the terminal conflict of analysis as fully reliving the Oedipus conflict in which the quest for the genitally gratifying parent is poignantly expressed and the intense grief , anxiety , and wrath of its definitive loss are fully reactivated. . ."}, {"id": 541, "tr": "interpersonal_searles", "doc": "Searles-Oedipal Love in the Counter-Transferen", "pos": 38, "loc": "clinician", "int": 0.7, "aff": "enthralled, worried", "au": "Searles", "pt": "unnamed", "pg": 6, "pdf": "", "ppg": 6, "pcf": 1.0, "txt": "I used at times to feel somewhat worried when she would be playing the supremely conﬁdent coquette with me and I would be feeling enthralled by her charms; but then I came to the conviction, some time ago, t hat such moments of relatedness could only be nourishing for her developing personality as well as delightful to me. If a little girl cannot feel herself able to win the heart of her father , her own father who has known her so well and for so long, and who is tied to her by mutual bloodties, WARNING! This text is printed for the personal use of the PEPWeb subscriber and is copyright to the Journal in which it originally appeared. It is illegal to copy, distribute or circulate it in any form. - 185 - I reasoned, then how can the young woman who comes later have any deep conﬁdence in the power of her womanliness?"}, {"id": 542, "tr": "interpersonal_searles", "doc": "Searles-Oedipal Love in the Counter-Transferen", "pos": 53, "loc": "none", "int": 0.1, "aff": "theoretical", "au": "Searles", "pt": "none", "pg": 9, "pdf": "", "ppg": 9, "pcf": 1.0, "txt": "But I believe that to the extent that a child 's relationships with his parents are healthy, he acquires the strength to accept the unrealizability of his oedipal strivi ngs, not mainly through the identiﬁcation with the forbidding rival-parent, but mainly, rather, through the ego-strengthening e xperience of ﬁnding that the beloved parent reciprocates his love —responds to him, that is, as being a worthwhile and lovable, individual, as being , indeed, a conceivably desirable love -partner—and renounces him only with an accompanying sense of loss on the parent's own part. The renunciation is, I think, again something which is a mutual experience for child and parent, and is made in deference to a recognizedly greater limiting reality , a reality which includes not only the taboo maintained by the rival-parent, but also the love of the oedipally-desired parent towards his or her spouse—a love which antedated the child 's birth and a love to which, in a sense, he owes his very existence . Out of such an oedipal situation the child emerges, with no matter how deep and painful a sense of loss at the recognition that he can never displace the rival parent and possess the beloved one in a romanti c-and-erotic relationship, in a state different from the relatively ego-diminished, superego -dominated state which Freud described. This child emerges, rather, with his ego strengthened out of the knowledge that his love , however unrealizable, is reciprocated; and strengthened, too, out of the realization , which his relationship with the beloved parent has helped him to achieve, that he lives in a world in which any individual's strivings are encompassed WARNING!"}, {"id": 543, "tr": "interpersonal_searles", "doc": "Searles-Oedipal Love in the Counter-Transferen", "pos": 55, "loc": "none", "int": 0.1, "aff": "theoretical", "au": "Searles", "pt": "none", "pg": 9, "pdf": "", "ppg": 9, "pcf": 1.0, "txt": "More often than not, in these instances, I ﬁnd indications that the parent would unwittingly act out his (or her) repressed desires in the form of unduly seductive behaviour towards the child ; but then, whenever the parent came close to the recognition of such desires within himself, he would unpredictably start reacting to the child as being unlovable, undesirable. In the cases of many of these parents, it appears that primarily because of the paren t's own unresolved Oedipus complex, his marriage proved too unsatisfying, and his emotional relationship to his own culture too tenuous, for him to dare to recognize the strength of his reciprocal feelings towards his child during the latter's oedipal phase of development . The child is reacted to as a little mother or father transference -ﬁgure to the parent, a transference -ﬁgure towards whom the parent's repressed oedipallove feelings are directed. If the parent had achieved the inner reassurance of a deep an d enduring love towards his wife, and a deeply-felt relatedness with his culture including the incest -taboos to which his culture adheres, he would have been able to participate in a deeply-felt, but minimally-acte d-out, relationship with the child in such a way as to foster the healthy resolution of the child 's Oedipus complex."}, {"id": 544, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 161, "loc": "clinician", "int": 0.5, "aff": "dreamlike awe", "au": "Sullivan", "pt": "Penny", "pg": 34, "pdf": "", "ppg": 62, "pcf": 0.95, "txt": "At a later point in the individuation process than Penny had been at at the time of her dream, I had a dream that imaged the Self. Because I was farther along in my development, my conscious self – my “I” – was able to experience the dream image more fully than she had been able to and the image became my touchstone for the meaning of life. In my dream, my ﬁrst analyst, the person who had helped me to develop the solid sense of being a self that Penny still lacked, appeared. In outer reality, Dr."}, {"id": 545, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 166, "loc": "clinician", "int": 0.6, "aff": "awe, vastness", "au": "Sullivan", "pt": "none", "pg": 34, "pdf": "", "ppg": 62, "pcf": 0.95, "txt": "X shows me an image of eternity that is directly deﬁned as a human experience after – or beyond – earthly life. It is an image of inﬁnity, of the endless archetypal unconscious that includes all of creation, an image of everything that exists. The swirling galaxies mark it as alive. The totality and completeness of this picture is the Self."}, {"id": 546, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 186, "loc": "clinician", "int": 0.5, "aff": "contemplative awe", "au": "Sullivan", "pt": "unnamed", "pg": 38, "pdf": "", "ppg": 66, "pcf": 0.95, "txt": "X showed me an image of the living universe as our fate after death – our fate beyond the ﬁnite world of time and place we know in outer reality. I described it as an image of the Self. Here I want to note that this human experience of the Self, where it is felt to be the whole of the world or the universe, oﬀers a model of psychic reality that can support the fact of empathic intuition. If “my” psyche is a force ﬁeld surrounding me, I can imagine it mingling with the other ’s psyche, fostering the unconscious communication on which the analytic process depends."}, {"id": 547, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 1, "loc": "clinician", "int": 0.7, "aff": "useless, non-human", "au": "Searles", "pt": "unnamed", "pg": 1, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "In the first paper , which dealt with pathologic symbiosis and autism, I mentioned that As the months and years of the analyst's work with the autistic patient wear on, the analyst is given to feel unneeded, incompetent, useless, callous, and, essentially, non-human in relation to his so troubled and beseeching and reproachful, but so persistently autistic, patient. It is essential that the analyst be able to endure this long period—a period in which, despite perhaps abundant data from the patient, transference-interpretations are rarely feasible—in order that the patient's transference-regression can reach the early level of egodevelopment at which, in the patient's infancy or very early childhood, his potentialities for a healthy mother-infant symbiosis became distorted into a defensively autistic mode of ego functioning. At that level of ego-development the infant or young child had not yet come to achieve a perceptual and experiential differentiation between himself and his mother, nor between his mother and the surrounding nonhuman world. When in the evolution of the transference that early level of ego-functioning becomes accessible, then it is possible for therapeutically symbiotic processes to occur between patient and analyst, and be interpretable as such. … patient and analyst … experience one another and themselves in a manner analogous to that in which a healthy mother and a healthy infant are immersed, as being far more than merely human in the adult sense, but as forming confluently a whole growth-world.\" 5 Copyrighted Material."}, {"id": 548, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 2, "loc": "clinician", "int": 0.7, "aff": "stupid, defeated", "au": "Searles", "pt": "unnamed", "pg": 2, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "Meanwhile, during the autistic phase of the treatment, the analyst's attempts at transference-interpretation meet with a thoroughly defeating response. Either the patient essentially ignores them, or responds with such devastating derision and contempt as to make one feel crazy for having uttered them, or he finds them so deeply and destructively disturbing that it may require him the bulk of the hour to digest, as it were, this foreign body and expel it and restore, thus, his temporarily damaged autistic world to its state prior to this rude interruption. All this gives the analyst to feel thoroughly stupid and useless; but the patient has unconsciously thus to destroy or ignore what the analyst offers him, in order to keep repressed his own infantile need toward the analyst as a mother who is far more than a mere person—who is the whole functional world for him. To hear and accept and utilize the analyst's interpretation would mean, for the patient, the relinquishment of his only known world, in exchange for one which feels entirely unknown to him, namely, that comprised of the analyst."}, {"id": 549, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 16, "loc": "clinician", "int": 0.5, "aff": "surprised curiosity", "au": "Searles", "pt": "unnamed", "pg": 7, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "Near the beginning of the interview I had sought to explore his feelings about the audience, without evoking evidence of any psychotic modes of response in him in this regard. Now, many minutes later , the fantasy I experienced in reaction to his phrase, \"all out attack\" led me to explore, in ways I no longer recall in detail, his feelings about the audience. He now revealed fear , which he apparently had been having all along, lest all the people in the audience launch a physical attack upon him. This I found memorable, for never before, in hundreds of such interviews, had a patient given me to know that he was afraid the audience would physically assault him, even though not rarely I had felt that a patient was functioning, in the interview, in such a way as to ensure that the audience would verbally attack me during the discussion period after his departure."}, {"id": 550, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 17, "loc": "patient", "int": 0.7, "aff": "threatened, ashamed", "au": "Searles", "pt": "unnamed", "pg": 7, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "This man's expressed fear was not discernibly of a gang-rape, though I do not doubt that there were such fears at an unconscious level in this handsome and stalwart young man. In response to my surprised inquiry about his fear , he explained that his father had called him \"conceited\" and \"a prig\" so many times as to have convinced him that he is so, and he feared that the audience would perceive him so, and be carried away by their antagonism toward him. He looked very threatened, indeed, in revealing these ideas. In working with the autistic patient, one may feel, for months or even years, that to the extent that one does not go on immersing oneself completely in his world, one has at most one or two very limited roles in which to function as an Copyrighted Material."}, {"id": 551, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 25, "loc": "clinician", "int": 0.8, "aff": "murderous conviction", "au": "Searles", "pt": "unnamed", "pg": 10, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "One patient, for instance, whose years' long stony demeanor was generally unaffected by my interpretations, began a session by saying, with considerable animation, \"I was very much moved yesterday by your interpretation that I was experiencing you as a part of the furniture here.\" The analyst, to keep in touch with himself while working with the autistic patient who is so little able to acknowledge the analyst's own separate and human reality, must be able unashamedly to set such limits as his individual self finds necessary, relatively little intimidated by concern as to what his colleagues deem necessary in their respective ways of working with patients. I, for example, have tolerated usefully a schizophrenic patient's temporarily rearranging, for the sessions, the chairs in and the lighting of my office. This behavior of hers interested but did not disturb me, whereas the supervisor of the analysis, years ago, said he could never permit a patient to do this. But I have felt a sense of conviction, in working with one autistic woman who controlled events in the office to a high degree, that if she made a move to close the Venetian blinds, or to open the window, I would kill her before I let this happen."}, {"id": 552, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 27, "loc": "clinician", "int": 0.6, "aff": "despair, pressured", "au": "Searles", "pt": "unnamed", "pg": 11, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "work with me, to also depart from the session on the basis of some inner timing irrespective of whether the alloted hour has ended. In one's work with a deeply ill patient, one needs to maintain respect for one's own limitations as being expressive of one's individual self, a self which, permitted thus functionally to exist, can provide the autistic patient with the only kind of outer reality which can be of use to him, namely, a real other individual, with whom it eventually can become possible for the patient to develop a genuinely interpersonal relationship, and with whom the patient can come usefully to identify in the process of developing his own individual self. 9 Phase of Transition between Autism and Therapeutic Symbiosis During this phase the patient's formerly autistic, automaton-like mode of functioning begins to give way, such that one can glimpse, at first only rarely and momentarily, but increasingly often and prolongedly, underlying fluidity, ambiguity, confusion, and chameleon-like qualities. One such patient for years had functioned with so single-minded a rigidity as to drive me to despair; he had striven chronically, so I felt, to impose upon me his reality as being the only conceivable reality. Then I began to hear from him such comments as these in one of the sessions typical of this transition phase: I have a sensation—don't know how to express it in words—of drifting realms … [Then I interrupted with some comment] You become gigantic in size, as the disruptor of the cosmos that I'm trying to put right … I'm feeling discouraged."}, {"id": 553, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 32, "loc": "clinician", "int": 0.4, "aff": "useless, dehumanized", "au": "Searles", "pt": "none", "pg": 13, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "I have described it as characteristic of this phase of transition between autism and therapeutic symbiosis that the analyst now begins to find it feasible effectively to make transference-interpretations. This is in contrast to the earlier , autistic phase, during which he has had to adapt to long stretches of time during which he has been given to feel useless, neglectful, irrelevant, uncaring, incompetent and, more than anything else, essentially non-human, precisely for the reason that the patient has needed to regress, in his experience of the analyst, to the level of the young child's experience of the mother as being something far more than merely human as a person is seen through adult eyes. The patient has needed to come to experience the analyst as being equivalent to the early mother who comprises the whole world of which the infant is inextricably a part, and before he has achieved sufficient of an own self to be able to tolerate the feeling-experience of sensing her as separate from his own body, and the two of them as separate from the rest of the actual world. This 11 transition phase likewise stands in contrast, as regards the timeliness of transference-interpretations, to the subsequent phase of therapeutic symbiosis, in which such interpretations are almost limitlessly in order ."}, {"id": 554, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 33, "loc": "clinician", "int": 0.55, "aff": "scorned, insignificant", "au": "Searles", "pt": "unnamed", "pg": 13, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "One has felt, in working with the autistic patient, that the so-narcissistic patient could not endow one with sufficient significance to him, to attend seriously to transference-interpretations of one's emotional meaning to him. One chronically paranoid man, who had emerged recently from his latest episode of acute psychosis, retorted scornfully to a prematurely-attempted transferenceinterpretation from me, \"You are of no more significance to me than that flyspeck over on the wall there.\" What neither he nor I at that time knew was that for me to be experienced as something both significant to and separate from him would have been tantamount to losing his self, losing his mind, losing his whole significant world. I felt convinced by his scorn of me, and was unprepared to know how awesomely important I was, in his unconscious, preindividuation dependency upon me. A narcissistically-absorbed patient expressed, year after year in his analysis, chronic dissatisfaction with his career as a lawyer , and recurrent ruminations about whether to abandon his present position for different ones, in any of several other cities."}, {"id": 555, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 35, "loc": "clinician", "int": 0.45, "aff": "cautious, restrained", "au": "Searles", "pt": "unnamed", "pg": 14, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "conscious conjectures whether I, too, might be casting longing eyes at possible positions elsewhere. But I did not feel free, as yet, to make such an interpretation to him; I sensed that it would be overestimating his ability to attribute significance to me—that it would be depicting myself as being of greater importance to him than his narcissism would permit as yet. His reaction to my tentative comments confirmed that such a transference-interpretation would be premature. I suggested, \"You perhaps assume that the next two days I'll be doing something other than private practice?\" He replied, \"Yeah.\" I suggested, \"Let's see what comes to mind.\" His reply was to describe, quite accurately, what in general I would be doing in my out-of-town work; he did not go on to speculate that my taking time off for such a trip might mean that I was something less than fully content with my usual work at the office."}, {"id": 556, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 38, "loc": "patient", "int": 0.6, "aff": "dread, suspicion", "au": "Searles", "pt": "Charlotte", "pg": 15, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "doctors \"did something to me that caused me to hear voices, \" which, she was presistently convinced, emanated from an electrical apparatus somewhere outside herself. She repeatedly expressed her suspicions in such a way as to imply that the \"something\" they had done to her had been obscurely and malevolently sexual in nature. Also, for a fewer number of years of our work at first, but always significantly, she manifested apprehension, never explicitly stated, lest the reason that the nearly whole first year of her illness was being kept shrouded in secrecy from her was that she had killed someone. Actually, she had not; but the clouded nature of that approximately one year , felt by her as a matter of her being kept by others in the dark about it, but due in actuality largely to her own amnesia for it, made her feel that so dark a secret could only mean that something terrible had been done to her or , even more horrifying, that she had murdered someone."}, {"id": 557, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 39, "loc": "patient", "int": 0.4, "aff": "frightened", "au": "Searles", "pt": "Charlotte", "pg": 15, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "During the session preceding the one I shall describe, I told her that, 13 as I understood it, a series of seven or eight doctors had been called by her family to see her at her home, and that her family had been reluctant to have her hospitalized. She came into this session, now, and began by saying, \"What you told me last time about that group [ N.B. ] of doctors frightened me. You know I've been worried about it [that is, since the last session], don't you?\" As I recall, I made no comment, or only a noncommittal one, to this; my notes do not include it. She began recounting, later in the session, the names of the \"doctors\" (actually all being the names of certain ones among her long series of administrative psychiatrists) she had had, at Chestnut Lodge, who she felt wished her well, wanted her to be well, wanted her to be able to live outside the sanitarium."}, {"id": 558, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 45, "loc": "clinician", "int": 0.6, "aff": "love and hate", "au": "Searles", "pt": "Charlotte", "pg": 17, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "not the person(s) I was a moment before in the session, she feels vulnerable to being accused of having somehow destroyed those now-absent person(s). Some data from three successive hours—and I wish particularly to highlight the events of the third of these—I had with a chronically hebephrenic woman, during the ninth of my thirteen years of work with her , will serve both to indicate how poignant was her longing to be able enduringly to experience a world outside herself, how instantly and intensely she at times rejected this world, and how powerful were the feelings of both love and hate which I found engendered in me in the relationship with her . This woman, twenty-seven years of age at the time when I became her analyst, is the most deeply ill patient with whom I have ever worked. Prelude to, and events of, Hour 1 During an hour with her early in the week, I had found myself having to suppress a powerful urge to tell her, \"I have your bones!\", a feeling I had never 15 before experienced toward anyone."}, {"id": 559, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 48, "loc": "clinician", "int": 0.85, "aff": "murderous relish", "au": "Searles", "pt": "Charlotte", "pg": 18, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "walking in and seeing the woman in charge of the dining room, I felt very tempted to ask
