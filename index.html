 her, \"jokingly, \" \"Mrs. Schaefer, how much would you charge to put cyanide in a patient's food?\" Such a thought had never occurred to me before, about anyone. Over the weekend, I was looking forward with grim relish to the coming week with Charlotte, planning to make her suffer for the Saturday session, by firmly and imperturbably making her sweat out the hot hours in her room throughout the four sessions of the week. Incidentally, I forgot that we would be having but three hours, since one of the hours fell on the 4th of July."}, {"id": 560, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 49, "loc": "dyadic", "int": 0.55, "aff": "tender, tearful", "au": "Searles", "pt": "Charlotte", "pg": 18, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "Hour 2 But to my surprise, I found that on Monday the tenor between us was clearly positive, though quietly so. In the course of the session she said to me, \"Then it's all right for me to live?\"—as if she had found confirmation of this from me. She had come with unusual alacrity upstairs to the hour, without having to be led, and had gone into several minutes of silent but profuse weeping, sometimes with an affect of grief coming through, sometimes with no affect coming through, and sometimes with, I sensed, an affect of pleasure. I asked her, unemotionally, whether she noticed any feeling as she wept— whether of grief, or none, or—perhaps—pleasure."}, {"id": 561, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 53, "loc": "dyadic", "int": 0.7, "aff": "yearning, scornful", "au": "Searles", "pt": "Charlotte", "pg": 19, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "Then, after a few more minutes of silence, while she was lying there sucking her thumb, looking as usual confused and broken up, I asked, in a semi-ironic tone, \"How are things in your world?\" She replied, \"I can't see much of it.\" Then a few minutes later, while she was looking at one of the two tall bedposts at the foot of her bed, she asked, \"Do you see anything wrong with that bedpost?\" I replied, \"It doesn't look like the other one to you?\" She agreed. She then began asking, several times over, \"Why don't you give me the key—the key to the bedpost?\" I didn't know what she meant; she rejected some comment from me (which is not set down in my notes made following the hour) intended to acknowledge the bedpost and the wished-for key as symbolically phallic in quality; surely I used no such technical or abstract terminology. She then glanced at the fly of my trousers, saying, \"She [note the use of the third person, as she often did] wants to see it—do you know what I mean?\" I replied, \"It sounds to me as though maybe she wants to see my penis.\" She rejected this impression of mine; but I still felt it valid. \"She wants to see the outside world, \" she explained, and added with a bereft expression on her face, \"Some people do.\" I replied, gently, \"You don't see much of the outside world, I guess, do you?—and you'd like to be able to see more of it.\" To this she instantly retorted harshly, antagonistically, and scornfully, \"I [note her use of the first person now] don't care about the outside world!"}, {"id": 562, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 55, "loc": "dyadic", "int": 0.65, "aff": "fond, tender", "au": "Searles", "pt": "Charlotte", "pg": 20, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "Later, she asked, \"Do you know that my mother feels?\", in a dubious tone as if to say, \"—whether she feels anything?\", and then explained, \"Do you know what she feels about sitting?\" I heard it as asking whether I were feeling anything; whatever response I made led to no further clarification. At one moment 17 in the course of the hour, she fondly called me \"Mom.\" At the end of the hour, while she was laughing pleasurably, I came over to the bed and gave her a kiss on the temple, very much as I do with my twelveyear-old daughter. She wiped it off, very much as my four-year-old son does, but went on laughing in the same way, which reassured me in my momentary misgiving lest I had made her anxious; I had never before kissed her. We had never before had a more fond, contented hour together."}, {"id": 563, "tr": "interpersonal_searles", "doc": "Searles-Oedipal Love in the Counter-Transferen", "pos": 19, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Searles", "pt": "none", "pg": 3, "pdf": "", "ppg": 3, "pcf": 1.0, "txt": "From this separation comes realization of the capacity for feeling loved but unbound. The recognition of one's capability for being loved when one is not helpless and dependent forecasts the seeking of a new adult love object outside of the analysis . In presenting now, from my own work, clinical examples of the concepts which I am put ting forward here, I shall be brief, and not only because discretion makes it difﬁcult to go into great detail; I t hink a few brief examples will be quite sufﬁcient for my purpose. PEP Web - Oedipal Love in the Counter Transference http://proxy.wi.edu:2052/document.php?id=ijp.040.0180a&type... 3 of 10 4/18/13 9:29 PM"}, {"id": 564, "tr": "interpersonal_searles", "doc": "Searles-Oedipal Love in the Counter-Transferen", "pos": 25, "loc": "clinician", "int": 0.5, "aff": "disconcerted, responsive", "au": "Searles", "pt": "none", "pg": 4, "pdf": "", "ppg": 4, "pcf": 1.0, "txt": "I shall mak e a few more observations, now, about the work with schizophrenic patients in this regard. For the past eight years I have devoted the greater portion of my time to intensive psychotherapy with patients suffering from chronic schizophrenia , and I have found that in this kind of work it is more difﬁcult, but even more important, to be able to allow into one's awareness such responses to the patient as I have been describing, than is the case in the analysis of neurotic patients. That is, it is at least somewhat less disconcerting to ﬁnd one self feeling romantically and erotically responsive to a neurotic patient who, late in analysis now, is realistically a desirable marital partner, than it is to ﬁnd oneself feeling thus toward a schizophrenic patient whom one's fellows migh t perceive as being , more than anything else, grossly ill and anything but attractive. But, for at least three reaso ns, I have found it essential to the patient's recovery that his (or her) therapist be 'susceptible' to experiencing such responses to him, and preferably with as little as possible of WARNING!"}, {"id": 565, "tr": "interpersonal_searles", "doc": "Searles-Oedipal Love in the Counter-Transferen", "pos": 35, "loc": "clinician", "int": 0.75, "aff": "tender, sexual", "au": "Searles", "pt": "unnamed", "pg": 6, "pdf": "", "ppg": 6, "pcf": 1.0, "txt": "This second patient was much more deeply ill than the ﬁrst, and by ordinary standards so unattractive in his physi cal person and his mode of dress that it would seem incredibly embarrassing, and even frightening, to ﬁnd oneself feeling any signiﬁcant degree of personal attraction toward such an individual. Whereas the ﬁrst man had been predominantly het erosexually oriented in his sexual history , this man had been exclusively, and very conspicuously, homosexually oriented. My wo rk with him came to involve my exposure to a remarkably intense combination of both poetically tender fee lings and sexual feelings (as well as, of course, comparably intense murderousness). After an initial two-year period in which negative feelings seemed clearly to predominate in the transference and the countertransference , I began ﬁnding myself feeling surprisingly fond of him, and to be having not infrequent dreams of a fond and sexual nature about him."}, {"id": 566, "tr": "interpersonal_searles", "doc": "Searles-Oedipal Love in the Counter-Transferen", "pos": 36, "loc": "clinician", "int": 0.9, "aff": "poignant longing", "au": "Searles", "pt": "unnamed", "pg": 6, "pdf": "", "ppg": 6, "pcf": 1.0, "txt": "One morning, as I was putting on a carefully-selected necktie, I realized that I was putting it on for him, more than fo r any of the several other patients I was to see that day. He referred to us, now in the third and fourth years of our work, as being married, and at other times expressed deeply affective fantasies of our becoming married. When I took him out for a ride in my car for one of the sessions, I was amazed at the wholly delightful fantasy and feeling I had, namely that we were lovers on the threshold of marriage, with a whole world of wonders opening up before us; I had visions of going upon innumerable rides with him, going to look at furniture together, and so on. When I drove home from work at the end of the day I wa s ﬁlled with a poignant realization of how utterly and tragically unrealizable were the desires of this man who had been hospitalized continually, now, for fourteen years."}, {"id": 567, "tr": "interpersonal_searles", "doc": "Searles-Oedipal Love in the Counter-Transferen", "pos": 39, "loc": "none", "int": 0.1, "aff": "theoretical", "au": "Searles", "pt": "none", "pg": 6, "pdf": "", "ppg": 6, "pcf": 1.0, "txt": "And I have had every impression, similarly, that the oedipal desires of my son, now e leven years of age, have found a similarly lively and wholehearted feeling-response in my wife; and I am equally convi nced that their deeply fond, openlyevidenced mutual attraction is good for my son as well as enriching to my wife. To me it makes sense that the more a woman loves her husband, the more she will love , similarly, the lad who is, to at least a considerable degree, the younger edition of the man she loved enough to marry. Freud, in his descriptions of the Oedipus complex (3) (4) (5) , tended largely to give us a picture of the child as having an innate, self-determined tendency to experience, under the conditions of a normal home, feelings of passionat e love PEP Web - Oedipal Love in the Counter Transference http://proxy.wi.edu:2052/document.php?id=ijp.040.0180a&type... 6 of 10 4/18/13 9:29 PM"}, {"id": 568, "tr": "interpersonal_searles", "doc": "Searles-Oedipal Love in the Counter-Transferen", "pos": 49, "loc": "clinician", "int": 0.6, "aff": "frustrated love", "au": "Searles", "pt": "none", "pg": 8, "pdf": "", "ppg": 8, "pcf": 1.0, "txt": "It is illegal to copy, distribute or circulate it in any form. - 187 - him will become in many respects far more superﬁcial, far less intimate, than it has been. This real and unavoidable circumstance of the closing analytic work tends powerfully to arouse within the analy st feelings of painfully frustrated love which deserve to be compared with the feelings of ungratiﬁable love which both child and parent experience in the oedipal phase of the child 's development . Feelings from this source cannot properly be called countertransference , for they ﬂow from the reality of the present circumstances; but they may be difﬁcult or impossible to distinguish fully from countertransference . There are, then, four more or less powerful sources tending to promote feelings of de ep love with romantic and erotic overtones, and with accompanying feelings of jealousy , anxiety , frustration -rage, separation - anxiety , and grief , in the analyst with regard to the patient."}, {"id": 569, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 21, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Sullivan", "pt": "none", "pg": 6, "pdf": "", "ppg": 34, "pcf": 0.95, "txt": "The issue has nothing to do with acquisitive greed. Materialism is a philosophical system that contrasts with idealism which, again, has nothing to do with our ordinary notions of “idealistic” 4 I refer here to the popular image of the scientist, performing controlled experiments on measurable data, an image based in the hard sciences. In fact, a scientiﬁc approach must begin with the nature of the area under investigation and must decide what the most fruitful way of studying that area will be. No one has been able to imagine, for example, a way to study the meaning of dreams via controlled experiments."}, {"id": 570, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 55, "loc": "none", "int": 0.0, "aff": "expository", "au": "Sullivan", "pt": "none", "pg": 12, "pdf": "", "ppg": 40, "pcf": 0.95, "txt": "With one turn of phrase after another, he tries to convey a sense – it is not possible to give a simple “deﬁnition” – of what he is talking about. He wants to open Western eyes to the notion of a nonmaterial, spiritual reality standing behind the concrete world. Like the unconscious, this reality is not con ﬁned in space or time. It has no tangible substance, and just as night-time dreams can image past, present or future possibilities, the world of O includes all of time.9 The outer and inner realities we know about emerge from this ine ﬀable universe."}, {"id": 571, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 71, "loc": "clinician", "int": 0.45, "aff": "warm anticipation", "au": "Sullivan", "pt": "none", "pg": 15, "pdf": "", "ppg": 43, "pcf": 0.95, "txt": "As we shall explore throughout the book, but especially in Part II, the section on clinical work, there is a constant danger that the therapist will cling to previously developed understandings and will blind herself to startling new elements that do not ﬁt neatly into those old “knowns;” Bion ’s suggestion that we try to meet a new person in each hour is helpful. But it does leave out something central about relatedness. Each hour, I go toward the waiting room to take in my waiting patient with a unique feeling. On a recent day at work, I noticed myself feeling something positive as I turned toward each hour, since (on that day) I saw one person after another whom I like and enjoy being with."}, {"id": 572, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 72, "loc": "clinician", "int": 0.4, "aff": "fond recognition", "au": "Sullivan", "pt": "none", "pg": 15, "pdf": "", "ppg": 43, "pcf": 0.95, "txt": "We could call that positive feeling “liking,” but it was a diﬀerent feeling in each case. I can work to empty my mind of particular memories or concepts that relate to Carol or Mike or Sandra so as to be available to receive the particular shape each of them takes today. But surely something is missing if I do not remember my bond with each of them. It is provocative to talk about seeing the familiar patient as someone new; it helps us to remember that the patient is not a noun, he is a verb."}, {"id": 573, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 117, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Sullivan", "pt": "none", "pg": 24, "pdf": "", "ppg": 52, "pcf": 0.95, "txt": "A sense of the experience of the Self is captured in Saint Paul ’s expression, “Not I, not I, but Christ in me. ” It is the small, still, inner voice that Isaiah described as the voice of God. A secular person would call it the voice of her conscience (not to be confused with a judging superego). Remember here that one of Bion ’s deﬁnitions of O is God or the godhead. It has been suggested that when Bion used the term “God,” he meant something di ﬀerent from what Jung meant by the term, but I would disagree with that perspective."}, {"id": 574, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 121, "loc": "dyadic", "int": 0.4, "aff": "holding pull", "au": "Sullivan", "pt": "Allison", "pg": 25, "pdf": "", "ppg": 53, "pcf": 0.95, "txt": "Rather than challenging Allison ’s wish to ﬂee analysis, I said that her wish was an important idea; perhaps we could have a consultation from her dreams. In the next hour she brought in a dream that consisted only of an authoritative voice saying, “Stay right there. ” (A week or two later, of course, she had “forgotten” the dream and raised the idea of terminating again, but the idea of abandoning the work had lost its potency. The impulse faded away and she allowed herself to be pulled down into a powerful transformative process that lasted for years.) Recognition of the activity of the Self conﬂicts with the narcissism that we will explore in Chapters 4 and 5. A universal complex of psychopathology permeates our contemporary civilization in a way that elevates narcissism to a desirable state and blinds us to its pathology. (As we shall see, this fundamental complex has been the source of psychoanalysis ’ unrelated approaches.) We are urged to “take care of ourselves ” rather than to orient toward others; it is seen as a sign of health if someone can indulge himself with luxury items rather than trying to strike a balance between his (inherently inﬁnite) greed and the needs of people outside his immediate family. 12 Enormous “Christian” churches have grown up around a gospel that centers itself in the notion that virtue will lead to wealth, perhaps of enormous proportions, and that mansions and luxurious cars demonstrate the owner ’s righteousness."}, {"id": 575, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 154, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Sullivan", "pt": "none", "pg": 32, "pdf": "", "ppg": 60, "pcf": 0.95, "txt": "Then there is what Gordon calls the little self, the subjective sense of “this is who I am, ” or “this is all of me. ” The solidity and structure of this self depends primarily on the infant ’s experiences with his or her primary caretaker(s). When these experiences are good enough, the person has a foundation that enables him to interact well enough with the big Self I have been describing. This interaction creates a developing self that can integrate its ever-evolving O into an ever-expanding sense of me-ness. Jung suggests that the Self, as a kind of “a priori existent out of which the ego evolves,” is a kind of preﬁguration of the “I” or the self."}, {"id": 576, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 156, "loc": "none", "int": 0.2, "aff": "shifting self-states", "au": "Sullivan", "pt": "none", "pg": 33, "pdf": "", "ppg": 61, "pcf": 0.95, "txt": "On a day to-day-basis, as well as over a life span, the subjective experience changes. We see in analysis or therapy a repeating experience of, “This is me,” followed by, “Oh! This is me, too. ” The subjective self falls into various moods that can dramatically shift the person’s sense of who he is. Some days the individual may feel like a good, strong person, worthy and valuable; on other days he feels weak, fragile, inferior, ugly, inadequate."}, {"id": 577, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 168, "loc": "patient", "int": 0.7, "aff": "dwarfed, insignificant", "au": "Sullivan", "pt": "unnamed", "pg": 34, "pdf": "", "ppg": 62, "pcf": 0.95, "txt": "As he talked about it, he felt dwarfed by the enormity of the universe and his inﬁnitesimal place in that immensity. He felt 62 The creative unconscious and the Self"}, {"id": 578, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 4, "loc": "clinician", "int": 0.6, "aff": "isolated anxiety", "au": "Searles", "pt": "unnamed", "pg": 2, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "In this setting, in which the analyst has access to so little of human-analyst interaction with the patient, and so little opportunity to exercise his usual analytic functions, he tends to be thrown back upon his own capacities for autistic experience. If he has not had occasion to become relatively well acquainted with these areas of himself—if he has needed to maintain these largely under repression by relating compulsively to his fellow human beings, this isolation into which he is thrown, in this work with the autistic patient, is deeply anxiety-provoking. I believe, in Presented in slightly abbreviated form as the second annual Harry Stack Sullivan Lecture, under the auspices of the William Alanson White Psychoanalytic Society, at the New York Academy of Medicine, New York City, on May 20, 1970. Copyrighted Material."}, {"id": 579, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 8, "loc": "clinician", "int": 0.4, "aff": "limited awareness", "au": "Searles", "pt": "unnamed", "pg": 4, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "My second analytic patient, for example, a schizoid man who put two years of analytic work to relatively good use, recurrently projected aspects of himself into a fantasy of a gigantic stone mountain, which was experienced variously as broodingly sinister , benignly massive and 2 strong, and so on over a great variety of aspects during those two years. In a sense, this fantasied stone mountain was the most creative aspect of his analysis; but rarely, if ever , did the transference-data depict me as that mountain. My own self-awareness was too limited, and is still too limited, freely to allow such non-human, or in genetic terms pre-human, pictures of me freely and explicitly to emerge. If such very early transference-reactions could emerge more freely and directly, rather than their needing to be displaced outside the patient-analyst milieu as a fantasy of a stone mountain, these personalitycomponents would then become more available to the patient in humanidentification terms: he could then acquire, for his conscious ego-functioning, the strengths and energies bound up in such repressed and projected identifications with the mother of his \"pre-human\" infancy."}, {"id": 580, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 10, "loc": "clinician", "int": 0.8, "aff": "beaten, brutalized", "au": "Searles", "pt": "unnamed", "pg": 4, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "For example I worked for years with a schizophrenic woman who experienced, for instance, a harsh verbal comment from me as being literally a bullet shot into her heart. Divided emotional loyalties were experienced not as such, by her , but rather as a matter of the various physical parts of her body's being controlled by various outside agencies. In some of my sessions with her I, for my part, felt physically beaten by her paranoid tongue-lashings, and on more than one occasion I left her room, after an hour in which she had been brutally Copyrighted Material. For use only by 48923."}, {"id": 581, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 15, "loc": "clinician", "int": 0.6, "aff": "conjured dread", "au": "Searles", "pt": "unnamed", "pg": 7, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "hospital where he was living. I knew that there had been many episodes of violence in his family history, on the part of various family-members including himself and, although he appeared now non-psychotic and well-controlled, I learned after the interview that those about him on the ward were pervasively afraid of his homicidal proclivities. During the interview, in speaking of the episodes of violence between his father and himself, he detailed one \"all out attack\" he had made upon his father at breakfast, during which he had thrown a bottle of syrup which had hit his father in the head and knocked him, unconscious and bleeding, to the floor , whereupon the mother and younger siblings had rushed to the father in fear that he had been killed or wounded mortally. He had not; but the notable thing, here, is that the patient had said \"all out attack\" in such a manner as to conjure up in my mind the fantasy of its having been a multiple attack upon the father , 5 that is, an attack by many people—as, for example, a company of infantry, although I did not think specifically of the latter; what I did think of specifically was an attack by many people, more than a few, less than a horde."}, {"id": 582, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 19, "loc": "clinician", "int": 0.7, "aff": "inept, ridiculing", "au": "Searles", "pt": "unnamed", "pg": 8, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "With another autistic patient, one who was highly verbal but functioned in the sure conviction that his was the only valid thinking in the room, any experience of myself as an individual separate from him was accompanied by an intensely uncomfortable awareness of my mental ineptitude and verbal inarticulateness. With still another patient, to function explicitly as an individual separate from him meant, almost invariably, that one was singling out, and holding up for ridicule, one or another of the more pathological aspects of the patient's characterological functioning. It is small wonder that the analyst, finding only such constricted areas for his own functioning separately from the patient, areas so highly unacceptable to his own superego, would tend to abandon such individuality for himself and immerse himself defensively, instead, in a \"neutrally hovering\" absorption with the patient's autistic world; this is, of course, a travesty upon the intendedly neutrally-attentive role of the analyst. Just as one's immersion in the patient's autistic world can serve as an unconscious defense against one's functioning in these difficult ways separately from him, so can such kinds of separateness be revealed as unconscious defenses against a therapeutically-necessary symbiosis with the autistic patient."}, {"id": 583, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 22, "loc": "clinician", "int": 0.75, "aff": "sorrowful tormented", "au": "Searles", "pt": "unnamed", "pg": 9, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "I say almost nothing, hour after hour; but I do need at times to breathe or to move about.\" The awkward but significant thing was that, when I said \"I'm sorry …\", I heard a note of 7 genuineness come through my intended irony. It dawned on me that I was indeed sorry, for my own sake, that I was unable fully to relinquish my own separate existence, an existence so tormented by this sadistically-controlling, autistically \"fragile\" man, and be fully at one with the world in which he remained so single-mindedly immersed. I mentioned in the first of these papers 5 a chronically schizophrenic woman who, for a long time after the beginning of our work, expressed herself verbally only in the form of highly tentative questions, often leaving the second half of a question unsaid, as if needing my full concurrence almost word for word, lest any venturing forward on her own be tantamount to the craziness which had engulfed her in her previously acute psychosis. I was interested to find, after some years of at least moderately successful work with her , that my own verbal behavior had long since come to assume a form not markedly different from what her own had been at the outset."}, {"id": 584, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 26, "loc": "clinician", "int": 0.5, "aff": "separation-anxiety", "au": "Searles", "pt": "unnamed", "pg": 10, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "Likewise, I have been able to stand years of silence from one or another patient, and I am working now with one woman who for the first ten years of her four-hour-per-week treatment never set foot in my office; I had always to bring the treatment to her . But my separation-anxiety takes such a form that I cannot work with a patient who finds it necessary to control the timing of both the beginning and the end of the session. I have worked, and am working, with chronically tardy patients; but such patients are not free, in their Copyrighted Material. For use only by 48923."}, {"id": 585, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 28, "loc": "patient", "int": 0.7, "aff": "haunted loneliness", "au": "Searles", "pt": "unnamed", "pg": 11, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "It's as if this building were a haunted house, and I'm in it with only you for a companion, and I keep thinking: It would be better to be alone, to be completely alone with my daydreams, than to have to cope with the disappointing realities … It is my impression that the mercurial, chaotic ingredients within such a patient's formerly autistic rigidity are traceable to early childhood experiences of multiple, non-stable maternal objects. Many such patients have had a stream of nursemaids, of most of whom they have no conscious memory; or they may remember only a hand, without any more complete memory-image which tells them to whom the hand belonged. But the major aspect of childhood etiology of this chaotic core within the adult autistic patient, which we now see emerging, is referable to an own mother who was physically there consistently enough, but psychologically so poorly integrated that she constituted, for the Copyrighted Material. For use only by 48923."}, {"id": 586, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 29, "loc": "dyadic", "int": 0.6, "aff": "multiplied, fragmented", "au": "Searles", "pt": "unnamed", "pg": 12, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "child, a multiple and unpredictably changing stream of mothering-figures. One schizophrenic woman, who had had such a mother , protested, \"Whenever you use the word 'mother', I see a whole parade of women, each one representing a different point of view.\" 4 This woman, in my sessions with her , for years saw an endless stream of persons in me—in, specifically, my eyes—and seldom experienced me as being a single person; usually I was two persons to her simultaneously, and her experience of her own identity was comparably chaotic and multiple. Concerning a twenty-one-year-old chronically schizophrenic woman whom I once saw in a teaching interview, the history stated that 10 Betty worked as a toll collector on the Golden Gate Bridge for approximately ten weeks last summer, a job she despised but \"endured\" in order to get money to buy a violin and embark on a career in music. One day while working in the toll booth she began to ruminate about the unreality and meaning-lessness of life, and felt that it was stupid to ask people to pay money to ride across a bridge."}, {"id": 587, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 30, "loc": "patient", "int": 0.6, "aff": "empty despair", "au": "Searles", "pt": "unnamed", "pg": 12, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "She looked into the \"souls of the drivers\" who were passing her booth and felt that they were \"empty.\" At this point she started to cry and refused to continue working. She went to the supervisor's booth and refused to talk to anyone and only sobbed occasionally. After several hours, her supervisor brought her to the ——— Hospital's emergency room. … The patient's mother is a 58 year old woman, raised in rural Oregon, whose own mother was described as a paranoid woman who required electroconvulsive treatment but no hospitalization. The patient indicates that her mother was the \"scapegoat\" of the family and was abused verbally, periodically, throughout her own childhood."}, {"id": 588, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 34, "loc": "clinician", "int": 0.55, "aff": "unsettled perceptiveness", "au": "Searles", "pt": "unnamed", "pg": 13, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "The time came when, as he was once again so ruminating, I sensed that his ruminations were in part based upon unconscious perceptions of me as being dissatisfied with my work; he knew that I was going to be absent from my office during the ensuing days, and he had never reported any Copyrighted Material. For use only by 48923. Reproduction prohibited. Usage subject to PEP terms & conditions (see terms.pep-web.org)."}, {"id": 589, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 37, "loc": "patient", "int": 0.5, "aff": "suspicious blending", "au": "Searles", "pt": "unnamed", "pg": 14, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "The magnitude of the shift as the patient experiences it, from his former autism to a sudden sense of blending with some aspect of the analyst, can be illustrated by an incident from a session I had with a chronically schizophrenic woman whom I had been treating for many years. During all those years she had given me to understand that she frequently experienced auditory hallucinations. At the time of her acute psychosis, a year before I became her analyst, her family, in their great reluctance to place her in a mental hospital, had called into the home, to see her , a succession of seven or eight psychiatrists, each of whom had recommended hospitalization, before they finally had acquiesced. She had almost no memory of that experience, and recurrently expressed, in her work with me, the dark suspicion that those Copyrighted Material."}, {"id": 590, "tr": "interpersonal_searles", "doc": "(optional) 2 Searles_Autism and the Phase of T", "pos": 50, "loc": "clinician", "int": 0.6, "aff": "unguilty coldness", "au": "Searles", "pt": "Charlotte", "pg": 18, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "She made no reply. Such a way of responding on my part was not unprecedentedly \"cold\"; but I doubt that I had ever felt quite so free from doubt and guilt at so responding to her. Hour 3 I had not seen Charlotte since Monday, because yesterday (Tuesday) was a 16 holiday (the 4th of July). When I went over to Upper Cottage this (Wednesday) morning for the hour, Mrs."}, {"id": 591, "tr": "interpersonal_searles", "doc": "Searles-Oedipal Love in the Counter-Transferen", "pos": 0, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Searles", "pt": "none", "pg": 1, "pdf": "", "ppg": 1, "pcf": 1.0, "txt": "Psycho-Anal., 40:180-190. ( 1959 ). International Journal of Psycho-Analysis , 40 : 180-190 Oedipal Love in the Counter Transference Harold F . Searles, M.D. This paper will advance three hypotheses which, as will be shown, are interrelated: ( a ) in the course of a successful psycho-analysis , the analyst goes through a phase of reacting to, and eventually relinquishing, the patient as being his oedipal love -object; ( b ) in normal personality - development , the parent reciprocates the child 's oedipal love with greater intensity than we have recognized heretofore; and ( c ) in such normal development , the passing of the Oedipus complex is at least as important a phase in egodevelopment as in superego - development ."}, {"id": 592, "tr": "interpersonal_searles", "doc": "Searles-Oedipal Love in the Counter-Transferen", "pos": 2, "loc": "clinician", "int": 0.5, "aff": "troubled self-doubt", "au": "Searles", "pt": "none", "pg": 1, "pdf": "", "ppg": 1, "pcf": 1.0, "txt": "My observations of colleagues' work with their patients, observa tions made in the course of listening to case-presentations or during informal chats with colleagues about our work or, in the past ﬁve years, while doing supervision, strongly suggested to me that these colleagues were not insusceptible to experiencing such feelings themselves. But it was only a rare one who openly acknowledged the presence of them in himself; so I remained, until very recently, largely convinced that I have an unusual propensity for exploiting ana lytic patients for the purpose of grappling with my own unresolved Oedipus conﬂicts. And psycho-analytic literature is, in the main, such as to make one feel more, rather than less, troubled at ﬁnding in oneself such feelings toward one's patient. As Lucia E."}, {"id": 593, "tr": "interpersonal_searles", "doc": "Searles-Oedipal Love in the Counter-Transferen", "pos": 8, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Searles", "pt": "none", "pg": 2, "pdf": "", "ppg": 2, "pcf": 1.0, "txt": "Weigert's paper, which helped me to formulate the views which I am setting down here, might be put with mine, that is, as expressing the total point that a successful psychoanalysis involves the analyst's deeply-felt relinquishment of the patient both as being a cherished infant, and as being a fellow adult who is responded to at the level of genital love. The paper by L. E. Tower (12) comes similarly close to the views which I advance here."}, {"id": 594, "tr": "interpersonal_searles", "doc": "Searles-Oedipal Love in the Counter-Transferen", "pos": 11, "loc": "none", "int": 0.2, "aff": "anxious admission", "au": "Searles", "pt": "unnamed", "pg": 2, "pdf": "", "ppg": 2, "pcf": 1.0, "txt": "In my experience, virtually all physicians, when they gain enough confidence in their analysts, report erotic feelings and impulses toward their patients, but usually do so with a good deal of fe ar and conflict . … In our selection of candidates for training , we are disposed to pay close attention to the libidinal ————————————— I was interested to read a second reference, this time by L. E. Tower (12) , to this same paper by Johnson. Tower notes that '… A paper presented to the Chicago Psycho-analytic Society four years ago [namely, in 1951] by Adelaide Johnson touched tangentially on this problem [of countertransference affect ] and evoked the most massive anxiety and countercathexis in the audience I have observed in many years of psycho-analytic meetings."}, {"id": 595, "tr": "interpersonal_searles", "doc": "Searles-Oedipal Love in the Counter-Transferen", "pos": 14, "loc": "dyadic", "int": 0.45, "aff": "shared upheaval", "au": "Searles", "pt": "none", "pg": 3, "pdf": "", "ppg": 3, "pcf": 1.0, "txt": "These countertransference structures may be large or small in their quantitative aspects, but in the total picture they may be of considerable significance for the outcome of the treatment. I believe they function somewhat in the manner of a catalytic agent in the treatment process. Their understanding by the analyst may be as important to the final working through of the transference neurosis as is the analyst's intellectual understanding of the transference neurosis itself, perhaps because they are, so to speak, the vehicle for the analyst's emotional understanding of the transference neurosis. B oth transference neurosis and countertransference structure seem intimately bound together in a living process and both must be taken continually into account in the work which is psychoanalysis. … … I doubt that there is any thorough working through of a deep transference neurosis, in the strictest sense, which does not involve some form of emotional upheaval in which both patient and anal yst are involved."}, {"id": 596, "tr": "interpersonal_searles", "doc": "Searles-Oedipal Love in the Counter-Transferen", "pos": 24, "loc": "clinician", "int": 0.6, "aff": "affective awareness", "au": "Searles", "pt": "none", "pg": 4, "pdf": "", "ppg": 4, "pcf": 1.0, "txt": "I have come to believe that there is a direct correlation between, on the on e hand, the affective intensity with which the analyst experiences an awareness of such feelings—and of the unrealizabilit y of such feelings—in himself toward the patient, and, on the other hand, the depth of maturation which the patient achieves in the analysis . As usual, it seems that the analyst's own inner awareness is the main thing here; when one recommends his doing much along the line of overtly expressing such feelings to the patient, one is on dubious and shaky ground. An analyst who is relatively undisturbed at experiencing such feelings will not make any particular point of expressing them to the patient; and the patient, when he or she has achieved sufﬁcient ability to recognize and accep t the analyst as a real person, will sense that the analyst has such feelings and that he is able to cope safely with them . The schizophrenic patient, with his relatively poor contact with reality , needs oftentimes for the therapist to be more open in frankly expressing his feelings, including those which arise from the particu lar area which I am describing here, than the analyst who is working with a neurotic patient need ever become."}, {"id": 597, "tr": "interpersonal_searles", "doc": "Searles-Oedipal Love in the Counter-Transferen", "pos": 27, "loc": "clinician", "int": 0.65, "aff": "moved candor", "au": "Searles", "pt": "none", "pg": 5, "pdf": "", "ppg": 5, "pcf": 1.0, "txt": "- 183 - accompanying anxiety , guilt , and embarrassment. The ﬁrst reason is that when the schizophrenic moves, in the course of his therapy, i nto the phase of the Oedipus conﬂict , he makes erotic and romantic demands upon the therapist with a tenacity, and an oft en truly astonishing oblivousness of incest -taboos (and of the realities of his own and his therapist's life-situations), which require, for their resolution, something different from the therapist than a repression of responsive romantic and erotic feelings and fantasies which the analyst, in working with the neurotic patient who has a relatively strong e go, may be able to get by with. I do not knowingly practise, and am distinctly opposed to, a therapist's entering into any form of erotic behaviour with any patient, schizophrenic or otherwise, or departing from his basic analytic role by exp ressing romantic love to a patient. But I have repeatedly found it beneﬁcial, rather than harmful, in the therapy with my sch izophrenic patients candidly to allow them to see that they do move me deeply in this respect, when such feelings are genui nely present in me—acknowledging this at times which are appropriate to the interaction of the moment , and acknowledging it in a fashion which leaves me clear in my own mind, even if it is perhaps not yet clear in the mind of the patient, that I remain the therapist rather than becoming the patient's lover or would-be wife or husband."}, {"id": 598, "tr": "interpersonal_searles", "doc": "Searles-Oedipal Love in the Counter-Transferen", "pos": 28, "loc": "none", "int": 0.2, "aff": "didactic", "au": "Searles", "pt": "none", "pg": 5, "pdf": "", "ppg": 5, "pcf": 1.0, "txt": "The beneﬁcial effect of suc h acknowledgements resides in the investigative freeing-up which they foster—the resolution of what had become a stereo typed situation of the patient's being absorbed in making incestuous appeals to, or demands upon, the therapist, in a fashi on which had been throttling the mutual investigation of the patient's difﬁculties. Some acknowledgements do not magic ally work this result, but they constitute one of the therapeutic measures which are valuable here. When, on the other hand, a therapist dare not even recognize such responses in himself—let alone expressing them to the patient—the situ ation tends all the more to remain stalemated at this level. The second reason why the therapist needs to have much inner freedom in this regard, a reason integrally related with the ﬁrst one, is that the schizophrenic patient's abysmally low self-esteem is nouris hed by whatever emotional responses, whether romantic or erotic or angry or whatever, the patient is able to arouse in his therapist; his self-esteem is too low to tolerate the degree of unconscious denial or repression of feeling which the neurotic patient can tolerate on the part of an analyst."}, {"id": 599, "tr": "interpersonal_searles", "doc": "Searles-Oedipal Love in the Counter-Transferen", "pos": 30, "loc": "clinician", "int": 0.7, "aff": "jealous tenderness", "au": "Searles", "pt": "unnamed", "pg": 5, "pdf": "", "ppg": 5, "pcf": 1.0, "txt": "I let her know, on a number of appropriate occasions, in response to vari ous communications from her in our hours, that I had such feelings toward her; and on at least two occasions I frankly admitted that I felt jealous in response to her very conspicuously showing a romantic preference for another male therapist on our staff. The subsequent course of her therapy ﬁrmly convinced me that my freedom to experience, and even to express to her, such feelings was one essential factor in the relatively successful o utcome of my work with this woman who had been, at the beginning of our work, unusually deeply ill. Another early experience of this sort with a schizophrenic patient occurred in approx imately the twelfth month of my work with a 50-year-old, single woman who was suffering from schizophrenia with marked depressive features. Thus far I had seen her to be a drab, colourless, wraithlike individual devoid of any capacity t o arouse romantic or erotic feelings in anyone."}, {"id": 600, "tr": "interpersonal_searles", "doc": "Searles-Oedipal Love in the Counter-Transferen", "pos": 32, "loc": "clinician", "int": 0.4, "aff": "anxious tenderness", "au": "Searles", "pt": "unnamed", "pg": 5, "pdf": "", "ppg": 5, "pcf": 1.0, "txt": "This text is printed for the personal use of the PEPWeb subscriber and is copyright to the Journal in which it originally appeared. It is illegal to copy, distribute or circulate it in any form. - 184 - about her had constituted a most valuable landmark in a deepening, and eventually suc cessful, therapeutic relationship. When experienced toward a patient of one's own sex, such feelings as these are likely to be particularly anxiety - provoking. During my ﬁrst two years of work at Chestnut Lodge, I was seeing a paranoi d schizophrenic man in his middle thirties, a sensitive, highly intelligent, physically handsome man who manifested a g ratifying improvement over the course PEP Web - Oedipal Love in the Counter Transference http://proxy.wi.edu:2052/document.php?id=ijp.040.0180a&type... 5 of 10 4/18/13 9:29 PM"}, {"id": 601, "tr": "interpersonal_searles", "doc": "Searles-Oedipal Love in the Counter-Transferen", "pos": 44, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Searles", "pt": "none", "pg": 7, "pdf": "", "ppg": 7, "pcf": 1.0, "txt": "Some writers apply the term ' countertransference ' to such analyst-responses to the patient's transference ; but I prefer not to do so. The second source consists in the countertransference in the classical sense in which this term is most often used: the analyst's responding to the patient in terms of transference -feelings carried over from a ﬁgure out of the analyst's own earlier years, without awareness that his response springs predominantly from this ea rly-life source, rather than being based mainly upon the reality of the present analyst-patient relationship. It is this source, of course, which we wish to 4 4 PEP Web - Oedipal Love in the Counter Transference http://proxy.wi.edu:2052/document.php?id=ijp.040.0180a&type... 7 of 10 4/18/13 9:29 PM"}, {"id": 602, "tr": "interpersonal_searles", "doc": "Searles-Oedipal Love in the Counter-Transferen", "pos": 54, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Searles", "pt": "none", "pg": 9, "pdf": "", "ppg": 9, "pcf": 1.0, "txt": "This text is printed for the personal use of the PEPWeb subscriber and is copyright to the Journal in which it originally appeared. It is illegal to copy, distribute or circulate it in any form. - 188 - by a reality much larger than himself. My views here represent, I feel, not an attempted contradi ction of, but rather a shift of emphasis from, those of Freud; where he stressed that the oedipal phase normally results mainly in the formation of a forbidding superego , I think of it as resulting mainly in enhancement of the ego's ability to test both inner and outer reality . All my experience with both neurotic and psychotic patients has indicated to me that, in every individual instance, insofar as the oedipal phase was entered into in the course of their past development , it led to ego-impairment rather than ego-growth primarily because the beloved parent had to repress his or her reciprocal desire for the child , chieﬂy through the mechanism of unconscious denial of the child's importance to the parent ."}, {"id": 603, "tr": "interpersonal_searles", "doc": "Searles-Oedipal Love in the Counter-Transferen", "pos": 56, "loc": "none", "int": 0.1, "aff": "theoretical", "au": "Searles", "pt": "none", "pg": 9, "pdf": "", "ppg": 9, "pcf": 1.0, "txt": "Instead, what usually happens in such instances, I think, is that the child 's Oedipus complex remains unresolved because the child stubbornly—and not unnaturally—refuses to accept defeat within these particular family circumstances, wh ere the acceptance of oedipal defeat is tantamount to the acceptance of irrevocable personal worthlessness and unlovabilit y. And it seems to me clear enough, then, what this former child , now a neurotic or psychotic adult, requires from us for the successful resolution of his unresolved Oedipus complex: not such a repression of desire , acted-out seductiveness, and denial of his own worth as he met in the relationship with his parent, but rather a maximal awareness on our part of the reciprocal feelings which we develop in response to his oedipal strivings. Our main j ob remains always, of course, to further the analysis of his transference ; but what I have just described seems to me to be the optimal feeling-background in the analyst for such analytic work. PEP Web - Oedipal Love in the Counter Transference http://proxy.wi.edu:2052/document.php?id=ijp.040.0180a&type... 9 of 10 4/18/13 9:29 PM"}, {"id": 604, "tr": "interpersonal_searles", "doc": "Searles-Oedipal Love in the Counter-Transferen", "pos": 57, "loc": "none", "int": 0.0, "aff": "bibliographic", "au": "Searles", "pt": "none", "pg": 10, "pdf": "", "ppg": 10, "pcf": 1.0, "txt": "REFERENCES BARRY , M. J., Jr. and JOHNSON, A. M. 'The Incest Barrier.' Read at the meeting of the American Psychoanalytic Association, Chicago, May 1957 COHEN, M. B. 'Countertransference and Anxiety.' Psychiatry 15 231-243 1952 FREUD, S."}, {"id": 605, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 2, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Sullivan", "pt": "none", "pg": 3, "pdf": "", "ppg": 31, "pcf": 0.95, "txt": "The creative unconscious and the Self Before we can think about how the therapist might approach the clinical situation, we need to explore the nature of the human psyche ’s depths. Freud’s original sense of the unconscious focused on its function as a storehouse for fundamental instincts of sex and aggression. It began as the id, a seething cauldron of biologically based urges that the person learns to repress. Analysis worked to explore the war between the rational individual, who wanted to be civilized and appropriate, and his unconscious, which wanted to pull him into a maelstrom of sexual and aggressive behavior."}, {"id": 606, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 3, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Sullivan", "pt": "none", "pg": 3, "pdf": "", "ppg": 31, "pcf": 0.95, "txt": "In this early model, the ﬁnite aspects of the unconscious were emphasized; it was a repository of repressed material that the analyst’s interpretations would exhume. The original optimistic goal of analysis imagined the possibility of emptying the unconscious by becoming fully aware of one’s instinctual urges. Conscious awareness was supposed to allow the person to sublimate unwanted passions into constructive channels. This very early understanding of the unconscious no longer re ﬂects any depth therapist ’s theories."}, {"id": 607, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 8, "loc": "none", "int": 0.0, "aff": "reflective", "au": "Sullivan", "pt": "none", "pg": 4, "pdf": "", "ppg": 32, "pcf": 0.95, "txt": "We are never complete; the unconscious seems to enlarge rather than shrink as we connect with it, it is never emptied. Speaking in the metaphors of alchemy, Jung emphasized that “the goal [of wholeness] is important only as an idea; the essential thing is the opus [the work] which leads to the goal: that is the goal of a lifetime” (1946, para 400, emphasis in original). The goal of life is the lifelong attempt to become more and more of oneself by fully living life but any hope of completing the work must be renounced. As psychoanalysis developed over the last half of the twentieth century and into the twentyﬁrst, it increasingly recognized the constructive as well as the destructive currents in this in ﬁnite and unmappable unconscious."}, {"id": 608, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 11, "loc": "none", "int": 0.0, "aff": "didactic", "au": "Sullivan", "pt": "none", "pg": 4, "pdf": "", "ppg": 32, "pcf": 0.95, "txt": "Each 1 Throughout this book, to whatever extent possible, I avoid technical language that distances the reader from the experiences being described. Thus, I call the subjective sense of “this is me,” the “I” rather than using a technical term. 32 The creative unconscious and the Self"}, {"id": 609, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 12, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Sullivan", "pt": "none", "pg": 5, "pdf": "", "ppg": 33, "pcf": 0.95, "txt": "of them tried to map a psyche that they both spoke of as volatile and nonmaterial in nature. Although their emphases diﬀer, their resulting images of the psyche prove highly compatible. They oﬀer us a sense of mystery rather than certainty, of an ever-shifting potential reality that can never be known. In this chapter, I will explore the two concepts, O and the collective unconscious, and try to show the underlying congruence as well as the di ﬀerences between them."}, {"id": 610, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 25, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Sullivan", "pt": "none", "pg": 7, "pdf": "", "ppg": 35, "pcf": 0.95, "txt": "As we shall see, the sight of one ’s material body, its feel and its smell, are actually all nonmaterial psychological factors. We may understand these factors as based on messages received and interpreted by the material brain, but that understanding, too, comes from the psyche’s interpretation of data. It is not possible to contact the material world directly. Everything is ﬁltered through the intangible psyche."}, {"id": 611, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 34, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Sullivan", "pt": "none", "pg": 9, "pdf": "", "ppg": 37, "pcf": 0.95, "txt": "along with Bion’s perspective on the way those processes manifest and unfold in the consulting room – greatly broadens one’s view of the situation. Repeatedly, Bion says that the psyche is a nonmaterial “thing” and cannot be approached the way the body can be. Discussing the divergence between medicine and analysis, he writes: Suppose the patient complained not of physical but of mental pain; no one doubts the existence of anxiety or sees any incongruity in seeking help to cure it. . . . The point that demonstrates the divergence most clearly is that the physician is dependent on realization of sensuous experience [i.e. experience that comes through the ﬁve senses] in contrast with the psycho-analyst whose dependence is on experience that is not sensuous."}, {"id": 612, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 42, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Sullivan", "pt": "none", "pg": 10, "pdf": "", "ppg": 38, "pcf": 0.95, "txt": "We are all related to each other and to every element of existence; our fates are intertwined in ways we cannot hope to comprehend in any fullness; we are all part of one great O. O cannot be pinned down; my discussion is intended to convey a feeling for O, not a deﬁnitive mapping of it. The domain of O has been explored by philosophers and mystics under titles like the Absolute, Ultimate Reality or Ultimate Truth, the Ground of Being, God or the godhead. O is the world of Plato ’s ideal forms, Kant ’s things-in-themselves, Bion’s pre-conceptions, Klein’s inborn phantasies and Jung’s archetypes."}, {"id": 613, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 53, "loc": "none", "int": 0.2, "aff": "recognition", "au": "Sullivan", "pt": "none", "pg": 12, "pdf": "", "ppg": 40, "pcf": 0.95, "txt": "This kind of “aha!” moment – Oh! That’s what he means! – while reading or doing clinical work will reveal the meaning and value of his concepts. Then the reader will know what he means from her own experience. (This very typical Bionian instruction, of course, means that different readers will take away at least somewhat di ﬀerent understandings of his meaning as they make it theirs.) Only knowledge that comes from lived experience can bring a reliable sense of the nature of O. We cannot prove the existence of O."}, {"id": 614, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 66, "loc": "clinician", "int": 0.4, "aff": "lapses, distraction", "au": "Sullivan", "pt": "none", "pg": 14, "pdf": "", "ppg": 42, "pcf": 0.95, "txt": "The analyst forgets to return a call, chats with a patient or gives advice, ﬁnds herself unable to concentrate, struggles with narcolepsy, oﬀers this interpretation rather than that one. Every lapse and every choice is determined by many factors that lie outside one ’s awareness. The ﬁnite details of these factors emerge from O, the elemental truth of who one is, an essence that can never be known, no matter how many detailed aspects of it are grasped. Although O is ultimately unknowable, we sense its nature because it presses against us, constantly forcing us to interact with it."}, {"id": 615, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 70, "loc": "none", "int": 0.3, "aff": "unsettling surprise", "au": "Sullivan", "pt": "none", "pg": 15, "pdf": "", "ppg": 43, "pcf": 0.95, "txt": "The unknowable nature of reality is what terri ﬁes, not the reality itself, which can as well be positive as negative once it is known. Behind the ﬁxed, mapable world, where my husband or child is someone whose behavior I can (at least to some extent) predict, lies an ephemeral reality, always in motion, growing or contracting, so that the person who I “know” can always surprise me with unknown aspects of his or her self. These surprises may be deeply disturbing and the fantasy of familiarity protects us from the anxiety that the situation constellates. Bion’s position here is too extreme, but it is useful in that it helps the practitioner to compensate for her tendency to rely on The Known regarding her patient."}, {"id": 616, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 76, "loc": "clinician", "int": 0.3, "aff": "openness, faith", "au": "Sullivan", "pt": "none", "pg": 16, "pdf": "", "ppg": 44, "pcf": 0.95, "txt": "An act of faith is needed to approach something that is unconscious and unknown, perhaps because it has not yet happened; the individual needs faith in her eventual ability to intuit the O of the moment. Faith is the state of mind that is receptive to O, the source of what we call “reality.” Bion’s apparent atheism is in no sense hard-headed; he believes in a spiritual reality underlying all the world, O. Faith is also the basis for the analyst ’s opening herself to the patient in a related manner rather than working to preserve her professional authority and dignity. The latter stance is deeply unrelated."}, {"id": 617, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 79, "loc": "clinician", "int": 0.5, "aff": "humble faith", "au": "Sullivan", "pt": "none", "pg": 17, "pdf": "", "ppg": 45, "pcf": 0.95, "txt": "always silently) about her own diﬃculties and blindnesses as she is about the patient’s. She can take this stance because she has faith that between the two of them they will make some sense of the situation. Faith that she, for all her confusion and not knowing and helplessness, will be good enough to contribute enough to the mix to be valuable for the patient’s development. Faith that she can grow enough to meet her patient’s need."}, {"id": 618, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 91, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Sullivan", "pt": "none", "pg": 19, "pdf": "", "ppg": 47, "pcf": 0.95, "txt": "The concepts bleed into each other. All of human life is structured by the unknowable archetypes that determine human nature. The collective unconscious is a hypothetical concept that attempts to explain the constancy of our species across cultures and time. In talking, for example, about a contemporary dream image that he ampli ﬁes with an ancient Egyptian text, Jung asks [w]hat connection is there between your particular dream and the pyramids? – the two seem incommensurable."}, {"id": 619, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 100, "loc": "none", "int": 0.4, "aff": "lost, tormented", "au": "Sullivan", "pt": "none", "pg": 21, "pdf": "", "ppg": 49, "pcf": 0.95, "txt": "He is lost . . . and he cannot understand that this peculiar experience is the main thing. . . . In the unconscious he must submit to . . . a sort of torture. One day you think you have come to a clear decision, the next day it is gone. Y ou feel like a fool and curse it until you learn that this thing is pairs of opposites, and you are not the opposite."}, {"id": 620, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 102, "loc": "none", "int": 0.3, "aff": "shame, overwhelm", "au": "Sullivan", "pt": "none", "pg": 22, "pdf": "", "ppg": 50, "pcf": 0.95, "txt": "responsible for the winds or the tides. As long as someone imagines that she is the forces that swirl around inside, pushing her hither and yon, she is at their mercy. To whatever extent these ruthless life energies are recognized, the individual will be ﬁlled with shame. By gaining some perspective on the in ﬁnite inner depths, and recognizing their objective rather than subjective nature, she begins to know who she is."}, {"id": 621, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 106, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Sullivan", "pt": "none", "pg": 22, "pdf": "", "ppg": 50, "pcf": 0.95, "txt": "While the body as a whole has no particular concern for any given cell, every cell does its work, living and dying in harmony with the rhythms of the whole. The concept of the Self suggests that behind O ’s apparent cosmic indi ﬀerence lies an interdependent harmony 10 There is much disagreement in the Jungian world about whether or not to capitalize “self.” When it refers to the subjective sense of “me-ness” it is never capitalized; when it refers to the organizing center of the psyche it often is capitalized in English. Since Jung wrote in German, where all nouns are capitalized, he did not deal with this issue. The editors of the Collected Works decided not to capitalize the big self/Self, but the tendency in English has increasingly been to do so."}, {"id": 622, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 109, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Sullivan", "pt": "none", "pg": 23, "pdf": "", "ppg": 51, "pcf": 0.95, "txt": "He deﬁnes the ego – what I am calling the “I” – simply as consciousness. The Jungian ego is similar to most psychoanalytic notions of the self11 – it is the waking sense of “me.” The Self, on the other hand, is [t]he union of the conscious mind . . . with the unconscious. . . . The [S]elf . . . is both ego [the “I”] and non-ego, subjective and objective, individual and collective. It is the “uniting symbol” which epitomizes the total union of opposites."}, {"id": 623, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 113, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Sullivan", "pt": "none", "pg": 23, "pdf": "", "ppg": 51, "pcf": 0.95, "txt": "They each talk at times of a self that seems similar to Jung’s Self. Kohut talks of the fundamental impossibility of deﬁning the self since all we can know are its manifestations, and Kahn states that we can know the self only through the symbols which image the self at the same time as they construct it. The creative unconscious and the Self 51"}, {"id": 624, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 114, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Sullivan", "pt": "none", "pg": 24, "pdf": "", "ppg": 52, "pcf": 0.95, "txt": "Since consciousness is so much smaller than the inﬁnite depths on which it rests, the Self, the center and circumference of our energic aliveness, has an unknowable quality, a sense of otherness. Encompassing the in ﬁnite reaches of our wholeness, the Self “hits consciousness unexpectedly, like lightning. . . . It thrusts the “I” aside and makes room for a supraordinate factor, the totality of a person . . . ” (Jung, 1950b, para 541). In its energic aspect, the Self channels the life energy animating and guiding us, rarely in accord with our conscious wishes."}, {"id": 625, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 119, "loc": "none", "int": 0.2, "aff": "abstract emotional", "au": "Sullivan", "pt": "none", "pg": 24, "pdf": "", "ppg": 52, "pcf": 0.95, "txt": "When a therapy or analysis is working, the Self is constellated – it is activated and the activity of its energy is felt. We follow the activity of the Self when we follow the meanderings of an individual’s emotional life. The Self is found in all the despised emotions that people would like to amputate: shame, neediness, dependency, hopeless yearnings, “foolish” hopes and fears. The Self cannot be thought of as consisting of our emotions, but our emotions trace the path that the Self is taking; they are the Self’s attempt to capture our attention and to tell us the truth of who we are. 52 The creative unconscious and the Self"}, {"id": 626, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 124, "loc": "none", "int": 0.0, "aff": "didactic", "au": "Sullivan", "pt": "none", "pg": 26, "pdf": "", "ppg": 54, "pcf": 0.95, "txt": "example, to become an extravert but an inherent shyness will trip her up and force her to acknowledge the introversion that is her true nature, regardless of her conscious wishes for herself. She will not initially thank the god-within that forces her to be who she is, although ultimately she may be very grateful indeed for this energy pushing her to become all of herself even when her initial conscious take on that all-ness is negative. Cognitive behavioral therapy (CBT), much more highly regarded these days in the United States than psychoanalysis, formalizes the idea that a person can work with his conscious attitudes to become the person he wants to be, supposedly bypassing the inner depths of the psyche whether we image those depths as an expression of the Self or as O. Short-term CBT may prove eﬀective in changing neatly bounded symptoms in the unusual cases where discrete diﬃculties present in someone with a solid, mature “I.” Longer-term CBT can foster deeper change, just as any therapeutic approach can, but analytic therapists would conceive of that change as rooted in the unconscious depths of the interpersonal relationship between patient and therapist rather than in the therapist’s techniques or theories."}, {"id": 627, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 126, "loc": "clinician", "int": 0.5, "aff": "pulled-in, imperative", "au": "Sullivan", "pt": "none", "pg": 26, "pdf": "", "ppg": 54, "pcf": 0.95, "txt": "Where psychoanalysts have historically focused – to our great advantage – on the technical competence of the analyst, Jung and his followers have paid more attention to elements less measurable than technique, to factors that reﬂect the depths of the individual practitioner ’s development. In the intensity of an eﬀective therapy or analysis, where the transference is constellated and the practitioner is pulled into the maelstrom of unconscious material coming up not only in the patient but in herself as well, a genuine participation, going right beyond professional routine, is absolutely imperative, unless of course the doctor prefers to jeopardize the whole proceeding by evading his own problems, which are becoming more and more insistent. The doctor must go to the limits of his subjective possibilities, otherwise the patient will be unable to follow suit. (Jung, 1946, para 400) Jung’s repeated insistence on the fact that the analytic instrument re ﬂects the entirety of the practitioner ’s psyche, rather than her conscious, technical 54 The creative unconscious and the Self"}, {"id": 628, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 128, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Sullivan", "pt": "none", "pg": 27, "pdf": "", "ppg": 55, "pcf": 0.95, "txt": "As the in ﬁnite expanse of O evolves, it presses to be known about, even though it never can be known, because it is the true reality with which the person is struggling. The notion of the Self suggests that the energy governing the individual ’s aliveness can be personi ﬁed; this energy works actively to bring the person toward the truth of her experience. This personi ﬁcation is consonant with the natural language of dreams that image our subjective reality as conﬂicts between various inner ﬁgures. Jung describes the psyche’s drive to realize its truth, its separate individuality, and its interpersonal, communal interconnectedness (e.g."}, {"id": 629, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 132, "loc": "none", "int": 0.0, "aff": "conceptual", "au": "Sullivan", "pt": "none", "pg": 28, "pdf": "", "ppg": 56, "pcf": 0.95, "txt": "establish herself in the world but must yield in the second half of life to the inborn thrust from the Self that says, “this is who you are.” The energy of the Self can be personiﬁed as the God of Job; it undermines the person ’s narcissistic sense of potency, ultimately by forcing her to grapple with inﬁrmity and death. Jung’s theory oﬀers a conceptual system for understanding the individual’s driven search for the truth, even though an encounter with the truth is, virtually by de ﬁnition, destabilizing and unwelcome. Through this concept Jung discusses the creativity of the unconscious. His unconscious does not blindly seek selﬁsh gratiﬁcation; it is fueled by the psychological organism’s quest for wholeness, a much broader instinctual drive than an urge toward sexual or aggressive release."}, {"id": 630, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 136, "loc": "none", "int": 0.2, "aff": "alien, humbling", "au": "Sullivan", "pt": "none", "pg": 29, "pdf": "", "ppg": 57, "pcf": 0.95, "txt": "In my opinion, this is exactly why it is not helpful to call this force “God:” the proper noun “God” is imbued with meanings that profoundly diﬀer from Jung’s dark and wary attitude toward “God.” Jung’s psychological writing about “God” as a projection of the Self makes it possible to recognize the value of his description of the God image rather than being alienated by his religious tone. Although, at ﬁrst glance, it is puzzling why Jung would call this inner force “the Self.” Rather than ﬁnding it easy, or even, as we shall see, desirable, to identify with this powerful energy of aliveness, we ﬁnd it alien, not-I rather than “I.” To discover the Self means to discover the fact that I am not in charge. In this form, it is a painful experience. It is unconsciously familiar to us, however, and has generated the slang term “headshrinker.” The “I” gives up its inﬂation as it matures; it comes down to earth and recognizes its limitation and smallness rather than taking as its own the awesome power of the greater psyche."}, {"id": 631, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 142, "loc": "none", "int": 0.3, "aff": "painful tearing", "au": "Sullivan", "pt": "none", "pg": 30, "pdf": "", "ppg": 58, "pcf": 0.95, "txt": "Translating the myth into psychological terms, Jung says: Instead of using the term God you say “unconscious,” instead of Christ “[Self/]self,” instead of incarnation “integration of the unconscious, ” instead of salvation or redemption “individuation,” instead of cruciﬁxion or sacriﬁce on the Cross “realization of . . . ‘wholeness’” . (1958, para 1,664) It is important to notice in this quotation Jung’s sense of the pain involved in approaching a realization of one ’s wholeness. It is an experience of cruciﬁxion, of being torn between the wish to remain the familiar, acceptable person the individual knows as “himself,” and the Self ’s pressure to take in the strange and despised elements of his authentic wholeness that he would prefer to leave out. As he absorbs these new aspects of himself, he may come to value them highly, but initially their unfamiliarity makes them unwelcome. The Self embodies the totality of the in ﬁnite energy of the unconscious."}, {"id": 632, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 143, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Sullivan", "pt": "none", "pg": 30, "pdf": "", "ppg": 58, "pcf": 0.95, "txt": "It is the center, the circumference, and the wholeness of the psyche, a paradoxical entity that can be expressed only symbolically for it makes no rational “sense.” One way to describe the central goal of the Self is to think of it as incarnation – to be held and lived in the experience of the self. Over and over Jung emphasizes that the impulses arising inside the individual must be understood as objective forces to be related to rather than dominated. While these impulses are shaped by our personal experiences, the core strivings are universal in nature, even when their particular form is individual. But the impulses themselves are not “mine;” “I” am the victim of the impulses, “I” belong to them."}, {"id": 633, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 146, "loc": "none", "int": 0.0, "aff": "conceptual", "au": "Sullivan", "pt": "none", "pg": 31, "pdf": "", "ppg": 59, "pcf": 0.95, "txt": "aim of the Self is to foster relatedness . It works to insist that all the di ﬀerent tendencies inside the self, tendencies that our dreams image as diﬀerent individuals, are given a seat at the table. “I” am no more privileged than the ﬂailing infant or the cold-blooded scientist who live inside me. The job of the “I” is to make room for and to respect all of the impulses that push against it."}, {"id": 634, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 147, "loc": "clinician", "int": 0.3, "aff": "holding frame", "au": "Sullivan", "pt": "none", "pg": 31, "pdf": "", "ppg": 59, "pcf": 0.95, "txt": "The Self approaches the “I” in an imperious manner, but its goal is an inner society that operates in a related manner. Its demanding approach to the “I” can be seen as validating the analyst ’s need to maintain the analytic frame even when it seems to break her patient ’s heart; its goal – the mutually respectful atmosphere of a well-functioning committee – supports the contention that maintaining the frame in a deeply related way is crucial. The Self and the self Let me return to the puzzle I referred to above: why does Jung call this awesome power that the psyche images as God the “Self?” It is so di ﬀerent from the subjective experience we know about, the sense of being “me,” an experience of wholeness that, as depth psychologists, we know to be illusory. When the patient has gone far enough in working with her shadow 13 – the disowned parts of herself that she ﬁnds unacceptable – she begins to experience something objective about herself."}, {"id": 635, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 149, "loc": "none", "int": 0.1, "aff": "sober reckoning", "au": "Sullivan", "pt": "none", "pg": 31, "pdf": "", "ppg": 59, "pcf": 0.95, "txt": "The growing expansion of consciousness reveals a unity which nevertheless is – or was – a diversity. No longer the earlier ego with its make-believes and artiﬁcial contrivances, but another, ‘objective’ ego, which for this reason is better called the ‘self.’ No longer a mere selection of suitable ﬁctions, but a string of hard facts, which together make up the cross we all have to carry or the fate we ourselves are. (Jung, 1946, para 400) As the “I” expands and deepens, the individual ’s sense of me-ness moves increasingly in line with the person her intimates see her to be. The CEO of 13 As I will emphasize throughout this work, the individual ﬁnds his shadow unacceptable, but this does not imply that the qualities he disowns would generally be considered negative. People push away the aspects of themselves that do not ﬁt with their particular self images."}, {"id": 636, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 163, "loc": "clinician", "int": 0.85, "aff": "awe", "au": "Sullivan", "pt": "none", "pg": 34, "pdf": "", "ppg": 62, "pcf": 0.95, "txt": "In response to my question, Dr. X gestured broadly to the left and the dream became an image of the universe, an in ﬁnitely vast, utterly dark expanse, ﬁlled with brilliant nebulae and swirling galaxies of tremendous beauty. I was overcome with awe. In waking life, I do not believe that “I” will exist after the death of my body, and even though Dr."}, {"id": 637, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 165, "loc": "clinician", "int": 0.6, "aff": "idealizing trust", "au": "Sullivan", "pt": "none", "pg": 34, "pdf": "", "ppg": 62, "pcf": 0.95, "txt": "Without thinking about it, I believed that he understood everything about me, and that our mutual process, where I associated for most of the hour and he occasionally oﬀered a profound and revelatory comment, was something I needed to do for my own good, not something he required if he was to come to know me. Although I had long since revised this na ïve image of my analyst, in my infantile psyche he continued to exist in this God-like form. His return in the dream is a function of his much-larger-than-human meaning in my psyche, not a comment on something a mere person like myself could expect. In his appearance as a messenger from god (described by my secular self as the universe), Dr."}, {"id": 638, "tr": "interpersonal_searles", "doc": "Sullivan+-+The+Mystery.. (1).+-+pp+31-66.pdf", "pos": 173, "loc": "none", "int": 0.0, "aff": "none", "au": "Sullivan", "pt": "none", "pg": 36, "pdf": "", "ppg": 64, "pcf": 0.95, "txt": "archetypal psyche and psychoanalysts think of as the instinctual psyche. This is the identi ﬁcation that spawns the omnipotent defenses of infancy that Melanie Klein taught us so much about, the belief that I can destroy you with my feces or my urine, for example, which mutates as we get older into the fantasy that my rage can destr
