they may not yet be particularly conscious of feeling so."}, {"id": 152, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 665, "loc": "clinician", "int": 0.55, "aff": "reverie, self-questioning", "au": "Ringstrom", "pt": "none", "pg": 157, "pdf": "", "ppg": 140, "pcf": 1.0, "txt": "Often, the ¿ rst step is for the analyst to engage in a kind of “private” improvisational state of re À ectivity, a state of reverie (Ogden, 1994 ; Ringstrom, 2001a ). This might require the analyst to ask herself, “What is it that is getting induced in me that speaks to some dissociated aspect of the patient’s experience, and how is this giving rise to my dissociation?”—that is, “What character am I becoming in my patient’s drama?” Such reverie must then include, “And, how am I unwittingly [dissociatively] inducing my patient to become a ‘cooperative’ agent, a character in my drama—often likely the kind of patient I feel more comfortable working with?” Playing with the mutually emerging inductions can become a source for releasing the dyad from the stranglehold of the ¿ eld, as well as opening possibilities on which it is otherwise rapidly foreclosing. Another step to restoring improvisation frequently entails a kind of “metacommunication” (Pizer, 2003 ; Ringstrom, 2003 ) about the therapeutic system’s process. It can involve the therapist noting that the way that she is trying to be helpful is actually exacerbating the patients’ experience of feeling harmed."}, {"id": 153, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 750, "loc": "none", "int": 0.2, "aff": "historical", "au": "Ringstrom", "pt": "unnamed", "pg": 175, "pdf": "", "ppg": 158, "pcf": 1.0, "txt": "Both had fathers who were prone to rage, especially when they felt the universe of their family was teetering on chaos (almost always more in fantasy than in fact), and as a consequence felt threatened. Their mothers, however, were radically different. Russell’s mother was soft and quiet and despised anger, hence, for Russell, any expression of anger felt somewhere between unacceptable to À agrantly dangerous. Nicole’s mother, however, encouraged her children to vent their anger, their rage, their tantrums, and seemed in a sense to frequently even be entertained by their furies."}, {"id": 154, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 1055, "loc": "patient", "int": 0.5, "aff": "confused, toxic", "au": "Ringstrom", "pt": "Carmen", "pg": 236, "pdf": "", "ppg": 219, "pcf": 1.0, "txt": "In these ways, both Carmen and Michael could become confused within themselves as well as confusing to one another. Clearly, considerable work on Step Two was essential to this couple, since the whole realm of perspective about what is true and what isn’t had—as it often does with most couples—become a bedrock to their either feeling sane or crazy. Step Two My treatment with Michael and Carmen had barely begun, when Michael laid out his greatest grievance with Carmen: at various points, her laying claim to knowing his mind better than he did. This was especially toxic for him, since he had felt that the most signi¿ cant outcome of his many years in psychoanalytic psychotherapy had been to ¿ nally feel comfortable with having a mind of his own."}, {"id": 155, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 1072, "loc": "clinician", "int": 0.6, "aff": "empathic, balancing", "au": "Ringstrom", "pt": "Carmen", "pg": 240, "pdf": "", "ppg": 223, "pcf": 1.0, "txt": "AN ILLUSTRATION OF THE SIX STEPS 223 Somewhere along in this, I gently shifted focus to Michael, commenting on how dif¿ cult it must be for him to feel mistrusted by Carmen, that when her mistrust manifested in her questioning the contents and integrity of his mind, he would doubtlessly ¿ nd this toxic, especially after he had worked so long and hard in his analysis to achieve having a mind of his own. As I did in seeking some recognition for Carmen’s position from Michael, I began to nonverbally do the same with Carmen regarding how Michael experienced feeling mistrusted. In conjunction with this, I also sought some recognition from Carmen regarding how her interpretations made Michael feel so badly. Notably, as I was speaking to one of them, I was also intermittently punctuating my comments by looking at the other and conveying in my nonverbal facial expression, “It makes so much sense, doesn’t it?” Later on, I underscored this verbally, suggesting that each one’s position seemed especially true when seen from the viewpoint of their respective backgrounds."}, {"id": 156, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 1077, "loc": "none", "int": 0.2, "aff": "narrated resentment", "au": "Ringstrom", "pt": "Carmen", "pg": 241, "pdf": "", "ppg": 224, "pcf": 1.0, "txt": "AN ILLUSTRATION OF THE SIX STEPS 224 her in this surrogate paternal position,” she also privately relished it. All of this left Carmen feeling guilty regarding her father, resentful of her mother’s neediness, and jealous and envious of the attention lorded over Luisa, who after all did nothing for the attention she received, other than having been born when she was. By contrast, Carmen felt that she had to perform vital functions for her family to garner any comparable attention. The impact on her marriage to Michael was that Carmen could easily become enraged when she felt that Michael valued her more for what she did than for who she was, an accusation that Michael claimed was pure projection."}, {"id": 157, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 1092, "loc": "none", "int": 0.2, "aff": "theoretical vigilance", "au": "Ringstrom", "pt": "Carmen", "pg": 243, "pdf": "", "ppg": 226, "pcf": 1.0, "txt": "One pertained to incidents of feeling ashamed, and the other pertained to overwhelming feelings that were triggered when their issues dovetailed with some traumatic experience. While both were prone to defend themselves when feeling shamed by the other’s claim to holding the correct view of reality, Carmen’s history of trauma made her more prone than Michael to lapse into temporary states of psychic equivalence. As Bromberg ( 1998 , 2006 ) notes, trauma victims live in a perpetual state of vigilance that is always on the alert, anticipating trauma. Because of the prospective perils of being wrong, it is harder for such individuals to reserve a healthy sense of doubt when trauma states are triggered."}, {"id": 158, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 1108, "loc": "none", "int": 0.3, "aff": "secret guilt", "au": "Ringstrom", "pt": "Carmen", "pg": 246, "pdf": "", "ppg": 229, "pcf": 1.0, "txt": "On top of all of this, an even more complicating factor than Carmen’s age pertained to Michael. Toward the end of his ¿ rst marriage, he had privately gotten a vasectomy to ensure that his wife would not become pregnant again. Though he felt a bit guilty over his secrecy, he also felt that his marriage was doomed, and was only invested in staying in it until his son was old enough for him to feel okay about separating. Thus, the idea of a complicating pregnancy was too overwhelming, and yet the announcement of his vasectomy might have led to a premature dissolution of his marriage."}, {"id": 159, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 1266, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Ringstrom", "pt": "none", "pg": 275, "pdf": "", "ppg": 258, "pcf": 1.0, "txt": "258 Appendix A A BRIEF SUMMARY OF FOUR MODELS OF FAMILY SYSTEMS THEORY AND THEIR IMPLICATIONS Murray Bowen’s theory Of all the family systems theories, Bowen’s was likely the most coherent and comprehensive. The basic premise of Bowen’s theory is that the capacity of any individual family member to develop a sense of self (as de¿ ned by the ability to choose goals regarding work and relationships and strive towards accomplishing both) depends on his or her capacity to differentiate emotional reactions from those of other family members, as well as to differentiate emotional functioning from intellectual. Since anxiety undermines differentiation, Bowen’s model focused on the arousal and mitigation of anxiety within a family system. Highly differentiated adults, Bowen touted, are less prone to anxiety, or at least are better able to manage it without displacing it or projecting it on others."}, {"id": 160, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 1267, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Ringstrom", "pt": "none", "pg": 275, "pdf": "", "ppg": 258, "pcf": 1.0, "txt": "By contrast, those who are much less differentiated are prone to fuse with others, drawing others in closely tied relationships, as well as allowing themselves to be drawn into the emotionally wrought dramas of other family members. Families with poor patterns of differentiation were notably highly “emotionally reactive,” tending to do what feels right instead of pausing to think things through. They operate more as “pseudo-selves”—that is, ones who cannot distinguish what is truly important to their sense of self-actualization. Those who possess more of a sense of solid self are better able to grasp what they believe and what they are therefore willing to push for in life, despite the anxiety it may produce within themselves or others."}, {"id": 161, "tr": "object_relations", "doc": "Winnicott. (1947) Hate in the countertransfere", "pos": 6, "loc": "none", "int": 0.2, "aff": "theoretical", "au": "Winnicott", "pt": "unnamed", "pg": 2, "pdf": "", "ppg": null, "pcf": 0.5, "txt": "A hypomanic patient who is incapable of being depressed, except in a severe mood swing, and in whose emotional development the depressive position has not been securely won, who cannot feel guilt in a deep way, or a sense of concern or responsibility, is unable to see the analyst's work as an attempt on the part of the analyst to make reparation in respect of his own (the analyst's) guilt feelings. A neurotic patient tends to see the analyst as ambivalent towards the patient, and to expect the analyst to show a splitting of love and hate; this patient, when in luck, gets the love, because someone else is getting the analyst's hate. Would it not follow that if a psychotic is in a ‘coincident love-hate’ state of feeling he experiences a deep conviction that the analyst is also only capable of the same crude and dangerous state of coincident love-hate Copyrighted Material. For use only by 48791."}, {"id": 162, "tr": "object_relations", "doc": "Winnicott. (1947) Hate in the countertransfere", "pos": 9, "loc": "clinician", "int": 0.8, "aff": "repelled, relieved", "au": "Winnicott", "pt": "unnamed", "pg": 3, "pdf": "", "ppg": null, "pcf": 0.5, "txt": "Are there not many situations in our ordinary analytic work in which the analyst's hate is justified? A patient of mine, a very bad obsessional, was almost loathsome to me for some years. I felt bad about this until the analysis turned a corner and the patient became lovable, and then I realized that his unlikeableness had been an active symptom, unconsciously determined. It was indeed a wonderful day for me (much later on) when I could actually tell the patient that I and his friends had felt repelled by him, but that he had been too ill for us to let him know."}, {"id": 163, "tr": "object_relations", "doc": "Winnicott. (1947) Hate in the countertransfere", "pos": 17, "loc": "patient", "int": 0.6, "aff": "castration anxiety", "au": "Winnicott", "pt": "unnamed", "pg": 5, "pdf": "", "ppg": null, "pcf": 0.5, "txt": "This was associated with the feeling I have had at the top of the Eiffel Tower that if I put my hand over the edge it would fall off on to the ground below. This would be ordinary castration anxiety. In the next phase of the dream I was aware that the people in the stalls were watching a play and I was now related through them to what was going on on the stage. A new kind of anxiety now developed."}, {"id": 164, "tr": "object_relations", "doc": "Winnicott's squiggle game- Its diagnostic and ", "pos": 12, "loc": "dyadic", "int": 0.6, "aff": "shared sadness", "au": "Winnicott", "pt": "unnamed", "pg": 2, "pdf": "", "ppg": 178, "pcf": 1.0, "txt": "For example, a little boy whose parents were having dreadful marital problems drew a picture from my squiggle of a house falling down. My response was a picture of a little boy crying and I said, “He is sad because the house is falling down.” 1 felt he had told me that his world was coming apart. I replied with a picture of what that might feel like - knowing that it I were wrong he might draw a “mad” or a “scared” picture and we’d both know a little better about lus predicament and what he felt. This kind of direct metaphoric exchange saves some of the turmoil associated with direct confrontation. (Although I must qualify this statement by saying that I create a stage for this later exchange by beginning interviews with children - after asking them to tell me why they are seeing me - by telling them what I know and what I do.) We begin to communicate. through pictures, about the details of a child’s problem."}, {"id": 165, "tr": "object_relations", "doc": "Winnicott's squiggle game- Its diagnostic and ", "pos": 17, "loc": "none", "int": 0.1, "aff": "didactic", "au": "Winnicott", "pt": "none", "pg": 3, "pdf": "", "ppg": 179, "pcf": 1.0, "txt": "WINNICOTT’S SOUlCGLE GAME: ITS DIAGNOSTIC AND THERAPEUTIC USEFULNESS may permit moving on to further clarification of other issues. These concepts can be illustrated through case reports. One case which follows focuses on the manifestations of anxiety in the squiggle game. This is followed by an example reflecting the depth of anxiety a child may feel and its resulting impact on his cognitive structure."}, {"id": 166, "tr": "object_relations", "doc": "Winnicott's squiggle game- Its diagnostic and ", "pos": 41, "loc": "patient", "int": 0.5, "aff": "acute anxiety", "au": "Winnicott", "pt": "Cheryl", "pg": 6, "pdf": "", "ppg": 182, "pcf": 1.0, "txt": "While this was a translation of this little girl’s fear that her well-being depended upon the sacrifice of her brother, the distorted, reality-violating image used to convey this fear reflected the acute degree of her anxiety. A child’s anxiety can often be diagnostically defined in the exchange of the squiggle game. Whether as a result of a threatening situation, or more complex factors including the child’s perception of his own threatening affects. the squiggle game is a useful tool to focus on these concerns. NEUROTIC CONFLICTS It may also serve to highlight a neurotic concern."}, {"id": 167, "tr": "object_relations", "doc": "Winnicott's squiggle game- Its diagnostic and ", "pos": 43, "loc": "patient", "int": 0.4, "aff": "trembling anxiety", "au": "Winnicott", "pt": "Cheryl", "pg": 7, "pdf": "", "ppg": 183, "pcf": 1.0, "txt": "WINNICOTT'S SQUIGGLL:.GAME:ITS DIAGNOSTIC ANDTHI.KAl'IXJTIC USI<I~ULNI.SS Mother was an anxious woman herself, and trembled as she conveyed her concerns about Cheryl. She was unable to relate any precipitating event, felt everything else was fine at home with the family, and reported that Cheryl’s performance at parochial school (once she was there) was above average. Cheryl also had good peer relationships. Cheryl was indeed a very anxious child."}, {"id": 168, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 68, "loc": "none", "int": 0.2, "aff": "relieved recollection", "au": "Ringstrom", "pt": "unnamed", "pg": 25, "pdf": "", "ppg": 8, "pcf": 1.0, "txt": "Furthermore, she implicitly knew that if her parents had given her the time to consider something related to her, as she would normally expect, she could better know what it is that she wanted to do, that she would be able to know “her own mind.” Hence, her statement implied some recognition that she had the capacity to make her choice vis-à-vis her desires, and that if she did not know what she wanted to do in a particular moment, she could, if allowed, know it soon enough. (Five minutes later, Lena decided that she did want a sleepover at her grandparents, and we, relieved of our guilt, scampered off to our ¿ lm.) The ful¿ llment of self-actualization in a long-term committed relationship to which each partner is drawn arises out of a longing to accomplish something incomplete in their upbringing—that is, to ful ¿ ll what has felt de ¿ cient, or to repair what has felt fundamentally broken. This involves the hope to become who they have not yet become, though it also entails, albeit unconsciously, the"}, {"id": 169, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 76, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Ringstrom", "pt": "none", "pg": 27, "pdf": "", "ppg": 10, "pcf": 1.0, "txt": "The Möbius loop model helps us understand one of the most profound evolutions in conceptualizing agency, arising from the neurosciences, which provocatively argues that agency is an illusion, albeit a necessary one. Modell ( 2008 ) writes: We can accept the idea that the feeling of agency is a construction of our brain and in this sense is illusory, if we consider that all our mental constructions are in a certain sense illusory. If illusion is de ¿ ned as a false appearance, a belief that does not have its correspondence in the physical world, the current view in neuroscience is that everything the brain constructs is an illusion. Selves do not exist in the physical world; our perception of the self is a construction of our brain."}, {"id": 170, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 129, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Ringstrom", "pt": "none", "pg": 39, "pdf": "", "ppg": 22, "pcf": 1.0, "txt": "In the face of this powerful countervailing force to accommodate the surround, Slavin argues, humans are universally vulnerable to “over-accommodation” and to “over-socialization.” 13 Still, notwithstanding our penchant for accommodation, we human beings simply could not, cannot, and will not eradicate our sense of selfhood. It is our inescapable relationship to this force of human nature that Slavin argues makes Eros our private antidote to our human penchant for overaccommodation. Ero s, and the erotic imagination it entails, remains one of the most private and priceless aspects of our sense of individuality. Eros potentially provides us with a sense of transcendence over our daily battles with all of the sexual prohibitions and injunctions with which we grew up."}, {"id": 171, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 133, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Ringstrom", "pt": "none", "pg": 40, "pdf": "", "ppg": 23, "pcf": 1.0, "txt": "Indeed, several of the relational authors see Eros , eroticism, lust, and the erotic imagination as in many ways seeking to help us grasp something about ourselves that we feel is lacking or de¿ cient. In effect, in sex and in sexual fantasy, we—at least some of us some of the time, if not most of us most of the time—need to use the other as a vehicle for discerning what we have always felt as fundamentally missing. One way in particular that we do this, according to Martin Frommer ( 2006 ), is through our sense of lust towards another. Lust is usually a very private matter, more typically eschewed by the conventional contract of enduring love and attachment."}, {"id": 172, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 141, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Ringstrom", "pt": "none", "pg": 41, "pdf": "", "ppg": 24, "pcf": 1.0, "txt": "To hammer home her point, she invokes Lacan’s famous admonition (which Mitchell also did in Can Love Last? ): “Love is giving something you do not have, to someone you do not know.” Lacan’s thesis is that, while we are born in a state of fragmentation (the calamity of the baby’s lack of coordination of his central nervous system), we develop an extremely early and illusory sense of “wholeness” from what is mirrored back to us, both visually and by others, especially mother. Literally, the baby sees a whole image of himself in the mirror, different from his experience of his immature lack of coordination in a world occupied by seemingly coordinated beings. On the psychological plane, the baby experiences a sense of wholeness in the eyes of his mother, in particular through her “gaze,” a gaze that completes him"}, {"id": 173, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 207, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Ringstrom", "pt": "none", "pg": 56, "pdf": "", "ppg": 39, "pcf": 1.0, "txt": "This will be the case until one can accommodate new organizing principles to make sense of the data; it is in this latter sense that all systems of learning thrive. Piaget’s ideas are particularly helpful in underscoring how prereÀ ectively invariant organizing principles may end up being treated as unquestioned “knowns” (i.e., as matters of certainty). This is a fallacy that is repeatedly encountered in couples therapy. When it rears its ugly head, it is evidence that the individual has forgotten (or never recognized) his inherent role as a constructor as well as discoverer of his subjective version of reality."}, {"id": 174, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 265, "loc": "none", "int": 0.0, "aff": "technique", "au": "Ringstrom", "pt": "none", "pg": 68, "pdf": "", "ppg": 51, "pcf": 1.0, "txt": "It means that how one lives out one’s sense of agency in terms of self-actualization must be perpetually renegotiated in intimate relationships (Pizer, 1998 ). All of this means that, beginning with Step One and continuing throughout the treatment, it is important to listen for the manner in which each partner’s desires and goals for self-actualization manifest. In a similar vein, this involves assessing how much each partner looks to the other for recognition and af¿ rmation of his or her personal goals, as well as how threatened each is by the other’s sense of agency. All of these ideas are germane to an assessment of how much each partner is able to take responsibility for their sense of agency, versus requiring the other to assume that responsibility."}, {"id": 175, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 289, "loc": "none", "int": 0.0, "aff": "technique", "au": "Ringstrom", "pt": "none", "pg": 73, "pdf": "", "ppg": 56, "pcf": 1.0, "txt": "Listening stances Up to this point, Step One has emphasized the therapist’s highly empathically attuned listening stance vis-à-vis the partners as individuals, as well as to their relationship as a couple. All of this pertains to recognition of the individual partners’ sense of self, self-actualization, agency, and so forth, as well as how these states are optimized for both partners under the circumstances of mutual recognition and the relationship having (an open) mind of its own. From what we understand about multiple self-state theory, however, the experience of selfhood can manifest in a host of different states con¿ gured by a sense of self, a sense of other, and the affect that links the two. For most of Step One, the focus has been on how the therapist and the partners learn about each other’s subjective experiences through listening from what Fosshage ( 1997 ) refers to as the “subject-centered listening perspective” (self psychology’s and intersubjective systems theory’s privileged listening stance)."}, {"id": 176, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 296, "loc": "none", "int": 0.2, "aff": "burdened anxious", "au": "Ringstrom", "pt": "Claire and Simon", "pg": 75, "pdf": "", "ppg": 58, "pcf": 1.0, "txt": "Claire and Simon Claire and Simon are a couple in their early forties whose relatively intact and loving relationship was beset with a particularly menacing problem: the omnipresence of what had been Claire’s lifelong anxiety disorder. Though typically not present during our sessions, their reports of her anxiety conveyed how extraordinarily burdensome it was for both of them. Medication and individual therapy had to some extent been helpful, but when Claire’s symptoms “reared their ugly head” they rapidly became a relationship issue. This had very much to do with how Simon would respond to Claire and what she would take of his response that was helpful, or—more often not—even exacerbating of her anxiety."}, {"id": 177, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 301, "loc": "patient", "int": 0.5, "aff": "castrated longing", "au": "Ringstrom", "pt": "Claire and Simon", "pg": 76, "pdf": "", "ppg": 59, "pcf": 1.0, "txt": "Meanwhile, Simon felt “castrated” by Claire in his efforts at being a powerful, strong, “erect” presence to help her. All he really hungered for was attempting to be her hero. My Step One interpretations about their failed selfobject longings, their triggered repetitive transference reactions, and the vicious cycle that arose from this helped Claire and Simon better understand their reactions to their hurt feelings and to even begin to see the anxiety de ¿ ning aspects of both of their personalities as well as their relationship. They were, in short, a self-perpetuating system of anxiety."}, {"id": 178, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 379, "loc": "dyadic", "int": 0.8, "aff": "shame enactment", "au": "Ringstrom", "pt": "Sally", "pg": 94, "pdf": "", "ppg": 77, "pcf": 1.0, "txt": "I said that I felt like, in some very implicit and unconscious manner, I was responding to Sally, perhaps like my mother might have liked to to her mother, but did not dare to. I took my time and shared a few additional anecdotes I had been told by my mother about my grandmother. I ¿ nally summed up that it seemed that we had found ourselves in a huge enactment, and as my narrative ended Sally began weeping. She confessed that, as angry as she was at me, she had a more private sense that there was something deeply disturbed about her, and that this realization had À ooded her with a completely immobilizing sense of shame that she tried to combat through “blaming” me."}, {"id": 179, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 404, "loc": "dyadic", "int": 0.75, "aff": "bullying negation", "au": "Ringstrom", "pt": "Kevin", "pg": 98, "pdf": "", "ppg": 81, "pcf": 1.0, "txt": "I speculated, however, about the possibility that something might have gotten enacted between Kevin and myself: that we had in fact engaged intersubjectively in something like a negating third—that is, in a process that felt like something co-created between us was negating of both of our subjective experiences. I wondered if what was occurring might entail a dramatic reenactment of his family life drama. I spoke of my own aversion to bullying situations and wondered if in our ¿ ghts he was enabling me to experience more directly how each family member escalated into a more ferocious form of bullying than the other, attempting to not feel dominated by any other just as we had clearly experienced engaging each other the previous evening. I added that in the context of our engagement it was virtually impossible to uphold a sense of perspectivalism and safety as articulated in Step Two of my"}, {"id": 180, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 421, "loc": "clinician", "int": 0.5, "aff": "empathic concern", "au": "Ringstrom", "pt": "unnamed", "pg": 101, "pdf": "", "ppg": 84, "pcf": 1.0, "txt": "Feeling her anxiety, I empathized with how she might understandably feel threatened by the specter of ¿ nancial insecurity. In this vein, I supported their taking steps that would protect them personally in the case of more extreme ¿ nancial circumstances, including measures that might allocate certain assets in her name only. Nevertheless, she still found heretical for me to in any way agree with what Tony was doing. She was certain that she was the only one who was right."}, {"id": 181, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 428, "loc": "none", "int": 0.0, "aff": "", "au": "Ringstrom", "pt": "none", "pg": 103, "pdf": "", "ppg": 86, "pcf": 1.0, "txt": "STEP TWO 86 Summary In the high stakes gambits of marital interaction, partners can often feel that “To feel sane I must forgo love and to feel loved I must forgo my sanity” (Davies, 2003 ). This often culminates in ¿ ghts over whose version of reality is the correct one. The contemporary psychoanalytic perspectives of both relational and intersubjectivity theories have challenged analysis’ objectivist past, wherein the analyst was the interpreter of the truth about the patient’s unconscious, against which a patient’s protestations might be regarded as resistance. Freud’s own impressive oeuvre is rife with examples in which the father of psychoanalysis insisted on this point with some of his more contentious patients."}, {"id": 182, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 430, "loc": "none", "int": 0.0, "aff": "", "au": "Ringstrom", "pt": "none", "pg": 103, "pdf": "", "ppg": 86, "pcf": 1.0, "txt": "In this manner, the limitations of our own personal horizons can potentially be expanded. Such dialogical truth ¿ nding, however, requires cultivating a quality of relating that is often lost on couples, particularly those in dire straits. It requires the cultivation of a sense of safety in speaking one’s mind and creating a sense of curiosity about one’s own subjective experiences and perspectives as well as one’s partner’s. Such a sense of safety and curiosity becomes especially crucial to the revealing of each one’s personal narrative, which arises from each one’s intimate personal history."}, {"id": 183, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 482, "loc": "patient", "int": 0.5, "aff": "numb dissociation", "au": "Ringstrom", "pt": "Kathy", "pg": 115, "pdf": "", "ppg": 98, "pcf": 1.0, "txt": "At his departure, he told Kathy that she’d have to be the parent, though she was only 11. This threw her into a topsy-turvy relationship of both caretaking and enabling her mother. With no one to look out for her and her brother, she learned to simply become numb to her feelings. One of the means to become enlivened while remaining numb was for Kathy to engage in a vividly imagined pretend world, which frequently had her in some calamitous situation or another, such as drowning in quicksand, and her mother saying what a wonderful girl she was for not complaining."}, {"id": 184, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 539, "loc": "none", "int": 0.0, "aff": "", "au": "Ringstrom", "pt": "none", "pg": 128, "pdf": "", "ppg": 111, "pcf": 1.0, "txt": "STEP THREE 111 relational mind can occur. Of course, dovetailing with Step Two, all such inquiry imposes upon the therapist both the exciting and perhaps daunting task of examining his own invariant organizing principles as they structure his attitudes about both gender and diversity of cultures. “Loyalty gambits” and their corrosive effects on self-actualization, mutual recognition, and the relationship having a mind of its own One of the problems that also constrains long-term relationships is the degree to which partners feel bound by “loyalty gambits” that are predicated on a sense of allegiance that surpasses either partner having a mind of his or her own. Although not exclusive to collectivist cultures, and sometimes in evidence in individualist cultures, the call for loyalty über alles sets in motion implicit structures of enforced enmeshment through a host of systemic ways that loyal members are expected to think, feel, and behave."}, {"id": 185, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 546, "loc": "none", "int": 0.0, "aff": "", "au": "Ringstrom", "pt": "none", "pg": 129, "pdf": "", "ppg": 112, "pcf": 1.0, "txt": "One of the most useful models for determining the vicissitudes of these processes arose from the Georgetown University Family Therapy Institute in the form of Bowenian Family Therapy, based on the progenitor of the model, Murray Bowen. The basic premise of Bowen’s theory is that the capacity of any individual family member to develop a sense of self (as de¿ ned by the ability to choose goals regarding work and relationships, and strive towards accomplishing both) depends on his or her capacity to differentiate emotional reactions from those of other family members, as well as to differentiate emotional from intellectual functioning. Since anxiety undermines differentiation, Bowen’s model focused on both the arousal and mitigation of anxiety within a family system. In particular, he investigated this by doing intensive developmental history-takings of each partner in the couple."}, {"id": 186, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 548, "loc": "none", "int": 0.0, "aff": "", "au": "Ringstrom", "pt": "none", "pg": 130, "pdf": "", "ppg": 113, "pcf": 1.0, "txt": "STEP THREE 113 According to Bowen, highly differentiated adults are less prone to anxiety, or at least are better able to manage it without displacing it or projecting it on others. By contrast, those who are much less differentiated are prone to “fuse” with others, drawing others in closely tied relationships, as well as allowing themselves to be drawn into the emotionally wrought dramas of other family members. Families with poor patterns of differentiation were notably highly “emotionally reactive,” tending to do what feels right instead of pausing to think things through. They operate more as “pseudo-selves,” ones who cannot distinguish what is truly important to their sense of self."}, {"id": 187, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 550, "loc": "none", "int": 0.4, "aff": "grief, amputation", "au": "Ringstrom", "pt": "none", "pg": 130, "pdf": "", "ppg": 113, "pcf": 1.0, "txt": "The impact of immigration on long-term intimate relationships A ¿ nal issue increasingly affecting American marriages is that of immigration. Increasingly, I have had to address what both Gita Zarnegar (personal communication, 2004) and Ipp ( 2010 ) labeled the “amputation effect” of immigration. As an analyst who emigrated from Iran as a teenager in 1979, Zarnegar speaks intimately about her sense of amputation from her motherland. Likewise, having emigrated from South Africa to Canada, Ipp confronted a profound awakening of loss when she began working with a fellow Afrikaaner, “Nell,” the experience of which led to the following: I was now for the ¿ rst time starkly confronted with my amputated self— that part of myself left behind, severed and frozen in a place and space that could not travel with me as I struggled to achieve a new sense of comfort for myself in my adopted country."}, {"id": 188, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 584, "loc": "patient", "int": 0.4, "aff": "anxious emasculation", "au": "Ringstrom", "pt": "Adam", "pg": 139, "pdf": "", "ppg": 122, "pcf": 1.0, "txt": "STEP FOUR 122 that felt emasculating to Adam. Compounding this, Adam longed for Eloise’s encouragement and support for all of the projects he was trying to cultivate. Unfortunately, as money got tighter, both became ever more anxious. In her anxiety, Eloise became prone to both question and criticize Adam’s efforts, eventually leading to her stating that she had lost any faith in his “pie-in-the-sky” ventures."}, {"id": 189, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 609, "loc": "patient", "int": 0.4, "aff": "fearful frozen", "au": "Ringstrom", "pt": "unnamed", "pg": 144, "pdf": "", "ppg": 127, "pcf": 1.0, "txt": "I know I sometimes am anxious about your work, but in truth, far more than anything it’s your temper that scares me away.” Absent this kind of intersubjective dialogue and ensuing mutual recognition, the couple remains frozen in highly incorrect though protective fantasies. Meanwhile, it is through the proverbial “onion peeling” of the couple’s key complaints that, eventually, sequestered anxieties about their sexuality ¿ nally emerge. Meanwhile, couples mired in backgrounds like Adam and Eloise require considerable work in recognizing dissociated aspects of themselves that undermine their sense of agency or that represent deviations from self-actualization. Often these aspects of self-experiencing are unconscious, and in fact represent aspects of self-states that are in disharmony, ones that manifest from self-states remaining incommunicado from one another."}, {"id": 190, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 685, "loc": "none", "int": 0.0, "aff": "", "au": "Ringstrom", "pt": "none", "pg": 161, "pdf": "", "ppg": 144, "pcf": 1.0, "txt": "Gerson notes that Landy ( 1994 ) writes: “Drama is based in paradox, the most essential being that persons acting dramatically live simultaneously within two levels of identity: that recognized as me and recognized as not-me. This dramatic paradox is most clear in theater, the art of performing dramatic texts to an audience, where the actor plays the role of the character who is not himself.” 9 ௘ I am indebted to Lynne Preston ( 2007 ) for her original introduction of “i”mprovisation and “I”mprovisation. 10 ௘ A key arena in which scripted-ness is in evidence is in the routine of a couple’s sexuality, where private fantasy embodies key ways of objectifying one’s partner and, in fact, implicitly inducing him or her to unwittingly participate. In this manner, the “erotic imagination” is truncated, rather than subject to being played with. Perel notes that the degree to which partners can begin to feel safe in expressing their fantasies is the degree to which they can begin to play with them, setting a stage for creative, heretofore unimagined sexual expression."}, {"id": 191, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 704, "loc": "patient", "int": 0.5, "aff": "hollow accommodation", "au": "Ringstrom", "pt": "unnamed", "pg": 166, "pdf": "", "ppg": 149, "pcf": 1.0, "txt": "He is virtually incapable of recognizing others in his life as also being subjects of agency and initiative, constituted by their own needs, longings, and desires. For this patient, others are merely selfobject extensions of his solipsistic worldview; as extensions of himself, they either succeed (or more often fail) in servicing the selfobject functions he requires. By contrast, when the patient is immersed in the self-as-object position, and thereby is stuck in a “state of consciousness of objective self-awareness,” he can only see himself as an object among other objects, unable to experience his own sense of agency or vitality. In this extreme position, he is consumed with accommodating others as his only means of deriving any sense of continuity and worth— however À eeting this may be, as he is only as good as his last good deed."}, {"id": 192, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 751, "loc": "none", "int": 0.2, "aff": "recalled betrayal", "au": "Ringstrom", "pt": "Nicole", "pg": 175, "pdf": "", "ppg": 158, "pcf": 1.0, "txt": "In Nicole’s home, anger was treated as something of a “catharsis”—a form of emotional ventilation that was good for the child to release pent up “poisonous” affect states. By and large, Nicole felt that her mother’s encouragement of their expressing their anger was a very good thing. She also felt, however, betrayed by her mother when she would not protect her children from their father’s rage. This was especially the case, she felt, when her mother had encouraged the children to speak their minds, thereby provoking their father’s wrath, while her mother sat by impassively and did nothing to protect them."}, {"id": 193, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 755, "loc": "dyadic", "int": 0.7, "aff": "infuriated, humiliated", "au": "Ringstrom", "pt": "Nicole", "pg": 176, "pdf": "", "ppg": 159, "pcf": 1.0, "txt": "What suddenly became apparent was that, given his own discomfort with anger, Russell was tapping on Nicole’s brakes, trying to slow her down. This became absolutely infuriating to her. She said that anticipating Russell doing this made her start braking (inhibiting) herself, as she felt the impending humiliation of his taking the moral high ground, a kind of “calmer than thou” position, made him Buddha-like rather than the robust “rough and tumble playmate” she hungered for. Whereas anger frightened, even disoriented, Russell, it energized Nicole, making her feel more alive, vital, and sexy."}, {"id": 194, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 764, "loc": "patient", "int": 0.6, "aff": "ashamed, bereft", "au": "Ringstrom", "pt": "Sam", "pg": 178, "pdf": "", "ppg": 161, "pcf": 1.0, "txt": "They regaled in their success of raising two sons, one in college and the other in the application process. In this ostensible context, Sam’s behavior did not make much sense to either his wife or himself, though he was massively humiliated, ashamed, and bereft with guilt. Clearly, Sam was grappling with some of the prohibitions about sex being exciting and desirous with Fiona, instead lusting for others much younger, in a sense in search for something youthful and vitalizing. Thus, in the course of our initial explorations, it became apparent that Sam was enacting the clichéd “midlife crisis,” or at least that was presumption that both Fiona and he were working from, desperately seeking some explanation for his aberrant behavior no matter how facile it might seem."}, {"id": 195, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 772, "loc": "patient", "int": 0.4, "aff": "overwhelmed mistrust", "au": "Ringstrom", "pt": "Fiona", "pg": 179, "pdf": "", "ppg": 162, "pcf": 1.0, "txt": "So much unintegrated affect from trauma allows it to bulldoze over other selfstates that might lend perspective. In Fiona’s case, her trauma over feeling that her trust was broken obscured the part of her that also recognized that something, for some time, actually had felt missing in their relationship. It further obscured the idea that what was amiss involved her as well. This wasn’t a point that she was keen on investigating, but nevertheless knew that she must."}, {"id": 196, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 808, "loc": "clinician", "int": 0.6, "aff": "empathic confronting", "au": "Ringstrom", "pt": "unnamed", "pg": 186, "pdf": "", "ppg": 169, "pcf": 1.0, "txt": "I continued, “From what I hear, when you were young and beautiful, you felt that Herb didn’t want you, but now that you are an old withered leper of a woman [of course she wasn’t but she felt that way], it’s impossible for you to imagine that Herb would now want you. It seems that something is seriously wrong with this picture. It violates your entire sensibility and, in fact, it so undermines your worldview that you have lost all faith in being able to make sense of anything. This accounts for what I was talking about a few"}, {"id": 197, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 815, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Ringstrom", "pt": "none", "pg": 188, "pdf": "", "ppg": 171, "pcf": 1.0, "txt": "It follows Walt Whitman’s unabashed declaration of the essential and robust contradictory nature of a sense of self that is a complex composite of many personalities. He wrote in his poem, “Songs of Myself ”: Do I contradict myself? Very well then I contradict myself, (I am large, I contain multitudes.) 6 This humble awakening, free of the absolute constraints of right and wrong or the implied shame of being hypocritical, is a precursor to surrender. And surrender is an essential intersubjective capacity, instrumental to holding, containing, accepting, and living with the basic human paradox that sometimes “I must ruthlessly be who I am,” but in order for me to fully realize who I am, “I need you—as a separate subjectivity—to recognize me.” In other words, I cannot be fully realized without you as a realizing other, nor can you be fully realized without my recognition of you."}, {"id": 198, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 821, "loc": "none", "int": 0.3, "aff": "coerced rebellion", "au": "Ringstrom", "pt": "Mary", "pg": 189, "pdf": "", "ppg": 172, "pcf": 1.0, "txt": "Feeling coerced into submitting to John, and feeling constrained by his concerns much in the way that she did with her ¿ rst husband, Mary rebelliously asserted that John could go to the airport without her and that she would meet him there. Her particular gambit smacked of a kind of positional negotiation, a kind of brinkmanship that compelled John to cave in submissively, or go angrily to the airport by himself, all the while imagining he would be À ying home either with an empty seat next to him or one ¿ lled with a “victorious though resentful” Mary, who, just as she prophesied, had managed to make it to the store, back to the hotel, and then on time to the airport. In the throes of their ¿ ght, John suddenly realized that he did not have any real stake in getting to the airport besides assuaging his wounded ego—a product of his initially defensive and argumentative reaction to Mary’s proposal. In truth, it was she that would be far more inconvenienced by their missed plane, since it was she who was more in need of getting home to her young children."}, {"id": 199, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 904, "loc": "dyadic", "int": 0.6, "aff": "objectified, defensive", "au": "Ringstrom", "pt": "unnamed", "pg": 207, "pdf": "", "ppg": 190, "pcf": 1.0, "txt": "I feel strong again, like a man, and that’s making me feel worthier and hornier. So I have been wanting my wife. C: The problem is, it’s clear that you want sex, but it doesn’t feel like it’s about me, like I could be anybody, “a piece of meat.” K: That’s ridiculous … you’re the only woman I ever wanted or want to be with. You know that; that I would never cheat on you!"}, {"id": 200, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 910, "loc": "dyadic", "int": 0.5, "aff": "sexy then objectified", "au": "Ringstrom", "pt": "Courtney", "pg": 207, "pdf": "", "ppg": 190, "pcf": 1.0, "txt": "So in the beginning, you Courtney are loving feeling sexy and powerful and turning Ken on, getting all dolled up in lingerie and making him crazy with desire about you? C: Uh huh, until I started feeling like an object, you know, like a manikin. Dr. X: And you, Ken, were in fact feeling crazy nuts with desire for Courtney, just as long as she desired you?"}, {"id": 201, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 916, "loc": "dyadic", "int": 0.4, "aff": "shamed exposure", "au": "Ringstrom", "pt": "Ken", "pg": 208, "pdf": "", "ppg": 191, "pcf": 1.0, "txt": "In a sense, Ken, you have had to overcome a lot to feel “good enough” about yourself to risk “coming on” to Courtney. Alcohol has been known to smooth the way for many a shamed ego. Though, Courtney, it’s also not so hard to understand that you imagine yourself still only a sex “object” to Ken. C: Well, it’s not like I am feeling all that great about my body!"}, {"id": 202, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 936, "loc": "patient", "int": 0.5, "aff": "confused, thrown", "au": "Ringstrom", "pt": "Russell", "pg": 212, "pdf": "", "ppg": 195, "pcf": 1.0, "txt": "In a passing conversation over the weekend, Nicole quite innocently spoke of an odd speech pattern Russell’s father had, the nature of which was a source of sensitivity to his father. Hearing Nicole say this made him feel quite defensive of his father, which totally came as a surprise to her, since usually Russell spoke quite disparagingly about his dad. She literally never imagined he would ever take umbrage with her comment. Consequently, she was both powerfully confused and terribly thrown."}, {"id": 203, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 947, "loc": "patient", "int": 0.4, "aff": "anxious adrift", "au": "Ringstrom", "pt": "Russell", "pg": 214, "pdf": "", "ppg": 197, "pcf": 1.0, "txt": "In the diagnostic of differences in each of their families, Russell’s mother “stuck it out” with his father’s episodic ¿ ts of rage, while Nicole’s mother divorced her father after decades of a contentious marriage, having endured only so long as the ¿ nal launching of the youngest child into adulthood. So, as Russell and Nicole thought more and more about moving back East, much closer to their family homes, the striking differences between their family cultures were making them both very anxious. They felt mightily adrift as to how they would collaborate and negotiate their differences; indeed, they seemed almost oblivious to the idea that collaboration and negotiation was even a possibility. What seemed acutely lost on them was that they could (and would absolutely need to) come to terms with creating their own family culture, one synergistically inÀ uenced by both of their families of origin, while also structured and presented to the world on their own terms."}, {"id": 204, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 969, "loc": "clinician", "int": 0.5, "aff": "attuned discernment", "au": "Ringstrom", "pt": "Russell", "pg": 219, "pdf": "", "ppg": 202, "pcf": 1.0, "txt": "STEP SIX 202 Clearly, Russell felt that what he was offering to Nicole was completely fair. He was indicating that as far as he was concerned, she was under no obligation to be with his family. Paradoxically, this claim appeared to back ¿ re terribly. Although I could hear that Russell felt that he was liberating Nicole from a “toxic obligation” for being around his family, I sensed she heard this very differently."}, {"id": 205, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 975, "loc": "none", "int": 0.1, "aff": "theoretical", "au": "Ringstrom", "pt": "Russell", "pg": 220, "pdf": "", "ppg": 203, "pcf": 1.0, "txt": "It was in her sense of imbalance in their respective valuing that her protests emerged. Once he could accept this, he could better look at his own proneness to judge her for her jealousy, instead of responding to it as emblematic of her desire. By creating a mental play space for the partners to imagine the rami ¿ cations of trying on each other’s positions, the therapist deftly maneuvers them out their respective collapse into psychic equivalence and into more of an imaginative, reÀ ective mode of mentalization—that is, she moves them out of the former mode of “that which I think (and which all my ‘objective’ expert friends agree with) is the correct way to think about something” into the latter mode of “imagine what you might feel if you were to play with your partner’s position.” The therapist’s encouragement of the partners starting to play with one another’s positions must include assuring them that they do not ultimately have to relinquish their own. It creates, however, a transitional open space for other ways of thinking and feeling."}, {"id": 206, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 986, "loc": "patient", "int": 0.4, "aff": "relieved connection", "au": "Ringstrom", "pt": "Sharrie", "pg": 222, "pdf": "", "ppg": 205, "pcf": 1.0, "txt": "Because they were now discussing daily what each was experiencing, Larry no longer felt left out and Sharrie was less drawn into her dissociation. Also, because they could remain relatively independent of the centripetal tug of her family, they became interesting purveyors of alternative activities and interests that drew the family out of its redundant “safe” grooves of playing such relationally trivializing games as Trivial Pursuit. Most importantly, bearing witness to the in vivo reenactment of “model scenes” (Lichtenberg, Lachmann, & Fosshage, 1992 , 1996 ) from Sharrie’s development, Larry was experiencing something that enabled him to help formulate some of what Sharrie could not on her own. In essence, he could give voice to some of the most numbing aspects of her family: their need for constant mirroring and af ¿ rmation with little capacity to return this in any way that felt comparably nurturing to either of them."}, {"id": 207, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 987, "loc": "patient", "int": 0.4, "aff": "trapped weariness", "au": "Ringstrom", "pt": "Sharrie", "pg": 222, "pdf": "", "ppg": 205, "pcf": 1.0, "txt": "Sharrie could feel this, but had not yet been able to articulate it as clearly as Larry was able to. This allowed him to nudge her therapeutically out of her position of feeling doomed in the repetition of her role of making all her family members feel good about themselves with little in return. Samantha and Randall In my work with Samantha and Randall, I facilitated Samantha’s capacity to become a memorializer of Randall’s loss experiences, since although his family was terribly"}, {"id": 208, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 989, "loc": "patient", "int": 0.5, "aff": "grieving recognition", "au": "Ringstrom", "pt": "Samantha", "pg": 223, "pdf": "", "ppg": 206, "pcf": 1.0, "txt": "In our earlier work, Samantha was seething with anger over constantly being told by Randall that she was “too delicate.” By helping Randall recognize that his shaming rebukes of Sam were reenactments from his family’s response to loss, he began to see that he, along with his family, had lived in great disavowal about the early death of his mother, his father’s failed subsequent marriages with a host of inadequate stepmothers, and the trauma of being perpetually uprooted from each familiar living experience to which he had ever become accustomed. Finally recognizing Samantha’s reactions as a compassionate memorializer of things lost but disavowed, he stopped feeling that she was hysterical, even though his family still maintained this claim. In fact, he now began experiencing her as his one true soulmate, a concept he realized that he had long ago sensed he wished for, but had given up after his closest con ¿ dante in childhood, his mother, died. Because they now could grieve his losses together, their own relationship was not only deepened and forti ¿ ed, but their con À icts with his family completely attenuated, since against this dynamic duo, the impact of the dissociatively splitting and projecting features of his family was dramatically mitigated."}, {"id": 209, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 1021, "loc": "none", "int": 0.05, "aff": "biographical", "au": "Ringstrom", "pt": "Carmen", "pg": 231, "pdf": "", "ppg": 214, "pcf": 1.0, "txt": "214 8 MICHAEL AND CARMEN An illustration of the Six Steps Step One In our initial session, I learned that Michael was 48 years old and Carmen had just turned 41. They had both been married before. Carmen had a son and daughter who were pre-teens, and Michael had an adolescent son recently enrolled in college in another state. They met via an internet dating service, and their “cyberconnection” quickly led to a coffee date from which they both left feeling “swept off of their feet.” Their romance was fast and furious, leading to marriage six months later, two years before they came to me."}, {"id": 210, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 1036, "loc": "patient", "int": 0.5, "aff": "inadequate anxious", "au": "Ringstrom", "pt": "Michael", "pg": 233, "pdf": "", "ppg": 216, "pcf": 1.0, "txt": "According to Michael, their relationship had been a wonderful romance resulting in their very quick marriage. Of late, he was worried that their impulsive connection may have placed their romantic bond in jeopardy, as he felt that no matter what he did, it often was either not good enough or, if it was recognized as good enough, it did not have any staying power. In short, he began to feel that he was only as good as his last good deed. Correspondingly, anytime he disappointed Carmen, it seemed to be having a more enduring effect on her negative regard of him."}, {"id": 211, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 1123, "loc": "dyadic", "int": 0.75, "aff": "pulled judgmental", "au": "Ringstrom", "pt": "Carmen", "pg": 248, "pdf": "", "ppg": 231, "pcf": 1.0, "txt": "Not one fucking time!” Carmen cried out, “That’s not true, I tell you that you were better all the time, you just never believed me!” (Later on, of course, it came out that she hadn’t spoken this to him, in part, she said reÀ ectively, because she enjoyed his jealousy, which seemed to be a turn on for both of them.) Each was rapidly drawing me into a judgmental position vis-à-vis the other. On the one hand, I could certainly understand Carmen’s sense of betrayal regarding their two covenants. On the other, I also could sense Michael’s having unconsciously painted himself into a corner of pathological accommodation to Carmen’s precondition that they try to have a baby if they were to be married. It struck me that the collaboration and negotiation that needed to have been dealt with before their marriage was ¿ nally coming out."}, {"id": 212, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 1140, "loc": "patient", "int": 0.5, "aff": "fearful constrained", "au": "Ringstrom", "pt": "Carmen", "pg": 251, "pdf": "", "ppg": 234, "pcf": 1.0, "txt": "She had been reluctant to tell Michael, especially in the context of their current acrimony, since she was afraid he’d use the information to discourage proceeding with trying to become pregnant. Nevertheless, it was apparent to Carmen that if she became pregnant and had a baby she would have to foreclose on the judgeship. This idea symbolically felt like a kind of miscarriage or, as I would submit, a submissive truncation of a powerful sense of self-actualization. Bearing in mind her collectivist cultural tendency to accommodate the desires of members of her tribe, I asked Carmen if she could tell me who else had something at stake in whichever decision she made."}, {"id": 213, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 1142, "loc": "patient", "int": 0.55, "aff": "startled recognition", "au": "Ringstrom", "pt": "Carmen", "pg": 251, "pdf": "", "ppg": 234, "pcf": 1.0, "txt": "It is a woman’s duty to ful¿ ll God’s mission.’” Surprised at hearing herself say this, she commented that she typically would allow her mother’s biblical admonitions to go in one ear and out the other. Obviously, she realized she was deluding herself about the impact of her mother on her thinking and feeling. She quickly associated to her mother’s inability to have any more children after Luisa was born, when she had to have a hysterectomy. Her mother had been depressed ever since then, and had spent countless hours going to Mass and praying for her children to have many, many babies."}, {"id": 214, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 1147, "loc": "clinician", "int": 0.6, "aff": "protective restraint", "au": "Ringstrom", "pt": "Carmen", "pg": 252, "pdf": "", "ppg": 235, "pcf": 1.0, "txt": "It started to appear that surrendering her adamancy of becoming pregnant was a real possibility for Carmen. I allowed this to settle in without commenting, as I wanted Carmen to take in what she was saying without anyone adding any weight to her deliberations. I felt strongly that, however this was to come out for her, she needed very much to have her decision feel right to her. It was apparent that, notwithstanding their considerable therapeutic experience, Carmen and Michael could readily ¿ nd themselves becoming someone else’s object while losing their own subjective sense of self."}, {"id": 215, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 1223, "loc": "none", "int": 0.05, "aff": "theoretical", "au": "Ringstrom", "pt": "Carmen", "pg": 266, "pdf": "", "ppg": 249, "pcf": 1.0, "txt": "It unveils how that state was naïvely composed of hope without the necessary recognition of dread: coming to terms with the dread to repeat something of one’s past as well as the dread not to. All of these consequences are compounded to the degree other family members (and friends) are involved. Finally, the problems of an affair are far more ampli¿ ed to the extent that the children are involved. There is also considerable evidence that culture weighs in heavily in determining partners’ reactions to affairs."}, {"id": 216, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 1225, "loc": "none", "int": 0.2, "aff": "cautionary", "au": "Ringstrom", "pt": "Carmen", "pg": 267, "pdf": "", "ppg": 250, "pcf": 1.0, "txt": "Still, it is probably in the arena of secrecy that affairs in À ict their greatest damage. Until a suspected affair is ¿ nally disclosed, the non-participating partner can feel gaslighted. This can readily lend to their seemingly hyperbolic and overthe-top behavior, when in fact they feel tormented by a sense of being lied to— which ultimately turns out to have been in fact happening. It is in this place that the couples therapist must be most careful in not getting entangled in a secret of an ongoing affair."}, {"id": 217, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 1268, "loc": "none", "int": 0.1, "aff": "theoretical", "au": "Ringstrom", "pt": "none", "pg": 275, "pdf": "", "ppg": 258, "pcf": 1.0, "txt": "It is easier for them to know what is done is not readily negotiable, if negotiable at all, while others are anxiously trying to pressure them to do otherwise. Undifferentiated family members engage in a host of symptoms to bind anxiety. A principal one is to engage in “triangulation,” since “triangular relationships” are the “smallest stable relationship systems” in any family. Whenever anxiety arises between two partners, their tendency is to involve a third family member or an issue, thereby distracting themselves from the anxiety aroused by their conÀ icts over differentiating."}, {"id": 218, "tr": "object_relations", "doc": "Winnicott. (1947) Hate in the countertransfere", "pos": 16, "loc": "clinician", "int": 0.7, "aff": "dread, vertigo", "au": "Winnicott", "pt": "unnamed", "pg": 5, "pdf": "", "ppg": null, "pcf": 0.5, "txt": "unpleasant, have each one of them marked my arrival at a new stage in emotional development.) On this particular occasion I was aware of the meaning of the dream as I woke or even before I woke. The dream had two phases. In the first I was in the ‘gods’ in a theatre and looking down on the people a long way below in the stalls. I felt severe anxiety as if I might lose a limb."}, {"id": 219, "tr": "object_relations", "doc": "Winnicott. (1947) Hate in the countertransfere", "pos": 20, "loc": "dyadic", "int": 0.75, "aff": "irritated, disembodied", "au": "Winnicott", "pt": "unnamed", "pg": 5, "pdf": "", "ppg": null, "pcf": 0.5, "txt": "This patient was requiring of me that I should have no relation to her body at all, not even an imaginative one; there was no body that she recognized as hers and if she existed at all she could only feel herself to be a mind. Any reference to her body produced paranoid anxieties, because to claim that she had a body was to persecute her . What she needed of me was that I should have only a mind speaking to her mind. At the culmination of my difficulties on the evening before the dream I had become irritated and had said that what she was needing of me was little better than hair-splitting."}, {"id": 220, "tr": "object_relations", "doc": "Winnicott. (1947) Hate in the countertransfere", "pos": 21, "loc": "clinician", "int": 0.8, "aff": "psychotic anxiety", "au": "Winnicott", "pt": "unnamed", "pg": 5, "pdf": "", "ppg": null, "pcf": 0.5, "txt": "This had had a disastrous effect and it took many weeks for the analysis to recover from my lapse. The essential thing, however , was that I should understand my own anxiety and this was represented in the dream by the absence of the right side of my body when I tried to get into relation to the play that the people in the stalls were watching. This right side of my body was the side related to this particular patient and was therefore affected by her need to deny absolutely even an imaginative relationship of our bodies. This denial was producing in me this psychotic type of anxiety, much less tolerable than ordinary castration Copyrighted Material."}, {"id": 221, "tr": "object_relations", "doc": "Winnicott. (1947) Hate in the countertransfere", "pos": 22, "loc": "clinician", "int": 0.7, "aff": "reactive anxiety", "au": "Winnicott", "pt": "unnamed", "pg": 6, "pdf": "", "ppg": null, "pcf": 0.5, "txt": "anxiety. Whatever other interpretations might be made in respect of this dream the result of my having dreamed it and remembered it was that I was able to take up this analysis again and even to heal the harm done to it by my irritability which had its origin in a reactive anxiety of a quality that was appropriate to my contact with a patient with no body. The analyst must be prepared to bear strain without expecting the patient to know anything about what he is doing, perhaps over a long period of time. To do this he must be easily aware of his own fear and hate."}, {"id": 222, "tr": "object_relations", "doc": "Chapter XXV - The Antisocial Tendency in Throu", "pos": 9, "loc": "clinician", "int": 0.7, "aff": "heartbroken guilt", "au": "Winnicott", "pt": "unnamed", "pg": 3, "pdf": "", "ppg": null, "pcf": 0.5, "txt": "thought we didn't love him because he was so naughty sometimes, and he said right out that he didn't think we did, much. Poor little scrap! I felt so awful, I can't tell you. So I told him never, never to doubt it again and if he ever did feel doubtful to remind me to tell him again."}, {"id": 223, "tr": "object_relations", "doc": "Chapter XXV - The Antisocial Tendency in Throu", "pos": 34, "loc": "none", "int": 0.1, "aff": "theoretical", "au": "Winnicott", "pt": "none", "pg": 8, "pdf": "", "ppg": null, "pcf": 0.5, "txt": "It should be said, however , that whatever the mother does, this does not annul the fact that the mother first failed in her adaptation to her infant's ego needs. The mother is usually able to meet the compulsive claims of the infant, and so to do a successful therapy of the deprived complex which is near its point of origin. She gets near to a cure because she enables the infant's hate to be expressed while she, the therapist, is in fact the depriving mother . It will be noted that whereas the infant is under no obligation to the mother in respect of her meeting the primitive love impulse, there is some feeling of obligation as the result of the mother's therapy, that is to say her willingness to meet the claims arising out of frustration, claims that begin to have a nuisance value."}, {"id": 224, "tr": "object_relations", "doc": "Winnicott (1969).pdf", "pos": 36, "loc": "none", "int": 0.2, "aff": "abstract", "au": "Winnicott", "pt": "none", "pg": 6, "pdf": "", "ppg": null, "pcf": 0.0, "txt": "There is no anger in the destruction of the object to which I am referring, though there could be said to be joy at the object’s survival. From this moment, or arising out of this phase, the object is in fantasy always being destroyed. This quality of ‘always being destroyed’ makes the reality of the surviving object felt as such, strengthens the feeling tone, and contributes to object-constancy. The object can now be used."}, {"id": 225, "tr": "object_relations", "doc": "RECOMMEND Dadlani 2020. Queer Use of Psychoana", "pos": 5, "loc": "clinician", "int": 0.8, "aff": "yearning, isolated", "au": "Dadlani", "pt": "unnamed", "pg": 2, "pdf": "", "ppg": 119, "pcf": 1.0, "txt": "Who will understand these pieces I offer? Can you hear me through this thick, dampened fog, you who walks this path alongside me but who I could not feel on my outstretched fingertips? I know you are there, as steadfast and passionate and confused as I was. I am speaking to you."}, {"id": 226, "tr": "object_relations", "doc": "RECOMMEND Dadlani 2020. Queer Use of Psychoana", "pos": 30, "loc": "none", "int": 0.1, "aff": "theoretical", "au": "Dadlani", "pt": "none", "pg": 5, "pdf": "", "ppg": 122, "pcf": 1.0, "txt": "Ideally, the infant learns to discern between their own projected material and the messages that originate from the important other as they shift into the depressive position. As we examine the facts of relational power in colonialism, we see that persecution and loss of subjectivity are not always in the realm of fantasy; the colonized is an active target of persecution. How does this impact the developing sense of self in relationship to important, powerful others? What happens when the sadism one experiences is not a projected persecutory threat but is real, when the colonizer ’s sense of control of oneself is established by exercising power over others and 122 M."}, {"id": 227, "tr": "object_relations", "doc": "RECOMMEND Dadlani 2020. Queer Use of Psychoana", "pos": 35, "loc": "none", "int": 0.2, "aff": "theoretical", "au": "Dadlani", "pt": "none", "pg": 6, "pdf": "", "ppg": 123, "pcf": 1.0, "txt": "When the colonizer, in their own paranoid – schizoid position, projects their fear, greed, and envy outward, they engage with the colonized as though something is being taken away from them, leaving the colonized positioned to attempt perpetually to undo this fear. In this place, the colonized has little room for their own thinking, feeling, projecting, and introjecting. As such, the colonizer benefits from the colonized having an increasing sense of nonbelonging and confusion, since the colonized remains vulnerable enough to serve as an extension of the colonizer ’s mind and to contain the colonizer ’s split-off affect. The other apparent path for the colonized is to integrate the projections of good (nurturing) and the bad (genocidal) that move through the colonizer, to label what the colonizer offers as useful, and to accept that the perception of harm is one ’s own projection rather than the violent task of the colonizer."}, {"id": 228, "tr": "object_relations", "doc": "Winnicott's squiggle game- Its diagnostic and ", "pos": 9, "loc": "none", "int": 0.1, "aff": "instructional", "au": "Winnicott", "pt": "none", "pg": 2, "pdf": "", "ppg": 178, "pcf": 1.0, "txt": "What will happen’? etc. The child then has a chance to draw a squiggle and I make a picture and tell something about what I have drawn. The structure of this exchange reflects a basic issue which relates to all psychotherapeutic interviews: the establishment of contact and rapport. The squiggle game is a game without rules, save for the two primary ones of the psychotherapeutic exchange: (a) the permission for spontaneous and active participation on the part of the child and (b) the child’s statement in his picture leads to the therapist’s actively joining the child through the image the therapist creates in his turn."}, {"id": 229, "tr": "object_relations", "doc": "Winnicott's squiggle game- Its diagnostic and ", "pos": 14, "loc": "none", "int": 0.1, "aff": "analytic", "au": "Winnicott", "pt": "none", "pg": 2, "pdf": "", "ppg": 178, "pcf": 1.0, "txt": "Returning to the first example of the marital quarrel. one would be struck by the differences in a series of children who drew two angry people vs. a house falling in vs. the whole world being on tire. In addition, the projective element in the child’s creation represents his concerns while at the same time presenting us with an idea of how the child is organizing or dealing with his internal anxieties. as opposed to how they al-e disorganizing him. As with the Rorschach. one can with Squiggles assess many different elements of the child’s cognitive style and the depth of some of the child’s anxieties. One can see whether or not the child is constricted or blocked; whether whole pictures can be freely expanded into little stories with access to inventive elements about where they came from or where they are going; whether a child gets stuck in the little details of a squiggle or perseverates on some particular element or representation."}, {"id": 230, "tr": "object_relations", "doc": "Winnicott's squiggle game- Its diagnostic and ", "pos": 21, "loc": "patient", "int": 0.4, "aff": "confused", "au": "Winnicott", "pt": "Sally", "pg": 3, "pdf": "", "ppg": 179, "pcf": 1.0, "txt": "I. 179 going? She replied that someone was going to a store to get some things. She couln’t say what and felt confused about how they would get there. A bus’?"}, {"id": 231, "tr": "object_relations", "doc": "Winnicott's squiggle game- Its diagnostic and ", "pos": 28, "loc": "none", "int": 0.2, "aff": "reassuring", "au": "Winnicott", "pt": "none", "pg": 4, "pdf": "", "ppg": 180, "pcf": 1.0, "txt": "When children are unable to play with toys or join in other games, the squiggle game is often a comfortable and pleasant way to establish contact and begin to explore the child’s concern from the safe distance of a pictorial metaphor. Particularly in those situations where the initial statements of the parents to the child are anxiety provoking -- whether they take place in the initial phase of an interview or in the moments during the trip to “the doctor” - the squiggle game is quite useful. Children find some distance from their pictures, allowing them to reveal “scary” things (see Fig. 3). Additionally, the pictures created give them a jumping off point for associations to other aspects of their life in which they may feel worried or fearful."}, {"id": 232, "tr": "object_relations", "doc": "Winnicott's squiggle game- Its diagnostic and ", "pos": 35, "loc": "dyadic", "int": 0.5, "aff": "cautious exchange", "au": "Winnicott", "pt": "Sally", "pg": 5, "pdf": "", "ppg": 181, "pcf": 1.0, "txt": "With some prodding, she gave me a squiggle. the same figure eight she had drawn before. (Stereotyping and lack of fl-eedom in movement in creating a squiggle are also cues about the level of anxiety and the constricting defenses.) This time. I placed a sturdy hut on it and described it as a FIG. 4 FIG. 5. safe place to be when there were angry feelings on the island. With the next squiggle, she rapidly, freely. and happily drew a complex drawing (Fig. 5). But it was strangely oriented in space, and there was no associated story."}, {"id": 233, "tr": "object_relations", "doc": "Winnicott's squiggle game- Its diagnostic and ", "pos": 57, "loc": "patient", "int": 0.5, "aff": "trapped hopelessness", "au": "Winnicott", "pt": "Cheryl", "pg": 8, "pdf": "", "ppg": 184, "pcf": 1.0, "txt": "Her next picture was of a rabbit with gigantic ear-s (drawn upside down) in which lizards were trapped. When asked if there was something to do to help, she drew a picture of a carrot. but said it wouldn’t do any good. Through exchanges of this type. one can continue to assess one’s own responses. or the severity of the neurosis of the child, or whether one’s remarks are clarifying, or. in a therapeutic sense, helpful. As the squiggle game serves to help us accomplish the task of focusing on what we understand of a child’s difficulties as well as our own response. we continue to challenge ourselves in our diagnostic and therapeutic work."}, {"id": 234, "tr": "object_relations", "doc": "Winnicott's squiggle game- Its diagnostic and ", "pos": 61, "loc": "dyadic", "int": 0.6, "aff": "heated recognition", "au": "Winnicott", "pt": "Cheryl", "pg": 9, "pdf": "", "ppg": 185, "pcf": 1.0, "txt": "WINNICOTT’S SQUIGGLL GAME: ITS DlAGNOSTlC AND THERAPIZUTIC USEI:ULNESS 185 man with tire coming out of his mouth (from hot peppers) and a little beard. the color of mine. Since I imagined that was me. I felt he was referring to the hot subject we had begun to discuss. I turned his squiggle into a pathway leading to a building where people talk about things that are difficult."}, {"id": 235, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 36, "loc": "clinician", "int": 0.4, "aff": "frustrated reflection", "au": "Ringstrom", "pt": "none", "pg": 18, "pdf": "", "ppg": 1, "pcf": 1.0, "txt": "1 INTRODUCTION Several years ago, I was listening to an economist on National Public Radio anguishing over the extraordinary complexity of his ¿ eld. With gathering frustration, he confessed, “We know what works in practice! The question is, will it work in theory?!” I suddenly found myself in the same shoes as the commentator as I reÀ ected upon over 30 years of theorizing about my clinical practice in couples and family therapy, as well as psychoanalysis with individual patients. As I pondered writing this book, I recognized that I seemed to be onto something in my work with couples, though I hadn’t been able to make it “work” in theory."}, {"id": 236, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 46, "loc": "none", "int": 0.1, "aff": "theoretical", "au": "Ringstrom", "pt": "none", "pg": 20, "pdf": "", "ppg": 3, "pcf": 1.0, "txt": "Step Two : The therapist’s assertion that none of the three participants in the therapy has a more correct (i.e., more “objective”) view of reality than any of the others, while supporting each one’s needs to be seen as the arbiter of what is true (i.e., “fits”) within her/his experience in the moment. Step Three : The exploration of how each partner’s complaint arises from a multivariant developmental history that contextualizes what each partner brings to their relationship. Step Four : Awakening of the “slumbering giant”: when the “dread to repeat” repetitive transference states shifts into the “dread not to.” This step examines how partners reenact their conflictual pasts in the service of “trying to remain the same while changing” (Bromberg, 1998 ). It further explores phenomena regarding dissociated self-states, finally emerging only after other self-states become actualized by the progress of the treatment."}, {"id": 237, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 47, "loc": "none", "int": 0.1, "aff": "theoretical", "au": "Ringstrom", "pt": "none", "pg": 20, "pdf": "", "ppg": 3, "pcf": 1.0, "txt": "For these dissociated states to emerge, they must be enacted. Step Five : The en
