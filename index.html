e there.’ This awareness easily evaporated between us, and he said, ‘Sure, th at makes sense.’ But then I began to focus upon the existence of both attitudes more fully, for I was beginning to see that he was exhibiting two opposite states which were actually incompatible."}, {"id": 324, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 614, "loc": "dyadic", "int": 0.6, "aff": "deadness, alienation", "au": "Schwartz-Salant", "pt": "none", "pg": 118, "pdf": "", "ppg": 107, "pcf": 0.97, "txt": "When one knows the opposites in their split form, one knows Dionysos in his most death-like nature, as Camille Paglia says, ‘in the slow, ooze and muck of the chthonian’ (1990, 6). When th e analyst encounters h im in the interactive field with the analysand, hear t-connection and spontaneity are non-existent. Both feel a sense of alienation, deadness, emptiness, and if they look further, of an everpresent sense of strangeness. One may approach this development from an Apollonian vantage point and speak of a ‘derealized-dep ersonalized sequence.’ Although this Apollonian talk is clear, one is left with an un comfortable feeling: the analysand is strange to the analyst and the analyst is strange to himself or herself."}, {"id": 325, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 638, "loc": "clinician", "int": 0.85, "aff": "taboo, inhibited", "au": "Schwartz-Salant", "pt": "unnamed", "pg": 122, "pdf": "", "ppg": 111, "pcf": 0.97, "txt": "While sexual fantasy had never been a part of our sessions together, in one particular session, I had the unusual experience of feeling an inner injunction to allow no sexual fantasy. The material she was talking about on that day had to do with beginning to date men, but she had made no allusion to either sex or fantasy. As I looked at her, I found myself averting my eyes and stifling my imagination, as if a taboo were present. It was as though an Eleventh Commandment had been proclaimed from on high and now hung in the consultation room: ‘Thou Shalt Not Imagine.’ I suddenly recognized that this taboo had always existed in my work with her and that it was so total that, in the years of working wi th her, I had never even imagined having a sexual thought in her direction even though she was a very attractive woman."}, {"id": 326, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 639, "loc": "clinician", "int": 0.75, "aff": "undesirable, arid", "au": "Schwartz-Salant", "pt": "unnamed", "pg": 122, "pdf": "", "ppg": 111, "pcf": 0.97, "txt": "We had previously discussed the fact that our work to gether seemed limited by a lack of intimacy that felt restrictive and infertile. Now, I realized that the absence of the erotic in our work could possibly have something to do with the arid feeling we experienced in her analysis. Several facets emerged as we explored this quality of our interaction. Sitting and experiencing the injunction to have absolutely no sexual interest in her, I became aware that I felt totally undesirable."}, {"id": 327, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 673, "loc": "clinician", "int": 0.7, "aff": "confused, upset", "au": "Schwartz-Salant", "pt": "unnamed", "pg": 127, "pdf": "", "ppg": 116, "pcf": 0.97, "txt": "Why am I so compulsive? But, I feel it’s the right thing to do. Yet she makes perfect sense an d she explains it to me with a lot of psychological understanding. So I feel I should relax, be less uptight, yet I also feel upset with this and can’t think clear ly."}, {"id": 328, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 818, "loc": "dyadic", "int": 0.8, "aff": "chaotic bewilderment", "au": "Schwartz-Salant", "pt": "unnamed", "pg": 157, "pdf": "", "ppg": 146, "pcf": 0.97, "txt": "Rather, as in this instance, they will be unique to the individual encounter. The analysand and I felt an initial chaos, a st ate of bewilderment which, in addition to ‘The Axiom of Ostanes,’ could be reflected upon through ‘The Axiom of Maria.’ I could feel no sense of order but only conflicting mental and bodily states without any meaning. Pain, absence of thinking, and a desire to fl ee dominated. Terribly co nflicting states did not yield any sense of order, as is typical of alchemical definitions of chaos."}, {"id": 329, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 864, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Schwartz-Salant", "pt": "none", "pg": 166, "pdf": "", "ppg": 155, "pcf": 0.97, "txt": "Thus, the psychotic anxieties represented by the double-headed serpent, or the same anxieties of the madness of the Dionysian realm, need not be considered within a developmental paradigm as, for instance, a de fense against identity lo ss in fusion states. These anxieties certainly can serve this function of avoiding deeper levels of pain, but the Rosarium recognizes this level of anxiety as a necessary concomitant to the experience of illumination. When a person is experiencing psychotic levels, such as the intense swings between opposites in the Binarius, he or she can be calmed and the state can become creative if another person relating to them cr eates a sense of contai nment. Such positive support can only occur if that person knows the level of psychotic anxiety as a result o f illumination and is able to empathize with the one suffering the intense anxiety state, but such empathy must be accompanied by reme mbering the illumination that preceded this present experience of loss."}, {"id": 330, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 885, "loc": "none", "int": 0.3, "aff": "mystery, closeness", "au": "Schwartz-Salant", "pt": "none", "pg": 170, "pdf": "", "ppg": 159, "pcf": 0.97, "txt": "From a dry encounter, their ‘earth,’ as the alchemis ts would say, has become ‘foli ated,’ enlivened so that thei r bodies now attract; and they feel they exist within a mystery that was always there, yet hidden in its very simplicity. By entering a field with its defining and fluid dyadic forms, both people in a sense no t only submit to a higher authority but also must trust the other not to misuse his or he r power. If they succeed, they will in the proce ss usually feel closer together than eve r before. In effect, they will share a mystery; in a small yet significant sense, they will have been initiated together into the mystery of their relationship."}, {"id": 331, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 933, "loc": "clinician", "int": 0.85, "aff": "bewildered anger", "au": "Schwartz-Salant", "pt": "unnamed", "pg": 188, "pdf": "", "ppg": 177, "pcf": 0.97, "txt": "As this theme of incest gradually became more central to ou r work, I found myself internally resisting the possibility that it could really have happened to her. She then began a session with a question: ‘What do I do with my feelings when I feel no connection with you?’ It was as if she had said, on the one hand, that she had no feelings at all and then that she had said, on the other hand, that she had feelings. The confusion and emotions that accompanied the posing of this question were so charged that I tried to avoid the effects and contradictory nature of her communication; but I only felt challenged and angry. I was bewildered by the strength of my reaction, but I mostly side-stepped it and focused upon a sense of being irritated with her."}, {"id": 332, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 956, "loc": "clinician", "int": 0.7, "aff": "uncertain searching", "au": "Schwartz-Salant", "pt": "unnamed", "pg": 192, "pdf": "", "ppg": 181, "pcf": 0.97, "txt": "CONTAINING PSYCHOTIC PROCESS THROUGH THE FIELD QUALITY OF THE CONIUNCTIO After these attempts to sort out our proce ss together, she asked the inevitable question: ‘Does this mean that I have been putting these reactions into you?’ How easy it would have been to say, ‘yes!’ Cl early, projective identification ha d occurred, but I also knew that, in becoming aware of the psychotic countertransference, I was opening up to a much larger realm that seemed to have a goal or purpose; a classical pr ojective identification approach would kill that aw areness. The experience of the larger domain of the interactive field, which incl uded my own incest fantasies, created a sense of meaning. This area was no doubt in need of exploration, yet it soon began to feel too airy and nonsubstantial, and I turned b ack to a projective identificat ion view, psychological parts which I put into her and she into me. In turn, this projective identification approach felt too small, as it foreclosed a sense of m eaning."}, {"id": 333, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 962, "loc": "clinician", "int": 0.8, "aff": "persecuted anxiety", "au": "Schwartz-Salant", "pt": "unnamed", "pg": 193, "pdf": "", "ppg": 182, "pcf": 0.97, "txt": "I was perplexed and at times felt persecuted by her insistence that we still had unfinished business, although by now I had learned to respect her resistance to going on until we had cleared up what had occurred in that session to her satisfaction. Whereas she previously rebelled at my saying that ‘she hear d me say’ what I had said, now she was deeply upset at the content as well. She believed I really felt she was a disgusting whore. I felt anxious about her dropping more deeply into a psychotic state in which suicidal drives mounted from her despair over the loss of her capacity to think and from her fear that she was psychotic."}, {"id": 334, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 964, "loc": "dyadic", "int": 0.8, "aff": "sadomasochistic entanglement", "au": "Schwartz-Salant", "pt": "unnamed", "pg": 193, "pdf": "", "ppg": 182, "pcf": 0.97, "txt": "She, however, fe lt no right at all, and if anything, felt totally in my power. She could sense, but onl y barely feel, a deep anger. Through these so-called kinship feelings, our psychotic part s were secretly dominating the interactive field, and a sado-masochistic dyad was being acted out, rather than enacted. So I had to ask myself: ‘Did I believe she was a disgusting whore?’ I had to recognize that in some place, in some way, I could say ‘Yes,’ for to the extent that I felt I was her brother in incest, I also experienced her as seducing me."}, {"id": 335, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 1047, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Schwartz-Salant", "pt": "none", "pg": 218, "pdf": "", "ppg": 207, "pcf": 0.97, "txt": "Now, an inner ‘other’ is felt and known as the center of one’s being, but it is also felt as ‘outer,’ as transcendent. To the person experiencing this quality of the self, the dual features of immanence and transcendence are in no way contradictory or polarized. And the se lf that is finally created in the Rosarium is no t merely a source of identity; it is an ongoing guide—felt in time and space rather than inferred from dreams or intuitively sensed—and it is known as one’s final cause. The sel f that emerges in ‘Resurrection’ is a guide towards fate that can break with collective conventions if that proves necessary."}, {"id": 336, "tr": "jungian", "doc": "J Analytical Psychology - 2006 - McKenzie - Qu", "pos": 71, "loc": "none", "int": 0.1, "aff": "theoretical", "au": "McKenzie", "pt": "none", "pg": 15, "pdf": "", "ppg": 415, "pcf": 1.0, "txt": "Queering gender: anima/animus and the paradigm of emergence 415 image schema or Saunders and Skar’s ar chetypes as organi zational categories of complexes, the archetype is in a dynamic process in body/mind organization and the gendered feeling that emerges from that same dynamic process is not as predictable or static as Jung’s A/A theory suggests. In light of current scientific knowledge it seems reasonable to imagine that one’s conscious gender position involves a somewhat fluid set of complexes or internal working models that emerge from an interweaving of image schemas, attachment experiences, one’s particular body biology, and culture. Clinical illustration Let me put some flesh on the possible influence of early attachment to an individual’s gender position. Jan was an openly transgendered lesbian whose strong male cologne accompanied all of our sessions and lingered in the room long after the hour was over."}, {"id": 337, "tr": "jungian", "doc": "J Analytical Psychology - 2008 - Bravesmith - ", "pos": 43, "loc": "clinician", "int": 0.5, "aff": "irritated collusion", "au": "Bravesmith", "pt": "none", "pg": 10, "pdf": "", "ppg": 110, "pcf": 1.0, "txt": "The state of reverie is distinguished from imagination in that it is a receptive attitude of mind characterized by open free-floating attention and a devotion to ‘being with’ the other. This attitude provides optimal conditions for the imagination to function. To contextualize the episode I wish to describe some information about the relationship between Barry and Julie. Over a long period I realized that I felt irritated by a collusive element in the way Barry responded to his patient."}, {"id": 338, "tr": "jungian", "doc": "J Analytical Psychology - 2008 - Bravesmith - ", "pos": 50, "loc": "clinician", "int": 0.6, "aff": "dawning realization", "au": "Bravesmith", "pt": "unnamed", "pg": 11, "pdf": "", "ppg": 111, "pcf": 1.0, "txt": "Then my thoughts turned to the way that Barry was apparently not even slightly preoccupied with the DVD and I started to think how little he had talked about his fantasies and erotic feelings as a man working with an attractive ex-prostitute. Mighthe have censored the same kind of fantasies that I was fully conscious of? It then dawned on me that he probably suppressed his masculinity in the therapeutic work because he felt anxious about his erotic/pornographic fantasies and embarrassed to talk about them to a supervisor. The fact that I am a female supervisor would exacerbate this."}, {"id": 339, "tr": "jungian", "doc": "J Analytical Psychology - 2008 - Bravesmith - ", "pos": 57, "loc": "dyadic", "int": 0.5, "aff": "shared anxiety", "au": "Bravesmith", "pt": "unnamed", "pg": 12, "pdf": "", "ppg": 112, "pcf": 1.0, "txt": "I commented that what he was telling me made me think that both he and his patient were anxious about the erotic feelings between them. Hence her over-intense need to clean up, having discharged her sexual feelings with her partner before coming to therapy. In him this was paralleled by the episode preceding his dream, in which his girlfriend received his sexual feelings and the patient a rather ‘pure’ aesthetic admiration. Barry agreed that he felt anxious and became able, as the supervision continued over the next period, to reveal more of his own erotic countertransference and tolerate waiting for the patient to be ready to have certain aspects of her erotic transference interpreted directly."}, {"id": 340, "tr": "jungian", "doc": "David Sedgwick - The Wounded Healer_ Countertr", "pos": 184, "loc": "clinician", "int": 0.55, "aff": "uncomfortable distance", "au": "Sedgwick", "pt": "none", "pg": 52, "pdf": "", "ppg": 41, "pcf": 1.0, "txt": "From the therapist’s perspective, there is a readiness to imagine and feel a patient, perhaps like a mother expecting a child. The “idea” of a patient, which starts to be filled in by introjections and projections, then adjusts and moves over time. She then launched into a I was uncomfortable with this description of a deeply felt, “instant” phone intimacy and quasi-transcendent, “nature” couldn’t get with what she was experience. talking about, though it sounded important to her. F then asked, “What do you Actually, I thought she sounded think about that?” pretty “spacey”—a flower child?"}, {"id": 341, "tr": "jungian", "doc": ountertr", "pos": 260, "loc": "clinician", "int": 0.7, "aff": "seduced, resistant", "au": "Sedgwick", "pt": "F", "pg": 74, "pdf": "", "ppg": 63, "pcf": 1.0, "txt": "CASE ILLUSTRATIONS 63 Discussion A great, seductive push from her to let my hair down: a difficult task for me to incarnate that but also meet the other need (for me “not to be” seduced or seduce her). So I put the ball back in her court. I felt no real danger of actually acting out, but was resistant to admitting and possibly burdening her with my fantasies. The wanting she wanted—which I thought was early, “child”-like and narcissistic (in a positive sense)—was not the wanting I generally felt, which was more “adult” (hence incestuous in the context of her “child” need)."}, {"id": 351, "tr": "jungian", "doc": "David Sedgwick - The Wounded Healer_ Countertr", "pos": 274, "loc": "clinician", "int": 0.7, "aff": "pressured, bemused", "au": "Sedgwick", "pt": "F", "pg": 77, "pdf": "", "ppg": 66, "pcf": 1.0, "txt": "I felt pressure to be nice to her kid. She added, “Your neutrality bugs Am I such a feeling-less creep? me…. There has to be love, too, She’s trying to force something and humanness in this process…. on me, while also saying, “Don’t Accessibility has always been a let me” (as in “love me, but problem here, like your fees.” don’t”) ? F fantasized about her little girl I rather enjoyed the feeling of “doing anything in here.” [I said her, me and her daughter—the she could do anything, short of three of us."}, {"id": 352, "tr": "jungian", "doc": "David Sedgwick - The Wounded Healer_ Countertr", "pos": 312, "loc": "clinician", "int": 0.7, "aff": "guilty, fraudulent", "au": "Sedgwick", "pt": "F", "pg": 85, "pdf": "", "ppg": 74, "pcf": 1.0, "txt": "F too seemed to be getting to a similar realization in the dream. F spoke of “propping up” her I felt guilty that, again, she parents and of incest victims might be helping me more than I “reassuring” their parents, her… The older man resembled a suite …and that I was just a dirty mate of mine: “a fraud, it was young/old man, and she could just sexual.” see it. F felt no boundaries between sex [I noted to her the sexual vibes in and other feelings. All touch was our meetings but stressed the sexual. boundaries here.] All this was sort of an I was reminded of the dream of “amorphous mass” of feelings. mother’s “aborted” face."}, {"id": 353, "tr": "jungian", "doc": "David Sedgwick - The Wounded Healer_ Countertr", "pos": 327, "loc": "clinician", "int": 0.75, "aff": "ashamed, sexual", "au": "Sedgwick", "pt": "none", "pg": 89, "pdf": "", "ppg": 78, "pcf": 1.0, "txt": "CASE ILLUSTRATIONS 78 “dichotomies” or “divinities.” In these states of symbiosis or projective identification and counteridentification, it may be difficult to say whether analyst is preceding patient or vice versa, and whether standard sequential paradigms can explain the phenomenology. 41. Countertransference fantasy I became aware for the first time of something sexual in my feelings for my daughter, then only six months old. Since I adored her, I felt deeply ashamed. I then was able to say to myself: Well, sexual curiosity and even something like a sexual impulse can and do exist between fathers and their infant daughters."}, {"id": 354, "tr": "jungian", "doc": "David Sedgwick - The Wounded Healer_ Countertr", "pos": 336, "loc": "clinician", "int": 0.7, "aff": "angry, weary", "au": "Sedgwick", "pt": "F", "pg": 91, "pdf": "", "ppg": 80, "pcf": 1.0, "txt": "She had imagined peeling her Bambi. Childlike and kind of father off her back, “like skin.” sweet, but it seemed to me a little This left raw skin on which she corny and contrived. placed butterflies. F reported that a growth group I felt angry; a reprise of the leader had invited her to do situation with my analyst? individual work. She had also [I said, “I have the fantasy of you once been F’s supervisor. running away and each time I bring you back.”] F spoke throughout with a I felt tired of this and remarked cavalier, “laughing it off” that this style was “painful” and quality."}, {"id": 355, "tr": "jungian", "doc": "David Sedgwick - The Wounded Healer_ Countertr", "pos": 337, "loc": "clinician", "int": 0.5, "aff": "wary, detached", "au": "Sedgwick", "pt": "F", "pg": 92, "pdf": "", "ppg": 81, "pcf": 1.0, "txt": "CASE ILLUSTRATIONS 81 44. Countertransference reflections Talking about rage, what about feeling it? – detachment tempers or eliminates rage. My sense: due to countertransference, her rage will wound me? Her sense intuitively is similar?"}, {"id": 356, "tr": "jungian", "doc": "David Sedgwick - The Wounded Healer_ Countertr", "pos": 345, "loc": "clinician", "int": 0.55, "aff": "sorry, attuned", "au": "Sedgwick", "pt": "F", "pg": 93, "pdf": "", "ppg": 82, "pcf": 1.0, "txt": "I felt genuinely sorry, got a message from her the though not guilty, that the time next day. got “disorganized.” Processing in session, F said I had waited awhile, and even she’d fantasized, “You would called her home before leaving. I know I was coming, so I had imagined she’d fantasize this wouldn’t have to call.” way."}, {"id": 357, "tr": "jungian", "doc": "David Sedgwick - The Wounded Healer_ Countertr", "pos": 354, "loc": "none", "int": 0.2, "aff": "reflective", "au": "Sedgwick", "pt": "F", "pg": 96, "pdf": "", "ppg": 85, "pcf": 1.0, "txt": "CASE ILLUSTRATIONS 85 serenity, like eating something delicious…. But I don’t want you to feel good about that… I can feel a tiny little bit of feeling sorry for my father; I identified with him for a second.”] Discussion This dream was also in response to an upcoming vacation break, which seemed to echo previous “leavings.” The recent deepening of her dependency and trust seems evident, though F maintains the cautious capacity to “laugh it off,” if necessary. Relations to “father,” whom I was undoubtedly carrying and embodying, show some improvement, perhaps in tandem with my own slight improvements. 50. Patient’s dream My sister and I are in bed."}, {"id": 358, "tr": "jungian", "doc": "David Sedgwick - The Wounded Healer_ Countertr", "pos": 361, "loc": "patient", "int": 0.45, "aff": "proud, ashamed", "au": "Sedgwick", "pt": "F", "pg": 97, "pdf": "", "ppg": 86, "pcf": 1.0, "txt": "It’s OK to play and fool around. [Associations: F saw her father’s book in a bookstore. She felt proud and wanted to tell me, though also “ashamed of being proud.” She said, “I can’t stand the thought of anything around my neck…. Stifled…. Like what you wear.”] Discussion Recent work is apparently bearing fruit, as we see the image of the “good father” more clearly established and at work (or play) in her."}, {"id": 359, "tr": "jungian", "doc": "David Sedgwick - The Wounded Healer_ Countertr", "pos": 370, "loc": "none", "int": 0.1, "aff": "biographical", "au": "Sedgwick", "pt": "J", "pg": 99, "pdf": "", "ppg": 88, "pcf": 1.0, "txt": "J’s relationship with her father was emotionally incestuous (actual incest was denied, though its intimation made J very anxious). Mother was dependent and “nice.”J was the eldest of her siblings, who were married, unlike her. She felt herself to be an outsider in the family, and her sense of alienation carried over to her work life, where she had resigned or been fired from jobs at regular, approximately yearly intervals. She presented with impulsive suicidal ideation, a history of past attempts, and an extensive but reportedly unsatisfactory therapy history ."}, {"id": 360, "tr": "jungian", "doc": "David Sedgwick - The Wounded Healer_ Countertr", "pos": 391, "loc": "clinician", "int": 0.4, "aff": "security needs, discomfort", "au": "Sedgwick", "pt": "J", "pg": 103, "pdf": "", "ppg": 92, "pcf": 1.0, "txt": "She helped my decision along when she said her “gut feeling” was that she felt “comfortable enough” with me, and when she apologized to me for being a “bear,” as she put it. Though compliant perhaps, she was not oblivious to her effects on people, and to my security needs. She said, “I don’t know if you want to work with me because I’m so angry.” Discussion Here is another very perceptive patient. J was enough of a caretaker to intuitively sense my discomfort and try to make it better."}, {"id": 361, "tr": "jungian", "doc": "David Sedgwick - The Wounded Healer_ Countertr", "pos": 430, "loc": "clinician", "int": 0.7, "aff": "annoyed, sad", "au": "Sedgwick", "pt": "J", "pg": 111, "pdf": "", "ppg": 100, "pcf": 1.0, "txt": "I stop and feel annoyed. In the unspoken countertransference to the first dream I felt supportive of her separation from the negative father and her realization of her own individuation. This came without strain; that is, from a position of neutrality. In the second dream I felt real sadness, in a syntonic countertransference to go with her understandable anger."}, {"id": 362, "tr": "jungian", "doc": "David Sedgwick - The Wounded Healer_ Countertr", "pos": 433, "loc": "clinician", "int": 0.65, "aff": "awed re-visioning", "au": "Sedgwick", "pt": "J", "pg": 111, "pdf": "", "ppg": 100, "pcf": 1.0, "txt": "Something new, arising from the union in the transference/ countertransference, emerges in the “feeling-image” the therapist has of the patient. Before, J seemed massively sick to me, all anxiety (which I, too, experienced with her). Over time there had gradually grown within me a picture of J’s “great”- ness, her full-body wholeness, that could now be “real”-ized almost concretely in the countertransference. This was, furthermore, a very different vision of her body (and of her femininity) than she or I had had before."}, {"id": 363, "tr": "jungian", "doc": "David Sedgwick - The Wounded Healer_ Countertr", "pos": 567, "loc": "none", "int": 0.2, "aff": "theoretical", "au": "Sedgwick", "pt": "none", "pg": 142, "pdf": "", "ppg": 131, "pcf": 1.0, "txt": "Probably, they are in the analyst now—he will be feeling the things characterized in the image. Moreover, he (his hooks) may be contributing to the things that are characterized in the image. Alternatively, as Groesbeck seems to say, these images may be commentaries on the state of the patient’s “inner healer.” But it would be difficult to imagine that particular imago not being closely connected to the patient’s relationship with his actual, outer healer. The analyst will be implicated in some way."}, {"id": 364, "tr": "jungian", "doc": "Thomas Singer - The Cultural Complex_ Contempo", "pos": 87, "loc": "none", "int": 0.1, "aff": "theoretical reflection", "au": "Singer, T.", "pt": "Elian Gonzales", "pg": 33, "pdf": "", "ppg": 16, "pcf": 0.87, "txt": "It wasn’t until I happened by chance to glance again at the image of Baby Zeus from Jane Harrison’s book that I was able to ﬁnd a missing link to the story which allowed me to make some sense (at least for myself) of what seemed so irrational and yet was being deeply felt not just by the Cuban Americans, but all the other people caught up in this extraordinary drama. What if Baby Zeus and Elian Gonzales are part of the same story? What if they are linked by a mythic form or archetypal pattern out of which are generated a story line, primal images and deeply powerful, non-rational collective emotion? Elian Gonzales’ miraculous second birth or rebirth as he was plucked from the waters puts him in the realm of the divine child (like Moses), and he becomes the young god who carries all the hopes for the future of a people that sees itself as having been traumatized by a life of cruel oppression."}, {"id": 365, "tr": "jungian", "doc": "Thomas Singer - The Cultural Complex_ Contempo", "pos": 91, "loc": "none", "int": 0.3, "aff": "surprised recognition", "au": "Singer, T.", "pt": "Elian Gonzales", "pg": 34, "pdf": "", "ppg": 17, "pcf": 0.87, "txt": "I had just stumbled into an imaginal connection between Baby Zeus and Elian Gonzales and was using the image of Baby Zeus surrounded by the Kouretes to illustrate the reality of the collective psyche and the power of collective emotion to generate living myths. Kalsched had not seen this particular image before and he startled with both surprise and instant recognition at the lively representation of the warriors defending Baby Zeus. He immediately knew who they were, correctly identifying them as the Daimones. Indeed, the Kouretes are also known as the Daimones: “Io, Kouros m o s t G r e a t...thou art come at the head of thy Daimones” (Harrison 1912/1974: 7)."}, {"id": 366, "tr": "jungian", "doc": "Thomas Singer - The Cultural Complex_ Contempo", "pos": 145, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Singer, T.", "pt": "none", "pg": 46, "pdf": "", "ppg": 29, "pcf": 0.87, "txt": "Economic theories, sociological theories, theories of history and religion – even theories from analytical psychology such as the one I am advancing here – are put on parade in an attempt to reassure ourselves that we understand what is happening. In such a context, George W. Bush’s “axis of evil” idea makes sense, in its very attempt to make sense to the Western world of what, in fact, makes no sense. Although I think Bush misidentiﬁed Iraq, Iran and North Korea as the “axis of evil,” in naming an “axis of evil” at all, I think he has come close to an archetypal truth about the kinds of situations that lead to and grow out of an event like 9/11."}, {"id": 367, "tr": "jungian", "doc": "Thomas Singer - The Cultural Complex_ Contempo", "pos": 681, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Singer, T.", "pt": "none", "pg": 137, "pdf": "", "ppg": 120, "pcf": 0.87, "txt": "Plots designed to injure the father (projected onto the government or the law) are one of the only ways found by those that feel impotent to openly express their opposition. Another, healthier form of protest would be for the brothers and sisters to come together in a new union, to forge a different kind of government based on a sense of otherness, in a new level of consciousness where the existence of a patriarchal hero is not imperative. The Brazilian inferiority complex and its pervasive symptom of corruption also activate a more negative pole of the puer aeternus archetype. It fosters the image 120 Denise G."}, {"id": 368, "tr": "jungian", "doc": "Thomas Singer - The Cultural Complex_ Contempo", "pos": 825, "loc": "patient", "int": 0.7, "aff": "overwhelmed, dissociative", "au": "Singer, T.", "pt": "D.", "pg": 171, "pdf": "", "ppg": 154, "pcf": 0.87, "txt": "The hospitalization enabled the child to express and legitimize his feeling of fear. D. was overwhelmed by the invasion of memories and images from the traumatic event. On one occasion, he lost contact with his present reality and relived the event, but this time, rather than being “frozen” in place behind the terrorist, he became active in his own defense. During this dissociative state, D. was running and shooting apparently identifying with the aggressor (Ferenczi 1933: 156–167)."}, {"id": 369, "tr": "jungian", "doc": "Thomas Singer - The Cultural Complex_ Contempo", "pos": 1044, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Singer, T.", "pt": "none", "pg": 216, "pdf": "", "ppg": 199, "pcf": 0.87, "txt": "Through the activity of these complexes belonging to a larger cultural whole, the individual has a feeling of belonging to a speciﬁc group with a speciﬁc identity. As a corollary, through expressing these complexes, the individual’s own identity becomes defined partially in reference to a specific group. In addition, group members come to have a sense of how their own reference group reacts to and feels about another group or groups and how these “other” groups react to and feel about the individual’s own group. Within such an “us and them” ﬁeld, ingroup beliefs, affects, ideologies and values develop and grow increasingly compelling very early in life."}, {"id": 370, "tr": "jungian", "doc": "Thomas Singer - The Cultural Complex_ Contempo", "pos": 1071, "loc": "patient", "int": 0.55, "aff": "betrayed, desired", "au": "Singer, T.", "pt": "Jo Ann", "pg": 221, "pdf": "", "ppg": 204, "pcf": 0.87, "txt": "Jo Ann shared another association to the dream: “That the men had gotten cleaned up to look responsible. That, she said, made her feel betrayed, because it meant that they won’t be in as much trouble, but that she will get in trouble.” Finally, she said: Your comment about my having the therapy and the relationship for myself must have triggered this dream and made me remember the fantasy. I thought of your comment as sexual. Sex with you would be a loss for the child part, but the adult part would feel good about feeling desired. 204 Samuel L."}, {"id": 371, "tr": "jungian", "doc": "Thomas Singer - The Cultural Complex_ Contempo", "pos": 1164, "loc": "clinician", "int": 0.3, "aff": "interpretive musing", "au": "Singer, T.", "pt": "Jo Ann", "pg": 241, "pdf": "", "ppg": 224, "pcf": 0.87, "txt": "I felt the dream had used her to point out a style of emotional expression (what Jung would call an anima) that was still immature, and vulnerable because it did not contain enough trickster meanness. I concluded that the dream ego persisted in punishing this ﬁgure even though it felt bad about doing so, because the self had decided it was time to direct some malice toward this excessively passive anima. 3 I thought this dream might herald a shift in my patient toward a willingness to externalize at least some of his frustrated aggression. Perhaps the self wanted to introduce to the anima the palpable reality of evil so that she would adopt a less open, more self-protective stance. The anima interpretation had rather far-reaching implications, since the feminine side of a man, his inner “sister,” represents much of his unconscious affective life and particularly his spontaneous feeling reactions in situations."}, {"id": 372, "tr": "jungian", "doc": "Thomas Singer - The Cultural Complex_ Contempo", "pos": 1167, "loc": "none", "int": 0.2, "aff": "task-focused", "au": "Singer, T.", "pt": "unnamed", "pg": 242, "pdf": "", "ppg": 225, "pcf": 0.87, "txt": "The patient had much familiarity with me as an analyst, had read widely in Jung, and was quite skilled at interpreting his own dreams. All this psychological knowledge, however, gave way to the exigencies of a dream image that occurred at exactly this time. He felt challenged by this image, and my task was to help him ﬁnd a way to hear what the self was trying to convey to him now. He had typed the dream in duplicate: he recorded his dreams on a word processor, and this was the printout: I looked down at the top of my right thigh."}, {"id": 373, "tr": "jungian", "doc": "Thomas Singer - The Cultural Complex_ Contempo", "pos": 1184, "loc": "patient", "int": 0.6, "aff": "branded confusion", "au": "Singer, T.", "pt": "S.", "pg": 244, "pdf": "", "ppg": 227, "pcf": 0.87, "txt": "Made for mass consumption. S.: That’s kind of what I’m feeling, too, in this confusion I was talking about when I came in is that sense of being branded, in a way. There is a feeling of being branded. Okay, what do I do now?"}, {"id": 374, "tr": "jungian", "doc": "Thomas Singer - The Cultural Complex_ Contempo", "pos": 1229, "loc": "none", "int": 0.1, "aff": "interpretive", "au": "Singer, T.", "pt": "S.", "pg": 250, "pdf": "", "ppg": 233, "pcf": 0.87, "txt": "The bottle cap that had become imprinted on the patient’s skin in a negative way, like a brand, had once contained the heroic image. The scapegoating of my patient as homosexual and therefore outside the hero myth as that was deﬁned in the early 1950s made him the target of the under, or shadow, side of the heroic image. After we had worked through this dream, I realized that the dream ego’s association to Kaposi’s summarized in a pithy way what we had worked to uncover, that the fear of vulnerability that underlies the heroic aspirations of immature men is actually malignant. In contemporary language, we call that fear of masculine vulnerability “homophobia,” and it is not hard to recognize how homophobia has played a role in creating the psychosocial conditions that led to the AIDS epidemic in the homosexual community."}, {"id": 375, "tr": "jungian", "doc": "Roger Brooke - Jung and Phenomenology, Classic", "pos": 161, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Brooke", "pt": "none", "pg": 36, "pdf": "", "ppg": 36, "pcf": 1.0, "txt": "They suggest permanence and the resolution of psychic conflict. Because these are symbols of the goal of individuation – wholeness and centredness – they often appear as symbols of transformation when the ego is lost and disorientated. In this sense, the image of a diamond, for instance, resilient and valuable, may be a ‘symbol of the self’ in that it emerges from the self, but it might refer to a more consolidated emerging ego rather than self as such. Once again, we should not jump from particular image to archetypal concept too quickly."}, {"id": 376, "tr": "jungian", "doc": "Roger Brooke - Jung and Phenomenology, Classic", "pos": 528, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Brooke", "pt": "none", "pg": 100, "pdf": "", "ppg": 100, "pcf": 1.0, "txt": "However, more important than the self as a ‘something’ is an understanding of the self as ‘no-thing’. Thus when Jung in his old age had a sense of continuity between himself and all things, he was incarnating the self as a fertile and hospitable emptiness within which the things of the world could shine forth, and it was through these things that his sense of himself was founded. Similarly in East Africa the self was realised as a world which sprang into being, while Jung’s sense of himself was of being true to the deepest calling of Being itself. It is this calling which is at the centre of the individuation process."}, {"id": 377, "tr": "jungian", "doc": "Roger Brooke - Jung and Phenomenology, Classic", "pos": 746, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Brooke", "pt": "none", "pg": 142, "pdf": "", "ppg": 142, "pcf": 1.0, "txt": "Therefore the tension between the revealed and concealed is not an ontological tension between two essentially different but connected entities, revealed image and concealed archetype-as-such. It is a hermeneutic tension which is given in the structure of imaginal presence itself. Thus the archetype is not extraneous to the image but is that quality of presence which leads to the depths of its own interiority . This is to say, however, that an image is a metaphor, and that all we have access to is presence as a metaphorical reality."}, {"id": 378, "tr": "jungian", "doc": "Roger Brooke - Jung and Phenomenology, Classic", "pos": 774, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Brooke", "pt": "none", "pg": 147, "pdf": "", "ppg": 147, "pcf": 1.0, "txt": "There is also an essential self-reflection in human existence, which is given not as an abstracting power of self-observation – or at least not that primarily – but as a capacity to see the way one is mirrored selfreflectively in the world. Thus a regressed man may dream of a child, and his wife or therapist may have fantasies of mothering him. But even where there is such symmetry between behaviour and image, there is no reason to return to the hypothesis of an archetype correlating in a predetermined way with its image. In each of these dreams or fantasies the person is confronted by an image of himor herself, and thus in that moment of self-confrontation is looking at the world not through his or her own usual eyes but through the eyes of another."}, {"id": 379, "tr": "jungian", "doc": "Roger Brooke - Jung and Phenomenology, Classic", "pos": 834, "loc": "patient", "int": 0.5, "aff": "foggy depersonalized", "au": "Brooke", "pt": "Elizabeth", "pg": 159, "pdf": "", "ppg": 159, "pcf": 1.0, "txt": "The setting Elizabeth was a 25-year-old teacher when she began therapy. We had been meeting three times per week for a little over two years, and for most of the last year she had been using a couch. Her presenting complaints had been that for many years she had lived in a continual ‘fog’, isolated and without real feeling. She had come to have almost daily panic attacks and depersonalised experiences in which she would lose any sense of bodily groundedness or continuity, and it would feel as though her mind were in ‘orbit’."}, {"id": 380, "tr": "jungian", "doc": "Roger Brooke - Jung and Phenomenology, Classic", "pos": 845, "loc": "patient", "int": 0.7, "aff": "surging power", "au": "Brooke", "pt": "Elizabeth", "pg": 161, "pdf": "", "ppg": 161, "pcf": 1.0, "txt": "In other words, as her capacity to imagine would indicate, she never dropped into a psychotic maternal transference. The following day she went for a long bicycle ride with a friend. For a while she felt heavy and ‘flat’, as she had done the previous day, then she felt a surge of anger which quickly became ‘pure energy’. She felt a wave of power well up inside her, and found herself pedalling faster and faster."}, {"id": 381, "tr": "jungian", "doc": "Roger Brooke - Jung and Phenomenology, Classic", "pos": 846, "loc": "patient", "int": 0.7, "aff": "ecstatic release", "au": "Brooke", "pt": "Elizabeth", "pg": 161, "pdf": "", "ppg": 161, "pcf": 1.0, "txt": "She then remembered my interpretation, felt it made sense of what was happening, and felt herself light and free of the dead body she had known. She was ecstatically happy for the rest of the ride; her body was no longer an issue; the tension was gone. It was after this separation from the mother that she became more directly in touch with herself. Her body became more clearly her own, differentiated from her mother’s, and she was also able to perceive both herself and her mother more clearly."}, {"id": 382, "tr": "jungian", "doc": "Roger Brooke - Jung and Phenomenology, Classic", "pos": 847, "loc": "dyadic", "int": 0.7, "aff": "raw fury", "au": "Brooke", "pt": "Elizabeth", "pg": 161, "pdf": "", "ppg": 161, "pcf": 1.0, "txt": "During the following session she was unambiguously present as her childhood self, feeling bruised and battered, and in the session after that she felt herself consumed with hungry rage. I had sensed her rage before this, but had been unable to access it. Now, however, with a body that was her own, she sank into it. She had seen the ‘Do Not Disturb’ sign on my door a few hours before our session, and had wanted to smash the door down screaming in inarticulate fury."}, {"id": 383, "tr": "jungian", "doc": "Roger Brooke - Jung and Phenomenology, Classic", "pos": 852, "loc": "patient", "int": 0.6, "aff": "deprived woundedness", "au": "Brooke", "pt": "Elizabeth", "pg": 162, "pdf": "", "ppg": 162, "pcf": 1.0, "txt": "deeply moving, and was characterised by its gentle calmness. A remark I had made in our previous meeting about a ‘deprived child’ had stayed with her for the two intervening days, and she said she had just realised that she had been living her life as a deprived child. She said it made sense for her of her anger, envy, and greed, her belief that the world owed her something, her stealing, bruised woundedness, ruthlessness, defensiveness, and chronic inner sense of abandonment. The image of the deprived child also brought together some of her experiences in therapy, such as her desire to smash my door down and scream at me for having another patient, her expectation of and fear of rejection, her contemptuous disregard of any expression of caring towards her even as she craved it, and so on."}, {"id": 384, "tr": "jungian", "doc": "Roger Brooke - Jung and Phenomenology, Classic", "pos": 859, "loc": "dyadic", "int": 0.7, "aff": "closer yet separate", "au": "Brooke", "pt": "Elizabeth", "pg": 163, "pdf": "", "ppg": 163, "pcf": 1.0, "txt": "Fourth, the two of us felt closer together and at the same time more separate. We were more separate because the child–mother polarity was less definitive of our relationship, and we both felt freed from each other. Very soon after those few sessions Elizabeth became anxious about breaks in treatment and termination. Our separateness had become more of an issue than before."}, {"id": 385, "tr": "jungian", "doc": "Roger Brooke - Jung and Phenomenology, Classic", "pos": 885, "loc": "patient", "int": 0.8, "aff": "despair/exaltation", "au": "Brooke", "pt": "Elizabeth", "pg": 167, "pdf": "", "ppg": 167, "pcf": 1.0, "txt": "Several months after these events Elizabeth was oscillating between despair and exaltation. She tearfully recounted that when she was unhappy she felt she would never be healed, and when she was happy she felt she was at last ‘better’. Each experience was total and there was no perspective to make sense of what was happening to her. She then said she had lost a certain spirituality which had once stabilised her and given some meaning to her life."}, {"id": 386, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 23, "loc": "none", "int": 0.2, "aff": "theoretical", "au": "Schwartz-Salant", "pt": "none", "pg": 13, "pdf": "", "ppg": 2, "pcf": 0.97, "txt": "Anyone relating to a person exhibiting such contradictory states will tend to feel this process, to become confused, and to withdraw or feel an impotent rage . But to a certain degree, such an area o f madness is an integral part of everyone’s existence. Embracing the mad areas of ou r psyche and acknowledging the ways they limit us is a way to discover the mystery of the self and the other. This subtle ‘madness’ becomes a kind of chaotic shore that the relationship is destined to wash up against and to be bounded by."}, {"id": 387, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 150, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Schwartz-Salant", "pt": "none", "pg": 38, "pdf": "", "ppg": 27, "pcf": 0.97, "txt": "This analogy is not drawn on by any accident; for it was in initiation-experience that men had managed to express and develop the idea of movement from one level of life to another level qualitatively different— from childhood with its mother-world to adulthood with its totally different set of relations and responsibilities, its new lores and understandings, and so on. Alchemy above all represents the scientific application of these initiation-ideas of a leap from one qualitative level to another; and that is why the alchemists keep returning to the analog y of ordeals, tests, resurrections. And they do not do so for any simple reasons of needing an analogy drawn from human life that helps provide a schemata of stages and to make the whole mysterious process of chemical change more comprehensible. Th ey do so because th ey genuinely feel Activating the experience of the field 27"}, {"id": 388, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 205, "loc": "none", "int": 0.3, "aff": "bizarre", "au": "Schwartz-Salant", "pt": "none", "pg": 50, "pdf": "", "ppg": 39, "pcf": 0.97, "txt": "But in schizophrenics they are bizarre. Someone in a manic psychosis may feel like they are creating the world and this can be understood as a result of extreme inferiority feelings they are compensating for. But consider the dancer Nijinsky’s description during a schizophrenic break: ‘Once I went for a walk and it seemed to me that I saw some blood on the snow. I followed th e traces of the blo od and sensed that somebody who was still alive had been killed.’ (Sass 1992, 17) The sense of the bizarre, as later examples will show, occurs through the fusion o f contradictory images in the psyc hotic area."}, {"id": 389, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 213, "loc": "clinician", "int": 0.3, "aff": "bewildered", "au": "Schwartz-Salant", "pt": "unnamed", "pg": 51, "pdf": "", "ppg": 40, "pcf": 0.97, "txt": "Or, a woman whose mother had just been admitted to a psychiatric hospital dreamed of carrying her from house to house trying to find a place to put her down. But usually psychotic areas communicate to us with more of a sense o f bizarreness that can follow upon feeling be wildered or mentally blank, or they communicate through the analyst’s own dissociative countertransference reactions. Internally, a person’s psychotic area is extremely stressful. Under its impact, the analysand can suffer from a ch ronic sense of not being able to create a life that has any continuity and stability."}, {"id": 390, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 241, "loc": "clinician", "int": 0.75, "aff": "shameful immaturity", "au": "Ogden", "pt": "Mr V", "pg": 90, "pdf": "", "ppg": 75, "pcf": 1.0, "txt": "In that sense, it was a far more understanding, more compassionate rendering of the event. I was less fearful of experiencing the feelings that the reverie involved. At the heart of the second reverie was a feeling of myself as a boy being called upon (and calling upon myself) to do something that I was afraid was emotionally and physically beyond me.This feeling of shameful immaturity was a new version of a feeling I had experienced in the earlier reverie in identifying with R as an eight-year-old boy who was behaving like a baby (who, in fantasy, had peed in his pants). The more emotionally accepting affective state generated in the second reverie allowed me to listen differently to Mr V ."}, {"id": 391, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 130, "loc": "none", "int": 0.2, "aff": "theoretical", "au": "Stern, D.B.", "pt": "none", "pg": 43, "pdf": "", "ppg": 24, "pcf": 0.94, "txt": "In a nutshell, what I want to say is that the movement from not-me experience to feelslike-me (Stern, 2019), with the accompanying possibilities for formulating new meaning that open up at such moments, seems to me to happen when we not only know or feel something, but also and simultaneously, when we sense ourselves in the midst of this process—that is, when we know and feel that it is we who are doing the knowing and feeling . When these two events co-occur—the knowing and feeling, and knowing and feeling that we are knowing and feeling—we come into possession of ourselves. We feel something on the order of, “It is I who feels that (or sees it, hears it, remembers it, etc.); this experience is mine.” Instances of coming into possession of ourselves take place virtually and continuously, ranging from tiny flares of bodily sensations, perceptions, memories, or thoughts to vast landscapes of personal insight or scientific or artistic inspiration (e.g., Ghiselin, 1952; Stern, 1990). The phenomenon I want to address is not limited to our sense of owning experience."}, {"id": 392, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 173, "loc": "clinician", "int": 0.85, "aff": "anxious disorientation", "au": "Ogden", "pt": "Mr N", "pg": 70, "pdf": "", "ppg": 55, "pcf": 1.0, "txt": "He said that he had repeatedly told the nurses about it, but that they had said they could do nothing to stop it. Mr N, weeks later, recognized the grating music to have been an auditory hallucination resulting from drug withdrawal from the narcotic to which he had been addicted.This reverie about Mr N left me feeling extremely anxious, but the reasons for my uneasiness were opaque to me. My thoughts then moved to the fact that in Ms C’s analysis there had been periods of time when I had found myself disoriented in a way, and to a degree, that I had not experienced with any other patient.There had been a number of instances when I had lost track of the time, not knowing whether we had gone on far past the end of the session or whether we were somewhere in the middle of it. I felt terrible anxiety at these times, feeling that I had no way to ﬁgure out where we were in the session."}, {"id": 393, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 224, "loc": "clinician", "int": 0.8, "aff": "sad shame", "au": "Ogden", "pt": "Mr V", "pg": 86, "pdf": "", "ppg": 71, "pcf": 1.0, "txt": "It had been years,perhaps a decade,since I had thought of that incident.While recalling these events in the session with Mr V , I felt sadness in response to the image of R and me becoming so separate and alone in the fear and shame that I assume he had felt, and that I know I had felt, after the accident.This had been no T om Sawyer-Huck Finn adventure.R (I imagine) and I experienced our fear as well as our shame separately: we each felt stupid for having walked on the thinly frozen section of the pond and cowardly for having been so afraid. He and I never once mentioned the incident to one another afterwards nor did I ever tell anyone other than my mother about it. These ﬂeeting thoughts and feelings occupied only a moment of time, but were an emotional presence as I went on to say to Mr V that from the sound of his footsteps in the passageway, I suspected that he had been in some turmoil as he approached our first meeting. (Even as I was saying them, these words – particularly “turmoil”and “approached”– felt stifﬂy “therapeutic”and lifeless to me.) Mr V responded by telling me that when we spoke on the phone, he had written down the directions I had given him about how to get into the waiting room from the outside of the house, but on arriving he found that he had forgotten to bring the scrap of paper on which he had written the instructions. When in the passageway between the door to the outside and the door to the waiting room, he was not sure whether the door with the glass panes was the waiting room door."}, {"id": 394, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 233, "loc": "dyadic", "int": 0.7, "aff": "tender lostness", "au": "Ogden", "pt": "Mr V", "pg": 88, "pdf": "", "ppg": 73, "pcf": 1.0, "txt": "By this time Mr V had broken the silence and had begun to tell me about having been in therapy when he was in college. He had not been able to make friends and felt terribly homesick.The patient said that it had been a real stretch for his parents to pay for the therapy. After some time, I said to Mr V that I thought that when he realized in the passageway that he had forgotten the directions he had written down, he felt embarrassingly child-like and that for him to behave or even feel like a child is a very shameful thing.The patient said nothing in response to my comment, but the tension in his body visibly diminished.We sat quietly for a while. (It seemed to me that Mr V was worried that being in analysis would be a stretch for him – in a great many ways.) He then said,“Outside there, I felt so lost.”There was softness to Mr V’s voice as he spoke these words, a quality of voice that I had not heard from him, a softness that would prove to be a rarity in the course of the next several years of his analysis. (I was aware that the patient’s feeling that there was an “outside there,” was also a feeling that there was beginning to be an “inside here” – inside the analytic space,inside the relationship with me – in which he did not feel as lost.) VI Discussion Mr V’s initial analytic meeting began in earnest about ten minutes before we actually met for the ﬁrst time. His communications were made in the medium of sounds that echoed through the rest of the initial meeting and from there down the labyrinthine corridors of the analysis as a whole."}, {"id": 395, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 44, "loc": "none", "int": 0.2, "aff": "theoretical", "au": "Ogden", "pt": "none", "pg": 25, "pdf": "", "ppg": 10, "pcf": 1.0, "txt": "For this to occur, the patient must feel known by the analyst in a way that he has never before felt known.The analytic relationship is unique. (The invention of a new form of human relatedness may be Freud’s most remarkable contribution to humankind. Being alive in the context of the analytic relationship is different from the experience of being alive in any other form of human relatedness.) Feeling known in the analytic situation is not so much a feeling of being understood as it is a feeling that the analyst knows who one is.This is communicated in part through the analyst’s speaking to the patient in such a way that what he says and the way he says it could have been spoken by no other analyst to no other patient. I would hope that if one of my patients were a speck on the wall of my consulting room listening to me work with another patient, the patient-on-thewall would recognize me as the same person, the same analyst, with whom he is working in analysis, but would ﬁnd that the way the patient-on-the-couch and I are talking is a way that would not suit the patient-on-the-wall.That way of being together and conversing that is being overheard would feel somehow “off” – perhaps a bit too cerebral or too raw, a bit too serious or too playful, a bit too parental or too spousal.The patient-on-the-wall ideally would not envy the patient-on-the-couch; rather, he would feel that “that is not for me,” and of course, he would be right – it is not meant for him. The interpretations made by an analyst who is wed to a particular “school” of psychoanalysis are frequently addressed to the analyst himself (to his internal Dreaming undreamt dreams and interrupted cries 10"}, {"id": 396, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 66, "loc": "dyadic", "int": 0.75, "aff": "shared inadequacy, envy", "au": "Ogden", "pt": "Ms C", "pg": 31, "pdf": "", "ppg": 16, "pcf": 1.0, "txt": "It was only something girls and women knew about.” (In retrospect, I believe that this interpretation was derived in part from my reverie concerning the actress who could do everything, including sing beautifully.Although I had not been aware of it at the time that the reverie occurred, I realized at this point in the session that I had not only been admiring of the actress, I had been envious of her for being a woman. Both the patient and I were unconsciously giving metaphoric shape to our experience of being inadequate because we would never be a girl or a woman who could captivate his mother. Both my reverie concerning the music of the actress’s singing and my use of the phrase “face the music” were parts of the unconscious context for the patient’s use of music as a metaphor for his own feelings of inadequacy for not having been born a girl and for lacking whatever else it would have taken to have won his mother’s love.) In response to my comment about his feeling invisible to his mother, the patient said,“In a way even now I feel that there’s something impenetrable about women and their ties to one another.They live in a whole other reality unknowable by a man. I don’t have words for it – they live inside their bodies, not on the surface of their bodies the way men do.Their pocket books are like pouches in which they carry around their secrets.I don’t really believe that men, with their simple-minded uncomplicated penises, have anything to do with the mystery of making a baby.A woman’s body is strange, in a way grotesque, with amazing powers.” Mr A’s comments led me to think further about parts of my reverie experience."}, {"id": 397, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 119, "loc": "patient", "int": 0.6, "aff": "frozen horror", "au": "Ogden", "pt": "Ms C", "pg": 50, "pdf": "", "ppg": 35, "pcf": 1.0, "txt": "new experiences with people.In the dream,he,in the form of the guests paying endless homage to him, directed to himself what might have been interest paid to someone outside of himself, someone outside of his internally frozen relationship with his wife. I went on to say that it was striking that the honored guest in the dream was not given a name, much less an identity and human qualities which might have stirred curiosity, puzzlement, anger, jealousy, envy, compassion, love, admiration or any other set of feeling responses to another person. I added that the horror he felt at the end of the dream seemed to reﬂect his awareness that the static state of self-imprisonment in which he lives is potentially endless. (A good deal of this interpretation referred back to many discussions Mr K and I had had concerning his state of being “stuck” in a world that no longer existed.) Mr K responded by telling me that as I was speaking he remembered another part of the dream made up of a single still image of himself wrapped in heavy chains unable to move even a single muscle of his body. He said he felt repelled by the extreme passivity of the image."}, {"id": 398, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 180, "loc": "dyadic", "int": 0.45, "aff": "flat, exploratory", "au": "Ogden", "pt": "Ms C", "pg": 72, "pdf": "", "ppg": 57, "pcf": 1.0, "txt": "I said that the ﬁrst part of the dream seemed to be an unadorned image of my ofﬁce as it “really is.”Ms C said, “Y es, it did feel ﬂat.” I told her that the second part of the dream felt to me very different from the ﬁrst: “It is set in a place that is not a real place, but an imaginary one – a much larger place with many more rooms than there really are here.” (I was reminded of Ms C’s wish to have an extra room in the house she hoped to buy to use for thinking – a study.) She and I talked about the way in which the room at ﬁrst felt like a mess, cluttered with an enormous number of things and about her feeling of being unable to tell what the function of the room was. I commented on her feeling of disappointment at the end of the dream. Ms C responded by saying that the dream had not left her feeling disappointed. She said that something changed at the end that was hard for her to describe."}, {"id": 399, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 230, "loc": "clinician", "int": 0.65, "aff": "absorbed reverie", "au": "Ogden", "pt": "Mr V", "pg": 87, "pdf": "", "ppg": 72, "pcf": 1.0, "txt": "There was then another silence of several minutes duration which felt like a long time at such an early stage of the work. But it did not feel like an anxious silence, so I let it go on. During this silence, my mind “returned” to the reverie concerning the incident from my childhood. This time I experienced the childhood scene quite differently – I had a far greater sense of seeing and feeling things from inside of the two of us (R and me).This reverie experience was not that of a series of still images, but of a lived experience unfolding."}, {"id": 400, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 237, "loc": "clinician", "int": 0.8, "aff": "shame, sadness", "au": "Ogden", "pt": "Mr V", "pg": 89, "pdf": "", "ppg": 74, "pcf": 1.0, "txt": "A component of the shame in this reverie experience seemed new and very real to me:the idea/feeling that R’s pants were wet because, in his fear, he had soaked them with urine. 3 Just as immediate, for me, as my image of R (with whom I thoroughly identiﬁed) in his shamefully soggy clothes, were my feelings of sadness concerning the isolation from one another that R and I had felt. The emotional field of the session was changed in ways that I was only beginning to understand by my having lived the experience of this reverie in the context of what was occurring at an unconscious level between the patient and me. Following my reverie, Mr V gave a detailed, but affectively muted account of his experience in the passageway.He recounted having forgotten the scrap of paper on which he had written the directions I had given him; he went on to describe his inability either to enter the waiting room or to leave the passageway (which felt like a prison) and enter the blindingly lit world outside. My response to Mr V’s depiction of himself in the passageway involved an effort to re-state what he had said in slightly different language and with expanded meaning."}, {"id": 401, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 189, "loc": "none", "int": 0.2, "aff": "theoretical", "au": "Stern, D.B.", "pt": "none", "pg": 60, "pdf": "", "ppg": 41, "pcf": 0.94, "txt": "Prior to having the feeling of being understood, one may have been familiar enough with the not-me part to recognize it—that is, one could have the thought or feeling, but that thought or feeling merely washes over one, like an ocean wave. It is experienced passively, as if it were a feature of the world, not a creation of one’s own mind. Prior to feeling witnessed, in other words, one may be able to know or feel, but one cannot go meta-affective; one cannot know or feel that one knows or feels. Emma’s palpable sense of conviction, both in the session and the email, told me that I was right when I described the self-respecting part of her that I stood up for in the session."}, {"id": 402, "tr": "relational_interpersonal", "doc": "Ogden (1992). Comments on T&C on initial analy", "pos": 35, "loc": "patient", "int": 0.55, "aff": "diffuse fear", "au": "Ogden", "pt": "H", "pg": 8, "pdf": "", "ppg": 233, "pcf": 0.67, "txt": "H told me that his father could at times be very kind and that the patient had loved him despite the fact that he had been frightened of him so much of the time. I asked if the patient had expected that I would yell at him for locking his keys in the car and for asking to use my phone. He said he thought he had had that feeling in a diffuse sort of way, but had not quite known why he was feeling so frightened while waiting in my waiting room. (It occurred to me that the patient may have 233 been attempting to call his wife in an effort to get her to protect him from me[as his mother had protected him from his father] and to protect me from him.) In the course of the analytic work that followed, many layers of meaning of this transference enactment (referred to by Mr . H as the “telephone caper”) came to light, including the patient's wish to be treated as a helpless little boy, thus Copyrighted Material."}, {"id": 403, "tr": "relational_interpersonal", "doc": "Ogden (1992). Comments on T&C on initial analy", "pos": 75, "loc": "none", "int": 0.1, "aff": "technical", "au": "Ogden", "pt": "unnamed", "pg": 17, "pdf": "", "ppg": 242, "pcf": 0.67, "txt": "Under such circumstances, when I feel that the patient has told me what he wants to and what he is able to, I may ask him if he has noticed his not mentioning, for example, anything about his father . (This is essentially a process of addressing 4It is essential to keep in mind that a patient's history is not a static entity that is gradually unearthed; rather it is an aspect of the patient's conscious and unconscious conception of himself, which is in a continual state of evolution and flux. In a sense, the patient's history is continually being created and re-created in the course of the analysis. Moreover, it is by no means to be assumed that the patient has a history (i.e., a sense of historicity) at the beginning of analysis. In other words, we cannot take for granted the idea that the patient has achieved a sense of continuity of self over time such that his past feels as if it is connected to his experience of himself in the present. 243 the patient's relationship to his external and internal objects in terms of resistance, i.e., in terms of the patient's conscious and unconscious objectrelated anxiety.) As with any comment addressing resistance, it is not the information “behind” the resistance that is of central concern; the focus is on what it is that the patient is afraid will happen if he tells the analyst about a given aspect of his internal life and the ways the patient has of protecting himself against this danger ."}, {"id": 404, "tr": "relational_interpersonal", "doc": "Ogden.pdf", "pos": 69, "loc": "clinician", "int": 0.8, "aff": "helpless dread", "au": "Ogden", "pt": "unnamed", "pg": 13, "pdf": "", "ppg": null, "pcf": 1.0, "txt": "The patient feels that she is in a position to get inside of you and torture you in the most brutal way possible, just as she had felt that her parents had gotten inside of her and malignantly took her over’. I went on to say that Ms B’s savage assaults were highly destructive to herself, to Dr L and to the analysis, and that they had to be put to an end. Dr L then told me that she had for some time felt that the effect of the patient on her was so destructive that it would literally kill her. She said that she could feel her blood pressure rise to levels that felt dangerously high during the sessions and had on several occasions taken extra medication for her hypertension prior to her meetings with Ms B. (Dr L had found that her blood pressure was, in fact, signiﬁcantly elevated above her regular baseline following her sessions with Ms B.) Speaking more freely now, Dr L said that she felt utterly helpless with the patient because she could not tell Ms B not to talk about her work (which constituted practically the entirety of the patient’s life)."}, {"id": 405, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 182, "loc": "clinician", "int": 0.7, "aff": "tender grief", "au": "Ogden", "pt": "Mr V", "pg": 72, "pdf": "", "ppg": 57, "pcf": 1.0, "txt": "During that week following his death, I was continually either consciously thinking of him or experiencing a diffuse background feeling of sadness and a sense of someone or something missing. So the fact that I was thinking about him did not distinguish this moment in the session with Ms C from my experience with each of my other patients that day or that week. However, what was unique to that moment in the work with Ms C was the particular way I was feeling about E.With each patient (and within each hour with each patient),the way in which I experienced the loss of E was speciﬁc to what was going on at that moment at an unconscious level in the analytic relationship. In the period of silence following the discussion of Ms C’s dream, I thought of the previous Saturday evening during which I had spent some time at E’s bedside along with his wife and their grown children.E was in a deep coma at that point.I recalled the sense of surprise and relief I felt about how warm E’s hands had felt when I held them."}, {"id": 406, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 222, "loc": "clinician", "int": 0.85, "aff": "fear, guilt, shame", "au": "Ogden", "pt": "Mr V", "pg": 85, "pdf": "", "ppg": 70, "pcf": 1.0, "txt": "I realized that if I were to get down on my hands and knees to try to pull him out,the ice would probably give way under me too and we both would be in the water unable to get out. I ran to a small island in the middle of the pond to get a long branch that I saw there.When I got back to R, he took hold of one end of the branch and I was able to pull him out of the water. In the reverie, I pictured us (in a way that felt like peering intently into a photograph) standing there silently on the ice,R numb in his cold,wet clothes. As this was occurring, I felt a combination of fear and guilt and shame about his having fallen through the ice.The pond was much closer to my house than to his and I felt I should have known the signs of weak ice and should have protected him from falling through.The shame was in part connected with the fact that I had run away from him (the reality that I was running to get a branch with which to try to pull him out did not diminish the shame)."}, {"id": 407, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 240, "loc": "clinician", "int": 0.7, "aff": "alive reverie", "au": "Ogden", "pt": "Mr V", "pg": 90, "pdf": "", "ppg": 75, "pcf": 1.0, "txt": "signiﬁcant) to his emotional experience.The patient then quickly retreated to the familiar ground of reliance on defensive omnipotence in asserting that he could be more ruthless in business than others dare to be (or even aspire to be) and that he was never the ﬁrst to ﬂinch. The long silence that occurred at that juncture was a period in which it felt to me that the patient and I were able to do a good deal of unconscious psychological work that had not been possible up to that point in the session. My reverie during that silence was one in which the memory of the incident on the pond was re-worked in the context of what had transpired in the session in the interval between the ﬁrst and second reverie. In contrast with the ﬁrst reverie which I experienced as a series of still photographic images, the new reverie was an experience of an unfolding event that felt much closer to and more alive with the feelings of an eight-year-old boy."}, {"id": 408, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 242, "loc": "dyadic", "int": 0.85, "aff": "shameful relief", "au": "Ogden", "pt": "Mr V", "pg": 90, "pdf": "", "ppg": 75, "pcf": 1.0, "txt": "I heard his reference to his parents’ ﬁnancial “stretch” (in paying for his therapy while he was homesick at college) as a comment on how he was feeling at that moment in the analysis. I told him that I thought he had felt painfully and embarrassingly like a child when he was in the passageway and that for him to behave like or even feel like a child was a very shameful thing.He did not respond with words,but there was visible relaxation in his body. Not only my words, but also the feeling-tone of my voice reﬂected my own experience in the reveries in which I had felt painfully over my head and shamefully infantile. Mr V then said,“Out there, I felt so lost.”These words were alive in a way that was different from anything that the patient had previously said or done, not only because of the softness of his voice as he spoke these words, but also because of the words themselves."}, {"id": 409, "tr": "relational_interpersonal", "doc": "Thomas H Ogden - This Art of Psychoanalysis_ D", "pos": 388, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Ogden", "pt": "none", "pg": 140, "pdf": "", "ppg": 125, "pcf": 1.0, "txt": "6 Central among the ideas that, for me, constitute a psychoanalytic perspective are a conception of the relationships among conscious, preconscious and unconscious aspects of mind; the concept of transference–countertransference; a conception of an internal object world; the idea of depressive, paranoid-schizoid and autisticcontiguous modes of generating experience and their associated forms of subjectivity, anxiety, defense, object-relatedness and psychological growth; the concepts of splitting, projective identiﬁcation and manic defense; the notion of the human need for truth; a conception of psychological aliveness and deadness; the concept of a psychological space between reality and fantasy in which the individual may develop the capacity for thinking symbolically, thereby coming imaginatively to life; the idea of the analytic frame; an understanding of the pivotal role, from birth onward, of sexuality in healthy development and in psychopathology; a conception of the way in which the development of capacities for symbolization and selfawareness are inseparable from the development of internal and external object relationships (including maternal mirroring and oedipal triangulation). 7 The names we give to feelings – for example, feeling alone, feeling lonely, feeling frightened – are broad generic categories that do not say feelings any more than the word “chocolate” says an experience of tasting chocolate. One cannot possibly communicate in words the taste of chocolate to a person who has never tasted it. Tasting, like all other sensory and emotional experiences, cannot be said. 8 My reverie experience in the work with Mr A had been extremely sparse and difﬁcult to utilize in the ﬁrst year or so of the analysis. Chapter 3 1 I use the term “object relations theory” to refer to a group of psychoanalytic theories holding in common a loosely knit set of metaphors that address the intrapsychic and interpersonal effects of relationships among unconscious “internal” objects (i.e., among unconscious split-off parts of the personality)."}, {"id": 410, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 133, "loc": "none", "int": 0.2, "aff": "reflective", "au": "Stern, D.B.", "pt": "none", "pg": 44, "pdf": "", "ppg": 25, "pcf": 0.94, "txt": "But I want to find my way to something a bit different than what these writers have told us. What I am looking for is something like going meta on an affective level: I do not only know and feel; I also know that I know and feel. That is, instead of merely feeling our experience washing over us, instead of just registering its presence as if it comes from elsewhere, we have a sense of our participation in these events, and we accept this sense of our participation. We accept our involvement, we feel it even if it seldom occurs to us to think it in words—that is, even though we cannot say exactly what we are doing or how we are doing it."}, {"id": 411, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 1087, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Stern, D.B.", "pt": "none", "pg": 254, "pdf": "", "ppg": 235, "pcf": 0.94, "txt": "If the anxiety is not too intense, our grown child, while never feeling comfortable with being angry, may be able to stay in touch with their affective experience some of the time. This way of being—that is, the part of oneself that feels angry—remains part of what Sullivan, and then Philip, Richard Chefetz (Chefetz & Bromberg, 2004; Chefetz, 2015), Elizabeth Howell (2005, 2020), I (Stern, 2010, 2015, 2019), and others, have all referred to as “me.” This part of the grown child’s experience is uncomfortable, but the anxiety responsible for the discomfort does not reach an intensity that demands dissociation. But if the anxiety is intense enough—that is, if it is either massive and/or abusive, or “developmental trauma”—then angry feelings simply do not appear in the child’s awareness when they otherwise would have. These parts of experience, because of the intensity of the anxiety, are dissociated and therefore remain unformulated, and for that reason they cannot be experienced as “me.” They are what Sullivan, Philip, Rich, Elizabeth, and I (see citations above) have all called “not-me.” “Not-me” doesn’t just disappear from consciousness: this is crucial in Philip’s model of the mind."}, {"id": 412, "tr": "relational_interpersonal", "doc": "Donnel B. Stern - On Coming into Possession of", "pos": 1099, "loc": "clinician", "int": 0.7, "aff": "absorbed wonder", "au": "Stern, D.B.", "pt": "none", "pg": 260, "pdf": "", "ppg": 241, "pcf": 0.94, "txt": "I have always been drawn to thinking about the emergent quality of expe - riencing, a state that we identify with dreaming, a feeling that we are all suspended in the midst of the processes of creation, watching the world come into being in front of our eyes and all around us, without knowing what will happen next. This compelling, lifelong experience perhaps has become even more vitalized for me under the influence of the central role of dreaming in Bion’s work—dreaming in the broadest sense, i.e., dream - ing as thinking,“waking dream thoughts.” I live most fully in the moments when I can feel that I am being “taken” by this emergent quality in clini - cal work, moments in which the patient and I relate effortlessly, deeply involved in the moment, fully engaged together in something to which we surrender (Ghent, 1990), but without necessarily knowing exactly what that “something” is, or what it is becoming. I know at these times that I am doing what I most want to do, and that
