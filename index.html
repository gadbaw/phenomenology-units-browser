richment of each partner’s capacity for self-actualization through enhanced introspection in the presence of the other. This step also accentuates each partner’s sense of ownership of the multiplicity of their personality, along with learning to negotiate seemingly irreconcilable aspects of each one’s sense of selfhood."}, {"id": 238, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 67, "loc": "none", "int": 0.3, "aff": "surprised", "au": "Ringstrom", "pt": "unnamed", "pg": 25, "pdf": "", "ppg": 8, "pcf": 1.0, "txt": "Knowing implicitly that we would have normally discussed this matter earlier in the day, and that she might have had some input about it, she retorted to our gleeful solicitations with “You didn’t give me time to know my own mind !” It was the ¿ rst time she had uttered this expression, and it certainly was not one (at the tender age of 5) we could have imagined she would have. It was possible that she had overheard our conversations about what it means to have “a mind of one’s own,” as well as to “know one’s ‘mind,’” but it seemed unfathomable that she could grasp this meaning, though at least on some implicit level she surely did. Embedded in her assertion are several critical assumptions. First, in this particular space/time coordinate, she grasped that from the standpoint of her sense of self she was unprepared to react to what had confronted her."}, {"id": 239, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 74, "loc": "none", "int": 0.1, "aff": "expository", "au": "Ringstrom", "pt": "none", "pg": 27, "pdf": "", "ppg": 10, "pcf": 1.0, "txt": "Meanwhile, though the description of these processes may seem terribly conscious, in fact much of what undergirds our sense of agency is unconscious. Thus, our intentions, our sense of purpose, derive from our unconscious self (i.e., extended and autobiographical memory). This complex memory system involves ¿ rst declarative memory, which is typically accessed through verbal symbolization. A second memory system involves our implicit (nonverbal) and procedural memory (the “autopilot” of our personality organization)."}, {"id": 240, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 81, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Ringstrom", "pt": "none", "pg": 28, "pdf": "", "ppg": 11, "pcf": 1.0, "txt": "The intersubjective ¿ eld in which each partner’s sense of agency arises is therefore an additional factor in establishing the horizons of each partner’s selfactualization (Stern, 1997 ). It means that how one lives out one’s sense of agency in terms of self-actualization must be perpetually renegotiated in intimate"}, {"id": 241, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 89, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Ringstrom", "pt": "none", "pg": 30, "pdf": "", "ppg": 13, "pcf": 1.0, "txt": "Slavin notes that the roots of this psychosocial con À ict began approximately 150,000 years ago. It was about this time when our predecessors started to develop language along with a capacity to communicate via symbols. This evolutionary feat set in motion an extraordinary schism between human beings’ raw experience of nature and our intimate relationship to it, and our capacity to re À ect upon and communicate about both our sense of nature as well as our experience of it. As these cognitive processes evolved, there developed a greater capacity of individuals to reÀ ect on their experience, hence the emergence of a more complex sense of self than had heretofore existed in the animal kingdom."}, {"id": 242, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 95, "loc": "none", "int": 0.1, "aff": "theoretical", "au": "Ringstrom", "pt": "none", "pg": 31, "pdf": "", "ppg": 14, "pcf": 1.0, "txt": "If I only see myself in your eyes in the manner that I have coerced you to see me , then I will never have a true re À ection of how I am seen by an independent other, for it is only through the independent other’s recognition—outside of one’s solipsistic fantasy—that one feels truly recognized. By contrast, feeling that one has ultimate control over the object, in fantasy or in reality, lends to a person becoming readily bored. It underscores why narcissistically organized adults end up leapfrogging from one relationship to another."}, {"id": 243, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 96, "loc": "none", "int": 0.1, "aff": "theoretical", "au": "Ringstrom", "pt": "none", "pg": 32, "pdf": "", "ppg": 15, "pcf": 1.0, "txt": "THEORETICAL OVERVIEW 15 Meanwhile, by not recognizing the degree to which narcissists coercively control others (frequently in the service of unconsciously attempting to make themselves feel safe and cohesive), they drain (in due time) any semblance of “otherness” and difference from the other. As will be illustrated in case material throughout this book, this process also manifests over and over in marriages, especially in moments of mutual negation—the necessary precursor state to mutual recognition. The antidote to this solipsistic position is to be able to embrace the difference and “otherness” (alterity) of the other. Of course, the problem in couples therapy is that recognizing one’s partner’s uniquely different subjectivity often entails some threat to one’s own sense of selfhood, especially when one is constrained by transference convictions that provide cohesion to one’s worldview through rigidly attributing what one’s partner thinks and feels, irrespective of how untrue those attributions are to one’s partner’s own experience."}, {"id": 244, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 120, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Ringstrom", "pt": "none", "pg": 37, "pdf": "", "ppg": 20, "pcf": 1.0, "txt": "Desire and egalitarianism are seldom very compatible. Indeed, too much democracy and equality makes sex boring. Meanwhile, our human need to feel safe can make us do practically anything not to lose our primary contacts (beginning ¿ rst with our parents and all ones thereafter), including suppressing our aggression, renouncing our needs, and becoming more self-reliant and consequently more and more estranged. All of this, however, À ies in the face of yet another powerful human need: our self-actualization through the articulation and expression of our sense of agency."}, {"id": 245, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 122, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Ringstrom", "pt": "none", "pg": 37, "pdf": "", "ppg": 20, "pcf": 1.0, "txt": "The question is: How? Perel notes that answers cannot come easily, if at all in any steady, consistent way, though she has some useful ideas. She notes that our entire culture is uncomfortable with vulnerability and dependency, and yet good intimate sex requires both. It is not surprising that she argues that our sense of desire lies deeply buried in the details of our childhood upbringing."}, {"id": 246, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 124, "loc": "none", "int": 0.1, "aff": "theoretical", "au": "Ringstrom", "pt": "none", "pg": 38, "pdf": "", "ppg": 21, "pcf": 1.0, "txt": "THEORETICAL OVERVIEW 21 us cold, has its roots in childhood, along with how much closeness we can or cannot feel. Part of “unlocking our erotic intelligence” very much relies upon our use of our human imagination, which Perel avers is the “central agent of eroticism.” Erotic imagination fuels our fantasy life, and it is here that what we typically are prohibited to see about ourselves is writ large, when we are ¿ nally able to bravely face it. For it is here that we come to terms with versions of our self we are less wont to see: the more ruthless, sel¿ sh, at times sadistic and cruel versions that can powerfully fuel our sense of desire, but are frightening to reveal and are frequently, according to Perel, often better off not disclosed, unless and until there is an atmosphere in which we can tell our truths safely. This atmosphere is a prerequisite for the kinds of intimate disclosures that the erotic imagination might reveal."}, {"id": 247, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 128, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Ringstrom", "pt": "none", "pg": 39, "pdf": "", "ppg": 22, "pcf": 1.0, "txt": "THEORETICAL OVERVIEW 22 with their surrounding attachment systems. It made apparent the potential risk of disclosing their individual inclinations, especially whenever these might be construed as a threat to the tribe and reciprocally therefore a threat to themselves. In the face of such conÀ ict, it is likely that early humans—and frankly humans ever since—developed the capacity to sequester these potentially “threatened-me” experiences, fearing that their disclosure might be cataclysmic. Wherever a whiff of a sense of selfhood arose, so too would a powerful sense of its prospective meaning to the other(s)—enter the earliest origins of transference."}, {"id": 248, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 189, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Ringstrom", "pt": "none", "pg": 51, "pdf": "", "ppg": 34, "pcf": 1.0, "txt": "The subjectivities of both parties are contextually intertwined, mutually shaping each other’s subjective sense of self-experiencing. Mutual recognition is not critical to their de¿ nition of intersubjectivity. Indeed, they argue that when intersubjectivity is operationally de ¿ ned by the developmental achievement of mutual recognition, it risks enforcing the analyst’s subjectivity being recognized, as importantly as that of the patient (Coburn, personal communication). Elsewhere, I have argued that this interpretation of relational psychoanalysis is incorrect (Ringstrom, 2010a , 2010b , 2010c ). 6 ௘ For example, most parents are familiar with periodic episodes in their child’s development that involve the child’s ruthless assertion of self in relation to her parent."}, {"id": 249, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 206, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Ringstrom", "pt": "none", "pg": 56, "pdf": "", "ppg": 39, "pcf": 1.0, "txt": "Understanding when organizing principles are or are not amenable to change involves adoption of Piaget’s theory of learning (Atwood & Stolorow, 1984 ), as it pertained to cognitive schemas. Piaget suggested that schemas (organizing principles) will assimilate data (i.e., the constant input of information) in as orderly and coherent a fashion as possible. As such, they assimilate new experience in terms of the inherent set of assumptions the schemas embody, and continue to do so until these schemas begin to fail to make sense of new experience. Piaget noted that, when the latter occurs, the subject is often thrown into a state of disequilibration , a state of chaos, if you will (and therefore often anxiety)."}, {"id": 250, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 216, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Ringstrom", "pt": "none", "pg": 58, "pdf": "", "ppg": 41, "pcf": 1.0, "txt": "It is a veritable impossibility for us to attend to all of these tiny permutations of communication. Therefore, what more typically gets explored and understood in this model of conjoint therapy is what I am proposing as the broader relational assumptions of each partner’s bidimensional forms of transference (the developmental, selfobject dimension versus the repetitive, conÀ ictual dimension). Bidimensional transference Returning to the initial assessment, I listen closely to how each partner expresses the following unconscious conviction: “With this partner, I hope that I will be able to actualize what heretofore I have not been able to (including my future strivings). However, with this partner, I also anticipate the dread of revisiting some unpleasant if not traumatizing experience from my past.” This conviction of course embodies the hope to reconstitute one’s growth or to repair what was traumatically broken, as counterbalanced by the dread that these hopes will be crushed, leading to retraumatization."}, {"id": 251, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 223, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "Ringstrom", "pt": "none", "pg": 60, "pdf": "", "ppg": 43, "pcf": 1.0, "txt": "STEP ONE 43 pertaining to experiences of expansiveness and ambition in the world, along with related affect states of pleasurable excitement and pride in these activities. The critical function of idealization that Kohut proposed was to provide the child with a sense of others upon whom he could trust for their provision of strength, security, leadership, values, and guidance. Finally, in twinship, otherwise known as the “alterego” selfobject function, Kohut identi ¿ ed the importance of feeling known via the other’s conveyance of a comparable experience of the world. More contemporary theoreticians, inÀ uenced by Kohut’s self psychology, took up where Kohut stopped."}, {"id": 252, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 227, "loc": "none", "int": 0.1, "aff": "theoretical", "au": "Ringstrom", "pt": "none", "pg": 61, "pdf": "", "ppg": 44, "pcf": 1.0, "txt": "STEP ONE 44 familiar, old “self” and “other” con ¿ gurations (Shane, Shane, & Gales, 1997 ), pertaining to the hopes and dreads that each partner brings to their relationship that soon become reciprocally reenacted. Indeed, it is in the manner of “present moment remembering” (Stern, 2004 ) that parts of the past can become animated, out of which, with the help of couples therapy, prospectively welcome new modes of relating can develop. Having stipulated that the repetitive dimension of transference often entails the dread of repeating past selfobject failures (Ornstein, 1974 ), the repetitive dimension can also entail the dread not to repeat past patterns of engagement, no matter how ostensibly unwanted these repetitive dreads are claimed to be. It is at these junctures that the greatest potential for change and reorganization is possible."}, {"id": 253, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 241, "loc": "patient", "int": 0.6, "aff": "vulnerable longing", "au": "Ringstrom", "pt": "Tom and Jane", "pg": 64, "pdf": "", "ppg": 47, "pcf": 1.0, "txt": "STEP ONE 47 passion is running out, but to do it, you really need Jane’s support, af¿ rmation, and encouragement [e.g., the mirroring selfobject transference]. Absent that, you are not only disappointed, you feel threatened, because this revisits the absence of support from your parents that undermined your passion from its inception [e.g., the repetitive transference]. It’s not easy for you to convey this to Jane, I’m sure, because to want something so badly, and to imagine its rejection, can make one feel vulnerable. And , it’s also not easy for her to hear what you want, because of what it triggers in her."}, {"id": 254, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 242, "loc": "patient", "int": 0.65, "aff": "betrayed, thrown", "au": "Ringstrom", "pt": "Tom and Jane", "pg": 64, "pdf": "", "ppg": 47, "pcf": 1.0, "txt": "“For you, Jane, Tom has disrupted the very thing you have always relied upon in him, and that is his stability, his predictability, and the security those qualities lent to you [e.g., the idealizing selfobject transference] that have been so reparative of the chaos of your childhood [e.g., the repetitive transference]. Indeed, it makes perfect sense to me that you feel thrown, maybe even betrayed, since you have come to count on this from Tom. “The calamity I think that the two of you have brought to me is that what you each long for is provoking something threatening in the other. In your case, Tom, wishing for Jane’s support of this new life project comes too close in her mind to revisiting the chaos that came from her father’s drinking and gambling."}, {"id": 255, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 248, "loc": "none", "int": 0.2, "aff": "hopeful abstraction", "au": "Ringstrom", "pt": "none", "pg": 65, "pdf": "", "ppg": 48, "pcf": 1.0, "txt": "Finally, all of this potentially cultivates an amazing quality of hope that had begun to feel all but lost to the couple. Assuming all goes as I have stated, another curious thing happens: Each partner begins to form their own idealizing transference to the therapist, notwithstanding that much of the repetitive dimension of the transference remains focused on each other, though somewhat mitigated by a renewed sense of hope. The idealization of the conjoint therapist has all sorts of rami ¿ cations down the line, but for now it serves as a potentially powerful bonding agent for the couple. The therapist instantly becomes a critical point of view, offering an alternative to their right/wrong, black/white, doer/done-to binary modes of relating (Benjamin, 2004 )."}, {"id": 256, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 258, "loc": "patient", "int": 0.7, "aff": "ashamed, lashing", "au": "Ringstrom", "pt": "Helena and Theo", "pg": 67, "pdf": "", "ppg": 50, "pcf": 1.0, "txt": "STEP ONE 50 taking offense at this, Theo blasted, “Oh great, I guess your night fears will kill this for me too! I guess I am on permanent babysitter duty!” Helena felt instantly ashamed. What we ¿ nally teased out was not that Helena needed Theo to stay with her (e.g., ful¿ lling a kind of primary idealizing protective selfobject function). After all, she had come to recognize and even admire the degree of self-actualization Theo accrued from his art classes."}, {"id": 257, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 263, "loc": "none", "int": 0.1, "aff": "theoretical", "au": "Ringstrom", "pt": "none", "pg": 68, "pdf": "", "ppg": 51, "pcf": 1.0, "txt": "STEP ONE 51 to be prepared for its occurrence. Relinquishing omnipotent fantasy is all the more dif¿ cult when it is intensely entwined with a kind of vitalizing affectivity. Despite all of this, it appears that our personal sense of agency functions in a most gratifying way when we feel least constrained in how we determine and pursue personal goals in work, love, and play. By contrast, agency founders to the extent it functions more for defensive purposes, which, as Gentile ( 2001 ) notes, arises in what she refers to as the “perversion of agency” that appears to agentically undermine or to “pervert” our pursuit of work and love and play."}, {"id": 258, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 266, "loc": "none", "int": 0.1, "aff": "didactic", "au": "Ringstrom", "pt": "none", "pg": 68, "pdf": "", "ppg": 51, "pcf": 1.0, "txt": "Meanwhile, both dimensions of the transference are profoundly inÀ uenced by acts of agency, insofar as an individual’s selfobject dimension of the transference is organized around seeking responsiveness to his sense of agency, while the repetitive dimension of his transference is often scanning for how it will be thwarted. (The examination of the “perversion of agency” in Step Four covers how agency is sometimes perversely employed by inducing the other to actually thwart it—in short, to replay a version of “The Jack Story.”) This manifests in ways in which partners sometimes not only actively constrain one another, but, less visibly, they actively collude with helping each other in undermining work, love, and play in their relationship. A key pathway to both personal liberation and empowerment in one’s relationship comes from each partner embracing his and her sense of agency, and not holding the other responsible for it. Each time the therapist successfully takes the couple through a systemic understanding of what got ruptured, she simultaneously provides them with a model for “rupture and repair,” one of the key “curative” ingredients in all psychotherapies, according to Beebe and Lachmann ( 1994 ). A reparative interpretation captures several salient properties: a) recognition of each partner’s stake in their problem;"}, {"id": 259, "tr": "object_relations", "doc": "[Relational Perspectives Book Series] Philip A", "pos": 269, "loc": "patient", "int": 0.4, "aff": "embattled", "au": "Ringstrom", "pt": "Tim and Valerie", "pg": 69, "pdf": "", "ppg": 52, "pcf": 1.0, "txt": "As will become clearer in Step Two, it is important that the therapist not jump to judging who the dominant is and who the submissive is, since both will likely lay claim to feeling dominated. Tim and Valerie Tim and Valerie exempli¿ ed a couple perpetually caught up in such dominance and submission struggles. They came to me as a separated couple, a mere pen stroke away from signing divorce papers. As parents of three children all under the age of 5, they both wished for reconciliation, but could barely tolerate staying in the same room with one another."}, {"id": 260, "tr": "jungian", "doc": "Roger Brooke - Jung and Phenomenology, Classic", "pos": 851, "loc": "dyadic", "int": 0.75, "aff": "tender holding", "au": "Brooke", "pt": "Elizabeth", "pg": 161, "pdf": "", "ppg": 161, "pcf": 1.0, "txt": "The little girl turned to face her; she was bruised, dirty, unkempt, and frightened. In this session and the next these images were held between us, and gently handled as though the image itself was the frightened child. Thus the image of holding a battered child shaped us in several ways: it was an image of Elizabeth’s relation to herself, my relation to Elizabeth, our relation to her image and her growing capacity to imagine, and it even touched my relationship with my own vulnerabilities and hurts as I found afterwards that I was gentler on myself for a time. Later she said she felt herself relating less ambivalently towards her pupils’ school."}, {"id": 261, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 813, "loc": "clinician", "int": 0.85, "aff": "torn, bodily tension", "au": "Schwartz-Salant", "pt": "unnamed", "pg": 156, "pdf": "", "ppg": 145, "pcf": 0.97, "txt": "What ha s happened to allow it?’ As she spoke, I felt a bodily tension, a desire to withdraw, and a sense that what she was saying felt odd. I was torn in two directions—to answer her an d not to answer—and I would have liked to answer so that the painful feelings would leave. But I could not honestly answer her question without splitting myself away from m y feelings. As I felt into this field more fully, trying to join my mind to my bodily an d emotional reactions so that I would gain some image that made sense of the interaction, I recognized that she was genuinely asking fo r understanding and inquiry."}, {"id": 262, "tr": "jungian", "doc": "David Sedgwick - The Wounded Healer_ Countertr", "pos": 258, "loc": "clinician", "int": 0.8, "aff": "embarrassed guilt", "au": "Sedgwick", "pt": "F", "pg": 73, "pdf": "", "ppg": 62, "pcf": 1.0, "txt": "The image certainly corresponded with some of my guilty feelings about not being “good enough” as analyst or even as a person. I felt embarrassed too, within this identification with her dream-healer, that my patient was caring for me, not vice versa, and sardonically noted to myself, “She is working with my anima, in solidarity, even though I don’t know what the hell I’m doing.” Discussion As indicated by my embarrassed, guilty identification, it seemed we were at the point where the transference had really “taken.” I was hooked by, and my own feelings had provided the hooks for, her projection and what it was aiming at—namely, the rehabilitation of the drunken, out of control or helpless nurturer/ mother/ father/therapist. I wasn’t sure which, though I thought the mother was herein more implicated due to her alcoholic history . If F’s dream of my “wife” did refer to my anima, then it was promising that F was positively linked with my unconscious while my conscious position was indeed that of feeling weak or powerless (to use her terms)."}, {"id": 263, "tr": "jungian", "doc": "Thomas Singer - The Cultural Complex_ Contempo", "pos": 1077, "loc": "none", "int": 0.2, "aff": "interpretive", "au": "Singer, T.", "pt": "unnamed", "pg": 223, "pdf": "", "ppg": 206, "pcf": 0.87, "txt": "Anxiety arises as much through any alteration of the sense of order (real or imagined) between the self and the other (real or imagined) as through the strains of regulating repressed drives. (Gilman 1985: 19) In my patient’s case, this anxiety is fueled by her transference to me, a representative of the dreaded and desired Other, who will lead her beyond her parents’ world and values. The (feared) loss of the parents becomes an expression of a feared change in relationship to the world generally that can come about to and through her relationship to this new Other (the analyst). The Native American man and the Black man, as animus figures connecting her to this new possibility, personify the Other that is feared and desired, and they must be possessed and subjugated in order for her to feel safe. In the transference this feared and desired animus, projected in a veiled way onto me, gets managed through distancing and encapsulating defenses and mostly is expressed, not as ambivalence toward me, but as ambivalence toward the analysis itself."}, {"id": 264, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 354, "loc": "none", "int": 0.2, "aff": "theoretical", "au": "Schwartz-Salant", "pt": "none", "pg": 72, "pdf": "", "ppg": 61, "pcf": 0.97, "txt": "Both analyst and analysand could f eel this effect. When the sense of space o r atmosphere changes, that part of the oscillation in which both people feel ‘inside’ the anxiety—that is, the experience of feeling inside the emotion itself—becomes a container pervaded by a sense of ‘Oneness.’ In the movement to the Fourth, the alchemical idea that all substances (such as sulphur, lead, and water) have two forms—one ‘ordinary’ and the other ‘philosophical’—can be experienced. In essence, affects cease to be experienced as ‘ordinary,’ as ‘things,’ and instead become something more—states of wholeness. While th e question, ‘Whose anxiety?’ may be sorted out in this way, the answer is never the end result, but rather the answer is the Third on the way to the Fourth in which the mystery of containment comes to be known."}, {"id": 265, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 366, "loc": "none", "int": 0.2, "aff": "theoretical", "au": "Schwartz-Salant", "pt": "none", "pg": 74, "pdf": "", "ppg": 63, "pcf": 0.97, "txt": "Th e level of Threeness does not have the felt boundaries of the Four. In a sense, the level of the Three calls out fo r interpretation as an expansive act, but perhaps also as an act th at defends the analyst against the kind o f intimacy that can evolve into the movement to Fourness. For in the movement to Four, the observer’s ‘wholeness’ (von Franz 1974, 122) becomes involved, leading to the paradoxical sense of a subjective objectivity, and to a felt sense of Oneness. However, in the case of the creative youn g woman’s experience with her intrusive father, the analysand’s psyche still contains the previous image of an actual or imaginal violation."}, {"id": 266, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 395, "loc": "patient", "int": 0.6, "aff": "engulfed/clear", "au": "Schwartz-Salant", "pt": "unnamed", "pg": 79, "pdf": "", "ppg": 68, "pcf": 0.97, "txt": "When a complex constellates, its body, to one degree or another, takes over the body of the ego. For example, a male analysand having difficulty feeling his own autonomy was unusually spirited and clear at the outset of a session with me, and he stated metaphorically: ‘Today I woke up in my own house.’ He went on to explain that usua lly he awakes ‘in his mother’s house.’ He was using this metaphor to express an experience of losing his own body-awareness; instead he felt engulfed in his mother’s body image or that body image constructed by their interactions during his childhood. When he awoke ‘in his own house,’ in his own body, he felt certain business problems in his life as issues to attend to; when he awoke ‘in his mother’s house’ these same problems were felt as overwhelming and persecutory. His behavior would then take on an ‘as if’ quality, in sharp distinction to the clarity and strength he manifested when he was ‘in his own house.’ The body of the complex has to be dissolved."}, {"id": 267, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 767, "loc": "dyadic", "int": 0.75, "aff": "anxious connection", "au": "Schwartz-Salant", "pt": "unnamed", "pg": 145, "pdf": "", "ppg": 134, "pcf": 0.97, "txt": "Acknowledging this merger meant that he would have to feel needs that were unthinkable. When I could sort this state out for myself and tell him about it, for a minute or two the field between us became clear and related. As we then sat with each other and this cl arity, he soon became anxious. We could thus both feel a connection, a sense of an en ergized space between us, but a space that frightened him as he felt the desire to fuse with me, indeed to merge into me."}, {"id": 268, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 872, "loc": "none", "int": 0.2, "aff": "hypothetical", "au": "Schwartz-Salant", "pt": "unnamed", "pg": 167, "pdf": "", "ppg": 156, "pcf": 0.97, "txt": "As he searches in this wa y, all the while maintaining emotional contact with his wife by noting that he needs to ex perience his feelings, he may come up with something new. Rather than feeling worn-out notions of being attacked or diminished, he may feel that she is feeling contemptuous of him. The word ‘contempt,’ like finding the right word in a poem, may thus appear. He ma y ask her if this word makes sense: ‘Were you feeling contemptuous of me?’ And suppose his wife, perhaps after a bout o f resistance which he does not allow to detract hi m from his search, agrees that she did feel contempt for him."}, {"id": 269, "tr": "jungian", "doc": "David Sedgwick - The Wounded Healer_ Countertr", "pos": 197, "loc": "clinician", "int": 0.6, "aff": "self-critical helpless", "au": "Sedgwick", "pt": "F", "pg": 56, "pdf": "", "ppg": 45, "pcf": 1.0, "txt": "Transference Countertransference F gently but rather persistently I kicked myself for in effect complained that I had offering the option, if not “promised” her a reduced fee. “promise,” of a reduction. When I asked instead what a fee She already felt “special” to me— change might mean to her, F said too special I thought. I was trying she would feel powerful and not to feel helpless and in her special, not “helpless” and power. somehow obligated to me."}, {"id": 270, "tr": "jungian", "doc": "David Sedgwick - The Wounded Healer_ Countertr", "pos": 270, "loc": "clinician", "int": 0.65, "aff": "hollow loss", "au": "Sedgwick", "pt": "F", "pg": 76, "pdf": "", "ppg": 65, "pcf": 1.0, "txt": "I do feel some competifather. tive loss, her preferring S.” She’d “do anything to stay in Though she reassured me, I felt therapy,” and wondered if once a the loss. week would be OK. [At the end, I congratulated her This felt hollow. I later wrote, “I on her new job]. need to be therapist, not friend, to her.” 29. Transference Countertransference Unable to get a sitter, F A test, a concretization? I felt (unannounced) brought her child surprised and a little irritated. into a session."}, {"id": 271, "tr": "jungian", "doc": "Roger Brooke - Jung and Phenomenology, Classic", "pos": 843, "loc": "clinician", "int": 0.5, "aff": "attuned reflective", "au": "Brooke", "pt": "Elizabeth", "pg": 161, "pdf": "", "ppg": 161, "pcf": 1.0, "txt": "I suggested she stay with it until she could tell me more about it. She felt it was a positive image and it had something to do with feeling free. I silently recalled her sense of being imprisoned in her experience of her mother’s body as steel cold and hard, and of a steel ball she had imagined surrounding her own foetal heart. Putting these thoughts together I suggested that she wanted to hack herself out of her mother’s cold dead body."}, {"id": 272, "tr": "jungian", "doc": "Roger Brooke - Jung and Phenomenology, Classic", "pos": 857, "loc": "patient", "int": 0.55, "aff": "tender containing", "au": "Brooke", "pt": "Elizabeth", "pg": 163, "pdf": "", "ppg": 163, "pcf": 1.0, "txt": "I could not perceive her feelings immediately in her bodily presence, but could do so more often and more accurately after this time. Elizabeth seemed to have a real pleasure in finding that her body was sad, or homeless, or afraid. Third, Elizabeth’s body became a place in which she could hold the little girl self. Thus, while she felt the little girl’s feeling bodily, she also felt her body had a containing maternal power to hold those feelings without herself being frightened and over-controlling (with the leash)."}, {"id": 273, "tr": "jungian", "doc": "Roger Brooke - Jung and Phenomenology, Classic", "pos": 867, "loc": "dyadic", "int": 0.85, "aff": "embodied attunement", "au": "Brooke", "pt": "Elizabeth", "pg": 165, "pdf": "", "ppg": 165, "pcf": 1.0, "txt": "As such, our bodies inhabited both a professional frame and a psychological world and we understood each other in those terms. When Elizabeth felt herself to be in ‘orbit’, no longer anchored to the earth, I could not see her; when she felt isolated and abandoned I found myself trying to reach across an abyss; when she felt gently held by me I felt my own body open to her presence and my voice would soften as well; and it was my body rather than a detached intellectual understanding that would let me know whether her expressed anger was delusional or symbolised. This flexible, pre-articulate understanding Merleau-Ponty describes in terms of the ‘anonymity’ of the body. What analytical psychotherapy and the present clinical study suggest is that this flexibility is imaged as various figures."}, {"id": 274, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 277, "loc": "dyadic", "int": 0.7, "aff": "undigested unease", "au": "Schwartz-Salant", "pt": "unnamed", "pg": 61, "pdf": "", "ppg": 50, "pcf": 0.97, "txt": "Furthermore, if as a group we now just went on as she wanted us to do, I felt that something had not been digested, as if a stone had been swallowed. Yet we all seemed to feel an overwhelming desire that this uncomfortable feeling and an accompanying quality of mental blankness would just pass. While we were all trying to sort through not only the expe riences the aforementi oned two people in the group had of Nell’s behavior but also our own feelings and states, Nell suggested tha t saying seemingly dismissive things made her feel very strong. She added that at these times, especially, she knew that she had two parts to her: one, a terrified little girl; and the other, a very strong adult."}, {"id": 275, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 302, "loc": "clinician", "int": 0.8, "aff": "fractured chaotic", "au": "Schwartz-Salant", "pt": "unnamed", "pg": 64, "pdf": "", "ppg": 53, "pcf": 0.97, "txt": "I realized that my mind felt as if it was bein g fractured. So, I asked him if he felt under an inner attack of some kind, and if his mind was being fractured into small parts creating a disorder as he talked. He readily acknowledged this inner attack, wondered how I knew, and admitted feeling ashamed of this, often chronic, experience. So I had at least established that a very chaotic state existed between us, and surely one that often ran his own mental processes."}, {"id": 276, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 347, "loc": "dyadic", "int": 0.55, "aff": "opposing tension", "au": "Schwartz-Salant", "pt": "none", "pg": 71, "pdf": "", "ppg": 60, "pcf": 0.97, "txt": "For example, the an alyst may experience a tendency to talk without much restraint, and the analysand may feel gripped by a silence; or the analyst may feel depressed, while a manic quality dominates the analysand; the analyst may feel disgust or hatred, and the an alysand may be filled with feelings of love and attraction. Generally, any pair of opposites may register in this way. For example, the field’s dyna mics in a syntonic-like coun ter-transference reaction may focus on anxiety. Whos e anxiety is it—mine or the anal ysand’s?"}, {"id": 277, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 365, "loc": "dyadic", "int": 0.5, "aff": "rhythmic pull", "au": "Schwartz-Salant", "pt": "none", "pg": 74, "pdf": "", "ppg": 63, "pcf": 0.97, "txt": "In effect, Three can be a union st ate, the alchemical coniunctio. At this stage, analyst and analysand often feel a current inherent in th e field in which they feel alternately pulled towards, then separated from, the other pe rson. This dynamic is the rhythm of the coniunctio as a Three quality of the field become s the Oneness of the Four. ‘The numbe r four,’ von Franz suggests, ‘c onstitutes a “field” with an internal closed rhythmic movement that proceeds to fan out from the center [and] contracts back to the center’ (1974, 124). Furthermore, the move fr om Three to Four is one in which a sense o f finiteness is felt (von Franz 1974, 122)."}, {"id": 278, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 482, "loc": "dyadic", "int": 0.9, "aff": "deprived pain", "au": "Schwartz-Salant", "pt": "unnamed", "pg": 94, "pdf": "", "ppg": 83, "pcf": 0.97, "txt": "Being with her was physically and psychically painful for me: my body felt tight and inwardly tormented. Given the clarity we had achieved up to this point, for reasons I did not understand myself at the time, but which included a trust and belief that we coul d ‘use’ each other, I chose to ask a question aloud: ‘What do we constellate together. Not just you or me but both of us?’ She replied, afte r reflecting: ‘You’re like my mother. I reach forward, and for a moment, she is there, but then she is gone.’ She felt that she was in a state o f extreme deprivation; I also felt very depriv ed by her, deprived of connection and any feeling that would take away the pain and confusion I felt."}, {"id": 279, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 668, "loc": "clinician", "int": 0.6, "aff": "uncomfortable avoidance", "au": "Schwartz-Salant", "pt": "unnamed", "pg": 126, "pdf": "", "ppg": 115, "pcf": 0.97, "txt": "We had deal t with these issues many times in our sessions, and turning to them now was a way o f escaping something very uncomfortable, for th e deeper I allowed myself to feel what I was presently feeling, the le ss comfortable I felt. A strange sense of a chasm existed The alchemical view of madness 115"}, {"id": 280, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 815, "loc": "clinician", "int": 0.75, "aff": "empty conflict", "au": "Schwartz-Salant", "pt": "unnamed", "pg": 157, "pdf": "", "ppg": 146, "pcf": 0.97, "txt": "I felt the conflicting nature of the opposites in the psychotic area to the extent that trying to formulate some answ er quickly turned into a sense of emptiness and of having no answer. In the one state, I could give answers. I could say something like, ‘You’ve achieved a lot by working so hard on your relationship with her, and it is bearing fruit.’ In other words I could have mirrored her need to be seen as special and important; and while this reflection would have satisfied her, and the discomfort that I felt probably would have passed, I could not empathize in a fully embodied and genuine way. Instead, as I intentionally engaged the fiel d—feeling these shifting states and allowing myself to use the field as an object (as in active imagination), seeing and feeling the object, and then experiencing myself being in it—my perception of annihilating opposites emerged."}, {"id": 281, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 954, "loc": "clinician", "int": 0.9, "aff": "violent guilt", "au": "Schwartz-Salant", "pt": "unnamed", "pg": 192, "pdf": "", "ppg": 181, "pcf": 0.97, "txt": "When I insisted that only a change of form in the connec tion had occurred, I denied what she experienced, namely a space in which sh e had absolutely no lin k with me or with herself. After another session, feeling th e stress of my work with he r, I recorded the following imaginal process: I want to thrash her, drown her in a stormy sea, throw her body to and fro in the waves until she will stop this torture of me with her withdrawals and masochism, leaving me always the guilty party. More and more I feel as if I have committed incest with her. I feel as if I am her guilty brother who did it to her and then denied it."}, {"id": 282, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 955, "loc": "clinician", "int": 0.8, "aff": "unreal guilt", "au": "Schwartz-Salant", "pt": "unnamed", "pg": 192, "pdf": "", "ppg": 181, "pcf": 0.97, "txt": "I feel the edges of losing the as-if. Did I do it or didn’t I? I recognized that unconsciously I may have felt this identification for some time, namely that I was her older brother, the one who had incestuously violated her. As a consequence of denying this level of psychotic countertran sference, I had been fo rcing interpretations and trying to feel empathic and related to her, rather than feel ing the air of unreality which actually pervaded our work."}, {"id": 283, "tr": "jungian", "doc": "J Analytical Psychology - 2006 - McKenzie - Qu", "pos": 16, "loc": "clinician", "int": 0.7, "aff": "uneasy guilt", "au": "McKenzie", "pt": "Kate", "pg": 4, "pdf": "", "ppg": 404, "pcf": 1.0, "txt": "The stories of her transsexual life were presented with skill and always with an edge of dark humour. The darkness of the humour deepened for me as I became aware of my growing anxiety. I felt uneasy as Kate told stories of the surgical removal of her male parts and her use of hormones to develop her femaleness, and her constant fear of being confronted as a man trying to pass as a woman. I began to think clinically about her, guiltily wanting to diagnose this person who was making me so uncomfortable!"}, {"id": 284, "tr": "jungian", "doc": "J Analytical Psychology - 2006 - McKenzie - Qu", "pos": 60, "loc": "none", "int": 0.0, "aff": "theoretical", "au": "McKenzie", "pt": "none", "pg": 12, "pdf": "", "ppg": 412, "pcf": 1.0, "txt": "A revision of Jungian gende r theory that embraces all genders and sexualities is needed not only to inform our clinical work but also to allow us to bring Jungian thought to contemporary gender theory. The neurosciences, archetype, and gender In the last few decades there has been a rapid growth in the scientific understanding of conscious and unconscious processes inspiring a new Jungian exploration of archetype and complex. The developmental neurosciences are in creasingly focused on the body, on the importance of body biology and em bodied experience to the emergence of mind. From Daniel Stern’s ( 1985) concept of the ‘preco nscious emergent self’ to Antonio Damasio’s ( 1999) more recent ‘proto-self’, we are introduced to the neurobiology of body feeling states that precede consciousness, ‘having the feeling is not the same as knowing the f eeling, that reflection on feeling is yet another step up…all of these processes—emotion, feeling, consciousness— depend for their execution on represen tations of the organism."}, {"id": 285, "tr": "jungian", "doc": "J Analytical Psychology - 2008 - Bravesmith - ", "pos": 48, "loc": "clinician", "int": 0.75, "aff": "shameful voyeurism", "au": "Bravesmith", "pt": "unnamed", "pg": 11, "pdf": "", "ppg": 111, "pcf": 1.0, "txt": "He continued to describe the session but I found myself preoccupied with the DVD and a connection between whatever it contained and the seat of the chair where the patient’s thighs and genitals would have been recently—before the move to the couch. My fantasy was of pornographic images on film. At the same time I began to feel guilty, ashamed of salacious thoughts and like a voyeur. What meaning or possible relevance could this have to the work I was supervising?"}, {"id": 286, "tr": "jungian", "doc": "David Sedgwick - The Wounded Healer_ Countertr", "pos": 183, "loc": "clinician", "int": 0.5, "aff": "preformed bias", "au": "Sedgwick", "pt": "F", "pg": 52, "pdf": "", "ppg": 41, "pcf": 1.0, "txt": "Already I had a personal agenda that, however understandable, colored my responses—new patients. Already I had begun to form an image (“flower child”) of this unseen patient. Already, perhaps, I had flunked her first test of me. These early images, in both directions between analyst and patient, have an almost tangible quality to them (a “feeling” as well as a visual image) and might be called “feeling images.” 1 They are subject to pre-existing transferences and countertransferences."}, {"id": 287, "tr": "jungian", "doc": "David Sedgwick - The Wounded Healer_ Countertr", "pos": 225, "loc": "clinician", "int": 0.75, "aff": "eroticized charge", "au": "Sedgwick", "pt": "F", "pg": 64, "pdf": "", "ppg": 53, "pcf": 1.0, "txt": "And I am getting a charge out of this attractive,fairly swinging, sometimes available ‘Jungian’ female. Though I told her it was ‘analysis only’ here, her ‘I want you to love me but need you not to’ has been acting on me directly. I was indeed disappointed that, in my fantasy at least, this woman was not directing her charms toward me. I felt the loss.” Transference Countertransference F said, “I feel like a spider, trying I didn’t really think of Fas a to lure you in with talk about spider, but she did continue to sex.” She first felt shame, but have a certain bewitching effect later added she didn ‘t feel on me."}, {"id": 288, "tr": "jungian", "doc": "David Sedgwick - The Wounded Healer_ Countertr", "pos": 234, "loc": "clinician", "int": 0.5, "aff": "uneasy, guilty", "au": "Sedgwick", "pt": "F", "pg": 66, "pdf": "", "ppg": 55, "pcf": 1.0, "txt": "Transference Countertransference [F’s husband called to say I felt uneasy talking to him. A she would be late for the session. little afraid or guilty? I said, formally, “Thank you for calling.”]"}, {"id": 289, "tr": "jungian", "doc": "David Sedgwick - The Wounded Healer_ Countertr", "pos": 247, "loc": "dyadic", "int": 0.8, "aff": "powerless, tender restraint", "au": "Sedgwick", "pt": "F", "pg": 70, "pdf": "", "ppg": 59, "pcf": 1.0, "txt": "If the therapist is really embodying certain aspects of the client’s psyche, then such shifts in the therapist may have modifying effect on the constellated complex(es). Like him, I gave her only “ As she dressed me down, I was structure” but not support, and reminded of a mentor’s remark like her father and husband I was about how vital it was to be able essentially “powerless, helpless to really get mad at his analyst. and weak.” She felt “lost in the crowd” of my While she wept, I felt the impulse other patients. She cried to reach out and touch her on the copiously and noted her “terror shoulder in a kindly way. I decided that if I don’t get attention, it would be inappropriate to do so."}, {"id": 290, "tr": "jungian", "doc": "David Sedgwick - The Wounded Healer_ Countertr", "pos": 350, "loc": "clinician", "int": 0.55, "aff": "intimate availability", "au": "Sedgwick", "pt": "F", "pg": 95, "pdf": "", "ppg": 84, "pcf": 1.0, "txt": "CASE ILLUSTRATIONS 84 Discussion While this dream suggested on the objective level that F might be “interfering” (as she feared) with my family life, it also signalled the possibility that I could be more “available” to her emotional “call” (as she synchronistically requested that very day). The dream especially its feeling tone—imaged an intimate, “familiar” relationship and that image/feeling allowed me to bring the necessary availability of feeling to her in session. Whatever F represented to me subjectively was closer to home. As I integrated this internal F into my inner “family,” so to speak, the outer F’s needs did not seem so much like “interference” to me, her or my marriage."}, {"id": 291, "tr": "jungian", "doc": "David Sedgwick - The Wounded Healer_ Countertr", "pos": 356, "loc": "clinician", "int": 0.65, "aff": "daring, relieved", "au": "Sedgwick", "pt": "F", "pg": 96, "pdf": "", "ppg": 85, "pcf": 1.0, "txt": "Transference Countertransference [1 asked her, “What about my Feeling more daring. style?”] F then criticized my She didn’t sugar-coat it, but “workaholism, neglect of the neither did I feel all of this was child that wants to play, exactly true of me. It really intimacy problems and neglect of didn’t click, though I considered family and spouse.” it. F spoke of her father’s “never at a I’d felt compelled to appear that loss” persona. way with her. She added her growing disrespect I felt some relief-figuring she for various men at work, who must have known that I had been had “never been in therapy… I in analysis. can’t trust them or look up to them…they’re cut off from I was glad these guys were huge areas of themselves.” getting it, not me."}, {"id": 292, "tr": "jungian", "doc": "David Sedgwick - The Wounded Healer_ Countertr", "pos": 548, "loc": "none", "int": 0.2, "aff": "theoretical", "au": "Sedgwick", "pt": "none", "pg": 138, "pdf": "", "ppg": 127, "pcf": 1.0, "txt": "Validation Therefore, regardless of which fork the analyst has tended to accent—incubation or interpretation—some general validation procedures are necessary. When the analyst has been struggling faithfully with countertransference issues, a “felt” shift in the overall image (or in the quality, tone or anxiety level in the session) can be perceived. An accompanying, relieving sense of understanding and insight may contribute to the so-called “‘aha!’ experience.” In general, and with suitable conscientiousness on the analyst’s part, these imaginal changes in the “patient” can be trusted as accurate indications of shifts (or potentialities) in the actual patient. The client’s associations, à la Langs, can also be either an effective monitor of change or a response to specific interventions based on these countertransference processes, silent or spoken."}, {"id": 293, "tr": "jungian", "doc": "David Sedgwick - The Wounded Healer_ Countertr", "pos": 613, "loc": "clinician", "int": 0.7, "aff": "bristling, defensive", "au": "Sedgwick", "pt": "unnamed", "pg": 152, "pdf": "", "ppg": 141, "pcf": 1.0, "txt": "CONCLUSIONS 141 bristled inwardly in protest, not wanting to be shut out from him and that possibility. When he undertook to criticize “people from the 60s’’ (like me) as compared to the “New Age” he felt part of, I felt impelled to straighten him out on the facts (protecting “my generation” and myself). Ultimately , to deflate this pomposity one time, I noted something like, “There’s nothing you’re mentioning here that people in the 60s, and indeed throughout this century and others, have not considered.” “Spiritual” materialism, I felt, is really no different than any other kind of competition (he was a business student). However, for all the competition in the field, this person needed to feel unique and even to be hostile, for developmental and compensatory reasons."}, {"id": 294, "tr": "jungian", "doc": "Thomas Singer - The Cultural Complex_ Contempo", "pos": 610, "loc": "none", "int": 0.0, "aff": "none", "au": "Singer, T.", "pt": "none", "pg": 121, "pdf": "", "ppg": 104, "pcf": 0.87, "txt": "Nevertheless, by reviewing the most relevant literature concerning this theme, a quite intriguing subject stands out and indicates the path for our investigation: the implicit feeling of inferiority in the Brazilian people, something that is often referred to as “the cucaracha complex” or “the underdeveloped Latin-American stigma.” Although this is not always explicitly stated, examples of this feeling of inferiority are more than evident in daily life, literature, myths, ﬁlms and TV shows, specially when the middle-class Brazilian people compare themselves with foreigners. Taking into consideration these various ingredients in the “Brazilian pot”, our question is whether corruption can be considered a symptom of this marked feeling of inferiority? In this sense, is corruption – as evidenced by the compulsive and chronic behavior of tricking the law and authority – the expression of a people that unconsciously feels too infantile, weak or impotent to openly make a claim for its rights? Bearing these questions in mind and based on psychological and sociological studies and on articles published by the media, three approaches have been adopted in order to explore our hypothesis: ﬁeld observations, anthropological and sociological research, and research with the analysts."}, {"id": 295, "tr": "jungian", "doc": "Thomas Singer - The Cultural Complex_ Contempo", "pos": 633, "loc": "clinician", "int": 0.5, "aff": "stupid, inferior", "au": "Singer, T.", "pt": "none", "pg": 126, "pdf": "", "ppg": 109, "pcf": 0.87, "txt": "According to some colleagues, the low response rate was attributed to the difﬁculty of the questions. Some seemed to feel that each question had to be answered almost as if it were a dissertation, while others said that they needed a lot of time to do ﬁeld research, and therefore abstained from replying. One analyst said that his ﬁrst reaction was: I didn’t understand a thing. I felt rather stupid, but looking again at the title I realized that this feeling of inferiority or resistance to filling out the questionnaire when faced by its very abstract questions could be the cultural complex itself talking (an interpretation of my own countertransference)."}, {"id": 296, "tr": "jungian", "doc": "Thomas Singer - The Cultural Complex_ Contempo", "pos": 1147, "loc": "none", "int": 0.2, "aff": "reflective", "au": "Singer, T.", "pt": "unnamed", "pg": 238, "pdf": "", "ppg": 221, "pcf": 0.87, "txt": "is the experience, and my unconscious sense of privilege which I am compelled to protect, that calls up and gives shape to the imagined threat and calls it “cuckoo.” It may be that this fear is archetypal, as, perhaps, is the fear of the whitewash. Or rather, perhaps they can be seen as a pair of fears that image the archetypal linkage in that relationship between the centre and the margins. It is certainly possible that the fear of a return to a primitive state of mind can be termed archetypal, but for Jung, this became ﬁxed to the external object, to the modern black African and to the risk he referred to as “going black.” He ﬁlled out the “primordial image” with “the material of the conscious experience,” with cultural and personal projections and used it as a justiﬁcation for his own fears and fantasies. Unfortunately he also loaded his conclusions about Africans, Asians, African Americans and others with all the weight of his influence and of the universality of the archetype."}, {"id": 297, "tr": "jungian", "doc": "Roger Brooke - Jung and Phenomenology, Classic", "pos": 410, "loc": "none", "int": 0.0, "aff": "none", "au": "Brooke", "pt": "none", "pg": 81, "pdf": "", "ppg": 81, "pcf": 1.0, "txt": "relations between consciousness (archetypally structured, perhaps) and archetypal images. Even the postulated noumenon is no longer ‘out there’ but is equally the unknowable intra-psychic source of archetypal images. Otherness evaporates and relationships collapse into identities. Just as the religious person ‘relates’ to God by ‘projecting’ the ‘corresponding’ psychic God-image, so the child relates to his mother by projecting an internal image of mother on to her, the father relates to his children by projecting an internal image of the child on to them, the woman relates to her lover by projecting her animus on to him, and the parishioner relates to her priest through the projected image of the priest."}, {"id": 298, "tr": "jungian", "doc": "Roger Brooke - Jung and Phenomenology, Classic", "pos": 603, "loc": "patient", "int": 0.45, "aff": "bodily unease", "au": "Brooke", "pt": "none", "pg": 113, "pdf": "", "ppg": 113, "pcf": 1.0, "txt": "now). Part of the reason for this may be that insufficient attention has been given by the existential phenomenologists to the experience of interiority as a bodily experience. It cannot be denied, for instance, that patients say in one way or another: ‘I feel something inside me that is trying to get out.’ It may be a shaky feeling in the stomach, a tension in the throat, a feeling of increasing sexual arousal, and it may be dreamed as being pregnant or having a snake emerge from one’s mouth. One’s self as a bodily interior may also be felt to contain others: the warm presence of a distant lover, for instance, or in some pathological states persecutory parental figures."}, {"id": 299, "tr": "jungian", "doc": "Roger Brooke - Jung and Phenomenology, Classic", "pos": 607, "loc": "patient", "int": 0.4, "aff": "frustrated, empty", "au": "Brooke", "pt": "none", "pg": 113, "pdf": "", "ppg": 113, "pcf": 1.0, "txt": "Further, it suggests that psychology’s focus on ‘inner experience’ is not merely a misarticulation of existential bodyhood but an attempt to rescue psychological life (or the holy) in the place at which it is now largely to be found. (Witness the array of ‘body therapies’!) The second reflection, however, affirms that, despite this interiorisation of psychological life, a more careful phenomenology of bodily experience shows that bodily interiority is not the source of experience or of selfhood but the medium of its appropriation. It is true that one can feel something in one’s body (identity, an emergent self, or even the presence of others). However, staying attentively with that bodily experience to its proper moment of articulation yields a ‘felt sense’ which is always situated within a world-disclosive context (Gendlin 1978, 1978–9). Thus a patient may speak superficially about various people and events then begin to feel frustrated and empty."}, {"id": 300, "tr": "jungian", "doc": "Roger Brooke - Jung and Phenomenology, Classic", "pos": 835, "loc": "patient", "int": 0.5, "aff": "lonely, anxious", "au": "Brooke", "pt": "Elizabeth", "pg": 159, "pdf": "", "ppg": 159, "pcf": 1.0, "txt": "She was a friendly person, but she felt lonely and had an unrelenting subliminal sense of abandonment. Looking back on her relationships with others, she said she felt as though she had been acting, despite apparent involvement, and she was aware that in some way she kept others at a distance out of a fear that she would overwhelm and destroy them with her needs. Elizabeth looked anxious and dilapidated. Her clothes were mostly black and her hair was dishevelled."}, {"id": 301, "tr": "jungian", "doc": "Roger Brooke - Jung and Phenomenology, Classic", "pos": 840, "loc": "patient", "int": 0.55, "aff": "alive, dependent", "au": "Brooke", "pt": "Elizabeth", "pg": 159, "pdf": "", "ppg": 159, "pcf": 1.0, "txt": "In the two years since starting therapy Elizabeth had changed considerably. The ‘fog’, panic attacks, and depersonalised states had been gone almost continuously for about a year; she felt real and alive, although still with tension in her body; she had discovered that feelings could be subtle and ordinary and not only archaic and absolute; she had discovered and attained a continuity in her experience, so that feelings from one session were carried to the next, and she missed friends who were absent; she not only felt dependent on me but was starting to enjoy this; she had developed a capacity to imagine, so she could ‘play’ with fantasies about me, for instance, without undue anxiety or guilt; she was beginning to take more adult responsibility for her life; she was sorting out her own values from the fragmented clutter with which she had lived; after having once confessed the terrible truth that she did not actually care about anybody at all and only used people to help her feel alive, real, and worthwhile, she had discovered a spontaneous, genuine capacity for care. These movements seemed to anticipate the imaginal and structural events that followed, but it is equally true that these events consolidated at a deeper level the changes that had occurred but which seemed dependent on her ongoing therapy for their maintenance and continuity. Up to this time, the ‘tension’ in Elizabeth’s body was 159"}, {"id": 302, "tr": "jungian", "doc": "Roger Brooke - Jung and Phenomenology, Classic", "pos": 850, "loc": "dyadic", "int": 0.6, "aff": "anxious courage", "au": "Brooke", "pt": "Elizabeth", "pg": 161, "pdf": "", "ppg": 161, "pcf": 1.0, "txt": "In the next session she reported how the image had shocked her, for it had made her realise the extent to which she wilfully embodied those ruthless qualities she saw in her mother. The image was still present and vivid, so we stayed with it. It seemed rather stuck, however, so after a while I asked whether there might be another way of relating to that little girl who was, after all, her self. With anxiety and considerable courage she crouched down, put an arm around the girl (so that the girl would not run away or attack her), and undid the leash."}, {"id": 303, "tr": "jungian", "doc": "Roger Brooke - Jung and Phenomenology, Classic", "pos": 856, "loc": "dyadic", "int": 0.5, "aff": "disembodied, split-off", "au": "Brooke", "pt": "Elizabeth", "pg": 163, "pdf": "", "ppg": 163, "pcf": 1.0, "txt": "Second, her feelings came to be embodied more clearly and fully. Although she had certainly come a long way in being able to access a feeling life, up to this time feelings lacked body and had no felt place. Happiness, sadness, fear, and anger had been primarily head-experiences for her (by which I do mean something more than ‘thoughts’), and for me they had been sensed in her behaviour, often split off and disowned. Interestingly enough, up to this time I often did not know what she was feeling if she was sitting or lying still and if she did not tell me."}, {"id": 304, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 216, "loc": "patient", "int": 0.6, "aff": "deluged, aching", "au": "Schwartz-Salant", "pt": "unnamed", "pg": 51, "pdf": "", "ppg": 40, "pcf": 0.97, "txt": "As these shifting states continued, she felt deluged uncontrollably by these thoughts, and her whol e body began to ache. She coul d not recall any of the initial experience of beauty and grace; this had been tota lly eclipsed. If her nonpsychotic area had been involved or if she did not have such a significant psychotic sector, she might feel such beauty, and then thoughts of the reality involved in actually having the cat might have intruded, perhaps tempering any ideas of actually getting a cat. In turn, the presence of the cat could begin to internal ize the development of an inner symbol, a feeling of an ‘inner cat,’ pe rhaps representing her own se lf-image of grace and beauty."}, {"id": 305, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 246, "loc": "clinician", "int": 0.45, "aff": "confused", "au": "Schwartz-Salant", "pt": "none", "pg": 56, "pdf": "", "ppg": 45, "pcf": 0.97, "txt": "But in the case o f dealing with a psychotic complex, X and Y re present states of mind that do not exist with equanimity, and in combinati on they either annihilate on e another or create a sense o f bizarreness. Their opposition cannot be dealt with as if a hypnotic world of trance logic existed; instead, they leave one suspended in a state of confusion. The best the analyst can do, at the outset of experiencing this state, is to be confused. But it is important not to be confused about being confused."}, {"id": 306, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 253, "loc": "patient", "int": 0.55, "aff": "bewildered suspension", "au": "Schwartz-Salant", "pt": "unnamed", "pg": 57, "pdf": "", "ppg": 46, "pcf": 0.97, "txt": "For example, a borderline woman who had successfully worked through a number of defenses hiding the psychotic part, notably idealization, spoke of not feeling dead but not feeling alive. She said she did not feel full, nor did she f eel empty. Instead, any quality was felt within a bewildering state of being neither X nor not X. This state of suspension ruled."}, {"id": 307, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 270, "loc": "patient", "int": 0.7, "aff": "terrified, dissociated", "au": "Schwartz-Salant", "pt": "unnamed", "pg": 60, "pdf": "", "ppg": 49, "pcf": 0.97, "txt": "For a brief instant, he lost a sense of who I was, and he believed that I was his mother. When he regained his sense of who I really was, he became terrified. It was clear th at his dissociative process, which literally destroyed his capacity to think, was itself a defense against this more bizarre background state in which objects lost their reality as they were assimilated by his internal maternal image. Through actively engaging these mad areas, gradually , a sense of containment emerged, and his psychotic states diminished."}, {"id": 308, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 307, "loc": "dyadic", "int": 0.7, "aff": "oscillating, connected", "au": "Schwartz-Salant", "pt": "unnamed", "pg": 65, "pdf": "", "ppg": 54, "pcf": 0.97, "txt": "In a sense, I had gained a ki nd of container for his experi ence. Opposites existed, but while he was on one side, for example, feeling love, he could quickly and rather suddenly jump to another side in which love and hatred were merged. Then he could jump to feeling hatred alone, by recalling, for exam ple, certain childhood experiences, and more order emerged, and even a sense of connect ion—Eros between us—and then a return to haziness as this faded. Were we, in the la nguage of Chaos Theory, in a ‘strange attractor?’ Any slight shift in my attention caused whatever order th at existed to blur o r change."}, {"id": 309, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 348, "loc": "clinician", "int": 0.5, "aff": "uncertain anxiety", "au": "Schwartz-Salant", "pt": "none", "pg": 71, "pdf": "", "ppg": 60, "pcf": 0.97, "txt": "I can wonder whether it is an introject, part of a pro cess of projective identification, or my own. Does the anxiety stem from my psyche or from that of the analysand? The simple positing of this set o f questions leads me to wonder if I am dealing wi th a pair of opposites of the same quality, manifested as anxiety. This pair of opp osites would be experienced as consecutive aspects of a process in which the anxiety is alternately felt as my own subjective state and then as the analysand’s condition."}, {"id": 310, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 353, "loc": "dyadic", "int": 0.5, "aff": "immersed presence", "au": "Schwartz-Salant", "pt": "none", "pg": 72, "pdf": "", "ppg": 61, "pcf": 0.97, "txt": "The ‘Four’ is the experience of the Third as it now link s to a state of Oneness o f existence. After the field has become a ‘pre sence’ for both people, then each person, paradoxically, comes to be both inside this pr esence and simultaneously an observer of it. Continued intensity of concentration allows for something to change in the oscillating movement of the field. If the dominant affect defining the field were anxiety, one would have been feeling inside the anxiety and, alte rnatively, as if the anxiety were inside o f oneself."}, {"id": 311, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 371, "loc": "dyadic", "int": 0.5, "aff": "shared imaginal", "au": "Schwartz-Salant", "pt": "none", "pg": 75, "pdf": "", "ppg": 64, "pcf": 0.97, "txt": "In addition, it is also possible to perceive briefly an imaginal reality which seems to be a property of the field itself, which is like experiencing the time-quality of the moment. Analyst and analysand may become conscious of an image that is felt to emerge out o f the field and to reflect the stat e of both people. Each person may offer his or her sense o f the imagery of the field as each focuses u pon it, as in Jung’s conception of active imagination. The result may be like a ‘dialogue drawing’ in which a sense of the field is constructed from the imagery each person creat es."}, {"id": 312, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 407, "loc": "dyadic", "int": 0.8, "aff": "dull, deadened, disconnected", "au": "Schwartz-Salant", "pt": "unnamed", "pg": 81, "pdf": "", "ppg": 70, "pcf": 0.97, "txt": "It was as if any reference to o r association with sexuality introduced another body image. Then, the sense of the space o r field between us radically a ltered and became diminished in energy, dark and dull in feeling, and devoid of any sense of relatedness. The only connection between this state and the previous one that I had known with her occurred when I fe lt dull and dead in my own emotional state under the impact of the split-opposites in her psychotic part. But I never found it fruitful to explore my inne r states with her in terms of projective identification."}, {"id": 313, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 408, "loc": "dyadic", "int": 0.7, "aff": "deadness between", "au": "Schwartz-Salant", "pt": "unnamed", "pg": 81, "pdf": "", "ppg": 70, "pcf": 0.97, "txt": "She always insisted that these states of dullness and deadness were primarily my own responses to the interaction with her. But when we eventually dealt with her schizoid states and her terror and humiliation at feeling such ego-weakness, it became clear that the deadness she felt in me (w hich I no longer felt at this stage of ou r work) was the way she experienced her mother at numerous times in early childhood. This state of deadness was no longer in me but had become a quality of the field between us, which she could reco gnize. She felt as if her b ody had changed and that she had two bodies—one of flesh and another that manifested in dark and disordering ways when any libidinal issues appeared."}, {"id": 314, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 412, "loc": "clinician", "int": 0.6, "aff": "unable to contact", "au": "Schwartz-Salant", "pt": "unnamed", "pg": 82, "pdf": "", "ppg": 71, "pcf": 0.97, "txt": "Ther e were numerous examples of such direct and enforced projections to which th e analysand was unable to say no , for these projections were the only form of contact she had with her mother , and she also deeply feared her mother’s rage if she dared to separate from her. So , the analysand literally wore her mother’s madness in order to feel fused with her mother’s body. When her mother’s body image was enlivened in her, I was unable to contact her in any affective sense. Because we had worked with the psychic unconscious and had established he r psychotic sector and a sense of mental-spiritu al self, we were eventually able to access this material."}, {"id": 315, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 463, "loc": "none", "int": 0.2, "aff": "theoretical", "au": "Schwartz-Salant", "pt": "none", "pg": 92, "pdf": "", "ppg": 81, "pcf": 0.97, "txt": "that the analysand’s form of communication becomes more cohesive. The space may then cease to feel empty. A clear image of the field process does not necessarily appear, but often the analyst and analysand can imagine a sense of textur e and fullness, or a sense o f fragmentation and torn fabric. Clearly, th ese are but two of the endless possible metaphors for the experience of the interactive space."}, {"id": 316, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 476, "loc": "dyadic", "int": 0.7, "aff": "fragmented, attacked", "au": "Schwartz-Salant", "pt": "unnamed", "pg": 93, "pdf": "", "ppg": 82, "pcf": 0.97, "txt": "But I felt that she would experience my attempts to point out her tendency to attack ou r connection as a direct attack on her; in any event, I would only be going over ground she knew so very well. Instead, I focused upon th e extremely fragmented field between us, and I was surprised to discover that what I pe rceived as an attack could be seen as an exteriorization of the chaotic inner fabric of the analysand’s subtle body. Severe trauma causes loss of an inner sense of a connective fabric, which the analysand may feel as an absence that is evil or da ngerous to his or her soul. To repair the connective fabric of the soul, the person may desperately cling to something that was o r was not said."}, {"id": 317, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 488, "loc": "clinician", "int": 0.85, "aff": "mindless, trance-like", "au": "Schwartz-Salant", "pt": "unnamed", "pg": 95, "pdf": "", "ppg": 84, "pcf": 0.97, "txt": "In listening to her, I typically felt mindless and deadened, like an observer with no real contact with her. I found myself nearly uncontrollably asking questions about topics that had absolutely nothing to do with the subject at hand. In one instance I was jolted out of the trance-like state induced by the analysand’s narcissistic-bubble transference by her startled response: ‘What in the world are you talking about?’ Having finally made contact with me in this way, she emerge d from her narcissisticbubble, but I was left to deal with the mess that I inadvertently had created. It was then possible to reconstruct the previous interaction and the narcissistic bubble structure."}, {"id": 318, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 491, "loc": "patient", "int": 0.5, "aff": "confused, overwhelmed", "au": "Schwartz-Salant", "pt": "unnamed", "pg": 96, "pdf": "", "ppg": 85, "pcf": 0.97, "txt": "On another occasion with this analysand, I could glimpse the delusional nature of the process that lived within this narcissistic-bubble-like structure. She began her session with what she termed a dilemma about which she felt confused and overwhelmed. Recently, she had met a woman on the street, someone she does not really like very much but who has been very helpful to her professionally. At the moment, she felt she wanted to do some reciprocal deed for this woman, and she suggested that the woman might be able to get consulting work at the place sh e herself was employed."}, {"id": 319, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 499, "loc": "none", "int": 0.2, "aff": "theoretical", "au": "Schwartz-Salant", "pt": "none", "pg": 97, "pdf": "", "ppg": 86, "pcf": 0.97, "txt": "I have found that the discovery of the imagery of the interactive field, apprehended from opposites manifesting often as psychotic splitting into anti-worlds, can lead to the emergence of a new form of the transference, one that is more related and far less psychotic. Heinz Kohut calls this development a mirror transference in ‘the narrower sense,’ in which the analyst becomes an object for the analysand, but it is important for the analysand only ‘within the framework of the needs generated by the therapeutically reactivated gr andiose self’ (1971, 116). The analysand becomes capable of incorporating the analyst’s image while making use of it as a source of identity in a wideranging manner. But when this state of felt-incorporation is too dangerous to allow, the analysand feels wholly unwa nted, his or her insides feeling filled with hate, and is thus incapable of having anything good inside without destroying it or being destroyed by the object’s rejection."}, {"id": 320, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 505, "loc": "clinician", "int": 0.6, "aff": "frozen, risky", "au": "Schwartz-Salant", "pt": "none", "pg": 98, "pdf": "", "ppg": 87, "pcf": 0.97, "txt": "This non-communication is a frozen state, and communication can feel like the last act in which the analyst wants to engage. While defe nding against the sense of the bizarre and the pain associated with psychotic process may be one explanation for this countertransference resistance, another explanation is that extremely sensitive levels o f trauma are involved in which the analyst’s identity is shaky; and exploration with the analysand at this point can feel like a risk that is too much to take. But the analyst asks the analysand to take such risks, and both can learn that taking risks in communicating and exploring the field experiences can be healing. CHANGING STRUCTURES OF RELATIONSHIP THROUGH FIELD EXPERIENCES The experience of field dynamic s is effective in the transf ormation of structures of not only personality but also relationship."}, {"id": 321, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 510, "loc": "dyadic", "int": 0.7, "aff": "controlled, soulless", "au": "Schwartz-Salant", "pt": "unnamed", "pg": 99, "pdf": "", "ppg": 88, "pcf": 0.97, "txt": "structuring the space between us, and we could choose numerous other images, fo r example, the alchemical myth of the son swallowed by the dragon which then cuts him up into thousands of parts. I noted that such a powerful image might be organizing ou r interaction. Focusing on this image changed the field: we both felt more in control and fa r less fragmented. We could then gain some sense of understanding and relatedness, but the experience between us was soulless, and embodiment in any depth was not possible."}, {"id": 322, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 531, "loc": "dyadic", "int": 0.8, "aff": "alive, embodied", "au": "Schwartz-Salant", "pt": "unnamed", "pg": 101, "pdf": "", "ppg": 90, "pcf": 0.97, "txt": "Instead , the imaginal presen ce was tolerated without our knowing whose it was. And with this move to the imaginal, a sense of body was activated. In this case, we could both feel an energized sense of that body and its aliveness; and we became consci ous of our bodies as energy fi elds. Perhaps it is only this kind of experience of body—the alchemists would think of this as a subtle body experience—that can create a feeling of containment for dangerous passions."}, {"id": 323, "tr": "jungian", "doc": "Nathan Schwartz-Salant - The Mystery of Human ", "pos": 595, "loc": "patient", "int": 0.55, "aff": "fragmented, exposed", "au": "Schwartz-Salant", "pt": "unnamed", "pg": 115, "pdf": "", "ppg": 104, "pcf": 0.97, "txt": "But now, recognizing that this avoidance was not fruitful, I chose to focus upon the hazy condition I had been resisting. So, I asked him if he felt somewhat fragmented, and he acknowledged that he did. As we further explored what was at stake in her business, I suggested that he may have been angry at a loss of income, for his wife’s letter had to do with a previous business which she had started and which had failed. This suggestion struck home and, after a pause, he said, ‘So my noble feelings about how great she was doing are a sham.’ ‘Why do you think so?’ I asked. ‘Perhaps both attitudes ar
