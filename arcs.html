 "fear, paralysis", "txt": "In fact, he seemed enlivened by a clash in our perspectives: compelled to contemplate the matter deeply and return to me with a thorough counterargument or new hypothesis of his own. But in this case, I had been waiting for a sense of certainty to arrive, out of fear that to speculate and be wrong would mean exposing myself in a way that could be traumatic for us both. In saying nothing, however, I now feared that I had tacitly communicated that it was not okay to discuss these things. Ari arrived to the next session appearing agitated, voicing a desire to retreat from every other important relationship in his life.", "tp": false}, {"pos": 35, "role": "enactment", "loc": "dyadic", "int": 0.6, "aff": "tentative, guilty", "txt": "I speculated that he might also be expressing some anger toward me, perhaps related to the topic I raised in our previous session. I wondered aloud if I might have left him alone with those feelings for a while, if perhaps I should have made a point of saying that it was normal and okay to feel both maternal feelings and attraction toward me. (In this moment, I was speaking from my own presession ruminations, more than any information he was communicating.) He agreed that probably, yes, it would have made it easier to bring up certain things, though in the moment he couldn ’t think of what. When I pressed him a bit more, he shared that there was 14 Annee Ackerman, PhD", "tp": false}, {"pos": 38, "role": "enactment", "loc": "dyadic", "int": 0.5, "aff": "clipped tension", "txt": "“Yes.” “OK. So … what’s unhealthy about bringing that in here?” “I don ’t know, ” he said again. “Well, what would be unhealthy about it? It makes sense that you ’d want to know if I saw you that way too. ” More clipped than usual, he replied, “I dunno.", "tp": false}, {"pos": 40, "role": "meeting", "loc": "patient", "int": 0.7, "aff": "sadness, hesitancy", "txt": "Fortunately, my not getting it was requiring him to introspect more thoughtfully. I watched a wave of sadness cross his face and pass. And then, punctuated with uncharacteristic stammering, he said, “… I think it ’s more the issue it brought up … which although resolved now for me, in the past, used to be kind of a recurring issue. You know that most of the issues we’ve touched on … have to do with my insecurities and anxieties have to do with romantic relationships and with women … and obviously some of that stuff goes back to other stuff we ’ve talked about … some of that stuff dating back to when I was a kid … and you know when you ’re a kid, everyone has those little crushes, and unfortunately, me being me, I always felt awkward and an outsider.", "tp": false}, {"pos": 45, "role": "meeting", "loc": "dyadic", "int": 0.6, "aff": "shared depression", "txt": "I told him then that I recognized that part of him. He said that was depressing. And then he laughed and said that 10 minutes later, he had gone right back to the screen. I didn ’t fully grasp it then, and wouldn ’t for some time, but this was a shared trauma in our pasts, again shared and re-created in the transference.", "tp": false}, {"pos": 46, "role": "other", "loc": "clinician", "int": 0.85, "aff": "exposed desire", "txt": "This precocious awakening: feeling desire and being desired, before the mind can comprehend what that means. Too early, too soon, gaining access to others in a way that leaves one so exposed, and over which the callow mind has so little control. In just this way, my body awoke to his, that spring day so early in my training, before my clinical capacities had matured to the point of knowing how to manage it. By experiencing them, I learned about the connections he ’d made between sex, subjugation, and pain.", "tp": false}, {"pos": 49, "role": "other", "loc": "clinician", "int": 0.8, "aff": "raw vulnerability", "txt": "This meant saying yes to knowing my own hunger, my own violence, my own poorly held-together fragments in another ’s mind, my own body-object-part-no-self self. To see the whole of Ari meant acknowledging the shattered bits of me. To that end, my own version of healing has been to enter into spaces that feel prohibitively dangerous and find ways to make them safe. Certainly with Ari, but also in my work since, I ’ve learned that the most terrifying places to go are those where there is little to distinguish what is mine from what is yours.", "tp": false}, {"pos": 51, "role": "other", "loc": "clinician", "int": 0.65, "aff": "clarifying love", "txt": "After that day in practicum, when the fog of shame began to lift, it was clear me—and to us all —that the erotic elements of the treatment were rich with meaning and potential. For one thing, I could see that the love and connection I felt with Ari was inevitable and enduring —the result of a natural affinity for each other. At the same time, I could see that other aspects of the material —for instance, the content of the fantasies, and the force with which the erotic storm arrived—were clues that led me to a deeper chamber of unformulated traumatic experience that Ari could not possibly have communicated to me in words. Without the support from my practicum —which was not merely other voices and insights but truly the opening of potential space (Winnicott, 1971), a kind of thirdness (Benjamin, 2004) that allowed for complexity and dimensionality to occur—I would not have had the inclination, or the ability, to sift through the layers of meaning to discover it.", "tp": false}]}, {"pt": "A", "doc": "ADDICTION TO NEAR-DEATH{Joseph, Betty (author)", "au": "Joseph, B.", "grp": "kleinian", "n": 18, "out": "impasse", "tp": 327, "felt": "A repetitive pull into sexualized cruelty and masochistic excitement colonizes each near-insight, so that even moments of understanding get recruited into sadistic triumph over the analyst. Movement happens, but it is immediately metabolized back into the addiction.", "shifted": "Awareness of activity-in-passivity and of the addictive grip became conscious, but insight itself was converted into a new vehicle of triumph rather than into mourning or change.", "inwhom": "primarily the patient, with the analyst registering the enactment in the countertransference", "turn": true, "meet": false, "mint": 0.55, "u": [{"pos": 14, "role": "other", "loc": "patient", "int": 0.5, "aff": "amazed, intimidating", "txt": "He then spoke about a meeting he had been to, in which a business acquaintance had said that a colleague told him that he, the colleague, was so frightened of my patient, A, that he positively trembled when on the 'phone to him. My patient was amazed, but linked this with something that I had shown Copyrighted Material. For use only by FieldingGraduateU. Reproduction prohibited.", "tp": false}, {"pos": 15, "role": "enactment", "loc": "dyadic", "int": 0.6, "aff": "cold cruelty", "txt": "ADDICTION TO NEAR-DEATH 451 him on the Monday, when I had commented on a very cold, cruel way in which he dealt with me when I queried a point about another dream. This association was connected with the idea of the man in the dream looking so gentle but acting in this violent way, and so he felt that the man must somehow be connected with himself, but what about the moustache? Then suddenly he had the notion of D. H.", "tp": false}, {"pos": 16, "role": "other", "loc": "dyadic", "int": 0.5, "aff": "trapped, identified", "txt": "Lawrence-he had been reading a new biography of Lawrence and remembered that he was enormously attracted to him in his adolescence and felt identified with him. Law­ rence was a bit homosexual and clearly a strange and violent man. I worked out with him that it seemed therefore that this long, dark cavern stood for the place where he had felt he was too far in to be pulled out by himself or by me; as if it was his mind, but perhaps also part of his body. But the too-far-in seems to be linked with the notion that he was completely captured and captivated, possibly, by the brigands.", "tp": false}, {"pos": 19, "role": "strain", "loc": "patient", "int": 0.75, "aff": "enthralled masochism", "txt": "The point I want to add here is that the patient's experience of sexual gratification in being in such pain, in being dominated, is one of the major reasons for the grip that the drive towards death has on him. These patients are literally 'enthralled' by it. In this patient A, for example, no ordinary pleasure, genital, sexual or other, offered such delight as this type of terrible and exciting self-annihilation which annihilates also the object and is basic to his important relationships to a greater or less extent. So, I think the dream is clearly a response, not just to the girl friend K being out on the Monday night and A lying in bed getting more and more disturbed about it, of which he was conscious, but to the fact that he had felt better, knew he had and could not allow himself to get out of his misery and self-destruction-the long cavern-or allow me to help him out.", "tp": false}, {"pos": 23, "role": "other", "loc": "patient", "int": 0.5, "aff": "upset, rehearsing", "txt": "452 BETTY JOSEPH explore in him this dedication to masochism, described one day how he had been upset the previous evening because K had been going out with somebody else. He realized that on the previous evening he had, in his mind, been rehearsing what he might say to K about this. For example, he would talk about how he could not go on like this with her, while she was going around with another man; how he would have to give up the whole relationship; he could not go on like this, and so on. As he went on speaking about what he was planning to say to K, I got the feeling, not only from the ideas, but from his whole tone, that he was not just thinking what he might say to K, but was caught up in some kind of active cruel dialogue with her.", "tp": false}, {"pos": 24, "role": "enactment", "loc": "patient", "int": 0.6, "aff": "cruel fantasy", "txt": "Slowly then he clarified the ideas that he had had, and how he had been going over things in his mind. On this occasion and indeed on others, he realized that he would be saying something cruel, for example, and that K in the fantasy would reply or cry or plead or cling, she would become provocative, he would get cruel back, etc. In other words, what he then called 'thinking about what he would say' is actually actively being caught up in his mind in a provocative sado-masochistic fantasy, in which he both hurts and is hurt, verbally repeats and is humiliated, until the fantasy activity has such a grip on him that it almost has a life of its own and the content becomes secondary. In such cases unless I could begin to be aware of the problem of their being caught up in these fantasies and start to draw my patients' attention to them these fantasies would not come into the analysis, although in some way or another they are conscious.", "tp": false}, {"pos": 27, "role": "turn", "loc": "patient", "int": 0.4, "aff": "passive provocation", "txt": "These self-destructive patients appear very often to be passive in their lives, as on one level did A, and a very important step is taken when they can see how active they are, by projective identification, for example through the kind of provocation that I am describing or in their thinking and fantasy. But there are other ways of expressing this type of self-destructiveness in the analysis. For example, some patients present 'real' situations, but in such a way as silently and extremely convincingly to make the analyst feel quite hopeless and despair­ ing. The patient appears to feel the same.", "tp": false}, {"pos": 31, "role": "strain", "loc": "patient", "int": 0.55, "aff": "distressed, threatened", "txt": "He was deeply disturbed and decided he would almost certainly have to leave rather than be put in an inferior position. It should, however, be remembered that in his position there would be no likelihood of his having difficulty in finding other high-grade and financially rewarding work. I bring a session from a Monday at this time. The patient came in most distressed, then remembered he had not brought his cheque, but would bring it the following day; then described the happenings of the weekend and his talk with his principal on Friday and how worried he felt about his job.", "tp": false}, {"pos": 32, "role": "enactment", "loc": "dyadic", "int": 0.6, "aff": "suspect, entangling", "txt": "K, his girl friend, had been helpful and kind, but he felt sexually dead and as if she was wanting sex from him, which became rather horrifying. Then he queried, 'was he trying to be cruel to her?'-already that question has some­ thing a bit suspect about it, as if! was supposed to agree that he was trying to be cruel to her and get caught up in some kind of reproaching of him, so that the question became in itself masochistic rather than thoughtful. He then brought a dream. In the dream, he was in an old-fashioned shop at a counter, but he was small, about the height of the counter.", "tp": false}, {"pos": 34, "role": "other", "loc": "patient", "int": 0.5, "aff": "anxious, sexualized", "txt": "There were rows of people somewhere in the dream and a vague feeling of being blamed for something he had done. In the shop a horse was being shod but with a piece of white plastic-looking material, about the shape and the size of the material one would put on the heel ofa man's shoe. In his associations he spoke about his anxiety about his relationship with K at the moment and his sexuality. He was the height of a child in the dream.", "tp": false}, {"pos": 35, "role": "strain", "loc": "patient", "int": 0.6, "aff": "panic, anxiety", "txt": "He had tremendous feelings of panic and anxiety at night. What would he do? Would he really run out of money, and what would happen to his whole position? We spoke about the realities of this a bit more.", "tp": false}, {"pos": 36, "role": "other", "loc": "patient", "int": 0.5, "aff": "guilty, arrogant", "txt": "He had seen a lot of horses being shod as a child and well remembered the smell of the iron going into the horse's hoof. He spoke about his guilt about the situation that he felt he had helped to create at work and realized that he must actually have acted very arrogantly with his principal and that this had probably really helped to bring the ceiling down on him. I linked the ledger with the forgotten cheque and his anxiety about finances. He is worried about his lack of sexual interest at the moment, but seems to want me to be nasty about the cheque, and K about his lack of libido.", "tp": false}, {"pos": 37, "role": "enactment", "loc": "dyadic", "int": 0.5, "aff": "guilt-baiting", "txt": "In the dream he wanted the woman to say that she was a witch and this attitude appears to be an old story, since he is the height of a child. The guilt, I believe, is not just about his faulty handling of his work situation, his arrogance and harsh attitude, which has really led to serious work problems, but this is used both in his mind and actively in the transference in an attempt to draw me into agreement with his despair, to criticize his arrogance in his relationship with K and shatter him and create utter despair and a sense of uselessness in both of us. This is the masochistic Copyrighted Material. For use only by FieldingGraduateU.", "tp": false}, {"pos": 38, "role": "enactment", "loc": "patient", "int": 0.7, "aff": "cruel excitement", "txt": "454 BETTY JOSEPH use of anxiety in his mind and in the session. We can then see something about the sexualized excitement, of a very cruel kind, that he gets in this attitude by looking at the associations to the shoeing of the horse. There is the picture of a burning iron being put into the horse's foot and the fascination and horror of this as a child, feeling that it is bound to hurt, though in fact one subsequently knows it doesn't. So, I could then show him the indulgence in a tremendously masochistic attitude that was going on visibly in the dream, currently in the session, as misery, despair and pseudo-paranoia were being built up.", "tp": false}, {"pos": 39, "role": "turn", "loc": "dyadic", "int": 0.6, "aff": "thoughtful shift", "txt": "There is almost a fragment of insight in this dream, as when he demands that the woman tells him if she is a witch and vaguely he knows that he hopes that she will agree that she is. As we went over this he began to see it again very clearly and his whole attitude became more thoughtful and quiet, as opposed to desperate and hopeless. He slowly added that, of course, there is the problem that this kind of sexual excitement and horror seems so great that nothing else can be so important and exciting to him. Now, when he said this, at first there was clearly a sense of insight and truth about, but then there began to be a different feeling in the session as if he really meant there was nothing one could do about it.", "tp": false}, {"pos": 40, "role": "rupture", "loc": "dyadic", "int": 0.85, "aff": "sadistic triumph", "txt": "Even the insight began to contain a different message. So I showed him that there was not only insight, not only anxiety and despair about being so much caught up in this kind of masturbatory excite­ ment, but now there was also a triumph and a kind of sadistic jab at me, as if he were digging a burning iron into my heart to make me feel that nothing we were achieving was really worth anything and nothing could be done. Once again he could see this and so it was possible to link the desperate sexualized masochistic excitement with the triumphant doing down of his object, external and internal. I have tried to show in this example how this masochistic excitement was covering up at that time deep anxieties stirred up by his work situation, connected with feelings of rejection, being unwanted, failure and guilt.", "tp": true}, {"pos": 42, "role": "impasse", "loc": "patient", "int": 0.6, "aff": "addicted ambivalence", "txt": "With A, by the time we reached the dream about the sexual assault in the cavern, we had worked through a lot of this, and he felt consciously that he was in the grip of an addiction from which he believed he would like to be free. But he felt that the part of him that would like to be freed was nothing like as powerful nor were the possible results as attractive as was the pull of his addiction. And this he could not understand. This problem needs considering from the angle of these patients' passivity that I mentioned at the beginning of the paper when I described how the pull towards life and sanity seems to be split off and projected into the analyst.", "tp": false}, {"pos": 45, "role": "other", "loc": "none", "int": 0.1, "aff": "theoretical", "txt": "ADDICTION TO NEAR-DEATH 455 appreciating, missing, feeling disturbed at losing, etc., the very stuff that makes for real whole object relating is projected and the patient remains with his addiction and without the psychological means of combatting this. To me, therefore, the understanding of the nature of this apparent passivity is technically of primary importance with these patients. Moreoever, it means that with such splitting-off of the life instincts and of loving, ambivalence and guilt is largely evaded. As these patients improve and begin to become more integrated and relation­ ships become more real, they begin to feel acute pain sometimes experienced as almost physical­ undifferentiated but extremely intense.", "tp": false}]}, {"pt": "Mrs A", "doc": "[The New Library of Psychoanalysis] John Stein", "au": "—", "grp": "other", "n": 16, "out": "ongoing", "tp": 649, "felt": "A patient oscillates between a deadened retreat and brief moments of contact that, once reached, are violently severed; the analyst is recurrently drawn into carrying concern and being cast as persecutor.", "shifted": "Brief openings into historical/affective material (the dream, the border waiting room) momentarily punctured the retreat, but each contact was followed by flippant cutoff or persecutory accusation, leaving the analytic work circling rather than transforming.", "inwhom": "primarily the patient, with reciprocal strain registered in the analyst's countertransference", "turn": true, "meet": true, "mint": 0.58, "u": [{"pos": 81, "role": "impasse", "loc": "dyadic", "int": 0.4, "aff": "silent, stuck", "txt": "14 2 Psychic retreats: a clinical illustration 1 In this chapter I will present clinical material from a patient (Mrs A) in a relatively stuck analysis in order to illustrate the function of psychic retreats in the to and fro of analytic work. One of the chief technical problems with this patient was her silence, which often extended for most of the session and indeed for several sessions. Despite this there were periods when she was more free, and she was sometimes able to bring dreams and other material which helped me to understand her experience in the stuck periods. Both in her everyday life and in the sessions she was able to make transient contact which enabled some progress to occur, but it was frequently cut short in an abrupt and violent way.", "tp": false}, {"pos": 86, "role": "strain", "loc": "patient", "int": 0.55, "aff": "panic, persecution", "txt": "For much of the analysis, especially in the beginning, the anxiety was that associated with panic, fragmentation, depersonalization, and persecution. Later, however, there were hints that she also feared depressive pain. The retreat then served to avoid contact with loss, guilt, and other anxieties associated with the depressive position. Sometimes she gave the impression that the retreat was held onto and used for reasons other than protection from anxiety and pain.", "tp": false}, {"pos": 88, "role": "other", "loc": "patient", "int": 0.4, "aff": "withdrawn, anxious", "txt": "Psychic Retreats 16 withdrawn states when she would take to her bed and do nothing except read novels endlessly. When she was still a baby, her family had escaped from a country where they experienced political persecution. They were occasionally able to return to visit her grandmother, and these visits and the border crossings they entailed were especially anxious times for her. She sought treatment because of attacks of incapacitating anxiety, at first associated with major decisions such as whether she should stay in England, or whether she should let her future husband move into her flat when, at that time, he did not intend to marry her.", "tp": false}, {"pos": 89, "role": "strain", "loc": "patient", "int": 0.7, "aff": "panic, derealization", "txt": "They would also occur when she got involved in long discussions on existential themes, which resulted in panic when she realized that she saw no meaning in life. She would find herself trembling, would feel her surroundings recede and become distant, and found that she could not make contact with people because a diffuse barrier came between them. When her husband agreed to many her the anxiety lessened but would reappear periodically—for example, once when she lost a locket containing a piece of his hair. In addition, she suffered from a specific fear of being poisoned from tinned food which she would become convinced had been contaminated.", "tp": false}, {"pos": 96, "role": "other", "loc": "patient", "int": 0.5, "aff": "arid, deadened", "txt": "On the basis of the history and the description of the patient’s general behaviour it is possible to put forward the idea that she retreated to a refuge which protected her from contact and which was represented by her image of a desert island where she could sunbathe and leave the responsibility for the analysis to me. The feeling of aridity and deadness associated with this state was well represented by the preoccupation", "tp": false}, {"pos": 100, "role": "meeting", "loc": "dyadic", "int": 0.5, "aff": "wary relief", "txt": "It was a relief to have a dream instead of the silence, and I interpreted that the dream itself might represent provisions for the analysis, as if she realized that we had run out of material to work with. The girl in the dream had been violently attacked when she went out for the provisions, and I suggested that she might be afraid that something similar would happen to her if she brought material for analysis. Perhaps, I added, she was less afraid of being attacked now and could express a wish to understand these fears, represented in the dream by the request to find out how the accident had happened. She was attentive and nodded as if she understood what I meant, and this led me to go on a little later and try to link the dream with her experience at the beginning of the session when she was hunting for her cheque.", "tp": false}, {"pos": 102, "role": "rupture", "loc": "dyadic", "int": 0.7, "aff": "abrupt cutoff", "txt": "A clinical illustration 19 There was a sharp change of mood and the patient became flippant, saying that if that was the case she could put it right immediately because she had a pen with her, and she did not want me to have anything I could use in evidence against her. It felt as if the contact with her had been abruptly cut off. She now seemed to feel that I had caught her out and was making a fuss, using her mistake with the cheque to put pressure on her to admit her ambivalence and to talk about her feelings. A mistake which she had not noticed left her feeling dangerously out of control, and she had to attack the mood of cooperation and correct the mistake as quickly as possible.", "tp": false}, {"pos": 103, "role": "rupture", "loc": "dyadic", "int": 0.7, "aff": "violent rupture", "txt": "The mood in the earlier part of the session had, however, given a feeling of contact, and I think it did represent a move out of the protection of the retreat. This, however, stimulated a violent attack when I went too far or perhaps too fast, to link it up with something actual which had happened in the session. The violence of the break in contact was striking, just as had been the violence to the girl in the dream. She had emerged to make contact in order to get provisions, indicating an admission that she felt the lack of something and wanted something for herself and her guests.", "tp": false}, {"pos": 104, "role": "enactment", "loc": "dyadic", "int": 0.6, "aff": "dissociated flippancy", "txt": "But something went wrong and she reverted to a state of mind in which she was cut in two just as the girl had been in the dream. In my interpretations I linked the way that she was cut off from her feelings in the session with the indifferent, smiling, flippant lack of concern of the girl in her dream who smiled and did not mind being cut in two. There was also an innuendo that I was more concerned with my cheque than with her needs, so that she quickly took out her pen as if she had to satisfy my greed. This led me to doubt my motives and made me feel that I had let her down and that I had changed from someone who understood her anxiety about being attacked into someone felt to be attacking her by pointing out her mistake in the cheque.", "tp": false}, {"pos": 110, "role": "turn", "loc": "patient", "int": 0.4, "aff": "recollected waiting", "txt": "A clinical illustration 21 A further association then emerged to a waiting room on the frontier when the family had been stopped after a visit to her grandmother. Her mother had on this occasion been taken off the train by border guards to have some irregularity in her passport checked, and the family waited for her in a room with bookshelves and a coal stove. I was able to interpret that elements in the dream reflected her feeling that when I did not answer the telephone, a tragic event like a death from a mysterious illness had occurred, and that when I had telephoned her, it felt as if I had summoned her back to the analysis to ask her to explain her reaction. I think the analytic work represented by the installing of central heating had put her more in touch with her feelings, and the associations to the dream confirmed that horrific memories were revived of times when she feared she might lose her mother.", "tp": true}, {"pos": 112, "role": "rupture", "loc": "dyadic", "int": 0.75, "aff": "persecutory panic", "txt": "The implication was that I had done something terrible and that she had to protect herself from the trauma I had created. The climate was a persecutory one and as she retreated one got a glimpse of a panicky feeling which made contact too terrifying to sustain. While at first she could appreciate that she had paranoid fears and make contact with me as someone who could help her with them, we could not prevent them from being enacted in the session, and when this happened she felt obliged to return to the refuge. In the second session the retreat to the refuge followed my failure to answer her telephone call, and the atmosphere at this time was very different.", "tp": false}, {"pos": 118, "role": "enactment", "loc": "clinician", "int": 0.75, "aff": "uncomfortable concern", "txt": "The analyst, by contrast, feels extremely uncomfortable, being asked to carry the concern and yet knowing from his experience with the patient that whatever he does will be unsatisfactory. If I had not telephoned the patient I had the impression that she would not have been able to make the move towards me and we might have had a very long absence or even a breakdown in the analysis. On the other hand, I was also left feeling that telephoning her was a serious error in technique, and I had an uneasy sense of doing something improper as if I had been seduced or was seducing her to make her feel she was coming back to the analysis for my benefit and at my summons. It is interesting to observe that it is sometimes the analyst’s shortcomings which are exploited to justify a return to the retreat.", "tp": false}, {"pos": 250, "role": "enactment", "loc": "dyadic", "int": 0.55, "aff": "eroticised, wary", "txt": "It was reminiscent of the romantic atmosphere which dominated the early years of her treatment in which the interaction was highly eroticised and then treated as something improper. I thought that she was also afraid to think scientifically and to reach conclusions on the basis of evidence. If she did, she would have to evaluate what sort of analyst I was, and she was afraid that she would feel let down by what she found. This would inevitably be a disappointment in comparison with the romantic image she created of me.", "tp": false}, {"pos": 253, "role": "enactment", "loc": "dyadic", "int": 0.6, "aff": "indignant, thwarted", "txt": "Psychic Retreats 58 would hint and occasionally admit that I had been incorporated into her romantic fantasies. Mostly, however, she would only complain that I could not really be interested in her because she was too old, or that I preferred professionally successful women. It was impossible to discuss these fantasies, and if I tried to do so she became indignant and accused me of having improper thoughts and of exploiting her trust and her innocence. It seemed to me that in this dream state she felt close to me in a vaguely eroticized way but that if this was mentioned the spell was broken and she felt expelled from the intimacy as she had been from her mother’s bed.", "tp": false}, {"pos": 255, "role": "impasse", "loc": "dyadic", "int": 0.7, "aff": "persecuted, provoked", "txt": "My wish to work with her, and in particular my idea that she might accept responsibility for her own wishes and thoughts, were felt as a cruel attack and an indication of my un-willingness to carry out these functions for her. I was at these times treated as the representative of the rebellious wish to think for herself and had to be stopped. At other times I was provoked to act as part of a persecuting organization and she experienced me as demanding an unthinking obedience and agreement. With repeated analysis of this kind of situation she did gradually come to acknowledge some of her own talents and capabilities, but progress was always elusive and left her feeling guilty and unprotected.", "tp": false}, {"pos": 256, "role": "strain", "loc": "patient", "int": 0.55, "aff": "fearful, inhibited", "txt": "To allow her thinking to be used incisively, like a sickle, was to allow a more real interaction which was experienced as a dangerous kind of intercourse. Intelligence, the capacity to observe, to make judgements, and to retain contact with reality seemed, in my patient, to lead her to recognize the state of her objects, and to recognize her own impulses, and this appeared to make her afraid of what she would feel and what she would do. She could protect herself by splitting off and projecting these capacities but in the process was seriously disabled. When I was able to recognize that she was not stupid but had a high degree of competence which she was unable to use, it made me more hopeful that she could be helped and it was therefore a disappointment to find that she resisted this process with all the means she could find and that indeed a peculiar kind of perverse intelligence lay behind her", "tp": false}]}, {"pt": "Bill and Jane", "doc": "Goldner+-+Romantic+Bonds+Binds+and+Ruptures+Co", "au": "Goldner", "grp": "relational", "n": 15, "out": "mutative", "tp": 155, "felt": "A couple locked in repair-as-rupture cycles drags the therapist into their kill-or-be-killed field; only when he stops trying to pacify them and accepts the ferocity does a paradoxical stillness emerge.", "shifted": "The therapist's relinquishment of the rescuer role and acceptance of limits allowed recognition of each partner's underlying fear, producing intermittent calm in the dyad.", "inwhom": "primarily the clinician, with reverberations in the couple", "turn": true, "meet": true, "mint": 0.66, "u": [{"pos": 59, "role": "strain", "loc": "clinician", "int": 0.8, "aff": "daunted, depleted", "txt": "Bill opened the initial session with “We are in Peril,” Jane adding, with a dead-on stare, “Can you handle us? Y ou are the ninth therapist we’ve been to.” I managed to parley their one-two punch with some serviceable response (no longer available to me), but as I looked into their darkened ominous faces, I wondered if I had the strength, and already sensed that I didn’t have the will, to provide them with the “safe, but not too safe” (Bromberg, 2010) situation they so clearly would require. Bill and Jane’s relationship was a theatre of enactment, the pervasive shadow of trauma darkening even the manic defense of romanticism. There was a false brightness and a palpable sadness to the best of times, as they held their breath, waiting for the moment when they would be traumatized by another rupture that would not yield to words, to therapeutic soft sounds, to reason or caution.", "tp": false}, {"pos": 64, "role": "enactment", "loc": "dyadic", "int": 0.65, "aff": "inflamed, deprived", "txt": "Neither could see how their performance of soothing did not soothe. It confused and inﬂamed. In these cycles of repair-as-rupture, they could never rest in the other’s care. Each one’s bid for TLC triggered the other’s painful history of deprivation and scapegoating, which led them to respond to each other with a hollow protection, often laced with criticism and blame.", "tp": false}, {"pos": 66, "role": "enactment", "loc": "dyadic", "int": 0.6, "aff": "persecutory struggle", "txt": "In their never-ending battle over who was the perpetrator and who was the victim (see also Seligman, 1999, on intersubjective projective identiﬁcation), the couple was reproducing the “kill-or-be killed” relationship each had with their mothers. Either they became the bad /sick one in return for keeping their mother close, or they named the game and were forever exiled—a Hobson’s choice that could never be resolved. (See the exchange between Davies, 2004, and Benjamin, 2004b, on relational bad objects.) Therapy was a major point of contention between them. Jane felt that Bill’s commitment to his analysis (with a male psychiatrist, which was her father’s profession), had marginalized her, since she had always been his sole conﬁdante and psychic mentor. Bill, on the other hand, felt that Jane’s refusal to go into individual treatment made it impossible for him to get her to address her issues.", "tp": false}, {"pos": 68, "role": "other", "loc": "patient", "int": 0.5, "aff": "anxious, resigned", "txt": "But Bill and Jane were having none of it, and I eventually decided to back off and let them ﬁnd their own way. Bill began by talking about an incident that was casting a long shadow. Bill: (softly, anxiously) We had problems over the weekend. Jane’s anxiety problems are constant.", "tp": false}, {"pos": 69, "role": "rupture", "loc": "patient", "int": 0.5, "aff": "angry, exhausted", "txt": "Suddenly she just darkened after a beautiful morning—and it made me mad. ... We eventually had a long talk and we both felt better. J: I didn’t feel any of that! It was a two-hour, exhausting conversation.", "tp": false}, {"pos": 70, "role": "rupture", "loc": "patient", "int": 0.6, "aff": "frustrated, indignant", "txt": "I felt no better at the end than at the beginning. We have spent all this time and money and he still thinks he can diagnose me! Jane has “anxiety problems”!!?? B: But I said I could see what she was saying. ...", "tp": false}, {"pos": 72, "role": "meeting", "loc": "dyadic", "int": 0.6, "aff": "wary, fearful", "txt": "And then he has the nerve to represent himself as the righteous one! VG: I see how are afraid you are, Bill, that Jane is going to get me off track. (He nods.) And Jane, I see how you’re afraid I’m going to be taken in by Bill. (She looks up warily.)", "tp": false}, {"pos": 73, "role": "turn", "loc": "dyadic", "int": 0.7, "aff": "defensive softening", "txt": "ROMANTIC BONDS, BINDS, AND RUPTURES 415 J: (Despite herself, softening) I can’t work on my long-term issues when you jump all over me, it’s not safe to do it! I DO have anxiety issues, but you shouldn’t be so hard on me! I never shamed you around your issues. ... VG: Jane, that’s a good ﬁrst step, acknowledging that “anxiety is a “long-term issue” for you.", "tp": false}, {"pos": 77, "role": "rupture", "loc": "dyadic", "int": 0.85, "aff": "explosive, reeling", "txt": "But I was exhausted, and I didn’t think the discussion was good at all, and now it was two hours later and I didn’t get any sleep—but I did, I acknowledged it right away— B: (Sudden, bellowing outburst) Are there going to be any rules here at all? Am I just supposed to sit back and ... (What?—my head is spinning) VG: Bill, Why are you interrupting her??—She just said “what I did was bad.” B: Because she didn’t say it Right Away! I had to beg for it, go nuts to get it! VG: OK, I get it—so this must be making you feel that you have to go nuts right here, right now.", "tp": false}, {"pos": 78, "role": "meeting", "loc": "dyadic", "int": 0.75, "aff": "furious, dismissed", "txt": "Y ou don’t think she’sreally acknowledging her destructiveness, which is making you feel like you have to ﬂip out here in order to get me to see what’s really going on (just as you had to do with your father, who always appeared so well put-together). J: What’s the point?? It’s always about him! Like I don’t know what I did is bad?", "tp": false}, {"pos": 80, "role": "meeting", "loc": "dyadic", "int": 0.8, "aff": "desperate, fighting", "txt": "VG: I can see that when that switch is ﬂipped there is no overriding it until you feel spent. J: Look I am ﬁghting for my life with him! VG: Bill, when she is scared—like now, she feels the way you do—like she’s ﬁghting for her life— that’s why, even here, she can’t—she won’t give up. She wouldn’t be standing here—nor would you—if you weren’t both like that.", "tp": false}, {"pos": 81, "role": "meeting", "loc": "dyadic", "int": 0.8, "aff": "fear, aggression", "txt": "But you don’t see her underlying fear—I often don’t see it either—and Jane, you don’t see the impact you have. Y ou feel you are just ﬁghting your way out like a cornered animal, but you don’t see that for him you are like a freight train barreling down. J: He holds his hands up like that poor little boy—but don’t be fooled!! He pulled the phone o u to ft h ew a l l ! !", "tp": false}, {"pos": 85, "role": "turn", "loc": "clinician", "int": 0.6, "aff": "steadier, reflective", "txt": "Moreover, it seemed that the more I accepted my limits, the more my stamina and understanding seemed to grow. In a later session, for example, when the couple started to careen into another all-or-nothing battle over who was the true victim in the relationship, I caught myself working too hard to save them from themselves. This time, I was able to pull back and capture our collective state of arousal with a clarity I did not have before. This is roughly what I said: “I see I’m not getting through to either one of you.", "tp": true}, {"pos": 87, "role": "turn", "loc": "dyadic", "int": 0.7, "aff": "calm surrender", "txt": "The effect was the same—a quieting of arousal. Here I believe it was my recognition, and acceptance, of the ferocity and drivenness of their reactivity that produced that oddly calming effect. Perhaps we all felt something of the stillness of surrender, even though the Third to which we were yielding was one of destructiveness. By giving us all permission to “accept the things we could not change” (the AA Serenity Prayer), I was, without planning it, deploying a variant of the old family therapy technique of “prescribing the symptom” the couple had come to change (their endless, exhausting arguments).", "tp": false}, {"pos": 88, "role": "other", "loc": "clinician", "int": 0.5, "aff": "paradoxical resignation", "txt": "Like the family therapy strategists of the 1980s, who were often faced with impossible cases, I found myself telling Bill and Jane that I could not help them be more peaceful, because their addiction to ﬁghting was apparently necessary in the larger scheme of things. (Gladiators are not free agents). The intervention was also a clinical paradox in that I was explicitly telling them that I accepted therapeutic defeat, while I was, of course, continuing to treat them. My interpretation—that they were doomed Gladiators without a cause was clearly sobering. Moreover, by truly accepting (with no irony or sarcasm) that at least for now, I could not, and perhaps should not, try to encourage them to take a softer, more reﬂective stance, I shifted the terms of our power struggle, leaving them with nothing to ﬁght against.", "tp": false}]}, {"pt": "Patient B", "doc": "Long et al., 2020. Racial Difference Rupture a", "au": "Long et al.", "grp": "relational", "n": 15, "out": "mutative", "tp": 279, "felt": "A Black patient's idealization of a White therapist's 'blank canvas' difference curdles into hatred as economic and racial asymmetries went unspoken; the dyad circled anger without naming its source until the therapist asked directly about race, opening a rupture into truth-telling.", "shifted": "The unspoken racial dynamic became speakable; hatred was voiced rather than enacted, and the projection became available for thinking between them.", "inwhom": "both, primarily the patient with reciprocal shift in the clinician", "turn": true, "meet": true, "mint": 0.65, "u": [{"pos": 31, "role": "other", "loc": "clinician", "int": 0.4, "aff": "reluctant anticipation", "txt": "Patient B An off er to train as a therapist brought me to therapy . Prior to this, I had been curious but unable to afford therapy . Now , it was no longer a choice, thus I found myself outside my therapist’ s premises. Finally , he stood in front of me and I thought that he looked exactly as I had imagined he would.", "tp": false}, {"pos": 33, "role": "other", "loc": "patient", "int": 0.5, "aff": "hopeful difference", "txt": "It felt like he perfectly embodied the completely new path that I was about to embark on emotionally . His differe nce presented me with the opportunity of having a blank canvas to paint on, one that I would paint as I pleased. There was no commonality between Peter and me; we came from very differe nt worlds with differe nt racial pasts. He was opposite to me in every possible way .", "tp": false}, {"pos": 34, "role": "enactment", "loc": "patient", "int": 0.4, "aff": "foreign, uncertain", "txt": "All of these assumptions, perhaps, unconsciously placed Peter ’ s Whiteness as safe. Because he did not know about Blackness, I could recreate myself in his eyes and I could teach him about who I was. In the first session, therapy felt foreign to me. I mulled over what I was expected to do or say .", "tp": false}, {"pos": 35, "role": "strain", "loc": "clinician", "int": 0.6, "aff": "nervous disappointment", "txt": "I wondered if I was expected to reveal my deep dark secrets. I was nervous and immensely uncomfortable. Our first session ended and to my dismay , there was no magic. I did not come out of it differe nt, I did not feel any shift; in fact, nothing changed in me.", "tp": false}, {"pos": 36, "role": "strain", "loc": "patient", "int": 0.4, "aff": "empty disappointment", "txt": "I left that first session wondering to myself: W as this what therapy meant? Did it mean I had to come and talk about nothing, while timed, and then leave, feeling the same? During these first sessions, Peter enquired about my first language and I responded that I spoke in isiXhosa. He had never heard of this language.", "tp": false}, {"pos": 38, "role": "enactment", "loc": "dyadic", "int": 0.6, "aff": "anger, testing", "txt": "How was he ever going to understand me? Peter was embarrassed. He reassured me by saying that I should feel free to speak in isiXhosa if I wanted and that we would manage it when I did. In anger and internal protest, I decided to test this: I brought in Xhosa words into my therapy .", "tp": false}, {"pos": 41, "role": "strain", "loc": "clinician", "int": 0.85, "aff": "tearful, defended", "txt": "affor d to go on vacation, something I could not. Our first session after the break was difficult and I found myself in tears. He began to soothe me but I fought him and pulled myself together . I felt that he could not see me fall apart; he would not know what to do with that side of me.", "tp": false}, {"pos": 43, "role": "strain", "loc": "patient", "int": 0.5, "aff": "constrained shame", "txt": "This had made me struggle enormously to feel free in therapy . I did not want to be a ‘dif ficult client’ nor one with too many issues. I did not want to be ‘that Black person’ with stories. Now I was in the position of not being able to pay for my therapy .", "tp": false}, {"pos": 44, "role": "rupture", "loc": "patient", "int": 0.85, "aff": "hatred, alienation", "txt": "I started hating Peter , and consequently therapy . I began to feel that Peter did not realize the severity of the socioeconomic problems I faced, that he did not understand my world and never would. How could he? After all, he came from another world, the “other” side.", "tp": false}, {"pos": 47, "role": "impasse", "loc": "dyadic", "int": 0.8, "aff": "frustrated avoidance", "txt": "Peter and me spent numerous sessions around my anger . The more we spoke about it, the more I hated him. He did not seem to understand it, understand me. I became so frustrated that I often started to feel sick just before therapy , then I started finding ways to avoid sessions.", "tp": false}, {"pos": 49, "role": "impasse", "loc": "patient", "int": 0.7, "aff": "cornered, unspoken", "txt": "Now , I had to go to sessions. Cornered, I confessed that I could no longer af ford coming to therapy . He was very practical, for example, off ering Skype sessions. However , this did not address the intense emotions that I could not express to him, that I felt he would never be able to understand.", "tp": false}, {"pos": 50, "role": "turn", "loc": "dyadic", "int": 0.85, "aff": "furious confrontation", "txt": "In one of these heavy sessions, when I walked into the therapy room weighty and full of dread, Peter carefully asked me if I was angry with him because he was White. This made me furious. What was he implying? I am not a racist, thus how can I hate a White person?", "tp": true}, {"pos": 52, "role": "enactment", "loc": "dyadic", "int": 0.6, "aff": "racialized rupture", "txt": "He was the bystander , the silent avoidant witness, the benefiter , while I was the casualty . W e were both products of our past but now our oppressive political pasts were being replayed in our therapy room. For Peter , the issue was that his Whiteness now represented an uncomfortable confrontation. His Whiteness was unconcealable, and thus instantly present.", "tp": false}, {"pos": 56, "role": "meeting", "loc": "patient", "int": 0.8, "aff": "hatred, numbness", "txt": "How then would his therapy work on me? Through bitter and salty tears, I told him that I was so angry with him that I absolutely hated him. Then my world was silent. I felt nothing.", "tp": false}, {"pos": 57, "role": "meeting", "loc": "clinician", "int": 0.85, "aff": "dread, projection", "txt": "I had projected not my anger , but my racial anger into my White therapist. I anticipated, with great anxiety , that what I had said would come back to attack me. I had said it and now it was there. Now , the air was thick with dread.", "tp": false}]}, {"pt": "Patient A", "doc": "Long et al., 2020. Racial Difference Rupture a", "au": "Long et al.", "grp": "relational", "n": 13, "out": "mutative", "tp": 267, "felt": "A Black patient arrives shattered by a racialized injustice, and the White therapist's tears break through three years of polite racial avoidance, making previously disowned difference suddenly, unbearably present between them. What had been skirted becomes speakable, and the dyad moves from surface acknowledgment to shared reckoning with race, envy, and economic disparity.", "shifted": "Race shifted from being briefly named to being a living, mutually owned subject of inquiry; the therapist's countertransferential guilt and Whiteness became conscious and usable rather than defensively managed.", "inwhom": "both, with the deepest shift in the dyad's capacity to hold racial difference; secondarily in the therapist's willingness to own her position and in the patient's sense of being truly met", "turn": true, "meet": true, "mint": 0.63, "u": [{"pos": 15, "role": "strain", "loc": "clinician", "int": 0.85, "aff": "distress, shame", "txt": "CLINICAL MOMENTS OF RUPTURE AND REPAIR 3 Patient A A moment of significance occurred between my therapist and me when I arrived for my session extremely emotional. I broke down in tears and let my therapist know that I had not received a bursary to get me through my M1 year . T o add insult to injury , the majority of my classmates had received the award while I was awaiting a decision on my appeal. On this particular afternoon, I became overwhelmed by the possibility of not having a way to fund my studies and by witnessing my classmates receiving forms to fill out, accepting their awards and carrying out their bursar duties.", "tp": false}, {"pos": 16, "role": "strain", "loc": "patient", "int": 0.9, "aff": "choked, tearful", "txt": "More significantly , I was very aware that all the classmates who had received the award were non-Black while those who had not received the award were Black. This awareness was exacerbated by the #FeesMustFall protests taking place at the time. W ith all this in mind, I found myself choked up, unable to speak and crying throughout the session. Quite emotionally af fected by my state, my therapist broke down and cried along with me.", "tp": false}, {"pos": 17, "role": "meeting", "loc": "dyadic", "int": 0.75, "aff": "soothed, resentful", "txt": "Although I was initially taken aback by her expression of human emotion, her tears were soothing for me. I felt that she understood. I also felt that my therapist, as a White female, 4 needed to own her counter-tr ansferential guilt for the social injustice I was experiencing as a Black second generation “victim” of the effects of Apartheid. As a Black patient, I am more cognizant of race than my therapist.", "tp": false}, {"pos": 18, "role": "enactment", "loc": "dyadic", "int": 0.7, "aff": "racial vulnerability", "txt": "Perhaps what may have been unconscious or disowned by my therapist – her Whiteness in relation to my Blackness – had now , through her tears, become intolerably conscious and resonant. W as I safe enough to break down in front of my White therapist? She was not in the same position as I but had walked a path I was currently finding my feet through. There is no denying that being a therapist in training as well as being a female had an important ef fect on the intensity of how I was feeling.", "tp": false}, {"pos": 19, "role": "strain", "loc": "clinician", "int": 0.8, "aff": "envy, mistrust", "txt": "In addition to racial and economic diff erence, I felt unconscious anger , jealousy and envy at the fact that my therapist probably traveled my very same journey of becoming a therapist, at the same university I was attending, doing the very same stream of psychology with much more ease by virtue of being White. Could I trust my vulnerability to be delicately handled by her , and trust that she would look inward to know and name and put into words what I was thinking and feeling? In hindsight, had she failed, she would have reenacted what is psychologically racially traumatic for me as a Black person and student, where racial and economic experience goes unacknowledged or is downplayed. In this moment there must have been an unconscious fear for both my therapist and me that I would say something racist.", "tp": false}, {"pos": 20, "role": "enactment", "loc": "clinician", "int": 0.7, "aff": "fear, wariness", "txt": "There must have been an underlying thought that I may have anger or hate toward White people and that she may be attacked. There must have been a fear that she would enact a racist response instead of being able to interpret or make sense of what I was saying to her . By virtue of being White, she was not exempt from whatever I felt or said about White people in that moment. In this moment, my therapist was part of the problem and her recognition of this, by reflecting how diff icult it was for me to be expressing all that I was to a White person, made 3 Each account offers a summarized version of the original reflective essay . 4 There is considerable awareness in South Africa of White guilt – and shame – connected to the consequences of White oppression and privilege during (and post) Apartheid (see e.g., refs).", "tp": false}, {"pos": 22, "role": "other", "loc": "patient", "int": 0.6, "aff": "averted trauma", "txt": "Had she not reacted in the way that she did, this incident may have had the reverse ef fect on me. Unconsciously it would have evoked emotional trauma I have experienced all my life by virtue of being a Black person. I probably would have not been able to bring it up in the next session and would have gone a long period of silently suffering inside until another incident occurred or I could conjure up the courage. Instead, my therapist was my witness who validated my experience.", "tp": false}, {"pos": 23, "role": "meeting", "loc": "patient", "int": 0.8, "aff": "shame, gratitude", "txt": "She made me feel that I had every right to be sad and hopeless. In particular , she seemed to really understand my feeling of shame and embarrassment in a situation where one would expect anger . I was struck that my therapist cared for me and was connected to my experience. In that moment she became human, accessible and a person who cared for me beyond our professional relationship.", "tp": false}, {"pos": 24, "role": "turn", "loc": "dyadic", "int": 0.6, "aff": "pivotal authenticity", "txt": "After three years of therapy , this one moment proved profoundly pivotal. I felt that we had engaged in authentic work that extended far below the surface. From the moment my therapist initially opened her doors to me, there was an unspoken self-disclosure: She was White, female and of a certain age. From the very beginning our relationship could not escape racial or economic differe nce: I was a Black person seeking therapy from a White therapist at a reduced rate.", "tp": true}, {"pos": 25, "role": "strain", "loc": "patient", "int": 0.4, "aff": "avoidant unease", "txt": "In the previous three years, the issue of race had been briefly acknowledged once or twice in a way that to me seemed to be “we should acknowledge these things” rather than delving deeper into what it meant for me as a Black person to see a White therapist in the af fluent North of Johannesburg. The option to interrogate it had been offered but I shied away from it as it had never been a big enough issue, nor did any of the moments feel comfortable or timed accurately . For this moment to be so powerful for both of us, though, I wondered if we had unconsciously disowned race from our subjectivity . What was clear was that my therapist was no longer able to take a neutral stance.", "tp": false}, {"pos": 26, "role": "other", "loc": "patient", "int": 0.4, "aff": "reflective wondering", "txt": "In the week leading up to our next session, I had time to think. I realized that my therapist might have partly resonated with my position. Knowing she is of East European Polish decent, I wondered whether she is Jewish, and therefore understands mar ginalization and exclusion. Perhaps we were both second generation “victims” of a discriminating regime.", "tp": false}, {"pos": 28, "role": "turn", "loc": "dyadic", "int": 0.5, "aff": "curious, probing", "txt": "This required us to openly discuss the unconscious and conscious pain race carried for us in therapy and our unavoidable financial disparities. A few weeks later , my therapist opened up the possibility that White therapists find it difficult to speak about issues of race and their White privilege. I found this intriguing; I couldn’t help but wonder if this was her way of trying to tell me what she could not weeks beforehand: that she felt guilty for her White privilege and racial gains, and very aware that I was now experiencing the ef fects of Apartheid. My therapist’ s disclosure was undeniably resonant and powerful.", "tp": false}, {"pos": 30, "role": "other", "loc": "none", "int": 0.2, "aff": "theoretical", "txt": "It is in moments such as this that therapy can progressively shift in significant ways for both client and therapist. It is in these moments where years of important work can ultimately lead to a feeling of true understanding. More importantly , such moments demonstrate the need to acknowledge socio-cultural issues such as race and class as part of our everyday experiences. It was not luck that made this possibly destructive moment transformative for us: W e had genuinely put in the work over the years in order to be able to survive as only my therapist and me could.", "tp": false}]}, {"pt": "Mr D", "doc": "[The New Library of Psychoanalysis] John Stein", "au": "—", "grp": "other", "n": 13, "out": "ongoing", "tp": 623, "felt": "A patient defends against unbearable guilt through manic, dismissive replacement of objects, leaving the analyst feeling unimportant and helpless; brief moments of contact threaten panic and retreat into grievance.", "shifted": "Fleeting acknowledgment that the analyst was affected and that the patient was upset by perceived disappointment, opening a narrow window onto vulnerability beneath the arrogant organization.", "inwhom": "primarily the patient (Mr D), with corresponding shift in the analyst's recognition of the countertransference", "turn": true, "meet": true, "mint": 0.54, "u": [{"pos": 311, "role": "enactment", "loc": "dyadic", "int": 0.7, "aff": "discarded, misused", "txt": "He used omnipotent manic mechanisms and exacted his revenge indirectly by a restless and ruthless replacing of his objects with something new and better. In his analysis he achieved this by ignoring my interpretations and by repeatedly turning away, leaving me feeling discarded and misused. Often this appeared to be a type of revenge enacted by a reversal so that he treated me in precisely the way he felt treated both in his everyday life and in his analysis. He allied himself with an omnipotent organization which offered protection against guilt by inviting him into a manic state of mind where consideration for the state of his objects was not necessary and where damage could be undone with such omnipotence that guilt was inappropriate.", "tp": false}, {"pos": 313, "role": "strain", "loc": "patient", "int": 0.45, "aff": "grievance, justification", "txt": "Revenge, resentment, remorse and reparation 75 persecution. He occasionally realized that his hatred had damaged his objects, but he usually argued that he had no need to feel guilt. With his chronic sense of grievance he was able to feel justified and in the right. In both patients problems became evident when they made moves to emerge from the retreat and to face their psychic reality.", "tp": false}, {"pos": 314, "role": "turn", "loc": "patient", "int": 0.75, "aff": "horror, panic", "txt": "As they did so, they began to get a glimpse of the state their objects had been reduced to in their phantasy and they were filled with horror, and threatened with anxiety and guilt. For Mr D, such moments of contact predominantly gave rise to panic, which was chiefly associated with a time when he had been deeply depressed. He looked on the possibility of a recurrence with such dread that the slightest contact with depressive feelings sent him into a flight back to the protection of the organization. It seemed to me that the horrendous state of his objects was unconsciously felt to result from the vengeance acted out on his behalf with cruelty and ruthlessness by the organization, and also from the way he had denied any responsibility for the hatred and neglect of his objects while sheltering in the retreat.", "tp": false}, {"pos": 316, "role": "other", "loc": "none", "int": 0.2, "aff": "theoretical", "txt": "The central issue for both patients as they attempted to free themselves from the domination of the organization was whether the guilt was bearable or not (see Steiner 1990a). If it was bearable, as was true occasionally in the case of Mr E, the patient felt able to risk a struggle for his independence from the organization, while if it was unbearable, as seemed to be the case with Mr D, the patient felt obliged to relinquish his freedom and return once more to the protection of the organization in the retreat. In these cases pathological organizations came to be deployed in an attempt to protect the object and to evade guilt, but, in fact, only served to convert the overt attack into a more hidden and chronic campaign. The fear of a violent and open expression of hatred and destructiveness leads to a chronic state in which the object is not destroyed, or allowed to die, but is tormented, disabled, and held onto in a half dead state.", "tp": false}, {"pos": 318, "role": "other", "loc": "none", "int": 0.35, "aff": "betrayed, wronged", "txt": "These expressions suggest that the resentment may be linked to early experiences such as those of weaning, or the arrival of a new baby in the family, which involved loss in a setting where this seemed unfair and the patient felt betrayed and wronged. A wound results which may become so invested with narcissism that it is denied the opportunity for proper healing. In these cases the patient may come to believe that the objects which have wronged him are so totally bad that they can never be forgiven and his own hatred and his wish for revenge are felt to be so total that they are equally unforgivable. Subsequently, even if the loss seems bearable, the injury is nursed in order to keep the sense of injustice alive and to defend against any sense of responsibility.", "tp": false}, {"pos": 319, "role": "other", "loc": "none", "int": 0.3, "aff": "stuck, guilt", "txt": "The pathological organization supports the patient and helps him to evade guilt which is felt to be appropriate for the object rather than the patient to feel. At the same time, the conviction that the guilt is unbearable leads to an extremely stuck situation where change is resisted and progress in the analysis is blocked. An important feature of these situations is that the patient appears to be preoccupied with the future. His current suffering is masochistically endured and he lives in hope that in the future right will be done and he will be avenged.", "tp": false}, {"pos": 321, "role": "other", "loc": "none", "int": 0.3, "aff": "unacknowledged hatred", "txt": "Revenge, resentment, remorse and reparation 77 the hatred goes unacknowledged, attacks can continue without any sense of responsibility, guilt or conflict. Nevertheless, for brief periods, at least in some cases, the patient is able to emerge from the retreat so that the torturing becomes less prominent and his impulses towards the object are more open and direct. If he can retain sufficient contact with his psychic reality to acknowledge both his hatred, which leads to the wish to destroy the object, and his love, which makes him feel remorse and regret, then development can proceed. The contact with the reality of the state of his objects allows him to recognize the damage his hatred has accomplished, and he is able to struggle with those rich and painful experiences connected with loss which we associate with mourning.", "tp": false}, {"pos": 329, "role": "rupture", "loc": "patient", "int": 0.7, "aff": "hurt, wronged", "txt": "Now he was afraid I was just like an ex-girl-friend and that he was back to square one. He had begun the analysis with enthusiasm but he now felt so hurt and wronged that it had become intolerable.", "tp": false}, {"pos": 330, "role": "impasse", "loc": "dyadic", "int": 0.6, "aff": "dismissal, resignation", "txt": "Revenge, resentment, remorse and reparation 79 His reaction was to say that he sees all that but he has to do it and he is sure that I understand. I interpreted that he hoped that I could see that he felt he had no choice, and that he was obliged to dismiss what I said to him as unimportant just as he was forced to turn to other departments, which meant the end of the analysis and felt like a return to square one. I suggested that the underlying situation which he could not bear was one in which the meeting held in the next-door office reminded him of my independent existence and of times when he was excluded. This was particularly acute when a holiday or weekend was impending as was now the case, since I had given him my holiday dates in the previous session.", "tp": false}, {"pos": 331, "role": "meeting", "loc": "dyadic", "int": 0.7, "aff": "arrogance, vulnerability", "txt": "He said that he felt I hated it when he became arrogant and dismissive of me, and I think he sensed that I was affected and vulnerable. However, he added that when I spoke about things like holidays it had no effect on him and he assumed that he had a blind spot since he never understood why I took that up so often. He found that his mind turned to other things. He did not feel any hostility to me although he thought I was right and that he hated the Senior Lecturer, the Professor and also his father.", "tp": true}, {"pos": 332, "role": "meeting", "loc": "dyadic", "int": 0.6, "aff": "superiority, disappointment", "txt": "I interpreted that, although he was staying calm and superior, he was upset when he felt I was disappointed in him. I think he saw me as someone who had to protect himself and that I became superior in turn and tried to make him feel dependent on the analysis. Although fantasies of a triumphant reversal of his dependence on his father, on his professors and on his girl-friend were quite conscious and he could recognize that this involved turning the tables on them, he did not admit that he felt any hatred and he did not connect these fantasies with a wish for revenge. Nor was he able to acknowledge his hatred of the analysis, which he consciously saw as something he valued and was simply forced to give up due to circumstances.", "tp": false}, {"pos": 351, "role": "strain", "loc": "patient", "int": 0.65, "aff": "panic, manic", "txt": "In the case of Mr D I thought this occurred when he presumed I would view him as ‘back to square one’, and again when he became afraid that he had ‘burnt his bridges’. These instances seemed to represent moments when the patient felt threatened by a loss and which led him to panic and to return abruptly to a manic superiority. It was as if he believed that any experience of loss would throw him into the depression he dreaded. Mr E was able to sustain the contact with loss for a longer period and could acknowledge his hatred for the Member of Parliament and his wish to get even with him.", "tp": false}, {"pos": 426, "role": "enactment", "loc": "clinician", "int": 0.7, "aff": "unimportant, helpless", "txt": "In fact, his hatred was expressed by the way in which he would ignore my interpretations and proceed to describe his excitement with new jobs and new girls which made me feel unimportant and helpless. While he seemed to recognize the effect this had on me, he denied his hatred and continued to maintain that he valued the analysis and that the problems which arose stemmed solely from his need to give his work priority which he was sure I understood. I was simultaneously a figure he valued and one he triumphed over, one he tried to preserve and one he tried to destroy. His manic state of mind was simultaneously an excited, triumphant state and one which damaged his objects and destroyed his prospects.", "tp": false}]}, {"pt": "Sylvia", "doc": "H. Rosenfeld - Impasse and Interpretation_ The", "au": "Rosenfeld", "grp": "kleinian", "n": 12, "out": "ongoing", "tp": 415, "felt": "A psychotic patient repeatedly feels missed by an analyst who is flustered and out of touch, forcing the patient into a prematurely grown-up position of carrying the dyad, until small moments of honest acknowledgment let underlying terror and longing for logic surface.", "shifted": "From mutual missing and projective evacuation toward tentative naming of the analyst's fluster and the patient's fragile positive links, opening access to desperate need for coherence.", "inwhom": "primarily the patient, with partial shift in the clinician's capacity to acknowledge her own countertransference", "turn": true, "meet": true, "mint": 0.57, "u": [{"pos": 150, "role": "impasse", "loc": "dyadic", "int": 0.55, "aff": "confused, unreal", "txt": "At this point her analyst made a third comment suggesting that Sylvia was frightened of being left alone. This time Sylvia replied by talking about how she had rung the bell at the beginning of the session but had to wait for the analyst to use the buzzer to let her in. This comment confused the analyst, but subsequently Sylvia repeated how she felt unreal, stating that, as she was waiting at the door, she had tried to look at the analyst ’s name-tag under the bell. This time the analyst interpreted that the patient was trying to express how much she needed evidence that the analyst existed.", "tp": false}, {"pos": 153, "role": "strain", "loc": "patient", "int": 0.7, "aff": "frightened, unheard", "txt": "When this is not understood she begins to be frightened because she fears that her analyst is ‘flustered’ by her. Next, growing more worried, she employed strong symbolic language to suggest that she felt the analyst was out of touch with her, that she didn ’t ring a bell in the analyst ’s mind. Then, worried by the time it is taking for the bell to work in the analyst, she repeats how she feels unreal and implies she is getting confused about where she is and who she is talking to, referring to the name-tag. Finally, exasperated in her own way, she still tries to communicate about what is happening by 38 IMPASSE AND INTERPRETATION", "tp": false}, {"pos": 187, "role": "enactment", "loc": "clinician", "int": 0.65, "aff": "fragmented, burdened", "txt": "Her severe paranoid anxiety indicates that she is constantly threatened by the deathly return of her projections. Dr M. discussed her counter-transference in those early sessions and reported that she found it difficult to remember or record the sessions. She felt that the material was too fragmented. She also described that she had a feeling that she had to bring the patient into the consulting room with her eyes and watch her go out of the room as if there was some need to maintain contact through the eyes.", "tp": false}, {"pos": 192, "role": "strain", "loc": "dyadic", "int": 0.55, "aff": "worried, suspended", "txt": "There was a very short silence, and then she started to talk: “A thing that still worries me is my husband going away. I do not know where it will be, or how long it will be, it may be somewhere very remote, there is nothing definite —and there is nothing definite. ” Here she makes a long pause and then she says, “Anyway, this is what I am worrying about. ” I responded, “You appear to be living in a state of uncertainty with a feeling of dread hanging over you. ”’  This is a straightforward acknowledgement by Dr M. of the patient’s emotional state and does not introduce any misunderstanding. Sylvia said that she actually agreed with her. ‘Sylvia replied with something which I do not recall, but I remember my interpretation, namely that Sylvia ’s anxiety seems to join up in her mind with the weekend. ’  In other words the analyst interprets Sylvia ’s anxieties as if she had wanted to say, ‘It is Wednesday today and it is already in my mind that the weekend is approaching and then on Saturday what will it be, where will Dr M. be, what will Dr M. be doing, and when will she come back to me? ’ BREAKDOWN OF COMMUNICATION BETWEEN PATIENT AND ANALYST 47", "tp": false}, {"pos": 193, "role": "meeting", "loc": "dyadic", "int": 0.5, "aff": "attuned anxiety", "txt": "‘Sylvia then said, “It is important for people I am with, whereas at one time I used to make comparisons about how people coped. Now it is the way things feel and how I feel. ” I interpreted that this meant that Sylvia was very much influenced by her feelings of what she believes other people to be feeling. Sylvia reported, “Yes, I must be very careful if somebody gets flustered. Then I have to be calm. ”’  It seems to me that from the beginning of the session Sylvia attempted to bring her feelings of being at a loss and emotionally remote from Dr M. right into the session.", "tp": false}, {"pos": 196, "role": "turn", "loc": "dyadic", "int": 0.6, "aff": "flustered, tentative", "txt": "Dr M. ’ Dr M. reported that she was unclear what Sylvia meant and so she asked Sylvia, how did she feel now? Sylvia gave a little laugh and said, ‘Well, actually I am feeling rather flustered. ’ She gave another little laugh and said, ‘I do not want to annihilate you. ’ Dr M. replied to this interchange by saying that it seemed as if the interpretation (that she might have been worried that Dr M. might not be here over the weekend) had upset Sylvia. Sylvia replied to this, ‘This takes me back to Monday, today, and wearing black. ’ (Dr M. explained to the seminar that Sylvia had reported in the Tuesday session that she had been rather disconcerted by the fact that Dr M. was wearing a black blouse on Monday. In fact Dr M. had been wearing a white shirt) Dr M. therefore interpreted that it seemed that if she interpreted anything to Sylvia about her being absent it immediately recalled to Sylvia’s mind the anxiety about the analyst dying.", "tp": true}, {"pos": 200, "role": "strain", "loc": "patient", "int": 0.6, "aff": "resigned, yearning", "txt": "At this point Sylvia seems to get fed up: ‘I have given up about the car. ’ She then makes a touching statement about the anxiety she experiences when she tries to communicate her feelings to Dr M. and has to wait until she is open to her communication. She has verbalized the non-verbal content of the beginning of the session: ‘Will what I say ring a bell to Dr M. ’s mind, or not? ’ In this session, as sometimes happens, the analyst could not respond to Sylvia. Dr M. reported that at this stage she felt somewhat confused. She was aware that she had made a mistake by introducing the car because Sylvia suddenly talked about another car, a Citro ën, which was not the analyst ’s car.", "tp": false}, {"pos": 204, "role": "rupture", "loc": "patient", "int": 0.7, "aff": "lost, small", "txt": "Separation must be an anxiety of an older child (perhaps at one year of age), but at this moment in the session Sylvia probably experiences herself feeling much smaller. She is lost and unable to deal with time. She is anxious about something to do with Dr M. ’s incapacity to understand her because she talks again about wiping out Dr M., albeit by talking about her mother: ‘I do not know whether my mother wipes me out or my problems or whether I am the one who wipes out my mother and my mother ’s problems. ’ She now seems to fear that Dr M. is causing her (Sylvia ’s) incapacity to deal with problems by attacking her state of mind with her problems. But Sylvia also wonders whether she is attacking Dr M. ’s mind with her problems.", "tp": false}, {"pos": 206, "role": "enactment", "loc": "patient", "int": 0.55, "aff": "prematurely grown-up", "txt": "In this whole session Sylvia has to be more reasonable and understanding than Dr M. She has to be more grown up, and I think this is being expressed in the fact that she calls herself twenty-eight instead of twenty-seven. She tries to convey. ‘I can ’t be a baby, I have to try to be a bit older.’ Dr M. seemed certain that Sylvia ’s anxiety was created by her physical absence (the coming weekend and the missing car), and this made Sylvia afraid that Dr M. might die. So, when Dr M. interprets this anxiety, Sylvia again very desperately tries to bring Dr M. back to the point.", "tp": false}, {"pos": 237, "role": "meeting", "loc": "patient", "int": 0.55, "aff": "guilt, fragility", "txt": "In other words, she is able to indicate that her positive self is unfortunately the weak link in her ego. This material is very touching and demonstrates, I feel, how clearly in such a destructive manic patient the awareness of her fundamental problems are presented, if one listens to her very carefully. In her next communication Sylvia says, ‘I feel guilty about hurting everyone and then I do not seem to be able to take in what is good. There seems to be so much good and it all turns bad. ’  In other words, Sylvia admits her anxiety about her destructive s e l f a n d s a y s t h a t i t i s n o t s o m u c h D r M . l e a v i n g h e r w h i c h worries her but the fact that she is distressed about being so destructive and evil.", "tp": false}, {"pos": 239, "role": "turn", "loc": "patient", "int": 0.7, "aff": "desperate appeal", "txt": "Dr M. acknowledged Sylvia ’s anxiety about her difficulties in thinking, but Sylvia then burst out, ‘I must find some kind of logic. ’  At that moment, after her awareness of her aggressive attacks and the weakness of her positive links, Sylvia herself stresses that she has lost her capacity for common sense and logical thinking. She appeals to Dr M. to provide or restore to her the parts of herself which can think clearly and have common sense. In the remaining, sessions that we discussed in the seminars Sylvia continued to communicate very clearly in spite of the deterioration of her condition and the severe increase of splitting of the self, which occurred when she got rid of her anxious state of mind and projected it into her husband. However, when she did not improve in the analysis after many months, her husband left her.", "tp": false}, {"pos": 242, "role": "other", "l
