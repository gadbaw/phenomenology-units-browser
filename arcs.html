namic_Therapy_for_Personality_Patholog", "au": "Caligor et al.", "grp": "other", "n": 8, "out": "mutative", "tp": 855, "felt": "The clinician is repeatedly flooded with protective anxiety for the patient's child, first metabolizing it into interpretation, then later succumbing to it in an impulsive weekend phone call. Retrospective recognition of the enactment as countertransferential unburdening allows him to recover a workable stance.", "shifted": "Dr. P moved from being driven by anxiety to act, to recognizing the enactment as his own need to discharge discomfort, restoring a reflective technical stance that distinguishes genuine clinical safety concerns from countertransferential pressure.", "inwhom": "clinician", "turn": true, "meet": true, "mint": 0.57, "u": [{"pos": 667, "role": "turn", "loc": "clinician", "int": 0.7, "aff": "protective fear", "txt": "She appeared free of all anxiety, while Dr. P noted that he was feeling afraid for the child and in some way responsible for protecting her. Making use of this countertransference, Dr. P ventured an interpretation, pointing out that it seemed Ms.", "tp": false}, {"pos": 675, "role": "meeting", "loc": "none", "int": 0.2, "aff": "explanatory", "txt": "P felt he could reinstate neutrality. He pointed out to Ms. W that in asking her to change her plans, he had stepped out of his usual role of helping her to make her own choices while abstaining from advising or telling her what to do. He commented that he had done so because he felt she had left him no alternative; she had been knowingly exposing her child to danger and did not seem concerned.", "tp": false}, {"pos": 712, "role": "turn", "loc": "clinician", "int": 0.6, "aff": "anxious helplessness", "txt": "P used his reflective capacities to feel less anxious and afraid than he had initially. In essence, his internal processing of his countertransference enabled him to modify, within himself, an initial experience of anxiety and helplessness close in quality to that of his patient’s dissociated experience, transforming it into an experience that was better integrated and less affectively charged, as well as less threatening. Clinical Illustration 7: Working With Countertransference Ms. O was a 45-year-old divorced, professional, childless woman with narcissistic and histrionic features organized at a very high borderline level.", "tp": false}, {"pos": 737, "role": "strain", "loc": "clinician", "int": 0.7, "aff": "mounting anxiety", "txt": "P recognized that he was becoming increasingly anxious about the safety of Ms. W’s child. Even though Dr. P tried reminding himself that in the end, Ms.", "tp": false}, {"pos": 740, "role": "enactment", "loc": "clinician", "int": 0.8, "aff": "worn, preoccupied", "txt": "Over a weekend when Dr. P was feeling especially worn out and burdened by personal difficulties, he found himself particularly uncomfortable and preoccupied about Ms. W. Impulsively, on Sunday morning, he called Ms.", "tp": false}, {"pos": 742, "role": "turn", "loc": "clinician", "int": 0.55, "aff": "burdened urgency", "txt": "P came to feel that his behavior had been driven largely by his countertransferential need to unburden himself; he recognized that if he felt it clinically indicated to introduce a safety net for the child, there were ways that he could strategically go about doing so. When Ms. W came to her next session, she was silent. Dr.", "tp": true}, {"pos": 745, "role": "enactment", "loc": "clinician", "int": 0.8, "aff": "compelled anxiety", "txt": "P found himself unable to contain his countertransferential anxiety. In the moment, he felt compelled to act, somewhat impulsively, in an effort to alleviate the extremely uncomfortable feelings that Ms. W had engendered in him. In retrospect, Dr.", "tp": false}, {"pos": 759, "role": "other", "loc": "none", "int": 0.2, "aff": "technique", "txt": "P would neither share his discomfort as a venue for deepening Ms. W’s understanding of herself and her world, nor assume the position of an expert telling Ms. W what to do (unless he was forced to deviate from neutrality); rather, he would use his discomfort to ask himself, “Why am I uncomfortable? Would a normal or average person find this to be a dangerous and anxiety-provoking situation?” He would then use his internal dialogue to confront the patient’s denial of an evident reality—the danger to her child—that part of her must have fully appreciated but that she chose to ignore.", "tp": false}]}, {"pt": "Mrs B.", "doc": "[Routledge Mental Health Classic Editions] Pat", "au": "—", "grp": "other", "n": 33, "out": "mutative", "tp": 463, "felt": "An accommodating flexibility enacted by the analyst collided with the patient's unmet early trauma, producing escalating ruptures until the analyst could bear, rather than deflect, what the patient was inducing in him. Survival-by-containment then allowed a primitive maternal holding to be re-found.", "shifted": "The analyst stopped fleeing the present discomfort into transference-past interpretation and instead tolerated and voiced the unbearable feelings the patient was making him experience; this enabled the patient to re-access a pre-traumatic maternal holding.", "inwhom": "both — primarily the analyst's stance shifted (from collusive flexibility and deflection to enduring containment), which in turn allowed the patient to relive and integrate early trauma", "turn": true, "meet": true, "mint": 0.6, "u": [{"pos": 433, "role": "enactment", "loc": "clinician", "int": 0.4, "aff": "accommodating, uncertain", "txt": "Therefore, when she showed anxiety about losing her /g191 fth session permanently, I wondered if she had been prompting me to offer her a similar /g192 exibility. As a result I offered her a compromise arrangement. I agreed to keep her usual Friday time available for a month or two, during which period she could see how it felt to be coming only four times per week. Then, when Mrs B. showed concern about my wanting to use that time for another patient, I told her I would be using it for myself, for reading.", "tp": false}, {"pos": 434, "role": "strain", "loc": "patient", "int": 0.55, "aff": "grateful then anxious", "txt": "She seemed pleased and grateful for this offer; but, as soon as she began coming less frequently, her anxiety mounted. The week I shall now present is the fourth week with this reduced frequency of sessions. Hindsight: We can see that I have interrupted the analytic process in a number of ways. Rather than analysing the un-resolved anxiety about dropping this session, I have presented myself in the role of a good mother, offering a /g192 exible weaning.", "tp": false}, {"pos": 439, "role": "other", "loc": "patient", "int": 0.5, "aff": "anxious fragile", "txt": "I therefore choose to interpret with this issue as my focus. I said I had the impression she was anxious about dropping the /g191 fth session, partly because she was afraid she might not be inwardly strong enough to cope with the change, and she might be afraid I would assume from such a change that the emotional scars had healed more than perhaps they had. The patient agreed with this interpretation and told me the other dream. She had been swimming very slowly in a pool.", "tp": false}, {"pos": 443, "role": "enactment", "loc": "clinician", "int": 0.45, "aff": "deaf, assuming", "txt": "I am still assuming this /g192 exibility to be what the patient needs, so I am deaf to any indications to the contrary. Mrs B. then told me she wanted to explore the question of the Friday sessions further. I suggested to her she could do one of two things, with regard to Fridays: either she could use her Friday time on a demand-feeding basis, asking for the extra session during those weeks when she felt a need for it, or she could go back to /g191 ve sessions for as long as needed. I suggested she let me know which way she would like to arrange the Friday sessions when she felt ready to decide.", "tp": false}, {"pos": 447, "role": "impasse", "loc": "dyadic", "int": 0.4, "aff": "defensive, blocked", "txt": "92 On Learning from the Patient about her experience with patients who had been pregnant during analysis. She had quoted several such cases, in all of which the mother had at some stage brought the baby to a session. When I mentioned I had a patient who had never brought her baby to a session, the patient having been pregnant while in analysis with me, I was told that I may have been blocking her from feeling able to show me her baby; perhaps I had been communicating some jealousy of her relationship with her baby, from which I was excluded. I had not thought so at the time, and I had felt no need to bring this issue up with her until now.", "tp": false}, {"pos": 449, "role": "enactment", "loc": "clinician", "int": 0.6, "aff": "guilty intrusive", "txt": "Indications of countertransference are present in the manipulative quality of my intervention and in the implied pressure upon the patient to feel that she ‘should’ bring her baby, or a photograph of him, to show me. Mrs B. replied to this by saying she hadn’t felt I needed to see the baby, or a photograph of him, because she had assumed I already knew him so well through her. (This was the end of the session.) Internal supervision: I feel reprimanded by the patient. In her response she points out that I should not need to see her baby, or a photograph of him, at least not for the purposes of the analysis. She indicates that she had assumed I knew him well through her, but now she may be wondering whether I do.", "tp": false}, {"pos": 459, "role": "strain", "loc": "clinician", "int": 0.7, "aff": "self-critical discomfort", "txt": "But, I am still being too quick to pass on to the past from the uncomfortable reality in the present. In effect, I am de/g192 ecting the patient away from my own failure in attention to that of her mother. This could be seen by her as a further indication of my sense of discomfort at the recent lapses in the analysis. I do not leave her free to elaborate on this, in her own way or in her own time.", "tp": false}, {"pos": 464, "role": "strain", "loc": "patient", "int": 0.4, "aff": "possessive anxiety", "txt": "The niece wants to keep her cookery book for herself, to prevent her brother using it when she is away. The patient may be alluding to my telling her I would use her time on Fridays for myself when she is away. She could feel I am wanting the time for myself, not wanting her to have it. I said I felt she needed to con/g191 rm that she was being allowed enough freedom for her decision about the Friday sessions to be really her own.", "tp": false}, {"pos": 465, "role": "rupture", "loc": "clinician", "int": 0.65, "aff": "rebuked uneasy", "txt": "Mrs B. replied to this by saying she didn’t feel I was interfering in any way with that. There was then a silence. Internal supervision: I note the word ‘interfering’, and again I feel rebuked by the patient. I sense this might be related more directly to the photographs.", "tp": false}, {"pos": 466, "role": "turn", "loc": "dyadic", "int": 0.6, "aff": "tentative reparative", "txt": "I said to Mrs B. I felt perhaps the missing freedom had more to do with the fact that I, and not she, had raised the issue of the photographs. Although she had complied with my comments, apparently happily, I felt she may have had more reservations about doing so than she had been showing. She picked this up quite readily and said that, although she was pleased I had seen the photographs, she was aware of being anxious I might assume from them that everything was now all right.", "tp": false}, {"pos": 467, "role": "rupture", "loc": "patient", "int": 0.6, "aff": "hidden distress", "txt": "Everyone looked so well and happy in the photos. She was afraid I might be unaware that, inside herself, she was still having to deal with more distress than she felt able to cope with in four sessions per week.", "tp": false}, {"pos": 468, "role": "strain", "loc": "patient", "int": 0.5, "aff": "anxious uncertainty", "txt": "96 On Learning from the Patient Internal supervision: I note the patient is elaborating on her anxiety related to showing me the photos, and she inserts a further reference to the still unresolved question of frequency. I see that I must attend to this now. I said she was clearly still anxious about the question of the Friday sessions. She replied that she was, and asked if she could (at least) come this week on the Friday.", "tp": false}, {"pos": 483, "role": "strain", "loc": "dyadic", "int": 0.5, "aff": "faltering attunement", "txt": "There may be a reference to my not having been more enlightened in my recent handling of her sessions. I have become like the car – not working properly. I said she may have needed to feel that the photo had been lost, for the purpose of this session, so we could look at the implications of this for her. For instance, she could feel (with some justi/g191 cation) that she would not have lost this photo if I hadn’t mentioned she might show it to me.", "tp": false}, {"pos": 493, "role": "enactment", "loc": "clinician", "int": 0.6, "aff": "impatient intrusion", "txt": "I see this as some degree of con/g191 rmation, and I feel that perhaps we can now look at the transference elaboration of this experience. Hindsight: It is evident I remain impatient to move away from the present reality. By not giving her time to continue from here on her own, I am still threatening her space while acknowledging her need for me not to do so. I said it was possible I had come to represent a bit of her past experience with her mother, in which she had not felt able to stand up to her, or in this instance to me.", "tp": false}, {"pos": 495, "role": "other", "loc": "patient", "int": 0.3, "aff": "matter-of-fact", "txt": "Listening from an interactional viewpoint 101 Hindsight: The Friday issue is dealt with only temporarily here. It is not until after this week that the Friday sessions are reinstated on a regular basis, so in this sense the Fridays are still missing. Mrs B. continued by saying that on Thursday evening her husband had been away, so she had invited herself to supper with friends. She told me in detail about a rich sweet dish that she took with her to the supper, how she had eaten too much and had then felt sick.", "tp": false}, {"pos": 496, "role": "other", "loc": "clinician", "int": 0.4, "aff": "noticing attentive", "txt": "In the night she had been afraid she might be ill the following day and unable to feed Peter, who was still being breast-fed. She therefore made herself vomit; and by the morning she was feeling better and more able to cope. Internal supervision: I note the themes: husband absent; feeding herself; making herself feel sick by eating too much; fear of having to interrupt her baby’s feeding. I decide to offer a bridge towards dealing with some of this.", "tp": false}, {"pos": 498, "role": "turn", "loc": "patient", "int": 0.4, "aff": "resolved agency", "txt": "She also pointed out that she was aware of having had a choice: either to remain feeling ill and helpless, or to do something about it in order not to have to interrupt her present feeding pattern with her baby. Internal supervision: She indicates the theme of interruption, which I see as alluding to interruptions of various kinds. I decide not to interrupt here. She went on to say it would not necessarily have meant having to wean Peter abruptly; but certainly she thought it would have meant an unwarranted interruption of the feeding pattern.", "tp": false}, {"pos": 502, "role": "strain", "loc": "patient", "int": 0.5, "aff": "guilty protective", "txt": "She had also said in front of Emma: ‘It would be so nice for me.’ Mrs B. felt terrible about this, feeling very sorry for the child and feeling she should have been given a chance to say what she wanted. Mrs B. went on to say it seemed wrong to push Emma out of her own home in this way, to please her mother. Internal supervision: I seem to be hearing about a self-interested mother. Listening /g191 rst for the external realities being alluded to here, I wondered if that incident were being told to me as a further unconscious prompt from the patient.", "tp": false}, {"pos": 507, "role": "other", "loc": "clinician", "int": 0.4, "aff": "reflective, curious", "txt": "Internal supervision: I note her emphasis on ‘consciously’, so I wonder about the unconscious aspect. I said I felt that to her unconscious, my having told her about my wish to have time for reading had given her occasion to develop a perception of me as being too much like her mother, wanting to have time to get on with her own things, and like Emma’s mother who had behaved in a similar way. Mrs B. said the child part of her would probably latch onto anything like that to feel anxious about. She said she was wondering whether her need to go back to /g191 ve times per week had stemmed from a need to be sure that her Friday times would still really be there for her.", "tp": false}, {"pos": 513, "role": "meeting", "loc": "dyadic", "int": 0.6, "aff": "painful conflict", "txt": "I said there had been a painful con/g192 ict in her. She had been anxious for me to be sensitive to her child needs, in order that my behaviour did not appear too similar to the insensitivities she had experienced in her mother; but she also needed me to acknowledge her adult strengths. She agreed that she would feel I was letting her down either way: if I responded only to the child in her or only to the adult. As the session was ending, and she was about to leave, the patient added that she wondered whether she had pointed out to me she still had the negative of the lost photograph.", "tp": false}, {"pos": 518, "role": "rupture", "loc": "patient", "int": 0.85, "aff": "terror", "txt": "She was either very small or was lying on her front as the water seemed to be at eye-level. It had then begun boiling and threatened to destroy everything around. She felt the boiling water was coming straight at her. She wanted to turn away, because she was so frightened, but instead she looked at the water and it became an ordinary river again.", "tp": false}, {"pos": 521, "role": "turn", "loc": "patient", "int": 0.8, "aff": "distress, reliving", "txt": "Listening from an interactional viewpoint 107 I commented that the river had stopped boiling once she was able to look at it. I also noted she had ‘forgotten’ this dream until she felt safe enough with me to look at it. She replied she hadn’t realized until telling me the dream that it so clearly referred to the accident. She then became very distressed and began to experience the accident as happening to her in the session.", "tp": false}, {"pos": 522, "role": "rupture", "loc": "patient", "int": 0.9, "aff": "anguished pain", "txt": "It was as if the boiling water were pouring onto her and burning her. She cried out loudly in extreme pain and sat up, saying: ‘When I was lying down it wouldn’t stop coming at me.’ She sobbed for a long time, holding her head in her hands. Internal supervision: Her holding of her head in her hands prompts me to see that she needs to feel held. I recall that earlier in the analysis she had told me that, after the accident, the pain only ever felt tolerable when she was being carried by her mother.", "tp": false}, {"pos": 523, "role": "strain", "loc": "clinician", "int": 0.95, "aff": "excruciating stress", "txt": "She had felt as if she had been able to ‘put’ her pain into her mother; but when her mother laid her down again it had been as if the pain were too much for her mother, so it seemed as if she were ‘putting it back’ into the patient. I cannot but feel under enormous stress, being with the patient now in this session. It is excruciating. I feel a very powerful wish to stop this experience, in any way possible, by trying to reassure her or by trying to divert her: anything seems preferable to remaining witness to her pain.", "tp": false}, {"pos": 524, "role": "turn", "loc": "clinician", "int": 0.7, "aff": "self-protective resolve", "txt": "Alongside this impulse to protect myself is a realization that this had been Mrs B.’s perception of her mother’s response. For the patient’s sake, therefore, I know I must /g191 nd some way of staying with her through what is happening, without trying to by-pass it. I said I felt she was holding her own head in her hands as a way of telling me that she needed to feel ‘held’ through this experience. Still crying, she replied: ‘My mother couldn’t face it – she had to turn away from it – I couldn’t bear it alone.’ Internal supervision: I recall that her mother had in effect caused the accident by not being in the room, where this now mobile child was and where there was water boiling.", "tp": false}, {"pos": 525, "role": "strain", "loc": "clinician", "int": 0.75, "aff": "tested, burdened", "txt": "After the accident her mother had not been able to look at the results of the accident. Mrs B. had a memory image of her mother dressing the wounds while trying to turn her face away from them. I feel I am being tested by the patient to see if I can bear to see her in such pain. She is telling me she cannot bear this alone.", "tp": false}, {"pos": 535, "role": "turn", "loc": "clinician", "int": 0.6, "aff": "guilty recognition", "txt": "But it had never been experienced in the session. I had assumed that so early a trauma could not be really remembered or re-lived in an analysis. I now recognize I must have hoped this, so that I would not have to be confronted by the impact of this trauma upon myself. With hindsight, it is also possible to recognize there was a likelihood Mrs B. would become anxious at the time when she began to feel better because it had been when she was beginning to be a normal lively toddler, exploring the world around her, that the accident had occurred. 2 So, when she felt better and suggested she might be ready to drop one of her sessions, I should have been more alert to the possible signi/g191 cance of this for her.", "tp": false}, {"pos": 536, "role": "enactment", "loc": "clinician", "int": 0.6, "aff": "complicit unease", "txt": "However, it must have suited me unconsciously to collude with the patient’s con/g191 dence, I too wishing to think we had been through the worst of her analysis already. When Mrs B. became anxious, immediately she had begun to do without her /g191 fth session, I was getting early warning signals that all was not as well as it had appeared. When I introduced the topic of her baby, that she had not brought him or a photograph of him to show me, this looks (at /g191 rst sight) entirely unaccountable. On re/g192 ection, however, it begins to make more sense if we see this in terms of what it did to the analysis.", "tp": false}, {"pos": 667, "role": "strain", "loc": "patient", "int": 0.55, "aff": "fearful, seeking safety", "txt": "She had been afraid I might have collapsed over the weekend, under the weight of the Friday session, if I had been left until Monday without knowing she was beginning to feel more hopeful. As this session continued, what emerged was a clear impression that Mrs B. was seeing the possibility of holding my hand as a ‘short-cut’ to feeling safer. She wanted me to be the motionless /g191 gure, controlled by her and not allowed to move, towards whom she could crawl – with the excited expectation that she would eventually be allowed to touch me. Mrs B. then reported an image, which was a waking continuation of the written dream.", "tp": false}, {"pos": 683, "role": "rupture", "loc": "patient", "int": 0.8, "aff": "terrified, dying", "txt": "She could see the contradictions (sure of dying whilst actually being safe) but this did not stop her feeling terri/g191 ed in the dream, and still terri/g191 ed of me in the session. She stressed that she did not know if I realized she was still feeling sure she was dying inside. On the following Monday Mrs B. told me she had dreamed that she had come for her last session as she could not go on. She had begun falling for ever, the couch and the room falling with her.", "tp": false}, {"pos": 692, "role": "turn", "loc": "clinician", "int": 0.8, "aff": "despair, paradox", "txt": "Analytic holding under pressure 141 This enabled me eventually to interpret from the feelings engendered in me by the patient. Very slowly, and with pauses to check that the patient was following me, I said to her: ‘You are making me experience in myself the sense of despair, and the impossibility of going on, that you are feeling . . . I am aware of being in what feels to me like a total paradox . . . In one sense I am feeling that it is impossible to reach you just now; and yet, in another sense, I feel that my telling you this may be the only way I can reach you.’ She followed what I was saying very carefully, and slightly nodded her head.", "tp": true}, {"pos": 693, "role": "meeting", "loc": "dyadic", "int": 0.8, "aff": "tolerating despair", "txt": "I therefore continued: ‘Similarly, I feel as if it could be impossible to go on; and yet, I feel that the only way I can help you through this is by my being prepared to tolerate what you are making me feel, and still going on.’ After a long silence Mrs B. began to speak to me again as analyst. She said: ‘For the /g191 rst time I can believe you, that you are in touch with what I have been feeling; and what is so amazing is that you can bear it.’ I was then able to interpret to her, that her desperate wish for me to let her touch me had been her way of letting me know that she needed me to be really in touch with what she was going through. This time she could agree. She remained in silence for the last ten minutes of this session, and I sensed it was important I should do nothing to interrupt this.", "tp": false}, {"pos": 694, "role": "meeting", "loc": "patient", "int": 0.7, "aff": "held, tender", "txt": "The next day, Mrs B. told me what had been happening during that silence. She had been able to smell her mother’s presence, and she had felt her mother’s hands again holding hers. She felt it was her mother from before the fainting she had got in touch with, as she had never felt held like that since then. I commented that she had been able to /g191 nd the internal mother she had lost touch with, as distinct from the ‘pretend’ mother she had been wanting me to become.", "tp": false}]}, {"pt": "Marilyn", "doc": "Burch_Engaging the Whitewashed Countertransfer", "au": "Burch", "grp": "relational", "n": 25, "out": "mutative", "tp": 53, "felt": "A quiet collusion around privilege and need produced enactments (forgotten appointments, cancellations, avoided race-talk) that mirrored the patient's shameful dependency; only when the clinician recognized her own anxious silencing as parallel to the patient's relational pattern could honesty replace avoidance.", "shifted": "The dissociative pact around Whiteness, privilege, and need loosened; honest acknowledgment of irritation and countertransference dilemmas restored inquiry, reduced cancellations, and opened mutual reflection on race, class, and otherness.", "inwhom": "both, primarily through the clinician's shift enabling the patient's", "turn": true, "meet": true, "mint": 0.55, "u": [{"pos": 8, "role": "other", "loc": "patient", "int": 0.35, "aff": "dissatisfied, burdened", "txt": "Marilyn J Marilyn, a White heterosexual woman in her late 50s, entered therapy with vague feelings of dissatisfaction about her life. Family was a source of frustration and stress, as she had two siblings who leaned on her emotionally but seemed unable to give support in return. She was raising two children by herself and had a demanding career as an independent consultant. Often she felt others failed to give recognition she deserved in work.", "tp": false}, {"pos": 10, "role": "rupture", "loc": "clinician", "int": 0.7, "aff": "transgressive unease", "txt": "I noted this complaint about race by repeating it. She was startled and a little chagrined. I agreed that it was awkward for me to note it. I felt my comment as a transgression, introducing an element that might be an unwanted third, the intrusion of sociopolitical awareness, and was unsure how to weigh the therapeutic intent or impact.", "tp": false}, {"pos": 13, "role": "strain", "loc": "clinician", "int": 0.55, "aff": "hesitant concern", "txt": "I knew Marilyn was politically progressive, that she had friends and had sometimes had lovers from different racial groups. Nevertheless when push came to shove, self-interest triumphed. But was it really in her interest? I did not wish to shame her but felt the idea that the tables occasionally, if rarely, turn on Whites was important in some way.", "tp": false}, {"pos": 14, "role": "impasse", "loc": "clinician", "int": 0.75, "aff": "entangled uneasy", "txt": "It was unclear at first how these thoughts were related to her personal issues. I felt entangled by questions and unable to think through where to go. What left me most uneasy was thinking about my own Whiteness vis-a-vis Marilyn. It was exactly our shared racial identity that left me questioning.", "tp": false}, {"pos": 17, "role": "turn", "loc": "patient", "int": 0.45, "aff": "slighted, grandiose", "txt": "When Marilyn complained about slights from others I began to hear her words in a more complex way. Others made her feel “unimportant” or alternately they didn’t recognize her “importance.” Why importance ? I could see that importance had replaced simply being of value or having worth. It implies (and means) of great value, i.e., of more value than others.", "tp": false}, {"pos": 19, "role": "strain", "loc": "patient", "int": 0.45, "aff": "envious musing", "txt": "She envied his easier financial burden and imagined both children would receive compar - able educations. It made sense, she mused, for his child to attend a state school. Why, I wondered, should those prized connections matter less for her employee? But that wasn’t her responsibility after all, or was it?", "tp": false}, {"pos": 21, "role": "strain", "loc": "clinician", "int": 0.6, "aff": "envy, doubt", "txt": "I had to wonder if I also felt envy. My daughter didn’t apply to elite schools. I would not have mortgaged my future for her to do so either, as that path doesn’t strike me as worth the cost, either financially or personally. Such schools are a pressure cooker for many kids.", "tp": false}, {"pos": 23, "role": "enactment", "loc": "dyadic", "int": 0.55, "aff": "subverted authority", "txt": "Although the arrangements of psychotherapy empower therapist more than patient in many respects, some patients subvert this imbalance. I recognized now there had been a subtle subversion of my role by Marilyn over time. Her work and its importance served to assert her primacy. More than other patients, she canceled and rescheduled appointments due to travel or engagements.", "tp": false}, {"pos": 24, "role": "enactment", "loc": "clinician", "int": 0.7, "aff": "annoyed avoidance", "txt": "I had failed to look closely at this though it began to annoy me. I felt, it seemed in retrospect, an injunction against thinking about it. On one occasion I double-booked her rescheduled appointment and on another I completely forgot her appointment and was not in the office. Each time she was upset over my mistake then dismissed it as understandable, with no words of anger over how unimportant it left her feeling.", "tp": false}, {"pos": 26, "role": "impasse", "loc": "dyadic", "int": 0.65, "aff": "shame, inhibition", "txt": "pointed to how intolerable needing someone felt to her. Need was shameful; at the same time need prevailed. She could not risk alienating me with anger. My embarrassment over my own lapses further blocked my inquiry.", "tp": false}, {"pos": 27, "role": "strain", "loc": "patient", "int": 0.5, "aff": "shame, secrecy", "txt": "Seven months into her freshman year Molly became severely depressed, dropped out of school and returned home. Defiantly she enrolled in community college and took a job in a sandwich shop. Marilyn told me about the school and job in a hesitant, confidential tone, as if it were a point of shame. One night Molly turned on her mother, furious over pressure she felt.", "tp": false}, {"pos": 28, "role": "impasse", "loc": "patient", "int": 0.5, "aff": "defensive insistence", "txt": "Marilyn was defensive, insisting she only wanted the best for her. She argued that parents must hold high standards for their children. She was not ready to see another side to her hold on privilege and to explore her daughter’s distress. We began to look at how a high-achieving daughter might redeem the sense of inadequacy that dogged her, just as her own achievements had done for her parents.", "tp": false}, {"pos": 30, "role": "other", "loc": "none", "int": 0.1, "aff": "theoretical", "txt": "Lodged within privilege is an assumption about class. Privilege is meant to be a hedge against vulnerability, a sense that certain bad things should not happen to us ( or me) . Who should they happen to? Relational theory and sociocultural analysis converged.", "tp": false}, {"pos": 31, "role": "strain", "loc": "clinician", "int": 0.75, "aff": "guilt, shame", "txt": "What was in her interest therapeutically and what was outside it? The question returned: would I silence myself through dissociation around privilege? This dilemma made me more aware of how comfortable it is to whitewash countertransference. Guilt, shame, anxiety, or fear about the fragility of Whiteness and the transgressions of Whiteness muddled my understanding.", "tp": false}, {"pos": 35, "role": "strain", "loc": "clinician", "int": 0.7, "aff": "discomfort, risk", "txt": "Our late capitalist society teaches poor lessons here and undervalues personal well-being (cf. Peltz, 2005 ). In some ways I found these questions harder to navigate than ones that arise in cross-racial therapy, as if I can see what’s right there more clearly. Again, I felt a risk of transgression but also of displacing onto Marilyn my discomfort with privilege which I continue to hold.", "tp": false}, {"pos": 36, "role": "meeting", "loc": "dyadic", "int": 0.5, "aff": "resonant, shared", "txt": "Some of the personal and social dynamics that led to Marilyn’s wounds were understood. Being a woman of achievement in a male-dominated field, she’d struggled for years, work - ing long hours to establish a business and gain a reputation. There were routine genderbased slights along the way, ones I could resonate with. We discussed gender politics without a sense of intrusion, this being a welcomed third, as we were in accord.", "tp": false}, {"pos": 37, "role": "meeting", "loc": "dyadic", "int": 0.45, "aff": "mutual recognition", "txt": "We recognized each other here, our shared positions as professional women. Growing up, Marilyn had been preoccupied with her parents’ well-being. Her achieve - ments in school pleased them greatly. Both parents were children of immigrants from northern European countries who had become “American Americans” (cf.", "tp": false}, {"pos": 40, "role": "strain", "loc": "patient", "int": 0.6, "aff": "anxious shame", "txt": "Even though she chafed at the failure of mutuality with her siblings she felt enormous anxiety at the prospect of altering this role. Shame over wanting more emotionally from them also inhibited her. She did not like to see herself needing empathy or understanding. Perhaps being important was enough.", "tp": false}, {"pos": 41, "role": "turn", "loc": "dyadic", "int": 0.6, "aff": "anxious mirroring", "txt": "Consequently she was left with deep emptiness and a vague sense of feeling devalued even by those she was essential to. In one respect these dynamics replicated her relationship with me. I considered how my anxiety about raising the issue of cancellations and rescheduling mirrored her anxiety about not accepting devaluation by her brother and sister. I acknowledged to her that my mistakes around appointment changes had unconsciously expressed my sense of devaluation.", "tp": true}, {"pos": 42, "role": "meeting", "loc": "dyadic", "int": 0.5, "aff": "honest, relieved", "txt": "I did not attempt to link this with her sibling relationships as that seemed a bridge too far at that point. She was impressed by my honesty, my admission that I didn’t like her cancellations. They diminished and slowly disappeared. Marilyn was learning to manage anxiety and recognize more personal need.", "tp": false}, {"pos": 49, "role": "turn", "loc": "patient", "int": 0.5, "aff": "transgressive pleasure", "txt": "She reconsidered aspects of her romances with men of color. In those relationships she found reflection of her own sense of otherness as an ambitious woman who stood apart from the stereotyped femininity of her youth and early adulthood. Cross-racial relationships seemed transgressive at the time, a fact which also pleased her, a covert rebellion against the demands of her family. Then she thought of how comfortable she felt with men who held less privilege than she did, how it relieved some feelings of inadequacy.", "tp": false}, {"pos": 52, "role": "strain", "loc": "clinician", "int": 0.65, "aff": "guilt, conflict", "txt": "I did not think it would benefit her to disclose much of my countertransference turmoil although I occasionally acknowledged my own dilemmas with entitlement and privilege, lodging them as inevitable to White identity. These disclosures helped to ease the guilt about them. My struggle continued to inform me about her experience as I felt the pressures, conflicts and personal costs of “Whiteness.” The more I unraveled my reactions, the freer I felt to think with her, to help her engage and deepen her capacity to be with relational wounds, the turmoil and ambiguities of racialized experience. She began to ask personal questions about the political surround.", "tp": false}, {"pos": 53, "role": "meeting", "loc": "clinician", "int": 0.6, "aff": "uneasy, exposed", "txt": "We learned we participated in the same Women’s March after the Trump election. She wanted to know about growing up in the South and my evolution out of segregated culture and segregated thinking. I shared certain seminal experiences of transformation, such as early work as a counselor in a largely Black organization. I felt that familiar sense of uneasiness; I was stepping over usual boundaries around personal disclosure.", "tp": false}, {"pos": 54, "role": "meeting", "loc": "dyadic", "int": 0.4, "aff": "mutuality, reflective", "txt": "A better sense of mutuality and parity emerged between us and I pondered the intersection of Whiteness with traditional parameters of practice. PSYCHOANALYTIC DIALOGUES 33", "tp": false}, {"pos": 69, "role": "enactment", "loc": "dyadic", "int": 0.6, "aff": "enacted conflict", "txt": "The idea of Whiteness, founded on projections, qualities we disavow in ourselves, is difficult to see without under - standing the uses to which otherness is put. When I repeated aloud Marilyn’s complaint that her daughter was rejected by an elite school because she was White, it became clear to me that race had a role to play in her sense of entitlement. My comment enacted the conflict I felt: embeddedness in identifying with her, disowning entitlement in myself and discom - fort with breaking from traditions of practice. The conflict was evident to me if not to her.", "tp": false}]}, {"pt": "Eric", "doc": "H. Rosenfeld - Impasse and Interpretation_ The", "au": "Rosenfeld", "grp": "kleinian", "n": 25, "out": "ongoing", "tp": 389, "felt": "A frightened, chronically disappointed patient enacts envious, spoiling triumph over the analyst's care, oscillating between suicidal self-hatred and momentary recognition of dependence. The treatment loosens but does not break the grip of a destructive omnipotent organization.", "shifted": "A partial loosening of the destructive narcissistic defense: Eric began to acknowledge his envy and spoiling attacks on help, and could no longer fully rely on omnipotent self-sufficiency, though improvement remained fragile.", "inwhom": "primarily the patient, with the analyst registering and surviving the projected anxiety", "turn": true, "meet": true, "mint": 0.65, "u": [{"pos": 614, "role": "strain", "loc": "patient", "int": 0.75, "aff": "frightened, anxious", "txt": "Eric Eric was about forty when he approached me for analysis. He was very hesitant and frightened to do so because he felt almost sure that he would be rejected by me. After about fifteen years of psychoanalysis with a very experienced woman analyst, Dr U., he found himself in a shocking mental condition. He experienced anxiety all day long and at night and he was also frightened to eat, particularly in the morning, because he frequently vomited.", "tp": false}, {"pos": 616, "role": "strain", "loc": "patient", "int": 0.65, "aff": "shock, neediness", "txt": "He was very shocked by the incident because lecturing had been an activity he always enjoyed and he had always felt this was one thing he did well. Suddenly his life ’s achievement seemed to be threatened. Eric described to me how his experience at the lecture had an enormous impact on him and made him feel a very much increased need for help and understanding through his analysis. He said, however, that he felt in a great dilemma because Dr U. seemed to be as shocked and at a loss as he was about what had happened; this may have been true.", "tp": false}, {"pos": 617, "role": "strain", "loc": "patient", "int": 0.6, "aff": "unmet longing", "txt": "He knew that he very badly needed sympathetic understanding of and help with his problem but said he had not felt able to detect any such feeling in her. This impression may perhaps have been influenced by the fact that it appeared Dr U. had concentrated her interpretations after the lecture incident almost entirely on the triumph and contempt which she thought Eric was expressing towards her. He reported, for example, that she said that he wanted enviously to destroy the success of the analysis and make her look entirely incompetent. Interpretations of this kind were felt by Eric as critical angry remarks which increased his hopelessness and isolation and made him feel unable to put anything in order. 1 When I first saw Eric, he told me that he had felt very critical of Dr U. at that time.", "tp": false}, {"pos": 618, "role": "strain", "loc": "patient", "int": 0.7, "aff": "hopeless, intimidated", "txt": "He felt she seemed to be unconcerned about the pain, depression, and hopelessness he was feeling. He had wanted to have a second opinion, particularly after his condition deteriorated over the following years. However, this was apparently discouraged by Dr U., and he was too frightened to carry on regardless. He described how he felt threatened by her hostile power if he did not completely obey 140 IMPASSE AND INTERPRETATION", "tp": false}, {"pos": 627, "role": "rupture", "loc": "patient", "int": 0.7, "aff": "rejected, misunderstood", "txt": "However, as Eric ’s feelings of being very unhappy and not comfortable in his relationship to Dr U. were not analysed sufficiently, he understood Dr U. ’s remarks simply as meaning that she felt he was a difficult and ungrateful baby and patient, or that she felt desperate and did not know what to do with him. He therefore felt deeply rejected. Eric’s mother had herself worked with small children and must have felt very hurt that her own baby seemed to reject her. His mother was apparently depressed when he was born.", "tp": false}, {"pos": 631, "role": "impasse", "loc": "dyadic", "int": 0.5, "aff": "misunderstanding impasse", "txt": "It seemed to be more of an attempt to draw Dr U. ’s attention to the fact that Eric felt far from well, depressed, and in need of help. If this is so, a considerable misunderstanding existed between patient and analyst at the time when he got worse, and this misunderstanding persisted as an impasse right to the end of the analysis. After several months of analysis with me Eric felt very much better but could still become very easily upset and discouraged when he had a slight set-back. He had felt quite hopeful that he could cope with the first long holiday and he had also allowed his wife to leave him for a while at the same time.", "tp": false}, {"pos": 633, "role": "enactment", "loc": "patient", "int": 0.65, "aff": "guilty depression", "txt": "For some days he felt overwhelmed by the depression but he eventually managed to understand for himself that by buying the coat he felt he had rejected both his wife and me. While the leather coat was a good permanent protective skin it was not a substitute. In fact when he realized what had gone on inside him he began to feel gradually better, and he came through the holidays well enough. Eric occasionally had negative reactions.", "tp": false}, {"pos": 634, "role": "rupture", "loc": "patient", "int": 0.7, "aff": "shock, despair", "txt": "After about a year in analysis he told me how very well he felt I understood him and compared and contrasted me with both his mother and his previous analyst. However, soon after this, when he started to be able to leave his house and went with his wife to the theatre, he felt absolutely dreadful and had such a shock that he started to sweat and felt that life wasn ’t worth living. He completely lost both any desire and appetite and feared that he had relapsed more than ever before. None the less, such set-backs did not last very long.", "tp": false}, {"pos": 637, "role": "enactment", "loc": "patient", "int": 0.6, "aff": "triumphant, guilty", "txt": "Eric realized that in this violent phantasy he felt very triumphant, resentful, and revengeful. He was also aware that he believed that when he was treated well he could not feel that it would make him better. Rather, he felt secretly indulged by me in this violent destructive attack. The next day he felt dreadful and very guilty.", "tp": false}, {"pos": 638, "role": "turn", "loc": "patient", "int": 0.6, "aff": "guilt, remembering", "txt": "He tried to make things up to his wife because he felt he didn ’t give anything to anybody. He realized that in the previous breakdown he felt he could not do anything better than want to kill himself. However, at the same time, he began to remember that in fact he hadn ’t always felt so badly treated by his mother. His mother had sometimes been happy.", "tp": false}, {"pos": 639, "role": "meeting", "loc": "patient", "int": 0.6, "aff": "sorrow, sympathy", "txt": "It was only when she was sad that she could not enjoy anything. He now remembered that one day she had been crying and had said to him. ‘I can ’t spend money. I can ’t enjoy it. ’ She had given him £5 and said, ‘Use the money because I can ’t use it myself. ’ After this memory Eric began to feel sorry for his mother, whereas in the past he had felt only resentment. He realized that feelings of sympathy for her had been missing all this time.", "tp": false}, {"pos": 640, "role": "strain", "loc": "patient", "int": 0.55, "aff": "depressed, hopeless", "txt": "By now there had been a gradual improvement; however, Eric ’s anxiety about not being able to go on holiday persisted, and he felt rather depressed and incurable about it. At the same time he reported to me some things about himself and his life which were very striking but about which he had only recently become more aware. He said it was very peculiar because, although his wife had been rather aggressive towards him for some time and had not been helpful, she was now trying to help and had tried to make him aware of certain factors which he had never observed in himself before. For example, she had noticed that when his anxiety was quite strong it was accompanied by such a strong smell that it was almost unbearable for her to be near him while it lasted.", "tp": false}, {"pos": 643, "role": "enactment", "loc": "patient", "int": 0.75, "aff": "mounting anxiety", "txt": "Moreover, while he continued talking to me he said his anxiety intensified and he felt a particularly great anxiety growing in his stomach. He said he thought this could be related to his conviction that he could create in me a bad picture of himself. At the end of the session he said he didn ’t feel any better. At the beginning of the next session Eric told me immediately that as soon as he had arrived home after the last session and was alone by himself he had felt relaxed.", "tp": false}, {"pos": 644, "role": "enactment", "loc": "dyadic", "int": 0.7, "aff": "sadistic triumph", "txt": "He was surprised that he felt so well. He had thought I would still be worrying about him and perhaps not be able to get him out of my mind. So I could see that I was left with the anxiety and he could enjoy himself alone in his room feeling very good. It had become apparent that there was a strong sadistic relationship being enacted in the analysis, which was related to his feeling envious of my well-being.", "tp": false}, {"pos": 645, "role": "enactment", "loc": "dyadic", "int": 0.7, "aff": "spiteful satisfaction", "txt": "He obviously felt satisfied about having spoilt my enjoyment in trying to help him, so that I would have to worry about him while he was sitting comfortably at home with no worry. As an afterthought he added that he did still feel some envy towards some aspects of my activities but this he left rather vague. Eric continued by telling me that he felt there was a woman inside him who was very ugly, and he had to keep her very ugly because there was a danger that if she was beautiful she would be violently attacked by others, particularly by other women. This was her way of keeping herself comfortable.", "tp": false}, {"pos": 650, "role": "enactment", "loc": "patient", "int": 0.6, "aff": "hostile impulse", "txt": "But now Eric confessed to me that a few weeks before, after he had left a session feeling very much better, he had been hoping to try enjoying the good relationship with his wife. But then he suddenly felt an impulse to start a violent quarrel with her. In fact, however, he had been able to stop this quarrel and was glad about it. He was glad too that he had become more aware what was going on inside him.", "tp": false}, {"pos": 654, "role": "impasse", "loc": "patient", "int": 0.7, "aff": "suicidal, smashed", "txt": "In the analysis he felt strongly suicidal when these problems were being touched upon. His destructive narcissistic phantasies seemed to be organized in a defensive system of strength and superiority on which his survival depended. When Dr U. had made very forceful attacks on his narcissism Eric had felt smashed and defeated and after that he felt increasingly unprotected. But, in 146 IMPASSE AND INTERPRETATION", "tp": false}, {"pos": 657, "role": "strain", "loc": "patient", "int": 0.7, "aff": "abandoned, disappointed", "txt": "He felt the first therapist, whom he had consulted during his first breakdown, was at first very hopeful and friendly; but when he did not recover, after taking the exams he had been frightened about, as she expected, and when he was getting worse and worse, she seemed to become disappointed and anxious. She was also cruel to him and handed him over to another therapist. Something similar occurred, he felt, with his second woman therapist, Dr U. She had also seemed to be more hopeful about his capacity to develop at first, but then, at the moment when she hoped he was getting much better, he became worse and worse in the negative reaction I have described.", "tp": false}, {"pos": 661, "role": "impasse", "loc": "patient", "int": 0.6, "aff": "fearful, worsening", "txt": "relations, which seemed to him rather uncertain and made him feel constantly afraid of feeling utterly rejected. Some time after this phase in the analysis Eric began to feel that he was not getting better with me either. In fact, he was getting worse. He noticed this particularly when he left his sessions.", "tp": false}, {"pos": 662, "role": "impasse", "loc": "patient", "int": 0.9, "aff": "suicidal self-hatred", "txt": "He described this feeling as very painful, so painful that he felt suicidal, thinking of death as the only way of finding relief for this pain. He did not wish to kill himself but he had to struggle against a strong feeling of being pulled towards death. He then explained that he hated himself more and more. What was revealed in the analysis increased his self-hatred because he wanted to feel love and confidence in himself.", "tp": false}, {"pos": 663, "role": "strain", "loc": "patient", "int": 0.7, "aff": "self-hatred, disappointment", "txt": "However, when a more hopeful, better picture of himself appeared, he was not able to retain it. He constantly felt disappointed with himself, so his self-hatred increased. Eric’s disappointment in himself was, I think, created not only by the breakdown of a very idealized self-image but also by the growth of a conscious awareness of the masochistic and sadistic narcissistic way of relating he had developed, which had given him a false feeling of protection. At this stage Eric insisted that he did not feel aggressive towards me.", "tp": false}, {"pos": 665, "role": "strain", "loc": "patient", "int": 0.6, "aff": "disgust, shame", "txt": "Eric tried to play it but he didn’t want to have any lessons. After a short time he felt exceedingly disappointed in the clarinet. He didn ’t like the tone of it; he looked at the clarinet and felt disgusted by its shape; he felt so disturbed about it that he had to give it back. He had to lie to his father because he felt so ashamed.", "tp": false}, {"pos": 672, "role": "turn", "loc": "dyadic", "int": 0.5, "aff": "cautious hope", "txt": "Eric did not improve suddenly after this revelation, but I had the feeling that from then on he was not quite as stuck as I had feared. Some time later Eric confirmed my observation that he had always relied on some positive feeling of omnipotence to be professionally successful and confident. He now remembered more about the early years of his life. He had felt constantly belittled and ridiculed by an older sister while being simultaneously regarded as stupid and a failure by his father —because when he first went to school he had problems learning.", "tp": true}, {"pos": 681, "role": "enactment", "loc": "patient", "int": 0.65, "aff": "humiliated rage", "txt": "and preparation seemed to him unjust and made him feel helpless, diminished, and enraged. It was, apparently, his accumulated narcissistic rage, which he had tried to put aside but which gradually increased his destructive omnipotent feelings, that suddenly broke through to the surface in the lecture. He wished to take revenge and to humiliate other people as he had felt humiliated, although when this overwhelming feeling of contempt overcame him during the lecture he was completely unaware of what was happening. He was shocked by the experience, which destroyed his self-confidence and made him feel very anxious and dependent.", "tp": false}, {"pos": 688, "role": "rupture", "loc": "patient", "int": 0.6, "aff": "helpless terror", "txt": "A traumatic repetition of all the earlier traumas of his life took place. He felt the situation to be most damaging but also felt helpless and unable to escape from her because he had become terrified of her power, if he left her. With narcissistic patients with early traumas, as in this patient, one has to study the traumatic situations very carefully. Frequently, there is an intense interaction between infant and mother in which for some reason the mother feels an intense failure.", "tp": false}]}, {"pt": "Michael", "doc": "Racial Identities, Racial Enactments, and Norm", "au": "Layton", "grp": "relational", "n": 21, "out": "ongoing", "tp": 48, "felt": "The clinician, reading the patient's cultural framing as self-abnegating femininity, intervenes from her own therapy culture and inadvertently reenacts the ex-boyfriend's pathologizing stance; the patient's subsequent associations register the wound while the analyst belatedly recognizes her own complicity.", "shifted": "Recognition, largely on the clinician's side, that her interpretive frame had imposed a Western/gendered grid and replicated a prior injury, opening reflection on countertransferential participation rather than resolving the patient's conflict.", "inwhom": "primarily the clinician", "turn": true, "meet": true, "mint": 0.43, "u": [{"pos": 34, "role": "other", "loc": "patient", "int": 0.3, "aff": "conflicted, ambivalent", "txt": "LYNNE LAYTON248 His mother and father had emigrated from Asia to a suburb of a big city while in their early twenties, and Michael considered many of his thoughts and feelings to be products of his non-Western culture—and he valued them as such. Nonetheless, he felt that he had problems with self-esteem and hoped that therapy might help with that. At the same time, he was clearly conflicted about being in therapy from the outset. It seems that one of the ways his parents had differentiated themselves from “Westerners” was by feeling superior about their capacity to be private people; Westerners, the parents felt, talk too loudly, too publicly, and too long about their private business.", "tp": false}, {"pos": 36, "role": "strain", "loc": "patient", "int": 0.4, "aff": "conflicted identification", "txt": "Yet, how much more complex these things are than they first appear. It turned out that Michael’s mother could herself become highly “irrational” at times—yelling, screaming, and imposing rules that to Michael made no sense. Ironically, this only heightened Michael’s identification with rationality and against emotion.6 In high school, Michael was aware of longings to be part of the white in-crowd, but he also joined his Asian friends in denigrating the popular kids’ practices—for example, derisively noting that whites seemed to keep switching romantic partners, but only took 6 N o t e t h a t I r e f e r t o “ r a t i o n a l i t y , ” n o t r e a s o n . I d o s o b e c a u s e I w a n t t o e m - phasize that split polarities tend to be monstrous versions of what they claim to be.", "tp": false}, {"pos": 38, "role": "meeting", "loc": "dyadic", "int": 0.6, "aff": "gentle confrontation", "txt": "RACIAL IDENTITIES, RACIAL ENACTMENTS 249 partners of the same racial group. Michael figured that he was the only one of the Asian kids who longed to be part of the white crowd; as he told me, it would not be logical for the Asian kids to denigrate something that they really desired to join. (Here I gently noted that this was precisely what he was doing, and perhaps logic is not always all that it is cracked up to be.) Because of his longings, Michael must have felt a certain degree of alienation from his friends as well, which exacerbated his feeling of being socially inept. What was striking about his ambivalent place between Asians and Caucasians, East and West, was that it left him quite uncertain—both about what he felt, and about the value of what he felt, for it pulled him into denigrating the very things he longed for. From my first sessions with Michael, I saw two grids begin to form, one that associated certain attributes with white Westerners and others to superior Asians, and another that denigrated Asians and idealized white Westerners.", "tp": false}, {"pos": 39, "role": "meeting", "loc": "dyadic", "int": 0.5, "aff": "wry, complicit", "txt": "These stereotypes were not just racial and ethnic; they were nodal points that stitched together race, ethnicity, gender, and sexuality. Michael and I were both aware of the grids, and, at one point, he laughed and said, “I rely on stereotypes a lot, don’t I?” I invoke Michael’s story because his way of splitting and racializing attributes, sometimes with whiteness in the superior position, sometimes in the inferior, stirred a lot of thought and feeling in me and a lot of questions about how best to work with him. It also kept me conscious of my own ways of categorizing and judging, and made me wary of some of the certainties with which I found myself operating. The therapy raised a number of issues about the way intersecting identity categories are lived and the way power differentials create differences: differences in emotional range and expression, in the relation between emotion and cognition, in modes of separation and attachment, in one’s very experience of love.", "tp": false}, {"pos": 60, "role": "other", "loc": "clinician", "int": 0.4, "aff": "clarity, assurance", "txt": "For, in that relationship, Michael had taken up the self-denying, submissive position typical of dominant white femininity in its relation to dominant white masculinity. Again, his wish seemed to echo the Kohutian formula, “You are perfect and I am part of you” (Kohut 1971). All this felt fairly obvious to me, and I believed that, in the course of therapy, Michael would probably come to see that he did not so much want the ex-boyfriend as he wanted what this man represented that he himself lacked. What was less obvious to me until later was that, in the many interchanges about his desire, Michael had put me in—and I had unconsciously assumed—the position of the white one.", "tp": false}, {"pos": 65, "role": "strain", "loc": "patient", "int": 0.4, "aff": "deferential", "txt": "RACIAL IDENTITIES, RACIAL ENACTMENTS 257 As I mentioned earlier , Michael’s Western/non-Western binary construct at times seemed to take the form of what I was familiar with as a male/female binary. One day, he told me that his ex-boyfriend had pointed out to him that wh enever Michael walked down the street and someone came toward him in the opposite direction, it was always Michael who deferred and moved to the side. Michael also sometimes wondered why he did not feel anger in situations in which he knew his Western friends would be angry. He often noted that Westerners seemed angry a lot— for example, they would say they were having a bad day, rather than merely that some random thing had not worked out.", "tp": false}, {"pos": 73, "role": "enactment", "loc": "dyadic", "int": 0.5, "aff": "inhibited, probing", "txt": "RACIAL IDENTITIES, RACIAL ENACTMENTS 259 loves his parents because he wants them to be happy, and wants to do what he can to make them happy. Is that a feeling, he asks? I float the hypothesis that there is something that inhibits him from feeling and knowing what he feels, and I think it has to do with the way feelings have been identified as Western a n d bad. He repeats his sense that Westerners react out of proportion to the cause when bad things happen, and he is glad that he doesn’t do this.", "tp": false}, {"pos": 74, "role": "turn", "loc": "patient", "int": 0.5, "aff": "tentative anger", "txt": "But sometimes he would like to get angry—and he’s not sure he should. In fact, he does feel angry sometimes; and then he mentions a new game he’s playing with himself, where he waits a little longer before moving out of the way when someone walks toward him on the street. He guesses that, because his ex-boyfriend remarked on the fact that he always moves out of the way first, he now thinks there must be something wrong with this behavior. But he does get angry that others don’t step out of the way—it’s not fair, and it’s rude.", "tp": false}, {"pos": 75, "role": "impasse", "loc": "clinician", "int": 0.6, "aff": "struggle, doubt", "txt": "He’s glad he’s like he is—but is he getting stepped on? I struggled in this treatment because my working hypothesis, based on some things Michael said that showed a desire to express more emotion, was that the whole Western/non-Western thing was one way in which he kept himself inhibited, kept himself from integrating emotion and reason. I also felt that his mother’s yelling fits, sometimes paired with humiliation-engendering behavior, made emotion frightening for him. And yet, I certainly agreed with him that Western forms of assertion (or, at least, their U.S.", "tp": false}, {"pos": 76, "role": "enactment", "loc": "dyadic", "int": 0.5, "aff": "confusion, disclosure", "txt": "East Coast version) often crossed the line into rudeness and incivility. At one point, I spoke to Michael about some of my confusions. He was talking about the fun he had had during the past weekend with a visiting friend, a man who laughed a lot at Michael’s jokes. He remarked that he generally felt responsible for showing his guests a good time, without focusing on whether he himself was having a good time.", "tp": false}, {"pos": 77, "role": "rupture", "loc": "clinician", "int": 0.6, "aff": "worried, self-questioning", "txt": "Because I again read this as selfabnegation, I brought up the confusions I had been feeling about the Western/non-Western dichotomization. I told him I was concerned that, like the ex-boyfriend, I might have been pathologizLayton.pmd 1/3/06, 7:35 AM259", "tp": false}, {"pos": 78, "role": "rupture", "loc": "clinician", "int": 0.45, "aff": "self-questioning", "txt": "LYNNE LAYTON260 ing something about these values of civility and duty that guided his behavior, and I told him that my therapy culture tends to understand some of these ways of being as self-abnegation. I mentioned I was pretty sure that, if I were treating a Western female, I would move in the direction of seeing such behavior as self-abnegating. I said, “I suppose what matters is whether or not you find that these ways of being get in your way; do you want things to be different?” Michael then revisited some of the examples he saw of Western rudeness, and in the new rendition, matters were more complicated, more East-West: he said that, when he pours tea, he is aware that if there isn’t much in the pot, he might not get any; this does, in fact, bother him. Indeed, he said that the responsibility to make others happy was also self-focused: if his friend did not like what he thought would constitute a good time, he would feel devalued as well as guilty.", "tp": false}, {"pos": 79, "role": "enactment", "loc": "dyadic", "int": 0.55, "aff": "validating, uneasy", "txt": "He then noted how frequently his ex-boyfriend used to leave him alone at parties, and how the boyfriend would rationalize his behavior by asserting a value on independence and a disdain for clinginess. But, Michael said, “I told him more than once that I was uncomfortable in those situations, and he shouldn’t have left me alone.” “Indeed,” I replied, and realized at the same time that this was not about which value system was right; it was about being in tune with your partner, conscious of his vulnerabilities. At this point, I decided to ask Michael if he might be having any feelings about my upcoming vacation, since he had mentioned being left alone. The rest of the session focused on his question of whether or not he really needed therapy: he associated to the first therapist he saw, the one who had referred him to me over a year earlier, and expressed a feeling that her office was much more conveniently located than mine, and that he would be glad to be able to sleep in while I was gone, and to think, in my absence, about whether he should stop therapy.", "tp": false}, {"pos": 81, "role": "strain", "loc": "clinician", "int": 0.4, "aff": "private musing", "txt": "RACIAL IDENTITIES, RACIAL ENACTMENTS 261 And when I asked what this might have to do with what had come before, he concluded the sequence by saying that his new boyfriend didn’t think he really needed therapy. “I think the issues I have, a lot of people have—and I don’t think others are in therapy with such issues.” I thought to myself that this expression of his discomfort with therapy related to all of what had come before, about what was Western, what was not. I said to Michael, both defensively and nondefensively, that many are in therapy for just the issues he has brought. And then he told me that he would not pay my fee if his insurance were not paying, and he felt guilty about that; he had just learned that his insurance coverage would end in two months’ time.", "tp": false}, {"pos": 82, "role": "turn", "loc": "clinician", "int": 0.6, "aff": "hesitant, worried", "txt": "This material is so full of suggestive moments that I almost hesitate to offer an interpretation. But my best guess is that Michael may have felt wounded when I suggested a connection between his psychology and that of Western femininity. Had I inadvertently feminized this Asian man who was already sensitive to the feminizing stereotype—both as a gay man and as an Asian man? Perhaps he then wanted to point out to me that he really is much more assertive and self-focused, more masculine, than I think.", "tp": true}, {"pos": 83, "role": "turn", "loc": "clinician", "int": 0.55, "aff": "guilty speculation", "txt": "Perhaps the next association, about abandonment, did not have as much to do with my impending vacation as with the way I had wounded him. Like his ex-boyfriend, I perhaps should have known that what I said would make him uncomfortable. I venture this guess because the material that came after, about whether or not he should quit therapy and whether or not it was worth paying for, had a somewhat hostile edge. It was also not lost on me that the therapist whom he had first seen was not only closer to his home, but was also quite young and beautiful—was he perhaps trying to wound me by questioning my femininity?", "tp": false}, {"pos": 85, "role": "other", "loc": "none", "int": 0.1, "aff": "reflective", "txt": "LYNNE LAYTON262 What Is Love? I conclude my discussion of this vignette with another theme that Michael struggled with during the therapy: the question, what is love? Not only was this a presenting problem, but I also invoke it here to demonstrate how the constructs we tend to see as most universal and psychological, least culturally inflected, are in many ways simultaneously psychically and socially constructed. Earlier, I noted that Michael did not feel sure he was in love with his current partner, and I also noted that he felt he was not very desirable—a feeling the ex-boyfriend heightened, but that the current boyfriend completely contradicted.", "tp": false}, {"pos": 86, "role": "other", "loc": "patient", "int": 0.4, "aff": "puzzled wondering", "txt": "The current boyfriend had only had two other partners in his life, and both were Asian. My patient wondered about white men who only desire Asians—he averred that, generally, only fat and old white men were into Asians. And Michael wondered why he was never attracted to Asian men either. Countless works of fiction convince me that love is a social construct as well as a feeling, and that racism can destroy or severely interfere with the capacity for love.", "tp": false}, {"pos": 93, "role": "other", "loc": "none", "int": 0.15, "aff": "reflective", "txt": "It seemed to me that here was an example of the way that essentialist categories and iden tity politics can, in fact, facilitate growth, and can defeat internalized racist and sexist prejudice. But there is more to the story of love and ethnicity in this case. For Michael, love was less a feeling than a sense of duty. He Layton.pmd 1/3/06, 7:35 AM263", "tp": false}, {"pos": 95, "role": "impasse", "loc": "clinician", "int": 0.45, "aff": "uncertain, puzzled", "txt": "In his view, adult--adult love was never pure, because, merely by desiring the other, “you are asking for something back for your love.” During the treatment, I was never sure whether Michael simply did not love his current boyfriend, and was at best enjoying how much this man loved him, or if we were dealing with an inability to love that had to do with several other factors: the inhibition of feeling and of behaving “irrationally”; the self-denigration and internalized homophobia (“I don’t want to be a member of any club that wants me as a member”); and the confusion that seemed always to ensue when the other knew what s/he wanted of him. Indeed, it seemed to me that the legacy of Michael’s mother’s insistent presence—which he experienced as love, but also as control—was to make him unsure of what he felt whenever the other was s u r e . I t h o u g h t t h a t t h e c o n s t r a i n t s o n h i s f r e e d o m t h a t he had so disliked while growing up had become rationalized as a “true” kind of love, a selfless love. And then I came across a paper on filial piety in Chinese culture (Gu 2006).", "tp": false}, {"pos": 98, "role": "other", "loc": "none", "int": 0.1, "aff": "summarizing", "txt": "CONCLUSION This summary of my work with Michael gives some sense of the way that racist hierarchies create racial identities that are marked by oscillating idealizing and devaluing dynamics characteristic of narcissism. Norms of race, class, gender, and sexuality, norms transmitted within familial and cultural enclaves of love and hate (P. Williams 1997), are unconsciously enacted and further legitimized in the very way we assert ourselves in the world and in the very way we connect with others. As Altman ( 2000) has argued, clinicians have to assume that their racism pervades the clinical encounter in some way; I hope to have shown here some of the ways that patient and therapist enact the norms that split and racialize emotion and reason, dependence and independence, love and hate.", "tp": false}]}, {"pt": "Ari", "doc": "Ackerman 2019. First Encounters with Erotic De", "au": "Ackerman", "grp": "other", "n": 18, "out": "mutative", "tp": 180, "felt": "A clinician carrying unspeakable erotic countertransference is first shut down by a containing-but-foreclosing supervisor, then met by a peer/supervisor whose welcoming response transmutes shame into shared inquiry, enabling the work with the patient to deepen.", "shifted": "Shame and isolation around erotic countertransference became a usable, shared object of thought, allowing the clinician to engage rather than flee the transference and to recognize the patient's precocious exposure.", "inwhom": "primarily the clinician, with downstream shifts in the dyad and patient", "turn": true, "meet": true, "mint": 0.75, "u": [{"pos": 10, "role": "other", "loc": "patient", "int": 0.6, "aff": "flat, concealed", "txt": "body language of confidence, his profound insecurities were quite convincingly concealed by his arrogant, sarcastic wit and military posture. Although the content of his responses could be thoughtful and raw, he rarely seemed surprised or impressed by anything either of us said. Terse in style and flat in tone, his utterances were stripped of their affective markers. Yet, in moments, he would lock eyes with me in a way that communicated such a desperate sense of longing but also defiance and fierce determination; it was both a stare-down and a plea.", "tp": false}, {"pos": 11, "role": "strain", "loc": "clinician", "int": 0.85, "aff": "haunted longing", "txt": "And when he left each time, his hungry little ghost would linger behind, following me throughout my day, haunting my thoughts, calling me out of sleep at night from those barely-below-the-threshold-of-awake states that I ’d come to think of as sleep in the months after my own son was born, when I ’d startle to the rush of milk before my weary conscious mind heard his sound. Only now, Ari’s bleating orphan cries drifted through the walls and dimly lit passages of my mind, calling me back to my own childhood … but those chambers seemed too dark to go searching for him there. So I would lie awake at night, sifting through the pieces of Ari that I had, trying to patch them into a collage. I could never quite make out the image.", "tp": false}, {"pos": 14, "role": "strain", "loc": "clinician", "int": 0.9, "aff": "trapped paralysis", "txt": "As we sat, my attention narrowed to the nanosphere of space between the soles of our shoes. The ratio of oxygen to surface area of skin seemed alarmingly inappropriate for this tiny room. Like cornered prey, I felt time pause, and eternity suspend, in the space between all-out resistance and surrender. And bound there, limb to limb, I felt a new paralysis take over.", "tp": false}, {"pos": 18, "role": "strain", "loc": "clinician", "int": 0.8, "aff": "stunned arousal", "txt": "To the extent that I had given it any thought at all, I imagined it in the most abstract terms: a subtle hint or innuendo that would emerge in theme and metaphor, as it would through line-by-line analysis of a poem or projective test. Undertone, I had thought. Not undertow. None of this prepared me for the stomach-punch-heart-explosion, the delightful panic attack that was to come.", "tp": false}, {"pos": 19, "role": "strain", "loc": "clinician", "int": 0.95, "aff": "anxious dread", "txt": "It did not prepare me for the preoccupying fantasies, the insomnia, the whole-body experience of it, including the anxiety grenades that left me near paralyzed before sessions. Nor was I prepared for the most unsettling questions it raised. Might I actually be capable of acting on these feelings? The distinction between people who do such things and myself seemed, at moments, disconcertingly, even terrifyingly, indistinct.", "tp": false}, {"pos": 20, "role": "impasse", "loc": "clinician", "int": 0.7, "aff": "alone, wordless", "txt": "I knew enough to bring it to my supervisor ’s attention, but I was at a loss for even what words to use to describe it. My supervisor, careful and dedicated as she was, said something she thought might be containing, essentially offering a suggestion for managing the “anxiety” I was experiencing around sessions. And she encouraged me to discuss it with my analyst. To me, however, it felt as though she sent my feelings out of the room at the very moment when I needed her to both normalize and explore my experience.", "tp": false}, {"pos": 21, "role": "impasse", "loc": "clinician", "int": 0.9, "aff": "shame, dread", "txt": "The shame and isolation I felt stung and spread. When we returned to the subject once, perhaps a month or so later, she carefully inquired how I was doing with “those feelings. ” I lied and said things were better. But in truth I was overcome with doubt and dread. I vacillated between attempts at thought suppression and then rumination, fearing that I might have revealed my feelings in some way, inadvertently been seductive.", "tp": false}, {"pos": 27, "role": "turn", "loc": "clinician", "int": 0.9, "aff": "warmth, relief", "txt": "He treated my disclosure as though it were a delightful treasure that I ’d found, inviting us all to gather round for a closer look. He joined me in a place that felt incredibly dark; but his company made it warm and light and safe. His attitude of acceptance and curiosity was contagious, and it spread throughout the room. Shame and fear dissolved and gave way to a powerful experience of solidarity for us as a group.", "tp": true}, {"pos": 28, "role": "meeting", "loc": "dyadic", "int": 0.85, "aff": "solidarity, bravery", "txt": "Acceptance fostered bravery, disclosure, discovery, around the room, back and forth between us. Together, we created a sanctuary where any one of us could talk about anything. This was a transformative experience for me, and it brought about a turning point in Ari ’s treatment. No longer stuck in my own experience of doubt, I could begin to get close to the desire, embrace the fear, figure out what it meant.", "tp": false}, {"pos": 31, "role": "enactment", "loc": "dyadic", "int": 0.7, "aff": "flirtatious sparring", "txt": "Feeling emboldened by our group ’s process exploration, I decided to bring it up … or, perhaps more accurately, I responded to Ari’ s cue. “I feel like we’ re in one of our intellectual sparring matches right now,” he said. “That’s true,” I said. “But you know, we’ ve never talked about the flirtation underlying those.” Only momentarily caught off guard by this statement, Ari agreed.", "tp": false}, {"pos": 34, "role": "strain", "loc": "clinician", "int": 0.7, "aff":
