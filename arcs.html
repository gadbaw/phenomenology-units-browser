oc": "none", "int": 0.2, "aff": "summative critique", "txt": "patient during analysis. I have argued none the less, that this psychotic patient was able to bring her problems clearly to the analysis, and therefore hope that the example will help all of us understand and learn how psychotic patients can express themselves clearly in spite of the severity of their illness. The analyst ’s main mistakes were, initially, her insensitivity to the patient’s primitive anxiety of feeling utterly lost and unable to cope. The patient conveys these feelings again and again, but the analyst holds on to her belief that the patient suffers from separation anxiety, in spite of the patient ’s energetic protests and criticisms that this is wrong.", "tp": false}]}, {"pt": "Mr C", "doc": "[The New Library of Psychoanalysis] John Stein", "au": "—", "grp": "other", "n": 10, "out": "ongoing", "tp": 674, "felt": "A psychotic retreat is breached by the announced ending; interpretations are concretely evacuated as poison, yet a brief depressive recognition of irrecoverable loss flickers before rage and defiant soiling reassert the omnipotent organization.", "shifted": "A momentary movement toward the depressive position—tolerating unrecoverable loss—before retreat reconsolidated around vengeful, omnipotent control.", "inwhom": "primarily the patient, with the analyst registering the loss that catalyzed the shift", "turn": true, "meet": false, "mint": 0.57, "u": [{"pos": 294, "role": "rupture", "loc": "clinician", "int": 0.6, "aff": "sad, loss", "txt": "He then announced his intention to change his job and, since this would necessitate a move to another city, it meant the end of his analysis. The analyst felt sad at the idea of losing his patient and interpreted that the patient wanted to get rid of his own sadness and wanted him, the analyst, to feel the pain of separation and loss. The patient said,", "tp": false}, {"pos": 296, "role": "enactment", "loc": "patient", "int": 0.75, "aff": "contamination dread", "txt": "He then complained of gastric troubles and diarrhoea, and said he had been going to the toilet after each session recently. He explained that he had to shit out every word the analyst gave him in order not to be contaminated by infected milk. In his response to the analyst’s interpretation the patient at first appears to agree that he wants the analyst to feel the pain of separation and loss in order to effect an ‘equalization’, but a moment later he complains of being poisoned. I believe that he found this interpretation correct but threatening because it exposed him to experiences such as grief, anxiety, and guilt, which were associated with the loss of his analyst.", "tp": false}, {"pos": 297, "role": "strain", "loc": "patient", "int": 0.8, "aff": "catastrophic anxiety", "txt": "He felt that the interpretation had forced him to take these feelings back into himself and he experienced them concretely as poison and tried to evacuate them in his faeces. The patient feared that this kind of experience would threaten the dominance of the psychotic organization and leave him in a desperate state. The catastrophic nature of his anxiety was indicated by the way he spoke about nuclear disaster, and his insistence that no defence was possible against a nuclear attack may have had its roots in his conviction that his defences could not protect him against the analyst’s words. He needed the analyst to recognize that he could maintain a relationship with him only if the analyst agreed to hold the experiences associated with loss in his own mind and to refrain from challenging the psychotic organization by trying to return these prematurely to the patient.", "tp": false}, {"pos": 302, "role": "turn", "loc": "patient", "int": 0.7, "aff": "depressive grief", "txt": "He usually complained about the lost time which the breakdown had cost him but now he felt he could bear that. What he could not bear was the thought that something had been lost which could never be recovered. This rather unusual experience of contact with depressive feelings was followed by extremely violent sessions in which he claimed that he and Yahweh would destroy the world and he spoke of the annihilation of mankind. That evening he telephoned the analyst and said he was afraid he would confuse the toilet and the consulting room.", "tp": true}, {"pos": 303, "role": "enactment", "loc": "patient", "int": 0.8, "aff": "vengeful rage", "txt": "He was phoning because he was afraid he would forget this fear tomorrow and he wanted the analyst to remind him. In the session he said, ‘You realize that when I am enraged I will shit in your room. The disposal is your problem. They do it to me so why should I not do it to you?’ I think it is possible in the present material to see how for most of the time the patient is entrenched in a psychotic organization which serves to make him feel powerful and to restore the damage he feels has been done to his mind.", "tp": false}, {"pos": 307, "role": "impasse", "loc": "dyadic", "int": 0.5, "aff": "omnipotent seduction", "txt": "The sanity of the analyst is seen as an obstacle to the achievement of these omnipotent solutions and it has either to be seduced into acquiescence or to be overwhelmed through omnipotence. The analyst, by interpreting that with the help of Yahweh the patient wanted to be powerful and defeat his enemies, recognized the patient’s need for omnipotence as a source of security. He understood that when the patient feels small and persecuted by Goliath-like figures he experiences the analyst as weak and unimpressive in what he can offer. Following this interpretation, the patient is able to acknowledge that since his breakdown he had lost a sense of identity and no longer knows that ‘I am I’.", "tp": false}, {"pos": 429, "role": "other", "loc": "patient", "int": 0.5, "aff": "omnipotent, fragile", "txt": "Psychic Retreats 102 of loss which enabled a shift towards the depressive position to take place. Mr C (Chapter 6) was more overtly psychotic and showed evidence of a mad retreat which threatened to break down. To compensate for and patch up a damaged ego he turned to omnipotent objects, Yahweh, neurologists, his analyst, with whom he wanted to identify and whose potency he sought. It was when he felt expelled from the retreat that he felt mad and tried to re-enter it by magical means, such as acquiring a prayer shawl.", "tp": false}, {"pos": 430, "role": "impasse", "loc": "patient", "int": 0.6, "aff": "defiant, lost", "txt": "In the retreat he could do what he pleased, for example, shit where he wanted to because the disposal was the analyst’s problem. Despite the extent of the psychotic disintegration he had some insight into his damaged state when he said with a sense of loss that he once knew that ‘I am I’, meaning that he had once had a sense of identity and self. This enabled a transitory contact with the experience of loss which could not, however, be maintained. The perverse quality again arose from his awareness of this loss and his simultaneous denial of it as he resolved to solve his problems by omnipotence.", "tp": false}, {"pos": 434, "role": "impasse", "loc": "patient", "int": 0.4, "aff": "stuck, fearful", "txt": "In this way he remains stuck in the organization even though the conditions which led to his original dependence on it no longer exist and from other points of view he no longer seems to need it. The patient appears to be unable or unwilling to acknowledge that his circumstances have changed. Sometimes he is afraid to admit his improvement, since to do so is to stand up against an internal voice which tells him that the need for the organization still exists. This failure to admit improvement may appear as a kind of addiction to illness and to a dependence on the organization, and it is here that perverse elements become manifest and are revealed as binding the victim to the oppressor in ways which become very difficult to justify on grounds of need.", "tp": false}, {"pos": 442, "role": "other", "loc": "none", "int": 0.1, "aff": "theoretical", "txt": "These objects are often chosen because they are suitable for the containment of particular parts of the self. In this way dependent elements in the self tend to be projected into one group of objects and destructive parts of the self are projected into other figures which may themselves be chosen for their power, cruelty, or ruthlessness. The dependent elements are then trapped in a sado-masochistic relationship with the powerful, aggressive elements and the patient may locate himself in one or other group or alternately may feel himself to be a helpless observer rather than a participant. At the same time he cannot free himself because to leave would be to abandon elements of himself which he has projected.", "tp": false}]}, {"pt": "John", "doc": "H. Rosenfeld - Impasse and Interpretation_ The", "au": "Rosenfeld", "grp": "kleinian", "n": 8, "out": "impasse", "tp": 392, "felt": "A suicidal patient's projective appeal for help was not metabolized by the therapist, who instead became identified with the cold super-ego; the patient withdrew and the clinician was left holding unbearable guilt.", "shifted": "Only retrospectively did understanding emerge—that earlier counter-transferential linking of the projection could have transformed harshness into contact—but no shift occurred within the treatment itself.", "inwhom": "clinician (retrospectively, via supervisory reflection); the patient remained unreached", "turn": true, "meet": false, "mint": 0.62, "u": [{"pos": 761, "role": "enactment", "loc": "clinician", "int": 0.6, "aff": "anxious", "txt": "The therapist ’s inability to experience the projection and his not responding to it would be experienced by John as harshness, punishment, and abandonment by the therapist, who thus becomes identified with John ’s cold super-ego, which would not only fail to help John but make him feel worse. In fact, John did not come for therapy any more. At this moment the therapist became exceedingly anxious and depressed. He had vivid phantasies of John having committed suicide; he reproached himself for having neglected John and having failed him and he also felt deeply that he had let down the other doctors who worked with him, which increased his sense of failure.", "tp": false}, {"pos": 763, "role": "strain", "loc": "clinician", "int": 0.8, "aff": "guilt, responsibility", "txt": "rejected and misunderstood. On examining Dr B/s mental state after John did not appear any more, one is impressed by the therapist ’s intense feeling of guilt and responsibility for John ’s life, believing that he had caused his patient ’s death through neglecting him. This feeling was so strong that he could not shake himself out of it. If we examine John’s deep-seated anxiety and guilt we are aware that this state of mind was related to his feelings after the death of his sister, when he felt himself guilty and neglectful.", "tp": false}, {"pos": 764, "role": "enactment", "loc": "dyadic", "int": 0.7, "aff": "projected guilt", "txt": "This was enormously increased by the accusations of his mother, who had accused him of being neglectful and responsible for his sister ’s death. These accusations and guilt feelings John seems to have projected into Dr B. with such intensity that Dr B. ‘s depression after John stopped treatment reflects exactly John ’s own state of mind after his sister ’s death. At the same time there is in John an intense feeling of failure related to his fear of continually failing and never being able to put right what he believed he had done in the past. This sense of failure, and the feeling of being regarded by his mother and others as a failure, is also mirrored clearly in Dr B. ’s feeling of being a failure and of being so guilty and disturbed about what his colleagues might now think about him.", "tp": false}, {"pos": 768, "role": "rupture", "loc": "patient", "int": 0.6, "aff": "desperate appeal", "txt": "participation is generally experienced by the patient and leads to a feeling of being not criticized but accepted. The way John communicated with the therapist, particularly through his suicidal feeling, was an intense appeal for the therapist to realize how disturbing and how unbearable the situation was. He was asking him to feel and sympathize with him about how bad he felt. He hoped that the therapist would not accuse him but gradually help him to feel less guilty.", "tp": false}, {"pos": 770, "role": "impasse", "loc": "patient", "int": 0.4, "aff": "isolated guilt", "txt": "In general this type of patient has a relatively good prognosis, if his appeal for help, through projective identification, can be listened to and responded to emotionally. John did not accept any more treatment after he had been with Dr B. and said that he felt he had to carry his feelings of anxiety and guilt by himself. When the case of the accident later came before the magistrates, John was found guilty of severe neglect and lost his driving licence. He was then very anxious about not being able to carry on with his work and made another attempt at suicide.", "tp": false}, {"pos": 771, "role": "turn", "loc": "clinician", "int": 0.5, "aff": "regretful reflection", "txt": "I don ’t know whether John managed to find his way back to treatment at a later date. If Dr B. could have allowed his counter-transference to link up the projection earlier he could have made much better contact by acknowledging how important it was for John to feel that the analyst was willing to experience deeply his overwhelming feeling of guilt and being a failure and that he felt he could no longer bear this awful feeling on his own. Sidney The second case I want to discuss illustrates problems of projective identification in a schizophrenic patient and how they can be successfully treated. Sidney, who was seen by me from autumn 1967, had been diagnosed several years before as schizophrenic, when he had an acute psychotic breakdown which was characterized by overwhelming panic, confusion, and fears of complete disintegration.", "tp": true}, {"pos": 775, "role": "other", "loc": "patient", "int": 0.7, "aff": "compelled, confused", "txt": "He felt forced, almost against his will, to look at it until late at night. He complained that he was drawn into the hot climate of Mexico, which made him feel that being there would make him well. He was also compelled to look at the athletes, wrestlers, and weightlifters and felt he was, or ought to be, one of them. He asked me questions: ‘Why do I have to be an athlete?", "tp": false}, {"pos": 776, "role": "other", "loc": "patient", "int": 0.7, "aff": "claustrophobic compulsion", "txt": "addiction which he could not stop and which exhausted and drained him. At times he felt so strongly ‘pulled inside the television ’ that he felt claustrophobic and had difficulty in breathing. Afterwards during the night he felt compelled to get up and see whether the taps of the washbasin in his flat were turned off and ensure that the plugs in the basin and bath were not blocking up the drainage. He was terrified that both his bath and basin might overflow, and eventually he confessed that he was afraid of being drowned and suffocated.", "tp": false}]}, {"pt": "Maria", "doc": "H. Rosenfeld - Impasse and Interpretation_ The", "au": "Rosenfeld", "grp": "kleinian", "n": 8, "out": "mutative", "tp": 352, "felt": "A confusional pull drew the analyst into irritation and reassurance that masked his own depression, until the patient's confusion could be held rather than dispelled. Once borne, thinking itself became usable to her.", "shifted": "Confusion stopped being an attack to repel and became a shared object of thought, allowing clearer interpretation and the patient's tentative self-reflection.", "inwhom": "both", "turn": true, "meet": true, "mint": 0.53, "u": [{"pos": 1124, "role": "enactment", "loc": "clinician", "int": 0.5, "aff": "hidden depression", "txt": "I suggest that Maria was afraid that Dr N. was fed up with her and depressed about it. For that reason, reassuring Maria in the present must have increased her fear. Reassurance is generally felt by patients as hidden aggression. In thinking back five years before Dr N. was quite clear that underneath his jocular attitude there had been a feeling of depression, hopelessness, impatience, and anger with his patients which he realized that she had picked up.", "tp": false}, {"pos": 1133, "role": "strain", "loc": "clinician", "int": 0.75, "aff": "irritated, confused", "txt": "for the analyst to understand that he has been taking the patient ’s muddling and confusing talk as an attack on him, which creates a considerable hostile counter-transference and feelings of wanting to get rid of the patient. However, from the material in the last session before the holidays, it is clear that Maria ’s confused and puzzling talk is more a communication to him, in order to get h e l p f r o m h i m , r a t h e r t h a n a n a t t a c k o n h i m . I t i s e s s e n t i a l t o make such an interpretation to a patient like Maria, as this would diminish her terrible sense of guilt. She feared that her analyst was feeling just as depressed and destroyed through her puzzling and confused talk as she felt about her internal mother ’s confused talking to her.", "tp": false}, {"pos": 1155, "role": "impasse", "loc": "patient", "int": 0.55, "aff": "unbearable aloneness", "txt": "This was because when she felt alone she felt so terribly bad. In the seminar I pointed out to Dr N. that I thought it was not only that Maria felt bad when she was alone. She also felt that she was 252 IMPASSE AND INTERPRETATION", "tp": false}, {"pos": 1157, "role": "impasse", "loc": "patient", "int": 0.45, "aff": "confused badness", "txt": "There is also the danger that she can ’t bear to feel good and bad because her good and bad feelings are either split off from one another or have become confused. If she then feels in doubt about what is good or bad she probably will make herself entirely bad. It is easier to be wholly bad than to feel doubt about whether she is good or bad. So when Maria defends herself against confusion there is the danger that she may be feeling all bad again.", "tp": false}, {"pos": 1168, "role": "other", "loc": "patient", "int": 0.55, "aff": "frightened identification", "txt": "She is frightened that the suicide had something to do with a tragic relationship between Uncle George and her mother, with which neither could cope. It sometimes seemed that her mother talked to Maria about this Uncle George and explained that George had been in love with her. At that moment Dr N. said he realized that Maria is also afraid that he will commit suicide, that he is becoming identified with this Uncle George, and this is of course related again to the question of death. He said that he felt that Maria fears that he could commit suicide because he is not sufficiently loved by the patient and that he would become desperate and would not be able to stand the situation.", "tp": false}, {"pos": 1196, "role": "turn", "loc": "patient", "int": 0.4, "aff": "relieved reflection", "txt": "This probably also means that she has become more concerned about what she was thinking, and therefore at the end of the last session she recognized that even thinking about the possibility of needing drugs to cope with her confusion helped her to be less confused. Thus she felt she did not need the drugs. I have for many years recognized that confusional anxiety plays a very central role in many cases of psychosis, also in hypochondriasis. It is interesting in this case that the patient herself realized that the hypochondriasis which had become so predominant in the last few sessions was a defence against her confusional state.", "tp": true}, {"pos": 1199, "role": "meeting", "loc": "clinician", "int": 0.5, "aff": "clarified resolve", "txt": "At the end of the seminar Dr N. said that most of Maria ’s problems now seemed much clearer and he realized that it was essential to repeat clearly to her what he had understood and how important it was to make the correct links in his interpretation. He needed to give her a feeling that he, Dr N., would no longer be overwhelmed by her anxieties and that he really was no longer confused. He could face up to it without being destroyed by the patient ’s problems. This implies that it is essential for the analyst to feel secure enough about his understanding to work out the problems of the patient through the patient-analyst relationship.", "tp": false}, {"pos": 1201, "role": "meeting", "loc": "clinician", "int": 0.55, "aff": "bearing confusion", "txt": "To treat patients such as these successfully it is important to concentrate and to observe the central problem: in Maria ’s case the confusional anxieties, which could be recognized by the analyst ’s confusion. He had to be willing to bear the anxiety of not being clear. The next issue is to recognize how desperately anxious the patient feels about making the analyst confused. This is quite an unbearable problem for the patient because it implies that neither the patient nor the analyst is capable of coping with the uncertainties.", "tp": false}]}, {"pt": "Mr E", "doc": "[The New Library of Psychoanalysis] John Stein", "au": "—", "grp": "other", "n": 8, "out": "mutative", "tp": 627, "felt": "A demand for idealization collides with the analyst's refusal, generating grievance and 'shitty' spiteful thoughts; gradually these can be owned alongside genuine regret rather than splitting into pure badness.", "shifted": "Bad thoughts became bearable as mixed with concern, loosening the grip of the retreat into grievance and allowing rivalry, hurt, and reparative feeling to coexist.", "inwhom": "primarily the patient, with the analyst's noninvitation to idealize as the holding condition", "turn": true, "meet": true, "mint": 0.59, "u": [{"pos": 338, "role": "strain", "loc": "patient", "int": 0.55, "aff": "unforgivable badness", "txt": "The second patient, Mr E, had, in many ways, made good use of his analysis and was successful in his work and increasingly contented in his marriage. In the analysis situations sometimes arose which provoked ‘bad’ thoughts, and in the past these had often made him feel that he was all bad, and that he could not be forgiven. As an infant he had, in fact, been left to cry for long periods when his mother was depressed, and I thought that he must have felt so full of badness and that he had created such worry and despair that he was convinced that his mother and now myself did not want him and would leave him to die. He usually dealt with the panic which resulted from this sort of situation by idealizing his logic and thinking and getting reassurance that he was wanted by having it valued and admired.", "tp": false}, {"pos": 339, "role": "enactment", "loc": "patient", "int": 0.7, "aff": "hatred, neediness", "txt": "If I did not agree to this he felt that I was denying his goodness and sentencing him to feel so bad that he could not believe I could want him at all. When I failed to provide reassurance through admiration it meant that I disliked him, blamed him for my depression and wished him dead. This used to fill him with hatred and led to further ‘bad’ thoughts. If I admired him, however, he felt that he had been able to enlist me to collude with in an organization which helped him to deny his aggression and destructiveness.", "tp": false}, {"pos": 340, "role": "impasse", "loc": "patient", "int": 0.6, "aff": "resentment, grievance", "txt": "Revenge, resentment, remorse and reparation 81 grievance both appeared to be supported by the same organization, and the resentment came to be focused on my refusal to join in the idealization. There was a particular quality to his reaction to some of my failures and shortcomings. I had clearly done something bad which excluded him, and made him feel disliked and unwanted, but there was, in addition, a sense of betrayal which gave a particular edge to his indignation and outrage. I was made to feel that I had done something unpardonable which put me beyond the pale and disqualified me so that I became someone unfit to be a psychoanalyst.", "tp": false}, {"pos": 342, "role": "meeting", "loc": "dyadic", "int": 0.5, "aff": "concerned, attuned", "txt": "One day he began a session saying that he had felt a bit uncomfortable as he entered the building. The waiting room felt somewhat strange and he noticed that I sneezed as I came down to get him. He hoped I was not getting a cold and realized I had been under strain recently. I had in fact taken a week off which he knew was because of a bereavement a couple of weeks previously.", "tp": false}, {"pos": 344, "role": "turn", "loc": "patient", "int": 0.6, "aff": "hurt rivalry", "txt": "Someone else said it was his wish to spoil and make a mess of things. He thought the dream had to do with the congress and he connected it with feelings of rivalry with colleagues. He then remembered his feelings of hurt in the session on Friday when I had interpreted his use of logic as an idealized production which disguised what he really felt. This had reminded him of previous occasions when he had felt extremely persecuted by me.", "tp": false}, {"pos": 346, "role": "rupture", "loc": "patient", "int": 0.6, "aff": "excluded, spiteful", "txt": "Psychic Retreats 82 thought was of anxiety and regret but this was quickly replaced by what he called a ‘shitty’ thought; namely, that the MP’s illness served him right for refusing to help him. I thought he felt bad about his reaction to my recent week off, and not knowing any details made him feel excluded and demanding. The ‘shitty’ thought towards the MP had a parallel with the thought that, because I had excluded him, I deserved all that I got. However, he also saw that I had not quite recovered from my bereavement, and he was sorry and had enough good feeling to recognize the thought as ‘shitty’.", "tp": false}, {"pos": 347, "role": "turn", "loc": "patient", "int": 0.55, "aff": "shame, regret", "txt": "I interpreted that he still felt bad about his ‘shitty’ thought, but not so bad as he previously did because he also felt he had good feelings of regret and sorrow when he gave me a difficult time. This meant that he was not in the same panic as he used to get into, but he was still unsure if he could admit it as a bad thought or if he needed to wrap it up as something good. He still wanted me to reassure him that the hostile thought was not really a bad one because it was so well wrapped up and was anyhow a result of anxiety. This meant that he could not be blamed, and if I did not agree it could easily lead to my becoming the bad figure who hated him unjustly.", "tp": true}, {"pos": 348, "role": "meeting", "loc": "dyadic", "int": 0.6, "aff": "humiliated, rebuffed", "txt": "I connected this with the uncertainty in the dream as to whether the faeces were brought out of anxiety, perhaps as an infantile gift to cure a depressed mother, or out of a wish to spoil. He responded by saying that he also felt rebuffed when he took so much trouble to do something for me which I then failed to appreciate. It seemed clear that when he felt so humiliated he was convinced that he would not be accepted and this led to anxiety even amounting to terror, because to be hated was equated with being cast out and left to die. Now the situation seemed to have changed, and it was no longer so clear that he could not bear these experiences.", "tp": false}]}, {"pt": "Patient C", "doc": "Long et al., 2020. Racial Difference Rupture a", "au": "Long et al.", "grp": "relational", "n": 7, "out": "impasse", "tp": 249, "felt": "A Black patient enters therapy braced against being broken, and the white clinician's well-meaning self-disclosure about her own grades reinstates the very comparative, racialized hierarchy the patient feared, converting help into humiliation. Subsequent naming of others' racism cannot metabolize the enactment already alive between them.", "shifted": "What shifted was the patient's hope: an initial wary opening hardened into disillusionment as the therapy became another site where she felt measured, foreign, and unable to be met.", "inwhom": "primarily the patient; the clinician remains largely unaware of her participation in the enactment", "turn": false, "meet": false, "mint": 0.58, "u": [{"pos": 66, "role": "strain", "loc": "patient", "int": 0.5, "aff": "wary avoidance", "txt": "Regardless I avoided therapy because of it. On the week I decide to go to therapy , finally feeling a bit settled, my performance on the assignment safely tucked away somewhere in my mind where it can’t haunt me, I am happily guided to the therapy room by Donna. She comments on the time that has gone by since we last saw each other . She asks me how I am performing in the course.", "tp": false}, {"pos": 69, "role": "rupture", "loc": "patient", "int": 0.7, "aff": "humiliation, fear", "txt": "I tell her why I have been avoiding therapy . I share with her a fear that she might break me. She then asks me about my marks and I share them with her . As I sit in the room feeling humiliated, she then shares a bit of her personal history with me.", "tp": false}, {"pos": 70, "role": "enactment", "loc": "clinician", "int": 0.7, "aff": "envious, unworthy", "txt": "She speaks of a time when she passed with 70s, and she felt really good about that; she also speaks of a time when she passed with 50s and still felt good enough: What is it about me that has prevented me from feeling good enough and what would it take for me to feel that way? The thought in my mind was that of course she would feel good enough. Her existence makes her good enough, whereas I have to prove that I am good enough. However , I don’t share this with her; instead I hypothesize that it was probably some failure in my mother to contain me.", "tp": true}, {"pos": 72, "role": "strain", "loc": "dyadic", "int": 0.65, "aff": "cautious disclosure", "txt": "Feeling like this is what she wants to hear , what she wants to drag out into the open, I share them. I share them with the awareness that in a context like South Africa, conversations about race between people of diff erent races often lead to distance, and this is a potential consequence of sharing. However , when Donna responds, she does not distance me. She suggests an idea to explain why I tend to embrace the negative and ignore those aspects of myself that are good enough.", "tp": false}, {"pos": 73, "role": "impasse", "loc": "clinician", "int": 0.6, "aff": "acknowledging racism", "txt": "Those women were being racist. She is willing to point out their unconscious racism, how they made a young girl feel inadequate on the basis of her skin color . She even asks if I think she attributes my failures to being Black. She can put herself in the position of being a perpetrator and is willing to really explore this.", "tp": false}, {"pos": 81, "role": "other", "loc": "none", "int": 0.2, "aff": "theoretical", "txt": "Patient C’ s fear that her therapist would break her is not simply a transferential phantasy but references a shared racialized experience of very real dynamics of domination and submission that, according to Fanon ( 1952 ), become internalized into a racialized psyche. Her fear is also firmly located in the historical trauma of being Black in South Africa. All three patients raise the silencing, as well as the shame, that this process evokes. It is possible that therapists are more easily aware of the responsibility they shoulder in opening up processes of exploration, as well as their own shame (see Altman, 2000 ; Gump, 2000 ; Swartz, 2012 ), but far less aware of the sense of responsibility shouldered by patients, and the sense of danger that accompanies this.", "tp": false}, {"pos": 97, "role": "impasse", "loc": "patient", "int": 0.7, "aff": "disillusioned anger", "txt": "of finally having gained access to something precious; a hope that therapy would offer a space for her to teach her therapist; a disillusioning feeling of therapy as foreign; the disappointment and confusion of both wanting to become a therapist and feeling that therapy is not fitting; and an intense anger toward the therapist whose profession she wants to join. The fact of being a trainee offers a level of ambivalence to the therapy experience in which awareness of one’ s own student professional status cannot easily be unraveled from the therapeutic process. This off ers particular implications for the transference relationship, as Patient C powerfully reflects. The therapist also occupies a position of authority to which the patient aspires but cannot access.", "tp": false}]}, {"pt": "M", "doc": "Harris. 1997. Aggression, envy and ambition.pd", "au": "Harris", "grp": "other", "n": 6, "out": "ongoing", "tp": 217, "felt": "A patient bound to scarcity and dread of her own power meets a clinician quietly entangled in parallel anxieties about ambition; recognition of competitive and envious currents begins to surface but remains hemmed in.", "shifted": "Shame-laden acknowledgment of competition and envy became speakable, loosening their purely persecutory grip without dissolving the inhibition.", "inwhom": "primarily the patient, with reciprocal self-recognition in the clinician", "turn": true, "meet": false, "mint": 0.59, "u": [{"pos": 5, "role": "strain", "loc": "patient", "int": 0.75, "aff": "fierce dread", "txt": "She worked very hard but was always enslaved to time and debt. Open spaces and time brought fierce anxieties. Signs of ease or luxury or power led almost immediately to intense fears of damage and danger , imagined dangers sometimes to her self, sometimes to her children, but always lethal. From childhood on, she had lived unusually dislocated from a sense of agency.", "tp": false}, {"pos": 11, "role": "enactment", "loc": "clinician", "int": 0.6, "aff": "transferential worry", "txt": "her way to work, I am already in session at my workplace) are a matter of considerable transferential worry to this patient. What will I feel or worse what will I do if she seems to be living more pleasurably or more powerfully than her early rising analyst? So the themes and issues in this paper are my story too; that is, the psychic price that gender inscription attaches to ambition and strivings and achievement. Listening to my patient explore her memories of her father's worklife, its long exhausting days, and bewildering periods of disorganized and fruitless paperwork, I began to think about my own workday, realizing how closely it paralleled the working daily rhythm undertaken by my much loved nanny.", "tp": false}, {"pos": 13, "role": "enactment", "loc": "clinician", "int": 0.7, "aff": "anxious ambition", "txt": "Hadn't my anxiety about the lecture and a public display of ambition gone into an all too familiar counterphobic feat and the setup of a potential compromise? M is gingerly and tentatively undertaking to build a house in the country, an enterprise she undertakes with her customary financial and logistic pains and care. She describes a scene in which she walks toward the frame of the house newly rising from its foundation and thinks to herself, “It's too big, I don't deserve this.” She knows a great deal about guilt over pleasure and achievement, but we are both still startled when I ask her what image she has when she falls prey to that nagging worry, and she tells me she flashes on a scene from childhood, an image of her mother fallen down in her house as she and her brother try to help but cannot. 293 Martin Amis wrote a rather snotty article in The New Yorker on tennis at Wimbledon, trying to describe the women's competitive scene. The essential difference is the nature of the desire.", "tp": false}, {"pos": 33, "role": "turn", "loc": "patient", "int": 0.65, "aff": "shame, vengeful pleasure", "txt": "But gingerly, my patient comes to acknowledge, with much shame, her own brand of competition. On the surface she lives calculatingly in line with her lover , not too far ahead, not too far behind. But she can easily feel vengeful and furious. And worst of all, she is chagrined to notice a little jolt of pleasure if the lover's worklife suffers a setback.", "tp": true}, {"pos": 36, "role": "other", "loc": "none", "int": 0.3, "aff": "shamed envy", "txt": "Envying and being envied is knotted through many women's struggles and experience with ambition and achievement with an ever-present potential to spoil and unsettle. But this insight, too, gives way to other possibilities. Certainly many women feel intense shame when they are aware of their envy. Being 298 envious can feel like a narcissistic injury, pointing as it does to absences and limits in the self in comparison to the envied other .", "tp": false}, {"pos": 89, "role": "impasse", "loc": "patient", "int": 0.55, "aff": "blocked, envious", "txt": "My patient has dreams in which male coworkers park and unpark cars, skillfully maneuvering equipment while she is somewhere blocked and hemmed in. Determined to work in a male sphere, confident in many other ways of her place in a social and interpersonal world, she is still caught up in the anxieties of what men have “naturally,” and imagines phallic power as a male possession, magical and material. Too easily she can feel herself to be a fraudulent interloper , whose masquerade as “butch” cannot cover the fatal difference she fears is determined by the difference located in the body. This is an interesting idea.", "tp": false}]}, {"pt": "Michael", "doc": "H. Rosenfeld - Impasse and Interpretation_ The", "au": "Rosenfeld", "grp": "kleinian", "n": 6, "out": "mutative", "tp": 432, "felt": "A moment of admiring, trusting contact with the analyst's truthfulness silently provoked unbearable envy, which erupted as a negative therapeutic reaction and drinking bout before being recognized and partially metabolized.", "shifted": "The silent envious response to being helped became nameable, so that despair over having 'spoilt everything' could coexist with a preserved good internal figure from the dream.", "inwhom": "primarily the patient, with the analyst's recognition enabling it", "turn": true, "meet": true, "mint": 0.57, "u": [{"pos": 417, "role": "meeting", "loc": "patient", "int": 0.8, "aff": "shamed admiration", "txt": "He greatly admired her attitude and the atmosphere which surrounded this woman in the dream. He felt that she was warm and understanding and talked in a very straight and clear way. She said to him in the dream, ‘You are the most selfcentred, narcissistic person I have ever met in my life. ’ In the dream Michael felt that this woman was completely right and he reacted inside himself with such severe pain that he felt it was almost unbearable. But he had no wish to excuse himself or defend himself because he felt that the atmosphere which the woman had created was so understanding.", "tp": false}, {"pos": 418, "role": "meeting", "loc": "patient", "int": 0.45, "aff": "trusting, exposed", "txt": "He also felt that she was completely devoted to the truth and had transmitted this to him. He felt she cared for him only as a patient and felt she had to be firm in order to help him to get better. He emphasized several times that he had never had such an experience before in his life. He had sometimes agreed with his previous therapist, with me, and his wife that he was terribly selfish and preoccupied with himself but he had never been able to respond to any interpretation, any truth, so strongly.", "tp": false}, {"pos": 420, "role": "other", "loc": "none", "int": 0.2, "aff": "reflective", "txt": "And what was the relationship of the dream to the negative therapeutic reaction, creating this sudden bout and compulsion to drink? It seemed clear both in the dream and in Michael ’s association that what had impressed him most was not the interpretation, which was in any case simply a confrontation, but the therapeutic atmosphere. This related to Michael ’s need to become more aware of the feminine part of his personality, which he realized could help him to become less narcissistic. I felt that the dream therapist succeeded in conveying his problem to him without appearing superior and narcissistic, and this was what Michael felt he needed.", "tp": false}, {"pos": 422, "role": "enactment", "loc": "dyadic", "int": 0.6, "aff": "touched, envious", "txt": "I gathered that, simultaneously with his progress in analysis and the breaking through of strongly affectionate, admiring feelings, he must have been overwhelmed by an intensely envious response which, as so often, had been silent. I did not interpret a great deal of the dream but I conveyed to Michael that he felt he was responding to the therapy with me and felt deeply touched. He could express this in the dream. I also noted that there were feelings which came up at the same time which had attacked this good experience.", "tp": false}, {"pos": 423, "role": "rupture", "loc": "patient", "int": 0.8, "aff": "envy, fear", "txt": "In the next session Michael told me that soon after the last session he was suddenly overcome by such an intense feeling of envy of me and my helpful attitude to him during the sessions that it frightened him. He wanted to be like me and to be capable of treating his own clients in the way I was treating him. He felt it was almost unbearable to think that he had to wait so long and needed more treatment. He was afraid that he could never become like me and the woman in the dream.", "tp": false}, {"pos": 425, "role": "turn", "loc": "patient", "int": 0.55, "aff": "despair, hope", "txt": "The interesting point with him was that the overwhelming negative therapeutic reaction, leading to the drinking bout, did not last very long. In spite of Michael ’s feeling of despair and fear of having spoilt everything the dream emphasized not the negative reaction but the positive progress which he felt he had made. This is a very important aspect of the negative therapeutic reaction to consider. 9 After the dream, Michael ’s wish to be instantly like me became a major issue in the analysis. It was, of course, a wish for a narcissistic identification, and one could see that there would now be many problems about Michael feeling he was advanced and had reached an ideal state.", "tp": true}]}, {"pt": "Mrs P.", "doc": "[Routledge Mental Health Classic Editions] Pat", "au": "—", "grp": "other", "n": 6, "out": "mutative", "tp": 541, "felt": "A pull toward a totalizing, deep interpretation is checked by listening from the patient's position, opening space for a bridging comment that meets her urgency without foreclosing it.", "shifted": "From premature deep interpretation toward a tentative, surface-near bridge attuned to the patient's most urgent anxiety.", "inwhom": "clinician", "turn": true, "meet": true, "mint": 0.27, "u": [{"pos": 210, "role": "strain", "loc": "dyadic", "int": 0.4, "aff": "irritation, pressure", "txt": "38 On Learning from the Patient We might also pick up a sense of the patient being bombarded by such an all-embracing interpretation. The patient could either be impressed by the skill of the therapist, in being able to /g191 t everything together like this (if it did /g191 t), or she could feel irritated by the basic assumption that everything is being related to the therapist as if it were bound to be so. This style of interpretation is unlikely to enhance the therapeutic process. It leaves no room for the patient to offer leads of her own, towards distinguishing which part of what she has communicated is most urgent to her at this point in the session.", "tp": false}, {"pos": 215, "role": "other", "loc": "none", "int": 0.2, "aff": "interpretive reasoning", "txt": "The deepest anxiety Another possible interpretation, aimed at the patient’s deepest anxiety in this sequence, could be to pick out the unconscious implications of the dream. (We need to know that Mrs J. had repeatedly been angry with the hospital and the doctors, that they had not done more to save her husband’s life.) It is possible to see a reference in the dream to some lifesaving action that is withheld. We could wonder about Mrs J.’s earlier signs of projected guilt, in blaming others. (The therapist had previously heard her pleading that she had not realized that a mild heart attack could be so quickly and fatally repeated. She had thought that her husband had recovered more than he had. She had been relieved when they had been able to resume a normal life, after he had recovered from his /g191 rst heart attack.) We could wonder about Mrs J.’s unconscious guilt, and her possible collusion with her husband’s resumed level of normal activity.", "tp": false}, {"pos": 217, "role": "impasse", "loc": "none", "int": 0.1, "aff": "didactic", "txt": "40 On Learning from the Patient the dream, there is a person that you recognize as drowning but you wake up to reality before you have acted upon this.’ Here there is a technical problem. If a therapist prematurely interprets some assumed unconscious guilt, he can be experienced by the patient as suggesting that she should feel guilty. If he claims to see evidence of unconscious guilt, or the assumed cause of such guilt, before the patient begins to be aware of this, that assumption of the therapist can no longer be regarded merely as the patient’s projection or transference. By using trial identi/g191 cation, we can assess more sensitively whether this patient is actually indicating a readiness for an exploration of possible unconscious guilt; or might this focus for interpretation merely induce guilt without leaving time, in this session or even in the remaining therapy, for it to be worked through?", "tp": false}, {"pos": 218, "role": "turn", "loc": "none", "int": 0.15, "aff": "technical caution", "txt": "Our listening to that possible intervention, from the position of the patient, might prompt us to remain cautious and not yet to offer any interpretation aimed at her supposed unconscious guilt. Finding a bridge to an interpretation It is important that therapists should /g191 nd ways to interpret to patients, which do not interfere with the drift of their own emerging thoughts. It is also important that they do not pre-empt a patient’s experience, by interrupting what he or she is beginning to feel, or by anticipating what is not yet being felt by the patient. It will often be the case, therefore, that therapists do not have suf/g191 cient evidence for any interpretation as such.", "tp": true}, {"pos": 222, "role": "enactment", "loc": "clinician", "int": 0.3, "aff": "tentative neutrality", "txt": "We could therefore show that we are aware of this by saying something like: ‘Running through what you have told me, I notice that there are several references to things left un/g191 nished; and there is also a sense of urgency in the dream about a person who might be drowning.’ From a neutral playback such as this, the patient could lead on to the issue of whether or not to end her therapy; or she could surprise us by leading straight into the anniversary mourning. This may, or may not, subsequently come to be linked to the proposed ending of her therapy. If it is not, we might again feel it to be important that we offer a way of leaving the patient to /g191 nd this for herself, preferably without her being directed to it. A further bridge comment, which might serve that purpose, could be: ‘One question, that you may be asking yourself in your dream, is whether all endings have to be unstoppable and /g191 nal.", "tp": false}, {"pos": 223, "role": "meeting", "loc": "patient", "int": 0.5, "aff": "urgent dread", "txt": "There is a fast-/g192 owing river which cannot be stopped, but it may be possible to rescue the girl from drowning.’ The most urgent anxiety One way of focusing an interpretation here would be around the sense of urgency, which is clearly indicated in the dream. Some action is called for, to save someone from drowning. The most immediate context for this dream is likely to be the fact that the time for therapy is running out. If we feel that the patient is needing to recognize the selfdestructiveness in her premature ending of therapy, and there is not much time left to deal with this, we might say to the patient: ‘I think you are anxious about the approaching end of your therapy.", "tp": false}]}]</script>
<script>
const DATA=JSON.parse(document.getElementById('data').textContent), $=s=>document.querySelector(s);
[...new Set(DATA.map(d=>d.au))].sort().forEach(a=>{const o=document.createElement('option');o.value=o.textContent=a;$('#au').appendChild(o)});
$('#au').insertAdjacentHTML('afterbegin','<option value="">all authors</option>');$('#au').value='';
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
const OUTORD={mutative:0,ongoing:1,impasse:2,'?':3};
function render(){
 const q=$('#q').value.toLowerCase(),out=$('#out').value,grp=$('#grp').value,au=$('#au').value,ft=$('#ft').checked,fm=$('#fm').checked,sort=$('#sort').value;
 let r=DATA.filter(d=>(!out||d.out===out)&&(!grp||d.grp===grp)&&(!au||d.au===au)&&(!ft||d.turn)&&(!fm||d.meet)
   &&(!q||[d.pt,d.au,d.felt,d.shifted].some(x=>(''+(x||'')).toLowerCase().includes(q))||d.u.some(u=>u.txt.toLowerCase().includes(q))));
 r.sort((a,b)=> sort==='out'? (OUTORD[a.out]-OUTORD[b.out])||(b.n-a.n) : sort==='au'? a.au.localeCompare(b.au) : (b[sort]-a[sort]));
 $('#cnt').textContent=r.length+' of '+DATA.length+' arcs';
 $('#wrap').innerHTML=r.map((d,i)=>{
  const tl=d.u.map(u=>{
   const w=Math.round(u.int*100);
   return '<div class="row'+(u.tp?' tp':'')+'"><div class="pos">p'+u.pos+'</div>'+
    '<div class="rl r-'+u.role+'">'+u.role+'</div><div class="loc '+u.loc+'">'+u.loc+'</div>'+
    '<div><div class="bar" style="width:'+Math.max(6,w)+'%"></div></div>'+
    '<div><span class="aff">'+esc(u.aff)+'</span> <span class="txt">'+esc(u.txt.slice(0,240))+(u.txt.length>240?'…':'')+'</span>'+(u.tp?' <span class="tpflag">&#9664; TURN</span>':'')+'</div></div>';
  }).join('');
  return '<div class="arc"><div class="ahead" data-i="'+i+'">'+
   '<span class="chip out-'+d.out+'">'+d.out+'</span> <span class="meta"><b>'+esc(d.pt)+'</b> &middot; '+esc(d.au)+
   ' <span class="gpill">'+d.grp+'</span> &middot; '+d.n+' units &middot; turn@'+(d.tp??'—')+
   ' &middot; '+(d.meet?'meeting&#10003;':'no meeting')+' &middot; int '+d.mint.toFixed(2)+'</span>'+
   '<div class="felt">'+esc(d.felt)+'</div></div>'+
   '<div class="tl"><div class="shifted">shifted: '+esc(d.shifted)+' &nbsp;(in '+esc(d.inwhom)+')</div>'+tl+'</div></div>';
 }).join('') || '<p style="color:#888">no arcs match.</p>';
 document.querySelectorAll('.ahead').forEach(h=>h.addEventListener('click',()=>{const t=h.nextElementSibling;t.style.display=t.style.display==='block'?'none':'block';}));
}
['q','out','grp','au','ft','fm','sort'].forEach(id=>{const e=document.getElementById(id);e.addEventListener(e.tagName==='SELECT'||e.type==='checkbox'?'change':'input',render)});
render();
</script></body></html>
