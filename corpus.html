<script>

let sk='units', sd=-1; const NUM={units:1,hits:1,hitpct:1,mint:1,cases:1,arcs:1};
function fill(sel,key){[...new Set(DATA.map(d=>d[key]).filter(Boolean))].sort().forEach(v=>{const o=document.createElement('option');o.value=o.textContent=v;$(sel).appendChild(o)})}
fill('#trad','trad'); fill('#au','au');
function esc(s){return (''+(s||'')).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(){
 const q=$('#q').value.toLowerCase(),ft=$('#trad').value,fs=$('#src').value,fa=$('#au').value;

 $('#cnt').textContent=r.length+' of '+DATA.length+' docs · '+r.reduce((s,d)=>s+d.units,0)+' units';
 $('#tb').innerHTML=r.slice(0,1500).map(d=>{
  const arcs=d.arcs?(d.arcs+(d.mut||d.imp?' <span style="color:#059669">'+d.mut+'↑</span>/<span style="color:#dc2626">'+d.imp+'↓</span>':'')):'';
  return '<tr><td class="title">'+esc(d.title)+'</td><td class="au">'+esc(d.au)+'</td><td>'+esc(d.trad)+

}
document.querySelectorAll('th').forEach(th=>th.addEventListener('click',()=>{const k=th.dataset.k;sd=(sk===k)?-sd:(NUM[k]?-1:1);sk=k;render()}));

render();
</script></body></html>
